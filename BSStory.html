            { // Page 29: Tapestry Treasure
                text: `
                    <p>Charla looked over Elva. "Mind if I adjust your outfit a bit? No reason to be uncomfy, right?" Elva nodded, and Charla adjusted her uniform and the leg guards of the pull-up secretively, like a cheeky friend in a locker room. "There we go, perfect shape. Now we don't have to worry about those stupid distraction traps." She patted Elva on the bottom. "If you want, you can rest on my shoulder. I'll keep you safe!"</p>
                    <p>"Y-yeah, I'll sit on your shoulder," Elva said, flying up.</p>
                    <p>"Should we double back and check the other paths or continue on this way?" Karoline asked.</p>
                    <p>"Well, did we give this room a full over?" Charla asked, looking for another brazier. She dropped her torch and had to retrieve it, seeing nothing.</p>
                    <p>Alunra looked over. "We should give it a good look over before we try another path."</p>
                    <p>Karoline was too busy admiring her photography to help search. "Can someone give me a hand looking for the torch?" Charla asked.</p>
                    <p>Elva helped her. As Charla found her torch, she swept it in a wide arc, illuminating the room and showing off the last, unmarked image on the ceiling. It hung in an odd way, as though something were weighing it down in the center.</p>
                    <p>"Do you think we should cut it at the center?" Elva asked.</p>
                    <p>"Why don't you just fly up and unpin it?" Charla replied, clearly not wanting the object damaged. "Or cut it at the edge?"</p>
                    <p>"It does look like it might come down somehow," Karoline commented, taking another photo. "You can fly, maybe take a closer look... after the rest of us step away first."</p>
                    <p>"I mean, yeah, but it's just a random tapestry," Elva grumbled.</p>
                    <p>"The spirits that may be here may not like that," Alunra said. "Also, it seems to depict a moment in history... I think it's something those that study that thing should have a chance to see. I think it may be a history of the grove."</p>
                    <p>"Fiiiiine," Elva sighed. She floated up, careful not to show her pull-up, and started to unpin the tapestry.</p>
                    <p>The weight of the tapestry took Elva with it, allowing her to swing on it like a little rope. The motion bundled up the contents. "Yo, somebody catch the shit!" she yelled, letting the items go bit by bit.</p>
                    <p>Charla floundered, but Karoline managed to catch the falling items, and Alunra came over to help support the load. They were colorless, beautiful gems. "Yeah, I bet you could sell them," Elva commented.</p>
                    <p>Alunra nodded and smiled. "When we get back, we can deal with them."</p>
                    <p>"Well, there's another passageway here. Shall we continue on then?" Karoline suggested. "Thus far, this hasn't been particularly perilous."</p>
                    <p>"Yeah, let's go," Elva agreed.</p>
                    <p>Alunra nodded. "You two are in the lead, so we'll be behind you."</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/tapestrytreasure-1.webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/tapestrytreasure-2.webp"
                ]
            },
            { // Page 30: Traps Part 2 (Lasers)
                text: `
                    <p>"Oh, shiiiiiiiiiiit," Charla said, pointing out a myriad of traps. "There is a spear trap ahead, and a laser grid for an unknown trap."</p>
                    <p>"While you two deal with the traps, me and Alunra should stay back," Karoline said, pulling the firbolg back into the previous hallway.</p>
                    <p>"Would you want me to... umm... try again?" Elva asked.</p>
                    <p>"Go ahead," Charla said. "I will stay with you. If you fail, I will try to throw you away from the trap, okay, Elva?"</p>
                    <p>Elva floated to the pressure plate. "That should be it?" she said after a moment.</p>
                    <p>"I hope so..." Charla said, easily leaping over the spikes. Elva floated over with her.</p>
                    <p>"So, do you want me to try to deal with this?" Elva asked, looking at the complex laser grid.</p>
                    <p>"You got this one?" Charla asked.</p>
                    <p>"I can try."</p>
                    <p>With fairydust and precision, Elva managed the feat of deactivating the entire trap apparatus. The door that would have slammed shut instead locked open, and a door somewhere in the distance also opened.</p>
                    <p>"Is everything good?" Alunra called out, worry in her voice.</p>
                    <p>Elva let out a sigh and collapsed back, the pressure finally getting to her.</p>
                    <p>"Hey Madam Alunra, can you and your friend pass me over the pit now?" Karoline asked, practically jumping into Alunra's arms.</p>
                    <p>Alunra nodded, jumped the pit, and then Echo handed Karoline over to her on the other side. "Thank you, milady," Karoline said, giving both Alunra and Echo a kiss on the cheek. Elva floated back onto Charla's shoulder. "Let's continue."</p>
                    <p>Alunra resummoned Echo in front of Karoline, who retook her position between the two firbolgs.</p>
                    <p>The glimmering gold dust on the walls reflected the light of the deactivated lasers, illuminating another corridor and an unfettered doorway ahead.</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/elvalaser.webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/elvalaser1.webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/elvalaser2.webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/elvalaser3.webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/elvalaser4.webp"
                ]
            },
            { // Page 31: Boxly's Chamber
                text: `
                    <p>"Fly back into the room to safety if anything happens, okay?" Charla told Elva. "I can handle myself..." She stepped forward as quietly and softly as she could.</p>
                    <p>"Are you sure you don't want me to go with?" Elva whispered.</p>
                    <p>"Don't worry, I got this. I'm VERY fast," Charla insisted, zipping silently over to the door at the far end, leaping lightly over debris.</p>
                    <p>"I'm kinda entirely trained for what you're doing right now, though," Elva whispered again, but Charla was already gone.</p>
                    <p>Karoline, seeing Charla head off, pulled out a thin copper wire and cast Message. "Just keeping a line of communication open," she whispered, booping Alunra. "I'll relay any messages."</p>
                    <p>Alunra let out a little squeak. "Thank you," she nodded, looking down the hallway with worry.</p>
                    <p>Elva floated back to the other two.</p>
                    <p>At the doorway to a small chamber, Charla peeked in. The room was empty save for a stone strongbox, about a foot cubed, ribbed with golden-plated ceramic and steel. Grinding marks on the floor indicated someone had tried to move it and failed. Charla stepped into the room and lobbed her torch at a censer on the far wall. It landed perfectly, igniting ancient magical embers.</p>
                    <p>"Should we come up to join you now?" Karoline's voice whispered in her ear.</p>
                    <p>Forgetting the spell, Charla squeaked and wet herself mildly. "Yes," she huffed, "but please be careful on the spikes."</p>
                    <p>Karoline relayed the message, and the group carefully made their way to the chamber. The room was dazzling and hollow, the golden flecks sparkling in the torchlight, but the black stone seemed to absorb the light.</p>
                    <p>"You take a look at this yet, boss-lady?" Karoline asked, greed dripping from her voice.</p>
                    <p>"I dunno," Charla shrugged. "When I saw that someone gave up on trying to move it, I figured it was beyond my ken."</p>
                    <p>The massive strongbox was clearly locked, with a series of keyhole mechanisms.</p>
                    <p>"I could give it a crack," Elva offered.</p>
                    <p>"Okay, you do your thing, but give us a moment to clear out in case it spits more gas at us," Karoline said, winking as more magic flowed into Elva. "Not that I'm worried. You got this, my girl." She guided Alunra and Echo back into the hallway.</p>
                    <p>"Elva, I will wait at the door for you," Charla said. "If I can, I'll grab and stow you in my bag to keep you safe."</p>
                    <p>"Welp, here goes nothing."</p>
                    <p>With Elva's skilled touch, the primary and secondary mechanisms of the lock reacted, sliding away with smooth, velveteen clicks. The lid came open of its own accord, flipping slowly into a fully opened position.</p>
                    <p>"You good?" Karoline's voice came from the hall. "Did the box open?"</p>
                    <p>Elva backed away a bit. "It's open, alright."</p>
                    <p>"Box is open, let's go check it out!" Karoline announced, returning to the room. "Hope it's got treasure."</p>
                    <p>Inside was a little clockwork fist attached to a gear and armature. Two little glassy apertures sat above it, like a comical gearwork face bearing a fist as a tongue.</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/entreatboxly.webp"
                ]
            },
            { // Page 32: Meeting Boxly
                text: `
                    <p>"W-what the fuck is that?" Elva asked.</p>
                    <p>"...Why is it so cute?" Alunra wiggled from behind Karoline, a goofy grin on her face.</p>
                    <p>"Okay, not what I was expecting," Karoline chuckled. "Can we take it, or was it a derpy little trap?"</p>
                    <p>"Boing!" came a voice from the box. "A-hi! I'm Boxly."</p>
                    <p>"H-hello?!?!" Elva stammered.</p>
                    <p>"Boxly! It even has a cute name! Hello!" Alunra was delighted.</p>
                    <p>"Well hello, Boxly. My name's Karoline." The bard bowed politely. "We're exploring around here. You wouldn't happen to know anything that might aid us, would you? We would be more than willing to compensate you."</p>
                    <p>"What is a compersation? Is that like a conversation? I like to talk with friends, but I'm hungry! Got any treasure?" The box hopped, the slam of heavy stone against the floor making the room shiver.</p>
                    <p>Karoline shrugged. "Well, we do have some treasure, but we'd like to know you're going to be helpful first." She knelt down. "I'd be plenty willing to share treasures if you wanna be friends with us and help us out."</p>
                    <p>Boxly ground across the floor and extended his punching-glove tongue, nuzzling Karoline's shin with gentle bumps.</p>
                    <p>Alunra put her hands over her mouth to keep from squealing at the cuteness.</p>
                    <p>"Okay, that seems pretty friendly, so I'm down," Karoline nodded. "I've got some gold on me, or some gems we found earlier but couldn't identify. Which do you want? I can only offer you my share."</p>
                    <p>"Gold and jewels?! MY FAVORITE! Gimme gimme gimme!" Boxly opened his hand-tongue.</p>
                    <p>"Hey, we need information!" Elva protested.</p>
                    <p>Karoline fed Boxly 100 GP and a quarter of the unidentified gemstones, ignoring Elva. "My treasure, my call," she said with a shrug. "They said they were a friend, and I'm going to trust them on that."</p>
                    <p>Elva's eyes went wide. "How much?!?" Stunned floating in the air.</p>
                    <p>"Whoooooooooa, numnumnumnum," Boxly devoured the treasure. "Oh wow, delicious! Mmmmm, ooooh, mmmm, now I'm feelin' real good! Let's go! I will show you all the cool places!"</p>
                    <p>Boxly tore ass—which for him was a hot five feet per round—towards the door.</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/entreatboxly2.webp"
                ]
            },
            { // Page 33: Boxly Part 2
                text: `
                    <p>"Be sure to warn us about any traps, Boxman," Karoline called out. Elva followed, still stunned.</p>
                    <p>"Um, things might go a little faster if I carry you, Boxly, and you could direct us." Alunra spoke up softly, giving the suggestion.</p>
                    <p>"Traps? You mean the risky-funtime machines? Oh sure!" Boxly agreed.</p>
                    <p>Upon hearing that he might be toted, Boxly approached Alu and tapped her a few times, exploratorily, with his punching glove. "I approve of being toted, I am a magical tote container,"</p>
                    <p>Elva was just still stunned, floating along with the parade of silliness she had found herself made party.</p>
                    <p>Karol took the wire one more time and attempted to cast message towards Boxly. "Hello, new friend," she asked tentatively. The spell only worked on creatures, and she was curious if their new friend qualified. She got nothing back. "Good to know."</p>
                    <p>Alu gave a nod as she squatted down and went to pick up Boxly so that she could carry him while he gave directions, looking pleased to be carrying the construct.</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/totingboxley.webp"
                ]                
            },
            { // Page 34: Toting Boxly
                text: `
                    <p>Tickled by this sight, Charla patted Alu on the butt and complimented, "You are so strong! Boxly is in good hands."</p>
                    <p>Karol moved up to Alu and Boxly. "Hey Boxly, just so we know, is your punching glove like... dangerous... like could we use you to fight monsters in here if we needed too?"</p>
                    <p>"Uhhhhh, I, my mistress, said I gotta be careful 'cuz I can punch someone straight back into diapers!"</p>
                    <p>"No worries there for me, but yeah, if Alu there tells you to knock someone's lights out, okay," Karol said, moving back towards Echo. "I'll stick in the back like before, but you can stay up front with Boxbox."</p>
                    <p>Alu let out a bit of a squeak and blushed as her butt got patted. She smiled to Charla and gave a nod. The comment of punching someone straight back into diapers made her blush a bit more, just 'cause she became a bit more aware of her crinkles.</p>
                    <p>Elva was now just slightly floating behind the party, still a bit surprised at the whole situation.</p>
                    <p>"So we should probably have Charla and Elva continue to lead, and Boxly can just tell us where the cool stuff is," Karol suggested. "Speaking of, what kind of cool stuff are we talking here, Boxly? Considering you think traps are fun, we might not enjoy all of them, but we do both like treasure, so that'd be a good start."</p>
                    <p>Charla retrieved her torch from the brazier and led the group with Boxly and Alu in tow behind. "Please don't hesitate to stop me whenever, Mister Box," Charla informed.</p>
                    <p>"Ooooookay! Didja go into the reception chamber yet? It's the hall to our left up here! I was told not to come out of my room on account of all the noise I make sliding and moving around!" he said this in a single happy monotone, no break in emotion as he related the entirety of that information.</p>
                    <p>Karol looked at the party. "Not yet, what kind of cool stuff's in there, buddy?"</p>
                    <p>Elva floated where she was told, just trying to wrap her head around the situation.</p>
                    <p>"There is a... reception chamber?" Alunra looked down curiously at Boxly. "I don't think we did."</p>
                    <p>"There's no treasure vault or weapon depositories, are there? Perhaps a library?" Karol asked Boxly.</p>
                    <p>"Ooooooh, yeah, the treasures? There's lots of those in Mistress' Sarcophagus Chamber! Buuuut, the reception area is where you go to turn on the Pyramid! It's super dark in here, and my eyes were only designed with low-light vision in mind, not complete darkness!"</p>
                    <p>"There... are lights we can turn on? Sarcophagus? Is this a tomb?" she raised an eyebrow.</p>
                    <p>"Light sounds good, right?" Karol asked the party. "Would kind of ruin stealth, but it would also make it harder to be snuck up on."</p>
                    <p>"Oh yeah, let's do that!" Elva exclaimed.</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/totingboxley2.webp"
                ]
            },
            { // Page 35: Reception & Warforged
                text: `
                    <p>Charla patted Alu on the bottom encouragingly and said, "You can lead the way, since you're the one holding Boxly and all...." she softly chuckled, an uneasy sort.</p>
                    <p>Alu let out a squeak and blushed as her bottom was patted, but she looked back to Charla with a small nod. She then started leading the party, holding Boxly in front of her to help her navigate. "I'll do my best leading the way," she would try to keep an eye out as they went along.</p>
                    <p>Elva floated back onto Charla's shoulder.</p>
                    <p>Karol moved a bit away from Alu to maintain some spacing. "I'll watch our 6 then, Boxly, you better protect my friend there, though, won't you?"</p>
                    <p>"Ahhhh, here we are! The Reception! Now then, uhhh, we need some light! You should find the dais of reception and place me back on there!" Boxly said in highly rambunctious anticipation of serving his duties and functions.</p>
                    <p>The western door led back, clearly, to the area that had been trapped, near to the entrance. There was a southward corridor, leading further into the expanse of sparkle-encrusted blackstone.</p>
                    <p>The dais sat against the center of the eastern wall, a raised black and white marble column, perfectly shaped for Sir Boxly. Standing on either side, Alunra could plainly see two cobwebbed, dusty, and ancient warforged. Both were highly feminine in appearance, sporting long and flowing hair, one green and one purple. The silver and gold gynoids did not move as Alunra approached the aperture of the room, remaining at a dead standstill as she entered.</p>
                    <p>"I trust Sir Boxly intrinsically, mostly because life is far more interesting with the spice of friendly helpful automaton," Karoline began from around the corner. "That said, Boxly, will those warforged attack us if they were to be turned on? Also, will turning on the lights turn them on?"</p>
                    <p>Alunra looked around the Reception room, noting the way back towards the entrance to the west and a path south. Her head turned East, spotting the dais Boxly had mentioned. She started to walk towards it, looking at the two warforged. She glanced at Karoline, waiting for an answer before placing Boxly on the dais.</p>
                    <p>As soon as Alunra approached the dais and made any move to place Boxly on it, the question was answered by the green-haired warforged, who drew her Sentinel Spear. "DO NOT PLACE THE FOUL BOXED ONE ONTO THE PLATFORM! GREAT DOOM WILL BEFALL US!" she snarled. At this, the pink-haired warforged also sprang to life, her golden armor creaking as she leveled an axe at her sister. "Dare not relinquish yon... uhhh... dammit... Dare not plant yon cuboid monster upon the platform, or woe betide you!"</p>
                    <p>Alunra's insight suggested their act was either untruthful or not well-rehearsed, likely a blend of both. Perhaps Boxly knew more.</p>
                    <p>Karoline readied herself at the end of the hallway, anticipating a fight but not jumping into one haphazardly.</p>
                    <p>"Uh... Boxly, what are they talking about?" Alunra asked, looking curiously at the box in her hands, tilting her head. "Like... not sure they know, or at least don't think they really know what they are supposed to say to someone? Maybe they don't know what happens?"</p>
                    <p>"Boxly, if they are bad guys, I give you permission to punch them," Karoline assured, still in her pseudo-safe position.</p>
                    <p>"Oh, this is Maria and Nellie, they're the receptionists of the tomb complex. Their engrammatic consciousness was copied and put into the warforged so they could help to protect the tomb forever and ever and ever and ever and ever...." Boxly continued as the purple-haired robot grew increasingly agitated. "I am done with this! I am going to put down the box! Intruder, place down the box that I may put it down!" She raised her axe in a fury.</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/warforgedgals.webp"
                ]
            },
            { // Page 36: The Boxly Debate
                text: `
                    <p>Karoline heard the threat leveled at her new friend bot and entered the room. "Hey now, no need for that," she assured the warforged. "How about you just tell us why you don't want him on the dais and we can talk this out."</p>
                    <p>Elva chimed in, "Huh, sounds like an argument."</p>
                    <p>"Also, I think that if anything... Brother Mountain invited us in here. It wasn't even revealed to Charla and I till after we had started to rest on the peak. So not sure we are intruders. But what's wrong with Boxly? He's been very nice since we met him." Alunra looked to the purple-haired warforged with a soft smile. "Perhaps you could explain and we can work things out?"</p>
                    <p>"I want the box dead!" shouted the purple-haired robot, but the green-haired robot crossed her spear with her sister's axe. </p>
                    <p>"Steady there, sister... you know we can't SLAY Boxly... that was The Mother's familiar and friend, he deserves to annoy-eternal... if that's how long it takes," the warforged kept her weapon steady against her sister's.</p>
                    <p>The purple-haired sister sighed and lowered her axe. "Fine, fine, place the damned box on the pedestal, but tell him I want him to shut up for AT LEAST a decade or else I am going to stick his ass BACK in the closet. I refuse to acknowledge that cretin's existence."</p>
                    <p>"I mean, I guess Boxly might get a little annoying after an eternity, but we find his existence very novel and entertaining," Karoline decided. "We could always take him off your hands for a bit to give you a break, but before that, I believe it's dais time."</p>
                    <p>"I wish it were not like this... could we... could we ask you ANYTHING to not put Boxly back on the pedestal? We can't offer much, but we can try to do what we can...." implored the green-haired warforged.</p>
                    <p>Elva floated forward. "Did I hear bargaining in here?" she asked. "Now what would you offer us?"</p>
                    <p>"My job is to complete the Living Circuit and power the complex—I love my pedestal—it's like a power throne. I get to tear ass around space and time, except I don't move anywhere!"</p>
                    <p>Karoline raised her eyebrow at the warforged's offer and considered asking her about the treasure Boxly mentioned, then remembered they were guards and decided against it. She leaned back and allowed the others some time, deciding not to press anymore herself at the moment.</p>
                    <p>"The desperate, terminal type, not the type you'll find having much to exploit. Our desire is clear, we do not want the box. We'll do anything to not have the box put back on the pedestal—even if it means the complex remains dark and quasi-lost for another millennia...."</p>
                    <p>"I vote put the box on the pedestal," Karoline mentioned.</p>
                    <p>"Wellllllll, how about after we are done here, we take the box?" Elva suggested.</p>
                    <p>"But... I can't leave... this place is MY battery as much as I am the circuit!"</p>
                    <p>"I'm sure we can find you another battery," Elva replied.</p>
                    <p>"Hmmm, have you tried to talk to him and make friends with him? The three of you could become friends so none of you are alone for as long as you stand?" Of course, Alunra, the friendly firbolg, spoke of something like the power of friendship. "Maybe we could bring some games up later for you all to play or something. Or send other visitors for chats?"</p>
                    <p>"Ehh, I vote box on platform now," Elva said.</p>
                    <p>"Whaddya mean? These ARE my friends!" said Boxly, looking upon the two of them with a great big wide grin of his open box.</p>
                    <p>"Alu, box on thingy, go," Elva urged.</p>
                    <p>"Fine... fine... but I am taking first shift in The Mother's Chamber, away from Boxly. Put the box on the dais and then... ugh... Sir Boxly... I will need your key... okay?"</p>
                    <p>"You know the rules, Miss Maria! Platform first, then I can give you the key... and I have so much to tell you about the closet! Remember when you told me to count all the sparkles on the ceiling?"</p>
                    <p>"N-no?" she said hesitantly.</p>
                    <p>"You did! And I did a great job! I even counted them a few times to make sure! I also counted each brick individually! I can tell you about each and every brick later as we wait out eternity!"</p>
                    <p>"I loathe every single bit of this with a white-hot-intensity...."</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/boxlydebate.webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/boxlydebate1.webp"
                ]
            },
            { // Page 37: Lights On & The Key
                text: `
                    <p>Alunra blinked at the conversation, looking between all involved. After a moment, she gave a little shrug and went to place Boxly on the dais.</p>
                    <p>Elva floated back to Charla. "They didn't wanna make deals."</p>
                    <p>"That is disappointing, maybe there will be a magical mummy for us to make a deal with?" asked Charla, hoping to make Elva giggle. Elva did, as she floated back onto Charla's shoulder.</p>
                    <p>"I mean, honestly, this has been endlessly entertaining even with the distinct lack of combat," Karoline shrugged. "Who knew the social workings of eternal guardian robots could be so interesting."</p>
                    <p>As soon as Boxly was placed on the pedestal, the pyramid's overhead lighting began to glow. Bright filaments of gold laced into the walls shimmered, and even the sparkles embedded in the brick seemed to vibrate with an emanation of glistening prominence.</p>
                    <p>Karoline looked at Boxly with intent in her eyes. "Hey, so there was mention of a key, I know one of your other friends asked for it, but do you think maybe we could have it, Sir Boxly?" Karoline asked sweetly. "You did say you'd show us around and all that, and a key would be super helpful."</p>
                    <p>Alunra took a step back from the Dais as the place started to light up, looking around in wonder as she was finally able to see well. She grinned at seeing such a cool sight. While she took a step back, she did stay in front of the dais.</p>
                    <p>Boxly's punching glove extended in Marie's direction, and she removed the glove, unscrewing a large brass-looking fist from the end of the armature. She replaced it with her own fist, grumbling because it was clear that this fist she was taking was not a functional hand.</p>
                    <p>"Oooooh, yeah, I get to use the point touchy bits again!" he said as he flexed his fingers as Maria placed the empty boxing glove into the box. "I guess that means I can escort you to the chamber of The Mother....if you came this far you may as well have an 'audience' with the matron of this place—you do have a right to at least see what we've been guarding for 1000 years."</p>
                    <p>"That sounds good, if moderately ominous," Karol concluded, looking to the rest of the party. "That was always going to be our final destination right, the heart of this place as it were."</p>
                    <p>"A thousand years..." Alunra's eyes went wide, and she gave a little nod. She wanted an audience with this matron, even if just out of curiosity. She then looked to Boxly with a smile. "We'll make sure to come say goodbye before we leave."</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/boxlypowerspyramid.webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/boxlypowerspyramid1.webp"
                ]
            },
            { // Page 38: Surveillance Down & Breach
                text: `
                    <p>"I can see everything within the pyramid now! I can keep an eye on everything, everything except....well...wow! All of my systems are locked out! I cannot access any of the surveillance network! That is strange as all getout!"</p>
                    <p>"That... sounds troubling, I think?" she glanced back to Charla, Elva, and Charla, as she didn't really know what a surveillance network was.</p>
                    <p>Elva shrugged.</p>
                    <p>"I'm going to take a wild guess and say that it wasn't just disrepair that knocked surveillance out," Karol nodded. "Considering everything else here works fine, Any ideas you two?" She asked, looking toward the two warforged.</p>
                    <p>"That is actually disconcerting. Boxly is the security system and the living circuit's processor. He should always have complete control over the pyramid's basic systems unless he's being shut out from the source...." Nellie stopped and turned to Maria. "Take them to The Mother, I will guard Boxly and the Conduit."</p>
                    <p>"Fine, fine!" Maria stepped with a crusty, shuddering lilt as she finally regained full motion and headed in the direction of the Main Burial Chamber.</p>
                    <p>Karol shrugged and gestured for the party to follow, retaking her place near the rear.</p>
                    <p>Alunra followed behind Maria, looking a bit worried because of that news. Echo stayed near Karol.</p>
                    <p>Maria led the group down the hallway in the direction of the doors to the Burial Antechamber. She stopped. The door had been sealed, the gold fused as though perfectly welded into one piece, and the stone melded together. She grimaced. "This is some powerful work....I think I could get this open, but it would like toss some servos and break some pneumatics even if I get a much-needed hand...." she held up the arm she clearly cannot use. "This hand is the key to the door to the burial chamber beyond. I need you to promise me that if helping you get this door open disables me, you will take the key and protect the burial chamber from whatever is within, all right? Do you got me?" she seemed panicked, eager to get them inside.</p>
                    <p>Karol nodded at this. "Sure, it seemed important to Boxly, and we're friends now. We'll do what we can...but also, can we have a list of things not to take from here, 'cause I mean, there were some gemstones and we already fed Boxly some of them, and I just wanna know what you guys are trying to protect here so we can do the whole adventurer thing to everything else."</p>
                    <p>Alunra looked to Maria and gave a nod. "I promise we'll do everything we can to protect the burial chamber. I could try to give you a hand with the door. I'm pretty strong myself." she gave Maria a determined look, hoping she could save her from taking any damage from trying to get it open.</p>

            { // Page 39: Opening the Door
                text: `
                    <p>"Can you crack magical stone and metal asunder and then hold it open for your entire group? I assume your echo could help me with that second bit, but with the first? Only so much, correct?" Marie looked between Alunra and Echo with an expressionless face of armor, but the words were encouraging—she clearly knew that Alunra was strong but was intimating that this task would clearly separate them, and she was looking to keep the students together. She nodded and said, "I guess you won't mind helping me split this open and get you inside?" She didn't wait for an answer; she brought down Goldcleaver and split apart a crack in the door. Almost immediately it tried to seal. Black viscous stone, sparkling with celestial shimmering radiation, bled from the cracks as she yanked with tremendous force on the gap she was creating.</p>
                    <p>The whine and cracking report of actuating servos and overloading pistons from within Marie signaled that her strength was reaching its limit, but she had managed, with some effort, to pull open the doorway enough for Echo to help pull it open the rest of the way.</p>
                    <p>Echo nodded, as did Alunra. She didn't have the abilities before; she was just strong. But what they needed was to get the door open, and getting Echo onto the other side when a gap was made was something she could do. So once there was a gap, she resummoned Echo onto the other side of the door, and Echo started working alongside Marie to pull the door open the rest of the way, putting all her power into it.</p>
                    <p>Karol readied herself in case she needed to dive through the opening provided, her breath getting a little bit heavier at the seemingly sudden increase in stakes.</p>
                    <p>With the help, Marie was easily able to keep the door open for them to pass through the gap. She handed Alunra her hand, jamming the stump into the stone to a cascade of ferrorod-like sparks of metal against conductive stone. The stone oozed around, soupily trying to fill the gap, but refusing to touch living matter or even living construct in its path.</p>
                    <p>Alunra would take the hand as she went to move into the room. Echo waved the rest into the room beyond the door that was opened.</p>
                    <p>Karol jumped in with perhaps too much gusto considering the state things were in, but she moved in with haste anyway.</p>

                    <p>After they entered, the expanse of the Grande Antechamber of Dusk and Dawn was laid out before them. At the far end, before a massive, sealed golden door, a spectral shroud of a creature thrashed and writhed. It was a roiling mass of black, vaporous tentacles and shifting shadow, a formless entity punctuated by dozens of glowing red eyes. The Nightdrinker.</p>
                    <p>"You will let me in... YOU WILL LET ME IN..." it uttered in Deep Speech, uncaring of their presence. "I will prise these doors apart and relinquish the last animus from that husk of incarne... you know I am undeniable...."</p>

                text: `
                    <p>Having finally noticed its foes, the Nightdrinker realized they all posed a threat. It swiped a tentacle at Elva, the airflow whipping her uniform as it passed under her. One of its eyes flamed, aiming at Alunra. It sprang forward but failed to impact, exploding in flames at her feet. Alunra, with Echo, swung her greatsword again.</p>

                    <p>With its last bit of light, the creature focused on Elva and launched its eye at her. It missed, exploding against a pillar, but the blast caught the fairy.</p>

                text: `
                    <p>The Nightdrinker focused a trio of its eyes on Elva, deciding to grant her a modicum of its attention. It launched another eye at her, this one striking true and exploding with fiery force. Elva went down.</p>
                    <p>"Charla!" Alunra roared, but the Nightdrinker finally tossed Charla off its tentacle.</p>
                    <p>Alunra repeated her battle steps, moving to Charla, growling as she struck. "I'm with you, Charla! Doing what I can!" She saw Elva go down. "Karol! Get to Elva!"</p>

                    <p>The explosion of light and raw energy was blinding. The Nightdrinker let out one final, agonizing scream that tore at their minds, and then its form imploded, collapsing in on itself until nothing remained but a fading cloud of black vapor and the lingering smell of ozone.</p>
                    <p>"And thank you, Charla," Alunra said, breathing hard, "for holding that thing in place for as long as you did. I think Elva and I would have had a much harder time if it wasn't for you." She gave Charla a loving smile. "We did good work as a team. Glad you all were here."</p>

            { // Page 44: The Golden Hall
                text: `
                    <p>Silence descended on the antechamber. As the last bits of the Nightdrinker faded, a soft, melodic chime echoed through the hall. The great golden door, free from the assault, swung open without a sound, revealing a long, breathtaking hall that seemed pulled from a fever dream. The floor was paved with mismatched, almost organic-looking flagstones of gold and black, their surfaces polished to a near-perfect mirror finish. From these, great columns of shimmering gold rose, their surfaces not smooth but intricately ribbed, like the bones of some colossal beast. They arched overhead, meeting in the dark, and every surface—floor, column, and ceiling—reflected the others, creating a dizzying, infinite corridor of black and gold that stretched into an impossible, multiplied horizon.</p>
                    <p>The walls between the columns were channels of pure, light-devouring blackness, yet the golden ribs of the arches caught an unseen light, making them burn with a soft, internal fire. The entire effect gave the four students the sensation of standing at the precipice of a kaleidoscopic eternity. A soft, silvery luminescence emanated from the far end of the hall, the only true point of reference in the disorienting splendor, beckoning them forward into the profound peace. The air was cool and clean, smelling of night-blooming jasmine and carrying a palpable sense of safety that soothed their frayed nerves. It was a sanctuary, a stark and welcome contrast to the brutal chaos they had just survived. For a long moment, they could only stand and stare, catching their breath before the first, true miracle they had earned.</p>

            { // Page 45: Mother's Walk
                text: `
                    <p>"Come, my brave, weary children," Elasharna’s voice was as soft as moondown, yet it resonated with an ancient power that settled their frayed nerves. "Your part in this is done. It is time for me to rest."</p>
                    <p>She turned and began to lead them toward a set of large, ornate golden doors at the far end of the impossible hallway, her own form shimmering and changing as she walked. The air grew thick with the scent of old paper, chalk dust, and lavender as she drew near Karoline. Her form condensed, her silvery light coalescing into the shape of a stern but loving human governess from a bygone era, her hair in a severe bun, wearing a high-collared dress. "You have been so strong, Karoline," the governess-form said, her voice crisp but undeniably warm. "You held to your duties and protected your friends. I am so very proud of the leader you have become." Karoline, who had faced down horrors without flinching, found her eyes stinging with tears, a lump forming in her throat at the simple, profound praise she had unknowingly craved.</p>
                    <p>As they moved past Elva, the academic scent of lavender and paper was swept away by a breeze carrying the fragrance of wild honey, night-blooming jasmine, and a faint, clean scent of ozone, like the air after a storm. Elasharna’s light swirled and shrank, her form becoming delicate, winged, and ethereal. For a fleeting moment, she was a nondescript fairy matriarch, her features soft and indistinct, a composite of what a fairy's mother should look like—wise, kind, with wings that shimmered like dragonfly wings at dusk. She didn’t speak a word. Her eyes, pools of liquid moonlight, simply met Elva's. In that silent, piercing gaze, a universe of maternal pride was conveyed—a deep, unconditional approval that Elva’s own mother, in her stern and martial way, might never show. Elva’s breath hitched, and the tough, sarcastic fairy just blinked rapidly, a single, crystalline tear tracing a path down her cheek before she angrily wiped it away.</p>
                    <p>Drawing alongside Alunra, the air sweetened again, filled with the aroma of pine needles after a rain, damp earth, and blooming moonpetal flowers. The Lunar Mother softened and grew, her form stretching into that of a serene firbolg matriarch, her skin the color of twilight and her eyes holding the calm wisdom of an ancient forest. "My sweet, gentle daughter," she murmured, her voice like the rustling of leaves. "You carry the heart of the wild within you. You gave comfort and shielded those who needed you. Your roots are deep, and you will grow to shelter many." Alunra felt a wave of peace wash over her, a deep, resonant belonging that soothed the part of her that always felt a little lost so far from the woods. She walked with her head held high, her steps suddenly lighter.</p>
                    <p>Finally, she turned to Charla, who was leaning heavily on Alunra. The air crackled with a faint charge of ozone and the warm, clean scent of a sun-baked stone. Elasharna’s features sharpened, her skin taking on an opalescent, scaled sheen. Two magnificent, curving horns of pure moonlight swept back from her brow. She was a proud draconic mother, regal and powerful, yet her gaze upon Charla was filled with an overwhelming, fierce affection. "Little one," she said, her voice a melodic rumble. "You have faced the echoes of your own history and did not break. You stood firm. The blood of your ancestors flows strong in you, but your heart is your own. Never forget that." Charla let out a shuddering breath she didn't realize she'd been holding, the words healing a wound she hadn't known was still so raw. She simply nodded, unable to speak past the tightness in her chest, and took the final few steps toward the golden doors, feeling not like a frightened child, but like a daughter being led home.</p>

            { // Page 46: Sarcophagus Chamber & Finale
                text: `
                    <p>The walls were alternating panels of polished gold and shimmering obsidian, humming with a gentle, protective magic that made the air feel warm and safe. Carved into the obsidian panels were delicate scenes, a direct counter-narrative to the cathedral's windows: two young women studying together, a shared look of sorrow as one turns away, a lonely figure building a defensive wall not of stone, but of pure magic and self-sacrifice.</p>
                    <p>In the center of the room, on a simple stone dais, rested a sarcophagus of flawless crystal. Inside lay a woman, her body wrapped in black bandages adorned with pulsating golden seals that seemed to beat in time with a slow, steady heart. She was the Lunar Mother, the guardian of this place.</p>
                    <p>"You are daughters of the academy, yes?" her voice echoed in their minds, a warm, gentle melody. “Not all of you are ‘of here,’ but here calls itself one of your homes, by my order and my will and my love I have felt it,”</p>
                    <p>"Legends have twisted truth over many long years- and have brought me far from those I would have as my flock…" Elasharna’s voice said, full of a sorrow that felt ancient. "I am not the creator force of this realm, nor the architect of its natural law, nor the inspiration behind the padded embrace of our peculiar panties… and no, I was not Tabitha's mother. She was... my dearest friend. We grew up together, dreaming of bright days and powerful magics."</p>
                    <p>Eyes squinting independently with this revelation, Karoline processed this in her internal ‘lexicon of historical hotties,’ as ‘it is valid to ship Ela’Sharna and Sorceress Tabitha, probably canon, too.’ as she dumbly smiles a serene pleasant grin. Even for a lewd little brat like Karoline, Elasharna’s motherly will was enrapturing- even if the bratty bourgeois lil lady preferred her ‘littlespaces’ filled with things that buzzed before being wrapped in plastic.</p>
                    <p>A spectral tear traced a path down Elasharna’s divine and mummified cheek. "But her brilliance was a fire that burned too brightly. She began to see power not as a tool, but as an end. I watched, helpless, as she twisted our collective tool of creation to build her legions... the Warforged. She brought about the Old War, a conflict that scarred this world to its core. In the end, that path consumed her. I could not protect her from herself... from her own ambition. So, I chose to protect this realm. I sealed myself away in this pyramid to ensure that no one else would suffer as she had, that her legacy would be one of caution, not conquest."</p>
                    <p>She turned her spectral gaze to Charla, her voice softening with a tenderness that felt real enough to touch. She told her that Charla wasn't her daughter by blood, but a being born of her own powerful magic, a gift of hope to a world torn apart by war. "I embodied you wholecloth," she said, her translucent hand reaching out to caress Charla's cheek. "You were a gift of happiness with which I chose to reward the multiverse for its endurance."</p>
                    <p>The words hit Charla like a physical blow—shock, disbelief, then a wave of joy and a profound, bone-deep sense of belonging. Charla, who had always felt like an outsider, a weird mix of races that didn't fit anywhere, finally understood. This place, this school, this was her home. These were her people. Her family. "T-thank you...ummm...mommy..." Charla squeaked weakly.</p>
                    <p>As a final, simple act of a mother's care that said more than words ever could, Elasharna refreshed their diapers with a wave of her hand. Alunra let out a sudden squeak at the feeling, shifting from one foot to the other to test the fit of the new diaper.</p>
                    <p>"You are all very welcome...but I think we've all forgotten something, haven't we?" Elasharna intimated with a wink to the whole group. "You have earned some treasured rewards, haven't you?"</p>
                    <p>Karoline’s eyes seemed to sparkle. She took an excited step forward but stopped, regaining her composure. “Well if the madam wishes, I certainly wouldn’t turn down her generosity,” she said, like a child trying to be polite before opening presents.</p>
                    <p>"Hell fuckin' yeah we have!" Elva buzzed, suddenly excited.</p>
                    <p>Charla let out a long, shuddering breath and sagged against Alunra, the fight finally draining out of her. "Well," she managed, her voice a little shaky, "that was a fucking day." She looked from the sealed golden doors to Karoline and Elva, a slow grin spreading across her face. The fresh, magically-clean diaper was a weirdly comforting final touch. It wasn't an ending. It was just another impossible Tuesday at Scholia Diaspros. </p>
                    <p>And for the first time, Charla knew, bone-deep, that she was exactly where she was supposed to be. Alunra squeezed her hand, her own eyes still a little misty. The Black Pyramid wasn't some monument- it wasn’t a tomb- it was the wellspring of love and a piece of her history, one she'd finally gotten to claim- with the help of her friends.</p>

        // --- 3c. GLOSSARY HELPERS/WIRING ---
        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function applyGlossary(container) {
            if (!container) return;
            const terms = Object.keys(glossary || {});
            if (!terms.length) return;
            // Sort longest first to prefer multi-word/longer phrases
            terms.sort((a, b) => b.length - a.length);

            const boundary = '[A-Za-z0-9]';
            const walker = document.createTreeWalker(
                container,
                NodeFilter.SHOW_TEXT,
                {
                    acceptNode: (node) => {
                        if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
                        const parent = node.parentElement;
                        if (!parent) return NodeFilter.FILTER_REJECT;
                        const tag = parent.tagName;
                        if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'CODE' || tag === 'PRE') return NodeFilter.FILTER_REJECT;
                        if (parent.closest('a, button, textarea, input, select, .cover-links, .glossary-term')) return NodeFilter.FILTER_REJECT;
                        return NodeFilter.FILTER_ACCEPT;
                    }
                }
            );

            const nodesToProcess = [];
            while (walker.nextNode()) nodesToProcess.push(walker.currentNode);

            nodesToProcess.forEach(textNode => {
                let text = textNode.nodeValue;
                let replaced = false;
                for (const key of terms) {
                    const dataKey = key.toLowerCase();
                    const info = glossary[dataKey];
                    if (!info) continue;
                    const esc = escapeRegExp(key);
                    const re = new RegExp(`(^|[^${boundary}])(${esc})(?=$|[^${boundary}])`, 'gi');
                    text = text.replace(re, (m, p1, p2) => {
                        replaced = true;
                        const title = info.display || p2;
                        // Keep preceding separator (p1) as-is
                        return `${p1}<span class="glossary-term" data-term="${dataKey}" tabindex="0">${title}</span>`;
                    });
                }
                if (replaced) {
                    const span = document.createElement('span');
                    span.innerHTML = text;
                    textNode.parentNode.replaceChild(span, textNode);
                }
            });
        }

        function setupGlossaryInteractions() {
            if (glossaryEventsBound) return; // only once
            glossaryEventsBound = true;
            const tooltip = document.getElementById('glossary-tooltip');
            if (!tooltip) return;

            let pinnedEl = null;

            function setTooltipContentFor(el) {
                const termKey = el?.getAttribute('data-term');
                if (!termKey) return false;
                const data = glossary[termKey.toLowerCase()];
                if (!data) return false;
                tooltip.querySelector('.title').textContent = data.display || termKey;
                tooltip.querySelector('.body').textContent = data.body || '';
                return true;
            }

            function positionTooltipFor(el) {
                if (!el) return;
                const rect = el.getBoundingClientRect();
                const pad = 8;
                const ttRect = tooltip.getBoundingClientRect();
                let top = rect.bottom + window.scrollY + pad;
                let left = rect.left + window.scrollX + (rect.width - ttRect.width) / 2;
                // Keep inside viewport
                const vw = window.innerWidth + window.scrollX;
                const vh = window.innerHeight + window.scrollY;
                if (left + ttRect.width > vw - pad) left = vw - ttRect.width - pad;
                if (left < pad + window.scrollX) left = window.scrollX + pad;
                if (top + ttRect.height > vh - pad) top = rect.top + window.scrollY - ttRect.height - pad;
                tooltip.style.left = `${left}px`;
                tooltip.style.top = `${top}px`;
            }

            function showTooltip(el) {
                if (!setTooltipContentFor(el)) return;
                tooltip.style.display = 'block';
                positionTooltipFor(el);
                tooltip.setAttribute('aria-hidden', 'false');
            }

            function hideTooltip() {
                tooltip.style.display = 'none';
                tooltip.setAttribute('aria-hidden', 'true');
            }

            // Delegated events on text content
            document.getElementById('text-content').addEventListener('mouseover', (e) => {
                const el = e.target.closest('.glossary-term');
                if (!el) return;
                if (pinnedEl && pinnedEl !== el) return; // respect pin
                showTooltip(el);
            });

            document.getElementById('text-content').addEventListener('mouseout', (e) => {
                const el = e.target.closest('.glossary-term');
                if (!el) return;
                if (pinnedEl) return; // keep shown if pinned
                hideTooltip();
            });

            // Focus/blur for keyboard accessibility
            document.getElementById('text-content').addEventListener('focusin', (e) => {
                const el = e.target.closest('.glossary-term');
                if (!el) return;
                if (pinnedEl && pinnedEl !== el) return;
                showTooltip(el);
            });
            document.getElementById('text-content').addEventListener('focusout', (e) => {
                const el = e.target.closest('.glossary-term');
                if (!el) return;
                if (pinnedEl) return;
                hideTooltip();
            });

            // Click to pin/unpin
            document.getElementById('text-content').addEventListener('click', (e) => {
                const el = e.target.closest('.glossary-term');
                if (!el) return;
                e.preventDefault();
                if (pinnedEl === el) {
                    // Unpin
                    pinnedEl = null;
                    hideTooltip();
                } else {
                    pinnedEl = el;
                    showTooltip(el);
                }
            });

            // Click outside to unpin
            document.addEventListener('click', (e) => {
                if (!pinnedEl) return;
                const withinTerm = e.target.closest && e.target.closest('.glossary-term');
                const withinTooltip = e.target.closest && e.target.closest('#glossary-tooltip');
                if (!withinTerm && !withinTooltip) {
                    pinnedEl = null;
                    hideTooltip();
                }
            });

            // Reposition on resize/scroll when pinned
            window.addEventListener('resize', () => { if (pinnedEl && tooltip.style.display === 'block') positionTooltipFor(pinnedEl); });
            window.addEventListener('scroll', () => { if (pinnedEl && tooltip.style.display === 'block') positionTooltipFor(pinnedEl); }, true);
        }

        function basenameFromUrlOrPath(s) {
            if (!s) return '';
            const hash = s.split('#')[0];
            const q = hash.split('?')[0];
            return q.substring(q.lastIndexOf('/') + 1);
        }

        function tryCandidates(candidates) {
            for (const name of candidates) {
                if (LOCAL_FILES.has(name)) return LOCAL_IMAGE_BASE + name;
            }
            return null;
        }

        function mapToLocalPath(input) {
            // Already a local path
            if (typeof input !== 'string') return input;
            if (input.startsWith(LOCAL_IMAGE_BASE)) return input;

            const base = basenameFromUrlOrPath(input);
            // 1) Direct match
            const direct = tryCandidates([base]);
            if (direct) return direct;

            const noExt = base.replace(/\.webp$/i, '');
            const ext = '.webp';

            const candidates = [];

            // 2) Hyphen number -> parentheses number e.g., name-1.webp -> name (1).webp
            const m = noExt.match(/^(.*?)-(\d+)$/);
            if (m) {
                candidates.push(`${m[1]} (${m[2]})${ext}`);
            }

            // 3) Specific known renames and spacing
            candidates.push(
                noExt.replace(/MissRoot/i, 'Miss+Root') + ext,
            );

            // replace condensed words with plus-separated known phrases
            const replacements = [
                ['boxlypowerspyramid', 'boxly+powers+pyramid'],
                ['boxlydebate1', 'boxly+debate1'],
                ['boxlydebate', 'boxly+debate'],
                ['groupintrowithmery', 'group+intro+with+mery'],
                ['groupassembledonthebridge1', 'group+assembled+on+the+bridge1'],
                ['groupassembledonthebridge', 'group+assembled+on+the+bridge'],
                ['passingtotheoldrootbridge', 'passing+to+the+old+root+bridge'],
                ['preparingtoopen', 'preparing+to+open'],
                ['groveinstasis (2)', 'grove+in+stasis (2)'],
                ['charlaalunravistas1', 'charla+alunra+vistas1'],
                ['charlaalunravistas', 'charla+alunra+vistas'],
                ['naughtyrose-1', 'naughtyrose (1)'],
                ['NoxiousGasTrap-1', 'Noxious+Gas+Trap (1)'],
                ['NoxiousGasTrap-2', 'Noxious+Gas+Trap (2)'],
                ['tapestrytreasure-1', 'tapestry+treasure (1)'],
                ['tapestrytreasure-2', 'tapestry+treasure (2)'],
                ['theblackcathedralvault-1', 'the+black+cathedral+vault (1)'],
                ['theblackcathedralvault-2', 'the+black+cathedral+vault (2)'],
                ['group-diaper-check-at-entrance-3', 'group diaper check at entrance (3)'],
                ['tothepyramid', 'tothepyramid'], // no-op safeguard
                ['tothecathedral1', 'tothecathedral1'],
                ['tothecathedral2', 'tothecathedral2'],
                ['tothecathedral3', 'tothecathedral3']
            ];

            for (const [from, to] of replacements) {
                if (noExt.toLowerCase() === from.toLowerCase()) {
                    candidates.push(`${to}${ext}`);
                }
            }

            // 4) Handle special exclamation filenames
            if (/^spankhernow$/i.test(noExt)) candidates.push('spankhernow!' + ext);
            if (/^spankher$/i.test(noExt)) candidates.push('spankher!' + ext);

            // 5) to-the-mountain -> to the mountain
            if (/^to-the-mountain(\d*)$/i.test(noExt)) {
                const num = noExt.match(/^(?:to-the-mountain)(\d*)$/i)[1] || '';
                candidates.push(`to the mountain${num}${ext}`);
            }

            // 6) charlalunraupthemountain-# -> ( # ) variant
            if (/^charlalunraupthemountain-([123])$/i.test(noExt)) {
                const n = noExt.match(/^charlalunraupthemountain-([123])$/i)[1];
                candidates.push(`charlalunraupthemountain (${n})${ext}`);
            }

            // 7) groupassembledonbridge-2 -> groupassembledonbridge (2)
            if (/^groupassembledonbridge-([0-9]+)$/i.test(noExt)) {
                const n = noExt.match(/^groupassembledonbridge-([0-9]+)$/i)[1];
                candidates.push(`groupassembledonbridge (${n})${ext}`);
            }

            // Note: Do not substitute other scenes for missing 'the+black+cathedral+interior (3|4)'.
            // If (3) or (4) are not present locally, we will keep the original remote URL.

            const mapped = tryCandidates(candidates);
            if (mapped) return mapped;

            // As a last resort, keep original (may be remote) and warn once in console
            console.warn('[Images] No local match for', base, 'leaving original path');
            return input;
        }

        function transformStoryData(data) {
            return data.map(p => ({
                ...p,
                images: (p.images || []).map(mapToLocalPath)
            }));
        }

        /**
         * Loads and displays the content for a specific page index.
         * Resets image index to 0.
         */
        function renderPage() {
            // Ensure index is within bounds
            if (currentPageIndex < 0) currentPageIndex = 0;
            if (currentPageIndex >= story.length) currentPageIndex = story.length - 1;

            const page = story[currentPageIndex];
            currentImageIndex = 0; // Reset image index on page turn
            
            // 1. Update text
            textContent.innerHTML = page.text;
            // Apply glossary wrapping to freshly rendered text
            applyGlossary(textContent);
            // Scroll text container back to top
            textContainer.scrollTop = 0; 
            
            // 2. Update image
            renderImage(); 
            
            // 3. Update page counter
            pageCounter.textContent = `Page ${currentPageIndex + 1} of ${story.length}`;
            
            // 4. Update navigation buttons
            prevPageBtn.disabled = (currentPageIndex === 0);
            nextPageBtn.disabled = (currentPageIndex === story.length - 1);
        }

        /**
         * Displays the image for the current page and current image index.
         * Manages the visibility and state of variant controls.
         */
        function renderImage() {
            const page = story[currentPageIndex];
            const images = page.images;

            // Ensure image index is within bounds
            if (currentImageIndex < 0) currentImageIndex = 0;
            if (currentImageIndex >= images.length) currentImageIndex = images.length - 1;

            // Set the image source
            storyImage.style.opacity = 0; // Fade out
            setTimeout(() => {
                // Check for valid URL
                if (images[currentImageIndex]) {
                    storyImage.src = images[currentImageIndex];
                } else {
                    // Fallback if URL is bad or missing
                    storyImage.src = 'https://placehold.co/1280x720/111827/d1d5db?text=Image+Not+Found';
                }
                storyImage.style.opacity = 1; // Fade in
            }, 300); // Match transition duration

            // Manage variant controls
            if (images.length > 1) {
                variantControls.style.display = 'flex';
                variantCounter.textContent = `${currentImageIndex + 1} of ${images.length}`;
                prevImageBtn.disabled = (currentImageIndex === 0);
                nextImageBtn.disabled = (currentImageIndex === images.length - 1);
                // Show hints when multiple variants exist
                if (imageHint) imageHint.style.display = 'block';
                if (navHint) navHint.style.display = 'block';
            } else {
                variantControls.style.display = 'none';
                if (imageHint) imageHint.style.display = 'none';
                if (navHint) navHint.style.display = 'none';
            }
        }

        // --- 5. EVENT HANDLER FUNCTIONS ---
        
        function goToNextPage() {
            if (currentPageIndex < story.length - 1) {
                currentPageIndex++;
                renderPage();
            }
        }

        function goToPrevPage() {
            if (currentPageIndex > 0) {
                currentPageIndex--;
                renderPage();
            }
        }

        function nextImage() {
            const images = story[currentPageIndex].images;
            if (currentImageIndex < images.length - 1) {
                currentImageIndex++;
                renderImage();
            }
        }

        function prevImage() {
            if (currentImageIndex > 0) {
                currentImageIndex--;
                renderImage();
            }
        }
        
        /**
         * Preloads all images in the storyData array to ensure smooth transitions.
         */
        function preloadImages(data) {
            let preloadedImages = [];
            data.forEach(page => {
                if (page.images && Array.isArray(page.images)) {
                    page.images.forEach(imageUrl => {
                        if (typeof imageUrl === 'string' && imageUrl) {
                            const img = new Image();
                            img.src = imageUrl;
                            preloadedImages.push(img);
                        }
                    });
                }
            });
            return preloadedImages;
        }

        /**
         * Compute indices for Part 1, 2, 3.
         * Part 1: first page with '<h2>Part 1'.
         * Part 2: first page with '<h2>Part 2'.
         * Part 3: first page after Part 2 mentioning 'Pyramid' in text or any image containing 'pyramid'.
         */
        function computePartIndices() {
            const findIndexByHeading = (label) => story.findIndex(p => typeof p.text === 'string' && p.text.includes(label));
            const p1 = findIndexByHeading('<h2>Part 1');
            const p2 = findIndexByHeading('<h2>Part 2');
            let p3 = -1;
            if (p2 !== -1) {
                for (let i = p2 + 1; i < story.length; i++) {
                    const page = story[i];
                    const textHasPyramid = typeof page.text === 'string' && /pyramid/i.test(page.text);
                    const imagesHavePyramid = Array.isArray(page.images) && page.images.some(u => /pyramid/i.test(u));
                    if (textHasPyramid || imagesHavePyramid) { p3 = i; break; }
                }
            }
            // Fallbacks
            if (p3 === -1) { p3 = (p2 !== -1 && p2 + 1 < story.length) ? p2 + 1 : (p1 !== -1 ? p1 : 0); }
            return { 1: (p1 !== -1 ? p1 : 1), 2: (p2 !== -1 ? p2 : (p1 !== -1 ? p1 + 1 : 2)), 3: p3 };
        }

        function navigateToPage(index) {
            if (typeof index === 'number' && index >= 0 && index < story.length) {
                currentPageIndex = index;
                renderPage();
            }
        }

        // --- 6. INITIALIZATION ---
        
        // This function will run once the DOM is fully loaded.
        function initializeApp() {
            console.log("Initializing Storybook...");
            // Load and transform story data to use local image assets
            story = transformStoryData(storyData);
            
            // Add event listeners
            nextPageBtn.addEventListener('click', goToNextPage);
            prevPageBtn.addEventListener('click', goToPrevPage);
            nextImageBtn.addEventListener('click', nextImage);
            prevImageBtn.addEventListener('click', prevImage);

            // Preload images (local-first after transform)
            preloadImages(story);

            // Render the first page
            partIndexMap = computePartIndices();

            // Delegate clicks for cover links
            textContent.addEventListener('click', (e) => {
                const link = e.target.closest('.cover-link');
                if (link) {
                    e.preventDefault();
                    const part = parseInt(link.getAttribute('data-part'), 10);
                    const idx = partIndexMap[part];
                    if (typeof idx === 'number') navigateToPage(idx);
                }
            });

            renderPage();
            console.log("Storybook Initialized.");
            // Setup glossary interactions once
            setupGlossaryInteractions();
        }
        
        // Wait for the DOM to be fully loaded before running the app
        document.addEventListener('DOMContentLoaded', initializeApp);

    </script>
