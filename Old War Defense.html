                if (effect.source === 'championKnight' || effect.source === 'championMonk' || effect.source === 'artilleristChampion') {
                    const existing = this.effects.find(e => e.type === effect.type);
                    if (existing) {
                        if (effect.type === 'burn') {
                            existing.duration = Math.max(existing.duration, effect.duration);
                            existing.damage = Math.max(existing.damage, effect.damage);
                        } else {
                            existing.duration = Math.max(existing.duration, effect.duration);
                        }
                    } else {
                        this.effects.push(effect);
                    }
                    return;
                }
                
                // Bosses are immune to stun (except from champions)
                if (effect.type === 'stun' && this.boss) return;
                
                // Check slow immunity and cooldown
                if (effect.type === 'slow') {
                    // If enemy is on slow cooldown, can't be slowed
                    if (this.slowCooldown > 0) return;
                    
                    // Check if enemy is immune to non-frost wizard slows
                    if (this.slowImmune && effect.source !== 'frostWizard') return;
                    
                    // Titans and dragons can only be slowed by frost wizard
                    if ((this.special === 'titan' || this.special === 'zigzag') && effect.source !== 'frostWizard') return;
                }
                
                const existing = this.effects.find(e => e.type === effect.type);
                if (existing) {
                    if (effect.type === 'burn') {
                        existing.duration = Math.max(existing.duration, effect.duration);
                        existing.damage = Math.max(existing.damage, effect.damage);
                    } else {
                        existing.duration = Math.max(existing.duration, effect.duration);
                    }
                } else {
                    this.effects.push(effect);
                }
            }
        }

        // --- Portal System ---
        class Portal {
            constructor(x, y, enemies) {
                this.x = x;
                this.y = y;
                this.enemies = enemies; // Array of enemy types to spawn
                this.radius = 40;
                this.spawnTimer = 0;
                this.spawnInterval = 60; // Frames between spawns
                this.totalSpawned = 0;
                this.maxSpawns = enemies.length;
                
                // Portal lifetime scales with wave progression
                let baseLifetime = 600; // 10 seconds at 60fps
                if (wave > 30) {
                    baseLifetime += 240; // +4 seconds after wave 30
                }
                if (wave > 35) {
                    baseLifetime += 240; // +4 more seconds after wave 35
                }
                if (wave > 40) {
                    baseLifetime += 360; // +6 more seconds after wave 40
                    // Additional scaling for very high waves
                    const extraTime = Math.min((wave - 40) * 60, 600); // Up to 10 more seconds
                    baseLifetime += extraTime;
                }
                this.lifetime = baseLifetime;
                
                this.age = 0;
                this.portalEffect = 0; // For visual swirling effect
            }
            
            update() {
                this.age++;
                this.portalEffect += 0.2;
                this.spawnTimer++;
                
                // Spawn enemies periodically
                if (this.spawnTimer >= this.spawnInterval && this.totalSpawned < this.maxSpawns) {
                    this.spawnEnemy();
                    this.spawnTimer = 0;
                    this.totalSpawned++;
                }
                
                // Portal closes after lifetime or all enemies spawned
                return this.age < this.lifetime && this.totalSpawned < this.maxSpawns;
            }
            
            spawnEnemy() {
                if (this.totalSpawned < this.enemies.length) {
                    const enemyType = this.enemies[this.totalSpawned];
                    const newEnemy = new Enemy(enemyType, ENEMY_DATA[enemyType]);
                    
                    // Set portal blink effect - longer for post-40 waves
                    newEnemy.portalBlinking = true;
                    if (wave > 40) {
                        // Longer blink after wave 40, scaling with wave number
                        const extraTime = Math.min((wave - 40) * 30, 300); // Up to 5 extra seconds
                        newEnemy.portalBlinkTimer = 180 + extraTime; // Base 3 seconds + scaling
                    } else {
                        newEnemy.portalBlinkTimer = 180; // 3 seconds at 60fps
                    }
                    
                    // Spawn enemy at portal location with slight randomization
                    newEnemy.x = this.x + (Math.random() - 0.5) * 60;
                    newEnemy.y = this.y + (Math.random() - 0.5) * 60;
                    
                    // Find the closest path point and set enemy on path
                    let closestDist = Infinity;
                    let closestIndex = 0;
                    for (let i = 0; i < path.length; i++) {
                        const pathX = path[i].x * TILE_SIZE + TILE_SIZE / 2;
                        const pathY = path[i].y * TILE_SIZE + TILE_SIZE / 2;
                        const dist = Math.hypot(newEnemy.x - pathX, newEnemy.y - pathY);
                        if (dist < closestDist) {
                            closestDist = dist;
                            closestIndex = i;
                        }
                    }
                    newEnemy.pathIndex = Math.max(0, closestIndex - 1);
                    
                    enemies.push(newEnemy);
                    
                    // Visual effect
                    for (let i = 0; i < 8; i++) {
                        particles.push({
                            type: 'spark',
                            x: this.x + (Math.random() - 0.5) * 40,
                            y: this.y + (Math.random() - 0.5) * 40,
                            vx: (Math.random() - 0.5) * 4,
                            vy: (Math.random() - 0.5) * 4,
                            life: 30,
                            color: '#a855f7'
                        });
                    }
                }
            }
            
            draw() {
                // Draw swirling portal effect
                ctx.save();
                
                // Pulsing effect based on age
                const pulseScale = 1 + Math.sin(this.age * 0.1) * 0.1;
                const alpha = Math.max(0.4, 1 - (this.age / this.lifetime) * 0.6); // Fade out over time
                ctx.globalAlpha = alpha;
                
                // Outer ring with pulse
                ctx.strokeStyle = '#7c3aed';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * pulseScale, 0, Math.PI * 2);
                ctx.stroke();
                
                // Secondary ring
                ctx.strokeStyle = '#a855f7';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, (this.radius - 10) * pulseScale, 0, Math.PI * 2);
                ctx.stroke();
                
                // Inner swirl
                ctx.strokeStyle = '#c084fc';
                ctx.lineWidth = 2;
                ctx.beginPath();
                for (let i = 0; i < 8; i++) {
                    const angle = (this.portalEffect + i * Math.PI / 4) % (Math.PI * 2);
                    const x1 = this.x + Math.cos(angle) * 10 * pulseScale;
                    const y1 = this.y + Math.sin(angle) * 10 * pulseScale;
                    const x2 = this.x + Math.cos(angle + 0.8) * 25 * pulseScale;
                    const y2 = this.y + Math.sin(angle + 0.8) * 25 * pulseScale;
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                }
                ctx.stroke();
                
                // Center glow with pulsing
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 25 * pulseScale);
                gradient.addColorStop(0, `rgba(168, 85, 247, ${0.7 * alpha})`);
                gradient.addColorStop(0.5, `rgba(192, 132, 252, ${0.4 * alpha})`);
                gradient.addColorStop(1, 'rgba(168, 85, 247, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 25 * pulseScale, 0, Math.PI * 2);
                ctx.fill();
                
                // Warning indicator when about to spawn
                if (this.spawnTimer > this.spawnInterval - 30 && this.totalSpawned < this.maxSpawns) {
                    const warningAlpha = Math.sin((this.spawnInterval - this.spawnTimer) * 0.5);
                    ctx.globalAlpha = warningAlpha * alpha;
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 1.2, 0, Math.PI * 2);
                    ctx.stroke();
                }
                
                ctx.restore();
            }
        }
        
        // Helper function to identify weaker enemies from a wave
        function getWeakerEnemies(waveEnemies) {
        // Safety guard for unexpected inputs
        if (!waveEnemies || typeof waveEnemies !== 'object') return [];

            // Categorize enemies by strength - expanded for early game portals
            const veryWeakTypes = ['skitterer', 'shambler', 'fastShambler']; // Super early enemies
            const weakerTypes = ['armoredSkitterer', 'alphaSkitterer', 'flier', 'swarmVesper', 'greaterVesper'];
            const mediumTypes = ['brute', 'shadowmancer', 'corruptor', 'sapper', 'ghost', 'lurker', 'spitter'];
            const strongerTypes = ['charger', 'hulkingShambler', 'titan', 'titan2', 'titan3', 'summoner', 'frostbringer'];
        const weakerEnemies = [];
            // At high levels, allow all non-boss, non-digger enemies to exit portals
            if (wave > 60) {
                for (const [enemyType, count] of Object.entries(waveEnemies)) {
            const data = ENEMY_DATA[enemyType];
            if (data && !data.boss && data.special !== 'drill') {
                        for (let i = 0; i < Math.ceil(count * 0.3); i++) {
                            weakerEnemies.push(enemyType);
                        }
                    }
                }
            }
            
            for (const [enemyType, count] of Object.entries(waveEnemies)) {
                let cloneCount = 0;
                
                if (veryWeakTypes.includes(enemyType)) {
                    // Add 80-100% of very weak enemies (early game focus)
                    cloneCount = Math.ceil(count * (0.8 + Math.random() * 0.2));
                } else if (weakerTypes.includes(enemyType)) {
                    // Add 60-85% of weak enemies
                    cloneCount = Math.ceil(count * (0.6 + Math.random() * 0.25));
                } else if (mediumTypes.includes(enemyType)) {
                    // Add 40-60% of medium enemies
                    cloneCount = Math.ceil(count * (0.4 + Math.random() * 0.2));
                } else if (strongerTypes.includes(enemyType)) {
                    // Add 25-35% of stronger enemies (but not bosses/dragons)
                    if (!ENEMY_DATA[enemyType].boss && !ENEMY_DATA[enemyType].midBoss) {
                        cloneCount = Math.ceil(count * (0.25 + Math.random() * 0.1));
                    }
                }
                
                // Add the calculated number of clone enemies
                for (let i = 0; i < cloneCount; i++) {
                    weakerEnemies.push(enemyType);
                }
            }
            
            // Scale enemy count with wave for more portal chaos
            let maxEnemies = 10; // Base for early waves
            if (wave >= 15) maxEnemies = 15;
            if (wave >= 25) maxEnemies = 20;
            if (wave >= 35) maxEnemies = 25;
            if (wave >= 45) maxEnemies = 30;
            
            // Ensure we don't spawn too many enemies
            if (weakerEnemies.length > maxEnemies) {
                weakerEnemies.length = maxEnemies;
            }
            
            // Shuffle the array for variety
            for (let i = weakerEnemies.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [weakerEnemies[i], weakerEnemies[j]] = [weakerEnemies[j], weakerEnemies[i]];
            }
            
            return weakerEnemies;
        }
        
        // Function to determine if a portal should spawn
        function shouldSpawnPortal(waveNumber) {
            // Start portals early in the game (wave 5+)
            if (waveNumber < 5) return false;
            
            // Very aggressive portal spawning for all waves
            if (waveNumber >= 5 && waveNumber < 15) {
                // Early game: 40% chance, increasing by 3% per wave
                const baseChance = 0.40;
                const waveBonus = (waveNumber - 5) * 0.03;
                const totalChance = Math.min(0.65, baseChance + waveBonus);
                return Math.random() < totalChance;
            }
            
            if (waveNumber >= 15 && waveNumber < 25) {
                // Mid-early game: 65% chance, increasing by 2% per wave
                const baseChance = 0.65;
                const waveBonus = (waveNumber - 15) * 0.02;
                const totalChance = Math.min(0.80, baseChance + waveBonus);
                return Math.random() < totalChance;
            }
            
            if (waveNumber >= 25 && waveNumber <= 40) {
                // Mid game: 80% chance, increasing by 1% per wave
                const baseChance = 0.80;
                const waveBonus = (waveNumber - 25) * 0.01;
                const totalChance = Math.min(0.95, baseChance + waveBonus);
                return Math.random() < totalChance;
            }
            
            if (waveNumber > 40) {
                // Late game: VERY aggressive portal spawning
                const baseChance = 0.95; // Start at 95% for post-40 waves
                const waveBonus = (waveNumber - 40) * 0.005; // Small increase per wave
                const totalChance = Math.min(0.99, baseChance + waveBonus); // Cap at 99%
                return Math.random() < totalChance;
            }
            
            return false;
        }
        
        // Function to get a random mid-field position
        function getRandomMidFieldPosition() {
            // Many more possible portal locations as waves progress
            const baseRegions = [

                    { xCenter: canvas.width * 0.425, xRange: canvas.width * 0.08 }, // Fine-grained center-left

                    { xCenter: canvas.width * 0.15, xRange: canvas.width * 0.08 },  // Extra positions

                );

                    { xCenter: canvas.width * 0.625, xRange: canvas.width * 0.06 },
                    { xCenter: canvas.width * 0.75, xRange: canvas.width * 0.06 },
                    { xCenter: canvas.width * 0.875, xRange: canvas.width * 0.06 }
                );
            }
            if (wave >= 25) {
                regions.push(
                    // Even more fine-grained portal positions for late game
                    { xCenter: canvas.width * 0.07, xRange: canvas.width * 0.05 },
                    { xCenter: canvas.width * 0.18, xRange: canvas.width * 0.05 },
                    { xCenter: canvas.width * 0.32, xRange: canvas.width * 0.05 },
                    { xCenter: canvas.width * 0.45, xRange: canvas.width * 0.05 },
                    { xCenter: canvas.width * 0.55, xRange: canvas.width * 0.05 },
                    { xCenter: canvas.width * 0.68, xRange: canvas.width * 0.05 },
                    { xCenter: canvas.width * 0.82, xRange: canvas.width * 0.05 },
                    { xCenter: canvas.width * 0.93, xRange: canvas.width * 0.05 }
                );
            }
            if (wave >= 35) {
                regions.push(
                    // Maximum portal chaos for extreme late game - but not too close to gate
                    { xCenter: canvas.width * 0.04, xRange: canvas.width * 0.04 },
                    { xCenter: canvas.width * 0.12, xRange: canvas.width * 0.04 },

                    { xCenter: canvas.width * 0.62, xRange: canvas.width * 0.04 },
                    { xCenter: canvas.width * 0.71, xRange: canvas.width * 0.04 },
                    { xCenter: canvas.width * 0.79, xRange: canvas.width * 0.04 },
                    { xCenter: canvas.width * 0.85, xRange: canvas.width * 0.04 }, // Moved from 0.88
                    { xCenter: canvas.width * 0.90, xRange: canvas.width * 0.04 }  // Moved from 0.96, max at 90%
                );
            }
            
            const region = regions[Math.floor(Math.random() * regions.length)];
            
            let attempts = 0;
            let x, y;
            
            do {
                // X stays within the chosen region
                x = region.xCenter + (Math.random() - 0.5) * region.xRange;
                
                // Ensure portals don't spawn too close to the gate (right side)
                const gateX = canvas.width;
                const minDistanceFromGate = 150; // Minimum pixels from gate
                if (x > gateX - minDistanceFromGate) {
                    x = gateX - minDistanceFromGate - Math.random() * 50; // Push further left with some randomness
                }
                
                // Y has expanded variety for higher waves
                let yMin = 0.15, yMax = 0.85;
                if (wave >= 20) {
                    yMin = 0.1;
                    yMax = 0.9;
                }
                if (wave >= 40) {
                    yMin = 0.05;
                    yMax = 0.95;
                }
                
                y = yMin * canvas.height + Math.random() * (yMax - yMin) * canvas.height;
                attempts++;
                
                // Avoid spawning on path
                const pathCollision = path.some(p => {
                    const pathX = p.x * TILE_SIZE + TILE_SIZE / 2;
                    const pathY = p.y * TILE_SIZE + TILE_SIZE / 2;
                    return Math.hypot(x - pathX, y - pathY) < TILE_SIZE * 1.5;
                });
                
                if (!pathCollision) break;
            } while (attempts < 20);
            
            // Fallback to safe position if all attempts failed
            if (attempts >= 20) {
                x = canvas.width * 0.5;
                y = canvas.height * 0.5;
            }
            
            return { x, y };
        }
        
        // Check if a position is on the path
        function isOnPath(x, y) {
            const tileX = Math.floor(x / TILE_SIZE);
            const tileY = Math.floor(y / TILE_SIZE);
            
            for (let i = 0; i < path.length - 1; i++) {
                const start = path[i];
                const end = path[i + 1];
                
                if (start.x === end.x) {
                    // Vertical path segment
                    if (tileX === start.x && tileY >= Math.min(start.y, end.y) && tileY <= Math.max(start.y, end.y)) {
                        return true;
                    }
                } else {
                    // Horizontal path segment
                    if (tileY === start.y && tileX >= Math.min(start.x, end.x) && tileX <= Math.max(start.x, end.x)) {
                        return true;
                    }
                }
            }
            return false;
        }

        class Tower {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.level = 0;
                this.capstone = null; // Will store capstone choice
                this.champion = false; // Champion upgrade status
                const data = TOWER_DATA[type];
                this.color = data.color;
                this.tokenImg = new Image();
                this.tokenImg.src = getRandomToken(type);
                this.updateStats();
                this.target = null;
                this.fireCooldown = 0;
                this.buffCooldown = 0; // For sensei buff application
                this.stompCooldown = 0; // For centaur stomping
                this.aoeBurstCooldown = 0; // For Grovekeeper (centaur champion) AoE burst
            }

            updateStats() {
                const data = TOWER_DATA[this.type];
                let stats;
                
                if (this.champion && this.capstone !== null && data.champions) {
                    stats = data.champions[this.capstone];
                } else if (this.capstone !== null) {
                    stats = data.capstones[this.capstone];
                } else if (this.level < data.stats.length) {
                    stats = data.stats[this.level];
                } else {
                    stats = data.stats[data.stats.length - 1];
                }
                
                for (const key in stats) {
                    this[key] = stats[key];
                }
                
                // Update sprite if available (for any level, not just champions)
                if (this.sprite) {
                    // Force image reload by creating new Image object
                    this.tokenImg = new Image();
                    this.tokenImg.src = this.sprite;
                }
            }

            draw() {
                // Scale tower sprite by 50% (increased from 25%)
                const scaledSize = TILE_SIZE * 1.5;
                const offset = (scaledSize - TILE_SIZE) / 2;

                // Draw glowing underlay instead of circular border
                if (this.glow) {
                    ctx.save();
                    const glowColors = {
                        red: '#dc2626', blue: '#1e40af', white: '#ffffff', 
                        gold: '#fbbf24', cyan: '#06b6d4', orange: '#f97316',
                        yellow: '#eab308', purple: '#8b5cf6', green: '#22c55e'
                    };
                    const glowColor = glowColors[this.glow] || '#ffffff';
                    // Glowing underlay: radial gradient
                    const grad = ctx.createRadialGradient(
                        this.x + TILE_SIZE/2, this.y + TILE_SIZE/2, scaledSize/4,
                        this.x + TILE_SIZE/2, this.y + TILE_SIZE/2, scaledSize/1.2
                    );
                    grad.addColorStop(0, glowColor + '99'); // center, semi-transparent
                    grad.addColorStop(0.5, glowColor + '33');
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.globalAlpha = 0.7;
                    ctx.beginPath();
                    ctx.arc(this.x + TILE_SIZE/2, this.y + TILE_SIZE/2, scaledSize/1.15, 0, Math.PI*2);
                    ctx.closePath();
                    ctx.fillStyle = grad;
                    ctx.filter = 'blur(2px)';
                    ctx.fill();
                    ctx.filter = 'none';
                    ctx.globalAlpha = 1.0;
                    ctx.restore();
                }

                // Draw token image with improved scaling quality
                ctx.save();
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(this.tokenImg, this.x - offset, this.y - offset, scaledSize, scaledSize);
                ctx.restore();
                
                // Draw dark curse effect for cursed towers
                if (this.darkCursed) {
                    ctx.save();
                    // Glowing purple underlay for curse
                    const grad = ctx.createRadialGradient(
                        this.x + TILE_SIZE/2, this.y + TILE_SIZE/2, scaledSize/4,
                        this.x + TILE_SIZE/2, this.y + TILE_SIZE/2, scaledSize/1.1
                    );
                    grad.addColorStop(0, '#4c1d95cc');
                    grad.addColorStop(0.5, '#4c1d9555');
                    grad.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.globalAlpha = 0.7 + Math.sin(Date.now() * 0.01) * 0.2;
                    ctx.beginPath();
                    ctx.arc(this.x + TILE_SIZE/2, this.y + TILE_SIZE/2, scaledSize/1.05, 0, Math.PI*2);
                    ctx.closePath();
                    ctx.fillStyle = grad;
                    ctx.filter = 'blur(2px)';
                    ctx.fill();
                    ctx.filter = 'none';
                    ctx.globalAlpha = 1.0;
                    ctx.restore();
                }
                
                // Draw curse effect for cursed towers
                if (this.darkCursed && this.darkCurseTimer > 0) {
                    ctx.save();
                    const pulseIntensity = 0.4 + Math.sin(Date.now() * 0.008) * 0.2;
                    ctx.globalAlpha = pulseIntensity;
                    ctx.strokeStyle = '#4c1d95';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.arc(this.x + TILE_SIZE/2, this.y + TILE_SIZE/2, scaledSize/2 + 8, 0, Math.PI*2);
                    ctx.stroke();
                    ctx.restore();
                }
                
                // Draw immunity indicator for immune champions
                if (this.champion && (this.isImmuneToCurse() || this.isImmuneToDisable())) {
                    ctx.save();
                    ctx.globalAlpha = 0.6;
                    ctx.fillStyle = '#fbbf24';
                    ctx.font = '8px Arial';
                    ctx.textAlign = 'center';
                    if (this.isImmuneToCurse() && this.isImmuneToDisable()) {
                        ctx.fillText('IMMUNE', this.x + TILE_SIZE/2, this.y - 5);
                    } else if (this.isImmuneToCurse()) {
                        ctx.fillText('CURSE IMMUNE', this.x + TILE_SIZE/2, this.y - 5);
                    } else if (this.isImmuneToDisable()) {
                        ctx.fillText('DISABLE IMMUNE', this.x + TILE_SIZE/2, this.y - 5);
                    }
                    ctx.restore();
                }
                
                // Draw range overlay if selected
                if (selectedPlacedTower === this) {
                    ctx.save();
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(
                        this.x + TILE_SIZE/2 - this.range,
                        this.y + TILE_SIZE/2 - this.range,
                        this.range * 2,
                        this.range * 2
                    );
                    ctx.restore();
                }
            }

            findTarget() {
                this.target = null;
                let closestDist = Infinity;
                for (const enemy of enemies) {
                    // Skip drill teams that are underground
                    if (enemy.special === 'drill' && enemy.isUnderground) {
                        continue;
                    }
                    
                    const towerCenterX = this.x + TILE_SIZE / 2;
                    const towerCenterY = this.y + TILE_SIZE / 2;
                    // Check if enemy is within square range
                    const dx = Math.abs(enemy.x - towerCenterX);
                    const dy = Math.abs(enemy.y - towerCenterY);
                    if (dx <= this.range && dy <= this.range) {
                        const dist = Math.hypot(dx, dy);
                        if (dist < closestDist) {
                            closestDist = dist;
                            this.target = enemy;
                        }
                    }
                }
            }

            getEffectiveDamage() {
                // Some champions are immune to curse effects
                if (this.darkCursed && !this.isImmuneToCurse()) {
                    return Math.floor(this.dmg * 0.5);
                }
                return this.dmg;
            }
            
            isImmuneToCurse() {
                // Zen Master Champions, Divine Knight Champions, and Grandmaster Mage Champions are immune to curse
                if (this.champion && this.type === 'monk' && this.capstone === 0) return true; // Zen Master
                if (this.champion && this.type === 'knight' && this.capstone === 0) return true; // Radiant Defender Champion (Divine Knight)
                if (this.champion && this.type === 'mage') return true; // Both Archmage champions (Grandmaster)
                return false;
            }
            
            isImmuneToDisable() {
                // Grovekeepers, Mistress of Beasts, and Artillerist Champions are immune to disable
                if (this.champion && this.type === 'centaur') return true; // Grovekeeper
                if (this.champion && this.type === 'beastrider') return true; // Mistress of Beasts (Empress of Beasts)
                if (this.champion && this.type === 'archer' && this.capstone === 0) return true; // Artillerist Champion
                return false;
            }

            update() {
                this.fireCooldown = Math.max(0, this.fireCooldown - 1);
                this.buffCooldown = Math.max(0, this.buffCooldown - 1);
                
                // Handle dark curse effects
                if (this.darkCursed && this.darkCurseTimer > 0) {
                    this.darkCurseTimer--;
                    if (this.darkCurseTimer <= 0) {
                        this.darkCursed = false;
                    }
                }
                
                // Apply sensei buff to nearby towers
                if (this.type === 'monk' && this.capstone === 0 && this.buffCooldown === 0) {
                    this.applySenseiBuff();
                    this.buffCooldown = 30; // Apply buff every 30 frames
                }
                
                // Apply cleric cleansing and buffs
                if (this.type === 'cleric' && this.buffCooldown === 0) {
                    this.applyClericEffects();
                    this.buffCooldown = Math.max(30, this.cleanseRate || 240); // Use cleanseRate or default to 240 frames
                }
                
                this.findTarget();
                if (this.target && this.fireCooldown === 0) {
                    this.attack();
                }
                this.draw();
            }
            
            applySenseiBuff() {
                if (!this.buffRange) return;
                for (const tower of towers) {
                    if (tower === this) continue;
                    const dist = Math.hypot(
                        (tower.x + TILE_SIZE/2) - (this.x + TILE_SIZE/2),
                        (tower.y + TILE_SIZE/2) - (this.y + TILE_SIZE/2)
                    );
                    if (dist <= this.buffRange) {
                        tower.fireCooldown = Math.max(0, tower.fireCooldown - 2); // Speed boost
                    }
                }
            }

            applyClericEffects() {
                if (!this.buffRange) return;
                
                for (const tower of towers) {
                    if (tower === this) continue;
                    const dist = Math.hypot(
                        (tower.x + TILE_SIZE/2) - (this.x + TILE_SIZE/2),
                        (tower.y + TILE_SIZE/2) - (this.y + TILE_SIZE/2)
                    );
                    
                    // Apply attack speed buff
                    if (dist <= this.buffRange && this.attackSpeedBuff) {
                        tower.fireCooldown = Math.max(0, tower.fireCooldown * this.attackSpeedBuff);
                    }
                    
                    // Apply immunity aura (Divine Guardian and Arch-Paladin)
                    if (dist <= (this.immuneRange || 0) && this.immuneAura) {
                        tower.darkCursed = false;
                        tower.darkCurseTimer = 0;
                        tower.disabled = false;
                        tower.disableTimer = 0;
                    }
                    
                    // Cleanse debuffs
                    if (dist <= this.buffRange && this.cleanse) {
                        tower.darkCursed = false;
                        tower.darkCurseTimer = 0;
                        tower.disabled = false;
                        tower.disableTimer = 0;
                        tower.slowDebuffTimer = Math.max(0, (tower.slowDebuffTimer || 0) - 30);
                        tower.burnTimer = Math.max(0, (tower.burnTimer || 0) - 15);
                    }
                }
            }

            attack() {
                if (this.type === 'cleric') {
                    // Cleric melee attack with special abilities
                    for (const enemy of enemies) {
                        const towerCenterX = this.x + TILE_SIZE / 2;
                        const towerCenterY = this.y + TILE_SIZE / 2;
                        const dx = Math.abs(enemy.x - towerCenterX);
                        const dy = Math.abs(enemy.y - towerCenterY);
                        if (dx <= this.range && dy <= this.range) {
                            const damageType = this.champion ? 'champion' : 'melee';
                            let effectiveDmg = this.getEffectiveDamage();
                            
                            // Holy Strike bonus damage
                            if (this.holyStrike && this.holyDmg) {
                                effectiveDmg += this.holyDmg;
                            }
                            
                            enemy.takeDamage(effectiveDmg * cheatDamageMultiplier, damageType);
                            
                            // Divine Wrath effect (champion ability)
                            if (this.divineWrath && this.champion) {
                                // Remove all debuffs from the enemy
                                enemy.slowDebuffTimer = 0;
                                enemy.burnTimer = 0;
                                enemy.darkCursed = false;
                                enemy.darkCurseTimer = 0;
                                enemy.disabled = false;
                                enemy.disableTimer = 0;
                                // Deal bonus holy damage
                                enemy.takeDamage(this.dmg * 0.5 * cheatDamageMultiplier, 'holy');
                            }
                        }
                    }
                    particles.push({ type: 'pulse', x: this.x + TILE_SIZE/2, y: this.y + TILE_SIZE/2, radius: this.range, life: 20, color: this.color });
                }
                
                this.fireCooldown = this.fireRate;
            }
            
            upgrade() {
                const data = TOWER_DATA[this.type];
                
                // Check if this tower type can be upgraded
                if (data.stats[0].noUpgrade) {
                    logMessage(`${data.name}s cannot be upgraded.`);
                    return;
                }
                
                // Check if at capstone level and can upgrade to champion
                if (this.capstone !== null && !this.champion && data.champions) {
                    const championCost = data.cost * 10; // Champions cost 10x base cost
                    if (essence >= championCost) {
                        essence -= championCost;
                        this.champion = true;
                        this.updateStats();
                        logMessage(`Upgraded ${data.capstones[this.capstone].name} to ${this.name}!`);
                        updateTowerInfoPanel(this);
                        updateAvailableTowers(); // Check if new towers are unlocked
                        return;
                    } else {
                        logMessage("Not enough essence for champion upgrade.");
                        return;
                    }
                }
                
                // Check if at capstone level
                if (this.level === 2 && this.capstone === null) {
                    // Show capstone selection (for now, auto-select first one)
                    this.showCapstoneSelection();
                    return;
                }
                
                if (this.champion) {
                    logMessage(`${this.name} is already at maximum level.`);
                    return;
                }
                
                if (this.capstone !== null) {
                    logMessage(`${data.capstones[this.capstone].name} can be upgraded to Champion level.`);
                    return;
                }
                
                if (this.level < data.stats.length - 1) {
                    const upgradeCost = data.cost * (this.level + 1.5);
                    if (essence >= upgradeCost) {
                        essence -= upgradeCost;
                        this.level++;
                        this.updateStats();
                        logMessage(`Upgraded ${data.name} to Level ${this.level + 1}.`);
                        updateTowerInfoPanel(this);
                    } else {
                        logMessage("Not enough essence to upgrade.");
                    }
                } else {
                    logMessage(`${data.name} is ready for capstone upgrade.`);
                }
            }
            
            showCapstoneSelection() {
                const data = TOWER_DATA[this.type];
                if (!data.capstones || data.capstones.length === 0) return;
                
                // For now, auto-select first capstone (will implement UI later)
                this.selectCapstone(0);
            }
            
            selectCapstone(index) {
                const data = TOWER_DATA[this.type];
                const capstone = data.capstones[index];
                const upgradeCost = data.cost * 3;
                
                if (essence >= upgradeCost) {
                    essence -= upgradeCost;
                    this.capstone = index;
                    this.updateStats();
                    logMessage(`Upgraded ${data.name} to ${capstone.name}!`);
                    updateTowerInfoPanel(this);
                } else {
                    logMessage("Not enough essence for capstone upgrade.");
                }
            }
        }

            constructor(x, y, type) {

            update() {
                this.fireCooldown = Math.max(0, this.fireCooldown - 1);
                this.buffCooldown = Math.max(0, this.buffCooldown - 1);
                this.stompCooldown = Math.max(0, this.stompCooldown - 1);

                }

                if (this.target && this.fireCooldown === 0) { this.attack(); }
                this.stompAttack();
                
                // Champion Grovekeeper AoE burst ability
                if (this.champion && this.aoeBurst && this.aoeBurstCooldown === 0) {
                    if (typeof this.performAoEBurst === 'function') {
                        this.performAoEBurst();
                        this.aoeBurstCooldown = this.aoeBurstRate || 240; // 4 seconds (240 frames at 60fps)
                    }
                }
                
                this.draw();
            }
            
            attack() {
                this.fireCooldown = this.fireRate;
                const projectileImg = 'src/assets/images/expeditionandgames/towerD/shot1a.png';
                const damageType = this.champion ? 'champion' : 'physical';
                const effectiveDmg = this.getEffectiveDamage();

            }
            
            stompAttack() {
                if (this.stompCooldown === 0) {
                    let stomped = false;
                    for (const enemy of enemies) {
                        // Skip airborne enemies for ground AOE attacks
                        if (enemy.isFlying) continue;
                        
                        const towerCenterX = this.x + TILE_SIZE / 2;
                        const towerCenterY = this.y + TILE_SIZE / 2;
                        const dx = Math.abs(enemy.x - towerCenterX);
                        const dy = Math.abs(enemy.y - towerCenterY);
                        if (dx <= this.stompRange && dy <= this.stompRange) {
                            const damageType = this.champion ? 'champion' : 'physical';
                            const effectiveStompDmg = this.darkCursed ? Math.floor(this.stompDmg * 0.5) : this.stompDmg;
                            enemy.takeDamage(effectiveStompDmg, damageType);
                            
                            // Woodlands Defender/Champion slow chance
                            if (this.slowChance && Math.random() < this.slowChance) {
                                const slowValue = this.champion ? 0.3 : 0.5;
                                const slowDuration = this.champion ? 180 : 120;
                                enemy.addEffect({ type: 'slow', value: slowValue, duration: slowDuration, source: 'centaur' });
                            }
                            stomped = true;
                        }
                    }
                    if (stomped) {
                        this.stompCooldown = this.stompRate;
                        const effectColor = this.spinAttack ? '#22c55e' : '#84cc16';
                        particles.push({ type: 'pulse', x: this.x + TILE_SIZE/2, y: this.y + TILE_SIZE/2, radius: this.stompRange, life: 20, color: effectColor });
                    }
                }
            }
            
            performAoEBurst() {
                // Ensure we have valid properties with defaults
                const burstRange = this.aoeBurstRange || 250;
                const baseBurstDamage = this.aoeBurstDmg || 120;
                const burstDamage = this.darkCursed ? Math.floor(baseBurstDamage * 0.5) : baseBurstDamage;
                
                if (burstRange <= 0 || burstDamage <= 0) {
                    console.warn('Grovekeeper AoE burst has invalid properties');
                    return;
                }
                
                let hitEnemies = false;
                const towerCenterX = this.x + TILE_SIZE / 2;
                const towerCenterY = this.y + TILE_SIZE / 2;
                
                // Create a copy of enemies array to avoid modification during iteration
                const enemiesCopy = [...enemies];
                
                for (let i = 0; i < enemiesCopy.length; i++) {
                    const enemy = enemiesCopy[i];
                    if (!enemy || enemy.hp <= 0) continue;
                    
                    // Skip drill teams that are underground
                    if (enemy.special === 'drill' && enemy.isUnderground) {
                        continue;
                    }
                    
                    const dx = Math.abs(enemy.x - towerCenterX);
                    const dy = Math.abs(enemy.y - towerCenterY);
                    if (dx <= burstRange && dy <= burstRange) {
                        try {
                            // Check if enemy has takeDamage method before calling
                            if (typeof enemy.takeDamage === 'function') {
                                enemy.takeDamage(burstDamage, 'champion');
                            }
                            
                            // Apply slow effect on burst - but skip for slow immune enemies
                            if (this.slowChance && Math.random() < this.slowChance) {
                                if (typeof enemy.addEffect === 'function' && !enemy.slowImmune) {
                                    // Be extra careful with boss enemies
                                    if (enemy.boss || enemy.midBoss || enemy.special === 'titan' || enemy.special === 'empress') {
                                        // Apply weaker slow to bosses to avoid conflicts
                                        enemy.addEffect({ type: 'slow', value: 0.9, duration: 60, source: 'grovekeeper' });
                                    } else {
                                        // Normal slow for regular enemies
                                        enemy.addEffect({ type: 'slow', value: 0.4, duration: 180, source: 'grovekeeper' });
                                    }
                                }
                            }
                            hitEnemies = true;
                        } catch (error) {
                            console.error('Error in Grovekeeper AoE burst for enemy:', enemy, error);
                            // Continue with other enemies even if one fails
                        }
                    }
                }
                
                if (hitEnemies) {
                    // Create simple burst effect with validated radius
                    const particleRadius = Math.max(30, Math.min(burstRange, 150)); // Ensure radius is between 30-150
                    try {
                        particles.push({ 
                            type: 'explosion', 
                            x: towerCenterX, 
                            y: towerCenterY, 
                            radius: particleRadius, 
                            life: 30, 
                            color: '#22c55e' 
                        });
                    } catch (error) {
                        console.error('Error creating Grovekeeper particle:', error);
                    }
                }
            }
        }

        class BeastriderTower extends Tower {
            constructor(x, y, type) {
                super(x, y, type);
                this.movementCooldown = 0;
                this.originalX = x;
                this.movingUp = true;
                this.isFollowing = false;
                this.followTarget = null;
                this.followSteps = 0;
                this.maxFollowSteps = 5;
                this.stompCooldown = 0;
            }
            
            update() {
                this.fireCooldown = Math.max(0, this.fireCooldown - 1);
                this.movementCooldown = Math.max(0, this.movementCooldown - 1);
                this.stompCooldown = Math.max(0, this.stompCooldown - 1);
                
                // Handle movement every 2-3 game ticks
                if (this.movementCooldown === 0) {
                    this.handleMovement();
                    this.movementCooldown = 120 + Math.random() * 60; // 2-3 seconds
                }
                
                this.findTarget();
                if (this.target && this.fireCooldown === 0) { this.attack(); }
                this.stompAttack();
                
                // Champion abilities
                if (this.champion) {
                    this.buffCentaurs();
                }
                
                this.draw();
            }
            
            handleMovement() {
                if (this.isFollowing && this.followTarget) {
                    // Follow boss enemy with gradual movement, not teleporting
                    const targetX = this.followTarget.x - TILE_SIZE/2;
                    const targetY = this.followTarget.y - TILE_SIZE/2;
                    
                    // Calculate distance to target
                    const dist = Math.hypot(targetX - this.x, targetY - this.y);
                    
                    // Only move if boss is far enough away (prevent teleporting)
                    if (dist > TILE_SIZE * 2) {
                        // Move gradually toward the target, one tile at a time
                        const dx = targetX - this.x;
                        const dy = targetY - this.y;
                        
                        let newX = this.x;
                        let newY = this.y;
                        
                        // Move one tile toward target
                        if (Math.abs(dx) > Math.abs(dy)) {
                            newX = this.x + (dx > 0 ? TILE_SIZE : -TILE_SIZE);
                        } else {
                            newY = this.y + (dy > 0 ? TILE_SIZE : -TILE_SIZE);
                        }
                        
                        // Check if new position is valid (not obstructed)
                        if (newX >= 0 && newX < canvas.width && newY >= 0 && newY < canvas.height &&
                            !towers.some(t => t !== this && t.x === newX && t.y === newY) &&
                            !isOnPath(newX + TILE_SIZE/2, newY + TILE_SIZE/2)) {
                            this.x = newX;
                            this.y = newY;
                        }
                        
                        this.followSteps++;
                        
                        // Stop following after max steps or if target is dead
                        if (this.followSteps >= this.maxFollowSteps || this.followTarget.hp <= 0) {
                            this.isFollowing = false;
                            this.followTarget = null;
                            this.followSteps = 0;
                        }
                    } else {
                        // Too close to target, stop following
                        this.isFollowing = false;
                        this.followTarget = null;
                        this.followSteps = 0;
                    }
                } else {
                    // Normal up/down movement
                    const newY = this.movingUp ? this.y - TILE_SIZE : this.y + TILE_SIZE;
                    
                    // Check for obstructions or map boundaries
                    const tileY = Math.floor(newY / TILE_SIZE);
                    if (tileY < 0 || tileY >= MAP_HEIGHT_TILES || 
                        towers.some(t => t !== this && t.x === this.x && t.y === newY) ||
                        isOnPath(this.x + TILE_SIZE/2, newY + TILE_SIZE/2)) {
                        // Hit obstruction, change direction
                        this.movingUp = !this.movingUp;
                    } else {
                        // Move to new position
                        this.y = newY;
                    }
                }
            }
            
            findTarget() {
                this.target = null;
                let closestDist = Infinity;
                let bossInRange = null;
                
                for (const enemy of enemies) {
                    // Skip drill teams that are underground
                    if (enemy.special === 'drill' && enemy.isUnderground) {
                        continue;
                    }
                    
                    const towerCenterX = this.x + TILE_SIZE / 2;
                    const towerCenterY = this.y + TILE_SIZE / 2;
                    const dx = Math.abs(enemy.x - towerCenterX);
                    const dy = Math.abs(enemy.y - towerCenterY);
                    
                    if (dx <= this.range && dy <= this.range) {
                        const dist = Math.hypot(dx, dy);
                        if (dist < closestDist) {
                            closestDist = dist;
                            this.target = enemy;
                        }
                        
                        // Check for important boss monsters for following behavior (only titans and empresses)
                        if ((this.bossFollow && (enemy.special === 'titan' || enemy.special === 'empress')) && !this.isFollowing && dist < this.range * 0.8) {
                            bossInRange = enemy;
                        }
                    }
                }
                
                // Start following boss if in range
                if (bossInRange && !this.isFollowing) {
                    this.isFollowing = true;
                    this.followTarget = bossInRange;
                    this.followSteps = 0;
                }
            }
            
            attack() {
                this.fireCooldown = this.fireRate;
                const projectileImg = 'src/assets/images/expeditionandgames/towerD/shot1a.png';
                const damageType = this.champion ? 'champion' : 'physical';
                let effectiveDmg = this.getEffectiveDamage();
                
                // Beast empress/beastriders do less damage to airborne enemies
                if (this.target.isFlying) {
                    effectiveDmg = Math.floor(effectiveDmg * 0.5);
                }
                
                projectiles.push(new Projectile(this.x + TILE_SIZE / 2, this.y + TILE_SIZE / 2, this.target, effectiveDmg, this.projectileSpeed, this.projectileColor, damageType, projectileImg));
            }
            
            stompAttack() {
                if (this.stompCooldown === 0 && this.stompDmg) {
                    let stomped = false;
                    for (const enemy of enemies) {
                        // Skip airborne enemies for ground AOE attacks
                        if (enemy.isFlying) continue;
                        
                        const towerCenterX = this.x + TILE_SIZE / 2;
                        const towerCenterY = this.y + TILE_SIZE / 2;
                        const dx = Math.abs(enemy.x - towerCenterX);
                        const dy = Math.abs(enemy.y - towerCenterY);
                        if (dx <= this.stompRange && dy <= this.stompRange) {
                            const damageType = this.champion ? 'champion' : 'physical';
                            const effectiveStompDmg = this.darkCursed ? Math.floor(this.stompDmg * 0.5) : this.stompDmg;
                            enemy.takeDamage(effectiveStompDmg, damageType);
                            stomped = true;
                        }
                    }
                    if (stomped) {
                        this.stompCooldown = this.stompRate;
                        particles.push({ type: 'pulse', x: this.x + TILE_SIZE/2, y: this.y + TILE_SIZE/2, radius: this.stompRange, life: 20, color: '#a855f7' });
                    }
                }
            }
            
            // Buff nearby centaur towers (champion ability)
            buffCentaurs() {
                if (!this.champion || !this.centaurBuff) return;
                
                for (const tower of towers) {
                    if (tower.type === 'centaur') {
                        const dist = Math.hypot(
                            (tower.x + TILE_SIZE/2) - (this.x + TILE_SIZE/2),
                            (tower.y + TILE_SIZE/2) - (this.y + TILE_SIZE/2)
                        );
                        if (dist <= this.range) {
                            // Apply speed buff to centaur
                            tower.fireCooldown = Math.max(0, tower.fireCooldown - 1);
                        }
                    }
                }
            }

        class Projectile {
            constructor(x, y, target, dmg, speed, color, type = 'physical', sprite = null) {
                this.x = x; this.y = y; this.target = target;
                this.dmg = dmg; this.speed = speed; this.color = color;
                this.type = type; this.sprite = sprite;
                
                // For zigzag enemies, use gentler tracking to avoid over-leading
                this.gentleTracking = target && target.special === 'zigzag';
                this.trackingFrames = 0;
                
                if (sprite) {
                    this.img = new Image();
                    this.img.src = sprite;
                }
            }
            update() {
                if (!this.target || this.target.hp <= 0) return false;
                
                let targetX = this.target.x;
                let targetY = this.target.y;
                
                // For zigzag enemies, use gentler tracking by updating direction less frequently
                if (this.gentleTracking) {
                    this.trackingFrames++;
                    // Only update direction every 3 frames instead of every frame
                    if (this.trackingFrames % 3 === 0 || !this.lastAngle) {
                        this.lastAngle = Math.atan2(targetY - this.y, targetX - this.x);
                    }
                    // Use the stored angle instead of constantly recalculating
                    this.x += Math.cos(this.lastAngle) * this.speed;
                    this.y += Math.sin(this.lastAngle) * this.speed;
                } else {
                    // Normal tracking for non-zigzag enemies
                    const angle = Math.atan2(targetY - this.y, targetX - this.x);
                    this.x += Math.cos(angle) * this.speed;
                    this.y += Math.sin(angle) * this.speed;
                }
                
                if (Math.hypot(targetX - this.x, targetY - this.y) < this.speed) {
                    this.target.takeDamage(this.dmg, this.type);
                    return false;
                }
                return true;
            }
            draw() {
                if (this.img && this.img.complete) {
                    ctx.drawImage(this.img, this.x - 8, this.y - 8, 16, 16);
                } else {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        class MageProjectile extends Projectile {
            constructor(x, y, target, dmg, speed, color, aoeRadius, slow = null, slowDuration = 0, sprite = null, isFrostWizard = false, damageType = 'magic') {
                super(x, y, target, dmg, speed, color, damageType, sprite);
                this.aoeRadius = aoeRadius;

                this.slowDuration = slowDuration;
                this.isFrostWizard = isFrostWizard;
            }
            update() {
                if (!this.target || this.target.hp <= 0) return false;
                
                let targetX = this.target.x;
                let targetY = this.target.y;
                
                // Apply gentle tracking for zigzag enemies
                if (this.gentleTracking) {
                    this.trackingFrames++;
                    if (this.trackingFrames % 3 === 0 || !this.lastAngle) {
                        this.lastAngle = Math.atan2(targetY - this.y, targetX - this.x);
                    }
                    this.x += Math.cos(this.lastAngle) * this.speed;
                    this.y += Math.sin(this.lastAngle) * this.speed;
                } else {
                    const angle = Math.atan2(targetY - this.y, targetX - this.x);
                    this.x += Math.cos(angle) * this.speed;
                    this.y += Math.sin(angle) * this.speed;
                }
                
                if (Math.hypot(targetX - this.x, targetY - this.y) < this.speed) {
                    // AOE damage with square range
                    for (const enemy of enemies) {
                        // Skip drill teams that are underground
                        if (enemy.special === 'drill' && enemy.isUnderground) {
                            continue;
                        }
                        
                        const dx = Math.abs(enemy.x - this.x);
                        const dy = Math.abs(enemy.y - this.y);
                        if (dx <= this.aoeRadius && dy <= this.aoeRadius) {
                            enemy.takeDamage(this.dmg, this.type);
                            // Apply frost slow effect
                            if (this.slow && this.slowDuration > 0) {
                                const source = this.type === 'champion' ? 'championMage' : (this.isFrostWizard ? 'frostWizard' : 'mage');
                                enemy.addEffect({ type: 'slow', value: this.slow, duration: this.slowDuration, source: source });
                            }
                        }
                    }
                    const effectColor = this.slow ? '#38bdf8' : '#a78bfa';
                    particles.push({ type: 'explosion', x: this.x, y: this.y, radius: this.aoeRadius, life: 15, color: effectColor });
                    return false;
                }
                return true;
            }
        }

        // --- Game Flow & UI ---
        function setupPlacementTiles() {
            placementTiles = [];
            const pathTiles = new Set();
            for (let i = 0; i < path.length - 1; i++) {
                const start = path[i];
                const end = path[i+1];
                if (start.x === end.x) {
                    for (let y = Math.min(start.y, end.y); y <= Math.max(start.y, end.y); y++) pathTiles.add(`${start.x},${y}`);
                } else {
                     for (let x = Math.min(start.x, end.x); x <= Math.max(start.x, end.x); x++) pathTiles.add(`${x},${start.y}`);
                }
            }
            for (let y = 0; y < MAP_HEIGHT_TILES; y++) {
                for (let x = 0; x < MAP_WIDTH_TILES; x++) {
                    if (!pathTiles.has(`${x},${y}`)) {
                        placementTiles.push({ x: x * TILE_SIZE, y: y * TILE_SIZE, occupied: false });
                    }
                }
            }
        }

        function drawMap() {
            // Create paving stone pattern for path background
            const pathWidth = TILE_SIZE;
            const halfWidth = pathWidth / 2;
            
            // Draw the main path with enhanced styling
            for (let i = 0; i < path.length - 1; i++) {
                const currentPoint = path[i];
                const nextPoint = path[i + 1];
                
                const startX = currentPoint.x * TILE_SIZE + (i === 0 ? 0 : TILE_SIZE / 2);
                const startY = currentPoint.y * TILE_SIZE + TILE_SIZE / 2;
                const endX = nextPoint.x * TILE_SIZE + TILE_SIZE / 2;
                const endY = nextPoint.y * TILE_SIZE + TILE_SIZE / 2;
                
                // Calculate path direction for proper width
                const isHorizontal = Math.abs(endX - startX) > Math.abs(endY - startY);
                
                if (isHorizontal) {
                    // Horizontal path segment
                    const minX = Math.min(startX, endX);
                    const maxX = Math.max(startX, endX);
                    const y = startY;
                    
                    // Draw paving stone background
                    ctx.fillStyle = '#d1d5db'; // Light gray
                    ctx.fillRect(minX, y - halfWidth, maxX - minX, pathWidth);
                    
                    // Add paving stone texture
                    ctx.strokeStyle = '#9ca3af'; // Darker gray for stone lines
                    ctx.lineWidth = 1;
                    for (let x = minX; x < maxX; x += 20) {
                        for (let stoneY = y - halfWidth; stoneY < y + halfWidth; stoneY += 15) {
                            ctx.strokeRect(x, stoneY, 20, 15);
                        }
                    }
                    
                    // Draw gold outline (no blue)
                    ctx.strokeStyle = '#daac17'; // Gold from CSS variables
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(minX, y - halfWidth);
                    ctx.lineTo(maxX, y - halfWidth);
                    ctx.moveTo(minX, y + halfWidth);
                    ctx.lineTo(maxX, y + halfWidth);
                    ctx.stroke();
                    
                } else {
                    // Vertical path segment
                    const minY = Math.min(startY, endY);
                    const maxY = Math.max(startY, endY);
                    const x = startX;
                    
                    // Draw paving stone background
                    ctx.fillStyle = '#d1d5db'; // Light gray
                    ctx.fillRect(x - halfWidth, minY, pathWidth, maxY - minY);
                    
                    // Add paving stone texture
                    ctx.strokeStyle = '#9ca3af'; // Darker gray for stone lines
                    ctx.lineWidth = 1;
                    for (let y = minY; y < maxY; y += 15) {
                        for (let stoneX = x - halfWidth; stoneX < x + halfWidth; stoneX += 20) {
                            ctx.strokeRect(stoneX, y, 20, 15);
                        }
                    }
                    
                    // Draw gold outline (no blue)
                    ctx.strokeStyle = '#daac17'; // Gold from CSS variables
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(x - halfWidth, minY);
                    ctx.lineTo(x - halfWidth, maxY);
                    ctx.moveTo(x + halfWidth, minY);
                    ctx.lineTo(x + halfWidth, maxY);
                    ctx.stroke();
                }
            }
            
            // Draw corner connections with proper styling
            for (let i = 1; i < path.length - 1; i++) {
                const x = path[i].x * TILE_SIZE + TILE_SIZE / 2;
                const y = path[i].y * TILE_SIZE + TILE_SIZE / 2;
                
                // Draw corner background
                ctx.fillStyle = '#d1d5db'; // Light gray
                ctx.fillRect(x - halfWidth, y - halfWidth, pathWidth, pathWidth);
                
                // Add paving stone texture to corners
                ctx.strokeStyle = '#9ca3af'; // Darker gray for stone lines
                ctx.lineWidth = 1;
                for (let cornerY = y - halfWidth; cornerY < y + halfWidth; cornerY += 15) {
                    for (let cornerX = x - halfWidth; cornerX < x + halfWidth; cornerX += 20) {
                        ctx.strokeRect(cornerX, cornerY, 20, 15);
                    }
                }
                
                // Draw gold outline for corners (no blue)
                ctx.strokeStyle = '#daac17'; // Gold from CSS variables
                ctx.lineWidth = 3;
                ctx.strokeRect(x - halfWidth, y - halfWidth, pathWidth, pathWidth);
            }
            
            // Draw enhanced gate area - top-down view with parapets
            const lastPathPoint = path[path.length - 1];
            const gateX = lastPathPoint.x * TILE_SIZE + TILE_SIZE / 2; // Center on the path end point
            const gateY = lastPathPoint.y * TILE_SIZE + TILE_SIZE / 2; // Center vertically in the tile
            
            // Gate dimensions for top-down view - DOUBLED SIZE
            const gateWidth = TILE_SIZE * 1.6; // Doubled from 0.8
            const gateHeight = TILE_SIZE * 0.6; // Doubled from 0.3
            const gateOffsetX = -gateWidth / 2; // Center horizontally
            const gateOffsetY = -gateHeight / 2; // Center vertically
            
            // Parapet dimensions - DOUBLED SIZE
            const parapetWidth = TILE_SIZE * 0.3; // Doubled from 0.15
            const parapetHeight = TILE_SIZE * 1.4; // Doubled from 0.7
            const parapetOffsetY = -parapetHeight / 2; // Center vertically with gate
            
            // Draw left parapet
            ctx.fillStyle = '#94a3b8'; // Silver/gray
            ctx.fillRect(gateX + gateOffsetX - parapetWidth, gateY + parapetOffsetY, parapetWidth, parapetHeight);
            ctx.strokeStyle = '#475569'; // Darker gray outline
            ctx.lineWidth = 2;
            ctx.strokeRect(gateX + gateOffsetX - parapetWidth, gateY + parapetOffsetY, parapetWidth, parapetHeight);
            
            // Draw right parapet
            ctx.fillStyle = '#94a3b8'; // Silver/gray
            ctx.fillRect(gateX + gateOffsetX + gateWidth, gateY + parapetOffsetY, parapetWidth, parapetHeight);
            ctx.strokeStyle = '#475569'; // Darker gray outline
            ctx.lineWidth = 2;
            ctx.strokeRect(gateX + gateOffsetX + gateWidth, gateY + parapetOffsetY, parapetWidth, parapetHeight);
            
            // Draw main gate - blue and silver gradient
            const gateGradient = ctx.createLinearGradient(gateX + gateOffsetX, gateY + gateOffsetY, gateX + gateOffsetX + gateWidth, gateY + gateOffsetY);
            gateGradient.addColorStop(0, '#3b82f6'); // Blue
            gateGradient.addColorStop(0.5, '#94a3b8'); // Silver
            gateGradient.addColorStop(1, '#3b82f6'); // Blue
            ctx.fillStyle = gateGradient;
            ctx.fillRect(gateX + gateOffsetX, gateY + gateOffsetY, gateWidth, gateHeight);
            
            // Gate outline
            ctx.strokeStyle = '#1e40af'; // Darker blue
            ctx.lineWidth = 2;
            ctx.strokeRect(gateX + gateOffsetX, gateY + gateOffsetY, gateWidth, gateHeight);
            
            // Add decorative details to gate (top-down view of gate bars/reinforcement)
            ctx.strokeStyle = '#64748b'; // Medium gray
            ctx.lineWidth = 2; // Slightly thicker for visibility
            // Vertical reinforcement lines
            for (let i = 1; i < 4; i++) {
                const lineX = gateX + gateOffsetX + (gateWidth / 4) * i;
                ctx.beginPath();
                ctx.moveTo(lineX, gateY + gateOffsetY + 4);
                ctx.lineTo(lineX, gateY + gateOffsetY + gateHeight - 4);
                ctx.stroke();
            }
            
            // Add small defensive details to parapets (crenellations from top-down view)
            ctx.fillStyle = '#475569'; // Dark gray
            // Left parapet crenellations - DOUBLED SIZE
            for (let i = 0; i < 3; i++) {
                const crenY = gateY + parapetOffsetY + (parapetHeight / 4) * (i + 0.5);
                ctx.fillRect(gateX + gateOffsetX - parapetWidth - 6, crenY, 6, parapetHeight / 6);
            }
            // Right parapet crenellations - DOUBLED SIZE
            for (let i = 0; i < 3; i++) {
                const crenY = gateY + parapetOffsetY + (parapetHeight / 4) * (i + 0.5);
                ctx.fillRect(gateX + gateOffsetX + gateWidth + parapetWidth, crenY, 6, parapetHeight / 6);
            }
        }
        
        function drawPlacementOverlay(mouseX, mouseY) {
            if (!selectedTower) return;
            const tileX = Math.floor(mouseX / TILE_SIZE) * TILE_SIZE;
            const tileY = Math.floor(mouseY / TILE_SIZE) * TILE_SIZE;
            const tile = placementTiles.find(t => t.x === tileX && t.y === tileY);
            ctx.globalAlpha = 0.6;
            ctx.fillStyle = (tile && !tile.occupied) ? '#22c55e' : '#ef4444'; // Brighter green/red
            ctx.fillRect(tileX, tileY, TILE_SIZE, TILE_SIZE);
            // Draw square range preview with brighter color and thicker outline
            const range = TOWER_DATA[selectedTower].stats[0].range;
            ctx.strokeStyle = '#fbbf24'; // Bright gold/yellow
            ctx.lineWidth = 4; // Increased from 2 to 4
            ctx.strokeRect(
                tileX + TILE_SIZE/2 - range,
                tileY + TILE_SIZE/2 - range,
                range * 2,
                range * 2
            );
            ctx.globalAlpha = 1.0;
        }

            if (waveInProgress) {
                if (endlessMode) {
                    // In endless mode, hide manual controls during wave
                    startWaveButton.style.display = 'none';
                    queueWaveButton.style.display = 'none';
                } else {
                    startWaveButton.style.display = 'none';
                    queueWaveButton.style.display = 'block';

            // Check if any Beastrider champion exists to unlock Animal Fighter
            const hasBeastriderChampion = towers.some(tower => 
                tower.type === 'beastrider' && tower.champion && tower.spawnAnimals
            );
            
            if (hasBeastriderChampion && !availableTowers.includes('animal')) {
                availableTowers.push('animal');
                populateTowerButtons();
                logMessage("Animal Fighter tower unlocked!");

                availableTowers = availableTowers.filter(t => t !== 'animal');
                populateTowerButtons();
            }
