                { left: pad, top: pad + step },
                { left: pad + step, top: pad + step },
            ];
            const raw = offsets[Math.min(existing, offsets.length - 1)];
            const maxLeft = Math.max(pad, cellSize - tokenSize - 1);
            const maxTop = Math.max(pad, cellSize - tokenSize - 1);
            el.style.left = `${clamp(raw.left, pad, maxLeft)}px`;
            el.style.top = `${clamp(raw.top, pad, maxTop)}px`;

            el.addEventListener('mouseenter', (e) => {
                const reasonText = key.acquisition ? stripHtml(key.acquisition) : '';
                showMapTooltip(
                    e,
                    `<b>🗝 KEY</b><br>` +
                    `<span style="opacity:0.9">${stripHtml(ent.title || '')}</span>` +
                    `${reasonText ? `<br><span style="opacity:0.75">Source: ${reasonText}</span>` : ''}`
                );
            });
            el.addEventListener('mousemove', moveMapTooltip);
            el.addEventListener('mouseleave', () => scheduleHideMapTooltip(160));
            el.addEventListener('click', (e) => e.stopPropagation());

            cellDiv.appendChild(el);
            return id;
        };

        const grantKeyToParty = (keyId) => {
            if (!dungeonMapState) return;
            if (!dungeonMapState.collectedKeys) dungeonMapState.collectedKeys = new Set();
            dungeonMapState.collectedKeys.add(keyId);
            const layout = dungeonMapState.layout;
            if (layout?.keysById?.[keyId]) layout.keysById[keyId].collected = true;
            updateDoorAndRoomLockVisuals();
        };

        const showNpcKeyholderUiForRoom = (roomId) => {
            if (!dungeonMapState?.layout) return false;
            if (!anyPlayerInRoom(roomId)) return false;
            const npc = findNpcKeyholderInRoom(roomId);
            if (!npc) return false;

            if (!dungeonMapState.npcBonusesById) dungeonMapState.npcBonusesById = {};
            const savedBonus = Number(dungeonMapState.npcBonusesById[npc.id] ?? 0);

            const attempts = npc.attempts || { charm: false, intimidate: false };
            npc.attempts = attempts;

            if (!Number.isFinite(npc.basePrice)) npc.basePrice = weightedLowInt(100, 1500, 2.2);
            if (!Number.isFinite(npc.priceMultiplier)) npc.priceMultiplier = 1;
            if (!Array.isArray(npc.priceHikes)) npc.priceHikes = [];
            if (typeof npc.canBuy !== 'boolean') npc.canBuy = roll(0.7);
            const currentPrice = Math.max(50, Math.round(npc.basePrice * npc.priceMultiplier));

            const allTried = !!attempts.charm && !!attempts.intimidate;
            const priceNote = (npc.priceMultiplier > 1.01)
                ? `<div class="text-xs text-gray-400">Base ${npc.basePrice} gp "¢ Markup ${(Math.round((npc.priceMultiplier - 1) * 100))}%</div>`
                : `<div class="text-xs text-gray-400">Base ${npc.basePrice} gp</div>`;

            const html = `
                <div class="font-semibold text-gray-100">Keyholder NPC</div>
                <div class="text-sm text-gray-400">They have the key for <b>${stripHtml(npc.doorId || 'a locked door')}</b>. DC <b>${npc.dc}</b>.</div>
                ${npc.canBuy ? `<div class="mt-1 text-sm text-gray-300">Buy price: <b>${currentPrice} gp</b></div>${priceNote}` : `<div class="mt-1 text-sm text-amber-300">This NPC will not sell the key.</div>`}
                <div class="mt-2 text-sm text-gray-300">
                    <label>Skill bonus
                        <input id="npc-bonus-${npc.id}" type="number" value="${Number.isFinite(savedBonus) ? savedBonus : 0}"
                            class="ml-2 w-20 bg-gray-800 text-gray-100 border border-gray-700 rounded-md px-2 py-1" />
                    </label>
                </div>
                <div class="mt-2 flex flex-wrap gap-2">
                    ${npc.canBuy ? `<button id="npc-buy-${npc.id}" class="btn-generate bg-sky-900 hover:bg-sky-800 text-white font-bold py-2 px-3 rounded-lg text-xs">Buy (${currentPrice} gp)</button>` : ''}
                    <button id="npc-charm-${npc.id}" class="btn-generate bg-purple-900 hover:bg-purple-800 text-white font-bold py-2 px-3 rounded-lg text-xs" ${attempts.charm ? 'disabled' : ''}>Charm</button>
                    <button id="npc-intimidate-${npc.id}" class="btn-generate bg-rose-900 hover:bg-rose-800 text-white font-bold py-2 px-3 rounded-lg text-xs" ${attempts.intimidate ? 'disabled' : ''}>Intimidate</button>
                    ${allTried ? `<button id="npc-fight-${npc.id}" class="btn-generate bg-red-900 hover:bg-red-800 text-white font-bold py-2 px-3 rounded-lg text-xs">Fight</button>` : ''}
                </div>
                <div id="npc-result-${npc.id}" class="mt-2 text-sm text-gray-300">${npc.lastResultHtml || ''}</div>
            `;
            renderDungeonInfo(html);

            const readBonus = () => {
                const inp = document.getElementById(`npc-bonus-${npc.id}`);
                const bonus = parseInt(inp?.value ?? '0', 10);
                const safe = Number.isFinite(bonus) ? bonus : 0;
                dungeonMapState.npcBonusesById[npc.id] = safe;
                return safe;
            };

            const doBuy = () => {
                // Buying is purely a cost; no roll.
                if (!npc.canBuy) return;
                const priceNow = Math.max(50, Math.round((npc.basePrice || 100) * (npc.priceMultiplier || 1)));
                spawnKeyTokenAt(npc.x, npc.y, npc.keyId, 'purchased');
                npc.resolved = true;
                npc.purchased = true;
                if (npc.entityId) removeEntityFromMap(npc.entityId);
                npc.lastResultHtml = `<div class="font-semibold text-sky-300">Purchased</div><div class="text-gray-300">Honor system: you pay <b>${priceNow} gp</b>. The key is dropped on the ground.</div>`;
                renderDungeonInfo(npc.lastResultHtml);
                appendDungeonHistory({
                    tag: 'KEY',
                    message: `Purchased ${npc.keyId} for ${priceNow} gp`,
                    detailHtml: `Door: <b>${stripHtml(npc.doorId || '')}</b> "¢ Room ID ${npc.roomId}`,
                });
            };

            const doRoll = (mode) => {
                const bonus = readBonus();
                npc.attempts[mode] = true;
                const rollVal = randInt(1, 20);
                const total = rollVal + bonus;
                const ok = total >= npc.dc;
                if (ok) {
                    spawnKeyTokenAt(npc.x, npc.y, npc.keyId, mode === 'charm' ? 'charmed' : 'intimidated');
                    npc.resolved = true;
                    if (npc.entityId) removeEntityFromMap(npc.entityId);
                    npc.lastResultHtml = `<div class="font-semibold text-green-300">Success</div><div class="text-gray-300">Roll: ${rollVal} + ${bonus} = <b>${total}</b> vs DC ${npc.dc}. The key is dropped on the ground.</div>`;
                    renderDungeonInfo(npc.lastResultHtml);
                    appendDungeonHistory({
                        tag: 'CHECK',
                        message: `${mode.toUpperCase()} success (d20 ${rollVal} + ${bonus} = ${total} vs DC ${npc.dc})`,
                        detailHtml: `NPC: <b>${npc.id}</b> "¢ Key: <b>${npc.keyId}</b> "¢ Room ID ${npc.roomId}`,
                    });
                    return;
                }

                // Failure: social backfires â†' price goes up if you later decide to buy.
                let priceBumpHtml = '';
                if ((mode === 'charm' || mode === 'intimidate') && !npc.purchased) {
                    const hikePct = randInt(15, 35);
                    npc.priceMultiplier = (Number(npc.priceMultiplier) || 1) * (1 + (hikePct / 100));
                    npc.priceHikes = Array.isArray(npc.priceHikes) ? npc.priceHikes : [];
                    npc.priceHikes.push(hikePct);
                    const newPrice = Math.max(50, Math.round((npc.basePrice || 100) * npc.priceMultiplier));
                    priceBumpHtml = `<div class=\"text-amber-300 mt-1\">Price increases by <b>${hikePct}%</b> â†' <b>${newPrice} gp</b>.</div>`;
                }

                appendDungeonHistory({
                    tag: 'CHECK',
                    message: `${mode.toUpperCase()} fail (d20 ${rollVal} + ${bonus} = ${total} vs DC ${npc.dc})`,
                    detailHtml: `NPC: <b>${npc.id}</b> "¢ Room ID ${npc.roomId}`,
                });

                npc.lastResultHtml = `<div class="font-semibold text-rose-300">Failed</div><div class="text-gray-300">Roll: ${rollVal} + ${bonus} = <b>${total}</b> vs DC ${npc.dc}.</div>${priceBumpHtml}`;
                // Re-render to update button disabled states / enable Fight if needed / update Buy price.
                showNpcKeyholderUiForRoom(roomId);
            };

            const buyBtn = document.getElementById(`npc-buy-${npc.id}`);
            const charmBtn = document.getElementById(`npc-charm-${npc.id}`);
            const intimidateBtn = document.getElementById(`npc-intimidate-${npc.id}`);
            buyBtn?.addEventListener('click', () => doBuy());
            charmBtn?.addEventListener('click', () => doRoll('charm'));
            intimidateBtn?.addEventListener('click', () => doRoll('intimidate'));

            const fightBtn = document.getElementById(`npc-fight-${npc.id}`);
            fightBtn?.addEventListener('click', () => {
                // Combat fallback: key is acquired.
                spawnKeyTokenAt(npc.x, npc.y, npc.keyId, 'combat');
                npc.resolved = true;
                if (npc.entityId) removeEntityFromMap(npc.entityId);
                renderDungeonInfo(`<div class="font-semibold text-gray-100">Combat</div><div class="text-sm text-gray-300 mt-1">You choose violence. You take the key.</div>`);
                appendDungeonHistory({
                    tag: 'COMBAT',
                    message: `Fought NPC ${npc.id} for ${npc.keyId}`,
                    detailHtml: `Door: <b>${stripHtml(npc.doorId || '')}</b> "¢ Room ID ${npc.roomId}`,
                });
            });

            return true;
        };

        const applyDungeonZoom = (cellSize) => {
            const gridEl = document.getElementById('dungeon-grid');
            if (!gridEl) return;
            const size = clamp(Number(cellSize) || 26, 16, 44);
            const tokenSize = clamp(Math.round(size * 0.55), 10, 26);
            gridEl.style.setProperty('--dungeon-cell', `${size}px`);
            gridEl.style.setProperty('--dungeon-token', `${tokenSize}px`);
            // Ensure the grid template respects the new cell size.
            if (dungeonMapState?.layout) {
                const w = dungeonMapState.layout.width;
                const h = dungeonMapState.layout.height;
                gridEl.style.gridTemplateColumns = `repeat(${w}, ${size}px)`;
                gridEl.style.gridTemplateRows = `repeat(${h}, ${size}px)`;
            }

            // Recompute token sizes/positions to match the new zoom
            const cells = Array.from(gridEl.children);
            const pad = 2;
            const baseToken = tokenSize;
            const step = baseToken + 1;
            const offsets = [
                { left: pad, top: pad },
                { left: pad + step, top: pad },
                { left: pad, top: pad + step },
                { left: pad + step, top: pad + step },
            ];
            for (const cellDiv of cells) {
                const tokens = Array.from(cellDiv.querySelectorAll('.dungeon-token'));
                tokens.forEach((el, idx) => {
                    const slots = clamp(Number(el.dataset.sizeSlots) || 1, 1, 4);
                    const raw = offsets[Math.min(idx, offsets.length - 1)];
                    const sized = slots === 1 ? baseToken : Math.max(baseToken * slots, slots * size - 4);
                    const maxLeft = Math.max(pad, size - sized - 1);
                    const maxTop = Math.max(pad, size - sized - 1);
                    el.style.left = `${clamp(raw.left, pad, maxLeft)}px`;
                    el.style.top = `${clamp(raw.top, pad, maxTop)}px`;
                    el.style.width = `${sized}px`;
                    el.style.height = `${sized}px`;
                    if (slots > 1) {
                        el.style.borderRadius = `${Math.max(10, Math.round(sized / 5))}px`;
                    }
                });
            }
        };

        const formatEncounterHtml = (enc) => {
            if (!enc) return `<div class="text-gray-400 italic">No encounter here.</div>`;
            return `
                <div class="font-semibold text-gray-100">${enc.name} <span class="text-gray-400">(CR ${enc.cr})</span></div>
                <div class="text-sm text-gray-300 mt-1 leading-snug">${enc.description || ''}</div>
            `;
        };

        const renderDungeonInfo = (info) => {
            const el = document.getElementById('dungeon-info');
            if (!el) return;
            el.innerHTML = info;
        };

        const updateSelectedTokenUi = () => {
            const gridEl = document.getElementById('dungeon-grid');
            if (!gridEl) return;
            gridEl.querySelectorAll('.dungeon-token').forEach((t) => {
                const id = t.dataset.entityId;
                if (id && dungeonMapState?.selectedEntityId && id === dungeonMapState.selectedEntityId) t.classList.add('selected');
                else t.classList.remove('selected');
            });
        };

        const moveEntityTo = (entityId, x, y, opts = {}) => {
            if (!dungeonMapState) return;
            const layout = dungeonMapState.layout;
            if (!layout) return;
            if (x < 0 || y < 0 || x >= layout.width || y >= layout.height) return;
            const cell = layout.grid[y][x];
            if (!cell || cell.type === 'wall') return;

            const ent = dungeonMapState.entities.find(e => e.id === entityId);
            if (!ent) return;
            if (ent.kind === 'feature' && ent.source?.kind === 'glimpse') return;

            const prevRoomId = (ent.kind === 'player') ? getRoomIdAt(layout, ent.x, ent.y) : null;

            // Locked door check (only blocks players)
            if (cell.doorId && layout.doorsById && layout.doorsById[cell.doorId]) {
                const door = layout.doorsById[cell.doorId];
                if (door.locked && ent.kind === 'player') {
                    const hasKey = dungeonMapState.collectedKeys && dungeonMapState.collectedKeys.has(door.keyId);
                    if (!hasKey) {
                        renderDungeonInfo(`<div class="font-semibold text-gray-100">Locked Door</div><div class="text-sm text-gray-300 mt-1">You need the key from another room to pass.</div>`);
                        return;
                    }
                    // unlock on first pass
                    door.locked = false;
                    const doorCell = layout.grid[door.y][door.x];
                    if (doorCell) doorCell.doorLocked = false;
                    // Update door mark
                    const gridEl = document.getElementById('dungeon-grid');
                    if (gridEl) {
                        const idx = door.y * layout.width + door.x;
                        const cellDiv = gridEl.children[idx];
                        const mark = cellDiv?.querySelector('.cell-mark.door');
                        if (mark) mark.textContent = 'D';
                    }
                    renderDungeonInfo(`<div class="font-semibold text-gray-100">Door Unlocked</div><div class="text-sm text-gray-300 mt-1">Key fits. The lock clicks open.</div>`);

                        appendDungeonHistory({
                            tag: 'DOOR',
                            message: `Unlocked ${door.id} with ${door.keyId}`,
                            detailHtml: `Tile: (${door.x}, ${door.y}) "¢ Leads to room ${door.targetRoomId}`,
                        });

                    updateDoorAndRoomLockVisuals();
                }
            }
            ent.x = x;
            ent.y = y;

                if (ent.kind === 'player') {
                    const nextRoomId = getRoomIdAt(layout, x, y);
                    if (nextRoomId != null && nextRoomId !== prevRoomId) {
                        const room = layout.rooms?.[nextRoomId];
                        appendDungeonHistory({
                            tag: 'MOVE',
                            message: `${ent.title || ent.label} entered ${stripHtml(room?.roomName || 'Room')}`,
                            detailHtml: `Room ID ${nextRoomId} "¢ ${stripHtml(room?.roomType || '')}`,
                        });
                    }
                }

            // Move DOM node
            const gridEl = document.getElementById('dungeon-grid');
            if (!gridEl) return;
            const tokenEl = gridEl.querySelector(`.dungeon-token[data-entity-id="${CSS.escape(entityId)}"]`);
            if (!tokenEl) return;
            const targetCellIndex = y * layout.width + x;
            const targetCellDiv = gridEl.children[targetCellIndex];
            if (!targetCellDiv) return;
            targetCellDiv.appendChild(tokenEl);

            // Key pickup (players only)
            if (ent.kind === 'player' && cell.keyId && layout.keysById && layout.keysById[cell.keyId]) {
                const key = layout.keysById[cell.keyId];
                if (!key.collected) {
                    key.collected = true;
                    if (!dungeonMapState.collectedKeys) dungeonMapState.collectedKeys = new Set();
                    dungeonMapState.collectedKeys.add(key.id);

                    // Remove key token from DOM + entities
                    dungeonMapState.entities = dungeonMapState.entities.filter(e => e.id !== key.entityId);
                    const keyEl = gridEl.querySelector(`.dungeon-token[data-entity-id="${CSS.escape(key.entityId)}"]`);
                    if (keyEl && keyEl.parentElement) keyEl.parentElement.removeChild(keyEl);

                    renderDungeonInfo(`<div class="font-semibold text-gray-100">Key Found</div><div class="text-sm text-gray-300 mt-1">You picked up a key. It should open a locked door elsewhere.</div>`);

                    appendDungeonHistory({
                        tag: 'KEY',
                        message: `${ent.title || ent.label} picked up ${key.id}`,
                        detailHtml: `Opens: <b>${stripHtml(key.doorId || '')}</b> "¢ Source: ${stripHtml(key.acquisition || 'floor')}`,
                    });

                    updateDoorAndRoomLockVisuals();
                }
            }

            // Glimpses: surface the view when a player stands on the anchor.
            if (ent.kind === 'player' && cell.glimpse) {
                const infoEl = document.getElementById('dungeon-info');
                const gHtml = renderGlimpseHtml(cell.glimpse);
                if (infoEl) infoEl.innerHTML = `${infoEl.innerHTML || ''}${gHtml}`;
                else renderDungeonInfo(gHtml);
            }

            // NPC keyholder interaction (buttons appear when a player is in the room)
            if (ent.kind === 'player') {
                const roomId = getRoomIdAt(layout, x, y);
                if (roomId != null) showNpcKeyholderUiForRoom(roomId);

                // Hazard movement penalties
                if (cell.hazard && cell.hazard > 0) {
                    const hazardNames = {
                        1: 'Deep Water', 2: 'Lava', 3: 'Pit', 4: 'Shallow Water',
                        5: 'Mud', 6: 'Bramble', 7: 'Sand', 8: 'Ice', 9: 'Thin Ice',
                        10: 'Poison', 11: 'Magic Gas'
                    };
                    const hazardName = hazardNames[cell.hazard] || 'Hazard';
                    
                    // Scale DC and damage with dungeon depth (estimated by distance from start)
                    const distFromStart = Math.abs(x - startRoom.cx) + Math.abs(y - startRoom.cy);
                    const depthFactor = Math.floor(distFromStart / 10);
                    const baseDC = 12 + depthFactor;
                    const baseDamage = 1 + Math.floor(depthFactor / 2);

                    let message = '';
                    let detailHtml = '';

                    switch (cell.hazard) {
                        case 2: // Lava
                            message = `${ent.title || ent.label} takes fire damage from lava`;
                            detailHtml = `${baseDamage}d6 fire damage (DC ${baseDC} DEX save for half)`;
                            break;
                        case 3: // Pit
                            message = `${ent.title || ent.label} cannot cross the pit`;
                            detailHtml = `Blocked by bottomless pit`;
                            break;
                        case 8: // Ice
                        case 9: // Thin Ice
                            message = `${ent.title || ent.label} slips on ice`;
                            detailHtml = `DC ${baseDC} DEX save or prone`;
                            break;
                        case 10: // Poison
                            message = `${ent.title || ent.label} exposed to poison`;
                            detailHtml = `DC ${baseDC} CON save or ${baseDamage}d4 poison damage`;
                            break;
                        case 11: // Magic Gas
                            message = `${ent.title || ent.label} breathes magic gas`;
                            detailHtml = `DC ${baseDC} CON save or disoriented (disadvantage next action)`;
                            break;
                        default:
                            message = `${ent.title || ent.label} enters ${hazardName.toLowerCase()}`;
                            detailHtml = `DC ${baseDC} check recommended`;
                    }

                    appendDungeonHistory({
                        tag: 'HAZARD',
                        message,
                        detailHtml,
                    });
                }
            }

            if (!opts?.skipTeleportCheck) {
                const tp = getTeleporterAt(x, y);
                if (tp?.target) {
                    if (tp.target.x === x && tp.target.y === y) return;
                    appendDungeonHistory({
                        tag: 'TELEPORT',
                        message: `${ent.title || ent.label} teleports via ${tp.color}`,
                        detailHtml: `(${x}, ${y}) â†' (${tp.target.x}, ${tp.target.y})`,
                    });
                    moveEntityTo(entityId, tp.target.x, tp.target.y, { skipTeleportCheck: true });
                }
            }
        };

        const generateDungeonLayout = (opts) => {
            const width = opts?.width ?? 50;
            const height = opts?.height ?? 30;
            const targetRooms = opts?.rooms ?? 10;
            const corridorMin = opts?.corridorMin ?? 10;
            const corridorMax = opts?.corridorMax ?? 10;
            const corridorWidth = opts?.corridorWidth ?? 2;

            const maxAttempts = clamp(
                parseInt(opts?.maxAttempts ?? '', 10) || Math.round(clamp(targetRooms, 3, 60) * 140),
                200,
                5000
            );
            const roomBuffer = clamp(parseInt(opts?.roomBuffer ?? '1', 10) || 1, 0, 2);

            const startRoomSizeMin = clamp(parseInt(opts?.startRoomSizeMin ?? '4', 10) || 4, 3, 14);
            const startRoomSizeMax = clamp(parseInt(opts?.startRoomSizeMax ?? '4', 10) || 4, startRoomSizeMin, 16);
            const roomSizeMin = clamp(parseInt(opts?.roomSizeMin ?? '8', 10) || 8, 3, 14);
            const roomSizeMax = clamp(parseInt(opts?.roomSizeMax ?? '10', 10) || 10, roomSizeMin, 16);

            const grid = Array.from({ length: height }, (_, y) =>
                Array.from({ length: width }, (_, x) => ({
                    x,
                    y,
                    type: 'wall',
                    roomId: null,
                    corridor: false,
                    corridorType: null,
                    encounter: null,
                    doorId: null,
                    doorLocked: false,
                    keyId: null,
                    npcId: null,
                    hazard: 0,
                    props: [],
                    carpet: null,
                }))
            );

            const rooms = [];
            const connections = [];
            const inBounds = (x, y) => x >= 0 && y >= 0 && x < width && y < height;
            const getCell = (x, y) => (inBounds(x, y) ? grid[y][x] : null);

            // Helper functions (used by both modes)
            const canPlaceRoom = (x1, y1, w, h) => {
                const x2 = x1 + w - 1;
                const y2 = y1 + h - 1;
                if (x1 < 1 || y1 < 1 || x2 > width - 2 || y2 > height - 2) return false;
                for (let y = y1 - roomBuffer; y <= y2 + roomBuffer; y++) {
                    for (let x = x1 - roomBuffer; x <= x2 + roomBuffer; x++) {
                        const c = getCell(x, y);
                        if (!c) return false;
                        if (c.type === 'room') return false;
                    }
                }
                return true;
            };

            const carveRoom = (x1, y1, w, h, roomType) => {
                const id = rooms.length;
                const x2 = x1 + w - 1;
                const y2 = y1 + h - 1;
                for (let y = y1; y <= y2; y++) {
                    for (let x = x1; x <= x2; x++) {
                        const c = getCell(x, y);
                        if (!c) continue;
                        c.type = 'room';
                        c.roomId = id;
                    }
                }
                const cx = Math.floor((x1 + x2) / 2);
                const cy = Math.floor((y1 + y2) / 2);
                rooms.push({ id, x1, y1, x2, y2, cx, cy, roomType });
                return rooms[rooms.length - 1];
            };

            const setCorridorCell = (x, y, corridorType) => {
                const c = getCell(x, y);
                if (!c) return;
                if (c.type === 'room') return;
                if (c.type === 'wall') c.type = 'corridor';
                c.corridor = true;
                if (corridorType) c.corridorType = corridorType;
            };

            const carveCorridorPath = (from, to, corridorType) => {
                const points = [];
                const goHorizFirst = Math.random() < 0.5;
                const stepLine = (x0, y0, x1, y1) => {
                    let x = x0;
                    let y = y0;
                    const dx = Math.sign(x1 - x0);
                    const dy = Math.sign(y1 - y0);
                    points.push({ x, y, dx, dy });
                    while (x !== x1 || y !== y1) {
                        if (x !== x1) x += dx;
                        else if (y !== y1) y += dy;
                        points.push({ x, y, dx, dy });
                    }
                };
                if (goHorizFirst) {
                    stepLine(from.cx, from.cy, to.cx, from.cy);
                    stepLine(to.cx, from.cy, to.cx, to.cy);
                } else {
                    stepLine(from.cx, from.cy, from.cx, to.cy);
                    stepLine(from.cx, to.cy, to.cx, to.cy);
                }

                for (let i = 0; i < points.length; i++) {
                    const p = points[i];
                    setCorridorCell(p.x, p.y, corridorType);
                    if (corridorWidth >= 2) {
                        if (p.dx !== 0) {
                            setCorridorCell(p.x, p.y + 1, corridorType);
                            setCorridorCell(p.x, p.y - 1, corridorType);
                        } else if (p.dy !== 0) {
                            setCorridorCell(p.x + 1, p.y, corridorType);
                            setCorridorCell(p.x - 1, p.y, corridorType);
                        } else {
                            setCorridorCell(p.x + 1, p.y, corridorType);
                            setCorridorCell(p.x, p.y + 1, corridorType);
                        }
                    }
                }
                return points;
            };

            // Initialize attempt tracking for both modes
            let attempts = 0;
            
            // Cellarways Mode: narrow-maze corridor generation (Master Reference section 4.2)
            if (opts?.cellarwaysMode) {
                const corridorDensity = 0.5; // Controls maze branchiness
                const roomWMin = 3, roomWMax = 6;
                const roomHMin = 3, roomHMax = 6;
                const cellarRoomClusterBias = 0.3; // Junction â†' chamber conversion rate
                const cellarPocketRate = 0.15; // Pocket chamber creation rate
                const cellarLoopFactor = 0.25; // Loop carving rate
                
                // Step 1: DFS maze carving on corridor grid (1-cell-wide corridors)
                const visited = new Set();
                const stack = [];
                const cx = Math.floor(width / 2);
                const cy = Math.floor(height / 2);
                stack.push([cx, cy]);
                visited.add(`${cx},${cy}`);
                
                while (stack.length > 0) {
                    const [x, y] = stack[stack.length - 1];
                    const c = getCell(x, y);
                    if (c && c.type === 'wall') {
                        c.type = 'corridor';
                        c.corridor = true;
                    }
                    
                    const dirs = [[0, 2], [2, 0], [0, -2], [-2, 0]];
                    shuffleInPlace(dirs);
                    let carved = false;
                    
                    for (const [dx, dy] of dirs) {
                        if (Math.random() > corridorDensity) continue; // Density throttle
                        const nx = x + dx;
                        const ny = y + dy;
                        if (!inBounds(nx, ny)) continue;
                        if (nx < 1 || ny < 1 || nx >= width - 1 || ny >= height - 1) continue;
                        const key = `${nx},${ny}`;
                        if (visited.has(key)) continue;
                        
                        // Carve connector
                        const mx = x + dx / 2;
                        const my = y + dy / 2;
                        const mc = getCell(mx, my);
                        if (mc && mc.type === 'wall') {
                            mc.type = 'corridor';
                            mc.corridor = true;
                        }
                        
                        visited.add(key);
                        stack.push([nx, ny]);
                        carved = true;
                        break;
                    }
                    
                    if (!carved) stack.pop();
                }
                
                // Step 2: Carve rectangular rooms
                const roomAttempts = targetRooms * 4;
                for (let i = 0; i < roomAttempts && rooms.length < targetRooms; i++) {
                    attempts++;
                    const rw = randInt(roomWMin, roomWMax);
                    const rh = randInt(roomHMin, roomHMax);
                    const rx1 = randInt(2, width - rw - 2);
                    const ry1 = randInt(2, height - rh - 2);
                    
                    // Check for overlap
                    let overlap = false;
                    for (let ry = ry1; ry < ry1 + rh && !overlap; ry++) {
                        for (let rx = rx1; rx < rx1 + rw && !overlap; rx++) {
                            const rc = getCell(rx, ry);
                            if (rc && rc.type === 'room') overlap = true;
                        }
                    }
                    if (overlap) continue;
                    
                    // Carve room
                    const roomId = rooms.length;
                    const roomType = weightedRandom(roomTypes);
                    for (let ry = ry1; ry < ry1 + rh; ry++) {
                        for (let rx = rx1; rx < rx1 + rw; rx++) {
                            const rc = getCell(rx, ry);
                            if (rc) {
                                rc.type = 'room';
                                rc.roomId = roomId;
                                rc.corridor = false;
                            }
                        }
                    }
                    const rcx = Math.floor(rx1 + rw / 2);
                    const rcy = Math.floor(ry1 + rh / 2);
                    rooms.push({ id: roomId, x1: rx1, y1: ry1, x2: rx1 + rw - 1, y2: ry1 + rh - 1, cx: rcx, cy: rcy, roomType });
                }
                
                // Step 3: Promote junctions to chambers
                for (let y = 2; y < height - 2; y++) {
                    for (let x = 2; x < width - 2; x++) {
                        const c = getCell(x, y);
                        if (!c || c.type !== 'corridor') continue;
                        if (Math.random() > cellarRoomClusterBias) continue;
                        
                        // Convert 3x3 patch to chamber
                        const chamberId = rooms.length;
                        const chamberType = weightedRandom(roomTypes);
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                const cc = getCell(x + dx, y + dy);
                                if (cc && cc.type === 'corridor') {
                                    cc.type = 'room';
                                    cc.roomId = chamberId;
                                    cc.corridor = false;
                                }
                            }
                        }
                        rooms.push({ id: chamberId, x1: x - 1, y1: y - 1, x2: x + 1, y2: y + 1, cx: x, cy: y, roomType: chamberType });
                    }
                }
                
                // Step 4: Add pocket chambers
                for (let y = 2; y < height - 2; y++) {
                    for (let x = 2; x < width - 2; x++) {
                        const c = getCell(x, y);
                        if (!c || c.type !== 'corridor') continue;
                        if (Math.random() > cellarPocketRate) continue;
                        
                        const pocketId = rooms.length;
                        const pocketType = weightedRandom(roomTypes);
                        for (let dy = -1; dy <= 1; dy++) {
                            for (let dx = -1; dx <= 1; dx++) {
                                const pc = getCell(x + dx, y + dy);
                                if (pc && pc.type === 'wall') {
                                    pc.type = 'room';
                                    pc.roomId = pocketId;
                                }
                            }
                        }
                        rooms.push({ id: pocketId, x1: x - 1, y1: y - 1, x2: x + 1, y2: y + 1, cx: x, cy: y, roomType: pocketType });
                    }
                }
                
                // Step 5: Trim dead ends
                for (let pass = 0; pass < 2; pass++) {
                    for (let y = 1; y < height - 1; y++) {
                        for (let x = 1; x < width - 1; x++) {
                            const c = getCell(x, y);
                            if (!c || c.type !== 'corridor') continue;
                            
                            const neighbors = [getCell(x + 1, y), getCell(x - 1, y), getCell(x, y + 1), getCell(x, y - 1)]
                                .filter(n => n && (n.type === 'corridor' || n.type === 'room'));
                            if (neighbors.length <= 1) {
                                c.type = 'wall';
                                c.corridor = false;
                            }
                        }
                    }
                }
                
                // Step 6: Carve loops
                for (let y = 2; y < height - 2; y++) {
                    for (let x = 2; x < width - 2; x++) {
                        const c = getCell(x, y);
                        if (!c || c.type !== 'wall') continue;
                        if (Math.random() > cellarLoopFactor) continue;
                        
                        const corridorNeighbors = [getCell(x + 1, y), getCell(x - 1, y), getCell(x, y + 1), getCell(x, y - 1)]
                            .filter(n => n && n.type === 'corridor');
                        if (corridorNeighbors.length >= 2) {
                            c.type = 'corridor';
                            c.corridor = true;
                        }
                    }
                }
                
                // Step 7: Ensure connectivity (punch connectors from rooms to corridors)
                for (const room of rooms) {
                    let hasConnection = false;
                    for (let ry = room.y1; ry <= room.y2 && !hasConnection; ry++) {
                        for (let rx = room.x1; rx <= room.x2 && !hasConnection; rx++) {
                            const adjacents = [getCell(rx + 1, ry), getCell(rx - 1, ry), getCell(rx, ry + 1), getCell(rx, ry - 1)];
                            for (const adj of adjacents) {
                                if (adj && adj.type === 'corridor') {
                                    hasConnection = true;
                                    break;
                                }
                            }
                        }
                    }
                    
                    if (!hasConnection) {
                        // Punch a connector
                        const edgeCells = [];
                        for (let ry = room.y1; ry <= room.y2; ry++) {
                            edgeCells.push([room.x1, ry], [room.x2, ry]);
                        }
                        for (let rx = room.x1; rx <= room.x2; rx++) {
                            edgeCells.push([rx, room.y1], [rx, room.y2]);
                        }
                        shuffleInPlace(edgeCells);
                        
                        for (const [ex, ey] of edgeCells) {
                            const adjacents = [[ex + 1, ey], [ex - 1, ey], [ex, ey + 1], [ex, ey - 1]];
                            for (const [ax, ay] of adjacents) {
                                const ac = getCell(ax, ay);
                                if (ac && ac.type === 'wall') {
                                    ac.type = 'corridor';
                                    ac.corridor = true;
                                    hasConnection = true;
                                    break;
                                }
                            }
                            if (hasConnection) break;
                        }
                    }
                }
                
                // Assign start room as largest or center-most room
                if (rooms.length > 0) {
                    rooms.sort((a, b) => {
                        const sizeA = (a.x2 - a.x1) * (a.y2 - a.y1);
                        const sizeB = (b.x2 - b.x1) * (b.y2 - b.y1);
                        return sizeB - sizeA;
                    });
                }
            } else {
                // Standard Mode: original room + corridor generation
                // Start room at center
                const startRoomW = randInt(startRoomSizeMin, startRoomSizeMax);
                const startRoomH = randInt(startRoomSizeMin, startRoomSizeMax);
                const startX1 = Math.floor(width / 2) - Math.floor(startRoomW / 2);
                const startY1 = Math.floor(height / 2) - Math.floor(startRoomH / 2);
                const startType = weightedRandom(roomTypes);
                carveRoom(startX1, startY1, startRoomW, startRoomH, startType);

                // Add more rooms
                attempts = 0; // Reset for standard mode
                while (rooms.length < targetRooms && attempts < maxAttempts) {
                    attempts++;
                    const parent = getRandomElement(rooms);
                    const dir = getRandomElement([
                        { dx: 1, dy: 0 },
                        { dx: -1, dy: 0 },
                        { dx: 0, dy: 1 },
                        { dx: 0, dy: -1 },
                    ]);
                    const corridorLen = randInt(corridorMin, corridorMax);
                    const endX = parent.cx + dir.dx * corridorLen;
                    const endY = parent.cy + dir.dy * corridorLen;
                    if (!inBounds(endX, endY)) continue;

                    const w = randInt(roomSizeMin, roomSizeMax);
                    const h = randInt(roomSizeMin, roomSizeMax);
                    const x1 = endX - Math.floor(w / 2);
                    const y1 = endY - Math.floor(h / 2);
                    const roomType = weightedRandom(roomTypes);
                    if (!canPlaceRoom(x1, y1, w, h)) continue;

                    const newRoom = carveRoom(x1, y1, w, h, roomType);
                    const corridorType = weightedRandom(corridorTypes);
                    const points = carveCorridorPath(parent, newRoom, corridorType);
                    connections.push({ fromId: parent.id, toId: newRoom.id, corridorType, points });
                }
            }

            const startRoom = rooms[0] || { id: 0, cx: Math.floor(width / 2), cy: Math.floor(height / 2) };

            // Gather floor cells
            const corridorCells = [];
            const roomCellsById = new Map();
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const c = grid[y][x];
                    if (c.type === 'corridor') corridorCells.push(c);
                    if (c.type === 'room' && typeof c.roomId === 'number') {
                        if (!roomCellsById.has(c.roomId)) roomCellsById.set(c.roomId, []);
                        roomCellsById.get(c.roomId).push(c);
                    }
                }
            }

            // Corridor encounters: one per connection by default (with light chance), plus guarantee at least 1.
            const combatSkew = clamp(Number(opts?.combatSkew ?? 0) || 0, 0, 100) / 100;
            const corridorEncounterCells = [];
            
            // Standard mode uses connections, Cellarways uses corridor cell sampling
            if (!opts?.cellarwaysMode) {
                for (const conn of connections) {
                    if (!conn?.points?.length) continue;
                    const baseChance = 0.82;
                    const chance = clamp(baseChance + 0.15 * combatSkew, 0, 0.97);
                    if (!roll(chance)) continue;
                    const usable = conn.points
                        .map((p) => getCell(p.x, p.y))
                        .filter((c) => c && c.type === 'corridor');
                    if (!usable.length) continue;
                    const mid = usable[Math.floor(usable.length / 2)];
                    if (Math.abs(mid.x - startRoom.cx) + Math.abs(mid.y - startRoom.cy) < 4) continue;
                    // Calculate corridor length for spatial requirements
                    const corridorInfo = { type: 'corridor', length: usable.length };
                    mid.encounter = pickCorridorEncounterForMap(corridorInfo);
                    corridorEncounterCells.push(mid);
                }
            }

            // Extra corridor encounters when skew is high
            if (combatSkew > 0.25 && corridorCells.length) {
                const desiredExtra = Math.floor(combatSkew * Math.min(10, Math.max(2, connections.length)) * 0.8);
                let added = 0;
                const candidates = corridorCells
                    .filter((c) => !c.encounter)
                    .filter((c) => Math.abs(c.x - startRoom.cx) + Math.abs(c.y - startRoom.cy) >= 6);
                shuffleInPlace(candidates);
                for (const c of candidates) {
                    if (added >= desiredExtra) break;
                    // Estimate corridor length from nearby corridor cells
                    const nearbyCorridor = corridorCells.filter(cc => 
                        Math.abs(cc.x - c.x) <= 6 && Math.abs(cc.y - c.y) <= 6
                    );
                    const corridorInfo = { type: 'corridor', length: Math.max(3, nearbyCorridor.length) };
                    c.encounter = pickCorridorEncounterForMap(corridorInfo);
                    corridorEncounterCells.push(c);
                    added++;
                }
            }

            if (corridorEncounterCells.length === 0 && corridorCells.length) {
                const far = corridorCells
                    .filter((c) => Math.abs(c.x - startRoom.cx) + Math.abs(c.y - startRoom.cy) >= 6);
                const pick = (far.length ? getRandomElement(far) : getRandomElement(corridorCells));
                if (pick) {
                    // Estimate corridor length
                    const nearbyCorridor = corridorCells.filter(cc => 
                        Math.abs(cc.x - pick.x) <= 6 && Math.abs(cc.y - pick.y) <= 6
                    );
                    const corridorInfo = { type: 'corridor', length: Math.max(3, nearbyCorridor.length) };
                    pick.encounter = pickCorridorEncounterForMap(corridorInfo);
                    corridorEncounterCells.push(pick);
                }
            }

            // Room encounters: reuse your existing odds
            for (const r of rooms) {
                if (r.id === startRoom.id) continue;
                const isWindowGallery = r.roomType === 'Window Gallery Room';
                const base = isWindowGallery ? 0.50 : 0.33;
                const chance = clamp(base + 0.50 * combatSkew, 0, 0.95);
                // Calculate room area for spatial requirements
                const roomInfo = { type: 'room', area: r.width * r.height };
                if (roll(chance)) r.encounter = pickRoomEncounterForMap(r.roomType, { combatSkew: opts?.combatSkew, spawnBosses: opts?.spawnBosses }, roomInfo);
            }

            // Locked doors + keys: pick 1""3 non-start rooms, lock their hall entrance, and place a key in another room.
            const doorsById = {};
            const keysById = {};
            const npcKeyholdersById = {};
            const candidateConns = connections.filter(c => c && typeof c.toId === 'number' && c.toId !== startRoom.id);
            const lockedTargetIds = new Set();
            shuffleInPlace(candidateConns);
            const autoLockCount = clamp(Math.floor(rooms.length / 4), 1, 3);
            const desiredLockCountRaw = opts?.keyCount;
            const desiredLockCount = (desiredLockCountRaw == null) ? null : Number(desiredLockCountRaw);
            let lockCount = autoLockCount;
            if (desiredLockCount != null && Number.isFinite(desiredLockCount)) {
                lockCount = clamp(Math.floor(desiredLockCount), 0, 12);
            }
            lockCount = Math.min(lockCount, candidateConns.length);
            let placedLocks = 0;

            for (const conn of candidateConns) {
                if (placedLocks >= lockCount) break;
                const toRoom = rooms[conn.toId];
                if (!toRoom) continue;
                lockedTargetIds.add(toRoom.id);
                toRoom.locked = true;
                // Choose the last corridor cell in the connection points as the doorway tile.
                const corridorCellsOnPath = (conn.points || []).map(p => getCell(p.x, p.y)).filter(c => c && c.type === 'corridor');
                if (!corridorCellsOnPath.length) continue;
                const doorCell = corridorCellsOnPath[corridorCellsOnPath.length - 1];
                if (!doorCell) continue;
                if (Math.abs(doorCell.x - startRoom.cx) + Math.abs(doorCell.y - startRoom.cy) < 5) continue;

                const doorId = `door-${placedLocks + 1}`;
                const keyId = `key-${placedLocks + 1}`;
                doorsById[doorId] = {
                    id: doorId,
                    x: doorCell.x,
                    y: doorCell.y,
                    locked: true,
                    keyId,
                    targetRoomId: toRoom.id,
                    corridorType: doorCell.corridorType || conn.corridorType || 'Corridor',
                };
                doorCell.doorId = doorId;
                doorCell.doorLocked = true;

                // Place key in a different room (not start, not the locked room, not behind another lock)
                const keyRoomCandidates = rooms.filter(r => r.id !== startRoom.id && r.id !== toRoom.id && !lockedTargetIds.has(r.id));
                if (!keyRoomCandidates.length) continue;
                const keyRoom = getRandomElement(keyRoomCandidates);
                const keyCells = roomCellsById.get(keyRoom.id) || [];
                if (!keyCells.length) continue;
                const keyCell = getRandomElement(keyCells);
                if (!keyCell) continue;

                // Some keys are held by an NPC instead of lying on the floor.
                const npcHeld = roll(0.5);
                if (npcHeld) {
                    const npcId = `npc-${placedLocks + 1}`;
                    keyCell.npcId = npcId;
                    const basePrice = weightedLowInt(100, 1500, 2.2);
                    npcKeyholdersById[npcId] = {
                        id: npcId,
                        keyId,
                        doorId,
                        roomId: keyRoom.id,
                        x: keyCell.x,
                        y: keyCell.y,
                        dc: randInt(12, 18),
                        basePrice,
                        priceMultiplier: 1,
                        priceHikes: [],
                        canBuy: roll(0.7),
                        attempts: { charm: false, intimidate: false },
                        resolved: false,
                        entityId: null,
                    };
                    keysById[keyId] = {
                        id: keyId,
                        x: null,
                        y: null,
                        collected: false,
                        doorId,
                        roomId: keyRoom.id,
                        entityId: null,
                        acquisition: 'npc',
                        npcId,
                    };
                } else {
                    keyCell.keyId = keyId;
                    keysById[keyId] = {
                        id: keyId,
                        x: keyCell.x,
                        y: keyCell.y,
                        collected: false,
                        doorId,
                        roomId: keyRoom.id,
                        entityId: null,
                        acquisition: 'floor',
                    };
                }

                placedLocks++;
            }

            // Keep keys (and NPC keyholders) out of any locked room to prevent soft locks.
            const lockedRoomIds = new Set(Array.from(lockedTargetIds));
            const moveKeyOutOfLockedRoom = (key) => {
                if (!lockedRoomIds.has(key.roomId)) return;
                const clearOldMarkers = () => {
                    const oldCells = roomCellsById.get(key.roomId) || [];
                    for (const c of oldCells) {
                        if (c.keyId === key.id) delete c.keyId;
                        if (key.npcId && c.npcId === key.npcId) delete c.npcId;
                    }
                };

                const unlockedRooms = rooms.filter(r => r.id !== startRoom.id && !lockedRoomIds.has(r.id));
                const targetRoom = unlockedRooms.length ? getRandomElement(unlockedRooms) : startRoom;
                const targetCells = roomCellsById.get(targetRoom.id) || [];
                if (!targetCells.length) return;
                const spot = getRandomElement(targetCells);

                clearOldMarkers();

                key.roomId = targetRoom.id;
                if (key.acquisition === 'npc' && key.npcId && npcKeyholdersById[key.npcId]) {
                    const npc = npcKeyholdersById[key.npcId];
                    npc.roomId = targetRoom.id;
                    npc.x = spot.x;
                    npc.y = spot.y;
                    spot.npcId = npc.id;
                    key.x = null;
                    key.y = null;
                } else {
                    key.x = spot.x;
                    key.y = spot.y;
                    spot.keyId = key.id;
                }
            };

            for (const key of Object.values(keysById)) {
                moveKeyOutOfLockedRoom(key);
            }

            const pickCr4LockedEncounter = (roomType) => {
                const specific = roomSpecificEncounters[roomType];
                const basePool = (specific && specific.length) ? specific : roomEncounters;
                const filterCombat = (arr) => (arr || []).filter(e => {
                    const v = e.value || e;
                    const cr = v?.cr ?? 0;
                    return cr >= 4 && !isNonCombatEncounter(v) && !isEnvironmentalEncounter(v);
                });
                const pool = filterCombat(basePool);
                if (pool.length) return weightedRandomEncounter(pool);
                const fallback = filterCombat(roomEncounters);
                if (fallback.length) return weightedRandomEncounter(fallback);
                return weightedRandomEncounter(roomEncounters) || { name: 'Locked Patrol', cr: 4, description: 'Hostile patrol secures this room.' };
            };

            for (const rid of lockedRoomIds) {
                const room = rooms[rid];
                if (!room) continue;
                room.locked = true;
                if (!room.encounter || (room.encounter.cr ?? 0) < 4 || isNonCombatEncounter(room.encounter) || isEnvironmentalEncounter(room.encounter)) {
                    room.encounter = pickCr4LockedEncounter(room.roomType);
                }
                if (!room.lockLoot) room.lockLoot = generateLockedRoomLoot(room.roomType);
            }

            // Room decoration transforms (hazards & props)
            if (opts?.roomDecoration && rooms.length > 1) {
                const decoratableRooms = rooms.filter(r => r.id !== startRoom.id);
                shuffleInPlace(decoratableRooms);

                const fillRoomHazard = (room, hazardCode) => {
                    const cells = roomCellsById.get(room.id) || [];
                    for (const c of cells) {
                        if (c.type === 'room') c.hazard = hazardCode;
                    }
                };

                const addRoomProp = (room, kind) => {
                    const cells = roomCellsById.get(room.id) || [];
                    if (!cells.length) return;
                    const pick = getRandomElement(cells);
                    if (!pick.props) pick.props = [];
                    pick.props.push({ kind, x: pick.x, y: pick.y });
                };

                const addRoomProps = (room, kinds, count) => {
                    for (let i = 0; i < count; i++) {
                        addRoomProp(room, getRandomElement(kinds));
                    }
                };

                const addCarpet = (room, variant) => {
                    const cells = roomCellsById.get(room.id) || [];
                    const carpetCells = cells.filter(c => {
                        const dx = Math.abs(c.x - room.cx);
                        const dy = Math.abs(c.y - room.cy);
                        const w2 = Math.max(1, Math.floor((room.x2 - room.x1) / 2) - 1);
                        const h2 = Math.max(1, Math.floor((room.y2 - room.y1) / 2) - 1);
                        return dx <= w2 && dy <= h2;
                    });
                    for (const c of carpetCells) {
                        c.carpet = variant;
                    }
                };

                // Classroom-specific decoration rules (from Master Reference section 10.4)
                const classroomRules = {
                    // Music Classroom (Master Reference 10.4)
                    'Club & Society Rooms': (room) => {
                        addCarpet(room, 'carpet-music');
                        addRoomProps(room, ['pedestal'], 1); // Conductor pedestal near front
                        addRoomProps(room, ['chair'], randInt(6, 10)); // Ring seating
                        addRoomProps(room, ['table'], randInt(2, 4)); // Music stands
                        if (Math.random() < 0.3) addRoomProps(room, ['stage'], 1);
                        addRoomProps(room, ['harp', 'horn', 'drum', 'lyre'], randInt(3, 6)); // Instrument markers scattered
                    },
                    // Art Classroom (Master Reference 10.4)
                    'Museum & Trophy Gallery': (room) => {
                        addCarpet(room, 'carpet-art');
                        addRoomProps(room, ['desk'], 1); // Instructor desk at front center, 2x1
                        addRoomProps(room, ['table'], randInt(3, 5)); // Work tables at 1.2x0.9
                        addRoomProps(room, ['chair'], randInt(2, 4)); // Occasional chair as stool
                        addRoomProps(room, ['easel', 'pedestal'], randInt(3, 6)); // Easels along back wall + optional central pedestal
                    },
                    // Alchemy Classroom (Master Reference 10.4)
                    'Magical & Arcane Facility': (room) => {
                        addCarpet(room, 'carpet-alchemy');
                        addRoomProps(room, [Math.random() < 0.5 ? 'stove' : 'pump'], 1); // Instructor apparatus at front center
                        addRoomProps(room, ['table'], randInt(3, 6)); // Lab benches at 1.4x0.9 in rows
                        addRoomProps(room, ['barrel', 'crate'], randInt(2, 5)); // Reagent storage along wall
                    },
                    // Oratory Hall (Master Reference 10.4) - NEW
                    'Oratory & Rhetoric': (room) => {
                        addCarpet(room, 'carpet-oratory');
                        addRoomProps(room, ['dais'], 1); // Dais across front
                        addRoomProps(room, ['bench'], randInt(4, 8)); // Audience benches in widening rows
                        if (Math.random() < 0.4) addRoomProps(room, ['banner'], randInt(1, 2));
                    },
                    // Herbalism Classroom (Master Reference 10.4) - NEW
                    'Herbalism & Potions': (room) => {
                        addCarpet(room, 'carpet-herbalism');
                        addRoomProps(room, ['pedestal'], 1); // Specimen pedestal in center
                        addRoomProps(room, ['table'], randInt(2, 4)); // Mix tables at 1.2x0.9
                        addRoomProps(room, ['shrub', 'flowers', 'planter', 'vine'], randInt(5, 9)); // Flora around perimeter
                    },
                    // Culinary Classroom (Master Reference 10.4)
                    'Dining & Domestic Facility': (room) => {
                        addCarpet(room, 'carpet-culinary');
                        addRoomProps(room, ['stove'], randInt(2, 4)); // Front demo line: multiple stoves
                        addRoomProps(room, ['table'], randInt(3, 5)); // Prep islands at 1.4x0.9
                        addRoomProps(room, ['barrel', 'crate'], randInt(2, 4)); // Back storage
                        if (Math.random() < 0.3) addRoomProps(room, ['pump'], randInt(1, 2)); // Occasional pump in storage
                    },
                    // Garden Studies (Master Reference 10.4)
                    'Botanical & Greenhouse Space': (room) => {
                        addCarpet(room, 'carpet-garden');
                        if (Math.random() < 0.4) {
                            addRoomProps(room, [Math.random() < 0.5 ? 'fountain-water' : 'fountain-empty'], 1); // Optional fountain at 2x2
                        }
                        addRoomProps(room, ['flowers', 'shrub'], randInt(6, 12)); // Beds: flowers/shrub in rows
                        addRoomProps(room, ['bench'], randInt(2, 4)); // Side benches at 1.4x0.6
                    },
                    // Teleportation Theory (Master Reference 10.4)
                    'Sanctum & Meditation': (room) => {
                        addCarpet(room, 'carpet-teleportation');
                        addRoomProps(room, ['desk'], 1); // Desk slightly lowered
                        addRoomProps(room, ['teleport-pad'], randInt(5, 9)); // Ring of pads (1x1, note "calibration pad")
                        if (Math.random() < 0.3) addRoomProps(room, ['portal'], 1); // Optional portal at center (1.6x1.6)
                    },
                    // General Classroom (Master Reference 10.4)
                    'Lecture & Study Space': (room) => {
                        // No carpet for general classroom
                        addRoomProps(room, ['desk'], 1); // Teacher desk at front center, 2x1, note "teacher desk"
                        addRoomProps(room, ['chair'], randInt(4, 8)); // Student clutter: chairs at 0.8x0.8 (70% chance)
                        addRoomProps(room, ['table'], randInt(2, 5)); // tables at 1x0.8 (40% chance)
                        if (Math.random() < 0.3) addRoomProps(room, ['chalkboard', 'bookshelf'], randInt(1, 2));
                    },
                    'Library & Archive Wing': (room) => {
                        addRoomProps(room, ['bookshelf', 'reading-table', 'scroll-rack', 'tome', 'archive-box'], randInt(6, 10));
                    },
                    'Arcane Training Chamber': (room) => {
                        addRoomProps(room, ['circle', 'rune-stone', 'crystal', 'candelabra', 'practice-dummy'], randInt(3, 5));
                    },
                    'Security & Detention Facility': (room) => {
                        addRoomProps(room, ['cage', 'chain', 'shackle', 'lock', 'guard-station'], randInt(2, 4));
                    },
                    'Observatory & Astral Lab': (room) => {
                        addRoomProps(room, ['telescope', 'star-chart', 'astrolabe', 'lens', 'observatory-dome'], randInt(2, 5));
                    },
                    'Magitech Infrastructure': (room) => {
                        addRoomProps(room, ['console', 'pipe', 'valve', 'gauge', 'conduit', 'panel'], randInt(4, 7));
                    },
                    'Abandoned Academy Space': (room) => {
                        addRoomProps(room, ['debris', 'broken-desk', 'torn-banner', 'rubble', 'cobweb'], randInt(3, 6));
                    },
                    'Foundational & Ancient Structure': (room) => {
                        addRoomProps(room, ['ancient-pillar', 'stone-altar', 'rune-wall', 'foundation-stone'], randInt(1, 3));
                    },
                };

                // Hazard rooms (rarer, applied to ~15% of decoratable rooms)
                const hazardRooms = [
                    { name: 'graveyard', hazard: 0, props: ['tombstone', 'grave', 'skull', 'coffin', 'crypt-door'], count: [3, 5] },
                    { name: 'lava', hazard: 2, props: ['lava-vent', 'volcanic-rock', 'heat-grate'], count: [2, 3] },
                    { name: 'pit', hazard: 3, props: ['pit-edge', 'broken-floor', 'warning-sign'], count: [1, 2] },
                    { name: 'ice', hazard: 8, props: ['ice-pike', 'frozen-surface', 'icicle'], count: [2, 4] },
                    { name: 'poison', hazard: 10, props: ['bones', 'skull', 'toxic-pool', 'dead-plant'], count: [2, 4] },
                    { name: 'gas', hazard: 11, props: ['gas-vent', 'warning-glyph', 'vapor-cloud'], count: [1, 3] },
                    { name: 'water', hazard: 1, props: ['water-barrel', 'puddle', 'leak', 'moss'], count: [2, 4] },
                ];

                // Apply hazard decorations to ~15% of rooms
                const hazardCount = Math.max(1, Math.floor(decoratableRooms.length * 0.15));
                for (let i = 0; i < hazardCount && i < decoratableRooms.length; i++) {
                    const room = decoratableRooms[i];
                    const hazardType = getRandomElement(hazardRooms);
                    
                    if (hazardType.hazard > 0) fillRoomHazard(room, hazardType.hazard);
                    
                    const propCount = randInt(...hazardType.count);
                    addRoomProps(room, hazardType.props, propCount);
                    
                    room.decorationType = hazardType.name;
                }

                // Apply classroom-specific decorations to remaining rooms
                for (let i = hazardCount; i < decoratableRooms.length; i++) {
                    const room = decoratableRooms[i];
                    const rule = classroomRules[room.roomType];
                    
                    if (rule) {
                        rule(room);
                        room.decorationType = room.roomType;
                    }
                }
            }

            // If we got a very low room count, retry once with a tighter packing rule.
            // (This helps when the user chooses tight constraints like large rooms or small maps.)
            if (!opts?._retryPass) {
                const minAcceptable = Math.min(targetRooms, Math.max(4, Math.floor(targetRooms * 0.6)));
                if (rooms.length < minAcceptable) {
                    return generateDungeonLayout({
                        ...opts,
                        roomBuffer: 0,
                        maxAttempts: Math.min(8000, maxAttempts * 2),
                        _retryPass: 1,
                    });
                }
            }

            return {
                width,
                height,
                grid,
                rooms,
                startRoom,
                roomCellsById,
                corridorEncounterCells,
                doorsById,
                keysById,
                npcKeyholdersById,
                lockedRoomIds: Array.from(lockedRoomIds),
                generationMeta: {
                    requestedRooms: targetRooms,
                    roomsPlaced: rooms.length,
                    attempts,
                    maxAttempts,
                    roomBuffer,
                    retryPass: opts?._retryPass ? 1 : 0,
                },
            };
        };

        const renderDungeonMap = (layout, mountEl) => {
            const { width, height, grid, rooms, startRoom, roomCellsById, corridorEncounterCells } = layout;
            layout.teleportersByColor = layout.teleportersByColor || {};
            const collectedKeys = dungeonMapState?.collectedKeys ?? new Set();
            const sealedRoomIds = computeSealedRoomIds(layout, collectedKeys);
            const canFetchBundled = (typeof location !== 'undefined') && location.protocol !== 'file:';

            const getCell = (x, y) => (grid?.[y]?.[x]) || null;
            const isBoundaryCell = (cell, x, y) => {
                if (!cell || cell.type === 'wall') return false;
                const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
                return dirs.some(([dx, dy]) => {
                    const n = getCell(x + dx, y + dy);
                    return !n || n.type === 'wall';
                });
            };

            const ensureGlimpseAnchors = () => {
                const anchors = [];
                const roomBoundaryById = new Map();
                const corridorBoundary = [];

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const cell = getCell(x, y);
                        if (!isBoundaryCell(cell, x, y)) continue;
                        if (cell.type === 'room') {
                            if (!roomBoundaryById.has(cell.roomId)) roomBoundaryById.set(cell.roomId, []);
                            roomBoundaryById.get(cell.roomId).push({ x, y, cell });
                        } else if (cell.type === 'corridor') {
                            corridorBoundary.push({ x, y, cell });
                        }
                    }
                }

                // Place glimpses on room edges (prioritize glassy rooms)
                for (const room of rooms) {
                    const edges = roomBoundaryById.get(room.id) || [];
                    if (!edges.length) continue;
                    const glassy = /window|glass|glazing/i.test(room.roomType || '');
                    const chance = glassy ? 0.8 : 0.35;
                    if (Math.random() > chance) continue;
                    const pick = getRandomElement(edges);
                    const payload = buildGlimpsePayload();
                    pick.cell.glimpse = payload;
                    pick.cell.glimpseMeta = { roomId: room.id, roomName: room.roomName, roomType: room.roomType };
                    anchors.push({ x: pick.x, y: pick.y, payload, roomId: room.id });
                }

                // Place a few corridor-edge glimpses for hallway interaction
                shuffleInPlace(corridorBoundary);
                const corridorCount = Math.min(4, Math.max(1, Math.round(corridorBoundary.length * 0.06)));
                for (let i = 0; i < corridorCount; i++) {
                    const pick = corridorBoundary[i];
                    if (!pick) break;

                        <span class="inline-flex items-center gap-2"><span class="inline-block w-3 h-3 rounded-full" style="background: rgba(56,189,248,0.92); border:1px solid rgba(255,255,255,0.55)"></span>Features (Non-combat)</span>

            const roomCount = rooms.length;
            const corridorEncounterCount = (corridorEncounterCells && corridorEncounterCells.length) ? corridorEncounterCells.length : 0;
            const roomEncounterCount = rooms.filter(r => !!r.encounter).length;

            let html = `
                <div id="dungeon-map">

                                    <span class="text-gray-500">""</span>
                                    <input id="dungeon-corridor-max" type="number" min="6" max="30" value="${dungeonMapState?.corridorMax ?? 10}"

                            <div class="text-sm text-gray-400 mt-3">

                                <span class="opacity-90">Movement:</span> click a token to select, then click a tile to move it.

                    <div class="mt-1 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">

                        <details class="p-3 rounded-lg bg-gray-900/40 border border-gray-700" open>

                        </details>

                        <details class="p-3 rounded-lg bg-gray-900/40 border border-gray-700" open>
                            <summary class="cursor-pointer font-semibold text-gray-100">DM History</summary>
                            <div class="mt-2 flex flex-wrap gap-2">
                                <button id="dungeon-history-download" class="btn-generate bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 px-3 rounded-lg text-xs">Download JSON</button>
                                <button id="dungeon-history-copy" class="btn-generate bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 px-3 rounded-lg text-xs">Copy JSON</button>

                        <details class="p-3 rounded-lg bg-gray-900/40 border border-gray-700">
