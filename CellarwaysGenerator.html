        // --- DATA STRUCTURES AND HELPER FUNCTIONS ---

        const weightedRandom = (items) => {
            if (!Array.isArray(items)) {
                console.error("weightedRandom expects an array of weighted objects.", items);
                return null;
            }
            const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
            let random = Math.random() * totalWeight;
            for (const item of items) {
                if (random < item.weight) return item.value;
                random -= item.weight;
            }
            return items.length > 0 ? items[items.length - 1].value : null; // Fallback
        };

        const getRandomElement = (arr) => {
            if (!Array.isArray(arr) || arr.length === 0) {
                 console.error("getRandomElement expects a non-empty array.", arr);
                return "";
            }
            return arr[Math.floor(Math.random() * arr.length)];
        };

        const roll = (chance) => Math.random() < chance;

        const roomData = {

        // --- GENERIC CORRIDOR PACKS (simple groups of similar monsters) ---
        // Dice helpers for simple strings like "1d4+2"
        const rollDiceSpec = (spec) => {
            const m = /^(\d+)d(\d+)([+\-]\d+)?$/i.exec(spec.trim());
            if (!m) return 1;
            const n = parseInt(m[1], 10);
            const d = parseInt(m[2], 10);
            const k = m[3] ? parseInt(m[3], 10) : 0;
            let total = 0;
            for (let i = 0; i < n; i++) total += 1 + Math.floor(Math.random() * d);
            return Math.max(1, total + k);
        };
        const averageDiceCount = (spec) => {
            const m = /^(\d+)d(\d+)([+\-]\d+)?$/i.exec(spec.trim());
            if (!m) return 1;
            const n = parseInt(m[1], 10);
            const d = parseInt(m[2], 10);
            const k = m[3] ? parseInt(m[3], 10) : 0;
            return Math.max(1, n * (d + 1) / 2 + k);
        };
        const pluralize = (word) => {
            const lower = word.toLowerCase();
            if (/(s|x|z|ch|sh)$/.test(lower)) return word + 'es';
            return word + 's';
        };
        const roundCR = (cr) => Math.round(cr * 4) / 4; // quarter-steps

            { weight: 3, value: { label: "Darkling Slime Cluster", memberName: "Darkling Slime", memberCR: 0.125, countDice: "1d4+2", tactics: "They clog the hall and try to split the party at a choke point." } },

        const generateGenericCorridorEncounter = () => {
            const pack = weightedRandom(genericCorridorPacks);
            const count = rollDiceSpec(pack.countDice);
            const plural = count === 1 ? pack.memberName : pluralize(pack.memberName);
            const approxCR = roundCR(count * (pack.memberCR || 0));
            return {
                name: `${pack.label}`,
                cr: approxCR,
                description: `You encounter ${count} ${plural} spread along the corridor, presenting an obstacle to progress. ${pack.tactics} (Pack size: ${pack.countDice}; approx CR ${approxCR})`
            };
        };
        
        // --- ENCOUNTER DATA ---

            // — More corridor variety —

            { value: { cr: 2, name: "Ceiling Creepers Ambuscade", description: "Three to five Darkling Lurkers press flat against the rafters, drifting with the breeze like stains. Dust falls just before they drop." }, weight: 2 },

                                <span id="generic-corridor-count" class="text-sm text-gray-400">${totalGeneric}</span>
                            </div>
                            <div id="generic-corridor-list"></div>
                        </section>

                        <section class="col-span-1">
                            <div class="flex items-baseline justify-between mb-2">
                                <h3 class="section-title text-xl pb-1">Room Encounters</h3>
                                <span id="room-count" class="text-sm text-gray-400">${totalRoom}</span>
                            </div>
                            <div id="room-list"></div>
                        </section>
                    </div>
                </div>
            `;

            output.innerHTML = html;

            // Initial render, sorted by CR then name
            renderEncounterList(sortEncounters(encounterIndexData.corridor), 'corridor-list');
            renderEncounterList(sortEncounters(encounterIndexData.room), 'room-list');
            renderEncounterList(sortEncounters(genericCorridor), 'generic-corridor-list');

            const input = document.getElementById('encounter-search');
            input?.addEventListener('input', () => {
                const q = input.value.trim().toLowerCase();
                const filterFn = (it) => !q || it.name.toLowerCase().includes(q) || it.description.toLowerCase().includes(q);
                const filteredCorridor = sortEncounters(encounterIndexData.corridor.filter(filterFn));
                const filteredRoom = sortEncounters(encounterIndexData.room.filter(filterFn));
                const filteredGeneric = sortEncounters(genericCorridor.filter(filterFn));
                document.getElementById('corridor-count').textContent = `${filteredCorridor.length}/${totalCorridor}`;
                document.getElementById('room-count').textContent = `${filteredRoom.length}/${totalRoom}`;
                document.getElementById('generic-corridor-count').textContent = `${filteredGeneric.length}/${totalGeneric}`;
                renderEncounterList(filteredCorridor, 'corridor-list');
                renderEncounterList(filteredRoom, 'room-list');
                renderEncounterList(filteredGeneric, 'generic-corridor-list');
            });
        };

        // --- EVENT LISTENERS ---
        document.getElementById('generate-corridor-btn').addEventListener('click', generateCorridor);
        document.getElementById('generate-room-btn').addEventListener('click', generateRoom);
    document.getElementById('show-index-btn').addEventListener('click', renderEncounterIndex);

        // Collapsible window toggle (event delegation)
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.window-toggle');
            if (!btn) return;
            const content = btn.nextElementSibling;
            if (!content) return;
            content.classList.toggle('hidden');
        });
    </script>
</body>
</html>
