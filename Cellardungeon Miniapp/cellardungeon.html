<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellarways Corridor & Room Generator</title>
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/tailwind.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;

            /* Dark-blue marble (CSS-only) */
            background-color: #020617;
            background-image:
                radial-gradient(circle at 18% 12%, rgba(59, 130, 246, 0.16), transparent 46%),
                radial-gradient(circle at 82% 76%, rgba(148, 163, 184, 0.10), transparent 52%),
                radial-gradient(circle at 45% 55%, rgba(29, 78, 216, 0.10), transparent 55%),
                linear-gradient(135deg, rgba(255,255,255,0.06), rgba(0,0,0,0.35)),
                repeating-linear-gradient(115deg, rgba(226, 232, 240, 0.028) 0 2px, transparent 2px 14px),
                repeating-linear-gradient(22deg, rgba(56, 189, 248, 0.022) 0 1px, transparent 1px 18px);
            background-blend-mode: screen, screen, screen, overlay, normal, normal;
            background-attachment: fixed;
        }
        h1, .section-title {
            font-family: 'Cinzel Decorative', cursive;
        }
        #generator-frame {
            background-color: rgba(17, 24, 39, 0.78);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);

            /* Silver border */
            border: 4px solid transparent;
            border-image: linear-gradient(
                135deg,
                rgba(226, 232, 240, 0.92),
                rgba(148, 163, 184, 0.72),
                rgba(226, 232, 240, 0.92)
            ) 1;

            /* Subtle bevel */
            box-shadow:
                0 0 24px rgba(0, 0, 0, 0.55),
                inset 0 0 0 1px rgba(255, 255, 255, 0.06),
                inset 0 14px 22px rgba(255, 255, 255, 0.035),
                inset 0 -18px 26px rgba(0, 0, 0, 0.35);
        }
        #output {
            min-height: 300px;
        }
        .btn-generate {
            position: relative;
            transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
            overflow: hidden;

            /* Silver trim */
            border: 1px solid rgba(226, 232, 240, 0.55);

            /* Shine overlay (keeps Tailwind bg-* colors intact) */
            background-image:
                linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.02) 45%, rgba(0,0,0,0.10)),
                radial-gradient(circle at 30% 20%, rgba(226,232,240,0.10), transparent 55%);
            background-blend-mode: overlay;
        }
        .btn-generate::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: 0.7rem;
            pointer-events: none;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
        }
        .btn-generate::after {
            content: "";
            position: absolute;
            left: -30%;
            top: -60%;
            width: 70%;
            height: 220%;
            transform: rotate(20deg) translateX(-140%);
            pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(226,232,240,0.18), transparent);
            opacity: 0;
            transition: transform 0.75s ease, opacity 0.12s ease;
            will-change: transform, opacity;
        }
        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.42);
            filter: saturate(1.06) brightness(1.03);
        }
        .btn-generate:hover::after {
            opacity: 1;
            transform: rotate(20deg) translateX(240%);
        }
        .btn-generate:active {
            transform: translateY(0);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.36);
            filter: brightness(0.98);
        }
        .section-title {
             color: #a0aec0;
             border-bottom: 1px solid #4a5568;
        }

        /* --- DUNGEON MAP (lightweight grid + tokens) --- */
        #dungeon-map {
            margin-top: 10px;
        }
        #dungeon-grid {
            display: grid;
            gap: 2px;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(3, 7, 18, 0.55);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
            overflow: auto;
            --dungeon-cell: 26px;
            --dungeon-token: 14px;
        }
        .dungeon-cell {
            position: relative;
            width: var(--dungeon-cell);
            height: var(--dungeon-cell);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: #030712;
        }
        .dungeon-cell.cell-corridor {
            background: rgba(75, 85, 99, 0.55);
        }
        .dungeon-cell.cell-room {
            background: rgba(30, 41, 59, 0.8);
            box-shadow: inset 0 0 0 1px rgba(99, 102, 241, 0.15);
        }
        .dungeon-cell.cell-room-locked-edge {
            border-color: rgba(250, 204, 21, 0.92);
            box-shadow: inset 0 0 0 1px rgba(250, 204, 21, 0.55), 0 0 0 1px rgba(250, 204, 21, 0.25);
        }
        .dungeon-cell.cell-door-locked {
            box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.55), inset 0 0 0 1px rgba(250, 204, 21, 0.25);
        }
        .dungeon-cell.cell-start {
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.55), inset 0 0 0 1px rgba(34, 197, 94, 0.2);
        }
        .dungeon-cell .cell-mark {
            position: absolute;
            left: 4px;
            top: 3px;
            font-size: 10px;
            color: rgba(226, 232, 240, 0.85);
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
        }
        .dungeon-cell .cell-mark.door {
            left: 5px;
            top: 4px;
            font-size: 11px;
            color: rgba(250, 204, 21, 0.95);
        }
        .dungeon-cell .cell-prop-svg {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            pointer-events: none;
            opacity: 0.9;
        }
        .dungeon-token {
            position: absolute;
            width: var(--dungeon-token);
            height: var(--dungeon-token);
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--dungeon-token) * 0.62);
            line-height: 1;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.35);
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
            -webkit-user-select: none;
            user-select: none;
            cursor: default;
        }
        .dungeon-token.token-player {
            background: rgba(34, 197, 94, 0.95);
        }
        .dungeon-token.token-monster {
            background: rgba(239, 68, 68, 0.95);
        }
        .dungeon-token.has-image {
            background: rgba(2, 6, 23, 0.55);
            padding: 0;
            overflow: hidden;
        }
        .dungeon-token.has-image img.monster-token-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 9999px;
        }
        .dungeon-token.token-feature {
            background: rgba(56, 189, 248, 0.92);
            color: rgba(3, 7, 18, 0.92);
            border-color: rgba(255, 255, 255, 0.55);
            text-shadow: none;
        }
        .dungeon-token.token-glimpse {
            background: rgba(125, 211, 252, 0.95);
            color: rgba(15, 23, 42, 0.95);
            border-color: rgba(59, 130, 246, 0.75);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.35);
        }
        .dungeon-token.token-key {
            background: rgba(250, 204, 21, 0.95);
            color: rgba(17, 24, 39, 0.95);
            border-color: rgba(255, 255, 255, 0.55);
            text-shadow: none;
            font-size: calc(var(--dungeon-token) * 0.78);
            font-weight: 900;
        }
        .dungeon-token.token-npc {
            background: rgba(13, 148, 136, 0.95);
            border-color: rgba(255, 255, 255, 0.40);
        }
        .dungeon-token.selected {
            outline: 2px solid rgba(250, 204, 21, 0.85);
            outline-offset: 1px;
        }
        #map-tooltip {
            position: fixed;
            z-index: 9999;
            max-width: 360px;
            pointer-events: none;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(2, 6, 23, 0.92);
            color: rgba(226, 232, 240, 0.95);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
            display: none;
        }
        #map-tooltip.visible {
            display: block;
        }
        #map-tooltip.visible.interactive {
            pointer-events: auto;
        }
        .tooltip-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .tooltip-btn {
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(30, 41, 59, 0.55);
            color: rgba(226, 232, 240, 0.95);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }
        .tooltip-btn:hover {
            background: rgba(51, 65, 85, 0.70);
        }
        .tooltip-btn[disabled] {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* --- Bestiary modal --- */
        #bestiary-modal {
            position: fixed;
            inset: 0;
            z-index: 10000;
        }
        #bestiary-modal.hidden {
            display: none;
        }
        #bestiary-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(2, 6, 23, 0.78);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
        }
        #bestiary-modal-panel {
            position: relative;
            margin: 4vh auto;
            width: min(920px, calc(100vw - 24px));
            max-height: 92vh;
            overflow: auto;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(15, 23, 42, 0.92);
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55);
            padding: 14px 14px 18px;
        }
        .bestiary-modal-close {
            position: sticky;
            top: 8px;
            float: right;
            z-index: 1;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(2, 6, 23, 0.55);
            color: rgba(226, 232, 240, 0.92);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 12px;
        }
        .bestiary-modal-close:hover {
            background: rgba(30, 41, 59, 0.65);
        }
        .bestiary-kv {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 12px;
            color: rgba(203, 213, 225, 0.92);
        }
        .bestiary-kv span {
            padding: 4px 8px;
            border-radius: 9999px;
            background: rgba(2, 6, 23, 0.50);
            border: 1px solid rgba(148, 163, 184, 0.18);
        }
        .bestiary-json {
            margin-top: 12px;
            background: rgba(2, 6, 23, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 12px;
            padding: 12px;
            overflow: auto;
            font-size: 12px;
            color: rgba(226, 232, 240, 0.9);
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body class="text-gray-300 min-h-screen flex flex-col items-stretch justify-start p-4">

    <div id="app-container" class="w-full max-w-screen-2xl mx-auto">
        <header class="text-center mb-6">
            <h1 class="text-4xl md:text-5xl font-bold text-gray-100 tracking-wider">Cellarways Generator</h1>
            <p class="mt-2 text-gray-400">Generate the impossible corridors and forgotten underpassages of the Scholia Diaspros.</p>
        </header>

        <nav class="mb-4 flex justify-center">
            <div class="inline-flex rounded-xl overflow-hidden border border-slate-600/60 bg-slate-950/40 shadow-sm">
                <button id="tab-main" class="px-4 py-2 text-sm font-bold text-gray-100 bg-slate-800/80 hover:bg-slate-700/80">Main</button>
                <button id="tab-dungeon" class="px-4 py-2 text-sm font-bold text-gray-200 bg-slate-950/10 hover:bg-slate-800/50">Dungeon</button>
            </div>
        </nav>

        <section id="main-tab" class="block">
            <main id="generator-frame" class="rounded-lg p-6 md:p-8">
                <div id="output" class="text-lg leading-relaxed text-gray-300">
                    <p class="text-gray-400 italic">The passage ahead splits. Do you explore a winding corridor or venture into a sealed room? Click a button to proceed.</p>
                </div>
            </main>

            <footer class="text-center mt-8 flex flex-col sm:flex-row justify-center gap-4">
                <button id="generate-corridor-btn" class="btn-generate bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-lg text-xl">
                    Generate Corridor
                </button>
                <button id="generate-room-btn" class="btn-generate bg-indigo-800 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-lg text-xl">
                    Generate Room
                </button>
                <button id="generate-dungeon-btn" class="btn-generate bg-fuchsia-900 hover:bg-fuchsia-800 text-white font-bold py-3 px-8 rounded-lg text-xl">
                    Dungeon
                </button>
                <button id="show-index-btn" class="btn-generate bg-teal-800 hover:bg-teal-700 text-white font-bold py-3 px-8 rounded-lg text-xl">
                    Encounter Index
                </button>
            </footer>
        </section>

        <section id="dungeon-tab-content" class="hidden">
            <main class="rounded-lg p-6 md:p-8" id="dungeon-frame">
                <div id="dungeon-output" class="text-gray-300">
                    <div class="text-gray-400 italic">Dungeon tools ready. Click "Generate" to build a map.</div>
                </div>
            </main>
        </section>
    </div>

    <div id="map-tooltip"></div>

    <div id="bestiary-modal" class="hidden" aria-hidden="true">
        <div id="bestiary-modal-backdrop"></div>
        <div id="bestiary-modal-panel" role="dialog" aria-modal="true" aria-labelledby="bestiary-modal-title">
            <button id="bestiary-modal-close" class="bestiary-modal-close">Close</button>
            <div id="bestiary-modal-content"></div>
        </div>
    </div>

        const rollDiceSpec = (spec) => {
            const m = /^(\d+)d(\d+)([+\-]\d+)?$/i.exec(spec.trim());
            if (!m) return 1;
            const n = parseInt(m[1], 10);
            const d = parseInt(m[2], 10);
            const k = m[3] ? parseInt(m[3], 10) : 0;
            let total = 0;
            for (let i = 0; i < n; i++) total += 1 + Math.floor(Math.random() * d);
            return Math.max(1, total + k);
        };
        const rollDiceExpression = (expr) => {
            const raw = String(expr || '').replace(/\s+/g, '');
            if (!raw) return null;
            const parts = raw.split(/(?=[+\-])/g).filter(Boolean);
            if (!parts.length) return null;
            let total = 0;
            const detail = [];
            for (const part of parts) {
                const sign = part.startsWith('-') ? -1 : 1;
                const body = part.replace(/^[+\-]/, '');
                const diceMatch = /^(\d+)d(\d+)$/.exec(body);
                if (diceMatch) {
                    const n = parseInt(diceMatch[1], 10);
                    const d = parseInt(diceMatch[2], 10);
                    if (Number.isFinite(n) && Number.isFinite(d) && n > 0 && d > 0) {
                        const rolls = [];
                        for (let i = 0; i < n; i++) {
                            const r = 1 + Math.floor(Math.random() * d);
                            rolls.push(r);
                        }
                        const subtotal = rolls.reduce((a, b) => a + b, 0) * sign;
                        total += subtotal;
                        detail.push(`${sign < 0 ? '-' : ''}${rolls.join('+')}`);
                        continue;
                    }
                }
                const flat = parseInt(body, 10);
                if (Number.isFinite(flat)) {
                    total += sign * flat;
                    detail.push(`${sign < 0 ? '-' : '+'}${Math.abs(flat)}`);
                }
            }
            return { total, detail: detail.join(' ') || raw, expression: raw };
        };
        const averageDiceCount = (spec) => {
            const m = /^(\d+)d(\d+)([+\-]\d+)?$/i.exec(spec.trim());
            if (!m) return 1;
            const n = parseInt(m[1], 10);
            const d = parseInt(m[2], 10);
            const k = m[3] ? parseInt(m[3], 10) : 0;
            return Math.max(1, n * (d + 1) / 2 + k);
        };
        const pluralize = (word) => {
            const lower = word.toLowerCase();
            if (/(s|x|z|ch|sh)$/.test(lower)) return word + 'es';
            return word + 's';
        };
        const roundCR = (cr) => Math.round(cr * 4) / 4; // quarter-steps

        // Packs use weights compatible with weightedRandom
        const genericCorridorPacks = [
            // Lower-CR packs still exist, but are less dominant.
            { weight: 1.0, value: { label: "Darkling Slime Cluster", memberName: "Darkling Slime", memberCR: 0.125, countDice: "1d4+2", tactics: "They clog the hall and try to split the party at a choke point.", hostility: "Hostile if you block their lane, touch them, or use bright light aggressively; otherwise they ooze past and smear anything in reach." } },
            { weight: 1.4, value: { label: "Lurker Skitter Pack", memberName: "Darkling Lurker", memberCR: 0.5, countDice: "1d4", tactics: "They drop from above in staggered pairs, then disengage to reset.", hostility: "Hostile on sight; they drop as soon as the party commits to the corridor." } },
            { weight: 1.2, value: { label: "Slurper Patrol", memberName: "Darkling Slurper", memberCR: 1, countDice: "1d3", tactics: "Tongues lash from opposite walls to restrain a forefront target.", hostility: "Hostile on sight; they open with tongues immediately." } },
            { weight: 1.4, value: { label: "Paralurker Flock", memberName: "Darkling Paralurker", memberCR: 1, countDice: "1d4+1", tactics: "They harry from the ceiling, seeking isolated stragglers.", hostility: "Hostile if any creature enters their filament lane or shines bright light upward." } },
            { weight: 0.75, value: { label: "Weirdling Swarm", memberName: "Weirdling", memberCR: 0.25, countDice: "2d4", tactics: "They careen unpredictably, creating difficult movement and noise.", hostility: "Usually hostile if pursued or cornered; otherwise they stampede through and may bowl you over." } },

            // Mid-CR (3""4) packs to match the new difficulty target.
            { weight: 1.25, value: { label: "Slurper Gang", memberName: "Darkling Slurper", memberCR: 1, countDice: "1d4+1", tactics: "They focus one target to restrain, then rotate tongues to drag them into cover.", hostility: "Hostile on sight; they attempt restraint before damage." } },
            { weight: 1.25, value: { label: "Hall Monitor Pair", memberName: "Hall Monitor", memberCR: 1.5, countDice: "1d2+1", tactics: "They form a line to detain, restrain, and tag contraband with practiced choreography.", hostility: "Hostile if you lack a pass or refuse to stop when ordered; otherwise they attempt to detain you 'peacefully'." } },
            { weight: 1.1, value: { label: "Auditor Warrant Team", memberName: "Auditor", memberCR: 1.25, countDice: "1d3+1", tactics: "They surround and recite violations, escalating fast if challenged.", hostility: "Hostile unless you immediately present credible paperwork (DC 15 Deception/Persuasion, DM adjudicates)." } },
            { weight: 1.2, value: { label: "Infiltrator Snare Pair", memberName: "Infiltrator", memberCR: 1.5, countDice: "1d2+1", tactics: "They open with a force-filament snare and punish anyone who dashes.", hostility: "Hostile on sight; they spring the first snare as soon as you commit to the corridor." } },
            { weight: 1.1, value: { label: "Darkforged Remnant Crew", memberName: "Darkforged Remnant", memberCR: 1.5, countDice: "1d2+1", tactics: "They block the lane with heavy tools, trying to pin targets against masonry.", hostility: "Hostile if you approach within 20 ft of their work zone or attempt to pass through." } },
        ];

        const pickGenericCorridorPack = () => {
            // Bias toward higher expected CR packs without removing low-CR options.
            const pack = weightedRandomWithAdjustedWeights(genericCorridorPacks, (e) => {
                const v = e?.value;
                const expectedCount = averageDiceCount(v?.countDice ?? '1d1');
                const expectedCR = roundCR((v?.memberCR ?? 0) * expectedCount);
                return encounterCrWeightMultiplier(expectedCR);
            });
            // Safety fallback
            return pack || weightedRandom(genericCorridorPacks);
        };

        const generateGenericCorridorEncounter = () => {
            const pack = pickGenericCorridorPack();
            const count = rollDiceSpec(pack.countDice);
            const plural = count === 1 ? pack.memberName : pluralize(pack.memberName);
            const approxCR = roundCR(count * (pack.memberCR || 0));
            const hostility = pack.hostility || "Hostile on sight.";

            // Light-touch scaling so higher-CR packs feel meaningfully tougher.
            // Keep the structure familiar; only scale DCs and chip damage.
            const perceptionDC = Math.min(16, 13 + Math.floor((approxCR || 0) / 2));
            const movementDC = Math.min(16, 13 + Math.floor(Math.max(0, (approxCR || 0) - 1) / 2));
            let chipDamage = "1d4";
            if (approxCR >= 2 && approxCR < 5) chipDamage = "1d4+1";
            if (approxCR >= 5) chipDamage = "1d6";
            return {
                name: `${pack.label}`,
                cr: approxCR,
                description: `A group blocks the corridor, moving with purpose. ${pack.tactics} (Pack size: ${pack.countDice}; approx CR ${approxCR})` +

            };

            const pack = pickGenericCorridorPack();

            const approxCR = roundCR(count * (pack.memberCR || 0));
            const hostility = pack.hostility || "Hostile on sight.";

            // Rooms tend to favor ambush, cover, and choke points.
            const ambushDC = Math.min(17, 12 + Math.floor((approxCR || 0) / 2));
            const scrambleDC = Math.min(17, 12 + Math.floor(Math.max(0, (approxCR || 0) - 1) / 2));

            const roomTag = roomType ? ` (${stripHtml(roomType)})` : '';
            return {
                name: `${pack.label}${roomTag}`,
                cr: approxCR,
                description: `The room is occupied and defended. ${pack.tactics} (Pack size: ${pack.countDice}; approx CR ${approxCR})` +

                    `<br><br><b>Mechanics:</b> Entering quietly calls for a DC ${ambushDC} Dexterity (Stealth) check to avoid immediate detection. When the fight breaks out, crossing clutter or overturned furniture requires a DC ${scrambleDC} Dexterity (Acrobatics) check or the creature's speed is halved until the start of its next turn.`

            { value: { cr: 0.25, name: "Small Darkling Slimes", description: "A cluster of small darkling slimes rolls in a loose pack, attracted to the hum of nearby magitech. They hesitate if outnumbered.<br><br><b>Mechanics:</b> Moving through the area is difficult terrain; DC 12 Dexterity (Acrobatics) to avoid 1d4 acid damage from contact. A strong light source disperses them for 1 round." }, weight: 3 },
            { value: { cr: 0.5, name: "Wandering Slimes", description: "A small glob of 2-3 Darkling Slimes (Mopes) wobble aimlessly down the corridor. They seem more lost than aggressive and will likely flee if confronted with bright light or violence.<br><br><b>Options:</b> DC 12 Intelligence (Nature) to anticipate their motion and pass safely; flashing bright light forces them to retreat 10 ft." }, weight: 4 },
            { value: { cr: 0.5, name: "Darkling Cuboid Slime", description: "A cuboid slime lurches in right angles as if obeying a broken grid. Its geometry makes it awkward to predict but easy to outpace in straightaways.<br><br><b>Mechanics:</b> DC 12 Intelligence (Investigation) to read the pattern; success grants advantage on checks to slip past it this scene." }, weight: 2 },

            { value: { cr: 1, name: "Paralurker Pack", description: "A pack of Darkling-Paralurkers skitters along the ceiling, their talons making soft clicking sounds. They hunt for small prey and drop in pairs.<br><br><b>Foes:</b> 1d4+1 Darkling Paralurkers.<br><b>Hostility:</b> Hostile on sight; they dive in pairs at the front and rear.<br><br><b>Filaments:</b> Creatures hit may be entangled; escape DC 13 Strength (Athletics). Ready actions can swat them mid-drop (AC 13)." }, weight: 2 },

            { value: { cr: 5, name: "Liquid Legion Hunt (Open)", description: "The corridor thrums with the approach of a Liquid Legion mass.<br><br><b>Foes:</b> 1 Liquid Legion Mass.<br><b>Hostility:</b> Hostile on sight; it engulfs anything in its lane.<br><br><b>Wave:</b> At the start of the round, creatures in the lane make DC 14 Strength saves or are knocked prone and take 1d4 acid damage." }, weight: 0.6 },
