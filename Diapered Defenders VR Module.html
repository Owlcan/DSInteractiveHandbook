<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=MedievalSharp&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Handbook palette (from simple-handbook.html) */
            --gold: #daac17;
            --gold-light: #fae791;
            --gold-dark: #97740a;
            --parchment: #2C2614;
            --parchment-dark: #1E1C12;
            --ink: #c7a81d;
            --ink2: #8f770d;
            --accent: #b47018;
            --shadow: rgba(0, 0, 0, 0.5);
            /* Derived */
            --panel: var(--parchment);
            --panel-2: #352c18;
            --paper: var(--parchment);
            --muted: #d8c7a0;
            --grid-line: rgba(218, 172, 23, 0.16);
            --grid-border: rgba(218, 172, 23, 0.28);
            /* CR rings tuned toward warm golds/oranges */
            --ring-t0: #e0c25a; /* CR <1 */
            --ring-t1: #daac17; /* <2 */
            --ring-t2: #b98d12; /* <5 */
            --ring-t3: #a6790e; /* <9 */
            --ring-t4: #8f670b; /* 9+ */
            /* Cell size for bigger board */
            --cell: 72px;
        }
        body {
            font-family: 'Cormorant Garamond', serif;
            margin: 0;
            background-color: #2c2619;
            background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
            color: var(--ink);
        }
        .app-panel {
            background-color: var(--panel);
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            border: 2px solid var(--gold-dark);
            box-shadow: 0 8px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .panel-title {
            color: var(--accent);
            font-family: 'MedievalSharp', cursive;
        }
        .grid-container {
            display: grid;
            border: 3px solid var(--gold-dark);
            background-image: linear-gradient(var(--grid-line) 1px, transparent 1px),
                              linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: var(--cell) var(--cell);
        }
        .grid-cell {
            width: var(--cell);
            height: var(--cell);
            border: 1px solid var(--grid-border);
            position: relative;
        }
        .token {
            width: 86%;
            height: 86%;
            border-radius: 50%;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            color: white;
            position: absolute;
            top: 7%;
            left: 7%;
            z-index: 10;
            box-shadow: 0 6px 12px rgba(0,0,0,0.55);
            transition: transform 0.2s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        /* CR ring tint without altering existing backgrounds */
        .token[data-tier="t0"] { outline: 2px solid var(--ring-t0); outline-offset: -2px; }
        .token[data-tier="t1"] { outline: 2px solid var(--ring-t1); outline-offset: -2px; }
        .token[data-tier="t2"] { outline: 2px solid var(--ring-t2); outline-offset: -2px; }
        .token[data-tier="t3"] { outline: 2px solid var(--ring-t3); outline-offset: -2px; }
        .token[data-tier="t4"] { outline: 2px solid var(--ring-t4); outline-offset: -2px; }
        .token:active {
            cursor: grabbing;
            transform: scale(1.08);
            z-index: 20;
        }
        /* Keep player colors intact */
    .player-yellow { background-color: #FBBF24; border: 2px solid #F59E0B; font-size: 24px; }
    .player-red { background-color: #EF4444; border: 2px solid #DC2626; font-size: 24px; }
    .player-green { background-color: #10B981; border: 2px solid #059669; font-size: 24px; }
    .player-black { background-color: #374151; border: 2px solid #1F2937; font-size: 24px; }
    .monster-token { background-color: #7C3AED; border: 2px solid #6D28D9; font-size: 24px; }
        .object-token {
            background-color: #6B5B4A;
            border-radius: 10px;
            border: 2px solid #4B3E31;
            font-size: 30px;
            width: 90%;
            height: 90%;
            top: 5%;
            left: 5%;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
    /* Let players stand visually on debris/clutter */
    .object-token.debris { z-index: 6; }
        .object-token.puzzle-switch {
             background-image: radial-gradient(circle, #b98d3b, #8a6b2c);
        }
        .tooltip { position: relative; }
        /* Hover card */
        .hover-card {
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            min-width: 260px;
            max-width: 360px;
            background: var(--panel-2);
            color: var(--ink);
            border: 1px solid var(--gold-dark);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 10px 26px rgba(0,0,0,0.6);
            z-index: 1000;
            display: none;
        }

        /* Grid wrapper to help compute available size */
        #grid-outer { width: 100%; }
        :root { --board-max-h: 70vh; }
        .hover-card .hc-row { display: flex; justify-content: space-between; font-size: 12px; margin: 2px 0; }
    .hover-card .hc-name { font-weight: 800; font-size: 14px; color: var(--gold); font-family: 'MedievalSharp', cursive; }
    .hover-card .hc-sub { color: var(--ink2); font-size: 12px; }
        .hover-card .hc-actions { margin-top: 6px; display: grid; grid-template-columns: 1fr; gap: 4px; }
        .hover-card .hc-action-btn { background:#514231; color:#fff; border:1px solid #6b553c; padding:6px 8px; border-radius:6px; cursor:pointer; text-align:left; font-size:12px; }
        .hover-card .hc-action-btn:hover { background:#6b553c; }
        .hover-card .hc-roll { margin-top: 6px; font-family: 'Roboto Mono', monospace; font-size: 12px; color:#f6d27a; }
        .hover-card .hc-list { margin-top: 6px; display: grid; grid-template-columns: 1fr; gap: 2px; }
        .hover-card .hc-item { font-size: 12px; color:#F3E9D8; }
        .hover-card .hc-hint { margin-top: 6px; font-size: 11px; color:#bfa77f; }

        /* Narrative log */
        #text-log-container { height: 360px; overflow: hidden; }
        #text-log {
            font-family: 'Roboto Mono', monospace;
            height: 100%;
            background-color: var(--paper);
            border: 2px solid var(--gold-dark);
            padding: 1rem;
            overflow-y: auto;
            border-radius: 10px;
            box-sizing: border-box;
            overflow-x: hidden;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .log-entry span { display: block; }
        .log-entry.sysinfo span { opacity: 0.85; font-style: italic; color: var(--ink2); }

        /* Actions panel buttons */
    #interaction-panel button { transition: all 0.2s ease-in-out; border: 2px solid var(--gold-dark); background: linear-gradient(to bottom, var(--gold-light), var(--gold)); color: #2C2614; font-family: 'MedievalSharp', cursive; }
    #interaction-panel button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.35); background: linear-gradient(to bottom, var(--gold), var(--gold-dark)); }
        #interaction-panel button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Custom scrollbar for webkit browsers */
    /* Cleaner, themed scrollbar (WebKit/Chromium) */
        #text-log::-webkit-scrollbar { width: 10px; }
        #text-log::-webkit-scrollbar-track { background: var(--parchment-dark); border-left: 1px solid var(--gold-dark); }
        #text-log::-webkit-scrollbar-thumb {
            background-image: linear-gradient(180deg, var(--gold), var(--gold-dark));
            border: 1px solid var(--gold-dark);
            border-radius: 8px;
        }
        #text-log::-webkit-scrollbar-thumb:hover { background-image: linear-gradient(180deg, var(--gold-light), var(--gold)); }

        /* Puzzle controls buttons -> handbook style */
        #puzzle-controls button { background: linear-gradient(to bottom, var(--gold-light), var(--gold)) !important; border: 2px solid var(--gold-dark) !important; color: #2C2614 !important; font-family: 'MedievalSharp', cursive !important; }
        #puzzle-controls button:hover { background: linear-gradient(to bottom, var(--gold), var(--gold-dark)) !important; }
    </style>

</head>

        // Runtime bestiary helpers (non-breaking): prefer runtime data, fallback to static
        function getMonster(key) {
            try {
                if (window.MonstersRuntime && window.MonstersRuntime.cache.loaded) {
                    let norm = window.MonstersRuntime.get(key);
                    if (!norm) {
                        // Try explicit aliases and fuzzy matching
                        const alias = {
                            darkling_lurker: 'Darkling Lurker',
                            darkforme_overwatch: 'Darkforme Overwatch',
                            darkforged_remnant: 'Darkforged Remnant',
                            the_castoff: 'The Castoff',
                            darkling_yowler: 'Darkling Yowler',
                            darkling_bellowbelly: 'Darkling Bellowbelly',
                            darkforme_cavesweller: 'Darkforme Cavesweller',
                            darkforme_hungore: 'Darkforme Hungore',
                            darkling_nightshade: 'Darkling Nightshade',
                            the_darkformless: 'The Darkformless',
                            darkforme_spinebearer: 'Darkforme Spinebearer'
                        };
                        const wanted = alias[key];
                        const list = window.MonstersRuntime.all();
                        if (wanted) {
                            norm = list.find(m => m.name.toLowerCase() === wanted.toLowerCase());
                        }
                        if (!norm) {
                            const words = key.replace(/[_-]/g,' ').toLowerCase().split(/\s+/).filter(Boolean);
                            norm = list.find(m => words.every(w => m.name.toLowerCase().includes(w)));
                        }
                    }
                    if (norm) {
                        const hasFullStats = Boolean(norm.ac || norm.hpStr || (Array.isArray(norm.actions) && norm.actions.length));
                        return {
                            name: norm.name,
                            cr: norm.crStr || String(norm.cr),
                            color: '#6D28D9', // keep style parity
                            description: norm.description || '',
                            abilities: norm.abilities || [],
                            emoji: norm.emoji,
                            tier: norm.tier,
                            tiles: norm.tiles,
                            ac: norm.ac,
                            armorType: norm.armorType,
                            hpStr: norm.hpStr,
                            abilityScores: norm.abilityScores,
                            actions: norm.actions,
                            size: norm.size,
                            hasFullStats
                        };
                    }
                }
            } catch(_) {}
            const fallback = MONSTERS[key] || null;
            if (fallback) return { ...fallback, hasFullStats: false };
            return null;
        }

    function logMessage(speaker, text) {
            const entry = document.createElement('div');
            entry.classList.add('log-entry', 'mb-2');
            let color = '#E5E7EB'; // Default
            let displayName = speaker;

            switch(speaker) {
                case 'System': color = varColor('--gold'); displayName = '[SYSTEM]'; break;
                case 'SystemInfo': color = varColor('--muted'); displayName = '[SYSTEM:INFO]'; entry.classList.add('sysinfo'); break;
                case 'Yellow': color = '#FBBF24'; displayName = '[Defender Yellow]'; break;
                case 'Red':    color = '#F472B6'; displayName = '[Defender Red]'; break;
                case 'Green':  color = '#34D399'; displayName = '[Defender Green]'; break;
                case 'Black':  color = '#9CA3AF'; displayName = '[Defender Black]'; break;
                case 'The Castoff': color = '#A78BFA'; displayName = '[The Castoff]'; break;
            }

            entry.innerHTML = `<span style="color: ${color}; font-weight: bold;">${displayName}:</span> <span style="color: var(${speaker==='SystemInfo' ? '--ink2' : '--ink'})">${text}</span>`;
            textLog.appendChild(entry);
            textLog.scrollTop = textLog.scrollHeight;
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name) || '#E5E7EB';
        }

        function createToken(type, id, label, tooltipText, details) {
            const token = document.createElement('div');
            token.id = id;
            token.className = 'token tooltip';
            token.classList.add(type);
            token.draggable = true;
            token.textContent = label;
            token.setAttribute('data-tooltip', tooltipText);
            // Build hover card if details provided
            if (details && (type === 'monster-token' || type === 'object-token')) {
                const hc = document.createElement('div');
                hc.className = 'hover-card';
                hc.innerHTML = type === 'monster-token' ? buildHoverCardHtml(details) : buildObjectHoverCardHtml(details);
                token.appendChild(hc);
                token.addEventListener('mouseenter', ()=> hc.style.display = 'block');
                token.addEventListener('mouseleave', ()=> hc.style.display = 'none');
                if (type === 'monster-token') {
                    // Delegate action rolls
                    hc.addEventListener('click', (e)=>{
                        const btn = e.target.closest('[data-action-idx]');
                        if (!btn) return;
                        const idx = parseInt(btn.getAttribute('data-action-idx'));
                        const res = rollAction(details.actions[idx]);
                        const rollOut = hc.querySelector('.hc-roll');
                        rollOut.textContent = res;
                    });
                } else if (type === 'object-token') {
                    // Object actions
                    hc.addEventListener('click', (e)=>{
                        const btn = e.target.closest('[data-obj-action]');
                        if (!btn) return;
                        const actionId = btn.getAttribute('data-obj-action');
                        performObjectAction(token, actionId);
                        // Refresh hover card state if token still exists
                        if (token.isConnected) {
                            const entry = gameState.objectTokens.find(x => x.id === token.id);
                            if (entry) hc.innerHTML = buildObjectHoverCardHtml(getObjectDetails(entry));
                        }
                    });
                }
            }
            return token;
        }

        // Object helpers: names, hover, actions, and triggers
        function objectName(type) {
            switch (type) {
                case 'debris': return 'Debris';
                case 'trap_gas': return 'Gas Vent Trap';
                case 'trap_pit': return 'Hidden Pit Trap';
                case 'puzzle_switch': return 'Crystal Switch';
                case 'puzzle_dais': return 'Inscribed Dais';
                case 'puzzle_object': return 'Puzzle Object';
                case 'crystal_altar': return 'Crystal Altar';
                default: return type.replace(/_/g, ' ').replace(/\b\w/g, m=>m.toUpperCase());
            }
        }

        function getObjectDetails(entry) {
            const type = entry.data.type;
            const state = entry.state || {};
            const name = objectName(type);
            const actions = [];
            if (type === 'debris') {
                if (!state.cleared) actions.push({ id:'clear', name:'Clear debris' }, { id:'search', name:'Search' });
            } else if (type === 'trap_gas') {
                if (state.disarmed) {
                    // no actions when disarmed
                } else {
                    actions.push({ id:'disarm', name:'Disarm trap' }, { id:'trigger', name:'Trigger puff' });
                }
            } else if (type === 'trap_pit') {
                if (!state.disarmed) actions.push({ id:'disarm', name:'Cover pit' });
            } else if (type === 'puzzle_switch') {
                if (!state.deactivated) actions.push({ id:'deactivate', name:'Deactivate crystal' });
            } else if (type === 'puzzle_dais' || type === 'puzzle_object') {
                actions.push({ id:'inspect', name:'Inspect' });
            } else if (type === 'crystal_altar') {
                actions.push({ id:'channel', name:'Channel energy' });
            } else {
                actions.push({ id:'inspect', name:'Inspect' });
            }
            return { id: entry.id, name, type, flavor: entry.data.flavor || '', state, actions };
        }

        function buildObjectHoverCardHtml(od) {
            const statusBits = [];
            if (od.state?.disarmed) statusBits.push('disarmed');
            if (od.state?.deactivated) statusBits.push('deactivated');
            if (od.state?.cleared) statusBits.push('cleared');
            const sub = [od.type.replace(/_/g,' '), ...statusBits].join(' · ');
            const actionsHtml = (od.actions||[]).map(a=>`<button class="hc-action-btn" data-obj-action="${a.id}">• ${a.name}</button>`).join('');
            return `
                <div class="hc-name">${od.name} <span class="hc-sub">(${sub})</span></div>
                ${od.flavor? `<div class="hc-row" style="white-space:normal">${od.flavor}</div>`:''}
                ${actionsHtml? `<div class="hc-actions">${actionsHtml}</div>`:''}
                <div class="hc-roll"></div>
            `;
        }

        function performObjectAction(token, actionId) {
            const entry = gameState.objectTokens.find(x => x.id === token.id);
            if (!entry) return;
            entry.state = entry.state || {};
            const type = entry.data.type;
            if (type === 'debris') {
                if (actionId === 'clear') {
                    logMessage('System', 'You clear the debris, making the space navigable.');
                    // Remove from board and state
                    if (token.parentElement) token.parentElement.removeChild(token);
                    gameState.objectTokens = gameState.objectTokens.filter(x => x.id !== entry.id);
                    checkRoomCompletion();
                } else if (actionId === 'search') {
                    const found = Math.random() < 0.15;
                    logMessage('System', found ? 'You find a minor trinket among the rubble.' : 'Nothing useful among the rubble.');
                }
            } else if (type === 'trap_gas') {
                if (actionId === 'disarm') {
                    entry.state.disarmed = true;
                    token.style.opacity = '0.6';
                    token.setAttribute('data-disarmed','true');
                    logMessage('System', 'You carefully jam the valve. The gas trap is disarmed.');
                } else if (actionId === 'trigger') {
                    triggerTrapGas(token.parentElement, 'manual');
                }
            } else if (type === 'trap_pit') {
                if (actionId === 'disarm') {
                    entry.state.disarmed = true;
                    token.style.opacity = '0.6';
                    token.setAttribute('data-disarmed','true');
                    logMessage('System', 'You cover the pit with debris and a spanning plank.');
                }
            } else if (type === 'puzzle_switch') {
                if (actionId === 'deactivate' && !entry.state.deactivated) {
                    entry.state.deactivated = true;
                    token.style.filter = 'grayscale(1)';
                    logMessage('System', 'The crystal dims and the humming subsides. Whatever it powered is now offline.');
                    // Re-evaluate completion in case this was gating progression
                    checkRoomCompletion();
                }
            } else if (type === 'puzzle_dais' || type === 'puzzle_object') {
                logMessage('System', 'The inscriptions speak of balance and opposition. Perhaps arrange objects accordingly.');
            } else if (type === 'crystal_altar') {
                logMessage('System', 'You channel energy into the altar. The room resonates, but the core resists. Defeat its guardian to shatter it.');
            } else {
                logMessage('System', 'You take a closer look, noting nothing unusual.');
            }
        }

        function triggerTrapGas(cell, source='step') {
            if (!cell) return;
            const trap = Array.from(cell.querySelectorAll('.object-token')).find(t=> (t.dataset.type||'').startsWith('trap_gas'));
            if (!trap) return;
            const entry = gameState.objectTokens.find(x=> x.id === trap.id);
            if (entry?.state?.disarmed) return; // safe
            const actor = source === 'step' ? 'A defender' : 'You';
            const roll = 1 + Math.floor(Math.random()*20);
            const DC = 13;
            const passed = roll >= DC;
            logMessage('System', `${actor} disturb${source==='step'?'s':''} a sweet-smelling puff of gas (CON DC ${DC}). Roll: ${roll} — ${passed? 'resists the effect.' : 'coughs and staggers, suffering disadvantage briefly.'}`);
        }

        // Emoji mapping for clutter/traps/objects
        function objectEmoji(type) {
            if (!type) return '❓';
            if (type === 'debris') return '🧱';
            if (type === 'crystal_altar') return '🗿';
            if (type.startsWith('trap')) {
                if (type === 'trap_gas') return '💨';
                if (type === 'trap_pit') return '🕳️';
                return '⚠️';
            }
            if (type === 'puzzle_switch') return '🎚️';
            if (type === 'puzzle_dais') return '🗿';
            if (type === 'puzzle_object') return '🧩';
            return type.split('_')[0].charAt(0).toUpperCase();
        }

        function buildHoverCardHtml(md) {
            const name = md.name || 'Unknown';
            const cr = md.cr || '—';
            const ac = md.ac ? `AC ${md.ac}${md.armorType?` (${md.armorType})`:''}` : '';
            const hp = md.hpStr ? `HP ${md.hpStr}` : '';
            const size = md.size || '';
            const rowTop = [ac, hp].filter(Boolean).join(' | ');
            const abil = md.abilityScores || {};
            const abilStr = (['str','dex','con','int','wis','cha']
                .map(k=> abil[k]!=null? `${k.toUpperCase()}:${abil[k]}`:null).filter(Boolean).join('  '));
            const actions = Array.isArray(md.actions) ? md.actions : [];
            const actionsHtml = actions.map((a, i)=> `<button class="hc-action-btn" data-action-idx="${i}">• ${a.name}</button>`).join('');
            const simpleAbilities = Array.isArray(md.abilities) ? md.abilities : (typeof md.abilities === 'string' ? md.abilities.split(/,\s*/) : []);
            const traitsHtml = simpleAbilities.length ? `<div class="hc-list">${simpleAbilities.map(n=>`<div class='hc-item'>• ${n}</div>`).join('')}</div>` : '';
            const descHtml = md.description ? `<div class="hc-row" style="white-space:normal">${md.description}</div>` : '';
            const hintHtml = (md.hasFullStats ? '' : `<div class="hc-hint">Basic preview shown. Open via local server for full stat blocks and rollable actions.</div>`);
            return `
                <div class="hc-name">${name} <span class="hc-sub">(CR ${cr}${size?`, ${size}`:''})</span></div>
                ${rowTop? `<div class="hc-row">${rowTop}</div>`:''}
                ${abilStr? `<div class="hc-row">${abilStr}</div>`:''}
                ${descHtml}
                ${actions.length? `<div class="hc-actions">${actionsHtml}</div>`:''}
                ${traitsHtml}
                ${hintHtml}
                <div class="hc-roll"></div>
            `;
        }

        // Simple roller extracted from bestiary.html conventions
        function rollAction(action) {
            if (!action || !action.description) return '';
            const desc = action.description;
            const toHitMatch = desc.match(/\+(\d+) to hit/);
            const damageMatch = desc.match(/Hit: (\d+) \(([^\)]+)\)/);
            const rolls = [];
            if (toHitMatch) {
                const bonus = parseInt(toHitMatch[1]);
                const d20 = 1 + Math.floor(Math.random()*20);
                rolls.push(`Attack: d20(${d20}) + ${bonus} = ${d20+bonus}`);
            }
            if (damageMatch) {
                const avg = parseInt(damageMatch[1]);
                const formula = damageMatch[2];
                const total = evalDice(formula);
                rolls.push(`Damage: ${formula} = ${total} (avg ${avg})`);
            }
            return rolls.join(' | ');
        }

        function evalDice(formula) {
            // very small parser: supports 'NdM [+/- X]' chains
            let total = 0;
            const parts = formula.split(/\s*[+\-]\s*/);
            const ops = formula.match(/[+\-]/g) || [];
            let sign = +1;
            for (let i=0;i<parts.length;i++) {
                const p = parts[i].trim();
                const m = p.match(/(\d+)d(\d+)(?:\s*([+\-])\s*(\d+))?/i);
                if (m) {
                    const n = parseInt(m[1]);
                    const d = parseInt(m[2]);
                    let subt = 0;
                    for (let r=0;r<n;r++) subt += 1 + Math.floor(Math.random()*d);
                    if (m[3] && m[4]) subt += (m[3]==='-'?-1:1) * parseInt(m[4]);
                    total += sign * subt;
                } else if (/^\d+$/.test(p)) {
                    total += sign * parseInt(p);
                }
                sign = ops[i]==='-'? -1 : 1;
            }
            return total;
        }
        
        function handleTokenInteraction(token) {
             token.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', e.target.id);
                setTimeout(() => {
                    e.target.style.visibility = 'hidden';
                }, 0);
            });
            token.addEventListener('dragend', (e) => {
                e.target.style.visibility = 'visible';
            });
            
            if (token.classList.contains('monster-token')) {
                 token.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    if (confirm(`Defeat ${token.getAttribute('data-tooltip')}?`)) {
                        token.parentElement.removeChild(token);
                        gameState.monsterTokens = gameState.monsterTokens.filter(m => m.id !== token.id);
                        checkRoomCompletion();
                    }
                });
            }
        }

        function fitBoardCells(roomData) {
            const outer = document.getElementById('grid-outer');
            if (!outer) return;
            // Favor width: compute ideal cell from width, then constrain by height if needed
            const availW = outer.clientWidth - 16; // padding safety
            const maxBoardH = Math.floor(window.innerHeight * 0.86); // generous viewport cap
            const cellFromW = Math.floor(availW / roomData.width);
            const cellFromH = Math.floor(maxBoardH / roomData.height);
            let cell = cellFromW; // prefer width
            if (cell > cellFromH) cell = cellFromH; // reduce only if height would overflow
            cell = Math.max(44, Math.min(120, cell));
            document.documentElement.style.setProperty('--cell', cell + 'px');
            const gc = document.getElementById('grid-container');
            if (gc) {
                gc.style.gridTemplateColumns = `repeat(${roomData.width}, 1fr)`;
                gc.style.width = `calc(${roomData.width} * var(--cell))`;
            }
        }

    function renderRoom(roomData) {
            // Clear previous room state
            gridContainer.innerHTML = '';
            puzzleControlsEl.innerHTML = '';
            puzzleControlsEl.classList.add('hidden');
            textLog.innerHTML = '';
            gameState.monsterTokens = [];
            gameState.objectTokens = [];
            gameState.puzzleState = {};
            // Always start with Next disabled until objectives are complete
            if (nextRoomBtn) nextRoomBtn.disabled = true;

            // Setup new room
            roomNameEl.textContent = roomData.name;
            fitBoardCells(roomData);
            
            for (let i = 0; i < roomData.width * roomData.height; i++) {
                const cell = document.createElement('div');
                cell.classList.add('grid-cell');
                cell.dataset.x = i % roomData.width;
                cell.dataset.y = Math.floor(i / roomData.width);

                cell.addEventListener('dragover', (e) => e.preventDefault());
                cell.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const id = e.dataTransfer.getData('text/plain');
                    const draggable = document.getElementById(id);
                    const cellEl = e.currentTarget; // ensure we append to the cell
                    if (draggable && cellEl.classList.contains('grid-cell')) {
                        cellEl.appendChild(draggable);
                        // Trigger traps on player entry
                        if (draggable.classList.contains('player-yellow') || draggable.classList.contains('player-red') || draggable.classList.contains('player-green') || draggable.classList.contains('player-black')) {
                            triggerTrapOnEntry(cellEl, draggable);
                        }
                    }
                });
                gridContainer.appendChild(cell);
            }
            
            // Log messages
            roomData.lore.forEach(line => logMessage(line.speaker, line.text));

            // Place players fresh every room using hard-coded spawns from the room data
            const spawnList = (roomData.layout && Array.isArray(roomData.layout.playerSpawns)) ? roomData.layout.playerSpawns : null;
            const defaultSpawns = [ {x:1,y:3}, {x:1,y:4}, {x:1,y:5}, {x:2,y:4} ];
            const players = [
                { id: 'p_yellow', class: 'player-yellow', label: 'Y' },
                { id: 'p_red', class: 'player-red', label: 'R' },
                { id: 'p_green', class: 'player-green', label: 'G' },
                { id: 'p_black', class: 'player-black', label: 'B' },
            ];
            players.forEach((p, idx) => {
                const spawn = spawnList && spawnList[idx] ? spawnList[idx] : defaultSpawns[idx] || {x:0,y:0};
                const token = createToken(p.class, p.id, p.label, `Defender ${p.class.split('-')[1]}`);
                const cell = gridContainer.querySelector(`[data-x='${spawn.x}'][data-y='${spawn.y}']`);
                if (cell) cell.appendChild(token);
                handleTokenInteraction(token);
            });

            // Place monsters and objects
            roomData.layout.monsters.forEach((m, i) => {
                const md = getMonster(m.type) || { name: m.type, cr: '—', color: '#6B7280' };
                const label = (md.emoji ? md.emoji : md.name.substring(0, 3).toUpperCase());
                const tooltip = `${md.name} (CR: ${md.cr})`;
                const token = createToken('monster-token', `m_${i}`, label, tooltip, md);
                token.style.backgroundColor = md.color;
                if (md.tier) token.setAttribute('data-tier', md.tier);
                gridContainer.querySelector(`[data-x='${m.x}'][data-y='${m.y}']`).appendChild(token);
                handleTokenInteraction(token);
                gameState.monsterTokens.push({id: `m_${i}`, data: md});
            });
            if(gameState.monsterTokens.length > 0) logMessage('System', `${gameState.monsterTokens.length} hostile signatures detected.`);


       roomData.layout.objects.forEach((o, i) => {
              const label = objectEmoji(o.type);
              const tempEntry = { id: `o_${i}`, data: o, state: {} };
              const details = getObjectDetails(tempEntry);
              const objToken = createToken('object-token', tempEntry.id, label, o.flavor, details);
                 if (o.type === 'puzzle_switch') objToken.classList.add('puzzle-switch');
           if (o.type === 'debris') objToken.classList.add('debris');
                 objToken.dataset.type = o.type;
                 gridContainer.querySelector(`[data-x='${o.x}'][data-y='${o.y}']`).appendChild(objToken);
                 gameState.objectTokens.push(tempEntry);
            });


            // Setup puzzle if it exists (support both room-level and layout-level definitions)
            const puzzleData = roomData.puzzle || (roomData.layout && roomData.layout.puzzle) || null;
            if (puzzleData) {
                setupPuzzle(puzzleData);
            }

            // Initial check for completion
            checkRoomCompletion();
        }

        function triggerTrapOnEntry(cellEl, draggable) {
            // Check for active traps in this cell
            const objTokens = Array.from(cellEl.querySelectorAll('.object-token'));
            for (const ot of objTokens) {
                const type = ot.dataset.type || '';
                if (type === 'trap_gas') {
                    const entry = gameState.objectTokens.find(x=> x.id === ot.id);
                    if (entry && !entry.state?.disarmed) {
                        triggerTrapGas(cellEl, 'step');
                    }
                } else if (type === 'trap_pit') {
                    const entry = gameState.objectTokens.find(x=> x.id === ot.id);
                    if (entry && !entry.state?.disarmed) {
                        logMessage('System', 'The floor gives way! You teeter but avoid falling into a concealed pit.');
                    }
                }
            }
        }

        function setupPuzzle(puzzleData) {
            puzzleControlsEl.classList.remove('hidden');
            
            const prompt = document.createElement('p');
            prompt.className = 'text-gray-300 mb-4';
            prompt.textContent = puzzleData.prompt;
            puzzleControlsEl.appendChild(prompt);
            
            const objectSelector = document.createElement('div');
            objectSelector.className = 'mb-2';
            puzzleData.objects.forEach(obj => {
                const btn = document.createElement('button');
                btn.className = 'bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded m-1';
                btn.textContent = obj.label;
                btn.dataset.objectId = obj.id;
                btn.onclick = () => {
                    gameState.puzzleState.selectedObject = obj.id;
                    // Visual feedback
                    puzzleControlsEl.querySelectorAll('[data-object-id]').forEach(b => b.classList.remove('ring-2', 'ring-yellow-400'));
                    btn.classList.add('ring-2', 'ring-yellow-400');
                };
                objectSelector.appendChild(btn);
            });
            puzzleControlsEl.appendChild(objectSelector);

            const daisSelector = document.createElement('div');
            puzzleData.dais.forEach(dais => {
                const btn = document.createElement('button');
                btn.className = 'bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded m-1';
                btn.textContent = dais.label;
                btn.dataset.daisId = dais.id;
                btn.onclick = () => {
                     if (!gameState.puzzleState.selectedObject) {
                        logMessage('System', "Select an object first.");
                        return;
                    }
                    if (!gameState.puzzleState.placements) {
                        gameState.puzzleState.placements = {};
                    }
                    gameState.puzzleState.placements[dais.id] = gameState.puzzleState.selectedObject;
                    logMessage('System', `You placed the ${gameState.puzzleState.selectedObject} on the ${dais.id}.`);
                    
                    const objBtn = puzzleControlsEl.querySelector(`[data-object-id="${gameState.puzzleState.selectedObject}"]`);
                    if(objBtn) objBtn.disabled = true;

                    btn.disabled = true;

                    gameState.puzzleState.selectedObject = null;
                    puzzleControlsEl.querySelectorAll('[data-object-id]').forEach(b => b.classList.remove('ring-2', 'ring-yellow-400'));
                    checkPuzzleCompletion(puzzleData.solution);
                };
                daisSelector.appendChild(btn);
            });
             puzzleControlsEl.appendChild(daisSelector);
        }
        
        function checkPuzzleCompletion(solution) {
            const placements = gameState.puzzleState.placements || {};
            const keys = Object.keys(solution);
            if(Object.keys(placements).length !== keys.length) return;

            let correct = true;
            for(const key of keys) {
                if(placements[key] !== solution[key]) {
                    correct = false;
                    break;
                }
            }
            
            if (correct) {
                logMessage('System', "A low hum resonates through the chamber as the mechanism activates. The way forward is clear!");
                gameState.puzzleState.solved = true;
                checkRoomCompletion();
            } else {
                logMessage('System', "A discordant chime echoes. The arrangement is incorrect. The objects reset themselves.");
                puzzleControlsEl.querySelectorAll('button').forEach(b => b.disabled = false);
                gameState.puzzleState.placements = {};
            }
        }

        function checkRoomCompletion() {
            const roomData = gameState.dungeon[gameState.currentRoomIndex];
            // Use DOM to verify remaining monsters in case any were removed via UI
            const remainingMonsters = document.querySelectorAll('#grid-container .monster-token').length;
            const monstersDefeated = remainingMonsters === 0;
            // Consider either room-level or layout-level puzzle
            const hasPuzzle = Boolean(roomData.puzzle || (roomData.layout && roomData.layout.puzzle));
            const puzzleSolved = !hasPuzzle || (gameState.puzzleState && gameState.puzzleState.solved);
            // If there are any puzzle_switch objects, require they be deactivated
            const switchEntries = (gameState.objectTokens || []).filter(o => o.data.type === 'puzzle_switch');
            const switchesRequirementMet = switchEntries.length === 0 || switchEntries.every(s => s.state && s.state.deactivated);

            const canProceed = monstersDefeated && puzzleSolved && switchesRequirementMet;

            if (canProceed) {
                if (roomData.layout.exit) {
                    nextRoomBtn.disabled = false;
                    logMessage('System', roomData.layout.exit.flavor);
                } else {
                    // Final room: no next button
                    nextRoomBtn.disabled = true;
                    logMessage('System', 'The Castoff is defeated! The oppressive aura lifts. Mission successful.');
                }
            } else {
                nextRoomBtn.disabled = true;
            }
        }

        function generateDungeon() {
            // Use the provided templates as the exact sequence
            gameState.dungeon = ROOM_TEMPLATES.slice();
        }

        function advanceToNextRoom() {
            if (gameState.currentRoomIndex < gameState.dungeon.length - 1) {
                gameState.currentRoomIndex++;
                renderRoom(gameState.dungeon[gameState.currentRoomIndex]);
            }
        }

        // --- INITIALIZATION ---
    async function init() {
            // Try loading runtime bestiary first
            try {
                if (window.MonstersRuntime) {
                    await window.MonstersRuntime.loadMonsters('src/data/Diaper-School-Full-Bestiary.json');
                }
            } catch (e) {
                console.warn('Runtime bestiary failed to load, using static monsters.', e);
            } finally {
                if (ddvrmLoading && ddvrmLoading.parentElement) ddvrmLoading.remove();
            }
            generateDungeon();
            nextRoomBtn.onclick = advanceToNextRoom;
            advanceToNextRoom();

            // Notify about bestiary source
            try {
                if (window.MonstersRuntime && window.MonstersRuntime.cache && window.MonstersRuntime.cache.loaded) {
                    logMessage('SystemInfo', 'Bestiary runtime loaded. Enhanced monster details enabled.');
                } else {
                    logMessage('SystemInfo', 'Using static bestiary. Monster cards show basic abilities; open via the local server for full details.');
                }
            } catch(_) {}

            // Keyboard zoom: + / - / 0 (applies to grid container; recompute fit on resize)
            let scale = 1;
            const applyScale = () => {
                const gc = document.getElementById('grid-container');
                gc.style.transformOrigin = 'center top';
                gc.style.transform = `scale(${scale})`;
            };
            document.addEventListener('keydown', (e) => {
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
                if (e.key === '+' || e.key === '=') { scale = Math.min(2, scale + 0.1); applyScale(); }
                if (e.key === '-' || e.key === '_') { scale = Math.max(0.6, scale - 0.1); applyScale(); }
                if (e.key === '0') { scale = 1; applyScale(); }
            });

            // Re-fit board on resize
            window.addEventListener('resize', () => {
                const room = gameState.dungeon[gameState.currentRoomIndex];
                if (room) fitBoardCells(room);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
