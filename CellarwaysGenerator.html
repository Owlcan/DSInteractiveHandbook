            if (!Array.isArray(items)) {
                console.error("weightedRandom expects an array of weighted objects.", items);
                return null;
            }
            const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
            let random = Math.random() * totalWeight;
            for (const item of items) {
                if (random < item.weight) return item.value;
                random -= item.weight;
            }
            return items.length > 0 ? items[items.length - 1].value : null; // Fallback
        };

        // --- GENERIC CORRIDOR PACKS (simple groups of similar monsters) ---
        // Dice helpers for simple strings like "1d4+2"
        const rollDiceSpec = (spec) => {
            const m = /^(\d+)d(\d+)([+\-]\d+)?$/i.exec(spec.trim());
            if (!m) return 1;
            const n = parseInt(m[1], 10);
            const d = parseInt(m[2], 10);
            const k = m[3] ? parseInt(m[3], 10) : 0;
            let total = 0;
            for (let i = 0; i < n; i++) total += 1 + Math.floor(Math.random() * d);
            return Math.max(1, total + k);
        };
        const averageDiceCount = (spec) => {
            const m = /^(\d+)d(\d+)([+\-]\d+)?$/i.exec(spec.trim());
            if (!m) return 1;
            const n = parseInt(m[1], 10);
            const d = parseInt(m[2], 10);
            const k = m[3] ? parseInt(m[3], 10) : 0;
            return Math.max(1, n * (d + 1) / 2 + k);
        };

            const lower = word.toLowerCase();
            if (/(s|x|z|ch|sh)$/.test(lower)) return word + 'es';
            return word + 's';

            { value: { cr: 2, name: "Infiltrator Scout Team", description: "Two Infiltrators sweep the corridor with breach gear.<br><br><b>Snare:</b> DC 14 Wisdom (Perception) to spot trip-sigils; on failure, triggering one restrains the rearmost creature (DC 14 Dexterity save to avoid)." }, weight: 2 },
            { value: { cr: 2, name: "Void Scholar & Escort", description: "A Void Scholar studies a flickering rune pane while two lurkers keep watch.<br><br><b>Option:</b> DC 15 Intelligence (Arcana) to disrupt the pane, granting advantage against the escorts for 1 round; on a failure by 5+, backlash deals 1d4 lightning damage." }, weight: 1.25 },
            { value: { cr: 5, name: "Warforged Darkwatch Patrol", description: "A Warforged Darkwatch unit sweeps methodically, scanning for anomalies. It signals quietly for reinforcements if not neutralized swiftly." }, weight: 0.5 },
            { value: { cr: 3, name: "Darkforged Survey Detail", description: "A pair of Darkforged constructs methodically probe masonry and cable runs—an eminently unfriendly inspection team." }, weight: 0.75 },
            // Oozes and bosses-in-miniature
            { value: { cr: 2, name: "Pugnacious Puddle", description: "A jittery ooze quivers, spoiling for a fight.<br><br><b>Temper:</b> Cold damage calms it (disadvantage next round); fire enrages it (advantage next attack)." }, weight: 1.25 },
            { value: { cr: 5, name: "Liquid Legion Hunt (Open)", description: "The corridor thrums with the approach of a Liquid Legion mass.<br><br><b>Wave:</b> At the start of the round, creatures in the lane make DC 14 Strength saves or are knocked prone and take 1d4 acid damage." }, weight: 0.6 },
            { value: { cr: 5, name: "Liquid Legion Ambush", description: "A sudden hush precedes a black surge spilling from wall vents. On a failed Perception check, the party is surprised as the Legion surges to engulf.<br><br><b>Engulf:</b> DC 14 Dexterity save or become restrained until the end of your next turn." }, weight: 0.3 },
            // Lairs-in-the-hall
            { value: { cr: 3, name: "Grief-Stone’s Shadow", description: "The corridor subtly narrows; sigils pulse faintly. A hidden Grief-Stone feeds on unease.<br><br><b>Aura:</b> DC 14 Wisdom save or suffer disadvantage on your first action each round while within 20 ft. DC 15 Intelligence (Arcana) or Wisdom (Religion) check suppresses the aura for 1 minute." }, weight: 0.95 },

            // — More corridor variety —
            // Darkling tactics and variants
            { value: { cr: 2, name: "Ceiling Creepers Ambuscade", description: "Three to five Darkling Lurkers press flat against the rafters. Dust falls just before they drop.<br><br><b>Mechanics:</b> DC 14 Perception to notice; readied ranged attacks can hit mid-drop (AC 13)." }, weight: 2 },
            { value: { cr: 2, name: "Slurper Tongue Gauntlet", description: "Slurpers anchor in alcoves, lashing tongues down a narrow run.<br><br><b>Mechanics:</b> On a hit, DC 13 Strength save or be pulled 5 ft and restrained. Tongues: AC 12, 3 HP to sever." }, weight: 1.75 },
            { value: { cr: 3, name: "Caller Relay", description: "Two Callers trade keening signals, coordinating unseen skirmishers.<br><br><b>Escalation:</b> If both Callers remain active by end of round 2, 1d4 minor darklings arrive from each direction." }, weight: 1 },
            { value: { cr: 1, name: "Weirdling Stampede", description: "A herd of jittery Weirdlings ricochets off lockers and molding, chasing a light that isn’t there. They bowl into anything in their path, then scatter." }, weight: 1 },
            { value: { cr: 2, name: "Paralurker Net", description: "Paralurkers have threaded the overhead with sticky filaments.<br><br><b>Net:</b> DC 13 Strength (Athletics) to break free; cutting a strand (AC 12, 5 HP) clears a 5 ft square." }, weight: 1.25 },

            // Environmental hazards and anomalies
            { value: { cr: 2, name: "Arc-Sparker Conduit", description: "A cracked conduit spits blue arcs floor-to-ceiling.<br><br><b>Arcs:</b> Crossing space during an arc requires DC 13 Dexterity save or take 1d4 lightning damage. DC 14 Intelligence (Arcana) to temporarily ground it (action)." }, weight: 1 },
            { value: { cr: 1, name: "Gravity Flip Segment", description: "A short span inverts your step; loose objects drift to the ceiling.<br><br><b>Mechanics:</b> DC 13 Dexterity (Acrobatics) to cross without falling 10 ft onto the ‘ceiling’; secured rope negates the check." }, weight: 0.8 },
            { value: { cr: 2, name: "Time-Lag Pocket", description: "A ripple of slow-time lingers here; projectiles crawl.<br><br><b>Mechanics:</b> Ranged attacks against targets inside have disadvantage. When leaving the pocket, DC 13 Constitution save or suffer -10 ft speed until end of next turn." }, weight: 0.8 },

            // Dark Dimension corridor ops
            { value: { cr: 3, name: "Infiltrator Snare", description: "Tripwire sigils prime a shaped-force snare.<br><br><b>Mechanics:</b> DC 14 Intelligence (Investigation) to locate; triggering forces DC 14 Dexterity save or restrained by force filaments for 1 minute (escape DC 14 Strength or end of turn check)." }, weight: 1.5 },
            { value: { cr: 5, name: "Vanguard Shield Push", description: "A Vanguard advances behind a humming bulwark, trying to compress you into a choke point.<br><br><b>Push:</b> When the wall advances, each adjacent creature makes a DC 15 Strength save or is pushed 10 ft and knocked prone." }, weight: 0.9 },
            { value: { cr: 7, name: "Justicar Passing Judgment", description: "Bootfalls like a metronome precede a Justicar who marks one of you as the offender. It attempts to separate and sentence that target." }, weight: 0.3 },
            { value: { cr: 3, name: "Void Scholar Field Test", description: "A Void Scholar releases a test anomaly that distorts space in a 20 ft stretch. It observes, notes reactions, and attacks only if challenged." }, weight: 1 },

            // Warforged/Darkforged presence
            { value: { cr: 4, name: "Darkwatch Scanpoint", description: "Warforged Darkwatch establishes a scan beam across the hall.<br><br><b>Bypass:</b> DC 15 Dexterity (Stealth) to time and crawl under; failure triggers a remote alarm after 1 round unless the node is disabled (AC 13, 10 HP)." }, weight: 0.6 },
            { value: { cr: 4, name: "Darkforged Remnant Patrol", description: "Two Darkforged Remnants clatter past, scanning for trespassers.<br><br><b>Beacon:</b> Each carries a ping-beacon (AC 12, 5 HP). If a beacon survives 2 rounds of combat, reinforcements may arrive within minutes (DM discretion)." }, weight: 0.8 },
            { value: { cr: 3, name: "Darkforged Survey Trap", description: "A tripod device hums; floor runes glow—a nonlethal stasis trap.<br><br><b>Disable:</b> DC 15 Dexterity (Thieves’ Tools) to disarm; failure restrains the creature for 1 minute or until DC 14 Strength check to break free." }, weight: 0.9 },
            { value: { cr: 2, name: "Warforged Sensor Drone", description: "A floating sensor orb maps the passage in tight grids.<br><br><b>Mechanics:</b> AC 13, HP 8. If not destroyed within 2 rounds, it marks your position and summons heavier forces (DM discretion)." }, weight: 0.9 },

            // Ooze work details
            { value: { cr: 0.5, name: "Stale Slurry Spill", description: "A low tide of inert ooze makes footing treacherous.<br><br><b>Terrain:</b> DC 12 Dexterity (Acrobatics) to cross; loud movement may draw opportunistic slimes in 1d4 rounds." }, weight: 1 },
            { value: { cr: 3, name: "Custodial Cube", description: "A translucent cube polishes the hall with alarming enthusiasm.<br><br><b>Engulf:</b> DC 13 Dexterity save to avoid being engulfed on contact; engulfed creatures are restrained and take 1d4 acid damage per round until they escape (DC 13 Strength)." }, weight: 0.7 },
            { value: { cr: 3, name: "Puddle Pack", description: "Two Pugnacious Puddles jostle for dominance, splashing hotly at the slightest provocation.<br><br><b>Pack Instinct:</b> When one takes damage, the other gains advantage on its next attack." }, weight: 0.6 },
            { value: { cr: 2, name: "Cleaner Foam Discharge", description: "A Mobile Cleaner vents caustic foam from a maintenance hatch.<br><br><b>Foam:</b> Area becomes difficult terrain; creatures starting their turn in foam take 1d4 acid damage (DC 13 Dexterity save halves)." }, weight: 0.5 },

            // Rare or notable passersby
            { value: { cr: 6, name: "Echo Inquisitor’s Afterimage", description: "A temporal smear paces the corridor ahead. Engage and the Inquisitor notices—expect a short, brutal chase through flickering time." }, weight: 0.2 },
            { value: { cr: 4, name: "Hall Monitor Dragnet", description: "Two Monitors string a checkpoint with chalk glyphs and confiscation poles. ‘Papers,’ they demand, meaning ‘permissions you do not have.’" }, weight: 0.7 },
            { value: { cr: 5, name: "Detention Professor on Rounds", description: "A Detention Professor strolls with a switch and a smile. It assigns ‘classwork’ involving restraints and restorative suffering." }, weight: 0.4 },
            { value: { cr: 7, name: "Detention Professors (Melee & Magic) — Duo", description: "Two Detention Professors—one with restraint implements, one in arcane robes—coordinate a corridor ‘lesson’.<br><br><b>Mechanics:</b> The melee Professor attempts to bind (on a hit, DC 14 Strength (Athletics) to escape); the magic Professor imposes disadvantage on spell attacks within 10 ft while chanting. <b>Escape Option:</b> Group challenge: 2 successes before 1 failure using DC 14 Dexterity (Stealth) to break sightlines or DC 14 Intelligence (Investigation) to route through side cover; success: you slip past without pursuit, failure: they press the lesson (begin combat, duo gains advantage on the first round). <b>Defuse Option:</b> Present a credible corrective plan: DC 15 Charisma (Persuasion/Deception) AND DC 14 Intelligence (Arcana) to satisfy the arcane rubric; success: they stamp a ‘Gold Star’ (gain advantage on one future check here) and move on; failure: stern warning (no combat unless provoked)." }, weight: 0.25 },
            { value: { cr: 4, name: "Primogenitor’s Scent", description: "The air goes thin—lurkers tense. You’re moving through the hunting lane of a Lurker Primogenitor. It may test you with a feint." }, weight: 0.3 },

            // Liquid Legion signs
            { value: { cr: 3, name: "Liquid Legion Dripfeed", description: "Condensation beads go ink-black and begin marching—early Legion massing.<br><br><b>Escalation:</b> If not disrupted within 3 rounds (fire/cold/purity magic), this escalates into a Liquid Legion encounter." }, weight: 0.7 },
            { value: { cr: 1, name: "Legion Residue Hazard", description: "Patchy, reactive residue clings to the floor, flowing toward warmth and sound.<br><br><b>Mechanics:</b> Stealth checks have disadvantage unless you mask heat/noise (DC 13 Wisdom (Survival) to prepare)." }, weight: 0.9 },

            // Windows and oddities
            { value: { cr: 2, name: "Window Gauntlet", description: "A run of stubborn panes emit psychic crosswind; Weirdlings press their faces to the glass.<br><br><b>Mechanics:</b> DC 13 Wisdom save or suffer disadvantage on Perception checks for 10 minutes from disorienting whispers." }, weight: 0.9 },
            { value: { cr: 0, name: "Slime Cube Princess Crossing (Non-Combat)", description: "The Slime Cube Princess oozes across the hall, crown askew. She pauses if greeted politely, then continues her promenade." }, weight: 0.2 },
            { value: { cr: 4, name: "Grief-Stone Pressure Fluctuation", description: "Air grows heavy and choices feel worse; a nearby Grief-Stone flexes its will.<br><br><b>Mechanics:</b> DC 14 Wisdom save to act normally; failure imposes disadvantage on your first roll this scene. A successful DC 15 Arcana/Religion check suppresses the effect for 10 minutes." }, weight: 0.7 },

            // New corridor additions
            { value: { cr: 2, name: "Steam Vent Burst", description: "A magitech steam line hisses, then vents scalding vapor down the hall.<br><br><b>Mechanics:</b> Creatures in a 20 ft line make DC 13 Dexterity saves or take 1d4 fire damage and are blinded until the end of their next turn; success halves and negates blind. Disabling the valve (DC 14 Tools) stops future bursts." }, weight: 1 },
            { value: { cr: 3, name: "Detention Net Drop", description: "A ceiling rack snaps, dropping a runic detention net.<br><br><b>Mechanics:</b> DC 14 Dexterity save or restrained; a creature can cut free (AC 12, 10 HP) or make DC 14 Strength (Athletics) to escape as an action." }, weight: 1 },
            { value: { cr: 4, name: "Detention Professor (Melee) Corridor Drill", description: "The melee Detention Professor calls for ‘form and focus’—a brisk corridor drill with restraint practice.<br><br><b>Mechanics:</b> A creature can comply: best-of-3 DC 14 checks (Strength (Athletics) or Dexterity (Acrobatics)). On success, earn a minor ‘Gold Star’ boon (+1 to a single Strength/Dexterity check later here); on failure, you’re briefly bound (escape DC 13 Strength) and take 1 nonlethal bludgeoning. <b>Defuse:</b> DC 14 Charisma (Persuasion) to present a self-directed exercise plan; success averts the drill without combat." }, weight: 0.9 },
            { value: { cr: 4, name: "Detention Professor (Magic) Calibration Walk", description: "The magic Detention Professor paces a humming rune-stick, insisting on ‘responsible casting’ in the hall.<br><br><b>Mechanics:</b> Spell attacks made within 10 ft are at disadvantage while the calibration hums. <b>Assist/Defuse:</b> DC 14 Intelligence (Arcana) to help re-tune it, ending the hum for 10 minutes and granting +1 on the next Arcana/Tools check here; failure by 5+ pops for 1d4 lightning to the assister." }, weight: 0.85 },
            { value: { cr: 2, name: "Mirror Pane Doppel", description: "A warped pane casts a living reflection that mimics the front-most creature with half potency.<br><br><b>Mechanics:</b> DC 14 Wisdom save to resist the doppel. On failure, the Reflection acts on initiative 10 with basic attacks at disadvantage; breaking the pane (AC 12, 8 HP) ends it." }, weight: 0.8 },
            { value: { cr: 1, name: "Shifting Stair", description: "Steps stretch and compact unpredictably.<br><br><b>Mechanics:</b> Climbing requires DC 12 Dexterity (Acrobatics); failure slides the creature 10 ft back and prone. A secured rope grants advantage." }, weight: 1 },
            { value: { cr: 3, name: "Confiscation Checkpoint", description: "A Hall Monitor and an Auditor establish a portable gate.<br><br><b>Checks:</b> DC 14 Charisma (Deception) to pass; DC 15 Dexterity (Sleight of Hand) to conceal contraband. Failure: lose 1d3 items tagged as ‘confiscated’ or provoke a brief scuffle." }, weight: 1.2 },
            { value: { cr: 2, name: "Mana Leak", description: "A conduit leak thins magic briefly.<br><br><b>Mechanics:</b> For 1 minute, spell attacks have disadvantage within 20 ft; DC 14 Intelligence (Arcana) can patch the leak for 10 minutes, restoring normal values." }, weight: 0.9 },
            { value: { cr: 2, name: "Ghostiby Book Runner", description: "A Darkling-Ghostiby dashes past, juggling tomes it ‘borrowed’.<br><br><b>Options:</b> DC 13 Dexterity (Sleight of Hand) to snatch a book (random minor scroll); DC 12 Charisma (Performance) to amuse it and get a harmless giggle-curse boon (+1 to next save)." }, weight: 0.7 },
            { value: { cr: 4, name: "Darkforged Maintenance Crew", description: "Two Darkforged Remnants weld a plate while a third watches.<br><br><b>Mechanics:</b> Approaching within 10 ft triggers a warning pulse (DC 13 Wisdom save or frightened until end of next turn). Disabling the welding node (AC 13, 12 HP) draws their attention." }, weight: 0.8 },
            { value: { cr: 3, name: "Arcane Draft", description: "A corridor cross-breeze shuffles papers into legible, pleading messages.<br><br><b>Mechanics:</b> Reading grants a clue; DC 13 Wisdom (Insight) to glean useful route info (advantage on next Navigation-type decision)." }, weight: 0.9 },
            { value: { cr: 2, name: "Weirdling Lantern Moths", description: "Luminous moths cluster and follow warmth.<br><br><b>Mechanics:</b> DC 12 Wisdom (Animal Handling) to guide them away; success grants dim-light advantage on next Perception in this corridor; failure draws a curious Lurker in 1d4 rounds." }, weight: 0.9 },

            // Light, non-combat corridor set pieces (minor fun / hazards)
            { value: { cr: 0.5, name: "Runaway Study Cart (Non-Combat)", description: "A squeaky study cart barrels down the corridor piled high with textbooks.<br><br><b>Mechanics:</b> DC 12 Dexterity save or be jostled for 1 bludgeoning and pushed 5 ft; success steps aside. DC 12 Dexterity (Sleight of Hand) to snag a drifting pamphlet (flavor clue or minor +1 on next Investigation)." }, weight: 1.2 },
            { value: { cr: 0, name: "Mischief Bell String (Non-Combat)", description: "A hair-thin string of tiny bells crosses at ankle height.<br><br><b>Mechanics:</b> DC 13 Wisdom (Perception) to notice; DC 13 Dexterity (Thieves' Tools) to unhook silently. On trigger, jingling imposes disadvantage on Stealth checks here for 10 minutes and may draw a patrolling Auditor at DM discretion." }, weight: 1.1 },
            { value: { cr: 0.5, name: "Hopscotch Glyphs", description: "Chalk glyphs paint a hopscotch path that pulses faintly.<br><br><b>Mechanics:</b> A creature can attempt the pattern (DC 13 Dexterity (Acrobatics)): success grants +1 on next Dexterity-based check; failure produces a harmless spark-pop (1 lightning, no ongoing effect)." }, weight: 1 },
            { value: { cr: 0.25, name: "Ooze Hammock", description: "A sagging, benign ooze forms a hammock between lockers. It wobbles invitingly.<br><br><b>Mechanics:</b> Resting in it requires DC 12 Constitution save; on failure, sticky residue halves speed for 1 minute; on success, gain a minor comfort boon (+1 on next saving throw)." }, weight: 0.8 },
            { value: { cr: 0, name: "Vending Rune Kiosk (Non-Combat)", description: "A humming kiosk offers ‘Student Refreshments’. The runes accept coins, buttons, or compliments.<br><br><b>Mechanics:</b> Spend a trivial token to receive a random trinket (DM’s table) or a one-use +1 to a single check within the next hour (flavor). Tampering (DC 14 Tools) risks a zap (1d4 lightning)." }, weight: 0.9 },

            // Another round of minor corridor moments
            { value: { cr: 0, name: "Paper Wing Swarm (Non-Combat)", description: "Folded paper birds spiral on a dust devil of stale air.<br><br><b>Mechanics:</b> DC 12 Dexterity (Acrobatics) to move through without distraction; success grants +1 on your next Initiative in this corridor; failure imposes disadvantage on your next Perception here (rustling)." }, weight: 0.9 },
            { value: { cr: 0.25, name: "Wayfinding Echo Markers", description: "Subtle pressure plates echo your steps with a half-second delay.<br><br><b>Mechanics:</b> DC 13 Wisdom (Perception) to notice and step lightly; until disabled (DC 13 Tools), Stealth checks in this stretch are at disadvantage due to the echo." }, weight: 0.8 },
            { value: { cr: 0, name: "Custodian’s ‘Wet Floor’ Illusion", description: "A persistent glamor paints a glossy ‘wet’ sheen on stone.<br><br><b>Mechanics:</b> DC 12 Intelligence (Investigation) to see it’s harmless; hurrying creatures must make DC 12 Dexterity saves or hesitate (lose 5 ft of movement) from caution." }, weight: 0.8 },
            { value: { cr: 0, name: "Whisper Lockers (Non-Combat)", description: "Lockers murmur gossip; offering a harmless secret hushes them.<br><br><b>Mechanics:</b> Share a small truth to gain +1 on your next Insight here; refusing imposes disadvantage on your next Persuasion in this corridor (they tattle)." }, weight: 0.7 },
            { value: { cr: 0.5, name: "Sliding Wall Panel", description: "A wall panel shunts slowly across the hall.<br><br><b>Mechanics:</b> DC 13 Strength (Athletics) to wedge or DC 13 Tools to jam its track; failure squeezes a creature for 1 bludgeoning and halves speed for 1 minute (stiff)." }, weight: 0.7 },
            { value: { cr: 0, name: "Vending Rune Kiosk — Diaper Discounter (Non-Combat)", description: "A blinking kiosk labeled Personal Care rattles to life. Its price tables are obviously decades out of date. It lists a Magidiaper +3 for only 100 gp, with 1d3 in stock.<br><br><b>Mechanics:</b> A creature may purchase a Magidiaper +3 for 100 gp each (roll 1d3 for available stock). DC 13 Intelligence (Investigation) notices the outdated pricing. Attempting to access admin settings (DC 14 Tools or Intelligence (Arcana)) on success restores hard access to the vendor server—discounted items are removed and the kiosk refreshes with 3 standard health potions available at the normal selling price (DM’s prevailing rate). On failure, it shocks the user for 1d4 lightning and locks the kiosk for 10 minutes." }, weight: 0.7 },

            // Grief-Stone themed corridor additions
            { value: { cr: 3, name: "Hounding Grief-Stone Tile", description: "A living grief-stone tile clicks loose and begins shadowing your steps, skittering underfoot with malign intent.<br><br><b>Mechanics:</b> At the start of each round, creatures within 10 ft make a DC 14 Wisdom save or suffer disadvantage on their first roll that round. The tile moves up to 10 ft toward the last moving creature’s space. Prying it up (AC 13, 10 HP) or warding it (DC 15 Religion/Arcana, action) suppresses it for 1 minute." }, weight: 1.0 },
            { value: { cr: 2, name: "Paralurkers Under the Stone", description: "A small pack of paralurkers has already triggered a grief-stone and is panicking, dropping erratically from the ceiling.<br><br><b>Mechanics:</b> Paralurkers have disadvantage on their first attack each. Creatures in the aura make DC 13 Wisdom saves or have disadvantage on their first roll this round. Loud claps or sudden light can bait them across the tile again, forcing them to scatter for 1 round." }, weight: 0.95 },
        ];

        const roomEncounters = [
            // Dark Dimension cadres (common room threats)
            { value: { cr: 4, name: "Infiltrator Team", description: "A pair of Infiltrators examine a glyph, ready to breach.<br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Show Mechanics</button><div style='display:none'><b>Snare Grid:</b> DC 14 Intelligence (Investigation) to map trip-sigils; triggering forces a DC 14 Dexterity save or restrained by force-filaments (escape DC 14 Strength).<br><b>Tactic:</b> They focus the rearmost target; breaking line of sight cancels their opening gambit.</div>" }, weight: 4 },
            { value: { cr: 2, name: "Void Scholar at Work", description: "A Void Scholar calibrates a humming rune lattice.<br><br><b>Option:</b> DC 15 Intelligence (Arcana) to disrupt and grant advantage vs nearby foes for 1 round; on failure by 5+, backlash deals 1d4 lightning to the disruptor." }, weight: 2.5 },
            { value: { cr: 5, name: "Vanguard's Post", description: "A Vanguard guards a ‘nothing’ doorway with a bulwark.<br><br><b>Shield Push:</b> When it advances, each adjacent creature must succeed on a DC 15 Strength save or be pushed 10 ft and knocked prone. Disabling the anchor rune (AC 12, 10 HP) reduces its push by half." }, weight: 2 },
            { value: { cr: 7, name: "Justicar's Judgment", description: "A Justicar inspects the room and marks an offender.<br><br><b>Mark:</b> One creature must make a DC 15 Wisdom save or is <i>Judged</i>—the Justicar has advantage vs that target until the mark is broken (total cover or 2 consecutive successful saves at end of turn)." }, weight: 1 },
            { value: { cr: 9, name: "The Dean's Office", description: "A Disciplinary Dean studies a scrying pool.<br><br><b>Edict:</b> DC 16 Charisma (Persuasion) to receive a ‘reduced sentence’; failure triggers restraints (escape DC 15 Strength) and psychic reprimand (1d6 psychic). Compliance averts combat but imposes a minor penalty (DM discretion)." }, weight: 0.5 },

            // Darkling faculty and classroom horrors
            { value: { cr: 5, name: "Detention Professor’s Lesson", description: "A Detention Professor addresses an empty class. The party is ‘late’.<br><br><b>Exercise:</b> Best-of-3 DC 14 checks (choose each round: Strength (Athletics), Dexterity (Acrobatics), or Intelligence (Arcana) if magic). Win: earn a <i>Gold Star</i> (inspiration or advantage once). Lose: take 1d6 nonlethal and a detention slip." }, weight: 3 },
            { value: { cr: 3, name: "Hall Monitor Tribunal", description: "Two Hall Monitors and a Caller stage a tribunal.<br><br><b>Defense:</b> Group skill challenge: 3 successes before 2 failures (DC 14 Persuasion/Deception/Insight). Success: ‘time served’; Failure: citations and attempted detention (restraints, escape DC 13 Strength)." }, weight: 1.5 },

            // Lurker/slurper dens and primogenitor packs
            { value: { cr: 4, name: "Primogenitor Lurker Pack", description: "A Lurker Primogenitor rules a low ceiling den with escorts.<br><br><b>Ceiling Squeeze:</b> Creatures taller than 5 ft make DC 13 Dexterity (Acrobatics) to avoid disadvantage from cramped space. Dislodging two anchor strands (AC 12, 5 HP each) opens the ceiling." }, weight: 2 },
            { value: { cr: 2, name: "Paralurker Nursery", description: "A soot-stained ceiling hides a brood of paralurkers.<br><br><b>Skittish:</b> Fire or thunder forces them to scatter for 1 round; a Caller can reform them at the end of the next round unless silenced (DC 14)." }, weight: 1.5 },

            // Oozes and anomalies
            { value: { cr: 5, name: "Grief-Stone Ambush", description: "A Grief-Stone masquerades as a column.<br><br><b>Aura:</b> DC 14 Wisdom save at start of each turn or suffer disadvantage on your next action. DC 15 Intelligence (Arcana) or Wisdom (Religion) suppresses the aura for 1 minute; damaging the Stone ends the effect." }, weight: 3 },
            { value: { cr: 5, name: "Liquid Legion (Open Hunt)", description: "The room is a basin for a gathering ooze.<br><br><b>Wave:</b> At the start of the round, creatures in low ground make DC 14 Strength saves or are knocked prone and take 1d4 acid damage; high ground grants advantage on the save." }, weight: 1.25 },
            { value: { cr: 5, name: "Liquid Legion (Ambush)", description: "Floor vents exhale and black volume pours in.<br><br><b>Engulf:</b> DC 14 Dexterity save or become restrained until the end of your next turn. A creature can pull an ally free with a DC 14 Strength (Athletics) check." }, weight: 0.75 },
            { value: { cr: 2, name: "Pugnacious Puddle", description: "The Puddle thumps like a heart and picks the smallest challenger.<br><br><b>Temper:</b> Cold calms (disadvantage next round); fire enrages (advantage next attack). Mopping with neutralizing agents (DC 13 Intelligence (Nature)) halves its HP." }, weight: 1.5 },

            // Courts of the Slimepress
            { value: { cr: 10, name: "Audience with the Shadow Slimepress (BOSS)", description: "The Shadow Slimepress reclines upon an obsidian cradle, attended by the Viscount of Viscera, the Royal Jesters of Despair, and the Baroness of Black Bile. The coterie is always present." }, weight: 0.2 },
            { value: { cr: 3, name: "Viscount of Viscera’s Inspection", description: "The Viscount of Viscera conducts a gooey ‘audit’ with two attendants. Etiquette is a weapon here—and so are blades." }, weight: 0.75 },
            { value: { cr: 3, name: "Baroness of Black Bile’s Soirée", description: "A bile-black reception with cruel amusements. Guests include a Yowler and a Slurper acting as ‘servers’." }, weight: 0.75 },
            { value: { cr: 4, name: "Royal Jesters of Despair", description: "Cackling jests sour courage. Failing a Wisdom save turns resolve to rubber. The show ends only when the stage is cleared." }, weight: 0.75 },

            // Rare elementals and void shapes
            { value: { cr: 6, name: "Nightshade Elemental (RARE)", description: "An altar room worships a Nightshade Elemental. Lurkers and slurpers genuflect; the air tastes of ozone and regret." }, weight: 0.5 },

                if (loot && loot.encounterCR && (!encounter || encounter.cr < loot.encounterCR)) {
                      // Force a stronger encounter if required by loot; prefer room-specific pool
                      const specific = roomSpecificEncounters[type];
                      let pool = (specific && specific.length) ? specific : roomEncounters;
                      let requiredEncounters = pool.filter(e => (e.value?.cr ?? 0) >= loot.encounterCR);
                      if (requiredEncounters.length === 0) {
                          requiredEncounters = roomEncounters.filter(e => (e.value?.cr ?? 0) >= loot.encounterCR);
                      }
                      if (requiredEncounters.length > 0) {
                          encounter = weightedRandom(requiredEncounters);
                      }
                }

            if (encounter) {
                 const perceptionDC = Math.ceil(encounter.cr) + 10;
                 html += `<div class="mt-4"><h3 class="section-title text-xl mb-2 pb-1">Encounter</h3><p><strong>${encounter.name} (CR ${encounter.cr}):</strong> ${encounter.description} A DC ${perceptionDC} Perception check might be needed to notice them in the ${lighting.toLowerCase()} lighting.</p></div>`;
            }

            // Slightly higher loot odds in Window Gallery Room (bonus simple cache if none rolled)
            if (!loot && isWindowGalleryRoom && Math.random() < 0.2) {
                html += `<div class="mt-4"><h3 class="section-title text-xl mb-2 pb-1">Loot</h3><p>Tucked behind a cracked frame, you find a small pouch containing a handful of coins worth about ${Math.floor(Math.random() * 40) + 10} GP.</p></div>`;
            } else if (loot) {
                html += `<div class="mt-4"><h3 class="section-title text-xl mb-2 pb-1">${loot.title}</h3><p>${loot.description}</p></div>`;
            }

            output.innerHTML = html;
            // Reset one-shot forcing after use
            if (lastCorridorType === 'Ritual Approach') {
                lastCorridorType = null;
            }
        };

        // --- ENCOUNTER INDEX (browse all encounters without rolling) ---
        const normalizeEncounterArray = (arr, typeLabel) => {
            if (!Array.isArray(arr)) return [];
            return arr.map((e) => ({
                type: typeLabel,
                name: e.value?.name ?? "Unknown",
                cr: e.value?.cr ?? 0,
                description: e.value?.description ?? "",
                weight: typeof e.weight === 'number' ? e.weight : 1,
            }));
        };

    const renderEncounterList = (items, containerId) => {
            const container = document.getElementById(containerId);
            if (!container) return;
            if (!items || items.length === 0) {
                container.innerHTML = `<p class="text-gray-500 italic">No encounters match your filter.</p>`;
                return;
            }
            const rows = items.map((it) => {
                return `
                <li class="p-3 rounded-md bg-gray-800/60 border border-gray-700 hover:bg-gray-800 transition">
                    <div class="flex items-center justify-between">
                        <div class="font-semibold text-gray-100">${it.name}</div>
            <div class="text-sm text-gray-400">CR ${it.cr}</div>
                    </div>
                    <p class="text-sm text-gray-400 mt-1">${it.description}</p>
                </li>`;
            }).join('');
            container.innerHTML = `<ul class="space-y-2">${rows}</ul>`;
        };

        const sortEncounters = (items) => {
            return [...items].sort((a, b) => {
                if (a.cr !== b.cr) return a.cr - b.cr; // by CR asc
                return a.name.localeCompare(b.name);
            });
        };

        let encounterIndexData = null;
        const renderEncounterIndex = () => {
            // Build normalized data once
            encounterIndexData = {
                corridor: normalizeEncounterArray(corridorEncounters, 'Corridor'),
                room: normalizeEncounterArray(roomEncounters, 'Room'),
            };

            // Prepare generic packs (use expected count for approx CR)
            const genericCorridor = genericCorridorPacks.map((e) => {
                const v = e.value;
                const avgCount = Math.max(1, Math.round(averageDiceCount(v.countDice)));
                const approxCR = roundCR((v.memberCR || 0) * avgCount);
                return {
                    type: 'Corridor (Generic Pack)',
                    name: `${v.label}`,
                    cr: approxCR,
                    description: `Pack size: ${v.countDice} ${pluralize(v.memberName)} • Member CR ${v.memberCR}. ${v.tactics}`,
                    weight: typeof e.weight === 'number' ? e.weight : 1,
                };
            });

            const totalCorridor = encounterIndexData.corridor.length;
            const totalRoom = encounterIndexData.room.length;
            const totalGeneric = genericCorridor.length;

            const html = `
                <div>
                    <h2 class="text-2xl font-bold mb-2">Encounter Index</h2>
                    <p class="text-gray-400 mb-4">Browse all possible encounters without rolling. Use the filter to quickly find a name or keyword.</p>

                    <div class="mb-6">
                        <input id="encounter-search" type="text" placeholder="Filter by name or text…" 
                            class="w-full bg-gray-800 text-gray-100 placeholder-gray-500 border border-gray-700 focus:border-teal-400 focus:ring-2 focus:ring-teal-400/40 rounded-md px-4 py-2 outline-none" />
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <section class="col-span-1">
                            <div class="flex items-baseline justify-between mb-2">
                                <h3 class="section-title text-xl pb-1">Corridor Encounters</h3>
                                <span id="corridor-count" class="text-sm text-gray-400">${totalCorridor}</span>
                            </div>
                            <div id="corridor-list"></div>

                            <div class="flex items-baseline justify-between mb-2 mt-6">
                                <h3 class="section-title text-xl pb-1">Generic Corridor Packs</h3>
                                <span id="generic-corridor-count" class="text-sm text-gray-400">${totalGeneric}</span>
                            </div>
                            <div id="generic-corridor-list"></div>
                        </section>

                        <section class="col-span-1">
                            <div class="flex items-baseline justify-between mb-2">
                                <h3 class="section-title text-xl pb-1">Room Encounters</h3>
                                <span id="room-count" class="text-sm text-gray-400">${totalRoom}</span>
                            </div>
                            <div id="room-list"></div>
                        </section>
                    </div>
                </div>
            `;

            output.innerHTML = html;

            // Initial render, sorted by CR then name
            renderEncounterList(sortEncounters(encounterIndexData.corridor), 'corridor-list');
            renderEncounterList(sortEncounters(encounterIndexData.room), 'room-list');
            renderEncounterList(sortEncounters(genericCorridor), 'generic-corridor-list');

            const input = document.getElementById('encounter-search');
            input?.addEventListener('input', () => {
                const q = input.value.trim().toLowerCase();
                const filterFn = (it) => !q || it.name.toLowerCase().includes(q) || it.description.toLowerCase().includes(q);
                const filteredCorridor = sortEncounters(encounterIndexData.corridor.filter(filterFn));
                const filteredRoom = sortEncounters(encounterIndexData.room.filter(filterFn));
                const filteredGeneric = sortEncounters(genericCorridor.filter(filterFn));
                document.getElementById('corridor-count').textContent = `${filteredCorridor.length}/${totalCorridor}`;
                document.getElementById('room-count').textContent = `${filteredRoom.length}/${totalRoom}`;
                document.getElementById('generic-corridor-count').textContent = `${filteredGeneric.length}/${totalGeneric}`;
                renderEncounterList(filteredCorridor, 'corridor-list');
                renderEncounterList(filteredRoom, 'room-list');
                renderEncounterList(filteredGeneric, 'generic-corridor-list');
            });
        };

        // --- EVENT LISTENERS ---
        document.getElementById('generate-corridor-btn').addEventListener('click', generateCorridor);
        document.getElementById('generate-room-btn').addEventListener('click', generateRoom);
    document.getElementById('show-index-btn').addEventListener('click', renderEncounterIndex);

        // Collapsible window toggle (event delegation)
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.window-toggle');
            if (!btn) return;
            const content = btn.nextElementSibling;
            if (!content) return;
            content.classList.toggle('hidden');
        });
    </script>
</body>
</html>
