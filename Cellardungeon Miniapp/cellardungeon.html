        let monsterImageIndex = null;
        const buildMonsterImageIndex = () => {
            if (monsterImageIndex) return monsterImageIndex;
            const idx = new Map();
            const aliasMap = monsterImageAliases();

            const buildMonsterImageUrl = (filename) => {
                try {
                    return new URL(MONSTER_IMAGE_DIR + encodeURIComponent(filename), window.location.href).toString();
                } catch {
                    return MONSTER_IMAGE_DIR + encodeURIComponent(filename);
                }
            };

            const extRank = (fn) => {
                const m = /\.([a-z0-9]+)$/i.exec(fn || '');
                const ext = (m ? m[1].toLowerCase() : '');
                if (ext === 'webp') return 3;
                if (ext === 'png') return 2;
                if (ext === 'jpg' || ext === 'jpeg') return 1;
                return 0;
            };

            for (const filename of monsterImageManifest) {
                const base = String(filename || '').replace(/\.(webp|png|jpe?g)$/i, '');
                const key = normalizeBestiaryName(base);
                if (!key) continue;
                const url = buildMonsterImageUrl(filename);
                const prev = idx.get(key);
                if (!prev) {
                    idx.set(key, url);
                    continue;
                }
                // Prefer better formats when duplicates exist.
                const prevUrl = String(prev);
                const prevFile = decodeURIComponent(prevUrl.substring(prevUrl.lastIndexOf('/') + 1));
                if (extRank(filename) > extRank(prevFile)) idx.set(key, url);
            }

            // Merge explicit aliases
            for (const [aliasKey, aliasUrl] of aliasMap.entries()) {
                if (!aliasKey || !aliasUrl) continue;
                idx.set(aliasKey, aliasUrl);
            }

            monsterImageIndex = idx;
            return idx;
        };

        const getMonsterImageUrlForName = (name) => {
            if (!name) return null;
            const idx = buildMonsterImageIndex();
            const key = normalizeBestiaryName(name);
            if (!key) return null;
            const direct = idx.get(key);
            if (direct) return direct;
            const patternMatch = () => {
                const contains = (frag) => key.includes(frag);
                if (contains('void scholar')) {
                    // Hard-map any void scholar variant straight to the canonical art
                    const direct = idx.get(normalizeBestiaryName('void scholar'))
                        || idx.get(normalizeBestiaryName('dark dimension void scholar'))
                        || idx.get(normalizeBestiaryName('darkdimensionvoidscholar'))
                        || idx.get(normalizeBestiaryName('void scholar & escort'));
                    if (direct) return direct;
                    // Fallback even if escort or other fluff is present
                    return idx.get(normalizeBestiaryName('darkdimensionvoidscholar'));
                }
                if (contains('detention professor')) {
                    if (contains('magic')) {
                        return idx.get(normalizeBestiaryName('detention professor (magic)')) || idx.get(normalizeBestiaryName('detention professor magic'));
                    }
                    if (contains('melee') || contains('weapon')) {
                        return idx.get(normalizeBestiaryName('detention professor (melee)')) || idx.get(normalizeBestiaryName('detention professor weapons'));
                    }
                    return idx.get(normalizeBestiaryName('detention professor'));
                }
                if (contains('darkforged remnant')) {
                    const candidates = [
                        'darkforged remnant brute',
                        'darkforged remnant bulwark',
                        'darkforged remnant lash',
                        'darkforged remnant spike',
                        'darkforged remnant',
                        'darkforged remnants',
                    ];
                    for (const label of candidates) {
                        const u = idx.get(normalizeBestiaryName(label));
                        if (u) return u;
                    }
                }
                if (contains('grief stone')) {
                    const candidates = ['grief stone', 'grief stones'];
                    for (const label of candidates) {
                        const u = idx.get(normalizeBestiaryName(label));
                        if (u) return u;
                    }
                }
                if (contains('yowler')) {
                    return idx.get(normalizeBestiaryName('darkling yowler')) || idx.get(normalizeBestiaryName('yowler on the prowl'));
                }
                if (contains('primogenitor')) {
                    const candidates = [
                        'lurker primogenitor',
                        "primogenitor's scent",
                        'primogenitor lurker pack',
                    ];
                    for (const label of candidates) {
                        const u = idx.get(normalizeBestiaryName(label));
                        if (u) return u;
                    }
                }
                if (contains('echo inquisitor')) {
                    const candidates = [
                        'echo inquisitor',
                        "echo inquisitor's afterimage",
                    ];
                    for (const label of candidates) {
                        const u = idx.get(normalizeBestiaryName(label));
                        if (u) return u;
                    }
                }
                if (contains('sensor drone')) {
                    const candidates = [
                        'sensor drone',
                        'warforged sensor drone',
                    ];
                    for (const label of candidates) {
                        const u = idx.get(normalizeBestiaryName(label));
                        if (u) return u;
                    }
                }
                if (contains('ping') && contains('beacon')) {
                    const candidates = [
                        'ping beacon',
                        'ping-beacon',
                    ];
                    for (const label of candidates) {
                        const u = idx.get(normalizeBestiaryName(label));
                        if (u) return u;
                    }
                }
                if (contains('liquid legion')) {
                    return idx.get(normalizeBestiaryName('liquid legion mass')) || idx.get(normalizeBestiaryName('liquid legion'));
                }
                if (contains('ghostiby')) {
                    return idx.get(normalizeBestiaryName('ghostiby')) || idx.get(normalizeBestiaryName('ghostiby book runner'));
                }
                return null;
            };
            const patternUrl = patternMatch();
            if (patternUrl) return patternUrl;
            // Try stripping trailing parentheses (e.g., variants)
            const stripped = key.replace(/\s*\([^)]*\)\s*$/g, '').trim();
            if (stripped && stripped !== key) return idx.get(stripped) || null;
            // Very simple singularization fallback ("slimes" -> "slime")
            if (key.endsWith('es')) {
                const k2 = key.slice(0, -2);
                if (idx.has(k2)) return idx.get(k2);
            }
            if (key.endsWith('s')) {
                const k2 = key.slice(0, -1);
                if (idx.has(k2)) return idx.get(k2);
            }
            return null;
        };

            if (tooltipHideTimer) {
                clearTimeout(tooltipHideTimer);
                tooltipHideTimer = null;
            }
        };
        const scheduleHideMapTooltip = (delayMs = 140) => {
            cancelHideMapTooltip();
            tooltipHideTimer = setTimeout(() => {
                if (!tooltipPinned) hideMapTooltip();
            }, Math.max(0, Number(delayMs) || 0));
        };

        const showMapTooltip = (evt, html) => {
            const tt = document.getElementById('map-tooltip');
            if (!tt) return;
            cancelHideMapTooltip();
            tooltipPinned = false;
            tt.innerHTML = html;
            tt.classList.add('visible');
            tt.classList.toggle('interactive', /data-open-bestiary\s*=/.test(String(html || '')));
            moveMapTooltip(evt);
        };
        const moveMapTooltip = (evt) => {
            const tt = document.getElementById('map-tooltip');
            if (!tt || !tt.classList.contains('visible')) return;
            const pad = 14;
            const x = clamp(evt.clientX + pad, 10, window.innerWidth - 10);
            const y = clamp(evt.clientY + pad, 10, window.innerHeight - 10);
            tt.style.left = `${x}px`;
            tt.style.top = `${y}px`;

            // Prevent offscreen overflow after size is known
            const rect = tt.getBoundingClientRect();
            if (rect.right > window.innerWidth - 8) {
                tt.style.left = `${Math.max(8, window.innerWidth - rect.width - 8)}px`;
            }
            if (rect.bottom > window.innerHeight - 8) {
                tt.style.top = `${Math.max(8, window.innerHeight - rect.height - 8)}px`;
            }
        };
        const hideMapTooltip = () => {
            const tt = document.getElementById('map-tooltip');
            if (!tt) return;
            cancelHideMapTooltip();
            tooltipPinned = false;
            tt.classList.remove('visible');
            tt.classList.remove('interactive');
        };

        // Tooltip interactivity: allow moving from token â†' tooltip to click buttons
        (() => {
            const tt = document.getElementById('map-tooltip');
            if (!tt) return;
            tt.addEventListener('mouseenter', () => {
                tooltipPinned = true;
                cancelHideMapTooltip();
            });
            tt.addEventListener('mouseleave', () => {
                tooltipPinned = false;
                scheduleHideMapTooltip(120);
            });
            tt.addEventListener('click', (e) => {
                const btn = e.target?.closest?.('[data-open-bestiary]');
                if (!btn) return;
                e.preventDefault();
                e.stopPropagation();

                const name = btn.getAttribute('data-open-bestiary') || '';
                if (!bestiaryState?.index) {
                    const msg = document.getElementById('dungeon-bestiary-msg');
                    if (msg) msg.textContent = 'Load a bestiary JSON to enable full monster details.';
                    renderDungeonInfo(`<div class="font-semibold text-gray-100">Bestiary not loaded</div><div class="text-sm text-gray-300 mt-1">Use the Bestiary Loader to import a JSON file.</div>`);
                    return;
                }
                hideMapTooltip();
                showBestiaryModalForName(name);
            });
        })();

        const roomTypeToColor = (roomType) => {
            // Simple visualization palette (keep it readable against dark UI)
            const t = String(roomType || '');
            if (t.includes('Magical') || t.includes('Arcane')) return 'rgba(99, 102, 241, 0.35)'; // indigo
            if (t.includes('Library') || t.includes('Archive')) return 'rgba(14, 165, 233, 0.28)'; // sky
            if (t.includes('Botanical') || t.includes('Greenhouse')) return 'rgba(34, 197, 94, 0.22)'; // green
            if (t.includes('Sanctum') || t.includes('Meditation')) return 'rgba(168, 85, 247, 0.24)'; // purple
            if (t.includes('Security') || t.includes('Detention')) return 'rgba(244, 63, 94, 0.18)'; // rose
            if (t.includes('Dining') || t.includes('Domestic')) return 'rgba(245, 158, 11, 0.18)'; // amber
            if (t.includes('Foundational') || t.includes('Ancient')) return 'rgba(148, 163, 184, 0.18)'; // slate
            if (t.includes('Navigational')) return 'rgba(56, 189, 248, 0.14)'; // light blue
            if (t.includes('Window')) return 'rgba(125, 211, 252, 0.12)'; // pale
            return 'rgba(148, 163, 184, 0.12)';
        };

        const extractFoesText = (descHtml) => {
            // Robustly extract the text after "<b>Foes:</b>" until the next <br> or next <b> section.
            const s = String(descHtml || '');
            const m = /<b>\s*Foes:\s*<\/b>/i.exec(s);
            if (m && typeof m.index === 'number') {
                const after = s.slice(m.index + m[0].length);
                // Stop at first <br> or next bold header (Hostility/Mechanics/etc.)
                const stopCandidates = [
                    after.search(/<br\s*\/?\s*>/i),
                    after.search(/<b>\s*Hostility\s*:\s*<\/b>/i),
                    after.search(/<b>\s*Mechanics\s*:\s*<\/b>/i),
                    after.search(/<b>\s*Escalation\s*:\s*<\/b>/i),
                    after.search(/<b>\s*Pass\s*:\s*<\/b>/i),
                ].filter((n) => n >= 0);
                const stop = stopCandidates.length ? Math.min(...stopCandidates) : after.length;
                const raw = after.slice(0, stop);
                return stripHtml(raw);
            }
            
            // FALLBACK: If no <b>Foes:</b> tag, try to extract from inline description
            // Look for patterns like "2-3 Darkling Slimes (Mopes)" in first sentence
            const firstSentence = stripHtml(s).split(/\.\s+/)[0] || '';
            const inlineMatch = firstSentence.match(/\b(\d+[-–]\d+|\d+d\d+[+\-]?\d*|\d+)\s+([A-Z][^,.;]+?)(?:\s*\([^)]+\))?(?=\s+(?:wobble|lurk|patrol|guard|wait|block|move|seem|appear|are|is)|\.|$)/i);
            if (inlineMatch) {
                // Found "2-3 Darkling Slimes" - return the full match
                return inlineMatch[0].replace(/\([^)]*\)/g, '').trim();
            }
            return '';
        };

        const extractHostilityText = (descHtml) => {
            // Extract text after "<b>Hostility:</b>" until next <br> or next <b> section.
            const s = String(descHtml || '');
            const m = /<(?:b|strong)(?:\s+[^>]*)?>\s*Hostility\s*:\s*<\/(?:b|strong)>/i.exec(s);
            if (!m || typeof m.index !== 'number') return '';
            const after = s.slice(m.index + m[0].length);
            const stopCandidates = [
                after.search(/<br\s*\/?\s*>/i),
                after.search(/<(?:b|strong)(?:\s+[^>]*)?>\s*Mechanics\s*:\s*<\/(?:b|strong)>/i),
                after.search(/<(?:b|strong)(?:\s+[^>]*)?>\s*Escalation\s*:\s*<\/(?:b|strong)>/i),
                after.search(/<(?:b|strong)(?:\s+[^>]*)?>\s*Pass\s*:\s*<\/(?:b|strong)>/i),
                after.search(/<(?:b|strong)(?:\s+[^>]*)?>\s*Foes\s*:\s*<\/(?:b|strong)>/i),
            ].filter((n) => n >= 0);
            const stop = stopCandidates.length ? Math.min(...stopCandidates) : after.length;
            const raw = after.slice(0, stop);
            return stripHtml(raw);
        };

        const isEnvironmentalEncounter = (encounter) => encounter?.nonCombat === true;

        const isNonCombatEncounter = (encounter) => {
            if (isEnvironmentalEncounter(encounter)) return true;
            const hostility = extractHostilityText(encounter?.description || '');
            if (!hostility) return false;
            return /non[-\s]?combat/i.test(hostility);
        };

        const abbrevFromName = (name) => {
            const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
            if (parts.length === 0) return 'M';
            const last = parts[parts.length - 1];
            return String(last[0] || 'M').toUpperCase();
        };

        const parseFoeParts = (foesText) => {
            const txt = String(foesText || '').replace(/\([^)]*\)/g, '').trim();
            if (!txt) return [];

            // Split on + and commas/semicolons, keep chunks
            const normalized = txt.replace(/\s+and\s+/gi, ' + ');
            const chunks = normalized
                .split(/\+|;|,(?![^\[]*\])/g)
                .map((c) => c.trim())
                .filter(Boolean);

            const parts = [];
            for (const ch of chunks) {
                // Typical: "2 Darkling Slurpers" or "1 Warforged Darkwatch"
                const m = /^(\d+)\s+(.+?)\s*$/.exec(ch);
                if (m) {
                    parts.push({ count: parseInt(m[1], 10), name: m[2] });
                    continue;
                }
                // Dice notation: e.g., 1d2+1 Infiltrators
                const dice = /^(\d+)d(\d+)(?:\s*\+\s*(\d+))?\s+(.+?)\s*$/.exec(ch);
                if (dice) {
                    const rolls = parseInt(dice[1], 10);
                    const faces = parseInt(dice[2], 10);
                    const bonus = parseInt(dice[3] || '0', 10);
                    let total = bonus;
                    for (let i = 0; i < Math.max(1, rolls); i++) {
                        total += randInt(1, Math.max(1, faces));
                    }
                    parts.push({ count: total, name: dice[4] });
                    continue;
                }
                // Dice notation without an explicit leading count: e.g., d2 Dark Dimension Traps
                const diceNoLead = /^d(\d+)(?:\s*\+\s*(\d+))?\s+(.+?)\s*$/.exec(ch);
                if (diceNoLead) {
                    const faces = parseInt(diceNoLead[1], 10);
                    const bonus = parseInt(diceNoLead[2] || '0', 10);
                    const total = randInt(1, Math.max(1, faces)) + bonus;
                    parts.push({ count: total, name: diceNoLead[3] });
                    continue;
                }
                // If there's at least a number somewhere, grab it
                const n = /(\d+)/.exec(ch);
                if (n) {
                    parts.push({ count: parseInt(n[1], 10), name: ch.replace(n[1], '').trim() || 'Foe' });
                    continue;
                }
            }
            return parts;
        };

        const buildEncounterTokensFromEncounter = (encounter) => {
            if (!encounter) return [];
            // Environmental effects do NOT get tokens.
            if (isEnvironmentalEncounter(encounter)) return [];

            const nonCombat = isNonCombatEncounter(encounter);
            const foes = extractFoesText(encounter.description || '');
            const parts = parseFoeParts(foes);
            const normalizedEncounter = normalizeBestiaryEntry(getBestiaryOrManualEntry(encounter.name, encounter), encounter.name);
            const isTrapEncounter = normalizedEncounter?.kind === 'trap'
                || String(normalizedEncounter?.type || '').toLowerCase().includes('trap')
                || String(normalizedEncounter?.alignment || '').toLowerCase().includes('hazard');

            const tokens = [];

            // Track missing bestiary entries for user notification
            const missingMonsters = [];

            // If we couldn't parse, fall back to a single token for the encounter.
            if (!parts.length) {
                const tokenKind = isTrapEncounter ? 'feature' : (nonCombat ? 'feature' : 'monster');
                const tokenLabel = isTrapEncounter ? 'T' : (nonCombat ? 'F' : 'M');
                tokens.push({ kind: tokenKind, label: tokenLabel, title: encounter.name || 'Encounter', sizeSlots: normalizedEncounter?.sizeSlots || 1 });
                
                // Track if bestiary lookup failed
                if (!normalizedEncounter && tokenKind === 'monster') {
                    missingMonsters.push(encounter.name);
                }
            } else {
                for (const p of parts) {
                    const count = Math.max(1, Number.isFinite(p.count) ? p.count : 1);
                    const ab = abbrevFromName(p.name);
                    const normalized = normalizeBestiaryEntry(getBestiaryOrManualEntry(p.name), p.name) || normalizedEncounter;
                    const typeLabel = String(normalized?.type || '').toLowerCase();
                    const alignLabel = String(normalized?.alignment || '').toLowerCase();
                    const isTrap = isTrapEncounter || normalized?.kind === 'trap' || typeLabel.includes('trap') || alignLabel.includes('hazard');
                    const tokenKind = isTrap ? 'feature' : (nonCombat ? 'feature' : 'monster');
                    const tokenLabel = isTrap ? 'T' : ab;
                    const sizeSlots = normalized?.sizeSlots || normalizedEncounter?.sizeSlots || 1;
                    
                    // Track if bestiary lookup failed
                    if (!normalized && tokenKind === 'monster') {
                        missingMonsters.push(p.name);
                    }

                    // Combat: token-per-foe. Non-combat: token-per-listed element (cap).
                    if (!nonCombat || isTrap) {
                        for (let i = 0; i < count; i++) {
                            tokens.push({ kind: tokenKind, label: tokenLabel, title: p.name, sizeSlots });
                        }
                    } else {
                        const capped = Math.min(6, count);
                        for (let i = 0; i < capped; i++) {
                            tokens.push({ kind: tokenKind, label: tokenLabel, title: p.name, sizeSlots });
                        }
                    }
                }
            }

            if (isTrapEncounter && !tokens.some((t) => t.kind === 'feature')) {
                tokens.push({ kind: 'feature', label: 'T', title: encounter.name || 'Trap' });
            }

            if (normalizedEncounter?.guardians?.length) {
                for (const g of normalizedEncounter.guardians) {
                    const c = Math.max(1, Number.isFinite(g.count) ? g.count : 1);
                    const label = g.label || abbrevFromName(g.title || 'G');
                    for (let i = 0; i < c; i++) {
                        tokens.push({ kind: g.kind || 'monster', label, title: g.title || 'Guardian', sizeSlots: g.sizeSlots || 1 });
                    }
                }
            }

            if (/weirdlings harrying slimes/i.test(encounter.name || '')) {
                const customTokens = [];
                for (let i = 0; i < 2; i++) customTokens.push({ kind: 'monster', label: 'W', title: 'Weirdling-Paralurker', sizeSlots: 1 });
                const slimeCount = randInt(3, 4);
                for (let i = 0; i < slimeCount; i++) {
                    const cuboid = Math.random() < 0.4;
                    customTokens.push({ kind: 'monster', label: cuboid ? 'CS' : 'S', title: cuboid ? 'Darkling Cuboid Slime' : 'Darkling Slime', sizeSlots: cuboid ? 1 : 1 });
                }
                return customTokens;
            }

            if (/infiltrator scout team/i.test(encounter.name || '')) {
                const infiltratorTitle = 'Dark Dimension Infiltrator';
                const current = tokens.filter((t) => t.kind === 'monster').length;
                const needed = Math.max(0, 2 - current);
                for (let i = 0; i < needed; i++) {
                    tokens.push({ kind: 'monster', label: 'I', title: infiltratorTitle });
                }
            }

            if (/darkforged test bench/i.test(encounter.name || '')) {
                // Ensure a trap token for the device and a random Darkforged Remnant guardian if none added yet.
                if (!tokens.some((t) => t.kind === 'feature')) {
                    tokens.push({ kind: 'feature', label: 'T', title: 'Test Bench Device' });
                }
                const hasRemnant = tokens.some((t) => /darkforged remnant/i.test(t.title || ''));
                if (!hasRemnant) {
                    const options = [
                        { title: 'Darkforged Remnant Lash', label: 'L' },
                        { title: 'Darkforged Remnant Spike', label: 'S' },
                        { title: 'Darkforged Remnant Bulwark', label: 'B' },
                        { title: 'Darkforged Remnant Brute', label: 'R' },
                    ];
                    const pick = getRandomElement(options);
                    tokens.push({ kind: 'monster', label: pick.label, title: pick.title });
                }
            }
            
            // Return tokens (don't log to history here - it happens during layout generation before state is ready)
            return tokens;
        };

        // Spatial requirement rules for specific encounters
        const encounterSpatialRequirements = {
            'Window Gauntlet': { minLength: 8, type: 'corridor' },
            'Slurper Tongue Gauntlet': { minLength: 8, type: 'corridor' },
            'Window Resonance': { minArea: 9, type: 'room' },
            'Pane Choir': { minArea: 16, type: 'room' },
            'Arc-Sparker Conduit': { minLength: 6, type: 'corridor' },
            'Arc-Sparker Chokepoint (Infiltrator Setup)': { minLength: 6, type: 'corridor' },
            'Slurper Tongue Crossfire': { minLength: 10, type: 'corridor' },
            'Steam Tunnel Pressure Break (Darkforged Present)': { minLength: 8, type: 'corridor' },
            'Steam Vent Burst': { minLength: 6, type: 'corridor' },
            'Gravity Flip Segment': { minLength: 5, type: 'corridor' },
            'Time-Lag Pocket': { minLength: 5, type: 'corridor' },
            'Vanguard Shield Push': { minLength: 8, type: 'corridor' },
            'Vanguard Bulwark Advance (Corridor Crush)': { minLength: 10, type: 'corridor' },
            'Liquid Legion Corridor Dam': { minLength: 12, type: 'corridor' },
            'Faction Clash: Darkwatch vs Liquid Legion': { minLength: 12, type: 'corridor' },
            'Paralurker Filament Web-Gang': { minLength: 10, type: 'corridor' },
            'Liquid Legion Hunt (Open)': { minLength: 8, type: 'corridor' },
            'Ceiling Creepers Ambuscade': { minLength: 6, type: 'corridor' },
            'Paralurker Net': { minLength: 6, type: 'corridor' },
            'Audience with the Shadow Slimepress (BOSS)': { minArea: 36, type: 'room' },
            'Liquid Legion Cistern Confluence': { minArea: 25, type: 'room' },
            'Slimepress Tributary Court (Not the Throne)': { minArea: 20, type: 'room' },
            'Observatory: Sensor Drone Constellation Net': { minArea: 25, type: 'room' },
            'Arcane Training: Live-Fire Circle (Overclocked)': { minArea: 20, type: 'room' },
            'Faction Clash: Darkwatch vs Infiltrators': { minArea: 20, type: 'room' },
        };

        // Check if encounter meets spatial requirements for a given space
        const encounterFitsSpace = (encounterName, spaceInfo) => {
            const req = encounterSpatialRequirements[encounterName];
            if (!req) return true; // No requirements = always ok

            // Check type requirement
            if (req.type && req.type !== spaceInfo.type) return false;

            // Check minimum length for corridors
            if (req.minLength && spaceInfo.length < req.minLength) return false;

            // Check minimum area for rooms
            if (req.minArea && spaceInfo.area < req.minArea) return false;

            return true;
        };

        const pickCorridorEncounterForMap = (corridorInfo) => {
            // Provide fallback info if not passed
            const info = corridorInfo || { type: 'corridor', length: 5 };
            
            // Try up to 10 times to find a spatially-appropriate encounter
            for (let attempt = 0; attempt < 10; attempt++) {
                let encounter;
                if (Math.random() < 0.7) {
                    encounter = weightedRandomEncounter(corridorEncounters);
                } else {
                    encounter = generateGenericCorridorEncounter();
                }
                
                if (encounter && encounterFitsSpace(encounter.name, info)) {
                    return encounter;
                }
            }
            
            // Fallback: just return a generic encounter
            return generateGenericCorridorEncounter();
        };

        const pickRoomEncounterForMap = (roomType, opts, roomInfo) => {
            const combatSkew = clamp(Number(opts?.combatSkew ?? 0) || 0, 0, 100) / 100;
            const spawnBosses = opts?.spawnBosses !== false; // Default to true
            // Provide fallback info if not passed
            const info = roomInfo || { type: 'room', area: 16 };
            
            // At 0%: mostly curated. At 100%: strongly favor generic combat packs.
            const useGenericChance = 0.80 * combatSkew;
            if (Math.random() < useGenericChance) return generateGenericRoomEncounter(roomType);

            const preferCombat = combatSkew >= 0.35;
            const tryPick = () => {
                const specific = roomSpecificEncounters[roomType];
                if (specific && specific.length) return weightedRandomEncounter(specific);
                return weightedRandomEncounter(roomEncounters);
            };

            // Try up to 15 times to find a spatially-appropriate encounter
            const attempts = preferCombat ? 15 : 10;
            for (let i = 0; i < attempts; i++) {
                const e = tryPick();
                if (!e) return e;
                
                // Check spatial requirements
                if (!encounterFitsSpace(e.name, info)) continue;
                
                // If bosses disabled, filter out boss encounters (CR 6+)
                if (!spawnBosses && e.cr >= 6) continue;
                
                // If we prefer combat, filter out non-combat
                if (preferCombat && (isNonCombatEncounter(e) || isEnvironmentalEncounter(e))) continue;
                
                return e;
            }
            
            // Fallback
            return tryPick();
        };

        let dungeonMapState = null;

        const makeDungeonEntityId = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;

        const ensureDungeonHistory = () => {
            if (!dungeonMapState) dungeonMapState = {};
            if (!Array.isArray(dungeonMapState.history)) dungeonMapState.history = [];
        };

        const renderDungeonHistory = () => {
            const el = document.getElementById('dungeon-history');
            if (!el) return;
            ensureDungeonHistory();
            const items = dungeonMapState.history.slice(-60).reverse();
            if (!items.length) {
                el.innerHTML = `<div class="text-gray-400 italic">No history yet.</div>`;
                return;
            }
            el.innerHTML = items
                .map((h) => {
                    const t = (h.time || '').toString();
                    const tag = h.tag ? `<span class="text-xs text-gray-400">${stripHtml(h.tag)}</span>` : '';
                    const msg = h.message ? stripHtml(h.message) : '';
                    const detail = h.detailHtml ? h.detailHtml : '';
                    return `
                        <div class="mb-2">
                            <div class="text-xs text-gray-500">${t} ${tag}</div>
                            <div class="text-sm text-gray-200">${msg}</div>
                            ${detail ? `<div class="text-xs text-gray-400">${detail}</div>` : ''}
                        </div>
                    `;
                })
                .join('');
        };

        const appendDungeonHistory = (entry) => {
            ensureDungeonHistory();
            const now = new Date();
            dungeonMapState.history.push({
                time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                ...entry,
            });
            renderDungeonHistory();
        };

        const buildDungeonHistoryExportPayload = () => {
            ensureDungeonHistory();
            const layout = dungeonMapState?.layout;
            const rooms = (layout?.rooms || []).map((r) => ({
                id: r.id,
                roomType: r.roomType,
                roomName: r.roomName || null,
            }));
            const doors = layout?.doorsById ? Object.values(layout.doorsById).map((d) => ({
                id: d.id,
                x: d.x,
                y: d.y,
                locked: !!d.locked,
                keyId: d.keyId,
                targetRoomId: d.targetRoomId,
                corridorType: d.corridorType || null,
            })) : [];
            const keys = layout?.keysById ? Object.values(layout.keysById).map((k) => ({
                id: k.id,
                doorId: k.doorId,
                roomId: k.roomId,
                collected: !!k.collected,
                acquisition: k.acquisition || null,
                npcId: k.npcId || null,
            })) : [];

            return {
                exportedAt: new Date().toISOString(),
                map: {
                    width: layout?.width ?? null,
                    height: layout?.height ?? null,
                    rooms,
                    doors,
                    keys,
                },
                history: dungeonMapState.history,
            };
        };

        const downloadTextFile = (filename, text, mimeType) => {
            try {
                const blob = new Blob([text], { type: mimeType || 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                return true;
            } catch {
                return false;
            }
        };

        const copyTextToClipboard = async (text) => {
            try {
                if (navigator?.clipboard?.writeText) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch {
                // fall through
            }
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                ta.style.top = '-9999px';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return !!ok;
            } catch {
                return false;
            }
        };

        const weightedLowInt = (min, max, power = 2.2) => {
            const a = Math.min(min, max);
            const b = Math.max(min, max);
            const span = (b - a + 1);
            const t = Math.pow(Math.random(), Math.max(1, Number(power) || 2));
            return a + Math.floor(t * span);
        };

        const getRoomIdAt = (layout, x, y) => {
            const c = layout?.grid?.[y]?.[x];
            if (!c || c.type !== 'room') return null;
            return (typeof c.roomId === 'number') ? c.roomId : null;
        };

        const findNpcKeyholderInRoom = (roomId) => {
            const layout = dungeonMapState?.layout;
            if (!layout?.npcKeyholdersById) return null;
            const npc = Object.values(layout.npcKeyholdersById)
                .find((n) => n && n.roomId === roomId && !n.resolved && !(dungeonMapState?.collectedKeys?.has?.(n.keyId)));
            return npc || null;
        };

        const anyPlayerInRoom = (roomId) => {
            const layout = dungeonMapState?.layout;
            if (!layout || roomId == null) return false;
            return (dungeonMapState?.entities || []).some((e) => e.kind === 'player' && getRoomIdAt(layout, e.x, e.y) === roomId);
        };

        const anyPlayerOnTile = (x, y) => (dungeonMapState?.entities || []).some((e) => e.kind === 'player' && e.x === x && e.y === y);

        const appendEnvironmentalResolvedHistory = ({ kind, x, y, roomId, encounter, roomName, roomType }) => {
            const encName = stripHtml(encounter?.name || 'Environmental Effect');
            if (kind === 'corridor') {
                appendDungeonHistory({
                    tag: 'ENV',
                    message: `Resolved environmental effect: ${encName}`,
                    detailHtml: `Hall tile: (${x}, ${y})`,
                });
                return;
            }
            appendDungeonHistory({
                tag: 'ENV',
                message: `Resolved environmental effect: ${encName}`,
                detailHtml: `Room: ${stripHtml(roomName || 'Room')} (ID ${roomId}) "¢ ${stripHtml(roomType || '')}`,
            });
        };

        const extractLabeledSectionText = (descHtml, label) => {
            // Extract text after "<b>{label}:</b>" / "<strong>{label}:</strong>" until next <br><br> or next bold header.
            const s = String(descHtml || '');
            const safe = String(label || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const startRe = new RegExp(`<\\s*(?:b|strong)(?:\\s+[^>]*)?>\\s*${safe}\\s*:\\s*<\\/\\s*(?:b|strong)\\s*>`, 'i');
            const m = startRe.exec(s);
            if (!m || typeof m.index !== 'number') return '';
            const after = s.slice(m.index + m[0].length);

            const stopCandidates = [
                after.search(/<br\s*\/?>\s*<br\s*\/?>/i),
                after.search(/<(?:b|strong)(?:\s+[^>]*)?>\s*[^<]{1,40}\s*:\s*<\/(?:b|strong)>/i),
            ].filter((n) => n >= 0);
            const stop = stopCandidates.length ? Math.min(...stopCandidates) : after.length;
            return stripHtml(after.slice(0, stop));
        };

        const getEnvironmentalHookText = (encounter) => {
            const desc = encounter?.description || '';
            // Prefer explicit hooks.
            const labels = ['Checks', 'Mechanics', 'Option', 'Options', 'Hazard', 'Trial', 'Arcs', 'Terrain', 'Spot', 'Counter', 'Disable', 'Appeal'];
            for (const l of labels) {
                const txt = extractLabeledSectionText(desc, l);
                if (txt) return txt;
            }
            return stripHtml(desc);
        };

        const parseEnvironmentalDcOptions = (text) => {
            const s = String(text || '');
            const out = [];
            const seen = new Set();
            const re = /\bDC\s*(\d{1,2})\b/gi;
            let m;
            while ((m = re.exec(s))) {
                const dc = parseInt(m[1], 10);
                if (!Number.isFinite(dc)) continue;
                const start = m.index;
                const tail = s.slice(start);
                const stopCandidates = [
                    tail.indexOf('.'),
                    tail.indexOf(';'),
                    tail.indexOf(', '),
                    tail.indexOf('(') >= 0 ? Math.min(tail.indexOf('(') + 60, tail.length) : -1,
                ].filter((n) => n >= 0);
                const stop = stopCandidates.length ? Math.min(...stopCandidates) : Math.min(120, tail.length);
                const label = tail.slice(0, Math.min(stop, 120)).trim();
                const key = `${dc}|${label}`;
                if (seen.has(key)) continue;
                seen.add(key);
                out.push({ dc, label: label || `DC ${dc}` });
            }
            // If no explicit DCs found, keep one placeholder.
            if (!out.length) out.push({ dc: 12, label: 'DC 12 (set DC manually if needed)' });
            // Sort by DC asc for readability
            out.sort((a, b) => (a.dc - b.dc) || a.label.localeCompare(b.label));
            return out;
        };

        const rollD20 = () => randInt(1, 20);
        const rollWithMode = (mode) => {
            const m = String(mode || 'normal');
            if (m === 'adv') {
                const a = rollD20();
                const b = rollD20();
                return { mode: 'adv', a, b, result: Math.max(a, b) };
            }
            if (m === 'dis') {
                const a = rollD20();
                const b = rollD20();
                return { mode: 'dis', a, b, result: Math.min(a, b) };
            }
            const a = rollD20();
            return { mode: 'normal', a, b: null, result: a };
        };

        const playerSkills = [
            { key: 'athletics', name: 'Athletics', ability: 'STR' },
            { key: 'acrobatics', name: 'Acrobatics', ability: 'DEX' },
            { key: 'sleight', name: 'Sleight of Hand', ability: 'DEX' },
            { key: 'stealth', name: 'Stealth', ability: 'DEX' },
            { key: 'arcana', name: 'Arcana', ability: 'INT' },
            { key: 'history', name: 'History', ability: 'INT' },
            { key: 'investigation', name: 'Investigation', ability: 'INT' },
            { key: 'nature', name: 'Nature', ability: 'INT' },
            { key: 'religion', name: 'Religion', ability: 'INT' },
            { key: 'animal', name: 'Animal Handling', ability: 'WIS' },
            { key: 'insight', name: 'Insight', ability: 'WIS' },
            { key: 'medicine', name: 'Medicine', ability: 'WIS' },
            { key: 'perception', name: 'Perception', ability: 'WIS' },
            { key: 'survival', name: 'Survival', ability: 'WIS' },
            { key: 'deception', name: 'Deception', ability: 'CHA' },
            { key: 'intimidation', name: 'Intimidation', ability: 'CHA' },
            { key: 'performance', name: 'Performance', ability: 'CHA' },
            { key: 'persuasion', name: 'Persuasion', ability: 'CHA' },
        ];

        const ensurePlayerSheet = (tokenId) => {
            if (!dungeonMapState) dungeonMapState = {};
            if (!dungeonMapState.playerSheets) dungeonMapState.playerSheets = {};
            if (!dungeonMapState.playerSheets[tokenId]) {
                dungeonMapState.playerSheets[tokenId] = {
                    skills: {},
                    abilityScores: { STR: 0, DEX: 0, CON: 0, INT: 0, WIS: 0, CHA: 0 },
                    weapons: [{ name: 'Weapon', damage: '1d6' }],
                };
            }
            if (!dungeonMapState.playerSheets[tokenId].abilityScores) {
                dungeonMapState.playerSheets[tokenId].abilityScores = { STR: 0, DEX: 0, CON: 0, INT: 0, WIS: 0, CHA: 0 };
            }
            if (!dungeonMapState.playerSheets[tokenId].weapons) {
                const legacy = dungeonMapState.playerSheets[tokenId].weapon;
                const first = legacy || { name: 'Weapon', damage: '1d6' };
                dungeonMapState.playerSheets[tokenId].weapons = [first];
            }
            return dungeonMapState.playerSheets[tokenId];
        };

        const updateRollResult = (targetId, html) => {
            const el = document.getElementById(targetId);
            if (el) el.innerHTML = html;
        };

        const rollPlayerSave = (token, ability, mode) => {
            const sheet = ensurePlayerSheet(token.id);
            const bonus = Number(sheet.abilityScores?.[ability] ?? 0) || 0;
            const roll = rollWithMode(mode);
            const total = roll.result + bonus;
            const breakdown = (roll.mode === 'normal')
                ? `${roll.result} + ${bonus >= 0 ? '+' : ''}${bonus}`
                : `${roll.a} vs ${roll.b} â†' ${roll.result}; bonus ${bonus >= 0 ? '+' : ''}${bonus}`;

            appendDungeonHistory({
                tag: 'SAVE',
                message: `${token.title || token.label} rolls ${ability} save: ${total}`,
                detailHtml: `${ability} save "¢ ${breakdown}`,
            });

            updateRollResult('player-roll-result', `<div class="text-sm text-gray-100 font-semibold">${escapeHtml(token.title || token.label)} ,  ${escapeHtml(ability)} save: ${total}</div><div class="text-xs text-gray-400">${escapeHtml(breakdown)}</div>`);
        };

        const rollPlayerSkill = (token, skill, mode) => {
            const sheet = ensurePlayerSheet(token.id);
            const bonus = Number(sheet.skills?.[skill.key]) || 0;
            const roll = rollWithMode(mode);
            const total = roll.result + bonus;
            const breakdown = (roll.mode === 'normal')
                ? `d20 ${roll.result} + ${bonus >= 0 ? '+' : ''}${bonus}`
                : `${roll.a} vs ${roll.b} â†' ${roll.result}; bonus ${bonus >= 0 ? '+' : ''}${bonus}`;

            appendDungeonHistory({
                tag: 'SKILL',
                message: `${token.title || token.label} rolls ${skill.name}: ${total}`,
                detailHtml: `${stripHtml(skill.name)} (${skill.ability}) "¢ ${breakdown}`,
            });

            updateRollResult('player-roll-result', `<div class="text-sm text-gray-100 font-semibold">${escapeHtml(token.title || token.label)} ,  ${escapeHtml(skill.name)}: ${total}</div><div class="text-xs text-gray-400">${escapeHtml(breakdown)}</div>`);
        };

        const rollPlayerWeaponDamage = (token, weaponIdx = 0) => {
            const sheet = ensurePlayerSheet(token.id);
            const weapon = sheet.weapons?.[weaponIdx] || sheet.weapons?.[0] || { name: 'Weapon', damage: '1d6' };
            const dmgExpr = String(weapon.damage || '').trim();
            const name = weapon.name || 'Weapon';
            const r = rollDiceExpression(dmgExpr);
            if (!r) {
                updateRollResult('player-roll-result', `<div class="text-sm text-rose-300">No valid damage dice for ${escapeHtml(name)}.</div>`);
                return;
            }
            appendDungeonHistory({
                tag: 'WEAPON',
                message: `${token.title || token.label} rolls ${name} damage: ${r.total}`,
                detailHtml: `${escapeHtml(dmgExpr)} â†' ${escapeHtml(r.detail)}`,
            });
            updateRollResult('player-roll-result', `<div class="text-sm text-gray-100 font-semibold">${escapeHtml(token.title || token.label)} ,  ${escapeHtml(name)} dmg: ${r.total}</div><div class="text-xs text-gray-400">${escapeHtml(r.detail)}</div>`);
        };

        const renamePlayerToken = (token, newName) => {
            const name = stripHtml(newName || '').trim();
            if (!name) return;
            token.title = name;
            if (dungeonMapState?.entities) {
                const ent = dungeonMapState.entities.find((e) => e.id === token.id);
                if (ent) ent.title = name;
            }
            appendDungeonHistory({
                tag: 'PLAYER',
                message: `Player renamed to ${name}`,
                detailHtml: `ID ${token.id}`,
            });

        };

        const showPlayerSheetModal = (token) => {

            const displayName = sheet.name || token.title || token.label || 'Player';

            const statsRows = Object.keys(sheet.abilityScores).map((ability) => {

                return `
                    <div class="p-2 rounded-md bg-slate-900/40 border border-slate-800/70 flex items-center justify-between gap-3">
                        <div>
                            <div class="text-sm font-semibold text-gray-100">${escapeHtml(ability)}</div>
                            <div class="text-xs text-gray-400">Save</div>
                        </div>
                        <div class="flex items-center gap-2">
                            <input id="${inputId}" type="number" value="${val}" class="w-16 bg-gray-800 text-gray-100 border border-gray-700 rounded-md px-2 py-1 text-sm" />
                            <div class="flex gap-1">
                                <button data-player-save="${ability}" data-mode="normal" class="px-2 py-1 rounded bg-gray-800 text-xs text-gray-100 border border-gray-700">Roll</button>
                                <button data-player-save="${ability}" data-mode="adv" class="px-2 py-1 rounded bg-gray-800 text-xs text-gray-100 border border-gray-700">Adv</button>
                                <button data-player-save="${ability}" data-mode="dis" class="px-2 py-1 rounded bg-gray-800 text-xs text-gray-100 border border-gray-700">Dis</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            const skillRows = playerSkills.map((skill) => {
                const val = Number(sheet.skills?.[skill.key]) || 0;
                const inputId = `player-skill-${token.id}-${skill.key}`;
                return `
                    <div class="p-2 rounded-md bg-slate-900/40 border border-slate-800/70 flex items-center justify-between gap-3">
                        <div>
                            <div class="text-sm font-semibold text-gray-100">${escapeHtml(skill.name)}</div>
                            <div class="text-xs text-gray-400">${skill.ability}</div>
                        </div>
                        <div class="flex items-center gap-2">
                            <input id="${inputId}" type="number" value="${val}" class="w-16 bg-gray-800 text-gray-100 border border-gray-700 rounded-md px-2 py-1 text-sm" />
                            <div class="flex gap-1">
                                <button data-player-skill="${skill.key}" data-mode="normal" class="px-2 py-1 rounded bg-gray-800 text-xs text-gray-100 border border-gray-700">Roll</button>
                                <button data-player-skill="${skill.key}" data-mode="adv" class="px-2 py-1 rounded bg-gray-800 text-xs text-gray-100 border border-gray-700">Adv</button>
                                <button data-player-skill="${skill.key}" data-mode="dis" class="px-2 py-1 rounded bg-gray-800 text-xs text-gray-100 border border-gray-700">Dis</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            const tabsHtml = `
                <div class="flex items-center gap-2 mt-2 mb-3">
                    <button id="player-tab-stats" class="px-3 py-1 rounded-md bg-slate-800 text-xs font-semibold text-gray-100 border border-slate-700">Stats</button>
                    <button id="player-tab-skills" class="px-3 py-1 rounded-md bg-slate-900 text-xs font-semibold text-gray-300 border border-slate-800">Skills</button>
                </div>
            `;

            if (!Array.isArray(sheet.weapons) || !sheet.weapons.length) {
                sheet.weapons = [{ name: 'Weapon', damage: '1d6' }];
            }
            const weaponsHtml = sheet.weapons.map((w, idx) => `
                <div class="p-3 rounded-md bg-slate-900/40 border border-slate-800/70">
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <div class="text-sm font-semibold text-gray-100">Weapon ${idx + 1}</div>
                            <div class="text-xs text-gray-400">Name & damage</div>
                        </div>
                        <button data-weapon-roll="${idx}" class="px-2 py-1 rounded bg-gray-800 text-xs text-gray-100 border border-gray-700">Roll dmg</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                        <input data-weapon-name="${idx}" type="text" value="${escapeHtml(w.name || 'Weapon')}" class="bg-gray-800 text-gray-100 border border-gray-700 rounded-md px-2 py-1 text-sm" />
                        <input data-weapon-dmg="${idx}" type="text" value="${escapeHtml(w.damage || '1d6')}" class="bg-gray-800 text-gray-100 border border-gray-700 rounded-md px-2 py-1 text-sm" />
                        <div class="text-xs text-gray-400 self-center">e.g. 1d4, 1d6+2</div>
                    </div>
                </div>
            `).join('');

            showModalContent(`
                <div class="flex items-center justify-between gap-2">
                    <div>
                        <div class="text-2xl font-bold text-gray-100" id="bestiary-modal-title">${escapeHtml(displayName)}</div>
                        <div class="text-xs text-gray-400 mt-1">Right-click sheet ,  rolls log to DM history</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <input id="player-rename" type="text" value="${escapeHtml(displayName)}" class="bg-gray-800 text-gray-100 border border-gray-700 rounded-md px-2 py-1 text-sm" />
                        <button id="player-rename-save" class="px-3 py-1 rounded-md bg-slate-800 text-xs font-semibold text-gray-100 border border-slate-700">Rename</button>
                    </div>
                </div>
                ${tabsHtml}
                <div id="player-pane-stats" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    ${statsRows}
                    <div class="p-3 rounded-md bg-slate-900/40 border border-slate-800/70 sm:col-span-2">
                        <div class="flex items-center justify-between mb-2">
                            <div>
                                <div class="text-sm font-semibold text-gray-100">Weapons</div>
                                <div class="text-xs text-gray-400">Name & damage; roll to log</div>
                            </div>
                            <button id="player-weapon-add" class="px-2 py-1 rounded bg-gray-800 text-xs text-gray-100 border border-gray-700">Add weapon</button>
                        </div>
                        <div class="grid grid-cols-1 gap-3">
                            ${weaponsHtml}
                        </div>
                    </div>
                </div>
                <div id="player-pane-skills" class="grid grid-cols-1 sm:grid-cols-2 gap-2 hidden">${skillRows}</div>
                <div id="player-roll-result" class="mt-3 text-sm text-gray-300"></div>
            `);

            const showTab = (tab) => {
                const statsEl = document.getElementById('player-pane-stats');
                const skillsEl = document.getElementById('player-pane-skills');
                const btnStats = document.getElementById('player-tab-stats');
                const btnSkills = document.getElementById('player-tab-skills');
                const statsActive = tab === 'stats';
                if (statsEl) statsEl.classList.toggle('hidden', !statsActive);
                if (skillsEl) skillsEl.classList.toggle('hidden', statsActive);
                if (btnStats) btnStats.className = statsActive
                    ? 'px-3 py-1 rounded-md bg-slate-800 text-xs font-semibold text-gray-100 border border-slate-700'
                    : 'px-3 py-1 rounded-md bg-slate-900 text-xs font-semibold text-gray-300 border border-slate-800';
                if (btnSkills) btnSkills.className = !statsActive
                    ? 'px-3 py-1 rounded-md bg-slate-800 text-xs font-semibold text-gray-100 border border-slate-700'
                    : 'px-3 py-1 rounded-md bg-slate-900 text-xs font-semibold text-gray-300 border border-slate-800';
            };

            document.getElementById('player-tab-stats')?.addEventListener('click', () => showTab('stats'));
            document.getElementById('player-tab-skills')?.addEventListener('click', () => showTab('skills'));
            showTab('stats');

            const renameInput = document.getElementById('player-rename');
            const renameBtn = document.getElementById('player-rename-save');
            renameBtn?.addEventListener('click', (ev) => {
                ev.preventDefault();
                const val = renameInput?.value || '';
                sheet.name = val;
                renamePlayerToken(token, val);
                const titleEl = document.getElementById('bestiary-modal-title');
                if (titleEl) titleEl.textContent = val || 'Player';
            });

            // Wiring inputs/buttons
            for (const [ability] of Object.entries(sheet.abilityScores)) {
                const inputId = `player-ability-${token.id}-${ability}`;
                const input = document.getElementById(inputId);
                if (input) {
                    input.addEventListener('change', () => {
                        const v = parseInt(input.value, 10);
                        sheet.abilityScores[ability] = Number.isFinite(v) ? v : 0;
                    });
                }
                ['normal', 'adv', 'dis'].forEach((mode) => {
                    const btn = document.querySelector(`button[data-player-save="${ability}"][data-mode="${mode}"]`);
                    btn?.addEventListener('click', (ev) => {
                        ev.preventDefault();
                        rollPlayerSave(token, ability, mode);
                    });
                });
            }

            const addWeaponBtn = document.getElementById('player-weapon-add');
            addWeaponBtn?.addEventListener('click', (ev) => {
                ev.preventDefault();
                const nextIdx = sheet.weapons.length + 1;
                sheet.weapons.push({ name: `Weapon ${nextIdx}`, damage: '1d6' });
                showPlayerSheetModal(token);
            });

            const weaponNameInputs = document.querySelectorAll('[data-weapon-name]');
            weaponNameInputs.forEach((input) => {
                const idx = parseInt(input.getAttribute('data-weapon-name') || '0', 10);
                input.addEventListener('input', () => {
                    if (!sheet.weapons[idx]) sheet.weapons[idx] = { name: 'Weapon', damage: '1d6' };
                    sheet.weapons[idx].name = input.value;
                });
            });

            const weaponDmgInputs = document.querySelectorAll('[data-weapon-dmg]');
            weaponDmgInputs.forEach((input) => {
                const idx = parseInt(input.getAttribute('data-weapon-dmg') || '0', 10);
                input.addEventListener('input', () => {
                    if (!sheet.weapons[idx]) sheet.weapons[idx] = { name: 'Weapon', damage: '1d6' };
                    sheet.weapons[idx].damage = input.value;

            const weaponRollButtons = document.querySelectorAll('[data-weapon-roll]');
            weaponRollButtons.forEach((btn) => {
                const idx = parseInt(btn.getAttribute('data-weapon-roll') || '0', 10);
                btn.addEventListener('click', (ev) => {
                    ev.preventDefault();
                    rollPlayerWeaponDamage(token, idx);
                });
            });

            for (const skill of playerSkills) {
                const inputId = `player-skill-${token.id}-${skill.key}`;
                const input = document.getElementById(inputId);
                if (input) {
                    input.addEventListener('change', () => {
                        const v = parseInt(input.value, 10);
                        sheet.skills[skill.key] = Number.isFinite(v) ? v : 0;
                    });
                }
                ['normal', 'adv', 'dis'].forEach((mode) => {
                    const btn = document.querySelector(`button[data-player-skill="${skill.key}"][data-mode="${mode}"]`);
                    btn?.addEventListener('click', (ev) => {
                        ev.preventDefault();
                        rollPlayerSkill(token, skill, mode);
                    });
                });
            }
        };

        const parseAttackFromAction = (action) => {
            if (!action) return null;
            const name = stripHtml(getFirstField(action, ['name', 'Name', 'title', 'Title']) || 'Attack');
            const desc = stripHtml(getFirstField(action, ['desc', 'description', 'text']) || '');
            const explicitToHit = action.attackBonus ?? action.toHit ?? action.hitBonus ?? action.hit;
            const toHitMatch = desc.match(/([+\-]\d+)\s*to\s*hit/i);
            const damageMatch = desc.match(/(\d+d\d+(?:\s*[+\-]\s*\d+)?)/i);
            const reachMatch = desc.match(/reach\s*(\d+\s*ft\.?)/i);
            const damageField = action.damageDice || action.damage || action.damageRoll || action.hitDamage || action.damageText;
            return {
                name,
                toHit: explicitToHit != null ? parseInt(explicitToHit, 10) : (toHitMatch ? parseInt(toHitMatch[1], 10) : null),
                damageDice: damageField ? String(damageField).replace(/\s+/g, '') : (damageMatch ? damageMatch[1].replace(/\s+/g, '') : null),
                notes: desc || stripHtml(getFirstField(action, ['notes', 'text']) || '') || 'No description provided.',
                reach: action.reach || action.range || (reachMatch ? reachMatch[1] : null),
            };
        };

        const extractMonsterAttacks = (entry, name) => {
            const data = normalizeBestiaryEntry(entry, name || entry?.name);
            const actions = data?.actions || getFirstField(entry, ['actions', 'Actions']) || [];
            const attacks = [];
            for (const act of actions) {
                const parsed = parseAttackFromAction(act);
                if (parsed) attacks.push(parsed);
            }
            return attacks;
        };

        const rollMonsterAttackHit = (token, attack, mode) => {
            const roll = rollWithMode(mode);
            const bonus = Number(attack.toHit) || 0;
            const total = roll.result + bonus;
            const breakdown = (roll.mode === 'normal')
                ? `${roll.result} + ${bonus >= 0 ? '+' : ''}${bonus}`
                : `${roll.a} vs ${roll.b} â†' ${roll.result}; bonus ${bonus >= 0 ? '+' : ''}${bonus}`;

            appendDungeonHistory({
                tag: 'ATTACK',
                message: `${token.title || token.label} uses ${attack.name}: ${total} to hit`,
                detailHtml: `${stripHtml(attack.name)} "¢ ${breakdown}`,
            });

            updateRollResult('monster-roll-result', `<div class="text-sm text-gray-100 font-semibold">${escapeHtml(token.title || token.label)} ,  ${escapeHtml(attack.name)} to-hit: ${total}</div><div class="text-xs text-gray-400">${escapeHtml(breakdown)}</div>`);
        };

        const rollMonsterDamage = (token, attack) => {
            const r = rollDiceExpression(attack.damageDice || attack.damage || attack.damageRoll || '');
            if (!r) {
                updateRollResult('monster-roll-result', `<div class="text-sm text-rose-300">No damage dice parsed for ${escapeHtml(attack.name)}.</div>`);
                return;
            }
            appendDungeonHistory({
                tag: 'DAMAGE',
                message: `${token.title || token.label} deals ${r.total} (${attack.damageDice || attack.damage || ''})`,
                detailHtml: `${stripHtml(attack.name)} "¢ Rolls: ${escapeHtml(r.detail)}`,
            });
            updateRollResult('monster-roll-result', `<div class="text-sm text-gray-100 font-semibold">${escapeHtml(token.title || token.label)} ,  ${escapeHtml(attack.name)} damage: ${r.total}</div><div class="text-xs text-gray-400">${escapeHtml(r.detail)}</div>`);
        };

        const showMonsterRollerModal = (token) => {
            const name = stripHtml(token.title || '');
            if (!bestiaryState?.index) {
                renderDungeonInfo(`<div class="font-semibold text-rose-300">Bestiary not loaded</div><div class="text-sm text-gray-300 mt-1">Load a bestiary JSON to roll monster attacks.</div>`);
                return;
            }
            const entry = getBestiaryOrManualEntry(name);
            const normalized = normalizeBestiaryEntry(entry, name);
            if (!entry || !normalized) {
                renderDungeonInfo(`<div class="font-semibold text-rose-300">No bestiary entry</div><div class="text-sm text-gray-300 mt-1">${escapeHtml(name)} not found. Load the bundled bestiary or pick a matching monster.</div>`);
                return;
            }
            if (normalized.kind === 'trap' || String(normalized.type || '').toLowerCase().includes('trap')) {
                renderDungeonInfo(`<div class="font-semibold text-rose-300">Trap / Hazard</div><div class="text-sm text-gray-300 mt-1">${escapeHtml(name)} is a trap or hazard, not a creature with attacks.</div>`);
                return;
            }
            const attacks = extractMonsterAttacks(entry, name);
            if (!attacks.length) {
                renderDungeonInfo(`<div class="font-semibold text-rose-300">No attacks parsed</div><div class="text-sm text-gray-300 mt-1">${escapeHtml(name)} has no actionable attacks in the entry.</div>`);
                return;
            }

            const rows = attacks.map((a, idx) => {
                const hitText = (a.toHit != null) ? `+${a.toHit}` : ', ';
                const dmgText = a.damageDice || ', ';
                const reach = a.reach ? `<span class="text-xs text-gray-400">Reach ${escapeHtml(a.reach)}</span>` : '';
                return `
                    <div class="p-3 rounded-md bg-slate-900/40 border border-slate-800/70">
                        <div class="flex items-center justify-between gap-2">
                            <div>
                                <div class="text-sm font-semibold text-gray-100">${escapeHtml(a.name)}</div>
                                <div class="text-xs text-gray-400">to-hit ${hitText} "¢ damage ${escapeHtml(dmgText)} ${reach}</div>
                            </div>
                            <div class="flex gap-2">
                                <button data-attack-hit="${idx}" data-mode="normal" class="px-2 py-1 rounded bg-gray-800 text-xs text-gray-100 border border-gray-700" ${a.toHit == null ? 'disabled' : ''}>Hit</button>
                                <button data-attack-hit="${idx}" data-mode="adv" class="px-2 py-1 rounded bg-gray-800 text-xs text-gray-100 border border-gray-700" ${a.toHit == null ? 'disabled' : ''}>Adv</button>
                                <button data-attack-hit="${idx}" data-mode="dis" class="px-2 py-1 rounded bg-gray-800 text-xs text-gray-100 border border-gray-700" ${a.toHit == null ? 'disabled' : ''}>Dis</button>
                                <button data-attack-dmg="${idx}" class="px-2 py-1 rounded bg-gray-800 text-xs text-gray-100 border border-gray-700" ${!a.damageDice ? 'disabled' : ''}>Dmg</button>
                            </div>
                        </div>
                        <div class="text-xs text-gray-400 mt-2 leading-snug">${escapeHtml(a.notes || '')}</div>
                    </div>
                `;
            }).join('');

            showModalContent(`
                <div class="text-2xl font-bold text-gray-100" id="bestiary-modal-title">${escapeHtml(name)} ,  Attack Roller</div>
                <div class="text-xs text-gray-400 mt-1">Right-click a monster token to roll attacks. Results log to DM history.</div>
                <div class="mt-3 space-y-3">${rows}</div>
                <div id="monster-roll-result" class="mt-3 text-sm text-gray-300"></div>
            `);

            attacks.forEach((a, idx) => {
                ['normal', 'adv', 'dis'].forEach((mode) => {
                    const btn = document.querySelector(`button[data-attack-hit="${idx}"][data-mode="${mode}"]`);
                    btn?.addEventListener('click', (ev) => {
                        ev.preventDefault();
                        rollMonsterAttackHit(token, a, mode);
                    });
                });
                const dmgBtn = document.querySelector(`button[data-attack-dmg="${idx}"]`);
                dmgBtn?.addEventListener('click', (ev) => {
                    ev.preventDefault();
                    rollMonsterDamage(token, a);
                });
            });
        };

        const ensureEnvBonusStore = () => {
            if (!dungeonMapState) dungeonMapState = {};
            if (!dungeonMapState.envBonusesByKey) dungeonMapState.envBonusesByKey = {};
        };

        const getEnvBonusKey = ({ kind, x, y, roomId }) => {
            if (kind === 'corridor') return `corridor:${x},${y}`;
            return `room:${roomId}`;
        };

        const runEnvironmentalCheck = ({ kind, x, y, roomId, roomName, roomType, encounter, dc, label, bonus, mode }) => {
            const encName = stripHtml(encounter?.name || 'Environmental Effect');
            const roll = rollWithMode(mode);
            const b = Number(bonus) || 0;
            const total = roll.result + b;
            const target = Number(dc) || 0;
            const pass = total >= target;

            const rollText = (roll.mode === 'normal')
                ? `${roll.result}`
                : `${roll.a}, ${roll.b} â†' ${roll.result}`;

            const detailParts = [
                `DC ${target}`,
                `Roll (${roll.mode}): ${rollText}`,
                `Bonus: ${b >= 0 ? '+' : ''}${b}`,
                `Total: ${total}`,
                label ? `Hook: ${stripHtml(label)}` : '',
            ].filter(Boolean);

            if (kind === 'corridor') {
                appendDungeonHistory({
                    tag: 'ENV-ROLL',
                    message: `${encName}: ${total} vs DC ${target} (${pass ? 'PASS' : 'FAIL'})`,
                    detailHtml: `Hall tile: (${x}, ${y})<br>${detailParts.map((p) => stripHtml(p)).join(' "¢ ')}`,
                });
            } else {
                appendDungeonHistory({
                    tag: 'ENV-ROLL',
                    message: `${encName}: ${total} vs DC ${target} (${pass ? 'PASS' : 'FAIL'})`,
                    detailHtml: `Room: ${stripHtml(roomName || 'Room')} (ID ${roomId}) "¢ ${stripHtml(roomType || '')}<br>${detailParts.map((p) => stripHtml(p)).join(' "¢ ')}`,
                });
            }
            return { pass, total, target, roll, bonus: b };
        };

        const removeEntityFromMap = (entityId) => {
            const layout = dungeonMapState?.layout;
            const gridEl = document.getElementById('dungeon-grid');
            if (gridEl) {
                const el = gridEl.querySelector(`.dungeon-token[data-entity-id="${CSS.escape(entityId)}"]`);
                if (el && el.parentElement) el.parentElement.removeChild(el);
            }
            if (dungeonMapState?.entities) dungeonMapState.entities = dungeonMapState.entities.filter(e => e.id !== entityId);
        };

        const ensureTeleporterStore = () => {
            const layout = dungeonMapState?.layout;
            if (!layout) return null;
            if (!layout.teleportersByColor) layout.teleportersByColor = {};
            return layout.teleportersByColor;
        };

        const parseCoord = (txt) => {
            const parts = String(txt || '').split(',');
            if (parts.length !== 2) return null;
            const x = parseInt(parts[0], 10);
            const y = parseInt(parts[1], 10);
            if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
            return { x, y };
        };

        const renderTeleportMarks = () => {
            const layout = dungeonMapState?.layout;
            const gridEl = document.getElementById('dungeon-grid');
            if (!layout || !gridEl) return;
            gridEl.querySelectorAll('.cell-mark.teleporter').forEach((el) => el.remove());
            const store = layout.teleportersByColor || {};
            for (const [color, points] of Object.entries(store)) {
                for (const p of points || []) {
                    const idx = p.y * layout.width + p.x;
                    const cellDiv = gridEl.children[idx];
                    if (!cellDiv) continue;
                    const mark = document.createElement('div');
                    mark.className = 'cell-mark teleporter';
                    mark.style.color = color || '#38bdf8';
                    mark.textContent = 'âŸ³';
                    cellDiv.appendChild(mark);
                }
            }
        };

        const setTeleportersForColor = (color, coords) => {
            const layout = dungeonMapState?.layout;
            if (!layout) return { ok: false, error: 'Generate a map first.' };
            const store = ensureTeleporterStore();
            const valid = (coords || []).filter((p) => p && Number.isFinite(p.x) && Number.isFinite(p.y));
            const limited = valid.slice(0, 2);
            const old = store?.[color] || [];
            for (const p of old) {
                const cell = layout.grid?.[p.y]?.[p.x];
                if (cell && cell.teleporterColor === color) delete cell.teleporterColor;
            }
            store[color] = limited;
            for (const p of limited) {
                const cell = layout.grid?.[p.y]?.[p.x];
                if (cell) cell.teleporterColor = color;
            }
            renderTeleportMarks();
            return { ok: true, count: limited.length };
        };

        const getTeleporterAt = (x, y) => {
            const layout = dungeonMapState?.layout;
            if (!layout?.teleportersByColor) return null;
            for (const [color, pts] of Object.entries(layout.teleportersByColor)) {
                const idx = (pts || []).findIndex((p) => p.x === x && p.y === y);
                if (idx >= 0) {
                    const partner = (pts.length === 2) ? pts[(idx + 1) % 2] : null;
                    return { color, target: partner, endpoints: pts.length };
                }
            }
            return null;
        };

        const runDungeonCommand = (cmd) => {
            const raw = String(cmd || '').trim();
            if (!raw) return { ok: false, error: 'Enter a command.' };
            const parts = raw.split(/\s+/g);
            const keyword = parts.shift()?.toLowerCase();
            if (keyword === 'teleporter' || keyword === 'teleport') {
                const color = parts.shift();
                if (!color) return { ok: false, error: 'Provide a color for the teleporter (e.g., teleporter blue 3,4 10,12).' };
                if (parts[0] && parts[0].toLowerCase() === 'clear') {
                    setTeleportersForColor(color, []);
                    return { ok: true, message: `Cleared teleporter ${color}.` };
                }
                const coords = parts.map(parseCoord).filter(Boolean);
                if (!coords.length) return { ok: false, error: 'Provide one or two coordinates (e.g., 3,4 10,12).' };
                const layout = dungeonMapState?.layout;
                if (!layout) return { ok: false, error: 'Generate a map first.' };
                const inBounds = coords.every((c) => c.x >= 0 && c.y >= 0 && c.x < layout.width && c.y < layout.height);
                if (!inBounds) return { ok: false, error: 'Coordinates must be inside the current map.' };
                const out = setTeleportersForColor(color, coords);
                if (!out.ok) return out;
                const msg = (coords.length === 2)
                    ? `Linked ${color} teleporter: (${coords[0].x},${coords[0].y}) â†" (${coords[1].x},${coords[1].y}).`
                    : `Placed ${color} teleporter at (${coords[0].x},${coords[0].y}). Add a second coordinate to link.`;
                return { ok: true, message: msg };
            }
            return { ok: false, error: `Unknown command: ${keyword}. Try "teleporter blue 3,4 10,12".` };
        };

        const computeSealedRoomIds = (layout, collectedKeys) => {
            const sealed = new Set();
            if (!layout?.doorsById) return sealed;
            const has = (kid) => {
                try {
                    return !!(collectedKeys && typeof collectedKeys.has === 'function' && collectedKeys.has(kid));
                } catch {
                    return false;
                }
            };
            for (const d of Object.values(layout.doorsById)) {
                if (!d || !d.locked) continue;
                if (has(d.keyId)) continue; // once the key is acquired, don't treat the room as sealed
                if (typeof d.targetRoomId === 'number') sealed.add(d.targetRoomId);
            }
            return sealed;
        };

        const updateDoorAndRoomLockVisuals = () => {
            const layout = dungeonMapState?.layout;
            const gridEl = document.getElementById('dungeon-grid');
            if (!layout || !gridEl) return;

            const sealedRoomIds = computeSealedRoomIds(layout, dungeonMapState?.collectedKeys);

            for (let y = 0; y < layout.height; y++) {
                for (let x = 0; x < layout.width; x++) {
                    const cell = layout.grid?.[y]?.[x];
                    const idx = y * layout.width + x;
                    const cellDiv = gridEl.children[idx];
                    if (!cell || !cellDiv) continue;

                    cellDiv.classList.remove('cell-room-locked-edge');
                    cellDiv.classList.remove('cell-door-locked');

                    if (cell.type === 'room' && sealedRoomIds.has(cell.roomId)) {
                        const room = layout.rooms?.[cell.roomId];
                        if (room && (x === room.x1 || x === room.x2 || y === room.y1 || y === room.y2)) {
                            cellDiv.classList.add('cell-room-locked-edge');
                        }
                    }

                    if (cell.doorId && layout.doorsById && layout.doorsById[cell.doorId]) {
                        const d = layout.doorsById[cell.doorId];
                        const hasKey = dungeonMapState?.collectedKeys && dungeonMapState.collectedKeys.has(d.keyId);
                        if (d.locked && !hasKey) cellDiv.classList.add('cell-door-locked');
                    }
                }
            }
        };

        const spawnKeyTokenAt = (x, y, keyId, reason) => {
            const layout = dungeonMapState?.layout;
            if (!layout?.keysById?.[keyId]) return null;
            const gridEl = document.getElementById('dungeon-grid');
            if (!gridEl) return null;

            if (x < 0 || y < 0 || x >= layout.width || y >= layout.height) return null;
            const cell = layout.grid?.[y]?.[x];
            if (!cell || cell.type === 'wall') return null;

            const key = layout.keysById[keyId];
            if (key.collected) return null;
            if (key.entityId) return key.entityId;

            key.x = x;
            key.y = y;
            key.acquisition = reason || key.acquisition || 'dropped';
            cell.keyId = keyId;

            const id = makeDungeonEntityId();
            key.entityId = id;

            const ent = {
                id,
                kind: 'key',
                label: '🗝',
                title: `Key ${keyId} (opens ${key.doorId})`,
                x,
                y,
                source: { kind: 'key', doorId: key.doorId, roomId: key.roomId, reason: key.acquisition },
            };
            if (!Array.isArray(dungeonMapState.entities)) dungeonMapState.entities = [];
            dungeonMapState.entities.push(ent);

            const cellIndex = y * layout.width + x;
            const cellDiv = gridEl.children[cellIndex];
            if (!cellDiv) return null;

            const el = document.createElement('div');
            el.className = 'dungeon-token token-key';
            el.textContent = '🗝';
            el.dataset.title = ent.title || '';
            el.dataset.entityId = ent.id;

            const existing = cellDiv.querySelectorAll('.dungeon-token').length;
            const cellSize = clamp(dungeonMapState?.cellSize ?? 26, 16, 44);
            const tokenSize = clamp(Math.round(cellSize * 0.55), 10, 26);
            const pad = 2;
            const step = tokenSize + 1;
            const offsets = [
                { left: pad, top: pad },
                { left: pad + step, top: pad },
