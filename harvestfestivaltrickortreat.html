<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harvest Festival Trick or Treat</title>
    <!-- 1. Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 1b. Load Spooky Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=MedievalSharp&display=swap" rel="stylesheet">
    <!-- 2. Configure Tailwind & Fonts -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['MedievalSharp', 'serif'], // Swapped to spooky font
                        creepster: ['Creepster', 'cursive'],
                    },
                    colors: {
                        'brand-orange': '#f97316',
                        'brand-purple': '#8b5cf6',
                    }
                },
            },
        };
    </script>
    <!-- 3. Custom Styles -->
    <style>
        /* New Halloween Color Palette */
        :root {
            --halloween-orange: #f97316; /* brand-orange */
            --halloween-orange-light: #fdba74; /* orange-300 */
            --halloween-orange-dark: #ea580c; /* orange-600 */
            --halloween-purple: #2d2a45; /* Dark Purple */
            --halloween-purple-dark: #1c1a2e; /* Darker Purple */
            --halloween-text: #f3e8ff; /* Pale Lavender */
            --halloween-green: #34d399; /* Slime Green */
            --halloween-gold: #ffd700; /* Gold for magical highlight */
            --halloween-shadow: rgba(0, 0, 0, 0.7);
        }

        body {
            font-family: 'MedievalSharp', serif; /* Use spooky font by default */
            background-color: var(--halloween-purple-dark);
            background-image: url('https://www.transparenttextures.com/patterns/spooky.png');
            background-size: auto;
            background-position: center;
            background-attachment: fixed;
            color: var(--halloween-text);
        }

        /* Spooky main title */
        .font-creepster {
            font-family: 'Creepster', cursive;
            text-shadow: 2px 2px 4px var(--halloween-shadow);
            letter-spacing: 2px;
        }

        /* Fun glowing effect for the button (now orange) */
        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 15px rgba(249, 115, 22, 0.5), 0 0 5px rgba(249, 115, 22, 0.3);
            }
            50% {
                box-shadow: 0 0 30px rgba(249, 115, 22, 0.8), 0 0 10px rgba(249, 115, 22, 0.5);
            }
        }

        #treatButton {
            animation: pulse-glow 3s infinite ease-in-out;
            font-family: 'MedievalSharp', cursive; /* Ensure button font */
        }

        /* Custom scrollbar for the log */
        #logContainer::-webkit-scrollbar {
            width: 8px;
        }
        #logContainer::-webkit-scrollbar-track {
            background: var(--halloween-purple-dark);
        }
        #logContainer::-webkit-scrollbar-thumb {
            background: var(--halloween-orange-dark);
            border-radius: 4px;
        }
        #logContainer::-webkit-scrollbar-thumb:hover {
            background: var(--halloween-orange);
        }

        /* Golden text glow for magical treats */
        .golden-glow {
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.6), 0 0 12px rgba(255, 215, 0, 0.35);
        }

    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Main App Container -->

         style="background-image: url('https://www.transparenttextures.com/patterns/subtle-cobwebs.png');">

            <p class="text-center text-[var(--halloween-text)]/80 mb-6">Please enter your character's name to begin.</p>
            
            <div class="flex flex-col gap-4">

                <button id="enterButton"

                    Go Trick or Treating
                </button>
                <p id="nameError" class="text-red-400 text-center text-sm hidden">Please enter a name!</p>
            </div>
            
        </div>

        <!-- View 2: Main App (Hidden by default) -->
        <div id="mainAppView" class="hidden">

                <div class="userInfo">
                    <span class="text-[var(--halloween-text)]/90 text-lg">Welcome, <strong id="usernameDisplay" class="font-medium text-[var(--halloween-text)]"></strong>!</span>
                </div>
            </div>

            <!-- App Tabs -->

            </div>

            <!-- Trick or Treat Section -->

                <!-- Trick or Treat Button & Result -->

                    <button id="treatButton"

                        <span class="text-[var(--halloween-text)]/60">...waiting for you to knock...</span>
                    </div>
                </div>

                <!-- Public Log -->

                    <h3 class="text-2xl font-semibold mb-4 text-[var(--halloween-text)]">Session Log</h3>
                    <div id="logContainer"
                        class="h-64 overflow-y-auto bg-[var(--halloween-purple-dark)] bg-opacity-75 rounded-lg p-4 border border-[var(--halloween-orange-dark)] space-y-3 text-sm">
                        <!-- Log entries will be populated here by JavaScript -->
                        <p class="text-[var(--halloween-text)]/50 text-center italic">Your results will appear here...</p>
                    </div>
                </div>
            </div>

            <!-- Candy Catalogue Section -->

                    <div class="flex flex-wrap items-center gap-2">
                        <button id="catTabMundane" class="px-3 py-1 rounded bg-[var(--halloween-orange)] text-black border border-[var(--halloween-orange-dark)]">Mundane <span id="countMundane" class="ml-1 text-xs align-top">0/0</span></button>
                        <button id="catTabMagical" class="px-3 py-1 rounded bg-[var(--halloween-purple)] text-[var(--halloween-text)] border border-[var(--halloween-orange-dark)]">Magical <span id="countMagical" class="ml-1 text-xs align-top">0/0</span></button>
                        <button id="catTabFull" class="px-3 py-1 rounded bg-[var(--halloween-purple)] text-[var(--halloween-text)] border border-[var(--halloween-orange-dark)]">Full Bars <span id="countFull" class="ml-1 text-xs align-top">0/0</span></button>
                        <label class="ml-auto flex items-center gap-2 text-sm text-[var(--halloween-text)]/80"><input id="catalogueCollectedOnly" type="checkbox" class="accent-[var(--halloween-orange)]"> Collected only</label>
                        <button id="resetCollectionBtn" class="px-3 py-1 rounded bg-[#7f1d1d] text-white border border-red-700 hover:bg-red-800">Reset This Character</button>
                    </div>
                </div>
                <div id="catalogueGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
            </div>

            <!-- TRICK OR TREAT BUTTON & RESULT (DUPLICATE REMOVED) -->
            <!-- The old, un-themed gray/purple button and log have been deleted -->

        </div>

    </div>

            const roll = rollD100();

                    const exists = picks.some(p => normalizeKey(p.name) === normalizeKey(pick.name));
                    if (!exists || mundaneCandies.length < count) {

                .replace(/(’s|'s)\b/g, '')
                // Strip common punctuation variants we don't care about
                .replace(/\*|’|‘|“|”|—|–/g, '')
                // Collapse everything else to alphanumerics
                .replace(/[^a-z0-9]+/g, '');

        tabCatalogue.addEventListener('click', showCatalogue);

        // Catalogue events
        catTabMundane.addEventListener('click', () => renderCatalogue('mundane'));
        catTabMagical.addEventListener('click', () => renderCatalogue('magical'));
        catTabFull.addEventListener('click', () => renderCatalogue('full'));
        catalogueCollectedOnly.addEventListener('change', () => renderCatalogue(currentCatalogueCategory));
        resetCollectionBtn.addEventListener('click', () => {
            if (!username) return;
            currentCollection = emptyCollection();
            saveCollection(username, currentCollection);
            updateCatalogueProgress();
            renderCatalogue(currentCatalogueCategory);
        });

        // 2. Get a Treat
        treatButton.addEventListener("click", () => {
            // Disable button briefly to prevent spam
            treatButton.disabled = true;
            treatButton.textContent = "Knocking...";
            resultBox.innerHTML = `<span class="text-[var(--halloween-text)]/60">...the door opens...</span>`;

            setTimeout(() => {
                const result = getTrickOrTreat();
                
                // Display the result
                // NEW: Support array (Good Haul), single object, or string
                if (Array.isArray(result.reward)) {
                    const items = result.reward;
                    const gridCols = items.length === 2 ? 'grid-cols-2' : (items.length >= 3 ? 'grid-cols-3' : 'grid-cols-1');
                    const cards = items.map(it => {
                        const imgSrc = findBestCandyImage(it.name);
                        const displayDesc = `${it.desc} ${MUNDANE_HEAL_NOTE}`;
                        return `
                            <div class="rounded-md border border-[var(--halloween-orange-dark)]/40 bg-[var(--halloween-purple-dark)]/60 p-2">
                                ${imgSrc ? `<img src="${imgSrc}" alt="${it.name}" class="w-full h-auto object-contain mb-2 rounded-md">` : ''}
                                <div class="text-sm font-semibold text-[var(--halloween-text)]">${it.name}</div>
                                <div class="text-xs text-[var(--halloween-text)]/80">${displayDesc}</div>
                            </div>`;
                    }).join('');
                    resultBox.innerHTML = `
                        <div class="flex flex-col items-center text-center w-full">
                            <div class="${result.style} mb-3"><strong>A Good Haul!</strong> You got ${items.length} pieces of mundane candy!</div>
                            <div class="grid ${gridCols} gap-3 w-full">${cards}</div>
                        </div>`;
                } else if (typeof result.reward === 'object') {
                    // It's an item with a name and description (including the magical candy note)
                    const imgSrc = getImageForResult(result);
                    const displayDesc = result.type === 'Mundane Candy'
                        ? `${result.reward.desc} ${MUNDANE_HEAL_NOTE}`
                        : (result.reward.desc || '');
                    resultBox.innerHTML = `
                        <div class="flex flex-col items-center text-center">
                            ${imgSrc ? `<img src="${imgSrc}" alt="${result.reward.name}" class="w-full h-auto object-contain mb-2 rounded-md border border-[var(--halloween-orange-dark)]/40">` : ''}
                            <span class="${result.style}">
                                <strong class="block text-lg">${result.reward.name}</strong>
                                <span class="text-sm">${displayDesc}</span>
                            </span>
                        </div>`;
                } else {
                    // It's a simple string (Good Haul or Trick)
                    resultBox.innerHTML = `<span class="${result.style}">${result.reward}</span>`;
                }
                
                // Log the result
                logResult(result);

                // Tracking: mark candy collection per character
                if (username) {
                    if (Array.isArray(result.reward)) {
                        // Good Haul: multiple mundane candies
                        result.reward.forEach(it => {
                            markCollected(username, 'Mundane Candy', it.name);
                        });
                    } else if (typeof result.reward === 'object') {
                        const cat = categoryFromType(result.type);
                        if (cat) {
                            markCollected(username, result.type, result.reward.name);
                        }
                    }
                    // If catalogue open, refresh counts/grid
                    if (!catalogueSection.classList.contains('hidden')) {
                        updateCatalogueProgress();
                        renderCatalogue(currentCatalogueCategory);
                    }
                }

                // Re-enable button
                treatButton.disabled = false;
                treatButton.textContent = "Knock for Another Treat!";
            }, 1000); // 1-second delay for suspense
        });

        // 3. Log Result (No Backend!)
        function logResult(result) {
            // Get a simple timestamp
            const timestamp = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            // NEW: Handle reward being an array, object, or string
            const isArray = Array.isArray(result.reward);
            const isObject = (typeof result.reward === 'object' && !isArray);
            const rewardText = isObject ? result.reward.name : (isArray ? '' : result.reward);

            // Prepare modal linkage
            let linkHtml = '';
            if (isArray) {
                const links = result.reward.map(it => {
                    const imgSrc = findBestCandyImage(it.name);
                    const id = logIdCounter++;
                    const descForModal = `${it.desc} ${MUNDANE_HEAL_NOTE}`;
                    logAssets[id] = { name: it.name, desc: descForModal, img: imgSrc, type: 'Mundane Candy' };
                    return `<button class="underline text-[var(--halloween-orange-light)] hover:text-[var(--halloween-orange)]" onclick="openAssetModal(${id})">${it.name}</button>`;
                });
                linkHtml = links.join(', ');
            } else if (isObject) {
                const imgSrc = getImageForResult(result);
                const id = logIdCounter++;
                const descForModal = result.type === 'Mundane Candy'
                    ? `${result.reward.desc} ${MUNDANE_HEAL_NOTE}`
                    : (result.reward.desc || '');
                logAssets[id] = { name: result.reward.name, desc: descForModal, img: imgSrc, type: result.type };
                linkHtml = `<button class="underline text-[var(--halloween-orange-light)] hover:text-[var(--halloween-orange)]" onclick="openAssetModal(${id})">${result.reward.name}</button>`;
            }

            // Create the new log entry
            const logEntry = document.createElement("p");
            logEntry.className = "text-[var(--halloween-text)]/90 border-b border-[var(--halloween-orange-dark)]/50 pb-2";
            
            // Use innerHTML to render the colors/styles
            logEntry.innerHTML = `
                <span class="font-medium text-[var(--halloween-text)]/70">[${timestamp}]</span> 
                <strong class="text-[var(--halloween-text)]">${username}</strong> 
                <span class="text-[var(--halloween-orange)]">(${result.type})</span>
                <span class="text-[var(--halloween-text)]/90"> got: </span>
                ${(isObject || isArray) ? `<span class="${result.style}">${linkHtml}</span>` : `<span class="${result.style}">${rewardText}</span>`}
            `;

            // Prepend to the top of the log
            logContainer.prepend(logEntry);
        }

        // Modal open/close exposed globally
        window.openAssetModal = function (id) {
            const asset = logAssets[id];
            const modal = document.getElementById('assetModal');
            const titleEl = document.getElementById('assetModalTitle');
            const imgEl = document.getElementById('assetModalImage');
            const descEl = document.getElementById('assetModalDesc');
            if (!asset) return;
            titleEl.textContent = asset.name;
            if (asset.img) {
                imgEl.src = asset.img;
                imgEl.alt = asset.name;
                imgEl.classList.remove('hidden');
            } else {
                imgEl.src = '';
                imgEl.alt = '';
                imgEl.classList.add('hidden');
            }
            descEl.textContent = asset.desc || '';
            modal.classList.remove('hidden');
        };
        window.closeAssetModal = function () {
            const modal = document.getElementById('assetModal');
            modal.classList.add('hidden');
        };

        // Accessibility: ESC closes modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const modal = document.getElementById('assetModal');
                if (!modal.classList.contains('hidden')) closeAssetModal();
            }
        });
        // Click backdrop to close
        const modalEl = document.getElementById('assetModal');
        modalEl.addEventListener('click', (e) => {
            if (e.target === modalEl) closeAssetModal();
        });

        // (Removed) Magical candy consumption UI and logging helpers are not required.

    </script>
</body>
</html>
