<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scholia Diaspros Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="stylesheet" href="src/scholia-map/styles.css" />
</head>
<body class="scholia-map-page">
  <div class="atlas-shell">
    <main class="atlas-layout">
      <section class="atlas-map-panel" aria-label="Interactive regional map">
        <div class="atlas-map-frame" id="mapFrame">
          <div class="atlas-map-stage" id="mapStage">
            <img
              id="atlasImage"
              class="atlas-map-image"
              src="referencedata/World%20of%20Scholia%20Diaspros/scholiaworldmap.webp"
              alt="Illustrated world map of Scholia Diaspros"
            />
            <svg id="atlasOverlay" class="atlas-overlay" viewBox="0 0 7116 3499" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
          </div>
          <div id="regionTooltip" class="region-tooltip" hidden></div>
        </div>

        <div class="atlas-floating-brand">
          <p class="atlas-kicker">World Atlas</p>
          <h1>Scholia Diaspros</h1>
          <p class="atlas-subtitle">Explore the full map first. Pull drawers only when you need search, zoom, or a fact file.</p>
        </div>

        <div class="atlas-floating-actions">
          <button class="atlas-button" type="button" data-drawer-toggle="controlsDrawer">Controls</button>
          <button class="atlas-button" id="openSelectedRegionButton" type="button">Open Selected Region</button>
        </div>

        <button
          id="atlasGlobalMute"
          class="atlas-global-mute"
          type="button"
          aria-label="Mute all atlas audio"
          aria-pressed="false"
          title="Mute all atlas audio"
        >
          <span class="atlas-global-mute-icon atlas-global-mute-icon-on" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M3 10v4h4l5 4V6L7 10H3zm12.5 2a4.5 4.5 0 0 0-2.18-3.85v7.69A4.5 4.5 0 0 0 15.5 12zm0-7.5v2.06A7.5 7.5 0 0 1 19 12a7.5 7.5 0 0 1-3.5 6.44v2.06A9.5 9.5 0 0 0 21 12a9.5 9.5 0 0 0-5.5-8.5z" />
            </svg>
          </span>
          <span class="atlas-global-mute-icon atlas-global-mute-icon-off" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M3 10v4h4l5 4V6L7 10H3zm13.59 2 2.7-2.71-1.42-1.41L15.17 10.6l-2.71-2.72-1.41 1.41 2.7 2.71-2.7 2.71 1.41 1.41 2.71-2.71 2.7 2.71 1.42-1.41L16.59 12z" />
            </svg>
          </span>
        </button>

        <div id="atlasMusicPlayer" class="atlas-music-player" hidden>
          <div class="atlas-music-meta">
            <p class="atlas-kicker">Now Playing</p>
            <p id="atlasMusicTrack" class="atlas-music-track">-</p>
            <p id="atlasMusicRegion" class="atlas-music-region">-</p>
          </div>
          <div class="atlas-music-controls">
            <button id="atlasMusicPlayPause" class="atlas-button atlas-button-ghost atlas-music-button" type="button">Pause</button>
            <button id="atlasMusicNext" class="atlas-button atlas-button-ghost atlas-music-button" type="button">Next</button>
            <label class="atlas-music-volume" for="atlasMusicVolume">
              <span>Volume</span>
              <input id="atlasMusicVolume" type="range" min="0" max="100" step="1" value="72" />
            </label>
          </div>
        </div>

        <div id="atlasBackdrop" class="atlas-backdrop" hidden></div>
        <div id="regionModalLayer" class="atlas-region-modal-layer" aria-live="polite"></div>

        <aside id="controlsDrawer" class="atlas-drawer atlas-drawer-left" aria-hidden="true">
          <div class="atlas-drawer-header">
            <div>
              <p class="atlas-kicker">Navigation</p>
              <h2>Map Controls</h2>
            </div>
            <button class="atlas-button atlas-button-ghost" type="button" data-drawer-close="controlsDrawer">Close</button>
          </div>

          <div class="atlas-drawer-body">
            <label class="atlas-search" for="regionSearch">
              <span>Search Regions</span>
              <input id="regionSearch" type="search" placeholder="Find a region..." autocomplete="off" />
            </label>

            <div class="atlas-toolbar atlas-toolbar-drawer">
              <button class="atlas-button" data-zoom-action="in" type="button">Zoom In</button>
              <button class="atlas-button" data-zoom-action="out" type="button">Zoom Out</button>
              <button class="atlas-button" data-zoom-action="reset" type="button">Reset View</button>
            </div>

            <button id="bookmarkToggle" class="atlas-button atlas-button-wide" type="button" aria-pressed="false">Bookmarks Only</button>
            <div class="atlas-status" id="atlasStatus">Loading regions...</div>

            <div class="atlas-legend atlas-legend-drawer">
              <span><i class="legend-swatch legend-swatch-region"></i> Regions</span>
              <span><i class="legend-swatch legend-swatch-active"></i> Selected</span>
              <span><i class="legend-swatch legend-swatch-bookmark"></i> Bookmarked</span>
            </div>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <template id="regionOverviewTemplate">
    <section class="atlas-region-modal" role="dialog" aria-modal="false">
      <div class="atlas-region-modal-header">
        <div>
          <p class="atlas-kicker region-modal-kicker">Fact File</p>
          <h2 class="region-modal-heading">Region Details</h2>
        </div>
        <button class="atlas-button atlas-button-ghost" type="button" data-region-modal-close>Close</button>
      </div>

      <div class="atlas-region-modal-body">
        <div class="detail-card detail-card-hero">
          <div class="detail-image-wrap">
            <img data-region-hero-image class="detail-image" alt="Selected region artwork" />
          </div>
          <div class="detail-hero-body">
            <p data-region-eyebrow class="detail-eyebrow">Atlas Entry</p>
            <div class="detail-title-row">
              <h2 data-region-title>Select a region</h2>
              <button data-region-bookmark-button class="bookmark-chip" type="button" aria-pressed="false">Bookmark</button>
            </div>
            <p data-region-summary class="detail-summary">Hover or click a region on the map to open its fact file.</p>
            <div data-region-tags class="detail-tags"></div>
          </div>
        </div>

        <section class="detail-card">
          <div class="detail-section-heading">
            <h3>Overview</h3>
            <span data-region-music-state class="detail-pill">Playlist pending</span>
          </div>
          <p data-region-description class="detail-copy">This panel is ready for lore, culture, landmarks, and regional history.</p>
        </section>

        <section class="detail-card" data-region-promo-section hidden>
          <div class="detail-section-heading">
            <h3>Playable Tie-Ins</h3>
            <span data-region-promo-count class="detail-pill">0 playable</span>
          </div>
          <div data-region-promos class="detail-grid"></div>
        </section>

        <section class="detail-card">
          <div class="detail-section-heading">
            <h3>Lore Chronicle</h3>
            <span class="detail-pill">Text + Visual Pairing</span>
          </div>
          <div data-region-lore class="detail-lore"></div>
        </section>

        <section class="detail-card">
          <div class="detail-section-heading">
            <h3>Regional Gallery</h3>
            <span class="detail-pill">Local Images</span>
          </div>
          <div data-region-gallery class="detail-gallery"></div>
        </section>

        <section class="detail-card" hidden>
          <div class="detail-section-heading">
            <h3>Media Readiness</h3>
            <span data-region-media-status class="detail-pill">Pending review</span>
          </div>
          <div data-region-media-summary class="detail-grid"></div>
          <div data-region-media-needs class="detail-checklist"></div>
        </section>

        <section class="detail-card">
          <div class="detail-section-heading">
            <h3>Items</h3>
            <span data-region-item-count class="detail-pill">0 linked</span>
          </div>
          <div data-region-items class="detail-grid"></div>
          <div data-region-item-actions class="detail-grid-actions"></div>
        </section>

        <section class="detail-card" data-region-handbook-section hidden>
          <div class="detail-section-heading">
            <h3>People and Character Hooks</h3>
            <span data-region-handbook-count class="detail-pill">0 linked</span>
          </div>
          <div data-region-handbook-links class="detail-grid"></div>
        </section>

        <section class="detail-card">
          <div class="detail-section-heading">
            <h3>Monsters and Characters</h3>
            <span data-region-entity-count class="detail-pill">Curation pending</span>
          </div>
          <div data-region-entities class="detail-grid"></div>
        </section>
      </div>
    </section>
  </template>

  <script src="src/data/allData.js"></script>
  <script src="src/data/browser-data.js"></script>
  <script src="src/data/scholia-map/regionMetadata.js"></script>
  <script src="src/scholia-map/app.js"></script>
</body>
</html>
