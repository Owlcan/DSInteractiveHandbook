            { category: "Restoration", name: "Cradle of Comfort", value: 2, dc: "Spell", desc: "Protects against Fear (Maturity drain).", icon: <Shield size={14} /> },
            { category: "Restoration", name: "Sleepy Time Tea", value: 2, dc: "Spell", desc: "Deep restorative nap (10 mins).", icon: <Bed size={14} /> },
            { category: "Restoration", name: "Blessed Baby Lotion", value: 1, dc: "Spell", desc: "Soothes rash. Removes 'Cranky'.", icon: <Heart size={14} /> },
            { category: "Restoration", name: "Golden Graceberry", value: 1, dc: "Item", desc: "Divine relief (Risk incontinence).", icon: <Plus size={14} /> },
            { category: "Restoration", name: "Soothing Snuggle", value: 1, dc: "Spell", desc: "Heals HP + removes Fear via hug.", icon: <Heart size={14} /> },
            { category: "Restoration", name: "Warm Milk", value: 1, dc: "Spell", desc: "Heals and soothes.", icon: <Utensils size={14} /> },
        ];

        // --- COMPONENTS ---

        const WindowItem = ({ item, onFail }) => {
            const [active, setActive] = useState(false);
            
            return (
                <div className={`p-2 rounded border transition-all ${active ? 'bg-amber-900/30 border-amber-500' : 'bg-black/40 border-amber-900/30'}`}>
                    <div className="flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <span className="text-amber-600">{item.icon}</span>
                            <span className="font-bold text-sm text-amber-200">{item.name}</span>
                        </div>
                        <span className="text-xs font-mono text-amber-500">{item.time}</span>
                    </div>
                    <div className="text-[13px] text-amber-400/70 truncate" title={item.desc}>{item.desc}</div>
                    
                    {!active ? (
                        <button onClick={() => setActive(true)} className="w-full mt-2 py-1 bg-amber-900/50 hover:bg-amber-800 text-amber-200 text-xs rounded uppercase tracking-wider">
                            Start Timer
                        </button>
                    ) : (
                        <div className="flex gap-2 mt-2">
                            <button onClick={() => setActive(false)} className="flex-1 py-1 bg-green-900/50 hover:bg-green-800 text-green-200 text-xs rounded border border-green-800">
                                Resolved
                            </button>
                            <button onClick={() => { setActive(false); onFail(item); }} className="flex-1 py-1 bg-red-900/50 hover:bg-red-800 text-red-200 text-xs rounded border border-red-800">
                                Failed
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        const TrackerGauge = ({ value, label, statusColor, trueExhaustion }) => (
            <div className="relative w-56 h-56 md:w-72 md:h-72 mx-auto group">
                <div className={`absolute inset-0 rounded-full blur-xl opacity-20 ${statusColor.replace('text', 'bg')}`}></div>
                <div className="absolute inset-0 rounded-full border-[10px] border-[#2a1d19] shadow-2xl gold-ring"></div>
                <div className="absolute inset-0 flex flex-col items-center justify-center z-10">
                    <span className="cinzel text-lg text-[#b45309] uppercase tracking-widest font-bold mb-1">Maturity</span>
                    <span className="cinzel text-7xl md:text-8xl font-bold gold-gradient drop-shadow-lg">{value}</span>
                    <span className={`px-3 py-1 rounded-full bg-black/60 border border-[#b45309]/30 text-base uppercase tracking-widest font-bold ${statusColor} mb-1`}>
                        {label}
                    </span>
                    {trueExhaustion > 0 && (
                        <div className="flex items-center gap-1 text-red-500 font-bold bg-black/80 px-2 py-0.5 rounded border border-red-900 animate-pulse">
                            <Skull size={12} /> True Exh: {trueExhaustion}
                        </div>
                    )}
                </div>
                {[...Array(25)].map((_, i) => (
                     <div key={i} className="absolute inset-0" style={{ transform: `rotate(${i * (360/25)}deg)` }}>
                        <div className="h-1.5 w-0.5 bg-[#503a2a] mx-auto mt-1"></div>
                    </div>
                ))}
            </div>
        );

        const App = () => {
            const [baseMaturity, setBaseMaturity] = useState(20);
            const [modifiers, setModifiers] = useState([]);
            const [activeTab, setActiveTab] = useState("Monsters");
            const [trueExhaustion, setTrueExhaustion] = useState(0);
            const [showRestMenu, setShowRestMenu] = useState(false);
            const [libraryOpen, setLibraryOpen] = useState(true);

            const totalMaturity = useMemo(() => {
                const modSum = modifiers.reduce((acc, curr) => acc + curr.value, 0);
                let total = baseMaturity + modSum;
                if (total > 25) total = 25;
                if (total < 0) total = 0;
                return total;
            }, [baseMaturity, modifiers]);

            const currentStatus = useMemo(() => {
                return MATURITY_TIERS.find(t => totalMaturity >= t.range[0] && totalMaturity <= t.range[1]) || MATURITY_TIERS.find(t => t.label === "Baseline");
            }, [totalMaturity]);

            const activeEffects = useMemo(() => {
                let effectsList = [];
                // True Exhaustion Note
                if (trueExhaustion > 0) {
                    effectsList.push({ text: "Deep Strain on Adult Persona. Cannot be removed by Greater Restoration.", source: "True Exhaustion" });
                }
                
                if (totalMaturity > 20) {
                     MATURITY_TIERS.forEach(tier => {
                        if (tier.range[0] > 20 && totalMaturity >= tier.range[0]) {
                            tier.effects.forEach(e => effectsList.push({ text: e, source: tier.label }));
                        }
                    });
                }
                if (totalMaturity < 20) {
                     MATURITY_TIERS.forEach(tier => {
                        if (tier.range[1] < 20 && tier.range[1] >= totalMaturity) {
                             tier.effects.forEach(e => effectsList.push({ text: e, source: tier.label }));
                        }
                    });
                }
                return effectsList;
            }, [totalMaturity, trueExhaustion]);

            const addModifier = (item) => {
                const newMod = { ...item, id: Date.now() + Math.random() };
                setModifiers(prev => [newMod, ...prev]);
            };

            const handleWindowFail = (windowItem) => {
                addModifier({ 
                    name: `Failed: ${windowItem.name}`, 
                    value: windowItem.failEffect, 
                    desc: "Window expired. Penalty applied.", 
                    category: "Needs",
                    icon: <Clock size={14}/>
                });
            };

            const performRest = (type) => {
                let gain = 0;
                let overcharge = 0;
                let removeExh = false;

                switch(type) {
                    case 'floor': gain = Math.floor(Math.random() * 4) + 1; break;
                    case 'dorm': gain = Math.floor(Math.random() * 8) + 1; break;
                    case 'magical': gain = 25; overcharge = 25; break; // Full
                    case 'camper': gain = 25; overcharge = 27; break; // Full + 2
                    case 'cottage': gain = 25; overcharge = 25; break; // + Immunity (Manual)
                    case 'crib': gain = 25; overcharge = 25; removeExh = true; break;
                }

                // Reset mods first for full rests
                if (gain >= 25) setModifiers([]);
                
                setBaseMaturity(prev => {
                    if (gain >= 25) return 20; // Base resets to 20
                    return Math.min(25, prev + gain);
                });

                if (overcharge > 25) {
                    addModifier({ name: "Camper Overcharge", value: 2, desc: "Woke up in Glamorous Nursery", category: "Rest" });
                }

                if (removeExh && trueExhaustion > 0) setTrueExhaustion(t => t - 1);
                
                setShowRestMenu(false);
            };

            const filteredGlossary = GLOSSARY_DB.filter(item => item.category === activeTab);
            const categories = [...new Set(GLOSSARY_DB.map(i => i.category))];

            const CATEGORY_LABELS = {
                'Spells I': 'Nursery Nukes',
                'Spells II': 'Brown Note',
                'Spells III': 'Disciplinary',
                'Spells IV': 'Humiliation',
                'Spells V': 'Environmental',
            };
            const categoryLabel = (cat) => CATEGORY_LABELS[cat] || cat;

            return (
                <div className="flex flex-col md:flex-row h-screen max-h-screen overflow-hidden bg-[#1a120f] font-sans text-amber-100">
                    
                    {/* LEFT: DASHBOARD */}
                    <div className="flex-1 flex flex-col p-4 overflow-y-auto scrollbar-custom relative">
                        <header className="flex justify-between items-center mb-4">
                            <div>
                                <h1 className="cinzel text-2xl text-[#f59e0b] font-bold">SWaT System</h1>
                                <p className="text-[#92400e] text-[15px] uppercase tracking-[0.3em]">Student Welfare & Tracking</p>
                            </div>
                            <button onClick={() => setShowRestMenu(!showRestMenu)} className="flex items-center gap-2 bg-[#b45309] hover:bg-[#d97706] text-black font-bold px-4 py-2 rounded shadow-lg border border-[#fcd34d]">
                                <Bed size={16} /> Take Rest
                            </button>
                        </header>

                        {showRestMenu && (
                            <div className="mb-4 bg-[#0c0806] border border-[#b45309] rounded p-4 grid grid-cols-2 md:grid-cols-3 gap-2 relative z-50 shadow-2xl">
                                <button onClick={() => performRest('floor')} className="p-2 border border-[#451a03] hover:bg-[#2a1d19] text-left">
                                    <div className="font-bold text-amber-500">Standard Bedroll</div>
                                    <div className="text-xs text-amber-700">+1d4 Maturity</div>
                                </button>
                                <button onClick={() => performRest('dorm')} className="p-2 border border-[#451a03] hover:bg-[#2a1d19] text-left">
                                    <div className="font-bold text-amber-500">Dorm Bed</div>
                                    <div className="text-xs text-amber-700">+1d8 Maturity</div>
                                </button>
                                <button onClick={() => performRest('magical')} className="p-2 border border-[#451a03] hover:bg-[#2a1d19] text-left">
                                    <div className="font-bold text-blue-400">Magical Nursery</div>
                                    <div className="text-xs text-blue-700">Full Restore</div>
                                </button>
                                <button onClick={() => performRest('camper')} className="p-2 border border-[#451a03] hover:bg-[#2a1d19] text-left">
                                    <div className="font-bold text-purple-400">Glamorous Camper</div>
                                    <div className="text-xs text-purple-700">Full + 2 Overcharge</div>
                                </button>
                                <button onClick={() => performRest('cottage')} className="p-2 border border-[#451a03] hover:bg-[#2a1d19] text-left">
                                    <div className="font-bold text-green-400">Cozy Cottage</div>
                                    <div className="text-xs text-green-700">Full + Immunity</div>
                                </button>
                                <button onClick={() => performRest('crib')} className="p-2 border border-[#451a03] hover:bg-[#2a1d19] text-left">
                                    <div className="font-bold text-pink-400">Sentient Crib</div>
                                    <div className="text-xs text-pink-700">Full + Remove Exh.</div>
                                </button>
                            </div>
                        )}

                        <div className="flex flex-col md:flex-row gap-6">
                            {/* Gauge Section */}
                            <div className="flex-shrink-0 text-center relative">
                                <TrackerGauge value={totalMaturity} label={currentStatus.label} statusColor={currentStatus.color} trueExhaustion={trueExhaustion} />
                                <div className="flex justify-center gap-10 -mt-6 relative z-10">
                                    <button onClick={() => setBaseMaturity(b => Math.max(0, b-1))} className="gold-circle-btn w-12 h-12 rounded-full flex items-center justify-center"><Minus size={18} /></button>
                                    <button onClick={() => setBaseMaturity(b => Math.min(25, b+1))} className="gold-circle-btn w-12 h-12 rounded-full flex items-center justify-center"><Plus size={18} /></button>
                                </div>
                                
                                {/* True Exhaustion Toggle */}
                                <div className="mt-4 flex items-center justify-center gap-2">
                                    <span className="text-sm text-amber-700 uppercase font-bold">True Exhaustion</span>
                                    <button onClick={() => setTrueExhaustion(Math.max(0, trueExhaustion - 1))} className="gold-circle-btn w-9 h-9 rounded-full flex items-center justify-center"><Minus size={14} /></button>
                                    <span className="text-xl font-bold text-red-400 w-6 text-center">{trueExhaustion}</span>
                                    <button onClick={() => setTrueExhaustion(trueExhaustion + 1)} className="gold-circle-btn w-9 h-9 rounded-full flex items-center justify-center"><Plus size={14} /></button>
                                </div>
                            </div>

                            {/* Right of gauge: Event Log + Current Effects */}
                            <div className="flex-1 grid grid-cols-1 gap-4">
                                <div className="glass-panel p-3 rounded h-72 flex flex-col">
                                    <div className="flex justify-between items-center border-b border-[#78350f] pb-2 mb-2">
                                        <h3 className="cinzel text-[#fcd34d] text-sm">Event Log</h3>
                                        <button onClick={() => {setBaseMaturity(20); setModifiers([]);}} className="text-[15px] text-red-300 border border-red-700 px-2 rounded hover:bg-red-900/30">RESET ALL</button>
                                    </div>
                                    <div className="overflow-y-auto scrollbar-custom flex-1 space-y-1 pr-1">
                                        {modifiers.map(mod => (
                                            <div key={mod.id} className="flex justify-between items-center bg-black/30 p-2 rounded border border-[#451a03]">
                                                <div className="overflow-hidden">
                                                    <div className="text-xs font-bold text-[#fbbf24] truncate">{mod.name}</div>
                                                    <div className="text-[13px] text-[#a16207] truncate">{mod.desc}</div>
                                                </div>
                                                <div className="flex items-center gap-2 pl-2 shrink-0">
                                                    <span className={`font-mono text-xs font-bold ${mod.value > 0 ? 'text-green-500' : 'text-red-500'}`}>
                                                        {mod.value > 0 ? '+' : ''}{mod.value}
                                                    </span>
                                                    <button onClick={() => setModifiers(prev => prev.filter(m => m.id !== mod.id))} className="text-[#78350f] hover:text-red-500"><Trash2 size={12}/></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-panel p-3 rounded h-72 flex flex-col">
                                    <h3 className="cinzel text-[#fcd34d] text-sm border-b border-[#78350f] pb-2 mb-2">Current Effects</h3>
                                    <div className="overflow-y-auto scrollbar-custom flex-1 pr-1">
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                            {activeEffects.map((effect, idx) => (
                                                <div key={idx} className="flex items-start gap-2 p-2 rounded bg-[#0f0907] border border-[#451a03]">
                                                    <AlertCircle size={12} className="text-[#b45309] mt-0.5 shrink-0" />
                                                    <div className="min-w-0">
                                                        <div className="text-[13px] font-bold text-[#d97706] uppercase">{effect.source}</div>
                                                        <div className="text-[15px] text-[#fed7aa] break-words">{effect.text}</div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Windows of Opportunity (moved below Effects; taller) */}
                        <div className="glass-panel p-3 rounded mt-6">
                            <h3 className="cinzel text-[#fcd34d] text-sm mb-2 border-b border-[#78350f] pb-1 flex items-center gap-2">
                                <Clock size={14} /> Windows of Opportunity
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-2 h-96 overflow-y-auto scrollbar-custom">
                                {WINDOWS_OF_OPPORTUNITY.map((win, idx) => (
                                    <WindowItem key={idx} item={win} onFail={handleWindowFail} />
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* RIGHT: LIBRARY */}
                    <div className={`${libraryOpen ? 'w-full md:w-[520px]' : 'w-[56px]'} bg-[#150f0d] border-l border-[#78350f] flex flex-col h-full relative shadow-2xl z-20 transition-all duration-200`}
                         style={!libraryOpen ? { minWidth: 56 } : undefined}>
                        <div className="p-3 bg-[#1a120f] border-b border-[#78350f]">
                            <div className="flex items-center justify-between">
                                <h2 className="cinzel text-lg text-[#fcd34d]">{libraryOpen ? 'Library' : 'L'}</h2>
                                <button
                                    onClick={() => setLibraryOpen(o => !o)}
                                    className="gold-circle-btn w-9 h-9 rounded-full flex items-center justify-center"
                                    title={libraryOpen ? 'Collapse Library' : 'Expand Library'}>
                                    {libraryOpen ? <Minus size={14} /> : <Plus size={14} />}
                                </button>
                            </div>
                            {libraryOpen && <p className="text-[#92400e] text-[13px]">Monsters, Spells & Hazards</p>}
                        </div>

                        {libraryOpen && (
                            <>
                                <div className="flex flex-wrap bg-[#0f0907]">
                                    {categories.map(cat => (
                                        <button key={cat} onClick={() => setActiveTab(cat)} className={`flex-1 min-w-[25%] py-2 text-[13px] font-bold uppercase tracking-wider ${activeTab === cat ? 'tab-active' : 'tab-inactive'}`}>
                                            {categoryLabel(cat)}
                                        </button>
                                    ))}
                                </div>

                                <div className="flex-1 overflow-y-auto scrollbar-custom p-2 space-y-2 bg-[#0c0806]">
                                    {filteredGlossary.map((item, idx) => (
                                        <button key={idx} onClick={() => addModifier(item)} className="w-full text-left group glass-panel p-2 rounded hover:bg-[#2a1d19] hover:border-[#b45309] transition-all relative">
                                            <div className={`absolute left-0 top-0 bottom-0 w-1 ${item.value > 0 ? 'bg-green-600' : 'bg-red-700'}`}></div>
                                            <div className="flex justify-between items-start pl-2">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-[#b45309]">{item.icon}</span>
                                                    <span className="font-bold text-[#fcd34d] text-xs">{item.name}</span>
                                                </div>
                                                <span className={`text-[15px] font-mono px-1.5 rounded border ${item.value > 0 ? 'bg-green-900 text-green-300 border-green-500' : 'bg-fuchsia-950 text-fuchsia-300 border-fuchsia-400'}`}>{item.value}</span>
                                            </div>
                                            {item.dc && <div className="pl-2 mt-0.5"><span className="text-[13px] font-bold bg-[#b45309]/20 text-[#f59e0b] px-1 rounded">{item.dc}</span></div>}
                                            <p className="text-[15px] text-[#a16207] pl-2 mt-1 leading-tight">{item.desc}</p>
                                        </button>
                                    ))}
                                </div>
                            </>
                        )}
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
