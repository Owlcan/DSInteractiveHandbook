<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old War Defense</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --gold: #daac17;
            --gold-light: #fae791;
            --gold-dark: #97740a;
            --parchment: #2C2614;
            --parchment-dark: #1E1C12;
            --ink: #c7a81d;
            --ink2: #8f770d;
            --accent: #b47018;
            --shadow: rgba(0, 0, 0, 0.5);
            --danger: #b91c1c;
            --danger-dark: #7f1d1d;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: var(--parchment-dark);
            background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
            color: var(--ink);
            overflow: hidden;
        }

        #game-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 1rem;
            padding: 1rem;
            width: 100%;
            height: 100vh;
        }

        #canvas-container {
            border: 12px solid var(--gold-dark);
            background-color: var(--parchment);
            background-image: url('src/assets/images/expeditionandgames/towerD/gameboard/gamemap.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 4px 20px var(--shadow);
            position: relative;
        }
        
        #gameCanvas {
            display: block;
        }

        #ui-panel {
            width: 350px;
            background-color: var(--parchment);
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            border: 8px solid var(--gold-dark);
            padding: 1rem;
            color: var(--ink);
            box-shadow: 0 4px 20px var(--shadow);
            height: 95vh;
            overflow-y: auto;
        }

        h1, h2, h3 {
            font-family: 'MedievalSharp', cursive;
            color: var(--accent);
            text-shadow: 1px 1px 2px var(--shadow);
            text-align: center;
        }

        h1 { font-size: 2rem; border-bottom: 2px solid var(--gold); padding-bottom: 0.5rem; margin-bottom: 1rem; }
        h2 { font-size: 1.5rem; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        h3 { font-size: 1.2rem; text-align: left; color: var(--gold-light); }

        .stat-display {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background-color: var(--parchment-dark);
            border: 1px solid var(--gold);
        }
        .stat-display span:first-child { font-family: 'MedievalSharp', cursive; color: var(--gold-light); }

        .tower-button, .action-button {
            width: 100%;
            padding: 0.71rem;
            margin-bottom: 0.5rem;
            border: 2px solid var(--gold-dark);
            background: linear-gradient(to bottom, var(--gold-light), var(--gold));
            color: var(--ink2);
            font-family: 'MedievalSharp', cursive;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        .tower-button:hover, .action-button:hover {
            background: linear-gradient(to bottom, var(--gold), var(--gold-dark));
            color: var(--parchment-dark);
        }
        .tower-button.selected {
             background: linear-gradient(to bottom, var(--accent), var(--gold-dark));
             color: white;
             border-color: var(--gold-light);
        }
        .tower-cost { float: right; }
        .tower-button p, .tower-info p { font-family: 'Cormorant Garamond', serif; font-size: 0.9rem; color: var(--ink2); margin-top: 4px; }
        
        .action-button { text-align: center; font-size: 1.5rem; }
        .action-button.disabled { background: #555; color: #999; cursor: not-allowed; border-color: #444; }
        .action-button.endless-active { background: linear-gradient(to bottom, #059669, #047857); color: white; border-color: #10b981; }

        .mode-button {
            padding: 0.5rem 1rem;
            border: 2px solid var(--gold-dark);
            background: linear-gradient(to bottom, var(--gold-light), var(--gold));
            color: var(--ink2);
            font-family: 'MedievalSharp', cursive;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 6px;
            min-width: 120px;
        }
        .mode-button:hover {
            background: linear-gradient(to bottom, var(--gold), var(--gold-dark));
            color: var(--parchment-dark);
        }
        .mode-button.active {
            background: linear-gradient(to bottom, #059669, #047857);
            color: white;
            border-color: #10b981;
        }

        #tower-info-panel {
            border: 2px dashed var(--gold);
            background: var(--parchment-dark);
            padding: 1rem;
            margin-top: 1rem;
        }
        #tower-info-panel .upgrade-button { background: #166534; border-color: #14532d; color: white; }
        #tower-info-panel .upgrade-button:hover { background: #15803d; }
        #tower-info-panel .sell-button { background: var(--danger); border-color: var(--danger-dark); color: white; }
        #tower-info-panel .sell-button:hover { background: #dc2626; }
        
        .message-log {
            height: 100px;
            background: var(--parchment-dark);
            border: 1px solid var(--gold);
            overflow-y: scroll;
            padding: 0.5rem;
            margin-top: 1rem;
            font-size: 0.8rem;
            color: var(--gold-light);
        }
        .message-log p { margin-bottom: 0.25rem; }
        .wave-announcement { color: var(--accent); font-family: 'MedievalSharp', cursive; }
        .boss-announcement { color: var(--danger); font-family: 'MedievalSharp', cursive; font-size: 1.1em; }
    </style>
</head>
<body>

    <div id="game-container">
        <div style="display: flex; flex-direction: column; align-items: center;">
            <div id="canvas-container">
                <canvas id="gameCanvas"></canvas>
            </div>
            <div style="display: flex; align-items: center; gap: 1rem; margin-top: 12px; width: 1000px; max-width: 100vw;">
                <!-- Essence Counter (Left) -->
                <div style="background: var(--parchment-dark); border: 3px solid var(--gold); color: var(--gold-light); font-family: 'MedievalSharp', cursive; font-size: 1.2rem; box-shadow: 0 2px 8px var(--shadow); border-radius: 8px; padding: 0.5rem 1rem; text-align: center; min-width: 120px;">
                    <div style="font-size: 0.8rem; color: var(--ink2);">ESSENCE</div>
                    <div id="essence-display" style="font-size: 1.4rem; color: var(--gold);">200</div>
                </div>
                
                <!-- Wave Details Box (Center) -->
                <div id="wave-details-box" style="flex: 1; background: var(--parchment-dark); border: 2px solid var(--gold); color: var(--ink2); font-family: 'MedievalSharp', cursive; font-size: 1.1rem; box-shadow: 0 2px 8px var(--shadow); border-radius: 8px; padding: 0.5rem 1rem; min-height: 2.2em; text-align: center; letter-spacing: 0.5px;">
                    <span id="wave-details-text">Wave <span id="wave-display" style="color: var(--gold); font-weight: bold;">0</span> details will appear here.</span>
                </div>
                
                <!-- Lives Counter (Right) -->
                <div style="background: var(--parchment-dark); border: 3px solid var(--danger); color: var(--danger); font-family: 'MedievalSharp', cursive; font-size: 1.2rem; box-shadow: 0 2px 8px var(--shadow); border-radius: 8px; padding: 0.5rem 1rem; text-align: center; min-width: 120px;">
                    <div style="font-size: 0.8rem; color: var(--ink2);">LIVES</div>
                    <div id="lives-display" style="font-size: 1.4rem;">20</div>
                </div>
            </div>
            
            <!-- Game Mode Controls -->
            <div style="display: flex; justify-content: center; gap: 1rem; margin-top: 1rem; flex-wrap: wrap;">
                <button id="hard-mode-button" class="mode-button">Hard Mode</button>
                <button id="chaos-mode-button" class="mode-button">Chaos Mode</button>
            </div>
        </div>
        <div id="ui-panel">
            <h1>Old War Defense</h1>
            
            <button id="start-wave-button" class="action-button">Start Wave</button>
            <button id="queue-wave-button" class="action-button" style="display: none; white-space: nowrap;">Queue&nbsp;Next&nbsp;Wave</button>
            <button id="endless-mode-button" class="action-button">Enable Endless Mode</button>
            <div class="stat-display" id="queue-display" style="display: none;"><span>Queued Waves:</span> <span id="queue-count">0</span></div>

            <h2>Build Defenses</h2>
            <div id="tower-buttons"></div>

            <div id="tower-info-panel" style="display: none;">
                <h3 id="tower-name">Tower Info</h3>
                <p id="tower-level"></p>
                <p id="tower-damage"></p>
                <p id="tower-range"></p>
                <p id="tower-firerate"></p>
                <p id="tower-special"></p>
                <button id="upgrade-button" class="action-button upgrade-button">Upgrade (U)</button>
                <button id="sell-button" class="action-button sell-button">Sell (S)</button>
            </div>

            <!-- Wave Details Box is now shown below the board. Old message-log removed. -->

            <!-- Cheat Console -->
            <div id="cheat-console" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); border: 2px solid #fbbf24; border-radius: 8px; padding: 20px; z-index: 1000;">
                <h3 style="color: #fbbf24; margin: 0 0 10px 0; text-align: center;">CHEAT CONSOLE</h3>
                <input type="text" id="cheat-input" placeholder="Enter cheat code..." style="width: 300px; padding: 8px; font-size: 14px; border: 1px solid #666; background: #222; color: white; border-radius: 4px;">
                <div style="margin-top: 10px; text-align: center;">
                    <button id="cheat-execute" style="background: #16a34a; color: white; border: none; padding: 8px 16px; margin-right: 8px; border-radius: 4px; cursor: pointer;">Execute</button>
                    <button id="cheat-close" style="background: #dc2626; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Close</button>
                </div>
            </div>
        </div>
    </div>

        function generateWave(waveNumber) {
            // Check for recurring Golden Queen waves (every 5 waves after 40)
            if (waveNumber > 40 && (waveNumber - 40) % 5 === 0) {
                return generateGoldenQueenWave(waveNumber);
            }
            
            // Scale factor increases over time
            const scaleFactor = Math.floor((waveNumber - 1) / 40) + 1;
            
            // Get base template (cycles every 40 waves)
            const templateIndex = (waveNumber - 1) % 40;
            const template = WAVE_TEMPLATES[templateIndex];
            
            if (!template) {
                // Fallback for waves beyond templates - include new enemy types
                const enemyTypes = ['titan3', 'summoner', 'frostbringer', 'charger', 'apex', 'ancient', 'void', 'arcane'];
                
                // Add new basic enemy types for higher waves
                if (waveNumber > 50) {
                    enemyTypes.push('darkforgedhorde1', 'darkforgedhorde2', 'darkforgedhorde6', 'darkforgedhorde7', 'darkforgedhordebase');
                    enemyTypes.push('darkforgeddracohorde1', 'darkforgeddracohorde2', 'darkforgeddracohorde4', 'darkforgeddracohorde5');
                    enemyTypes.push('darklingdrillteam1', 'darklingdrillteam2', 'darklingdrillteam3', 'darklingdrillteam4');
                    enemyTypes.push('darklingmob15', 'darklingmob16', 'darklingmob18', 'darklingmob19', 'darklingmob20');
                    enemyTypes.push('darkmidboss6', 'darkmidboss7', 'darkmidboss8', 'darkmidboss9', 'darkmidboss10');
                }
                if (waveNumber > 70) {
                    enemyTypes.push('darkforgedtitan1', 'darkforgedtitan2', 'darkforgedtitan3', 'darkforgedtitan6', 'darkforgedtitan7');
                    enemyTypes.push('hordekeepertitan1', 'hordekeepertitan2', 'hordekeepertitan3', 'hordekeepertitan4', 'hordekeepertitan5');
                    enemyTypes.push('darklingmob21', 'darklingmob22', 'darklingmob24', 'darklingmob25', 'darklingmob26');
                    enemyTypes.push('darkmidboss11', 'darkmidboss12');
                }
                if (waveNumber > 100) {
                    enemyTypes.push('darklingtitanbeast1', 'darklingtitanbeast2', 'darklingtitanbeast3', 'darklingtitanbeast4', 'darklingtitanbeast5', 'darklingtitanbeast6');
                    enemyTypes.push('darkforgedtitan8', 'darkforgedtitan9', 'darkforgedtitan10');
                    enemyTypes.push('darkforgedhorde8', 'darkforgedhorde9', 'darkforgedhorde10');
                    enemyTypes.push('darktitanabomination');
                }
                
                const type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
                const count = Math.floor(5 * scaleFactor);
                return { 
                    enemies: { [type]: count }, 
                    interval: Math.max(20, 60 - Math.floor(scaleFactor * 5)),
                    dragon: waveNumber % 10 === 6
                };
            }
            
            // Scale the wave based on cycle
            const scaledWave = { ...template, enemies: {} };
            
            for (const [enemyType, count] of Object.entries(template.enemies)) {
                // Spread out darkforged hordes to spawn in titan positions
                if (enemyType.startsWith('darkforgedhorde')) {
                    scaledWave.enemies[enemyType] = Math.ceil(count * scaleFactor);
                    scaledWave.titanSpawnHorde = true;
                } else {
                    scaledWave.enemies[enemyType] = Math.ceil(count * scaleFactor);
                }
            }

            // Post-wave 40: Always add flying enemies to ensure air threat presence
            if (waveNumber > 40) {
                // Define flying enemy pools by strength
                const basicFliers = ['flier', 'swarmVesper', 'greaterVesper'];
                const advancedFliers = ['shadowwing', 'stormwing', 'voidreaper', 'nightmare', 'venom', 'spectral'];
                const eliteFliers = ['crimson', 'frost', 'plague', 'ember', 'doomflyer', 'void', 'arcane', 'ancient', 'apex'];
                
                // Choose flier type based on cycle and wave
                let flyerPool, flyerCount;
                const cycleNumber = Math.floor((waveNumber - 1) / 40) + 1;
                
                if (cycleNumber <= 2) {
                    // Cycles 1-2: Mix of basic and advanced fliers
                    flyerPool = Math.random() < 0.6 ? basicFliers : advancedFliers;
                    flyerCount = Math.floor(3 + Math.random() * 5); // 3-7 fliers
                } else if (cycleNumber <= 4) {
                    // Cycles 3-4: Mostly advanced with some elite
                    flyerPool = Math.random() < 0.7 ? advancedFliers : eliteFliers;
                    flyerCount = Math.floor(4 + Math.random() * 6); // 4-9 fliers
                } else {
                    // Cycle 5+: Elite fliers dominate
                    flyerPool = Math.random() < 0.3 ? advancedFliers : eliteFliers;
                    flyerCount = Math.floor(5 + Math.random() * 8); // 5-12 fliers
                }
                
                // Add random fliers to the wave (don't overwrite existing fliers)
                const chosenFlier = flyerPool[Math.floor(Math.random() * flyerPool.length)];
                if (scaledWave.enemies[chosenFlier]) {
                    scaledWave.enemies[chosenFlier] += flyerCount;
                } else {
                    scaledWave.enemies[chosenFlier] = flyerCount;
                }
                
                // 25% chance for a second type of flier for variety
                if (Math.random() < 0.25) {
                    const secondFlier = flyerPool[Math.floor(Math.random() * flyerPool.length)];
                    const secondCount = Math.floor(flyerCount * 0.5); // Smaller secondary group
                    if (scaledWave.enemies[secondFlier]) {
                        scaledWave.enemies[secondFlier] += secondCount;
                    } else {
                        scaledWave.enemies[secondFlier] = secondCount;
                    }
                }
                
                // Add Darkforged Titans (after wave 40)
                const darkforgedTitans = ['darkforgedtitan1', 'darkforgedtitan2', 'darkforgedtitan3', 'darkforgedtitan4', 'darkforgedtitan5'];
                if (Math.random() < 0.6) { // 60% chance for darkforged titans
                    const titanType = darkforgedTitans[Math.floor(Math.random() * darkforgedTitans.length)];
                    const titanCount = Math.floor(1 + Math.random() * 3); // 1-3 darkforged titans
                    scaledWave.enemies[titanType] = (scaledWave.enemies[titanType] || 0) + titanCount;
                }
                
                // Add Hordekeeper Titans (50% chance)
                const hordekeeperTitans = ['hordekeepertitan1', 'hordekeepertitan2', 'hordekeepertitan3'];
                if (Math.random() < 0.5) {
                    const hordekeeperType = hordekeeperTitans[Math.floor(Math.random() * hordekeeperTitans.length)];
                    const hordekeeperCount = Math.floor(1 + Math.random() * 2); // 1-2 hordekeeper titans
                    scaledWave.enemies[hordekeeperType] = (scaledWave.enemies[hordekeeperType] || 0) + hordekeeperCount;
                }
                
                // Add Darkling Titan Beasts (after first Golden Queen defeat - wave 40+)
                const titanBeasts = ['darklingtitanbeast1', 'darklingtitanbeast2', 'darklingtitanbeast3', 'darktitanabomination'];
                if (Math.random() < 0.4) { // 40% chance for titan beasts
                    const beastType = titanBeasts[Math.floor(Math.random() * titanBeasts.length)];
                    const beastCount = beastType === 'darktitanabomination' ? 1 : Math.floor(1 + Math.random() * 3); // 1-3 beasts, only 1 abomination
                    scaledWave.enemies[beastType] = (scaledWave.enemies[beastType] || 0) + beastCount;
                }
            }
            
            // Reduce spawn interval slightly for higher cycles
            scaledWave.interval = Math.max(10, template.interval - Math.floor(scaleFactor * 5));
            
            return scaledWave;
        }
        
        function generateGoldenQueenWave(waveNumber) {
            const queenAppearance = Math.floor((waveNumber - 40) / 5); // 1st, 2nd, 3rd, etc.
            
            // Determine Queen variant based on appearance count - now supports all 7 forms
            let queenType;
            if (queenAppearance === 0) {
                queenType = 'golden_queen_1';
            } else if (queenAppearance === 1) {
                queenType = 'golden_queen_2';
            } else if (queenAppearance === 2) {
                queenType = 'golden_queen_3';
            } else if (queenAppearance === 3) {
                queenType = 'golden_queen_4';
            } else if (queenAppearance === 4) {
                queenType = 'golden_queen_5';
            } else if (queenAppearance === 5) {
                queenType = 'golden_queen_6';
            } else {
                queenType = 'golden_queen_max';
            }
            
            // Create the base wave with the Golden Queen
            const wave = {
                enemies: { [queenType]: 1 },
                interval: 120,
                boss: true,
                goldenQueen: true,
                queenLevel: Math.min(7, queenAppearance + 1), // Updated to support 7 levels
                portals: true
            };
            
            // Add escalating titan escorts
            const titanCount = Math.min(6, Math.floor(queenAppearance / 2) + 2); // 2-6 titans
            if (queenAppearance >= 3) {
                wave.enemies.titan3 = titanCount;
            } else if (queenAppearance >= 1) {
                wave.enemies.titan2 = titanCount;
            } else {
                wave.enemies.titan = titanCount;
            }
            
            // Add escalating flier escorts
            const flierCount = Math.min(12, queenAppearance * 2 + 4); // 4-12 fliers
            const eliteFliers = ['apex', 'ancient', 'void', 'arcane', 'doomflyer'];
            const chosenFlier = eliteFliers[Math.floor(Math.random() * eliteFliers.length)];
            wave.enemies[chosenFlier] = flierCount;
            
            // Add a second type of flier for variety
            const secondFlier = eliteFliers[Math.floor(Math.random() * eliteFliers.length)];
            if (secondFlier !== chosenFlier) {
                wave.enemies[secondFlier] = Math.floor(flierCount * 0.6);
            }
            
            return wave;
        }
        
        function generateChaosWave(waveNumber) {
            // Chaos mode: Only special enemies (titans, titan beasts, hordes, diggers, fliers)
            const wave = { enemies: {}, interval: 60 };
            
            // Define special enemy pools
            const titanPool = ['darkforgedtitan1', 'darkforgedtitan2', 'darkforgedtitan3', 'darkforgedtitan4', 'darkforgedtitan5'];
            const titanBeastPool = ['darklingtitanbeast1', 'darklingtitanbeast2', 'darklingtitanbeast3', 'darklingtitanbeast4', 'darklingtitanbeast5', 'darklingtitanbeast6', 'darktitanabomination'];
            const hordePool = ['darkforgedhorde1', 'darkforgedhorde2', 'darkforgedhorde3', 'darkforgedhorde4', 'darkforgedhorde5'];
            const diggerPool = ['darklingdrillteam1', 'darklingdrillteam2', 'darklingdrillteam3', 'darklingdrillteam4'];
            const flyerPool = ['shadowwing', 'voidreaper', 'doomflyer', 'stormwing', 'nightmare', 'venom', 'spectral', 'crimson', 'frost', 'plague', 'ember', 'void', 'arcane', 'ancient', 'apex'];
            const dracoHordePool = ['darkforgeddracohorde1', 'darkforgeddracohorde2', 'darkforgeddracohorde3'];
            const hordekeeperPool = ['hordekeepertitan1', 'hordekeepertitan2', 'hordekeepertitan3'];
            
            // Scale difficulty with wave number
            const baseCount = Math.max(1, Math.floor(waveNumber / 3));
            
            // Add titans (always present)
            const titanCount = Math.min(6, baseCount + 1);
            for (let i = 0; i < titanCount; i++) {
                const titanType = titanPool[Math.floor(Math.random() * titanPool.length)];
                wave.enemies[titanType] = (wave.enemies[titanType] || 0) + 1;
            }
            
            // Add fliers (75% chance)
            if (Math.random() < 0.75) {
                const flyerCount = Math.min(8, baseCount + 2);
                for (let i = 0; i < flyerCount; i++) {
                    const flyerType = flyerPool[Math.floor(Math.random() * flyerPool.length)];
                    wave.enemies[flyerType] = (wave.enemies[flyerType] || 0) + 1;
                }
            }
            
            // Add hordes (60% chance)
            if (Math.random() < 0.6) {
                const hordeCount = Math.min(4, Math.floor(baseCount / 2) + 1);
                for (let i = 0; i < hordeCount; i++) {
                    const hordeType = hordePool[Math.floor(Math.random() * hordePool.length)];
                    wave.enemies[hordeType] = (wave.enemies[hordeType] || 0) + 1;
                }
            }
            
            // Add diggers (50% chance)
            if (Math.random() < 0.5) {
                const diggerCount = Math.min(3, Math.floor(baseCount / 3) + 1);
                for (let i = 0; i < diggerCount; i++) {
                    const diggerType = diggerPool[Math.floor(Math.random() * diggerPool.length)];
                    wave.enemies[diggerType] = (wave.enemies[diggerType] || 0) + 1;
                }
            }
            
            // Add draco hordes (40% chance)
            if (Math.random() < 0.4) {
                const dracoCount = Math.min(3, Math.floor(baseCount / 4) + 1);
                for (let i = 0; i < dracoCount; i++) {
                    const dracoType = dracoHordePool[Math.floor(Math.random() * dracoHordePool.length)];
                    wave.enemies[dracoType] = (wave.enemies[dracoType] || 0) + 1;
                }
            }
            
            // Add titan beasts (30% chance, higher waves)
            if (waveNumber >= 5 && Math.random() < 0.3) {
                const beastCount = Math.min(2, Math.floor(baseCount / 5) + 1);
                for (let i = 0; i < beastCount; i++) {
                    const beastType = titanBeastPool[Math.floor(Math.random() * titanBeastPool.length)];
                    wave.enemies[beastType] = (wave.enemies[beastType] || 0) + 1;
                }
            }
            
            // Add hordekeeper titans (20% chance, higher waves)
            if (waveNumber >= 8 && Math.random() < 0.2) {
                const hordekeeperType = hordekeeperPool[Math.floor(Math.random() * hordekeeperPool.length)];
                wave.enemies[hordekeeperType] = (wave.enemies[hordekeeperType] || 0) + 1;
            }
            
            // Add dragon mid-boss (every 10 waves)
            if (waveNumber % 10 === 0) {
                wave.dragon = true;
            }
            
            // Golden Queen every 15 waves (starting at wave 15)
            if (waveNumber >= 15 && waveNumber % 15 === 0) {
                wave.goldenQueen = true;
                wave.queenLevel = Math.min(7, Math.floor(waveNumber / 15));
            }
            
            return wave;
        }

        // --- Flying Enemy Spawn System ---
        function getVariedFlyingSpawnPosition() {
            const spawnSides = ['left', 'top', 'bottom'];
            const side = spawnSides[Math.floor(Math.random() * spawnSides.length)];
            
            let x, y, targetY;
            const gateY = canvas.height / 2; // Gate is in the middle of the right side
            const margin = TILE_SIZE; // Spawn margin from screen edge
            
            switch (side) {
                case 'left':
                    x = -margin;
                    y = Math.random() * canvas.height;
                    targetY = gateY + (Math.random() - 0.5) * 100; // Slight variation in gate targeting
                    break;
                    
                case 'top':
                    x = Math.random() * (canvas.width * 0.7); // Don't spawn too close to gate
                    y = -margin;
                    targetY = gateY + (Math.random() - 0.5) * 60;
                    break;
                    
                case 'bottom':
                    x = Math.random() * (canvas.width * 0.7); // Don't spawn too close to gate
                    y = canvas.height + margin;
                    targetY = gateY + (Math.random() - 0.5) * 60;
                    break;
            }
            
            return { x, y, side, targetY };
        }

        // --- Titan/Empress Spawn System ---
        function getVariedTitanSpawnPosition() {
            const spawnPositions = ['center', 'top', 'bottom', 'upper-center', 'lower-center'];
            const position = spawnPositions[Math.floor(Math.random() * spawnPositions.length)];
            
            let x, y;
            const margin = TILE_SIZE; // Spawn margin from screen edge
            
            switch (position) {
                case 'center':
                    x = -margin;
                    y = canvas.height / 2;
                    break;
                    
                case 'top':
                    x = -margin;
                    y = canvas.height * 0.25; // Mid-top position
                    break;
                    
                case 'bottom':
                    x = -margin;
                    y = canvas.height * 0.75; // Mid-bottom position
                    break;
                    
                case 'upper-center':
                    x = -margin;
                    y = canvas.height * 0.375; // Between center and top
                    break;
                    
                case 'lower-center':
                    x = -margin;
                    y = canvas.height * 0.625; // Between center and bottom
                    break;
            }
            
            // Add base variation to the position
            x += (Math.random() - 0.5) * 20; // ±10 pixels horizontal
            y += (Math.random() - 0.5) * 40; // ±20 pixels vertical
            
            return { x, y, position };
        }

        // --- Wave Details Display ---
        function setWaveDetails(text) {
            if (waveDetailsText) waveDetailsText.textContent = text;
        }
        // Example: setWaveDetails('Wave 1: 10 Skitterers, 2 Brutes');
        // Call setWaveDetails() wherever you update wave info.
        // --- Game Classes ---
        class Enemy {
            constructor(type, data = null, spawnPosition = null) {
                // Use provided data or fetch from ENEMY_DATA
                const enemyData = data || ENEMY_DATA[type];
                
                // Default spawn position (path start)
                this.x = path[0].x * TILE_SIZE + TILE_SIZE / 2;
                this.y = path[0].y * TILE_SIZE + TILE_SIZE / 2;
                this.pathIndex = 0;
                
                // Add spacing variation for regular path-following enemies to prevent clustering
                if (!spawnPosition && !enemyData.special && !enemyData.flying) {
                    // Add random offset to prevent bunching (±15 pixels vertically, ±10 pixels horizontally)
                    this.x += (Math.random() - 0.5) * 20;
                    this.y += (Math.random() - 0.5) * 30;
                }
                this.type = type;
                this.hp = enemyData.hp;
                this.maxHp = enemyData.hp;
                this.speed = enemyData.speed;
                this.armor = enemyData.armor;
                this.essence = enemyData.essence;
                this.color = enemyData.color;
                this.flying = enemyData.flying || false;
                this.midBoss = enemyData.midBoss || false;
                this.boss = enemyData.boss || false;
                this.special = enemyData.special;
                this.effects = [];
                this.radius = TILE_SIZE / 2.5;
                // Make darkforged dragon's hitbox bigger to match visual size
                if (this.type === 'darkforgeddragon') {
                    this.radius = TILE_SIZE;
                }
                this.leaked = false;
                this.sprite = enemyData.sprite;
                this.zigzagOffset = 0;
                this.zigzagDirection = 1;
                this.fleeing = false;
                this.slowImmune = enemyData.slowImmune || false;
                this.slowCooldown = 0; // Prevents immediate re-slowing
                
                // Blink effect for late-game enemies (post-wave 40)
                this.canBlink = false; // Will be set based on wave number
                this.isBlinking = false;
                this.blinkTimer = 0;
                this.blinkCooldown = 0;
                this.blinkDuration = 120; // 2 seconds at 60fps
                this.blinkCooldownTime = 600; // 10 second cooldown between blinks
                
                // Portal spawn blink effect (3 seconds)
                this.portalBlinkTimer = 0; // Timer for 3-second blink on portal spawn
                this.portalBlinking = false;
                
                // Golden Queen sparkle and blink effects
                this.isGoldenQueen = type.startsWith('golden_queen');
                this.sparkleTimer = 0; // For golden sparkle effect
                this.sparkleParticles = []; // Array to hold sparkle particles
                
                // Enhanced blink for Golden Queens
                if (this.isGoldenQueen) {
                    this.canBlink = true;
                    this.blinkDuration = 90; // Shorter blink duration (1.5 seconds)
                    this.blinkCooldownTime = 300; // Faster blink cooldown (5 seconds)
                    
                    // Initialize sparkle particles
                    for (let i = 0; i < 12; i++) {
                        this.sparkleParticles.push({
                            angle: (i / 12) * Math.PI * 2,
                            radius: this.radius + 20,
                            life: Math.random() * 60,
                            maxLife: 60,
                            size: 2 + Math.random() * 3
                        });
                    }
                }
                
                // Flying enemy spawn positioning
                this.spawnSide = null; // 'left', 'top', 'bottom'
                this.targetX = canvas.width; // Always aim for the right side (gate)
                this.targetY = canvas.height / 2; // Default target Y position
                
                // Set spawn position for flying enemies
                if (spawnPosition && this.special === 'zigzag') {
                    this.x = spawnPosition.x;
                    this.y = spawnPosition.y;
                    this.spawnSide = spawnPosition.side;
                    this.targetY = spawnPosition.targetY || (canvas.height / 2);
                    
                    // Add spacing variation for flying enemies to prevent clustering
                    const horizontalVariation = (Math.random() - 0.5) * 30; // ±15 pixels
                    const verticalVariation = (Math.random() - 0.5) * 50;   // ±25 pixels
                    
                    this.x += horizontalVariation;
                    this.y += verticalVariation;
                    
                    // Ensure flying enemies stay within reasonable bounds
                    this.y = Math.max(TILE_SIZE, Math.min(canvas.height - TILE_SIZE, this.y));
                }
                
                // Set spawn position for titans and empress
                if (spawnPosition && (this.special === 'titan' || this.special === 'empress' || this.special === 'hordekeepTitan' || this.special === 'titanBeast')) {
                    this.x = spawnPosition.x;
                    this.y = spawnPosition.y;
                    this.spawnPosition = spawnPosition.position;
                    
                    // Add spacing variation for special enemies to prevent clustering
                    // Titans and hordes get wider spacing since they're larger units
                    const horizontalVariation = (Math.random() - 0.5) * 40; // ±20 pixels
                    const verticalVariation = (Math.random() - 0.5) * 60;   // ±30 pixels
                    
                    this.x += horizontalVariation;
                    this.y += verticalVariation;
                    
                    // Ensure we don't spawn off-screen
                    this.y = Math.max(TILE_SIZE, Math.min(canvas.height - TILE_SIZE, this.y));
                }
                
                // Initialize drill team properties
                if (this.special === 'drill') {
                    // Drill teams start underground and move across the field, not the path
                    this.isUnderground = true;
                    this.undergroundTimer = 0;
                    this.surfaceTimer = 0;
                    this.targetSurfaceDistance = (3 + Math.random() * 2) * TILE_SIZE; // 3-5 tile distances
                    this.distanceTraveled = 0;
                    this.drillPhase = Math.random() * Math.PI * 2;
                    
                    // Start at a random position along the left edge with varied spacing
                    this.x = -TILE_SIZE + (Math.random() - 0.5) * 30; // Add horizontal variation
                    this.y = Math.random() * (canvas.height - 2 * TILE_SIZE) + TILE_SIZE;
                    
                    // Add extra vertical spacing for drill teams to prevent clustering
                    const extraVerticalSpacing = (Math.random() - 0.5) * 40;
                    this.y += extraVerticalSpacing;
                    this.y = Math.max(TILE_SIZE, Math.min(canvas.height - TILE_SIZE, this.y));
                    
                    // Pick a random target along the right edge
                    this.targetX = canvas.width + TILE_SIZE;
                    this.targetY = Math.random() * (canvas.height - 2 * TILE_SIZE) + TILE_SIZE;
                    
                    // Calculate movement direction
                    const dx = this.targetX - this.x;
                    const dy = this.targetY - this.y;
                    const distance = Math.hypot(dx, dy);
                    this.moveX = dx / distance;
                    this.moveY = dy / distance;
                }
                
                // Make titans much bigger
                if (this.special === 'titan' || this.special === 'hordekeepTitan') {
                    this.radius = TILE_SIZE * 1.2; // Much larger than normal enemies
                }
                
                // Make titan beasts even bigger than regular titans
                if (this.special === 'titanBeast') {
                    this.radius = TILE_SIZE * 1.8; // Much larger and more imposing
                }
                
                // Make empress even bigger than titans
                if (this.special === 'empress') {
                    this.radius = TILE_SIZE * 1.5; // Largest enemy in the game
                }
                
                if (this.sprite) {
                    this.img = new Image();
                    this.img.src = this.sprite;
                }
            }

            draw() {
                // Don't draw drill teams when they're underground
                if (this.special === 'drill' && this.isUnderground) {
                    // Show subtle underground indicator - small dirt particles
                    ctx.fillStyle = 'rgba(139, 69, 19, 0.6)'; // Brown dirt color
                    for (let i = 0; i < 3; i++) {
                        const offsetX = (Math.sin(this.drillPhase + i) * 8);
                        const offsetY = (Math.cos(this.drillPhase + i) * 8);
                        ctx.beginPath();
                        ctx.arc(this.x + offsetX, this.y + offsetY, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    return; // Don't draw the rest of the enemy
                }
                
                // Set transparency for blinking enemies
                if (this.isBlinking) {
                    ctx.globalAlpha = 0.3; // Semi-transparent during blink
                } else if (this.portalBlinking) {
                    // Rapidly blinking effect for portal spawned enemies
                    const blinkCycle = Math.floor(this.portalBlinkTimer / 10) % 2;
                    ctx.globalAlpha = blinkCycle === 0 ? 0.4 : 1.0;
                }
                
                // Draw enemy sprite or fallback to circle
                if (this.img && this.img.complete) {
                    let size;
                    if (this.type === 'darkforgeddragon') {
                        size = TILE_SIZE * 2.4; // Darkforged dragon is 100% bigger than normal mid-boss
                    } else if (this.special === 'empress') {
                        size = TILE_SIZE * 2.2; // Empress is the largest enemy
                    } else if (this.special === 'titanBeast') {
                        size = TILE_SIZE * 2.0; // Titan beasts are larger than titans
                    } else if (this.special === 'titan' || this.special === 'hordekeepTitan') {
                        size = TILE_SIZE * 1.8; // Titans are much bigger
                    } else if (this.boss) {
                        size = TILE_SIZE * 1.5;
                    } else if (this.midBoss) {
                        size = TILE_SIZE * 1.2;
                    } else {
                        size = TILE_SIZE;
                    }
                    ctx.drawImage(this.img, this.x - size/2, this.y - size/2, size, size);
                } else {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Reset transparency
                if (this.isBlinking || this.portalBlinking) {
                    ctx.globalAlpha = 1.0;
                }
                
                // Draw golden sparkle effect for Golden Queens
                if (this.isGoldenQueen) {
                    this.drawGoldenSparkles();
                }
                
                // Draw drill effect for drill teams
                if (this.special === 'drill') {
                    this.drawDrillEffect();
                }

                // Draw HP bar
                const hpBarWidth = this.radius * 2;
                ctx.fillStyle = '#dc2626';
                ctx.fillRect(this.x - this.radius, this.y - this.radius - 8, hpBarWidth, 5);
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(this.x - this.radius, this.y - this.radius - 8, hpBarWidth * (this.hp / this.maxHp), 5);
                
                // Draw effect indicators
                if (this.effects.some(e => e.type === 'burn')) {
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath();
                    ctx.arc(this.x + this.radius/2, this.y - this.radius/2, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                if (this.effects.some(e => e.type === 'stun')) {
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(this.x - this.radius/2, this.y - this.radius/2, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            drawGoldenSparkles() {
                this.sparkleTimer++;
                
                // Update sparkle particles
                for (let sparkle of this.sparkleParticles) {
                    sparkle.life++;
                    sparkle.angle += 0.05; // Rotate around the queen
                    
                    // Reset sparkle when it expires
                    if (sparkle.life >= sparkle.maxLife) {
                        sparkle.life = 0;
                        sparkle.size = 2 + Math.random() * 3;
                        sparkle.radius = this.radius + 20 + Math.random() * 20;
                    }
                    
                    // Calculate sparkle position
                    const sparkleX = this.x + Math.cos(sparkle.angle) * sparkle.radius;
                    const sparkleY = this.y + Math.sin(sparkle.angle) * sparkle.radius;
                    
                    // Calculate sparkle opacity based on life
                    const lifePercent = sparkle.life / sparkle.maxLife;
                    const alpha = Math.sin(lifePercent * Math.PI) * 0.8; // Fade in and out
                    
                    // Draw sparkle
                    ctx.save();
                    ctx.globalAlpha = alpha;
                    
                    // Create radial gradient for sparkle
                    const gradient = ctx.createRadialGradient(sparkleX, sparkleY, 0, sparkleX, sparkleY, sparkle.size);
                    gradient.addColorStop(0, '#ffffff');
                    gradient.addColorStop(0.5, '#fbbf24');
                    gradient.addColorStop(1, 'rgba(251, 191, 36, 0)');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(sparkleX, sparkleY, sparkle.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Add inner bright core
                    ctx.globalAlpha = alpha * 1.5;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(sparkleX, sparkleY, sparkle.size * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.restore();
                }
                
                // Draw radiant aura around Golden Queen
                const pulseIntensity = 0.3 + Math.sin(this.sparkleTimer * 0.1) * 0.2;
                ctx.save();
                ctx.globalAlpha = pulseIntensity;
                
                const auraGradient = ctx.createRadialGradient(this.x, this.y, this.radius, this.x, this.y, this.radius * 2.5);
                auraGradient.addColorStop(0, 'rgba(251, 191, 36, 0)');
                auraGradient.addColorStop(0.6, 'rgba(251, 191, 36, 0.3)');
                auraGradient.addColorStop(1, 'rgba(251, 191, 36, 0)');
                
                ctx.fillStyle = auraGradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius * 2.5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
            
            drawDrillEffect() {
                // Only draw drill effects when surfaced
                if (this.isUnderground) return;
                
                // Draw rotating drill sparks around drill teams when surfaced
                const sparkCount = 6; // More sparks when surfaced
                const currentTime = Date.now() * 0.01;
                
                for (let i = 0; i < sparkCount; i++) {
                    const angle = (this.drillPhase + (i * Math.PI * 2 / sparkCount)) % (Math.PI * 2);
                    const sparkX = this.x + Math.cos(angle) * (this.radius + 8);
                    const sparkY = this.y + Math.sin(angle) * (this.radius + 8);
                    
                    // Draw intense drill sparks when surfaced
                    ctx.save();
                    ctx.globalAlpha = 0.8;
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath();
                    ctx.arc(sparkX, sparkY, 3, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Add inner bright core
                    ctx.globalAlpha = 1.0;
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(sparkX, sparkY, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.restore();
                }
                
                // Draw dirt/debris particles flying around when surfaced
                for (let i = 0; i < 8; i++) {
                    const angle = (this.drillPhase * 0.7 + (i * Math.PI * 2 / 8)) % (Math.PI * 2);
                    const debrisX = this.x + Math.cos(angle) * (this.radius + 12);
                    const debrisY = this.y + Math.sin(angle) * (this.radius + 12);
                    
                    ctx.save();
                    ctx.globalAlpha = 0.6;
                    ctx.fillStyle = '#8b4513'; // Brown debris
                    ctx.beginPath();
                    ctx.arc(debrisX, debrisY, 1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            update() {
                // Handle portal blink effect
                if (this.portalBlinking) {
                    this.portalBlinkTimer--;
                    if (this.portalBlinkTimer <= 0) {
                        this.portalBlinking = false;
                    }
                }
                
                // Handle blink ability for late-game enemies
                if (this.canBlink) {
                    // Reduce blink cooldown
                    this.blinkCooldown = Math.max(0, this.blinkCooldown - 1);
                    
                    // Check if we should activate blink (random chance when not on cooldown)
                    if (!this.isBlinking && this.blinkCooldown === 0 && Math.random() < 0.008) {
                        this.isBlinking = true;
                        this.blinkTimer = this.blinkDuration;
                        particles.push({
                            x: this.x, y: this.y, life: 30, radius: this.radius * 1.5,
                            color: '#a855f7', type: 'blink'
                        });
                    }
                    
                    // Handle active blink
                    if (this.isBlinking) {
                        this.blinkTimer--;
                        if (this.blinkTimer <= 0) {
                            this.isBlinking = false;
                            this.blinkCooldown = this.blinkCooldownTime;
                            particles.push({
                                x: this.x, y: this.y, life: 20, radius: this.radius,
                                color: '#06b6d4', type: 'blink'
                            });
                        }
                    }
                }
                
                // Handle status effects
                let currentSpeed = this.speed;
                let isStunned = false;
                
                // Reduce slow cooldown
                this.slowCooldown = Math.max(0, this.slowCooldown - 1);
                
                this.effects = this.effects.filter(effect => {
                    // Titans and titan beasts are immune to slow effects (except from frost wizard)
                    if (effect.type === 'slow' && (this.special === 'titan' || this.special === 'hordekeepTitan' || this.special === 'titanBeast') && effect.source !== 'frostWizard') {
                        // Ignore the slow effect
                        return false;
                    } else if (effect.type === 'slow' && this.special !== 'titan' && this.special !== 'hordekeepTitan' && this.special !== 'titanBeast' && this.special !== 'empress') {
                        currentSpeed *= effect.value;
                    } else if (effect.type === 'slow' && (this.special === 'titan' || this.special === 'hordekeepTitan' || this.special === 'titanBeast') && effect.source === 'frostWizard') {
                        // Only frost wizard can slow titans and titan beasts
                        currentSpeed *= effect.value;
                    } else if (effect.type === 'slow' && this.special === 'empress') {
                        // Empress has 50% chance to ignore movement debuffs
                        if (Math.random() < 0.5) {
                            currentSpeed *= effect.value;
                        } else {
                            // Visual effect when empress resists
                            particles.push({
                                type: 'resist',
                                x: this.x + (Math.random() - 0.5) * 40,
                                y: this.y + (Math.random() - 0.5) * 40,
                                vx: (Math.random() - 0.5) * 2,
                                vy: (Math.random() - 0.5) * 2,
                                life: 20,
                                color: '#8b5cf6'
                            });
                        }
                    } else if (effect.type === 'burn') {
                        this.hp -= effect.damage;
                    } else if (effect.type === 'stun' && this.special !== 'titan' && this.special !== 'hordekeepTitan' && this.special !== 'titanBeast' && this.special !== 'empress') {
                        // Titans, titan beasts and empress are immune to stun
                        isStunned = true;
                    }
                    effect.duration--;
                    
                    // When slow effect ends, set cooldown
                    if (effect.type === 'slow' && effect.duration <= 0) {
                        this.slowCooldown = 300; // 5 second cooldown at 60fps
                    }
                    
                    return effect.duration > 0;
                });

                // Don't move if stunned
                if (isStunned) {
                    this.draw();
                    return;
                }

                // Handle special abilities
                this.handleSpecialAbilities();

                // Special movement for different enemy types
                if (this.special === 'zigzag' && this.midBoss) {
                    this.updateDragonMovement(currentSpeed);
                } else if (this.special === 'zigzag') {
                    this.updateZigzagMovement(currentSpeed);
                } else if (this.special === 'drill') {
                    this.updateDrillMovement(currentSpeed);
                } else if (this.special === 'hordekeepTitan') {
                    this.updateHordekeeperTitanMovement(currentSpeed);
                } else if (this.special === 'titan') {
                    this.updateTitanMovement(currentSpeed);
                } else if (this.special === 'titanBeast') {
                    this.updateTitanBeastMovement(currentSpeed);
                } else if (this.special === 'empress') {
                    this.updateEmpressMovement(currentSpeed);
                } else {
                    this.updateNormalMovement(currentSpeed);
                }

                this.draw();
            }
            
            handleSpecialAbilities() {
                // Handle passive aura effects - placeholder for future abilities
            }
            
            updateDragonMovement(currentSpeed) {
                // Dragons fly in zigzag pattern across screen with more complex movement
                if (!this.fleeing) {
                    const gateX = canvas.width;
                    const gateY = this.targetY;
                    
                    if (this.spawnSide === 'left' || !this.spawnSide) {
                        // Traditional left-to-right dragon movement
                        this.x += currentSpeed;
                        this.zigzagOffset += this.zigzagDirection * 2;
                        
                        const maxOffset = 60; // Dragons have wider zigzag
                        if (Math.abs(this.zigzagOffset) > maxOffset) {
                            this.zigzagDirection *= -1;
                        }
                        this.y = this.targetY + this.zigzagOffset;
                        
                    } else {
                        // Dragons from top/bottom move diagonally with large sweeping motions
                        const angle = Math.atan2(gateY - this.y, gateX - this.x);
                        this.x += Math.cos(angle) * currentSpeed;
                        this.y += Math.sin(angle) * currentSpeed;
                        
                        // Large sweeping zigzag for dragons
                        this.zigzagOffset += this.zigzagDirection * 2.5;
                        const maxOffset = 80;
                        if (Math.abs(this.zigzagOffset) > maxOffset) {
                            this.zigzagDirection *= -1;
                        }
                        // Apply zigzag perpendicular to direction of travel
                        const perpAngle = angle + Math.PI / 2;
                        this.x += Math.cos(perpAngle) * this.zigzagOffset * 0.4;
                        this.y += Math.sin(perpAngle) * this.zigzagOffset * 0.4;
                    }
                    
                    // Check if enemy reaches halfway point and has lost 50% health (only for mid-bosses)
                    if (this.midBoss && this.x > canvas.width / 2 && this.hp <= this.maxHp / 2) {
                        this.fleeing = true;
                    }
                    
                    // If enemy reaches right side without being defeated
                    if (this.x > canvas.width) {
                        this.hp = 0; // Mark for removal without life loss
                        if (this.midBoss) {
                            logMessage("The dragon escapes! Next wave begins.");
                        }
                    }
                } else {
                    // Enemy is fleeing - move toward right edge faster
                    this.x += currentSpeed * 2;
                    if (this.x > canvas.width) {
                        this.hp = 0;
                        if (this.midBoss) {
                            logMessage("The dragon escapes! Next wave begins.");
                        }
                    }
                }
            }
            
            updateZigzagMovement(currentSpeed) {
                // Flying enemies move toward gate with varied movement patterns based on spawn side
                const gateX = canvas.width;
                const gateY = this.targetY;
                
                if (this.spawnSide === 'left') {
                    // Traditional left-to-right movement with zigzag
                    this.x += currentSpeed;
                    this.zigzagOffset += this.zigzagDirection * 2;
                    
                    const maxOffset = 40;
                    if (Math.abs(this.zigzagOffset) > maxOffset) {
                        this.zigzagDirection *= -1;
                    }
                    this.y = this.targetY + this.zigzagOffset;
                    
                } else if (this.spawnSide === 'top') {
                    // Diagonal movement from top toward gate
                    const angle = Math.atan2(gateY - this.y, gateX - this.x);
                    this.x += Math.cos(angle) * currentSpeed;
                    this.y += Math.sin(angle) * currentSpeed;
                    
                    // Add some weaving motion
                    this.zigzagOffset += this.zigzagDirection * 1.5;
                    const maxOffset = 30;
                    if (Math.abs(this.zigzagOffset) > maxOffset) {
                        this.zigzagDirection *= -1;
                    }
                    // Apply zigzag perpendicular to direction of travel
                    const perpAngle = angle + Math.PI / 2;
                    this.x += Math.cos(perpAngle) * this.zigzagOffset * 0.3;
                    this.y += Math.sin(perpAngle) * this.zigzagOffset * 0.3;
                    
                } else if (this.spawnSide === 'bottom') {
                    // Diagonal movement from bottom toward gate
                    const angle = Math.atan2(gateY - this.y, gateX - this.x);
                    this.x += Math.cos(angle) * currentSpeed;
                    this.y += Math.sin(angle) * currentSpeed;
                    
                    // Add some weaving motion
                    this.zigzagOffset += this.zigzagDirection * 1.5;
                    const maxOffset = 30;
                    if (Math.abs(this.zigzagOffset) > maxOffset) {
                        this.zigzagDirection *= -1;
                    }
                    // Apply zigzag perpendicular to direction of travel
                    const perpAngle = angle + Math.PI / 2;
                    this.x += Math.cos(perpAngle) * this.zigzagOffset * 0.3;
                    this.y += Math.sin(perpAngle) * this.zigzagOffset * 0.3;
                }
                
                // If enemy reaches right side or gets close to gate
                if (this.x > canvas.width || 
                    (this.x > canvas.width - TILE_SIZE && Math.abs(this.y - gateY) < TILE_SIZE)) {
                    this.hp = 0; // Mark for removal without life loss
                }
            }
            
            updateDrillMovement(currentSpeed) {
                // Drill teams move underground across the field, not following the path
                const drillSpeed = currentSpeed * 1.2; // Move faster underground
                
                if (this.isUnderground) {
                    // Move underground towards target
                    this.x += this.moveX * drillSpeed;
                    this.y += this.moveY * drillSpeed;
                    
                    this.distanceTraveled += drillSpeed;
                    this.drillPhase += 0.2; // Slower rotation while underground
                    
                    // Check if we should surface
                    if (this.distanceTraveled >= this.targetSurfaceDistance) {
                        this.isUnderground = false;
                        this.surfaceTimer = 120; // Surface for 2 seconds (60 fps * 2)
                        this.undergroundTimer = 0;
                        this.distanceTraveled = 0;
                        this.targetSurfaceDistance = (3 + Math.random() * 2) * TILE_SIZE; // Next surface distance
                    }
                } else {
                    // Surfaced - move slower and be vulnerable
                    this.x += this.moveX * drillSpeed * 0.5; // Move slower when surfaced
                    this.y += this.moveY * drillSpeed * 0.5;
                    
                    this.surfaceTimer--;
                    this.drillPhase += 0.4; // Faster rotation when surfaced
                    
                    // Check if we should go underground again
                    if (this.surfaceTimer <= 0) {
                        this.isUnderground = true;
                        this.undergroundTimer = 0;
                    }
                }
                
                // Check if we've reached the right edge (exit point)
                if (this.x >= canvas.width + TILE_SIZE) {
                    lives--;
                    this.hp = 0;
                    this.leaked = true;
                }
            }
            
            updateHordekeeperTitanMovement(currentSpeed) {
                // Hordekeeper Titans march straight like titans but spawn reinforcements
                this.x += currentSpeed;
                
                // Spawn horde reinforcements every 3 seconds
                if (!this.hordeSpawnTimer) this.hordeSpawnTimer = 0;
                this.hordeSpawnTimer++;
                
                if (this.hordeSpawnTimer >= 180 && this.x < canvas.width - 100) { // 3 seconds at 60fps
                    this.spawnHordeReinforcements();
                    this.hordeSpawnTimer = 0;
                }
                
                // If hordekeeper titan reaches right side (school gates)
                if (this.x > canvas.width) {
                    lives -= 3; // Same damage as regular titans
                    this.hp = 0;
                    this.leaked = true;
                    logMessage(`${this.type.toUpperCase()} HORDE OVERRAN THE GATES! -3 Lives`, 'boss-announcement');
                }
            }
            
            spawnHordeReinforcements() {
                // Spawn 2-3 darkforged horde units near the hordekeeper
                const numSpawns = Math.floor(Math.random() * 2) + 2; // 2-3 units
                const hordeTypes = ['darkforgedhorde1', 'darkforgedhorde2', 'darkforgedhorde3', 'darkforgedhorde4', 'darkforgedhorde5'];
                
                for (let i = 0; i < numSpawns; i++) {
                    const hordeType = hordeTypes[Math.floor(Math.random() * hordeTypes.length)];
                    const hordeData = ENEMY_DATA[hordeType];
                    
                    if (hordeData) {
                        // Much more varied spawn positions to prevent clustering
                        const baseSpawnX = this.x - 50 - (i * 25); // More horizontal separation
                        const baseSpawnY = this.y;
                        
                        // Add significant random variation to both axes
                        const spawnX = baseSpawnX + (Math.random() - 0.5) * 60; // ±30 pixels horizontal
                        const spawnY = baseSpawnY + (Math.random() - 0.5) * 80; // ±40 pixels vertical
                        
                        const hordeUnit = new Enemy(hordeType, hordeData, null);
                        hordeUnit.x = spawnX;
                        hordeUnit.y = Math.max(TILE_SIZE, Math.min(canvas.height - TILE_SIZE, spawnY)); // Keep on screen
                        hordeUnit.pathIndex = Math.max(0, this.pathIndex - 1); // Start slightly behind in path
                        
                        enemies.push(hordeUnit);
                        
                        // Visual effect for spawning
                        particles.push({
                            x: spawnX, y: hordeUnit.y, life: 40, radius: 15,
                            color: '#4c1d95', type: 'spawn'
                        });
                    }
                }
                
                logMessage(`Hordekeeper spawns reinforcements!`, 'ability');
            }

            updateTitanMovement(currentSpeed) {
                // Titans march straight forward, ignoring the path
                this.x += currentSpeed;
                
                // If titan reaches right side (school gates)
                if (this.x > canvas.width) {
                    lives -= 3; // Titans cause more damage when they reach the end
                    this.hp = 0;
                    this.leaked = true;
                    logMessage(`${this.type.toUpperCase()} BREACHED THE GATES! -3 Lives`, 'boss-announcement');
                }
            }
            
            updateTitanBeastMovement(currentSpeed) {
                // Titan Beasts move straight and menacingly toward the gate - no zigzag
                console.log('Titan Beast moving straight:', this.type, this.x, this.y);
                this.x += currentSpeed;
                
                // If titan beast reaches right side (school gates)
                if (this.x > canvas.width) {
                    lives -= 4; // Titan Beasts cause even more damage
                    this.hp = 0;
                    this.leaked = true;
                    logMessage(`💀 ${this.type.toUpperCase()} DEVASTATED THE GATES! -4 Lives 💀`, 'boss-announcement');
                }
            }
            
            updateEmpressMovement(currentSpeed) {
                // Empress moves like a titan but faster and more menacingly
                this.x += currentSpeed;
                
                // Add slight vertical menacing movement (much less than flying enemies)
                this.zigzagOffset += this.zigzagDirection * 0.2; // Reduced from 0.5
                const maxOffset = 10; // Reduced from 20
                if (Math.abs(this.zigzagOffset) > maxOffset) {
                    this.zigzagDirection *= -1;
                }
                this.y += this.zigzagOffset * 0.1; // Reduced from 0.3
                
                // Keep empress more grounded to her spawn lane
                const centerY = canvas.height / 2;
                if (this.spawnPosition === 'top') {
                    const targetY = centerY - 60;
                    this.y = Math.max(targetY - 15, Math.min(targetY + 15, this.y));
                } else if (this.spawnPosition === 'bottom') {
                    const targetY = centerY + 60;
                    this.y = Math.max(targetY - 15, Math.min(targetY + 15, this.y));
                } else {
                    // Center spawn - keep near center
                    this.y = Math.max(centerY - 20, Math.min(centerY + 20, this.y));
                }
                
                // If empress reaches right side (school gates)
                if (this.x > canvas.width) {
                    lives -= 5; // Empress causes even more damage when she reaches the end
                    this.hp = 0;
                    this.leaked = true;
                    
                    if (this.isGoldenQueen) {
                        logMessage(`💀 THE GOLDEN QUEEN BREACHED THE GATES! -5 Lives 💀`, 'boss-announcement');
                    } else {
                        logMessage(`THE SHADOW EMPRESS BREACHED THE GATES! -5 Lives`, 'boss-announcement');
                    }
                }
            }
            
            updateNormalMovement(currentSpeed) {
                if (this.pathIndex < path.length - 1) {
                    const target = path[this.pathIndex + 1];
                    const targetX = target.x * TILE_SIZE + TILE_SIZE / 2;
                    const targetY = target.y * TILE_SIZE + TILE_SIZE / 2;
                    const angle = Math.atan2(targetY - this.y, targetX - this.x);
                    this.x += Math.cos(angle) * currentSpeed;
                    this.y += Math.sin(angle) * currentSpeed;

                    if (Math.hypot(targetX - this.x, targetY - this.y) < currentSpeed) {
                        this.pathIndex++;
                    }
                } else {
                    // Reached the end
                    lives--;
                    this.hp = 0;
                    this.leaked = true;
                }
            }

            takeDamage(amount, type = 'physical', source = null) {
                // Champion damage bypasses all resistances and immunities
                if (type === 'champion') {
                    this.hp -= amount;
                    this.handleSpecialDamageReactions(amount, type);
                    return;
                }
                
                // Blinking enemies are invulnerable (except to champions)
                if (this.isBlinking) {
                    particles.push({
                        x: this.x, y: this.y - 20, life: 30, radius: 5,
                        color: '#fbbf24', type: 'immune'
                    });
                    return;
                }
                
                // Dragons can't be hit by melee attacks (monks), except champions
                if (this.special === 'zigzag' && type === 'melee') {
                    return;
                }
                
                const reduction = type === 'physical' ? this.armor : 0;
                const actualDamage = Math.max(1, amount - reduction);
                this.hp -= actualDamage;
                
                this.handleSpecialDamageReactions(actualDamage, type);
            }
            
            handleSpecialDamageReactions(damage, type) {
                // Draco Horde - Breathes fire when damaged
                if (this.type.includes('darkforgedhorde') && Math.random() < 0.3) {
                    this.breatheFire();
                }
                
                // Drill Team - Creates drilling sparks when damaged
                if (this.type.includes('darklingdrillteam') && Math.random() < 0.4) {
                    this.createDrillSparks();
                }
                
                // Dark Titan Abomination - Creates dark explosion when damaged
                if (this.type === 'darktitanabomination' && Math.random() < 0.15) {
                    this.createDarkExplosion();
                }
            }
            
            breatheFire() {
                // Create fire projectiles that temporarily disable nearby towers
                const fireCount = 6;
                for (let i = 0; i < fireCount; i++) {
                    const angle = (Math.PI * 2 * i) / fireCount;
                    const fireX = this.x + Math.cos(angle) * 20;
                    const fireY = this.y + Math.sin(angle) * 20;
                    
                    // Find towers within fire breath range and disable them temporarily
                    for (const tower of towers) {
                        const dist = Math.hypot(tower.x + TILE_SIZE/2 - fireX, tower.y + TILE_SIZE/2 - fireY);
                        if (dist < 80) {
                            // Check immunity to disable effects
                            if (!tower.isImmuneToDisable()) {
                                // Disable tower for 3 seconds by setting a long cooldown
                                tower.fireCooldown = Math.max(tower.fireCooldown, 180); // 3 seconds at 60fps
                                
                                // Visual effect on affected tower
                                particles.push({
                                    type: 'tower_disable',
                                    x: tower.x + TILE_SIZE/2,
                                    y: tower.y + TILE_SIZE/2,
                                    life: 180,
                                    color: '#dc2626'
                                });
                            } else {
                                // Show immunity effect for immune towers
                                particles.push({
                                    type: 'immune',
                                    x: tower.x + TILE_SIZE/2,
                                    y: tower.y + TILE_SIZE/2 - 20,
                                    life: 30,
                                    color: '#fbbf24'
                                });
                            }
                        }
                    }
                    
                    particles.push({
                        type: 'fire',
                        x: fireX,
                        y: fireY,
                        vx: Math.cos(angle) * 3,
                        vy: Math.sin(angle) * 3,
                        life: 30,
                        color: '#f97316'
                    });
                }
                
                logMessage(`Fire breath disables nearby towers!`, 'ability');
            }
            
            burrowDown() {
                this.burrowed = true;
                this.speed *= 1.5; // Move faster while burrowed
                this.color = '#374151'; // Darker color while burrowed
                
                // Become harder to hit
                this.armor += 5;
                
                particles.push({
                    type: 'dust',
                    x: this.x,
                    y: this.y,
                    radius: 30,
                    life: 25,
                    color: '#8b5cf6'
                });
                
                // Emerge after 5 seconds
                setTimeout(() => {
                    if (this.hp > 0) {
                        this.burrowed = false;
                        this.speed /= 1.5;
                        this.armor -= 5;
                        this.color = ENEMY_DATA[this.type].color;
                        
                        particles.push({
                            type: 'emergence',
                            x: this.x,
                            y: this.y,
                            radius: 35,
                            life: 20,
                            color: '#06b6d4'
                        });
                    }
                }, 5000);
            }
            
            createDrillSparks() {
                // Create drilling sparks when drill teams are damaged
                const sparkCount = 8;
                for (let i = 0; i < sparkCount; i++) {
                    const angle = (Math.PI * 2 * i) / sparkCount;
                    const sparkVx = Math.cos(angle) * 4;
                    const sparkVy = Math.sin(angle) * 4;
                    
                    particles.push({
                        type: 'drill_spark',
                        x: this.x + Math.cos(angle) * 10,
                        y: this.y + Math.sin(angle) * 10,
                        vx: sparkVx,
                        vy: sparkVy,
                        life: 20,
                        color: '#f97316'
                    });
                }
            }
            
            createDarkExplosion() {
                // Dark Titan Abomination creates area denial and temporarily weakens nearby towers
                const explosionRadius = 80;
                
                // Temporarily reduce damage of nearby towers
                for (const tower of towers) {
                    const dist = Math.hypot(tower.x + TILE_SIZE/2 - this.x, tower.y + TILE_SIZE/2 - this.y);
                    if (dist < explosionRadius) {
                        // Check immunity to curse effects
                        if (!tower.isImmuneToCurse()) {
                            // Mark tower as weakened for 5 seconds
                            tower.darkCursed = true;
                            tower.darkCurseTimer = 300; // 5 seconds at 60fps
                            
                            // Visual effect on cursed tower
                            particles.push({
                                type: 'dark_curse',
                                x: tower.x + TILE_SIZE/2,
                                y: tower.y + TILE_SIZE/2,
                                life: 300,
                                color: '#4c1d95'
                            });
                        } else {
                            // Show immunity effect for immune towers
                            particles.push({
                                type: 'immune',
                                x: tower.x + TILE_SIZE/2,
                                y: tower.y + TILE_SIZE/2 - 20,
                                life: 30,
                                color: '#fbbf24'
                            });
                        }
                    }
                }
                
                // Create dark explosion particles
                for (let i = 0; i < 12; i++) {
                    const angle = (Math.PI * 2 * i) / 12;
                    particles.push({
                        type: 'dark_explosion',
                        x: this.x + Math.cos(angle) * 30,
                        y: this.y + Math.sin(angle) * 30,
                        vx: Math.cos(angle) * 6,
                        vy: Math.sin(angle) * 6,
                        life: 40,
                        color: '#0c0a09'
                    });
                }
                
                logMessage(`Dark Titan curses nearby towers with weakness!`, 'boss-announcement');
            }

            getEssenceReward() {
                let baseReward = Math.max(5, Math.ceil(this.essence * 3));
                // Bonus for defeating dragons before they flee
                if (this.midBoss && this.special === 'zigzag') {
                    baseReward *= 2;
                }
                // Golden Queens provide escalating bonus essence
                if (this.isGoldenQueen) {
                    baseReward *= 3; // Triple essence for Golden Queens
                }
                // Reduce overall essence gain by 2%
                return Math.floor(baseReward * 0.98);
            }
            
            addEffect(effect) {
                // Champion effects bypass all resistances and immunities
