    { title: "Changebot's Identity Crisis", description: "A Dark Dimension Changebot rapidly cycles through different forms, each time asking the party 'Who am I?' It seems to be suffering from a severe malfunction.<br><br><b>Forms Cycle:</b> Roll 1d6 every round - 1: Student (asks about homework), 2: Professor (lectures on etiquette), 3: Darkforged Remnant (threatens), 4: Academy Staff (offers help), 5: Wild Animal (acts confused), 6: Party Member (mimics poorly).<br><br><b>Quest:</b> Help stabilize its identity. DC 15 Intelligence (Arcana) to understand the malfunction, DC 13 Charisma (Persuasion) to talk it through each form, or use <b>Chronal Crystal</b> to reset its memory core. Success grants a <b>Changebot Memory Core</b> (can store one spell for later use).", isCombat: false },
    { title: "Elemental's Fountain", description: "A Bottle Elemental has created a magical fountain that produces different types of formula and baby food. It trades these supplies for interesting bottles to add to its collection.<br><br><b>Available Trades:</b> The elemental offers: <b>Sunpetal Honey Formula</b> (1d4 HP restoration), <b>Moonpetal Sleep Formula</b> (cures insomnia), <b>Berrimater Puree</b> (removes 1 level exhaustion), <b>Chronal Crystal Elixir</b> (slows aging by 1 day), <b>Barkgum Milk</b> (advantage on next Charisma check).<br><br><b>Desired Items:</b> Antique bottles, magical containers, spell component pouches, alchemical vials, rare drinking vessels, Academy milk bottles, or any container with interesting magical properties. The elemental judges value based on craftsmanship, age, and magical resonance.", isCombat: false },
    { title: "Ticklefinger's Game", description: "A Darkling-Ticklefinger playfully darts between trees, trying to engage the party in a game of tag. It's not hostile but becomes increasingly persistent if ignored.<br><br><b>Game Rules:</b> The Ticklefinger will attempt to 'tag' each party member with a playful poke. Make opposed Dexterity checks - if the Ticklefinger wins, it giggles and moves to the next target. If a party member wins, they're 'it' and must try to tag the Ticklefinger.<br><br><b>Escalation:</b> If completely ignored, it summons 1d4 more Ticklefingers after 10 minutes. If played with for 3 rounds, it rewards the party with knowledge of a hidden path (+2 to next Survival check in this forest) and disappears with happy chittering.", isCombat: false },
    { title: "Plushie Gathering", description: "Multiple Lost Plushies have congregated in a forest clearing, sitting in a circle as if holding a meeting. They stop and stare when the party approaches.<br><br><b>The Meeting:</b> The plushies are sharing memories of their lost owners. DC 14 Wisdom (Insight) reveals they're trying to remember how to find their way home. DC 16 Intelligence (Investigation) shows they're arranged by the dormitory their owners lived in.<br><br><b>Quest:</b> Help them find peace. DC 15 Charisma (Persuasion) to comfort them, or DC 17 Intelligence (History) to identify their original owners from Academy records. Success causes them to fade peacefully, leaving behind a <b>Memory Locket</b> (shows glimpses of Academy life from decades past).", isCombat: false },
    { title: "Auditarch's Tribunal", description: "A Dark Dimension Auditarch has set up a makeshift tribunal in a forest clearing, complete with shadowy witnesses. It demands the party answer for their 'crimes' against proper procedure.<br><br><b>The Charges:</b> Roll 1d6 - 1: Improper walking formation, 2: Unauthorized forest entry, 3: Disrupting the peace, 4: Failure to file proper travel documents, 5: Excessive noise violations, 6: Disturbing Academy property.<br><br><b>Trial Mechanics:</b> Each party member must make a DC 15 Charisma (Persuasion), Intelligence (Investigation), or Wisdom (Insight) check to defend themselves. Success on 2+ checks results in 'acquittal' and the Auditarch grudgingly allows passage. Total failure results in combat as the Auditarch attempts to arrest the party.", isCombat: true },

    // NEW ENHANCED EVENTS
    { title: "The Bottle Beast's Hoard Negotiation", description: "A Primordial Bottle Beast has collected a massive pile of discarded bottles and baby items. It guards this hoard jealously but might be willing to negotiate.<br><br><b>Hoard Contents:</b> 2d6 various bottles, 1d4 Academy diapers, 1d3 formula containers, and a 25% chance of containing a <b>Rare Vintage Bottle</b> (worth 50gp).<br><br><b>Negotiation:</b> DC 16 Charisma (Persuasion) to open dialogue, then offer items from this list: Fresh bottles, baby toys, shiny objects, or Academy-branded items. Success allows trading for 1d3 items from the hoard without combat.", isCombat: false },
    { title: "The Pacifier Golem's Patrol Protocol", description: "A Pacifier Golem methodically patrols a section of forest, checking on various 'nursery stations' it has established. It becomes aggressive if these areas are disturbed.<br><br><b>Patrol Route:</b> The golem visits 5 stations in sequence: 1) Feeding area (bottles and formula), 2) Nap zone (soft moss beds), 3) Play area (carved wooden toys), 4) Changing station (diaper supplies), 5) Safety checkpoint (healing herbs).<br><br><b>Interaction:</b> DC 14 Wisdom (Insight) to understand its protective nature. DC 13 Charisma (Deception) to convince it you're authorized caretakers, or DC 15 Sleight of Hand to take items without triggering its protection protocols. Success grants access to supplies and safe rest areas.", isCombat: false },
    { title: "The Shadow Babysitter's Routine", description: "A Shadow Babysitter emerges from the darkness, mistaking the party for wayward children. It attempts to 'care' for them with unsettling nurturing behavior.<br><br><b>Care Attempts:</b> Roll 1d6 each round - 1: Tries to feed party members baby food, 2: Attempts to change someone's diaper, 3: Insists on naptime, 4: Checks everyone's 'temperature' with cold shadow-touch, 5: Tries to read a disturbing bedtime story, 6: Attempts to give medicine (minor healing potion).<br><br><b>Escape/Cooperation:</b> DC 15 Charisma (Deception) to convince it you're 'good children' and don't need care, or DC 17 Charisma (Persuasion) to convince it to find other children to care for. Playing along grants minor benefits but requires Constitution saves against unsettling experiences.", isCombat: false },
    { title: "The Ghostiby's Prank War", description: "A Darkling-Ghostiby phases through trees, giggling mischievously. It's escalating from harmless pranks to increasingly elaborate schemes.<br><br><b>Prank Escalation:</b> Turn 1: Moves small items, Turn 2: Creates false sounds, Turn 3: Briefly possesses objects, Turn 4: Attempts to swap party members' equipment, Turn 5: Tries to lead party in circles.<br><br><b>Counter-Pranks:</b> DC 12 Sleight of Hand to prank it back, DC 14 Wisdom (Perception) to anticipate its moves, or DC 16 Charisma (Performance) to out-entertain it. Success earns its respect and a <b>Ghostiby's Giggle Gem</b> (casts <i>Minor Illusion</i> 3 times/day).", isCombat: false },
    { title: "The Crinkly-Crawlie Exchange Program", description: "A mixed group of Crinkly-Crawlie students from different subspecies have set up a cultural exchange in a forest clearing. They're trading knowledge, crafts, and treats while practicing inter-species cooperation.<br><br><b>Exchange Opportunities:</b> <b>Bee students</b> offer Sunpetal Honey for information about flower locations, <b>Ant students</b> trade detailed maps for metal objects, <b>Moth students</b> exchange silk items for light sources, <b>Beetle students</b> offer armor repair for gems or shiny objects.<br><br><b>Participation:</b> DC 12 Charisma (Persuasion) to join the exchange, then contribute items or knowledge. Success grants cultural insight (+1 to next interaction with Crinkly-Crawlies) and one traded item.", isCombat: false },
    { title: "The Liquid Legion's Pooling", description: "Two Darkling Liquid Legions are attempting to merge into a larger collective, but the process is unstable. They're creating dangerous splashes and pools of corrosive liquid.<br><br><b>Hazard Mechanics:</b> Each round, roll 1d6 - on 1-2, a 10-foot radius splash occurs (DC 14 Dex save or 1d4 acid damage). The merging will complete in 5 rounds, creating a much more dangerous entity.<br><br><b>Intervention Options:</b> DC 16 Intelligence (Arcana) to understand the process, DC 15 Survival to lead them to a better merging location, or DC 18 magical disruption to safely separate them. Success prevents the dangerous merger and may earn grudging respect.", isCombat: false },
            

            // Enhanced Old War Artifacts & Memorials (already done based on your examples)
            { title: "Memorial Grove", description: "A weathered stone bench bears a brass plaque reading 'In memory of the South Tower children - their laughter echoes still.' The bench sits in a grove with signs of long-buried ruins beneath the overgrowth.", isCombat: false },
            { title: "Darkforged Escape Map", description: "Carved into a boulder is a crude map showing escape routes from the Academy, marked with desperate scratches. The angular, mechanical precision of the carving suggests it was created by a Darkforged servant of Tabitha during the siege.", isCombat: false },
            { title: "The Grim Scarecrow", description: "A rusted Darkforged helmet sits atop a wooden post, riddled with arrows and serving as a grim scarecrow. The post stands mysteriously in the middle of otherwise untouched woods, its origin lost to time.", isCombat: false },
            { title: "Triangle of Graves", description: "Three small graves marked only with smooth river stones form a triangle around a withered apple tree.<br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Examine the Grave Stones Closely</button><div style='display:none'><b>Hidden Detail:</b> Careful examination reveals faint names carved into the stones: 'Mira Thessian - Loyalist,' 'Jonas Kael - Caelestis Supporter,' and 'Lyra Voss - Caelestis Supporter.' Despite their opposing allegiances in life, someone chose to bury these three students together, perhaps recognizing their shared youth and tragedy.</div>", isCombat: false },
            { title: "Defaced Statue of Orelius", description: "A shattered statue of Lieutenant Headmaster Orelius lies in pieces, its face deliberately chiseled away during the uprising. Someone in the past has stenciled a crude, comical face atop the disfigurement—a blend of tragedy and humor, past wounds coexisting with attempts at healing.", isCombat: false },
            { title: "The Sealed Well", description: "An old well is sealed with iron bars and warning runes, whispers of 'soul magic' still echoing from its depths. The bars look recently reinforced.<br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Attempt to Pry Open the Bars</button><div style='display:none'><b>Dangerous Choice:</b> The bars can be forced open with considerable effort (DC 18 Strength check). Descending into the well leads to a confrontation with a Darkforme-Cavesweller that has been feeding on the residual soul magic. If defeated, the well contains valuable magical artifacts appropriate for the party's level (DM's discretion).</div>", isCombat: false },
            { title: "Wall of Names", description: "A section of ancient Academy wall stands alone in the forest, covered in student names carved during the siege. Numerous spaces show where graduates and alumni have added their names after their time at the school, creating layers of history spanning decades.", isCombat: false },
            { title: "Evacuation Point 3", description: "A rotted wooden sign reading 'Evacuation Point 3' hangs askew from a dead tree branch. A faint path can still be discerned leading deeper into the forest.<br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Follow the Evacuation Path</button><div style='display:none'><b>Hidden Encounter:</b> The path leads to a clearing where a contingent of Darkforged Remnants kneel deactivated around a bleached skeleton. There's a 50% chance the constructs suddenly reactivate and attack, still following their final orders from decades ago.</div>", isCombat: false },
            { title: "Field Hospital Ruins", description: "Stone foundations outline what was once an emergency field hospital, with herb gardens now growing wild around the perimeter.<br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Search the Ruins (DC 20 Investigation)</button><div style='display:none'><b>Hidden Treasure:</b> A small trinket in the form of a purple hair bead of indeterminate magical power can be found among the foundation stones. It radiates faint enchantment magic but its exact properties remain mysterious.</div>", isCombat: false },
            { title: "The Fallen Bell Tower", description: "A cracked bell tower stands isolated, its bell long since fallen and buried in the earth below. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Investigate the Tower Interior</button><div style='display:none'><b>Cute Discovery:</b> A family of Crinkly-Crawlie (Firefly) students has made a nest inside the bell chamber, their soft bioluminescent glow creating a magical nightlight effect. They're completely harmless and seem to be using the tower as a study retreat.</div>", isCombat: false },
            
            // Enhanced Student Life Remnants
            { title: "Secret Meeting Circle", description: "A circle of flat stones around a cold fire pit shows where students once held clandestine meetings during the war. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Examine the Fire Pit Carefully</button><div style='display:none'><b>Hidden Detail:</b> Beneath the ashes, charred fragments of papers can be found—remnants of secret correspondence between student resistance cells. The fragments mention plans to 'protect the younger ones' and coordinates for safe houses.</div>", isCombat: false },
            { title: "Heart-Shaped Tree Chronicle", description: "Initials and love messages carved into a heart-shaped tree have been crossed out and re-carved over the decades, creating a palimpsest of student romance. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Decipher the Oldest Carvings</button><div style='display:none'><b>Historical Romance:</b> The oldest visible carving reads 'T.C. + M.R. Forever' with a crude crown symbol. Below it, someone has angrily scratched 'TYRANT + MONSTER' but even that has been partially worn away by time and weather.</div>", isCombat: false },
            { title: "Hidden Student Cache", description: "Tree roots have been carefully excavated to create a hidden cache containing moldy textbooks and a student's journal from before the conflict. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Read the Journal Entries</button><div style='display:none'><b>Personal History:</b> The journal belongs to a student named Ellis who writes about normal academy life—complaining about dining hall food, gossip about teachers, and excitement about the upcoming Founders Day celebration. The entries stop abruptly mid-sentence on the day of the uprising.</div>", isCombat: false },
            { title: "Dormitory Steps to Nowhere", description: "Stone steps lead up to empty air, remnants of a dormitory destroyed in the First Internal Siege. Weeds grow between the cracks in the masonry. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Search Beneath the Steps</button><div style='display:none'><b>Lost Belongings:</b> Hidden under the collapsed foundation are several personal items: a stuffed Pupperling toy, a set of enchanted study flashcards, and a silver locket containing a pressed flower. These belonged to students who never had a chance to retrieve them.</div>", isCombat: false },
            { title: "Generations' Rope Swing", description: "A rope swing hangs from an ancient oak, its knots re-tied by generations of students seeking normalcy amid chaos. The rope shows signs of recent use. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Examine the Tree Trunk</button><div style='display:none'><b>Hidden Messages:</b> Carved into the bark are dozens of small initials and dates spanning decades. Some include messages like 'Class of '85 - Still Swinging!' and 'For those who can't swing anymore.' It's become an informal memorial tradition.</div>", isCombat: false },
            { title: "The Kingdoms Game Board", description: "Faded chalk marks on a large flat rock show the boundaries of an old student game called 'Kingdoms.' The game board is surprisingly complex. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Decipher the Game Rules</button><div style='display:none'><b>Strategic Discovery:</b> A closer look reveals this wasn't just a game—the 'kingdoms' correspond to actual Academy buildings and territories. Students were unknowingly learning tactical planning. Several moves marked in red chalk show defensive positions that were actually used during the siege.</div>", isCombat: false },
            { title: "Modern Student Shrine", description: "A small shrine made of stacked stones holds offerings of wildflowers left by modern students. Fresh flowers suggest recent visits. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Examine the Offerings Closely</button><div style='display:none'><b>Current Connection:</b> Among the flowers are small notes written in Common: 'For the brave ones,' 'Thank you for our freedom,' and 'Wish you could see the Academy now.' Current students still remember and honor the sacrifices made during the Old War.</div>", isCombat: false },
            { title: "Countdown Calendar Tree", description: "Scratches on tree bark form a crude calendar counting down days until 'the war ends.' The final marks are deep and desperate. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Follow the Calendar to Its End</button><div style='display:none'><b>Tragic Finale:</b> The countdown reaches zero, but then continues with different markings—tallies of days since the war ended, then weeks, then months. The final entry, carved much deeper, simply says 'Day 365 - Still not home.' Someone waited here long after the conflict ended.</div>", isCombat: false },
            { title: "Graffiti History Table", description: "A picnic table carved from a single massive tree stump bears decades of student graffiti and declarations, layer upon layer of academy history. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Trace the Historical Layers</button><div style='display:none'><b>Timeline Discovery:</b> The carvings form a chronological record: pre-war complaints about homework, wartime messages of defiance and fear, post-war memorials and hope, and modern student concerns about exams and relationships. It's an unintentional historical document of student life.</div>", isCombat: false },
            { title: "Overgrown Garden Markers", description: "Stone markers indicate the former locations of student vegetable gardens, now overgrown with wild herbs that smell unexpectedly pleasant. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Identify the Wild Herbs (DC 15 Nature)</button><div style='display:none'><b>Useful Discovery:</b> The herbs growing here are valuable alchemical components: Calming Chamomile, Concentration Mint, and Memory Sage. The students' wartime garden has evolved into a natural potion ingredient supplier worth 3d10 gold pieces if harvested.</div>", isCombat: false },
            
            // Enhanced Faction & Political Remnants  
            { title: "Defaced Caelestis Mural", description: "A defaced mural on a surviving wall shows Tabitha Caelestis with her eyes scratched out, but the scratches themselves tell a story. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Examine the Scratch Patterns</button><div style='display:none'><b>Violence and Regret:</b> The scratches were made by different tools over time—some angry and deep from the immediate aftermath, others more careful, almost surgical. One set of lighter scratches seems to be trying to restore the original features, suggesting someone later regretted the defacement.</div>", isCombat: false },
            { title: "Loyalist Imprisonment Tree", description: "Broken chains hang from a massive tree where loyalist students were reportedly imprisoned during the uprising. The chains are rusted but the tree bears permanent scars. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Examine the Chain Attachment Points</button><div style='display:none'><b>Evidence of Cruelty:</b> The chains were attached using iron spikes driven deep into the living tree. Carved into the bark near each chain attachment are tallies—someone was counting days. The highest count reaches 47 marks before stopping abruptly.</div>", isCombat: false },
            { title: "Empty Banner Pole", description: "A banner pole stands empty, its Scholian colors long since rotted away in the weather. The pole itself is made of expensive Academy-crafted bronze. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Check the Base of the Pole</button><div style='display:none'><b>Hidden Dedication:</b> Buried at the base is a small bronze plaque: 'In memory of unified Scholia Diaspros - May she rise again in peace.' Someone secretly buried this during or after the war, hoping for eventual reconciliation.</div>", isCombat: false },
            { title: "Fading Caelestis Graffiti", description: "Scorch marks on rocks spell out 'CAELESTIS LIVES' in Common, the letters barely visible after decades of weathering. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Search for Other Hidden Messages</button><div style='display:none'><b>Secret Counter-Message:</b> Carved very faintly into a nearby stone is a response: 'But at what cost?' and below that, even fainter: 'The children remember.' These messages were clearly made by someone who wanted to challenge the graffiti but feared open confrontation.</div>", isCombat: false },
            { title: "Faded Wanted Posters", description: "A wooden post displays the remnants of old wanted posters, names and faces too faded to read clearly. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Attempt to Restore the Text (DC 18 Investigation)</button><div style='display:none'><b>Readable Fragment:</b> One poster can be partially restored: '...ANTED for Sedition: Mira [Last name unclear] - Known associate of the Loyalist Underground. Reward: 50 Academy Merits.' At the bottom, someone has written in different ink: 'Found dead. Reward unclaimed. May she rest in peace.'</div>", isCombat: false },
            { title: "Cracked Voting Boxes", description: "Stone voting boxes from student council elections sit cracked and empty, democracy's last attempt before authoritarian rule took hold. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Check Inside the Voting Boxes</button><div style='display:none'><b>Final Ballots:</b> Inside one cracked box are the remnants of the final election ballots, some still legible: votes for 'Unity Candidate' vs 'Strong Leadership Candidate.' The 'Strong Leadership' votes are winning by a small margin—suggesting Tabitha's rise had legitimate student support initially.</div>", isCombat: false },
            { title: "Propaganda Bulletin Board", description: "A bulletin board made of slate still shows fragments of propaganda from both sides of the conflict, creating a chaotic collage of competing messages. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Piece Together the Messages</button><div style='display:none'><b>Competing Narratives:</b> Loyalist flyers read 'Remember our Values - Peace, Learning, Growth' while Caelestis propaganda declares 'Strength Through Unity - No More Weakness!' Most interesting is a third type: hand-written notes saying 'Can't we all just get along?' and 'Why are we fighting each other?' - evidence of students caught in the middle.</div>", isCombat: false },
            { title: "Conflicting Mottos", description: "Carved into bedrock is the Academy's original motto: 'Knowledge, Compassion, Growth.' Below it, Tabitha's revised version is scratched: 'Knowledge, Strength, Order.' <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Look for Additional Modifications</button><div style='display:none'><b>Continuing Evolution:</b> Below both mottos, in much smaller letters, someone has carved a third version: 'Knowledge, Memory, Hope.' This appears to be post-war, an attempt to synthesize the lessons learned from the conflict into a new guiding principle.</div>", isCombat: false },
            { title: "Rally Speaking Platform", description: "A raised platform of stacked stones served as a speaking podium for student political rallies during the increasingly tense pre-war period. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Search Around the Platform Base</button><div style='display:none'><b>Discarded Speech Notes:</b> Scattered around the platform are weathered fragments of speech notes. One legible piece reads: '...we must choose between safety and stagnation, between protection and... [torn] ...our children deserve a world where they can...' The emotional tone suggests these were desperate appeals rather than calculated political rhetoric.</div>", isCombat: false },
            { title: "Pacifist Club Memorial", description: "Broken spectacles lie beneath a tree where the Academy's pacifist debate club once met, their lenses cracked but not shattered completely. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Examine the Area for Club Materials</button><div style='display:none'><b>Peaceful Intentions:</b> Hidden in a hollow at the tree's base is a waterproof case containing the club's charter: 'We, the students of Scholia Diaspros, commit to resolving all conflicts through dialogue, understanding, and compromise. Violence is never the answer.' The document is signed by 23 students, their fates unknown.</div>", isCombat: false },
            
            // Enhanced Personal Tragedy Markers
            { title: "The Abandoned Wooden Sword", description: "A child's wooden sword is embedded deep in a tree trunk, placed there by someone who never came back for it. The wood has grown around the blade. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Examine the Sword's Craftsmanship</button><div style='display:none'><b>Loving Detail:</b> The sword is beautifully crafted with intricate designs and the initials 'L.M.' carved into the handle. Wrapped around the hilt is a small cloth ribbon with embroidered words: 'For my brave little knight - Love, Papa.' It was clearly a cherished gift from a parent who may not have survived the war.</div>", isCombat: false },
            { title: "Separated Friends' Lockets", description: "Two matching lockets hang from separate branches of the same tree, opened to reveal portraits of two young friends smiling together. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Read the Locket Inscriptions</button><div style='display:none'><b>Eternal Friendship:</b> Inside one locket is engraved: 'Elena & Sara - Friends Forever' and in the other: 'Even if the world ends, we'll find each other.' The portraits show two girls, one human and one with pointed ears, wearing Academy uniforms and laughing at some shared joke.</div>", isCombat: false },
            { title: "Pliya's Final Words", description: "A weathered diary wrapped in oilcloth contains pages of normal student life, but the final entry stands out starkly. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Read the Last Entry</button><div style='display:none'><b>Heart-breaking Final Words:</b> The final entry reads: 'I hope Pliya forgives me someday. I never wanted any of this to happen. I just wanted us to be safe. Umby was right - some things are more important than safety. I should have listened. If anyone finds this, tell them we were friends once, before everything went wrong. - L.' The handwriting becomes increasingly shaky toward the end.</div>", isCombat: false },
            { title: "The Single Boot", description: "A single muddy boot sits on a stump, its mate never found after the South Tower's fall. The boot is small, clearly belonging to a young student. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Examine the Boot's Contents</button><div style='display:none'><b>Last Possessions:</b> Inside the boot is a small collection of treasures: a smooth pebble, a pressed flower, a small wooden figurine of a dragon, and a note in a child's handwriting: 'Lucky things to keep me safe.' They didn't work.</div>", isCombat: false },
            { title: "Memorial Hair Ribbons", description: "Hair ribbons in Academy colors are tied around tree branches, each representing a student lost during the conflict. The ribbons flutter gently in the breeze. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Count and Examine the Ribbons</button><div style='display:none'><b>Scale of Loss:</b> There are 47 ribbons total. Each has a small tag with just initials - no names, as if the person who placed them couldn't bear to write full names. Some tags have additional symbols: a small heart, a star, or a simple drawing of the Academy crest.</div>", isCombat: false },
            { title: "The Haunted Music Box", description: "A broken music box plays a haunting melody when the wind hits it just right, the tune half-familiar but deeply melancholic. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Try to Repair the Music Box</button><div style='display:none'><b>Restored Memory:</b> With careful handling, the music box can be partially repaired. It plays the Academy lullaby that was sung to younger students at bedtime. Inside the box is a tiny dancing figure of a Pupperling wearing an Academy uniform, forever frozen mid-dance.</div>", isCombat: false },
            { title: "The Mystery Mourner", description: "Fresh flowers appear weekly on an unmarked grave, though no one claims to place them. The flowers are always the same type: white lilies. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Hide and Watch for the Mourner</button><div style='display:none'><b>Secret Vigil:</b> A patient watch reveals an elderly Kittenfolk groundskeeper who visits each week at dawn. If approached gently, they'll explain: 'This was my student. Died protecting the younger ones during the evacuation. I promised their parent I'd remember them.' They've been keeping this vigil for over 20 years.</div>", isCombat: false },
            { title: "Child's Lost Treasures", description: "A small pouch containing baby teeth hangs from a branch, a child's treasure collection never claimed. The pouch is weather-beaten but intact. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Examine the Pouch Contents</button><div style='display:none'><b>Innocent Collection:</b> Besides the baby teeth, the pouch contains: three colorful marbles, a shiny button, a small crystal that sparkles in the light, and a note in crakey handwriting: 'For the tooth fairy when she comes to the new place.' The child was planning to continue their traditions wherever they evacuated to.</div>", isCombat: false },
            { title: "Eternal Tea Party", description: "Two dolls sit propped against a tree, positioned as if having an eternal tea party with toy cups and plates between them. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Examine the Tea Party Setup</button><div style='display:none'><b>Careful Arrangement:</b> The dolls are positioned with loving care. One doll has been re-sewn many times, showing years of love and repair. Between them is a small note: 'Mira and Lilly will have tea forever and ever, just like we promised.' Someone ensured their dolls could continue their friendship even after they were gone.</div>", isCombat: false },
            { title: "The Fragile Love Letter", description: "A love letter folded into a bird shape has been wedged into tree bark, too fragile to open without destroying it. The paper is yellowed and delicate. <br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Attempt to Carefully Unfold the Letter (DC 20 Sleight of Hand)</button><div style='display:none'><b>Preserved Love:</b> Success reveals the letter: 'My dearest Marcus, I know we're on different sides now, but my heart hasn't changed. When this is all over, can we try to remember what we meant to each other? I'll wait for you by our tree. All my love, Celia.' The letter was never delivered.</div>", isCombat: false },
            
            // Enhanced Magical Residue & Phenomena will be added in the next part...
            { title: "The Resonance Cascade", description: "A shimmering area where the air itself seems to vibrate with magical energy. Spells cast here have unpredictable effects—sometimes enhanced, sometimes completely different. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Details':'Reveal Hidden Effects'\">Reveal Hidden Effects</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">Investigation DC 16 (Arcana): This cascade was caused by a massive spell duel between Academy professors during the Old War. The magical energies never properly dissipated. Characters who spend 10 minutes studying the phenomenon can learn to predict the fluctuations, gaining advantage on their next spell attack roll.</div>", isCombat: false },
            { title: "The Weeping Willow of Sorrows", description: "A ancient willow tree constantly drips what appears to be tears, but the liquid glows with faint magical energy. Those who drink it experience overwhelming sadness for 1 hour but gain insight into the nature of loss and grief. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Lore':'Reveal Sacred Lore'\">Reveal Sacred Lore</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">The tree absorbed the grief of countless students who mourned lost friends during the Old War. Each 'tear' contains a fragment of genuine sorrow, making it a powerful component for enchantments related to empathy and understanding. A skilled alchemist could use these tears to create a Potion of Emotional Clarity.</div>", isCombat: false },
            { title: "The Floating Classroom Desks", description: "Six stone desks hover three feet off the ground in a perfect circle, slowly rotating around a central point. Quills and parchment still rest on their surfaces, defying gravity. Sitting at one reveals phantom lessons from Academy history. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Experience':'Reveal Learning Experience'\">Reveal Learning Experience</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">These desks were enchanted by Professor Millicent Quillheart during the siege to preserve important lessons. Sitting at different desks teaches different subjects: History of the Academy, Basic Potty Management Theory, Elementary Defensive Magic, etc. Spending 1 hour here grants proficiency in one skill of choice for 24 hours.</div>", isCombat: false },
            { title: "The Temporal Breakfast Nook", description: "A small clearing where the scent of fresh bacon and eggs perpetually drifts through the air. A ghostly dining table appears at dawn each day, set with phantom food that looks delicious but provides no sustenance. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Memory':'Reveal Precious Memory'\">Reveal Precious Memory</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This was where Pliya, Lian, Umbirgitte, and Seris would meet for secret early morning picnics before classes. The magical echo of their happiness and friendship has become so strong it manifests as a temporal loop. Characters who 'join' the phantom breakfast (by sitting at the table) experience a brief moment of perfect contentment and camaraderie.</div>", isCombat: false },
            { title: "The Whispering Inkwell", description: "A large, ornate inkwell sits atop a moss-covered pedestal. The ink inside swirls and moves on its own, occasionally forming words or images. The whispers it produces are in various languages, telling fragments of stories and lessons. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Secrets':'Reveal Scholarly Secrets'\">Reveal Scholarly Secrets</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This inkwell belonged to the Academy's head librarian during the Old War. It was enchanted to preserve knowledge—every piece of writing done with its ink was magically recorded. The whispers are fragments of student essays, love letters, battle plans, and research notes. A character who listens carefully (DC 15 Investigation) can learn a useful piece of Academy history or gain insight into a current mystery.</div>", isCombat: false },
            { title: "The Giggling Mushroom Ring", description: "A perfect circle of bright red mushrooms constantly produces the sound of children's laughter. The mushrooms glow softly at night and seem to respond to the presence of anyone with a playful spirit. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Magic':'Reveal Childlike Magic'\">Reveal Childlike Magic</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">These mushrooms sprouted from the site where Academy children would play during recess. Their innocent joy became so concentrated it transformed the local flora. Characters who embrace their inner child (make silly faces, skip, or play a simple game) cause the mushrooms to release spores that grant the effect of a Feather Fall spell for 1 hour.</div>", isCombat: false },
            { title: "The Spell-Locked Picnic Basket", description: "A wicker picnic basket sits beside a babbling brook, sealed with multiple magical locks of different types. Each lock glows with a different color, and the basket occasionally emits the scent of fresh sandwiches and sweet tea. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Challenge':'Reveal Magical Challenge'\">Reveal Magical Challenge</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">Each lock requires a different skill to open: Arcana (DC 14), Thieves' Tools (DC 12), Nature (DC 13), and Performance (DC 15). The basket was locked by a group of advanced students to preserve their 'perfect picnic' during the war. Successfully opening all locks reveals a feast that never spoils, providing enough food for 8 people and granting the benefits of a Heroes' Feast spell.</div>", isCombat: false },
            { title: "The Chromatic Puddle", description: "A small puddle reflects not the sky above, but swirling colors that seem to move with a life of their own. The colors occasionally form recognizable shapes—faces, symbols, or scenes from Academy life. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Visions':'Reveal Prophetic Visions'\">Reveal Prophetic Visions</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This puddle was created when a divination spell went wrong during a student's thesis defense. It now serves as a minor scrying pool, showing glimpses of the Academy's past and potential futures. Characters who stare into it for 10 minutes (DC 16 Wisdom save to avoid being mesmerized) can ask one question about Academy history or receive a cryptic hint about their current quest.</div>", isCombat: false },
            { title: "The Singing Teapot", description: "A delicate porcelain teapot sits on a stone circle, continuously pouring an endless stream of perfectly brewed tea that vanishes before hitting the ground. The teapot hums gentle melodies that seem to calm wild animals and soothe troubled minds. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Comfort':'Reveal Maternal Comfort'\">Reveal Maternal Comfort</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This teapot belonged to the Academy's head nurse, who would brew healing teas for homesick students. Her motherly care became so infused with the object that it gained magical properties. Characters who spend 10 minutes listening to its song and 'sharing tea' with it (pantomiming drinking) recover 1d4 hit points and gain advantage on their next Wisdom save.</div>", isCombat: false },
            { title: "The Floating Homework Assignments", description: "Dozens of pieces of parchment float through the air at shoulder height, covered in student handwriting. They occasionally reorganize themselves into neat stacks before scattering again. Touching one causes it to briefly become solid and readable. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Studies':'Reveal Academic Studies'\">Reveal Academic Studies</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">These are the homework assignments that were never turned in due to the chaos of the Old War. The magical stress of unfinished work has caused them to become semi-corporeal. Reading through them (DC 14 Investigation, 30 minutes) provides insight into student life during the war and teaches one cantrip of choice that was commonly studied.</div>", isCombat: false },
            { title: "The Empathy Echo Chamber", description: "A hollow in the rock face that amplifies and reflects emotions. Anyone who speaks into it can hear their words repeated back in the voices of others, each repetition carrying different emotional tones—joy, sorrow, anger, hope. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Therapy':'Reveal Therapeutic Power'\">Reveal Therapeutic Power</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This natural formation was enhanced by a therapy session gone wrong when a counselor tried to help students process their war trauma. The echo chamber now serves as a form of magical therapy. Characters who spend 1 hour expressing their fears and hopes to the chamber can remove one level of exhaustion or recover from one minor magical affliction.</div>", isCombat: false },
            { title: "The Levitating Library", description: "A collection of books floats in mid-air, slowly orbiting around a central point like a miniature solar system. The books are all different sizes and subjects, and they occasionally open themselves to display their contents before snapping shut again. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Knowledge':'Reveal Forbidden Knowledge'\">Reveal Forbidden Knowledge</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">These books were launched into the air during the destruction of a secret library wing and never came down. They contain knowledge that was deemed too dangerous or sensitive during the war. Successfully catching a book (DC 15 Acrobatics) allows you to read it briefly before it flies away again, potentially learning a new spell or gaining insight into Academy politics.</div>", isCombat: false },
            { title: "The Phantom Chalkboard", description: "A large slate appears to be writing itself, with invisible chalk creating complex diagrams and equations. The writing changes subjects every few minutes—magical theory, diaper engineering, tactical formations, and occasionally personal messages. <button onclick=\"this.nextElementSibling.style.display = this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Lessons':'Reveal Master\\'s Lessons'\">Reveal Master's Lessons</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This chalkboard is still receiving lessons from Professor Aldric Thornweave, who died during the siege but whose dedication to teaching was so strong that his spirit continues to give lectures. Spending 1 hour studying the changing lessons grants proficiency in one Intelligence-based skill for 24 hours, or advantage on the next Intelligence check.</div>", isCombat: false },
            { title: "The Confidence Fountain", description: "A small, ornate fountain spurts water in impossible patterns—upward spirals, geometric shapes, and cascading arcs that seem to defy physics. The water glows with a warm, golden light that makes observers feel more self-assured. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Power':'Reveal Inspiring Power'\">Reveal Inspiring Power</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This fountain was created by a student who mastered the art of confidence magic during their final exam. The water is infused with essence of self-assurance and determination. Characters who cup their hands and drink from the fountain (or wash their face) gain inspiration and advantage on their next Charisma-based check.</div>", isCombat: false },
            { title: "The Metamorphic Garden", description: "A small garden where the plants constantly shift between different species—roses becoming daisies, oak trees becoming pine trees, grass becoming moss. The transformations happen slowly enough to watch but fast enough to be mesmerizing. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Secret':'Reveal Transformation Secret'\">Reveal Transformation Secret</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This garden was the site of a student's thesis on 'Adaptive Botanical Magic.' The spell was meant to create plants that could survive any environment, but instead created plants that constantly adapt to imagined threats. Studying the transformation patterns (DC 16 Nature) teaches the theoretical basis for one transmutation spell of 2nd level or lower.</div>", isCombat: false },
            { title: "The Resonance Cascade", description: "A shimmering area where the air itself seems to vibrate with magical energy. Spells cast here have unpredictable effects—sometimes enhanced, sometimes completely different. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Details':'Reveal Hidden Effects'\">Reveal Hidden Effects</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">Investigation DC 16 (Arcana): This cascade was caused by a massive spell duel between Academy professors during the Old War. The magical energies never properly dissipated. Characters who spend 10 minutes studying the phenomenon can learn to predict the fluctuations, gaining advantage on their next spell attack roll.</div>", isCombat: false },
            { title: "The Weeping Willow of Sorrows", description: "A ancient willow tree constantly drips what appears to be tears, but the liquid glows with faint magical energy. Those who drink it experience overwhelming sadness for 1 hour but gain insight into the nature of loss and grief. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Lore':'Reveal Sacred Lore'\">Reveal Sacred Lore</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">The tree absorbed the grief of countless students who mourned lost friends during the Old War. Each 'tear' contains a fragment of genuine sorrow, making it a powerful component for enchantments related to empathy and understanding. A skilled alchemist could use these tears to create a Potion of Emotional Clarity.</div>", isCombat: false },
            { title: "The Floating Classroom Desks", description: "Six stone desks hover three feet off the ground in a perfect circle, slowly rotating around a central point. Quills and parchment still rest on their surfaces, defying gravity. Sitting at one reveals phantom lessons from Academy history. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Experience':'Reveal Learning Experience'\">Reveal Learning Experience</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">These desks were enchanted by Professor Millicent Quillheart during the siege to preserve important lessons. Sitting at different desks teaches different subjects: History of the Academy, Basic Potty Management Theory, Elementary Defensive Magic, etc. Spending 1 hour here grants proficiency in one skill of choice for 24 hours.</div>", isCombat: false },
            { title: "The Temporal Breakfast Nook", description: "A small clearing where the scent of fresh bacon and eggs perpetually drifts through the air. A ghostly dining table appears at dawn each day, set with phantom food that looks delicious but provides no sustenance. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Memory':'Reveal Precious Memory'\">Reveal Precious Memory</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This was where Pliya, Lian, Umbirgitte, and Seris would meet for secret early morning picnics before classes. The magical echo of their happiness and friendship has become so strong it manifests as a temporal loop. Characters who 'join' the phantom breakfast (by sitting at the table) experience a brief moment of perfect contentment and camaraderie.</div>", isCombat: false },
            { title: "The Whispering Inkwell", description: "A large, ornate inkwell sits atop a moss-covered pedestal. The ink inside swirls and moves on its own, occasionally forming words or images. The whispers it produces are in various languages, telling fragments of stories and lessons. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Secrets':'Reveal Scholarly Secrets'\">Reveal Scholarly Secrets</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This inkwell belonged to the Academy's head librarian during the Old War. It was enchanted to preserve knowledge—every piece of writing done with its ink was magically recorded. The whispers are fragments of student essays, love letters, battle plans, and research notes. A character who listens carefully (DC 15 Investigation) can learn a useful piece of Academy history or gain insight into a current mystery.</div>", isCombat: false },
            { title: "The Giggling Mushroom Ring", description: "A perfect circle of bright red mushrooms constantly produces the sound of children's laughter. The mushrooms glow softly at night and seem to respond to the presence of anyone with a playful spirit. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Magic':'Reveal Childlike Magic'\">Reveal Childlike Magic</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">These mushrooms sprouted from the site where Academy children would play during recess. Their innocent joy became so concentrated it transformed the local flora. Characters who embrace their inner child (make silly faces, skip, or play a simple game) cause the mushrooms to release spores that grant the effect of a Feather Fall spell for 1 hour.</div>", isCombat: false },
            { title: "The Spell-Locked Picnic Basket", description: "A wicker picnic basket sits beside a babbling brook, sealed with multiple magical locks of different types. Each lock glows with a different color, and the basket occasionally emits the scent of fresh sandwiches and sweet tea. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Challenge':'Reveal Magical Challenge'\">Reveal Magical Challenge</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">Each lock requires a different skill to open: Arcana (DC 14), Thieves' Tools (DC 12), Nature (DC 13), and Performance (DC 15). The basket was locked by a group of advanced students to preserve their 'perfect picnic' during the war. Successfully opening all locks reveals a feast that never spoils, providing enough food for 8 people and granting the benefits of a Heroes' Feast spell.</div>", isCombat: false },
            { title: "The Chromatic Puddle", description: "A small puddle reflects not the sky above, but swirling colors that seem to move with a life of their own. The colors occasionally form recognizable shapes—faces, symbols, or scenes from Academy life. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Visions':'Reveal Prophetic Visions'\">Reveal Prophetic Visions</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This puddle was created when a divination spell went wrong during a student's thesis defense. It now serves as a minor scrying pool, showing glimpses of the Academy's past and potential futures. Characters who stare into it for 10 minutes (DC 16 Wisdom save to avoid being mesmerized) can ask one question about Academy history or receive a cryptic hint about their current quest.</div>", isCombat: false },
            { title: "The Singing Teapot", description: "A delicate porcelain teapot sits on a stone circle, continuously pouring an endless stream of perfectly brewed tea that vanishes before hitting the ground. The teapot hums gentle melodies that seem to calm wild animals and soothe troubled minds. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Comfort':'Reveal Maternal Comfort'\">Reveal Maternal Comfort</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This teapot belonged to the Academy's head nurse, who would brew healing teas for homesick students. Her motherly care became so infused with the object that it gained magical properties. Characters who spend 10 minutes listening to its song and 'sharing tea' with it (pantomiming drinking) recover 1d4 hit points and gain advantage on their next Wisdom save.</div>", isCombat: false },
            { title: "The Floating Homework Assignments", description: "Dozens of pieces of parchment float through the air at shoulder height, covered in student handwriting. They occasionally reorganize themselves into neat stacks before scattering again. Touching one causes it to briefly become solid and readable. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Studies':'Reveal Academic Studies'\">Reveal Academic Studies</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">These are the homework assignments that were never turned in due to the chaos of the Old War. The magical stress of unfinished work has caused them to become semi-corporeal. Reading through them (DC 14 Investigation, 30 minutes) provides insight into student life during the war and teaches one cantrip of choice that was commonly studied.</div>", isCombat: false },
            { title: "The Empathy Echo Chamber", description: "A hollow in the rock face that amplifies and reflects emotions. Anyone who speaks into it can hear their words repeated back in the voices of others, each repetition carrying different emotional tones—joy, sorrow, anger, hope. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Therapy':'Reveal Therapeutic Power'\">Reveal Therapeutic Power</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This natural formation was enhanced by a therapy session gone wrong when a counselor tried to help students process their war trauma. The echo chamber now serves as a form of magical therapy. Characters who spend 1 hour expressing their fears and hopes to the chamber can remove one level of exhaustion or recover from one minor magical affliction.</div>", isCombat: false },
            { title: "The Levitating Library", description: "A collection of books floats in mid-air, slowly orbiting around a central point like a miniature solar system. The books are all different sizes and subjects, and they occasionally open themselves to display their contents before snapping shut again. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Knowledge':'Reveal Forbidden Knowledge'\">Reveal Forbidden Knowledge</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">These books were launched into the air during the destruction of a secret library wing and never came down. They contain knowledge that was deemed too dangerous or sensitive during the war. Successfully catching a book (DC 15 Acrobatics) allows you to read it briefly before it flies away again, potentially learning a new spell or gaining insight into Academy politics.</div>", isCombat: false },
            { title: "The Phantom Chalkboard", description: "A large slate appears to be writing itself, with invisible chalk creating complex diagrams and equations. The writing changes subjects every few minutes—magical theory, diaper engineering, tactical formations, and occasionally personal messages. <button onclick=\"this.nextElementSibling.style.display = this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Lessons':'Reveal Master\\'s Lessons'\">Reveal Master's Lessons</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This chalkboard is still receiving lessons from Professor Aldric Thornweave, who died during the siege but whose dedication to teaching was so strong that his spirit continues to give lectures. Spending 1 hour studying the changing lessons grants proficiency in one Intelligence-based skill for 24 hours, or advantage on the next Intelligence check.</div>", isCombat: false },
            { title: "The Confidence Fountain", description: "A small, ornate fountain spurts water in impossible patterns—upward spirals, geometric shapes, and cascading arcs that seem to defy physics. The water glows with a warm, golden light that makes observers feel more self-assured. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Power':'Reveal Inspiring Power'\">Reveal Inspiring Power</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This fountain was created by a student who mastered the art of confidence magic during their final exam. The water is infused with essence of self-assurance and determination. Characters who cup their hands and drink from the fountain (or wash their face) gain inspiration and advantage on their next Charisma-based check.</div>", isCombat: false },
            { title: "The Metamorphic Garden", description: "A small garden where the plants constantly shift between different species—roses becoming daisies, oak trees becoming pine trees, grass becoming moss. The transformations happen slowly enough to watch but fast enough to be mesmerizing. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Secret':'Reveal Transformation Secret'\">Reveal Transformation Secret</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This garden was the site of a student's thesis on 'Adaptive Botanical Magic.' The spell was meant to create plants that could survive any environment, but instead created plants that constantly adapt to imagined threats. Studying the transformation patterns (DC 16 Nature) teaches the theoretical basis for one transmutation spell of 2nd level or lower.</div>", isCombat: false },
            
            // Enhanced Academy Infrastructure Ruins
            { title: "The Sunken Dormitory Foundation", description: "A rectangular depression in the earth reveals the stone foundation of what was once a student dormitory. Moss-covered steps lead down to a partially flooded basement where personal belongings still float in the stagnant water. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Treasures':'Reveal Lost Treasures'\">Reveal Lost Treasures</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This was the East Wing dormitory, destroyed early in the siege. A DC 15 Investigation check while wading through the water reveals a waterproof trunk containing personal effects: a set of pristine Academy dress uniforms, a collection of love letters, and a Deluxe Diaper Kit worth 50gp. The belongings belonged to students who evacuated safely but never returned to claim them.</div>", isCombat: false },
            { title: "The Collapsed Bell Tower", description: "The remains of a massive bell tower lie scattered across a wide area. The great bronze bell itself sits cracked but intact, half-buried in the earth. When the wind passes through it, it still produces a haunting, mournful tone. <button onclick=\"this.nextElementSibling.style.display = this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide History':'Reveal Tower\\'s History'\">Reveal Tower's History</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This bell tower was used to coordinate Academy defenses during the siege. A DC 16 Intelligence (History) check reveals the bell's magical properties—it was enchanted to carry messages across great distances. Characters who spend 1 hour carefully cleaning and tuning the bell can use it to send a short message to anyone they know at the Academy, appearing as a whispered voice on the wind.</div>", isCombat: false },
            { title: "The Greenhouse Skeleton", description: "A framework of twisted metal and broken glass marks where the Academy's main greenhouse once stood. Exotic plants have gone wild, creating a chaotic jungle of magical flora. Strange fruits and glowing flowers grow in impossible combinations. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Bounty':'Reveal Botanical Bounty'\">Reveal Botanical Bounty</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">Professor Meadowbloom's experimental garden has become a treasure trove of magical plants. A DC 14 Nature check allows careful harvesting of 1d4 spell components worth 10gp each. However, a DC 17 Survival check is needed to avoid the more dangerous plants that have developed defensive mechanisms. Success also reveals a hidden seed vault containing rare magical plant seeds.</div>", isCombat: false },
            { title: "The Flooded Dining Hall", description: "A large, rectangular pool of crystal-clear water sits where the Great Dining Hall once stood. Stone tables and benches can be seen beneath the surface, perfectly preserved. Schools of small, harmless fish swim between the underwater furniture. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Memories':'Reveal Preserved Memories'\">Reveal Preserved Memories</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">The water is magically purified and has preserved everything perfectly. A DC 13 Athletics check allows diving to retrieve items from the bottom: ornate serving dishes, a collection of recipe scrolls, and a Chef's Hat of Endless Seasoning. The water itself has healing properties—drinking it provides the benefits of a Potion of Healing, but only once per character.</div>", isCombat: false },
            { title: "The Shattered Observatory", description: "Pieces of a great telescope and star charts lie scattered around a circular stone platform. The magical lenses still function despite being cracked, and looking through them reveals not the sky above, but glimpses of the Academy's past. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Visions':'Reveal Temporal Visions'\">Reveal Temporal Visions</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">Professor Starweaver's observatory was destroyed by a direct magical assault, but the temporal magic in the lenses survived. A DC 15 Arcana check allows characters to properly align the scattered lenses, creating a functioning scrying device that can observe events from the Academy's past. Each use requires 1 hour and shows a random scene from the Old War.</div>", isCombat: false },
            { title: "The Crumbling Archway", description: "A magnificent stone archway stands alone in a clearing, decorated with intricate carvings of Academy crests and magical symbols. Though it leads to nothing, walking through it from different directions produces different magical effects. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Magic':'Reveal Archway Magic'\">Reveal Archway Magic</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This was the entrance to the Academy's Portal Studies building. The archway still holds residual teleportation magic. Walking through from the east grants Misty Step (once per day), from the west grants Feather Fall (once per day), from the north grants Expeditious Retreat (once per day), and from the south grants Spider Climb (once per day). Each character can only benefit from one direction per long rest.</div>", isCombat: false },
            { title: "The Abandoned Infirmary", description: "The stone foundation and partial walls of the Academy's infirmary remain intact. Medical supplies are scattered everywhere, some still magically preserved. Empty potion bottles and rolled bandages litter the area, along with several intact healing crystals. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Supplies':'Reveal Medical Supplies'\">Reveal Medical Supplies</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">Nurse Gentleheart's infirmary was evacuated in haste, leaving valuable supplies behind. A DC 14 Medicine check allows identification of useful items: 2d4 Potions of Healing, a Healer's Kit with double the normal uses, and a set of Surgeon's Tools (+2 to Medicine checks). A secret compartment (DC 16 Investigation) contains a Manual of Emergency Diaper Protocols worth 100gp to the right collector.</div>", isCombat: false },
            { title: "The Twisted Clocktower", description: "A tall, spiraling tower of stone and metal stands at an impossible angle, as if time itself has been warped around it. The great clock face shows different times depending on the viewer's position, and the hands move at inconsistent speeds. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Temporal':'Reveal Temporal Anomaly'\">Reveal Temporal Anomaly</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">The Clocktower was struck by a temporal magic explosion during the siege. A DC 17 Arcana check reveals that characters can spend 10 minutes synchronizing with the tower's rhythm to gain the benefits of a long rest in only 1 hour. However, there's a 25% chance of aging 1d4 years or becoming 1d4 years younger. The tower's mechanism contains valuable Chronal Crystals if carefully extracted.</div>", isCombat: false },
            { title: "The Sunken Library Wing", description: "A massive crater filled with murky water marks where the Academy's overflow library once stood. Thousands of waterlogged books float just beneath the surface, their pages still faintly glowing with preservation magic. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Knowledge':'Reveal Forbidden Knowledge'\">Reveal Forbidden Knowledge</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This library contained the Academy's most dangerous and controversial texts. A DC 16 Investigation check while diving allows retrieval of 1d4 spell scrolls of levels 1-3, but each dive risks a DC 14 Constitution save against the corrupted water. Success on three consecutive dives reveals the Tome of Tabitha's Theories, a dangerous but valuable historical document worth 500gp to scholars.</div>", isCombat: false },
            { title: "The Melted Forge", description: "What was once the Academy's magical forge has been reduced to a pool of solidified metal and stone. The intense heat of the final battle melted everything together, creating bizarre metallic formations and crystalline structures. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Materials':'Reveal Rare Materials'\">Reveal Rare Materials</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">Master Smith Ironbound's forge contained many valuable materials when it was destroyed. A DC 15 Smith's Tools check allows careful extraction of rare metals: Mithril scraps worth 100gp, a chunk of Adamantine worth 200gp, and several pieces of Magically Tempered Steel. The intense magical heat also created unique alloys that could be used to craft one +1 weapon or armor piece.</div>", isCombat: false },
            { title: "The Overgrown Courtyard", description: "A large, circular area of perfectly manicured grass and flowers stands in stark contrast to the wild forest around it. Stone benches arranged in a circle seem to maintain themselves, and the plants never grow beyond their intended shape. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Sanctuary':'Reveal Peaceful Sanctuary'\">Reveal Peaceful Sanctuary</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This was the Academy's Meditation Garden, blessed by the school's chaplains before the war. The area is permanently under the effect of a Sanctuary spell—no violence can occur here, and creatures with hostile intent cannot enter. Characters who spend 1 hour in peaceful meditation here recover all spell slots and remove one level of exhaustion, but the effect only works once per character per month.</div>", isCombat: false },
            { title: "The Phantom Classroom", description: "A rectangular outline of stones marks where a classroom once stood. At certain times of day, ghostly desks and chairs become visible, and the sound of a lecture can be heard. Sometimes, phantom students appear, taking notes diligently. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Lesson':'Reveal Eternal Lesson'\">Reveal Eternal Lesson</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">Professor Wisdomkeeper's final lecture was so powerful it left a permanent imprint on reality. Characters who sit quietly and listen to the full phantom lecture (1 hour) gain proficiency in one skill of their choice for 7 days. The subject changes daily: History, Arcana, Religion, Nature, Medicine, or Investigation. The phantom professor will even answer one question about Academy history if asked respectfully.</div>", isCombat: false },
            { title: "The Broken Fountain", description: "A large, ornate fountain sits cracked and dry in the center of what was once a beautiful plaza. The marble is carved with images of all the Academy's races working together in harmony. Magic still flows through the pipes, but it has no water to carry. <button onclick=\"this.nextElementSibling.style.display = this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Unity':'Reveal Unity\\'s Power'\">Reveal Unity's Power</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">The Fountain of Unity was the symbolic heart of the Academy's integrated community. If repaired (DC 15 Mason's Tools and appropriate magic), it creates a permanent zone of understanding within 30 feet. All creatures in the area can communicate regardless of language barriers, and Charisma checks for peaceful interaction have advantage. The fountain requires a container of water blessed by representatives of at least three different races to activate.</div>", isCombat: false },
            { title: "The Magical Waste Disposal", description: "A large, circular stone structure contains what appears to be a magical garbage disposal system. Strange symbols cover the rim, and occasionally items that are thrown in disappear with a soft chime. Warning signs in multiple languages suggest caution. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Function':'Reveal True Function'\">Reveal True Function</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">This was the Academy's Magical Waste Recycling System, designed to safely dispose of failed experiments and used magical components. A DC 18 Arcana check reveals it's actually a one-way portal to the Elemental Plane of Earth. Items thrown in are broken down into component materials. If a magical item is sacrificed, there's a 25% chance it returns 1d4 hours later as a different but equally valuable magical item.</div>", isCombat: false },
