            { title: "The Collapsed Amphitheater", description: "Curved stone seating arrangements descend toward a central stage area that's now filled with rubble. The acoustics are still perfect—even whispers from the stage can be heard clearly from the highest seats. <button onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'; this.textContent=this.textContent.includes('Reveal')?'Hide Performance':'Reveal Performance Magic'\">Reveal Performance Magic</button><div style=\"display:none; margin-top:10px; font-style:italic; color:#fae791;\">The Grand Amphitheater was where Academy students performed for each other and visiting dignitaries. The stage retains powerful enchantments that enhance performance magic. Any bard abilities or spells with performance components used from the stage have their range doubled and their effects last 50% longer. Hidden beneath the stage (DC 16 Investigation) is a collection of magical instruments worth 300gp total.</div>", isCombat: false },
            { title: "The Spilled Potion Cache", description: "A student's abandoned alchemy kit lies scattered near a fallen log. Several vials have shattered, creating colorful puddles that emit sweet aromas. One intact vial contains a <i>Potion of Gluttonous Consequences</i>, while another holds <i>Chronal Crystal</i> dust that sparkles with temporal energy.", isCombat: false },
            { title: "Lost Examination Papers", description: "A bundle of soggy exam papers is wedged between rocks near a stream. The ink has run, but you can make out questions about 'Spontaneous Accident Theory' and 'Diaper Durability Under Stress.' A waterproof case nearby contains a <i>Quill of Endless Ink</i> and several unused answer sheets.", isCombat: false },
            { title: "The Abandoned Picnic", description: "A checkered blanket is spread beneath an oak tree, with the remains of a student picnic. Half-eaten <i>Berrimaters</i> attract curious woodland creatures, while a basket contains <i>Sunpetal Honey</i> and a note reading 'Meet me at the old bell tower after classes - M'.", isCombat: false },
            { title: "The Crying Scampersaurian", description: "A young Scampersaurian student sits on a moss-covered rock, tears streaming down their scaled cheeks. They're clutching a broken <i>Maintenance Badge</i> and mumbling about failing their groundskeeping practical exam. Their toolkit contains useful <i>Hedge Trimmers</i> and <i>Fertilizer Sacks</i>.", isCombat: false },
            { title: "Kittenfolk Yarn Ball", description: "A massive ball of <i>Diaparachnid Silk</i> yarn has been abandoned in a clearing, with several Kittenfolk students nowhere to be seen. The yarn glows faintly with residual magic, and following the loose threads leads to a hidden grove where the students were practicing <i>Mending</i> spells.", isCombat: false },
            { title: "The Glowing Diaper Station", description: "An ornate changing station made of polished wood sits in a fairy ring. It radiates gentle magic and is surrounded by <i>Nature's Wet Wipes</i> that never seem to run out. A <i>Scroll of Diapering</i> is pinned to a nearby tree with detailed instructions for proper enchantment use.", isCombat: false },
            { title: "Spontaneous Accident Circle", description: "A perfect circle of dead grass marks where a <i>Spontaneous Accident</i> spell was cast repeatedly. The area still tingles with residual magic, and any creature entering must make a DC 12 Constitution save or experience a minor accident. A <i>Potion of Holding It In</i> sits abandoned at the circle's center.", isCombat: false },
            { title: "The Sticky Situation", description: "A tree is completely covered in what appears to be <i>Barkgum</i> that has hardened into amber-like formations. Small forest creatures are trapped within, perfectly preserved. A <i>Solvent Spray</i> bottle lies nearby, suggesting someone was trying to fix this magical mishap.", isCombat: false },
            { title: "Enchanted Diaper Laundry", description: "A stream runs milky-white where someone has been washing <i>Enchanted Diapers</i>. The water has magical properties - drinking it restores 1d4 HP but forces a DC 10 Constitution save or become incontinent for 1 hour. Several <i>Soap Bars</i> float in the current.", isCombat: false },
            { title: "The Mage Hand Mishap", description: "Dozens of spectral hands float through the forest, each carrying different items - <i>Bottles</i>, <i>Rattles</i>, <i>Pacifiers</i>, and <i>Diaper Pins</i>. They're the remnants of a <i>Mage Hand</i> spell gone wrong. The hands are harmless but will drop their items if touched, creating a treasure hunt scenario.", isCombat: false },
            { title: "Waddlehoof Message Station", description: "A crude wooden post has been driven into the ground, covered in <i>Waddlehoof Scout Badges</i> and carved symbols. This is a message station where the playful race leaves coded messages for their scouts. Deciphering the symbols (DC 15 Investigation) reveals locations of hidden supply caches.", isCombat: false },
            { title: "Crinkleheart Meditation Circle", description: "Seven smooth stones arranged in a circle mark where a Crinkleheart has been practicing emotional manipulation magic. The air shimmers with residual <i>Charm</i> energy, and sitting in the circle for 10 minutes grants advantage on the next Charisma check but also makes the character more susceptible to being charmed.", isCombat: false },
            { title: "Pampire Sunshade Retreat", description: "A elaborate canopy of <i>Moth Silk</i> has been strung between trees, creating a shaded area where a Pampire student has been studying. Scattered around are <i>Blood Substitute Vials</i>, <i>Sunscreen Bottles</i>, and textbooks on 'Daylight Survival Theory.' The area provides protection from sunlight damage.", isCombat: false },
            { title: "Carcharodonian Pool Party", description: "A natural pool has been modified with <i>Aquatic Breathing Apparatus</i> and <i>Underwater Slates</i> for note-taking. Several Carcharodonian students have been using this as a study group location. The water is crystal clear and contains <i>Kelp Snacks</i> and <i>Pressurized Water Bottles</i>.", isCombat: false },
            { title: "Pupperling Pack Meeting", description: "A circle of worn earth shows where Pupperling students have been meeting regularly. <i>Friendship Bracelets</i> hang from low branches, and a cache contains <i>Loyalty Badges</i>, <i>Tail Wag Enhancers</i>, and a <i>Pack Leader's Whistle</i>. The area radiates warmth and belonging.", isCombat: false },
            { title: "The Siege Supply Drop", description: "A rotted crate has burst open, revealing <i>Wartime Rations</i>, <i>Combat Diapers</i>, and <i>Field Medical Kits</i>. The supplies are mostly ruined by time, but a <i>Healing Potion</i> remains intact, along with a <i>Signal Flare</i> that still functions. Military insignia mark this as a loyalist supply drop.", isCombat: false },
            { title: "The Deserter's Hideout", description: "A camouflaged shelter built into a hillside contains the belongings of a war deserter. Personal effects include <i>Family Portraits</i>, <i>Civilian Clothes</i>, and <i>Forged Papers</i>. A <i>Confession Letter</i> explains the soldier's crisis of conscience during the Internal Siege.", isCombat: false },
            { title: "The Broken Construct", description: "The remains of a <i>Darkforged Remnant</i> lie scattered across a clearing, its parts slowly being reclaimed by nature. Among the debris are <i>Construct Cores</i>, <i>Magical Gears</i>, and <i>Memory Crystals</i> that still hold fragmented battle records. The area feels heavy with tragic history.", isCombat: false },
            { title: "The Recruitment Poster", description: "A faded poster nailed to a tree reads 'Join the Academy Defense Force!' with Tabitha Caelestis's signature at the bottom. The surrounding area shows signs of a recruitment rally - <i>Torn Banners</i>, <i>Propaganda Leaflets</i>, and <i>Enrollment Forms</i> scatter the ground.", isCombat: false },
            { title: "The Mobile Greenhouse", description: "A wheeled greenhouse structure has been abandoned in a grove, overgrown with magical plants. Inside are <i>Seed Packets</i>, <i>Fertilizer Samples</i>, <i>Watering Cans</i>, and <i>Plant Growth Accelerators</i>. The greenhouse was likely used for field studies before being forgotten.", isCombat: false },
            { title: "The Outdoor Classroom", description: "Stone benches arranged in a semicircle mark where professors once held outdoor lessons. A <i>Portable Blackboard</i> leans against a tree, still showing faded equations for 'Diaper Capacity Calculations.' <i>Student Notebooks</i> and <i>Chalk Pieces</i> are scattered around the area.", isCombat: false },
            { title: "The Library Extension", description: "A small stone building, overgrown with ivy, houses an extension of the Academy library. Inside are <i>Reference Tomes</i>, <i>Research Journals</i>, and <i>Spell Components</i> in labeled jars. A <i>Reading Lamp</i> still glows with magical light, and the air smells of old parchment.", isCombat: false },
            { title: "The Maintenance Shed", description: "A wooden shed contains <i>Groundskeeping Tools</i>, <i>Repair Kits</i>, and <i>Cleaning Supplies</i>. The Scampersaurian groundskeeping staff used this as a base for forest maintenance. A <i>Work Schedule</i> on the door shows assignments for 'Pixie Nest Relocation' and 'Magical Weed Removal.'", isCombat: false },
            { title: "The Nightmare Residue", description: "A patch of forest where the trees grow in twisted, unnatural shapes. This is where Umbra's influence seeps through most strongly. The area is covered in <i>Shadow Crystals</i> and <i>Fear Essence</i> that materialized from students' nightmares. A <i>Protective Charm</i> has been placed on a nearby tree.", isCombat: false },
            { title: "The Friendship Echo", description: "A grove where the psychic resonance of strong friendships has created a permanent magical effect. <i>Friendship Tokens</i> appear spontaneously on the ground, and creatures who spend time here gain temporary telepathic bonds with their allies. <i>Empathy Crystals</i> grow from the earth like flowers.", isCombat: false },
            { title: "The Temporal Anomaly", description: "A section of forest where time flows differently due to <i>Chronal Crystal</i> contamination. Objects phase in and out of existence, showing different time periods. A <i>Time Piece</i> spins wildly, and <i>Temporal Anchors</i> have been placed to stabilize the area.", isCombat: false },
            { title: "The Diaper Dimension Rift", description: "A shimmering portal leads to a pocket dimension filled entirely with <i>Diapers</i> of every type and size. The rift was created by a student's thesis experiment on 'Extradimensional Storage for Nursery Supplies.' <i>Dimensional Anchors</i> keep it stable, and a <i>Warning Sign</i> advises caution.", isCombat: false },
            { title: "The Laundry Line", description: "A magical clothesline stretches between trees, where <i>Cloth Diapers</i> and <i>Academy Uniforms</i> hang drying in the breeze. The line is enchanted to clean and dry items automatically. A <i>Laundry Basket</i> contains <i>Soap Crystals</i> and <i>Fabric Softener</i>.", isCombat: false },
            { title: "The Snack Stash", description: "A hollow tree trunk has been converted into a food storage area. Inside are <i>Preserved Fruits</i>, <i>Crackers</i>, <i>Juice Boxes</i>, and <i>Emergency Rations</i>. This was clearly a student's secret snack stash for late-night study sessions. A <i>Preservation Spell</i> keeps everything fresh.", isCombat: false },
            { title: "The Study Group Site", description: "A circle of logs serves as seating around a makeshift table made from a tree stump. <i>Textbooks</i>, <i>Study Guides</i>, and <i>Flash Cards</i> are scattered about. A <i>Memory Enhancement Potion</i> and several <i>Caffeine Pills</i> suggest intense cramming sessions took place here.", isCombat: false },
            { title: "The Homesickness Shrine", description: "A small shrine built by homesick students contains <i>Family Photos</i>, <i>Letters from Home</i>, and <i>Comfort Items</i> like stuffed animals and blankets. The area radiates a sense of longing and nostalgia. A <i>Message Crystal</i> allows communication with distant family members.", isCombat: false }
            
            // ...existing code...
        ];

        // Function to generate a random encounter
        function generateEvent() {
            const randomIndex = Math.floor(Math.random() * forestEncounters.length);
            const randomEvent = forestEncounters[randomIndex];

            // Display the new event
            eventTitleEl.textContent = randomEvent.title;
            eventDescriptionEl.innerHTML = randomEvent.description; // Use innerHTML to render bold tags if any
            eventResultEl.style.display = 'block';
            
            // Add or remove the 'combat' class for styling
            if (randomEvent.isCombat) {
                eventTitleEl.classList.add('combat');
                eventTitleEl.textContent = "⚔️ " + randomEvent.title + " ⚔️";
            } else {
                eventTitleEl.classList.remove('combat');
            }

            // Add click handlers to any buttons in the description that don't already have onclick
            const buttons = eventDescriptionEl.querySelectorAll('button');
            buttons.forEach(button => {
                if (!button.getAttribute('onclick')) {
                    button.addEventListener('click', function() {
                        handleDynamicButton(this);
                    });
                }
            });

            // Smoothly scroll the event into view
            eventResultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Add click event listener to the generate button
        generateBtn.addEventListener('click', generateEvent);

        // Function to show all events in modal
        function showAllEvents() {
            const modal = document.getElementById('eventListModal');
            const eventsList = document.getElementById('allEventsList');
            const eventCounter = document.getElementById('eventCounter');
            
            // Count combat vs non-combat events
            const combatEvents = forestEncounters.filter(event => event.isCombat).length;
            const nonCombatEvents = forestEncounters.filter(event => !event.isCombat).length;
            
            eventCounter.innerHTML = `Total Events: ${forestEncounters.length} | Combat: ${combatEvents} | Non-Combat: ${nonCombatEvents}`;
            
            // Clear existing content
            eventsList.innerHTML = '';
            
            // Create list of all events
            forestEncounters.forEach((event, index) => {
                const eventItem = document.createElement('div');
                eventItem.className = 'event-list-item';
                
                const title = document.createElement('div');
                title.className = event.isCombat ? 'event-list-title combat' : 'event-list-title';
                title.textContent = event.isCombat ? `⚔️ ${event.title} ⚔️` : event.title;
                
                const description = document.createElement('div');
                description.className = 'event-list-description';
                description.innerHTML = event.description;
                
                eventItem.appendChild(title);
                eventItem.appendChild(description);
                eventsList.appendChild(eventItem);
            });
            
            modal.style.display = 'block';
        }

        // Function to filter events by type
        function filterEvents(filterType) {
            const eventsList = document.getElementById('allEventsList');
            const eventCounter = document.getElementById('eventCounter');
            
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (filterType === 'all') {
                document.getElementById('showAllBtn').classList.add('active');
            } else if (filterType === 'combat') {
                document.getElementById('showCombatBtn').classList.add('active');
            } else if (filterType === 'non-combat') {
                document.getElementById('showNonCombatBtn').classList.add('active');
            }
            
            // Filter events based on type
            let filteredEvents;
            if (filterType === 'combat') {
                filteredEvents = forestEncounters.filter(event => event.isCombat);
            } else if (filterType === 'non-combat') {
                filteredEvents = forestEncounters.filter(event => !event.isCombat);
            } else {
                filteredEvents = forestEncounters; // Show all
            }
            
            // Update counter
            const combatEvents = forestEncounters.filter(event => event.isCombat).length;
            const nonCombatEvents = forestEncounters.filter(event => !event.isCombat).length;
            let counterText;
            if (filterType === 'combat') {
                counterText = `Showing Combat Events: ${filteredEvents.length} of ${combatEvents}`;
            } else if (filterType === 'non-combat') {
                counterText = `Showing Non-Combat Events: ${filteredEvents.length} of ${nonCombatEvents}`;
            } else {
                counterText = `Total Events: ${forestEncounters.length} | Combat: ${combatEvents} | Non-Combat: ${nonCombatEvents}`;
            }
            eventCounter.innerHTML = counterText;
            
            // Clear and rebuild event list
            eventsList.innerHTML = '';
            filteredEvents.forEach((event, index) => {
                const eventItem = document.createElement('div');
                eventItem.className = 'event-list-item';
                
                const title = document.createElement('div');
                title.className = event.isCombat ? 'event-list-title combat' : 'event-list-title';
                title.textContent = event.isCombat ? `⚔️ ${event.title} ⚔️` : event.title;
                
                const description = document.createElement('div');
                description.className = 'event-list-description';
                description.innerHTML = event.description;
                
                eventItem.appendChild(title);
                eventItem.appendChild(description);
                eventsList.appendChild(eventItem);
            });
        }

        // Function to close the event list modal
        function closeEventList() {
            const modal = document.getElementById('eventListModal');
            modal.style.display = 'none';
        }

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('eventListModal');
            if (event.target === modal) {
                closeEventList();
            }
        }

        // Function to toggle reveal sections in event descriptions
        function toggleReveal(button) {
            const hiddenDiv = button.nextElementSibling;
            if (hiddenDiv && hiddenDiv.style.display === 'none') {
                hiddenDiv.style.display = 'block';
                button.style.display = 'none'; // Hide the button after clicking
            }
        }

        // Function to toggle sections that can be shown/hidden multiple times
        function toggleSection(button) {
            const hiddenDiv = button.nextElementSibling;
            if (hiddenDiv) {
                if (hiddenDiv.style.display === 'none' || hiddenDiv.style.display === '') {
                    hiddenDiv.style.display = 'block';
                    // Update button text to indicate it can be hidden
                    if (button.textContent.includes('Reveal')) {
                        button.textContent = button.textContent.replace('Reveal', 'Hide');
                    } else if (button.textContent.includes('Show')) {
                        button.textContent = button.textContent.replace('Show', 'Hide');
                    }
                } else {
                    hiddenDiv.style.display = 'none';
                    // Update button text back to reveal
                    if (button.textContent.includes('Hide')) {
                        button.textContent = button.textContent.replace('Hide', 'Reveal');
                    }
                }
            }
        }

        // Function for complex button interactions (like the one in the file)
        function complexToggle(button, revealText, hideText) {
            const hiddenDiv = button.nextElementSibling;
            if (hiddenDiv) {
                if (hiddenDiv.style.display === 'none' || hiddenDiv.style.display === '') {
                    hiddenDiv.style.display = 'block';
                    button.textContent = hideText;
                } else {
                    hiddenDiv.style.display = 'none';
                    button.textContent = revealText;
                }
            }
        }

        // Enhanced function to handle dynamic onclick attributes in event descriptions
        function handleDynamicButton(element) {
            // This function will be called by buttons that use onclick attributes
            // It handles the specific pattern used in some events
            const nextDiv = element.nextElementSibling;
            if (nextDiv) {
                if (nextDiv.style.display === 'none' || !nextDiv.style.display) {
                    nextDiv.style.display = 'block';
                    // Change button text if it contains 'Reveal'
                    if (element.textContent.includes('Reveal')) {
                        element.textContent = element.textContent.replace('Reveal', 'Hide');
                    }
                } else {
                    nextDiv.style.display = 'none';
                    // Change button text back
                    if (element.textContent.includes('Hide')) {
                        element.textContent = element.textContent.replace('Hide', 'Reveal');
                    }
                }
            }
        }

    </script>
