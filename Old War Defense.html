        function selectTowerToBuild(type) {
            selectedTower = type;
            selectedPlacedTower = null;
            towerInfoPanel.style.display = 'none';
            document.querySelectorAll('.tower-button').forEach(btn => btn.classList.remove('selected'));
            const button = Array.from(towerButtonsContainer.children).find(btn => btn.innerText.includes(TOWER_DATA[type].name));
            if(button) button.classList.add('selected');
        }

        function placeTower(mouseX, mouseY) {
            if (!selectedTower) return;
            const cost = TOWER_DATA[selectedTower].cost;
            if (essence < cost) {
                logMessage("Not enough essence!");
                return;
            }
            const tileX = Math.floor(mouseX / TILE_SIZE) * TILE_SIZE;
            const tileY = Math.floor(mouseY / TILE_SIZE) * TILE_SIZE;
            const tile = placementTiles.find(t => t.x === tileX && t.y === tileY);
            if (tile && !tile.occupied) {
                essence -= cost; // Subtract essence immediately
                tile.occupied = true;
                let newTower;
                switch(selectedTower) {
                    case 'archer': newTower = new ArcherTower(tileX, tileY, selectedTower); break;
                    case 'knight': newTower = new KnightTower(tileX, tileY, selectedTower); break;
                    case 'mage': newTower = new MageTower(tileX, tileY, selectedTower); break;
                    case 'monk': newTower = new MonkTower(tileX, tileY, selectedTower); break;
                    case 'centaur': newTower = new CentaurTower(tileX, tileY, selectedTower); break;
                    case 'beastrider': newTower = new BeastriderTower(tileX, tileY, selectedTower); break;
                    case 'animal': newTower = new ArcherTower(tileX, tileY, selectedTower); break; // Animal fighters use archer tower base
                    case 'cleric': newTower = new Tower(tileX, tileY, selectedTower); break; // Cleric uses base tower class
                }
                if (newTower) {
                    towers.push(newTower);
                } else {
                    logMessage("Failed to create tower!");
                    // Refund the essence if tower creation failed
                    essence += cost;
                    tile.occupied = false;
                }
                selectedTower = null;
                document.querySelectorAll('.tower-button').forEach(btn => btn.classList.remove('selected'));
            } else {
                logMessage("Cannot build here!");
            }
        }
        
        function selectPlacedTower(mouseX, mouseY) {
            const tileX = Math.floor(mouseX / TILE_SIZE) * TILE_SIZE;
            const tileY = Math.floor(mouseY / TILE_SIZE) * TILE_SIZE;
            const clickedTower = towers.find(t => t.x === tileX && t.y === tileY);
            selectedPlacedTower = clickedTower || null;
            towerInfoPanel.style.display = clickedTower ? 'block' : 'none';
            if (clickedTower) updateTowerInfoPanel(clickedTower);
        }
        
        function updateTowerInfoPanel(tower) {
            const data = TOWER_DATA[tower.type];
            
            // Update tower name with capstone/champion name if applicable
            let displayName = data.name;
            if (tower.champion && tower.capstone !== null && data.champions) {
                displayName = data.champions[tower.capstone].name;
            } else if (tower.capstone !== null && data.capstones) {
                displayName = data.capstones[tower.capstone].name;
            }
            
            document.getElementById('tower-name').textContent = displayName;
            document.getElementById('tower-level').textContent = `Level: ${tower.level + 1}${tower.champion ? ' (Champion)' : tower.capstone !== null ? ' (Capstone)' : ''}`;
            document.getElementById('tower-damage').textContent = `Damage: ${tower.dmg}`;
            document.getElementById('tower-range').textContent = `Range: ${tower.range}`;
            document.getElementById('tower-firerate').textContent = `Fire Rate: ${tower.fireRate}`;
            
            let specialText = '';
            if (tower.champion) {
                specialText = 'CHAMPION: Bypasses all resistances';
                if (tower.type === 'archer' && tower.bossDebuff) {
                    specialText += ', Applies movement debuff to bosses';
                }
                if (tower.type === 'knight' && tower.bossStun) {
                    specialText += ', Can stun/slow bosses';
                }
                if (tower.type === 'monk' && tower.chiBlast) {
                    specialText += ', Long-range chi blast';
                }
                if (tower.type === 'centaur' && tower.aoeBurst) {
                    specialText += ', AoE burst every 4 seconds';
                }
                if (tower.type === 'beastrider' && tower.spawnAnimals) {
                    specialText += ', Summons animal companions';
                }
                if (tower.type === 'mage') {
                    specialText += ', Enhanced AoE and effects';
                }
            } else {
                if (tower.type === 'monk') {
                    specialText = `Slow: ${Math.round(tower.slow * 100)}%`;
                    if (tower.capstone === 0) specialText += ', Buffs nearby towers';
                    if (tower.capstone === 1) specialText += `, Stun: ${Math.round(tower.stunChance * 100)}%`;
                }
                if (tower.type === 'centaur') {
                    specialText = `Stomp Dmg: ${tower.stompDmg}`;
                    if (tower.capstone === 0) specialText += ', Spin attack with slow';
                }
                if (tower.type === 'beastrider') {
                    specialText = `Stomp Dmg: ${tower.stompDmg}`;
                    if (tower.capstone === 0) specialText += ', Follows boss enemies';
                }
                if (tower.type === 'knight' && tower.capstone === 1) {
                    specialText = 'Ignores resistances';
                }
                if (tower.type === 'mage') {
                    if (tower.capstone === 0) specialText = 'Frost: AoE slow';
                    if (tower.capstone === 1) specialText = 'Fire: Burn DoT, ignores armor';
                }
                if (tower.type === 'archer') {
                    if (tower.capstone === 0) specialText = 'Artillerist: Rapid fire';
                    if (tower.capstone === 1) specialText = 'Sniper: Extended range';
                }
            }
            
            document.getElementById('tower-special').textContent = specialText;
            
            const upgradeButton = document.getElementById('upgrade-button');
            
            // Check if this tower type can be upgraded
            if (data.stats[0].noUpgrade) {
                upgradeButton.textContent = 'Cannot Upgrade';
                upgradeButton.disabled = true;
            } else if (tower.champion) {
                upgradeButton.textContent = 'Max Level (Champion)';
                upgradeButton.disabled = true;
            } else if (tower.capstone !== null && data.champions) {
                const championCost = data.cost * 10;
                upgradeButton.textContent = `Champion Upgrade (${championCost} E)`;
                upgradeButton.disabled = false;
            } else if (tower.capstone !== null) {
                upgradeButton.textContent = 'Max Level';
                upgradeButton.disabled = true;
            } else if (tower.level === 2) {
                const upgradeCost = data.cost * 3;
                upgradeButton.textContent = `Capstone Upgrade (${upgradeCost} E)`;
                upgradeButton.disabled = false;
            } else if (tower.level < data.stats.length - 1) {
                const upgradeCost = data.cost * (tower.level + 1.5);
                upgradeButton.textContent = `Upgrade (${Math.floor(upgradeCost)} E)`;
                upgradeButton.disabled = false;
            } else {
                upgradeButton.textContent = 'Ready for Capstone';
                upgradeButton.disabled = true;
            }
            
            const sellValue = Math.floor((data.cost + (data.cost * (tower.level * 1.5))) * 0.75);
            document.getElementById('sell-button').textContent = `Sell (${sellValue} E)`;
            
            // Hide any old champion ability buttons
            const championAbilityButton = document.getElementById('champion-ability-button');
            if (championAbilityButton) {
                championAbilityButton.style.display = 'none';
            }

        function sellSelectedTower() {
            if (!selectedPlacedTower) return;
            const data = TOWER_DATA[selectedPlacedTower.type];
            const sellValue = Math.floor((data.cost + (data.cost * (selectedPlacedTower.level * 1.5))) * 0.75);
            essence += sellValue;
            const tile = placementTiles.find(t => t.x === selectedPlacedTower.x && t.y === selectedPlacedTower.y);
            if (tile) tile.occupied = false;
            towers = towers.filter(t => t !== selectedPlacedTower);
            selectedPlacedTower = null;
            towerInfoPanel.style.display = 'none';
            updateAvailableTowers(); // Check if towers should be locked again
        }

        async function startNextWave() {
            if (waveInProgress) return;
            
            // Reset endless mode timer when starting a wave
            endlessModeTimer = 0;
            
            waveInProgress = true;
            currentWaveSpawning = true;
            wave++;
            startWaveButton.classList.add('disabled');
            logMessage(`Wave ${wave} incoming!`, 'wave-announcement');
            updateUI();

            // Generate wave based on current game mode
            let waveData;
            if (chaosMode) {
                waveData = generateChaosWave(wave);
            } else {
                waveData = generateWave(wave);
            }

            // --- Wave Details Box Update ---
            // Build a summary of the enemy composition for this wave
            let details = `Wave ${wave}: `;
            if (waveData.enemies && Object.keys(waveData.enemies).length > 0) {
                const enemyCounts = [];
                for (const [type, count] of Object.entries(waveData.enemies)) {
                    const enemyName = ENEMY_DATA[type]?.name || type;
                    enemyCounts.push(`${count} ${enemyName}${count > 1 ? 's' : ''}`);
                }
                details += enemyCounts.join(', ');
            } else {
                details += 'Special event!';
            }
            setWaveDetails(details);
            
            // Check for special wave types
            if (waveData.goldenQueen) {
                const queenLevel = waveData.queenLevel;
                const titles = [
                    '', // 0 placeholder
                    'RESPLENDENT',
                    'RADIANT', 
                    'BRILLIANT',
                    'INCANDESCENT',
                    'TRANSCENDENT',
                    'EMPOWERED',
                    'ULTIMATE'
                ];
                const title = titles[Math.min(7, queenLevel)];
                logMessage(`🌟 ${title} GOLDEN QUEEN RETURNS! 🌟`, 'boss-announcement');
                logMessage(`The Shadow Empress has ascended to ${title.toLowerCase()} power!`, 'boss-announcement');
            } else if (waveData.boss) {
                logMessage(`A powerful boss approaches!`, 'boss-announcement');
            } else if (waveData.dragon) {
                logMessage(`A Darkforged Dragon emerges!`, 'boss-announcement');
                // Spawn dragon mid-boss with varied positioning
                const spawnPos = getVariedFlyingSpawnPosition();
                const dragon = new Enemy('darkforgeddragon', ENEMY_DATA['darkforgeddragon'], spawnPos);
                enemies.push(dragon);
            }
            
            // Check for portal spawning (waves 5+)
            if (shouldSpawnPortal(wave)) {
                let weakerEnemies = [];
                try {
                    weakerEnemies = getWeakerEnemies(waveData.enemies);
                } catch (err) {
                    console.error('Portal spawn selection failed:', err);
                    weakerEnemies = [];
                }
                if (weakerEnemies.length > 0) {
                    // MUCH more aggressive portal spawning throughout the game
                    let portalCount = 1;
                    
                    // Early game (5-15): Start with 1 portal, build up
                    if (wave >= 5 && wave < 10) {
                        portalCount = 1;
                    } else if (wave >= 10 && wave < 15) {
                        portalCount = Math.random() < 0.4 ? 2 : 1; // 40% chance for 2 portals
                    } else if (wave >= 15 && wave < 20) {
                        portalCount = Math.random() < 0.6 ? 2 : 1; // 60% chance for 2 portals
                    } else if (wave >= 20 && wave < 25) {
                        portalCount = Math.random() < 0.5 ? 3 : 2; // 50% chance for 3, 50% for 2
                    } else if (wave >= 25 && wave < 30) {
                        portalCount = Math.random() < 0.7 ? 3 : 2; // 70% chance for 3, 30% for 2
                    } else if (wave >= 30 && wave < 35) {
                        portalCount = Math.random() < 0.4 ? 4 : 3; // 40% chance for 4, 60% for 3
                    } else if (wave >= 35 && wave <= 40) {
                        portalCount = Math.random() < 0.6 ? 4 : 3; // 60% chance for 4, 40% for 3
                    }
                    
                    // Late game: Portal CHAOS
                    if (wave > 40) {
                        portalCount = 4; // Minimum 4 portals
                        if (wave > 45) {
                            portalCount = Math.random() < 0.7 ? 5 : 4; // 70% chance for 5 portals, 30% for 4
                        }
                        if (wave > 50) {
                            portalCount = Math.random() < 0.6 ? 6 : 5; // 60% chance for 6 portals, 40% for 5
                        }
                        if (wave > 55) {
                            portalCount = Math.random() < 0.5 ? 7 : 6; // 50% chance for 7 portals, 50% for 6
                        }
                        if (wave > 60) {
                            portalCount = Math.random() < 0.4 ? 8 : 7; // 40% chance for 8 portals, 60% for 7
                        }
                    }
                    
                    // Spawn multiple portals if needed
                    for (let i = 0; i < portalCount; i++) {
                        // Split enemies among multiple portals
                        const enemiesPerPortal = Math.ceil(weakerEnemies.length / portalCount);
                        const startIndex = i * enemiesPerPortal;
                        const endIndex = Math.min(startIndex + enemiesPerPortal, weakerEnemies.length);
                        const portalEnemies = weakerEnemies.slice(startIndex, endIndex);
                        
                        if (portalEnemies.length > 0) {
                            const portalPos = getRandomMidFieldPosition();
                            const portal = new Portal(portalPos.x, portalPos.y, portalEnemies);
                            portals.push(portal);
                        }
                    }
                    
                    if (wave === 5) {
                        logMessage(`NEW THREAT: Shadow portals begin tearing open across the battlefield!`, 'boss-announcement');
                    }
                    
                    // Dynamic message based on portal count
                    if (portalCount === 1) {
                        logMessage(`A shadow portal tears open in the mid-field!`, 'wave-announcement');
                    } else if (portalCount === 2) {
                        logMessage(`Two shadow portals rip through the battlefield!`, 'wave-announcement');
                    } else if (portalCount === 3) {
                        logMessage(`Three shadow portals tear reality apart!`, 'wave-announcement');
                    } else if (portalCount === 4) {
                        logMessage(`Four shadow portals shatter the dimensional barriers!`, 'wave-announcement');
                    } else if (portalCount <= 6) {
                        logMessage(`${portalCount} shadow portals create chaos across the battlefield!`, 'wave-announcement');
                    } else {
                        logMessage(`${portalCount} shadow portals tear the very fabric of reality asunder!`, 'wave-announcement');
                    }
                }
            }
            
            const spawnList = [];
            for (const type in waveData.enemies) {
                for (let i = 0; i < waveData.enemies[type]; i++) spawnList.push(type);
            }
            
            for (const type of spawnList) {
                let newEnemy;
                const enemyData = ENEMY_DATA[type];
                
                // Check if this is a large enemy that needs extra spawn delay
                const isLargeEnemy = enemyData.special === 'titan' || 
                                   enemyData.special === 'empress' ||
                                   enemyData.special === 'titanBeast' ||
                                   enemyData.special === 'hordekeepTitan' ||
                                   type.includes('darkforgedhorde') ||
                                   type.includes('darklingdrillteam') ||
                                   type === 'darktitanabomination' ||
                                   enemyData.boss || 
                                   enemyData.midBoss;
                
                // Use varied spawn positions for flying enemies
                if (enemyData.special === 'zigzag') {
                    const spawnPos = getVariedFlyingSpawnPosition();
                    newEnemy = new Enemy(type, enemyData, spawnPos);
                } else if (enemyData.special === 'titan' || enemyData.special === 'empress' || enemyData.special === 'titanBeast' || enemyData.special === 'hordekeepTitan') {
                    // Use varied spawn positions for titans and empress
                    const spawnPos = getVariedTitanSpawnPosition();
                    newEnemy = new Enemy(type, enemyData, spawnPos);
                    
                    // Add message based on spawn position
                    if (enemyData.special === 'titan') {
                        const positionMsg = spawnPos.position === 'center' ? 'center' : 
                                          spawnPos.position === 'top' ? 'northern flank' : 'southern flank';
                        logMessage(`Titan approaches from the ${positionMsg}!`, 'boss-announcement');
                    } else if (enemyData.special === 'titanBeast') {
                        const positionMsg = spawnPos.position === 'center' ? 'center' : 
                                          spawnPos.position === 'top' ? 'northern flank' : 'southern flank';
                        logMessage(`Titan Beast emerges from the ${positionMsg}!`, 'boss-announcement');
                    } else if (enemyData.special === 'hordekeepTitan') {
                        const positionMsg = spawnPos.position === 'center' ? 'center' : 
                                          spawnPos.position === 'top' ? 'northern flank' : 'southern flank';
                        logMessage(`Hordekeeper Titan marches from the ${positionMsg}!`, 'boss-announcement');
                    } else if (enemyData.special === 'empress') {
                        const positionMsg = spawnPos.position === 'center' ? 'center' : 
                                          spawnPos.position === 'top' ? 'northern shadow' : 'southern shadow';
                        
                        // Special messages for Golden Queens
                        if (newEnemy.isGoldenQueen) {
                            logMessage(`✨ THE GOLDEN QUEEN manifests from the ${positionMsg}! ✨`, 'boss-announcement');
                        } else {
                            logMessage(`THE SHADOW EMPRESS emerges from the ${positionMsg}!`, 'boss-announcement');
                        }
                    }
                } else {
                    newEnemy = new Enemy(type, enemyData);
                }
                
                // Post-wave 40 enhancements
                if (wave > 40) {
                    // Enable blink for non-boss enemies (30% chance)
                    if (!newEnemy.boss && !newEnemy.midBoss && Math.random() < 0.3) {
                        newEnemy.canBlink = true;
                    }
                    
                    // Scale HP for all enemies based on wave number
                    const cycleNumber = Math.floor((wave - 1) / 40) + 1;
                    const hpMultiplier = 1 + (cycleNumber - 1) * 0.5; // 50% more HP per cycle after 40
                    newEnemy.hp = Math.floor(newEnemy.hp * hpMultiplier);
                    newEnemy.maxHp = newEnemy.hp;

                    // Golden Queen tuning: reduce HP by ~45% for waves 60+
                    if (wave >= 60 && newEnemy.isGoldenQueen) {
                        newEnemy.hp = Math.floor(newEnemy.hp * 0.55);
                        newEnemy.maxHp = newEnemy.hp;
                    }
                }
                
                enemies.push(newEnemy);
                
                // Enhanced staggered spawning with much longer delays for large enemies
                let baseDelay = waveData.interval;
                
                if (isLargeEnemy) {
                    // Much longer delays for large enemies to prevent clustering
                    if (enemyData.special === 'titan' || enemyData.special === 'empress' || enemyData.special === 'titanBeast' || enemyData.special === 'hordekeepTitan') {
                        baseDelay = baseDelay * 3; // 3x longer delay for titans/empress/titan beasts
                    } else if (type.includes('darkforgedhorde')) {
                        baseDelay = baseDelay * 2; // 2x longer delay for horde units
                    } else if (type.includes('darklingdrillteam')) {
                        baseDelay = baseDelay * 2; // 2x longer delay for drill teams
                    } else if (enemyData.boss || enemyData.midBoss) {
                        baseDelay = baseDelay * 4; // 4x longer delay for bosses
                    } else {
                        baseDelay = baseDelay * 1.5; // 1.5x longer delay for other large enemies
                    }
                }
                
                const variation = Math.random() * baseDelay * 0.5;
                const spawnDelay = baseDelay + variation;
                await new Promise(resolve => setTimeout(resolve, spawnDelay));
            }
            
            // Wave spawning finished
            currentWaveSpawning = false;
            logMessage(`Wave ${wave} spawning complete.`);
        }
        
        function queueNextWave(event = null) {
            // Check if the button is disabled
            if (queueWaveButton.disabled) {
                return;
            }
            
            // Check for Ctrl+Shift modifier for extended queuing
            const isExtendedQueue = event && event.ctrlKey && event.shiftKey;
            const maxQueue = isExtendedQueue ? 10 : 2;
            
            if (waveQueue < maxQueue && waveInProgress) {
                waveQueue++;
                const queueText = isExtendedQueue ? `(Queue: ${waveQueue}/10)` : `(Queue: ${waveQueue}/2)`;
                logMessage(`Wave ${wave + waveQueue} queued! ${queueText}`);
                updateUI();
            } else if (!waveInProgress) {
                logMessage("Cannot queue - no wave in progress!");
            } else if (waveQueue >= maxQueue) {
                const maxText = isExtendedQueue ? "(10/10)" : "(2/2)";
                logMessage(`Queue is full! ${maxText}`);
            }
        }

        // --- Save/Load System ---
        const SAVE_KEY = 'old-war-defense-save-v1';

        function serializeTowers() {
            return towers.map(t => ({
                x: t.x,
                y: t.y,
                type: t.type,
                level: t.level,
                capstone: t.capstone,
                champion: !!t.champion,
                // type-specific flags (persist if present)
                bossDebuff: t.bossDebuff || false,
                bossStun: t.bossStun || false,
                chiBlast: t.chiBlast || false,
                aoeBurst: t.aoeBurst || false,
                spawnAnimals: t.spawnAnimals || false
            }));
        }

        function reconstructTowerFromSave(s) {
            let newTower = null;
            switch (s.type) {
                case 'archer': newTower = new ArcherTower(s.x, s.y, s.type); break;
                case 'knight': newTower = new KnightTower(s.x, s.y, s.type); break;
                case 'mage': newTower = new MageTower(s.x, s.y, s.type); break;
                case 'monk': newTower = new MonkTower(s.x, s.y, s.type); break;
                case 'centaur': newTower = new CentaurTower(s.x, s.y, s.type); break;
                case 'beastrider': newTower = new BeastriderTower(s.x, s.y, s.type); break;
                case 'animal': newTower = new ArcherTower(s.x, s.y, s.type); break; // Animal fighters use archer base
                case 'cleric': newTower = new Tower(s.x, s.y, s.type); break; // Cleric uses base
                default: return null;
            }
            if (!newTower) return null;
            // Restore progression
            newTower.level = Math.max(0, s.level || 0);
            newTower.capstone = (s.capstone === 0 || s.capstone === 1) ? s.capstone : (s.capstone === null ? null : null);
            newTower.champion = !!s.champion;
            // Restore type-specific flags if applicable
            if ('bossDebuff' in s) newTower.bossDebuff = !!s.bossDebuff;
            if ('bossStun' in s) newTower.bossStun = !!s.bossStun;
            if ('chiBlast' in s) newTower.chiBlast = !!s.chiBlast;
            if ('aoeBurst' in s) newTower.aoeBurst = !!s.aoeBurst;
            if ('spawnAnimals' in s) newTower.spawnAnimals = !!s.spawnAnimals;
            // Recalculate stats based on restored state
            if (typeof newTower.updateStats === 'function') newTower.updateStats();
            return newTower;
        }

        function getSaveData() {
            return {
                version: 1,
                wave,
                essence,
                lives,
                hardMode,
                chaosMode,
                endlessMode,
                waveQueue,
                towers: serializeTowers()
            };
        }

        function saveGame(manual = false) {
            try {
                const data = getSaveData();
                localStorage.setItem(SAVE_KEY, JSON.stringify(data));
                if (manual) {
                    setWaveDetails('Game saved.');
                }
                updateSaveButtons();
            } catch (e) {
                console.error('Save failed', e);
                if (manual) setWaveDetails('Save failed.');
            }
        }

        function syncModeButtons() {
            // Reflect mode booleans on their respective buttons without toggling
            if (endlessModeButton) {
                endlessModeButton.textContent = endlessMode ? 'Disable Endless Mode' : 'Enable Endless Mode';
                endlessModeButton.classList.toggle('endless-active', !!endlessMode);
            }
            if (hardModeButton) {
                hardModeButton.textContent = hardMode ? 'Normal Mode' : 'Hard Mode';
                hardModeButton.classList.toggle('active', !!hardMode);
            }
            if (chaosModeButton) {
                chaosModeButton.textContent = chaosMode ? 'Normal Mode' : 'Chaos Mode';
                chaosModeButton.classList.toggle('active', !!chaosMode);
            }
        }

        function loadGame() {
            try {
                const raw = localStorage.getItem(SAVE_KEY);
                if (!raw) {
                    setWaveDetails('No saved game found.');
                    return;
                }
                const data = JSON.parse(raw);

                // Restore core state
                wave = Math.max(0, data.wave || 0);
                essence = Math.max(0, data.essence || 0);
                lives = Math.max(0, data.lives || 0);
                hardMode = !!data.hardMode;
                chaosMode = !!data.chaosMode;
                endlessMode = !!data.endlessMode;
                waveQueue = Math.max(0, data.waveQueue || 0);

                // Adjust path for hard mode, rebuild placement tiles
                path = hardMode ? hardPath : normalPath;
                setupPlacementTiles();

                // Clear dynamic entities
                enemies = [];
                projectiles = [];
                particles = [];
                portals = [];
                waveInProgress = false;
                currentWaveSpawning = false;
                selectedTower = null;
                selectedPlacedTower = null;

                // Rebuild towers and mark tiles occupied
                towers = [];
                if (Array.isArray(data.towers)) {
                    for (const s of data.towers) {
                        const t = reconstructTowerFromSave(s);
                        if (t) {
                            towers.push(t);
                            const tile = placementTiles.find(pt => pt.x === t.x && pt.y === t.y);
                            if (tile) tile.occupied = true;
                        }
                    }
                }

                // Update derived availability and UI
                updateAvailableTowers();
                syncModeButtons();
                updateUI();
                setWaveDetails('Game loaded.');
            } catch (e) {
                console.error('Load failed', e);
                setWaveDetails('Load failed.');
            }
        }

        function clearSavedGame() {
            try {
                localStorage.removeItem(SAVE_KEY);
                updateSaveButtons();
                setWaveDetails('Saved game cleared.');
            } catch (e) {
                console.error('Clear save failed', e);
                setWaveDetails('Clear save failed.');
            }
        }

        let saveButton, loadButton, clearSaveButton;
        function updateSaveButtons() {
            const hasSave = !!localStorage.getItem(SAVE_KEY);
            if (loadButton) loadButton.disabled = !hasSave;
            if (clearSaveButton) clearSaveButton.disabled = !hasSave;
        }
        
        function logMessage(message, className = '') {
            // If the message is a resource/essence warning or upgrade/sell info, show it in the wave details box
            const importantPhrases = [
                'Not enough essence',
                'cannot be upgraded',
                'already at maximum level',
                'can be upgraded to Champion level',
                'is ready for capstone upgrade',
                'Upgraded',
                'Sell',
                'Champion Upgrade',
                'Capstone Upgrade'
            ];
            if (importantPhrases.some(phrase => message.includes(phrase))) {
                setWaveDetails(message);
                return;
            }
            // Otherwise, ignore or handle as needed (could add more routing if desired)
        }

        // --- Main Game Loop ---
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawMap();
            drawPlacementOverlay(mouse.x, mouse.y);
            towers.filter(tower => tower).forEach(tower => tower.update()); // Filter out undefined towers
            
            // Update portals
            portals = portals.filter(portal => {
                const alive = portal.update();
                if (alive) {
                    portal.draw();
                }
                return alive;
            });
            
            enemies = enemies.filter(enemy => {
                if (enemy.hp <= 0) {
                    if (!enemy.leaked) {
                        essence += enemy.getEssenceReward();
                        
                        // Special defeat message for Golden Queens
                        if (enemy.isGoldenQueen) {
                            const titles = [
                                '', // 0 placeholder
                                'RESPLENDENT',
                                'RADIANT', 
                                'BRILLIANT',
                                'INCANDESCENT',
                                'TRANSCENDENT',
                                'EMPOWERED',
                                'ULTIMATE'
                            ];
                            
                            // Determine queen level from type
                            let queenLevel = 1;
                            if (enemy.type.includes('_2')) queenLevel = 2;
                            else if (enemy.type.includes('_3')) queenLevel = 3;
                            else if (enemy.type.includes('_4')) queenLevel = 4;
                            else if (enemy.type.includes('_5')) queenLevel = 5;
                            else if (enemy.type.includes('_6')) queenLevel = 6;
                            else if (enemy.type.includes('max')) queenLevel = 7;
                            
                            const title = titles[Math.min(7, queenLevel)];
                            const essenceGained = enemy.getEssenceReward();
                            logMessage(`🌟 ${title} GOLDEN QUEEN DEFEATED! +${essenceGained} essence! 🌟`, 'boss-announcement');
                            
                            // Create victory sparkle effect
                            for (let i = 0; i < 30; i++) {
                                particles.push({
                                    x: enemy.x + (Math.random() - 0.5) * 120,
                                    y: enemy.y + (Math.random() - 0.5) * 120,
                                    vx: (Math.random() - 0.5) * 8,
                                    vy: (Math.random() - 0.5) * 8,
                                    life: 60,
                                    color: '#fbbf24',
                                    type: 'spark'
                                });
                            }
                        }
                    }
                    return false;
                }
                return true;
            });
            enemies.forEach(enemy => enemy.update());
            projectiles = projectiles.filter(p => p.update());
            projectiles.forEach(p => p.draw());
            particles = particles.filter(p => {
                if (p.type === 'spark') {
                    // Handle spark particles from portals
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.95;
                    p.vy *= 0.95;
                    p.life--;
                    
                    ctx.globalAlpha = p.life / 30;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                    
                    return p.life > 0;
                } else if (p.type === 'blink') {
                    // Handle blink effect particles
                    p.life--;
                    ctx.globalAlpha = p.life / 30;
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    // Ensure radius is always positive
                    const blinkRadius = Math.max(0.1, p.radius * Math.max(0.1, 1 - p.life/30));
                    ctx.arc(p.x, p.y, blinkRadius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                    
                    return p.life > 0;
                } else if (p.type === 'immune') {
                    // Handle immunity indication particles
                    p.life--;
                    p.y -= 1; // Float upward
                    ctx.globalAlpha = p.life / 30;
                    ctx.fillStyle = p.color;
                    ctx.font = '14px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('IMMUNE!', p.x, p.y);
                    ctx.globalAlpha = 1.0;
                    
                    return p.life > 0;
                } else if (p.type === 'poison') {
                    // Handle poison effect particles
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.9;
                    p.vy *= 0.9;
                    p.life--;
                    
                    ctx.globalAlpha = p.life / 30;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                    
                    return p.life > 0;
                } else if (p.type === 'tower_disable') {
                    // Handle tower disable effect particles
                    p.life--;
                    ctx.globalAlpha = p.life / 180; // Fade over 3 seconds
                    ctx.fillStyle = p.color;
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('DISABLED', p.x, p.y - 15);
                    ctx.globalAlpha = 1.0;
                    
                    return p.life > 0;
                } else if (p.type === 'dark_curse') {
                    // Handle dark curse effect particles
                    p.life--;
                    ctx.globalAlpha = (p.life / 300) * 0.7; // Fade over 5 seconds
                    ctx.fillStyle = p.color;
                    ctx.font = '10px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('CURSED', p.x, p.y - 20);
                    
                    // Add dark energy effect
                    const phase = (300 - p.life) * 0.1;
                    ctx.beginPath();
                    ctx.arc(p.x + Math.cos(phase) * 8, p.y + Math.sin(phase) * 8, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                    
                    return p.life > 0;
                } else if (p.type === 'drill_spark') {
                    // Handle drill spark particles
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.9;
                    p.vy *= 0.9;
                    p.life--;
                    
                    ctx.globalAlpha = p.life / 20;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                    
                    return p.life > 0;
                } else if (p.type === 'emergency_spawn' || p.type === 'spawn') {
                    // Handle spawn effect particles
                    p.life--;
                    ctx.globalAlpha = p.life / 30;
                    ctx.strokeStyle = p.color;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    const spawnRadius = Math.max(0.1, p.radius * (1 - p.life/30));
                    ctx.arc(p.x, p.y, spawnRadius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.globalAlpha = 1.0;
                    
                    return p.life > 0;
                } else if (p.type === 'dark_explosion') {
                    // Handle dark explosion particles
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.95;
                    p.vy *= 0.95;
                    p.life--;
                    
                    ctx.globalAlpha = p.life / 40;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                    
                    return p.life > 0;
                } else {
                    // Handle regular particles
                    p.life--;
                    ctx.globalAlpha = p.life / 20;
                    ctx.fillStyle = p.color || 'white';
                    ctx.beginPath();
                    // Ensure radius is always positive
                    const particleRadius = Math.max(0.1, p.radius * Math.max(0.1, 1 - p.life/20));
                    ctx.arc(p.x, p.y, particleRadius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                    
                    return p.life > 0;
                }
            });

            // Wave completion check now includes portals
            if (waveInProgress && enemies.length === 0 && !currentWaveSpawning && portals.length === 0) {
                waveInProgress = false;
                startWaveButton.classList.remove('disabled');
                const waveBonus = 25 + wave * 5;
                essence += waveBonus;
                logMessage(`Wave ${wave} cleared! +${waveBonus} Essence.`);
                // Auto-save on wave completion
                saveGame(false);
                
                // Reset endless mode timer when wave completes
                if (endlessMode) {
                    endlessModeTimer = 0;
                }
                
                // Check if there are queued waves to start immediately
                if (waveQueue > 0) {
                    waveQueue--;
                    updateUI();
                    logMessage(`Starting queued wave... (${waveQueue} remaining in queue)`);
                    // Small delay before starting queued wave
                    setTimeout(() => {
                        startNextWave();
                    }, 500);
                } else {
                    // If no waves are queued, reset the UI
                    updateUI();
                }
            }
            
            // Handle endless mode auto-start
            if (!waveInProgress && endlessMode && lives > 0) {
                endlessModeTimer++;
                if (endlessModeTimer >= ENDLESS_MODE_DELAY) {
                    endlessModeTimer = 0;
                    logMessage('Endless Mode: Auto-starting next wave...', 'wave-announcement');
                    startNextWave();
                }
            }
            
            updateUI();
            
            if (lives <= 0) {
                logMessage("The school gates have fallen!", "boss-announcement");
                cancelAnimationFrame(animationFrameId);
                return;
            }
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- Event Listeners ---
        let mouse = { x: 0, y: 0 };
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener('click', e => {
            if (selectedTower) {
                placeTower(mouse.x, mouse.y);
            } else {
                selectPlacedTower(mouse.x, mouse.y);
            }
        });
        
        startWaveButton.addEventListener('click', () => {
            if (!endlessMode) {
                startNextWave();
            }
        });
        queueWaveButton.addEventListener('click', (event) => queueNextWave(event));
        endlessModeButton.addEventListener('click', toggleEndlessMode);
        hardModeButton.addEventListener('click', toggleHardMode);
        chaosModeButton.addEventListener('click', toggleChaosMode);
        document.getElementById('upgrade-button').addEventListener('click', () => selectedPlacedTower?.upgrade());
        document.getElementById('sell-button').addEventListener('click', sellSelectedTower);

        // Keyboard hotkeys for towers and upgrades
        document.addEventListener('keydown', e => {
            keysPressed.add(e.key);
            
            // Check for cheat console activation (` and = pressed together)
            if (keysPressed.has('`') && keysPressed.has('=')) {
                showCheatConsole();
                return;
            }
            
            const key = e.key.toLowerCase();
            // Tower hotkeys
            if (key === 'a') selectTowerToBuild('archer');
            else if (key === 'k') selectTowerToBuild('knight');
            else if (key === 'm') selectTowerToBuild('mage');
            else if (key === 'o') selectTowerToBuild('monk');
            else if (key === 'c') selectTowerToBuild('centaur');
            else if (key === 'b') selectTowerToBuild('beastrider');
            else if (key === 'n' && availableTowers.includes('animal')) selectTowerToBuild('animal');
            else if (key === 'l' && availableTowers.includes('cleric')) selectTowerToBuild('cleric');
            // Upgrade hotkey
            else if (key === 'u' && selectedPlacedTower) selectedPlacedTower.upgrade();
            // Sell hotkey
            else if (key === 's' && selectedPlacedTower) sellSelectedTower();
        });

        document.addEventListener('keyup', e => {
            keysPressed.delete(e.key);
        });

        // --- Initialization ---
        setupPlacementTiles();
        populateTowerButtons();
        updateUI();
        
        let isGameStarted = false;
        function initialDraw() {
            if (isGameStarted) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawMap();
            towers.filter(tower => tower).forEach(tower => tower.draw()); // Filter out undefined towers
            drawPlacementOverlay(mouse.x, mouse.y);
            requestAnimationFrame(initialDraw);
        }
        
        startWaveButton.addEventListener('click', () => {
            if (!isGameStarted) {
                isGameStarted = true;
                gameLoop();
            }
        });

        // Create Save/Load/Clear buttons next to the Hard/Chaos mode buttons (top controls)
        try {
            const modeContainer = document.getElementById('hard-mode-button')?.parentElement;
            if (modeContainer) {
                saveButton = document.createElement('button');
                saveButton.id = 'save-button';
                saveButton.className = 'mode-button';
                saveButton.textContent = 'Save Game';
                saveButton.addEventListener('click', () => saveGame(true));

                loadButton = document.createElement('button');
                loadButton.id = 'load-button';
                loadButton.className = 'mode-button';
                loadButton.textContent = 'Load Game';
                loadButton.addEventListener('click', () => loadGame());

                clearSaveButton = document.createElement('button');
                clearSaveButton.id = 'clear-save-button';
                clearSaveButton.className = 'mode-button';
                clearSaveButton.textContent = 'Clear Save';
                clearSaveButton.addEventListener('click', () => clearSavedGame());

                modeContainer.appendChild(saveButton);
                modeContainer.appendChild(loadButton);
                modeContainer.appendChild(clearSaveButton);

                updateSaveButtons();
            }
        } catch (e) {
            console.error('Failed to create save/load buttons', e);
        }

        initialDraw();

        
        // Cheat Console Event Listeners
        document.getElementById('cheat-execute').addEventListener('click', () => {
            const cheatCode = cheatInput.value.trim();
            if (cheatCode) {
                executeCheat(cheatCode);
                hideCheatConsole();
            }
        });

        document.getElementById('cheat-close').addEventListener('click', () => {
            hideCheatConsole();
        });

        cheatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const cheatCode = cheatInput.value.trim();
                if (cheatCode) {
                    executeCheat(cheatCode);
                    hideCheatConsole();
                }
            } else if (e.key === 'Escape') {
                hideCheatConsole();
            }
        });

    </script>
</body>
</html>
