            `;

            const mount = mountEl || dungeonOutput || output;
            if (!mount) return;
            mount.innerHTML = html;
            updateBestiaryStatusElements();
            const container = document.getElementById('dungeon-grid');
            if (!container) return;

            // Wire bestiary loader (map sidebar)
            const bestiaryMsg = document.getElementById('dungeon-bestiary-msg');
            const setMsg = (text, tone) => {
                if (!bestiaryMsg) return;
                bestiaryMsg.className = `text-xs mt-1 ${tone || 'text-gray-400'}`;
                bestiaryMsg.textContent = text || '';
            };

            const hasEmbeddedBestiary = !!(window?.bestiaryBridge?.getBundledBestiaryText);
            if (hasEmbeddedBestiary) {
                setMsg('Bundled bestiary is embedded and ready.', 'text-green-300');
            } else if (location?.protocol === 'file:') {
                setMsg('Tip: Running from file:// ,  use "Load file" to import your bestiary JSON. (Bundled loading uses fetch and is hidden here.)', 'text-gray-500');
            }

            if (!bestiaryState?.index) {
                setMsg('Loading bundled bestiary...', 'text-gray-400');
                ensureBundledBestiaryLoaded({ force: true }).then((out) => {
                    if (out?.ok) setMsg(`Loaded ${out.count} entries from ${out.source}.`, 'text-green-300');
                    else if (!out?.alreadyTried) setMsg(out?.error || 'Failed to load bundled bestiary.', 'text-rose-300');
                });
            }

            if (!bestiaryState?.index) {
                setMsg('Loading bundled bestiary...', 'text-gray-400');
                ensureBundledBestiaryLoaded({ force: true }).then((out) => {
                    if (out?.ok) setMsg(`Loaded ${out.count} entries from ${out.source}.`, 'text-green-300');
                    else if (!out?.alreadyTried) setMsg(out?.error || 'Failed to load bundled bestiary.', 'text-rose-300');
                });
            }

            document.getElementById('dungeon-bestiary-clear')?.addEventListener('click', () => {
                clearBestiary();
                updateBestiaryStatusElements();
                setMsg('Bestiary cleared.', 'text-gray-400');
            });
            document.getElementById('dungeon-bestiary-bundled')?.addEventListener('click', async () => {
                setMsg('Loading bundled bestiary...', 'text-gray-400');
                const out = await loadBundledBestiary();
                if (out.ok) setMsg(`Loaded ${out.count} entries from ${out.source}.`, 'text-green-300');
                else setMsg(out.error || 'Failed to load bundled bestiary.', 'text-rose-300');
            });
            document.getElementById('dungeon-bestiary-load')?.addEventListener('click', async () => {
                const input = document.getElementById('dungeon-bestiary-file');
                const f = input?.files?.[0];
                if (!f) {
                    setMsg('Choose a JSON file first.', 'text-rose-300');
                    return;
                }
                try {
                    const text = await f.text();
                    const out = setBestiaryFromJsonText(text, f.name);
                    if (out.ok) {
                        updateBestiaryStatusElements();
                        setMsg(`Loaded ${out.count} entries from ${f.name}.`, 'text-green-300');
                    } else {
                        setMsg(out.error || 'Failed to load bestiary.', 'text-rose-300');
                    }
                } catch (e) {
                    setMsg(`Failed to read file: ${e?.message || e}`, 'text-rose-300');
                }
            });

            const commandMsg = document.getElementById('dungeon-command-msg');
            const setCommandMsg = (text, tone) => {
                if (!commandMsg) return;
                commandMsg.className = `text-xs mt-1 ${tone || 'text-gray-400'}`;
                commandMsg.textContent = text || '';
            };
            const runCommandFromInput = () => {
                const input = document.getElementById('dungeon-command-input');
                const cmd = input?.value || '';
                const out = runDungeonCommand(cmd);
                if (out.ok) setCommandMsg(out.message || 'Command applied.', 'text-green-300');
                else setCommandMsg(out.error || 'Command failed.', 'text-rose-300');
            };
            document.getElementById('dungeon-command-run')?.addEventListener('click', runCommandFromInput);
            document.getElementById('dungeon-command-help')?.addEventListener('click', () => {
                setCommandMsg('teleporter blue 3,4 10,12 ,  links two tiles. teleporter blue clear ,  remove.', 'text-gray-300');
            });
            const cmdInput = document.getElementById('dungeon-command-input');
            cmdInput?.addEventListener('keydown', (ev) => {
                if (ev.key === 'Enter') {
                    ev.preventDefault();
                    runCommandFromInput();
                }
            });

            // Wire bestiary browser search
            const bestiarySearchInput = document.getElementById('bestiary-search-input');
            const bestiarySearchResults = document.getElementById('bestiary-search-results');
            
            const searchBestiary = (query) => {
                if (!bestiarySearchResults) return;
                if (!bestiaryState?.index) {
                    bestiarySearchResults.innerHTML = '<div class="text-gray-500 italic">No bestiary loaded</div>';
                    return;
                }
                
                const q = (query || '').trim().toLowerCase();
                if (!q) {
                    bestiarySearchResults.innerHTML = '<div class="text-gray-500 italic">Type to search...</div>';
                    return;
                }
                
                const matches = Object.keys(bestiaryState.index)
                    .filter(key => key.includes(q))
                    .slice(0, 20)
                    .map(key => {
                        const entry = bestiaryState.index[key];
                        const name = entry?.name || key;
                        const normalized = normalizeBestiaryEntry(entry, name);
                        const cr = normalized?.cr != null ? `CR ${normalized.cr}` : '';
                        const type = normalized?.type || '';
                        return { key, name, cr, type };
                    });
                
                if (matches.length === 0) {
                    bestiarySearchResults.innerHTML = '<div class="text-gray-500 italic">No matches found</div>';
                    return;
                }
                
                const html = matches.map(m => `
                    <div class="mb-2 p-2 rounded bg-gray-800/50 border border-gray-700 hover:bg-gray-800 cursor-pointer bestiary-result-item" data-monster-name="${escapeHtml(m.name)}">
                        <div class="font-semibold text-gray-100">${escapeHtml(m.name)}</div>
                        <div class="text-xs text-gray-400">${escapeHtml(m.cr)} ${escapeHtml(m.type)}</div>
                    </div>
                `).join('');
                
                bestiarySearchResults.innerHTML = html;
                
                // Add click handlers to results
                bestiarySearchResults.querySelectorAll('.bestiary-result-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const name = el.getAttribute('data-monster-name');
                        if (name) showBestiaryModalForName(name);
                    });
                });
            };
            
            bestiarySearchInput?.addEventListener('input', (ev) => {
                searchBestiary(ev.target.value);
            });
            
            // Initialize with empty state
            if (bestiarySearchResults) {
                searchBestiary('');
            }

            // Apply zoom immediately
            applyDungeonZoom(dungeonMapState?.cellSize ?? 26);

            // Wire zoom slider (no regen needed)
            const zoom = document.getElementById('dungeon-zoom');
            const zoomLabel = document.getElementById('dungeon-zoom-label');
            zoom?.addEventListener('input', () => {
                const v = parseInt(zoom.value, 10);
                dungeonMapState.cellSize = clamp(v || 26, 16, 44);
                if (zoomLabel) zoomLabel.textContent = `${dungeonMapState.cellSize}px`;
                applyDungeonZoom(dungeonMapState.cellSize);
            });

            // Ctrl + scroll to zoom the grid
            document.addEventListener('wheel', (ev) => {
                if (!ev.ctrlKey) return;
                ev.preventDefault();
                const delta = ev.deltaY;
                const step = delta > 0 ? -2 : 2;
                dungeonMapState.cellSize = clamp((dungeonMapState.cellSize ?? 26) + step, 16, 44);
                if (zoom) zoom.value = String(dungeonMapState.cellSize);
                if (zoomLabel) zoomLabel.textContent = `${dungeonMapState.cellSize}px`;
                applyDungeonZoom(dungeonMapState.cellSize);
            }, { passive: false });

            // Wire DM history export
            document.getElementById('dungeon-history-download')?.addEventListener('click', () => {
                const payload = buildDungeonHistoryExportPayload();
                const json = JSON.stringify(payload, null, 2);
                const stamp = new Date().toISOString().replaceAll(':', '').replaceAll('-', '').slice(0, 15);
                const name = `dungeon-history-${stamp}.json`;
                const ok = downloadTextFile(name, json, 'application/json');
                if (!ok) renderDungeonInfo(`<div class="font-semibold text-rose-300">Export failed</div><div class="text-sm text-gray-300 mt-1">Could not create download.</div>`);
            });
            document.getElementById('dungeon-history-copy')?.addEventListener('click', async () => {
                const payload = buildDungeonHistoryExportPayload();
                const json = JSON.stringify(payload, null, 2);
                const ok = await copyTextToClipboard(json);
                if (ok) {
                    renderDungeonInfo(`<div class="font-semibold text-green-300">Copied</div><div class="text-sm text-gray-300 mt-1">DM history JSON copied to clipboard.</div>`);
                } else {
                    renderDungeonInfo(`<div class="font-semibold text-rose-300">Copy failed</div><div class="text-sm text-gray-300 mt-1">Clipboard permission blocked.</div>`);
                }
            });

            // Arrow keys pan the map (when not typing)
            const isTypingInInput = () => {
                const active = document.activeElement;
                if (!active) return false;
                const tag = active.tagName.toLowerCase();
                return tag === 'input' || tag === 'textarea' || active.isContentEditable || tag === 'select';
            };

            document.addEventListener('keydown', (ev) => {
                if (isTypingInInput()) return;
                const key = ev.key;
                if (key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight') {
                    // Check if a token is selected - if so, move the token instead of scrolling
                    if (dungeonMapState?.selectedEntityId) {
                        const ent = dungeonMapState.entities?.find(e => e.id === dungeonMapState.selectedEntityId);
                        if (ent && (ent.kind === 'monster' || ent.kind === 'npc')) {
                            ev.preventDefault();
                            let newX = ent.x;
                            let newY = ent.y;
                            if (key === 'ArrowUp') newY -= 1;
                            if (key === 'ArrowDown') newY += 1;
                            if (key === 'ArrowLeft') newX -= 1;
                            if (key === 'ArrowRight') newX += 1;
                            moveEntityTo(dungeonMapState.selectedEntityId, newX, newY);
                            renderDungeonMapSvg();
                            return;
                        }
                    }
                    
                    // No token selected or not a movable token - scroll the grid instead
                    const grid = document.getElementById('dungeon-grid');
                    if (!grid) return;
                    ev.preventDefault();
                    const step = Math.max(20, (dungeonMapState?.cellSize || 26) * 2);
                    if (key === 'ArrowUp') grid.scrollTop -= step;
                    if (key === 'ArrowDown') grid.scrollTop += step;
                    if (key === 'ArrowLeft') grid.scrollLeft -= step;
                    if (key === 'ArrowRight') grid.scrollLeft += step;
                }
            });

            // Wire regenerate control (reads current inputs)
            document.getElementById('dungeon-regenerate')?.addEventListener('click', () => {
                const pc = parseInt(document.getElementById('dungeon-player-count')?.value ?? '2', 10);
                const w = parseInt(document.getElementById('dungeon-width')?.value ?? String(width), 10);
                const h = parseInt(document.getElementById('dungeon-height')?.value ?? String(height), 10);
                const r = parseInt(document.getElementById('dungeon-rooms')?.value ?? String(rooms.length), 10);
                const cMin = parseInt(document.getElementById('dungeon-corridor-min')?.value ?? '10', 10);
                const cMax = parseInt(document.getElementById('dungeon-corridor-max')?.value ?? '10', 10);

                dungeonMapState = {
                    ...(dungeonMapState || {}),
                    playerCount: clamp(pc || 2, 1, 12),
                    corridorMin: clamp(cMin || 10, 4, 24),
                    corridorMax: clamp(cMax || 10, 6, 30),
                    history: [],
                };
                // Ensure min <= max
                if (dungeonMapState.corridorMin > dungeonMapState.corridorMax) {
                    const tmp = dungeonMapState.corridorMin;
                    dungeonMapState.corridorMin = dungeonMapState.corridorMax;
                    dungeonMapState.corridorMax = tmp;
                }

                const next = generateDungeonLayout({
                    width: clamp(w || width, 21, 99),
                    height: clamp(h || height, 15, 75),
                    rooms: clamp(r || rooms.length, 3, 40),
                    corridorMin: dungeonMapState.corridorMin,
                    corridorMax: dungeonMapState.corridorMax,
                    corridorWidth: 2,
                    keyCount: dungeonMapState.keyCount,
                    combatSkew: dungeonMapState.combatSkew ?? 90,
                    spawnBosses: dungeonMapState.spawnBosses !== false,
                    roomSizeMin: dungeonMapState.roomSizeMin ?? 8,
                    roomSizeMax: dungeonMapState.roomSizeMax ?? 10,
                    startRoomSizeMin: dungeonMapState.startRoomSizeMin ?? 4,
                    startRoomSizeMax: dungeonMapState.startRoomSizeMax ?? 4,
                    roomDecoration: dungeonMapState.roomDecoration ?? false,
                    cellarwaysMode: dungeonMapState.cellarwaysMode ?? false,
                });
                for (const rr of next.rooms) {
                    const details = roomData[rr.roomType];
                    if (details?.names?.length) rr.roomName = getRandomElement(details.names);
                    if (details?.descriptions?.length) rr.roomDesc = getRandomElement(details.descriptions);
                }
                renderDungeonMap(next);
            });

            // Render cells with baked props (Master Reference 1A: props baked into map, not as tokens)
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const cell = grid[y][x];
                    const div = document.createElement('div');
                    div.className = 'dungeon-cell';
                    div.dataset.x = String(x);
                    div.dataset.y = String(y);

                    if (cell.type === 'corridor') div.classList.add('cell-corridor');
                    if (cell.type === 'room') {
                        div.classList.add('cell-room');

                                const col = isNonCombatEncounter(encounter) ? 'rgba(56,189,248,0.95)' : 'rgba(248,113,113,0.95)';
                                detail += `<br><span style="color: ${col}"><b>Encounter:</b> ${encounter.name} (CR ${encounter.cr})</span>`;
                            }
                        }
                        if (cell.type === 'room') {
                            const room = rooms[cell.roomId];
                            header = `<b>Room</b> (ID ${room?.id ?? '?'})`;
                            const roomName = room?.roomName ? room.roomName : (room?.roomType || 'Unknown');
                            detail = `Type: ${room?.roomType || 'Unknown'}<br><span style="opacity:0.9">${roomName}</span>`;
                            if (room?.encounter) {
                                const col = isNonCombatEncounter(room.encounter) ? 'rgba(56,189,248,0.95)' : 'rgba(248,113,113,0.95)';
                                detail += `<br><span style="color: ${col}"><b>Encounter:</b> ${room.encounter.name} (CR ${room.encounter.cr})</span>`;
                            }
                        }
                        showMapTooltip(e, `${header}<br><span style="opacity:0.9">${detail}</span>`);
                    });
                    div.addEventListener('mousemove', moveMapTooltip);
                    div.addEventListener('mouseleave', () => scheduleHideMapTooltip(160));

                    container.appendChild(div);
                }
            }

            // Helper to place tokens in a cell with small offsets
            const placeToken = (x, y, token) => {
                const cellIndex = y * width + x;
                const cellDiv = container.children[cellIndex];
                if (!cellDiv) return;
                const el = document.createElement('div');
                let cls = 'token-monster';
                if (token.kind === 'player') cls = 'token-player';
                if (token.kind === 'key') cls = 'token-key';
                if (token.kind === 'npc') cls = 'token-npc';
                if (token.kind === 'feature') cls = 'token-feature';
                el.className = `dungeon-token ${cls}`;

                if (token.kind === 'monster') {
                    const title = token.title ? stripHtml(token.title) : '';
                    const url = title ? getMonsterImageUrlForName(title) : null;
                    if (url) {
                        el.classList.add('has-image');
                        const img = document.createElement('img');
                        img.className = 'monster-token-img';
                        img.alt = title;
                        img.src = url;
                        img.loading = 'lazy';
                        el.appendChild(img);
                    } else {
                        el.textContent = token.label;
                    }
                } else {
                    el.textContent = (token.kind === 'key') ? '🗝' : token.label;
                    if (token.kind === 'feature' && token.source?.kind === 'glimpse') {
                        el.classList.add('token-glimpse');
                    }
                }
                el.dataset.title = token.title || '';
                el.dataset.entityId = token.id;
                if (token.source?.kind === 'glimpse') {
                    el.dataset.glimpse = '1';
                }

                const existing = cellDiv.querySelectorAll('.dungeon-token').length;
                const cellSize = clamp(dungeonMapState?.cellSize ?? 26, 16, 44);
                const baseToken = clamp(Math.round(cellSize * 0.55), 10, 26);
                const slots = clamp(Number(token.sizeSlots) || 1, 1, 4);
                const pad = 2;
                const step = baseToken + 1;
                const offsets = [
                    { left: pad, top: pad },
                    { left: pad + step, top: pad },
                    { left: pad, top: pad + step },
                    { left: pad + step, top: pad + step },
                ];
                const raw = offsets[Math.min(existing, offsets.length - 1)];
                const tokenSize = slots === 1 ? baseToken : Math.max(baseToken * slots, slots * cellSize - 4);
                const maxLeft = Math.max(pad, cellSize - tokenSize - 1);
                const maxTop = Math.max(pad, cellSize - tokenSize - 1);
                el.style.left = `${clamp(raw.left, pad, maxLeft)}px`;
                el.style.top = `${clamp(raw.top, pad, maxTop)}px`;
                el.style.width = `${tokenSize}px`;
                el.style.height = `${tokenSize}px`;
                if (slots > 1) {
                    el.style.borderRadius = `${Math.max(10, Math.round(tokenSize / 5))}px`;
                }
                el.dataset.sizeSlots = String(slots);

                el.addEventListener('mouseenter', (e) => {
                    const title = token.title ? stripHtml(token.title) : '';
                    const kindLabel = token.kind === 'player'
                        ? 'PLAYER'
                        : (token.kind === 'key'
                            ? '🗝 KEY'
                            : (token.kind === 'npc'
                                ? 'NPC'
                                : (token.kind === 'prop'
                                    ? 'PROP'
                                    : (token.kind === 'feature'
                                        ? 'FEATURE'
                                        : 'MONSTER'))));
                    const loot = token.source?.kind === 'loot' ? token.source.loot : null;
                    const entry = title ? getBestiaryOrManualEntry(title) : null;
                    const normalized = entry ? normalizeBestiaryEntry(entry, title) : null;
                    let extra = '';
                    if (loot) {
                        extra = `<div class="mt-1 text-xs text-amber-200">${escapeHtml(loot.text || `${loot.gp || 0} GP stash`)}</div>`;
                    } else if (normalized && (token.kind === 'monster' || normalized.kind === 'trap')) {
                        extra = formatBestiaryMiniHtml(normalized, title);
                    }
                    const canOpen = !!normalized || !!bestiaryState?.index;
                    const actions = (title && !loot && (token.kind === 'monster' || normalized?.kind === 'trap'))
                        ? `
                            <div class="tooltip-actions">
                                <button class="tooltip-btn" data-open-bestiary="${escapeHtml(title)}" ${canOpen ? '' : 'disabled'} title="Open full bestiary entry">📖 Bestiary</button>
                            </div>
                        `
                        : '';
                    showMapTooltip(e, `<b>${kindLabel}</b><br><span style="opacity:0.9">${title || ', '}</span>${extra}${actions}`);
                });
                el.addEventListener('mousemove', moveMapTooltip);
                el.addEventListener('mouseleave', () => scheduleHideMapTooltip(160));
                if (token.kind === 'feature' && token.source?.kind === 'glimpse') {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const cell = getCell(token.x, token.y);
                        const payload = cell?.glimpse;
                        if (payload) renderDungeonInfo(renderGlimpseHtml(payload));
                    });
                }

                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const titleText = stripHtml(token.title || '');
                    if (token.kind === 'key') return;
                    if (token.kind === 'feature') {
                        if (token.source?.kind === 'glimpse') return;
                        if (token.source?.kind === 'loot') {
                            const loot = token.source.loot || {};
                            renderDungeonInfo(`
                                <div class="font-semibold text-gray-100">Locked Room Loot</div>
                                <div class="text-sm text-gray-400">${titleText || loot.title || 'Container'}</div>
                                <div class="mt-2 text-sm text-gray-300">${escapeHtml(loot.text || `${loot.gp || '??'} GP and an item`)}</div>
                            `);
                            return;
                        }
                        const normalized = normalizeBestiaryEntry(getBestiaryOrManualEntry(titleText), titleText);
                        if (normalized) {
                            const canOpen = !!normalized || !!bestiaryState?.index;
                            const detail = normalized.kind === 'trap' ? 'Trap / Hazard' : 'Feature';
                            const mini = formatBestiaryMiniHtml(normalized, titleText);
                            const btn = canOpen
                                ? `<button id="dungeon-open-bestiary" class="mt-2 btn-generate bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 px-3 rounded-lg text-xs">View entry</button>`
                                : '<div class="mt-2 text-xs text-gray-400">Load bestiary to view details.</div>';
                            renderDungeonInfo(`
                                <div class="font-semibold text-gray-100">Selected: ${detail}</div>
                                <div class="text-sm text-gray-400">${titleText}</div>
                                ${mini}
                                ${normalized.description ? `<div class="mt-2 text-sm text-gray-300 leading-snug">${escapeHtml(normalized.description)}</div>` : ''}
                                ${normalized.mechanics ? `<div class="mt-1 text-xs text-amber-200">${escapeHtml(normalized.mechanics)}</div>` : ''}
                                ${btn}
                            `);
                            const openBtn = document.getElementById('dungeon-open-bestiary');
                            openBtn?.addEventListener('click', (ev) => {
                                ev.stopPropagation();
                                const sourceEncounter = token.source?.encounter;
                                showBestiaryModalForName(titleText, sourceEncounter);
                            });
                        }
                        return;
                    }
                    if (token.kind === 'npc') {
                        const roomId = getRoomIdAt(dungeonMapState?.layout, token.x, token.y);
                        if (roomId != null && showNpcKeyholderUiForRoom(roomId)) return;
                        renderDungeonInfo(`<div class="font-semibold text-gray-100">NPC</div><div class="text-sm text-gray-300 mt-1">A keyholder NPC is here.</div>`);
                        return;
                    }
                    dungeonMapState.selectedEntityId = token.id;
                    updateSelectedTokenUi();
                    const origin = token.source;
                    const selectedLabel = token.kind === 'player' ? 'Player' : (token.kind === 'feature' ? 'Feature' : 'Monster');
                    const bestiaryMini = (token.kind === 'monster' && token.title)
                        ? formatBestiaryMiniHtml(getBestiaryOrManualEntry(token.title), token.title)
                        : '';
                    const canOpenBestiary = !!getBestiaryOrManualEntry(titleText) || !!bestiaryState?.index;
                    const showBestiaryBtn = (token.kind === 'monster' && titleText)
                        ? (canOpenBestiary
                            ? `
                                <button id="dungeon-open-bestiary" class="mt-2 btn-generate bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 px-3 rounded-lg text-xs">View full bestiary entry</button>
                            `
                            : `
                                <div class="mt-2 text-xs text-gray-400">Load a bestiary JSON to view full monster details.</div>
                            `)
                        : '';
                    if (origin?.kind === 'room') {
                        renderDungeonInfo(`
                            <div class="font-semibold text-gray-100">Selected: ${selectedLabel}</div>
                            <div class="text-sm text-gray-400">${titleText}</div>
                            ${bestiaryMini}
                            ${showBestiaryBtn}
                            <div class="mt-2 text-sm text-gray-300">From room: <b>${origin.roomName || 'Room'}</b> (${origin.roomType || ''})</div>
                            <div class="mt-2">${formatEncounterHtml(origin.encounter)}</div>
                        `);
                    } else if (origin?.kind === 'corridor') {
                        renderDungeonInfo(`
                            <div class="font-semibold text-gray-100">Selected: ${selectedLabel}</div>
                            <div class="text-sm text-gray-400">${titleText}</div>
                            ${bestiaryMini}
                            ${showBestiaryBtn}
                            <div class="mt-2 text-sm text-gray-300">From hall: <b>${origin.corridorType || 'Corridor'}</b> at (${origin.x}, ${origin.y})</div>
                            <div class="mt-2">${formatEncounterHtml(origin.encounter)}</div>
                        `);
                    } else {
                        renderDungeonInfo(`
                            <div class="font-semibold text-gray-100">Selected: ${selectedLabel}</div>
                            <div class="text-sm text-gray-400">${titleText}</div>
                            ${bestiaryMini}
                            ${showBestiaryBtn}
                            <div class="text-gray-500 text-sm mt-2">Click a tile to move.</div>
                        `);
                    }

                    const openBtn = document.getElementById('dungeon-open-bestiary');
                    if (openBtn) {
                        openBtn.addEventListener('click', (ev) => {
                            ev.stopPropagation();
                            showBestiaryModalForName(titleText, origin?.encounter);
                        });
                    }
                });

                el.addEventListener('dblclick', (e) => {
                    if (token.kind !== 'monster') return;
                    const title = stripHtml(token.title || '');
                    if (!title) return;
                    e.stopPropagation();
                    if (!bestiaryState?.index) {
                        const msg = document.getElementById('dungeon-bestiary-msg');
                        if (msg) msg.textContent = 'Load a bestiary JSON to enable full monster details.';
                        renderDungeonInfo(`<div class="font-semibold text-gray-100">Bestiary not loaded</div><div class="text-sm text-gray-300 mt-1">Use the Bestiary Loader to import a JSON file, then double-click again.</div>`);
                        return;
                    }
                    showBestiaryModalForName(title);
                });

                el.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (token.kind === 'player') {
                        showPlayerSheetModal(token);
                    } else if (token.kind === 'monster') {
                        showMonsterRollerModal(token);
                    }
                });

                cellDiv.appendChild(el);
            };

            const findNearbyFloorCells = (startX, startY, needed, allowFn) => {
                // BFS to find distinct cells to place tokens (helps corridors)
                const startKey = `${startX},${startY}`;
                const q = [{ x: startX, y: startY }];
                const visited = new Set([startKey]);
                const results = [];

                const pushIfAllowed = (x, y) => {
                    const c = getCell(x, y);
                    if (!c) return;
                    if (!allowFn(c)) return;
                    results.push({ x, y });
                };

                while (q.length && results.length < needed) {
                    const cur = q.shift();
                    pushIfAllowed(cur.x, cur.y);
                    const neighbors = [
                        { x: cur.x + 1, y: cur.y },
                        { x: cur.x - 1, y: cur.y },
                        { x: cur.x, y: cur.y + 1 },
                        { x: cur.x, y: cur.y - 1 },
                    ];
                    for (const n of neighbors) {
                        const k = `${n.x},${n.y}`;
                        if (visited.has(k)) continue;
                        visited.add(k);
                        const c = getCell(n.x, n.y);
                        if (!c) continue;
                        // We still traverse through walls? No: keep traversal on floor.
                        if (c.type === 'wall') continue;
                        q.push(n);
                    }
                }
                return results;
            };

            // Build entity list (enables movement)
            const makeId = makeDungeonEntityId;
            const entities = [];
            const glimpseAnchors = ensureGlimpseAnchors();

            const playerCount = clamp(dungeonMapState?.playerCount ?? 4, 1, 12);
            for (let i = 0; i < playerCount; i++) {
                entities.push({
                    id: makeId(),
                    kind: 'player',
                    label: `P${i + 1}`,
                    title: `Player ${i + 1}`,
                    x: startRoom.cx,
                    y: startRoom.cy,
                    source: { kind: 'start' },
                });
            }

            // Corridor encounters â†' entities placed across nearby corridor cells.
            const corridorSources = [];
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const c = grid[y][x];
                    if (c.type !== 'corridor' || !c.encounter) continue;
                    corridorSources.push({ x, y, corridorType: c.corridorType || 'Corridor', encounter: c.encounter });
                    const tokens = buildEncounterTokensFromEncounter(c.encounter);
                    const spots = findNearbyFloorCells(x, y, tokens.length, (cell) => cell.type === 'corridor');
                    for (let i = 0; i < Math.min(tokens.length, spots.length); i++) {
                        entities.push({
                            id: makeId(),
                            kind: tokens[i].kind,
                            label: tokens[i].label,
                            title: tokens[i].title,
                            sizeSlots: tokens[i].sizeSlots || 1,
                            x: spots[i].x,
                            y: spots[i].y,
                            source: { kind: 'corridor', x, y, corridorType: c.corridorType || 'Corridor', encounter: c.encounter },
                        });
                    }
                }
            }

            // Glimpses: anchor them on edges so players can click them.
            for (const g of glimpseAnchors) {
                entities.push({
                    id: makeId(),
                    kind: 'feature',
                    label: '👁',
                    title: 'Glimpse',
                    x: g.x,
                    y: g.y,
                    source: { kind: 'glimpse', roomId: g.roomId ?? null, corridorType: g.corridorType ?? null },
                });
            }

            // Props will be rendered directly on cells as emoji, not as entities

            // Room encounters â†' entities distributed across room tiles
            const roomEncounterRows = [];
            for (const r of rooms) {
                if (!r.encounter) continue;
                if (r.id === startRoom.id) continue;
                const cells = roomCellsById.get(r.id) || [];
                if (!cells.length) continue;
                shuffleInPlace(cells);
                const tokens = buildEncounterTokensFromEncounter(r.encounter);

                roomEncounterRows.push({ roomId: r.id, roomName: r.roomName, roomType: r.roomType, encounter: r.encounter });

                // Spread tokens across room cells; keep it readable
                const maxTokens = Math.min(60, Math.max(12, cells.length));
                const limited = tokens.slice(0, maxTokens);
                for (let i = 0; i < limited.length; i++) {
                    const c = cells[i % cells.length];
                    entities.push({
                        id: makeId(),
                        kind: limited[i].kind,
                        label: limited[i].label,
                        title: limited[i].title,
                            sizeSlots: limited[i].sizeSlots || 1,
                        x: c.x,
                        y: c.y,
                        source: { kind: 'room', roomId: r.id, roomName: r.roomName, roomType: r.roomType, encounter: r.encounter },
                    });
                }

                if (r.lockLoot && cells.length) {
                    const chestSpot = cells[limited.length % cells.length] || cells[0];
                    entities.push({
                        id: makeId(),
                        kind: 'feature',
                        label: r.lockLoot.label || 'C',
                        title: r.lockLoot.title || 'Locked Container',
                        x: chestSpot.x,
                        y: chestSpot.y,
                        source: { kind: 'loot', loot: r.lockLoot, roomId: r.id, locked: true },
                    });
                }
            }

            // Persist state
            dungeonMapState = {
                ...(dungeonMapState || {}),
                layout,
                entities,
                selectedEntityId: null,
                playerCount: playerCount,
                cellSize: dungeonMapState?.cellSize ?? 26,
                collectedKeys: dungeonMapState?.collectedKeys ?? new Set(),
                history: dungeonMapState?.history ?? [],
            };

            // Create key entities (as tokens) from layout.keysById
            if (layout.keysById) {
                for (const k of Object.values(layout.keysById)) {
                    if (!k || k.collected) continue;
                    if (k.acquisition === 'npc') continue;
                    const id = makeId();
                    k.entityId = id;
                    dungeonMapState.entities.push({
                        id,
                        kind: 'key',
                        label: '🗝',
                        title: `Key ${k.id} (opens ${k.doorId})`,
                        x: k.x,
                        y: k.y,
                        source: { kind: 'key', doorId: k.doorId, roomId: k.roomId },
                    });
                }
            }

            // Create NPC keyholder entities
            if (layout.npcKeyholdersById) {
                for (const n of Object.values(layout.npcKeyholdersById)) {
                    if (!n || n.resolved) continue;
                    if (dungeonMapState.collectedKeys && dungeonMapState.collectedKeys.has(n.keyId)) continue;
                    const id = makeId();
                    n.entityId = id;
                    dungeonMapState.entities.push({
                        id,
                        kind: 'npc',
                        label: '👤',
                        title: `Keyholder (DC ${n.dc})`,
                        x: n.x,
                        y: n.y,
                        source: { kind: 'npc', npcId: n.id, keyId: n.keyId, doorId: n.doorId, roomId: n.roomId, dc: n.dc },
                    });
                }
            }

            // Render entities
            for (const ent of dungeonMapState.entities) {
                placeToken(ent.x, ent.y, ent);
            }

            // Render door marks
            if (layout.doorsById) {
                for (const d of Object.values(layout.doorsById)) {
                    const idx = d.y * width + d.x;
                    const cellDiv = container.children[idx];
                    if (!cellDiv) continue;
                    const mark = document.createElement('div');
                    mark.className = 'cell-mark door';
                    mark.textContent = d.locked ? 'L' : 'D';
                    cellDiv.appendChild(mark);
                }
            }

            renderTeleportMarks();

            // Fill room/hall encounter lists with full explanations
            const roomList = document.getElementById('dungeon-room-list');
            if (roomList) {
                if (!roomEncounterRows.length) roomList.innerHTML = `<div class="text-gray-400 italic">No room encounters rolled.</div>`;
                else {
                    roomList.innerHTML = roomEncounterRows
                        .map((r) => {
                            const desc = r.encounter?.description || '';
                            return `
                                <div class="mb-3">
                                    <div class="font-semibold text-gray-100">${r.roomName || 'Room'} <span class="text-gray-400">(ID ${r.roomId})</span></div>
                                    <div class="text-xs text-gray-400">${r.roomType || ''}</div>
                                    <div class="text-sm text-gray-200 mt-1">${r.encounter?.name || 'Encounter'} <span class="text-gray-400">(CR ${r.encounter?.cr ?? 0})</span></div>
                                    <div class="text-xs text-gray-300 leading-snug mt-1">${desc}</div>
                                </div>
                            `;
                        })
                        .join('');
                }
            }

            const hallList = document.getElementById('dungeon-corridor-list');
            if (hallList) {
                if (!corridorSources.length) hallList.innerHTML = `<div class="text-gray-400 italic">No hall encounters rolled (should be rare now).</div>`;
                else {
                    hallList.innerHTML = corridorSources
                        .map((h) => {
                            const desc = h.encounter?.description || '';
                            return `
                                <div class="mb-3">
                                    <div class="font-semibold text-gray-100">${h.corridorType}</div>
                                    <div class="text-xs text-gray-400">Tile: (${h.x}, ${h.y})</div>
                                    <div class="text-sm text-gray-200 mt-1">${h.encounter?.name || 'Encounter'} <span class="text-gray-400">(CR ${h.encounter?.cr ?? 0})</span></div>
                                    <div class="text-xs text-gray-300 leading-snug mt-1">${desc}</div>
                                </div>
                            `;
                        })
                        .join('');
                }
            }

            updateSelectedTokenUi();
            updateDoorAndRoomLockVisuals();
            renderDungeonHistory();
        };

        const generateDungeonMap = () => {
            hideMapTooltip();
            // Initialize defaults if first run
            if (!dungeonMapState) {
                dungeonMapState = {
                    playerCount: 2,
                    corridorMin: 10,
                    corridorMax: 10,
                    roomSizeMin: 8,
                    roomSizeMax: 10,
                    startRoomSizeMin: 4,
                    startRoomSizeMax: 4,
                    combatSkew: 90,
                    cellSize: 26,
                    collectedKeys: new Set(),
                    roomDecoration: false,
                    cellarwaysMode: false,
                };
            }
            const layout = generateDungeonLayout({
                width: 50,
                height: 30,
                rooms: 10,
                corridorMin: dungeonMapState.corridorMin ?? 10,
                corridorMax: dungeonMapState.corridorMax ?? 10,
                corridorWidth: 2,
                roomSizeMin: dungeonMapState.roomSizeMin ?? 8,
                roomSizeMax: dungeonMapState.roomSizeMax ?? 10,
                startRoomSizeMin: dungeonMapState.startRoomSizeMin ?? 4,
                startRoomSizeMax: dungeonMapState.startRoomSizeMax ?? 4,
                combatSkew: dungeonMapState.combatSkew ?? 90,
                roomDecoration: dungeonMapState.roomDecoration ?? false,
                cellarwaysMode: dungeonMapState.cellarwaysMode ?? false,
            });
            // Assign simple room names for display using your existing roomData
            for (const r of layout.rooms) {
                const details = roomData[r.roomType];
                if (details?.names?.length) r.roomName = getRandomElement(details.names);
                if (details?.descriptions?.length) r.roomDesc = getRandomElement(details.descriptions);
            }
            renderDungeonMap(layout, dungeonOutput);
        };

        const setActiveTab = (tab) => {
            const main = document.getElementById('main-tab');
            const dungeon = document.getElementById('dungeon-tab-content');
            const btnMain = document.getElementById('tab-main');
            const btnDungeon = document.getElementById('tab-dungeon');

            const isDungeon = tab === 'dungeon';
            if (main) main.className = isDungeon ? 'hidden' : 'block';
            if (dungeon) dungeon.className = isDungeon ? 'block' : 'hidden';

            if (btnMain) btnMain.className = isDungeon
                ? 'px-4 py-2 text-sm font-bold text-gray-200 bg-slate-950/10 hover:bg-slate-800/50'
                : 'px-4 py-2 text-sm font-bold text-gray-100 bg-slate-800/80 hover:bg-slate-700/80';
            if (btnDungeon) btnDungeon.className = isDungeon
                ? 'px-4 py-2 text-sm font-bold text-gray-100 bg-slate-800/80 hover:bg-slate-700/80'
                : 'px-4 py-2 text-sm font-bold text-gray-200 bg-slate-950/10 hover:bg-slate-800/50';
        };

        const renderDungeonStartPanel = () => {
            if (!dungeonOutput) return;
            const saved = dungeonMapState || {};
            const pc = saved.playerCount ?? 2;
            const rooms = saved.targetRooms ?? 10;
            const keys = saved.keyCount ?? null;
            const combatSkew = saved.combatSkew ?? 90;
            const cMin = saved.corridorMin ?? 10;
            const cMax = saved.corridorMax ?? 10;
            const startRoomMin = saved.startRoomSizeMin ?? 4;

        const generateCorridor = () => {
            let html = '';

            const style = weightedRandom(styles);

            const name = getRandomElement(roomDetails.names);

            // Loot & Encounters
            const loot = generateLoot();
            let encounter = null;

            if (isWindowGalleryRoom ? roll(0.5) : roll(0.33)) {
                const specific = roomSpecificEncounters[type];
                if (specific && specific.length) {
                    encounter = weightedRandomEncounter(specific);
                } else {
                    encounter = weightedRandomEncounter(roomEncounters);
                }
            }

                if (loot && loot.encounterCR && (!encounter || encounter.cr < loot.encounterCR)) {
                      // Force a stronger encounter if required by loot; prefer room-specific pool
                      const specific = roomSpecificEncounters[type];
                      let pool = (specific && specific.length) ? specific : roomEncounters;
                      let requiredEncounters = pool.filter(e => (e.value?.cr ?? 0) >= loot.encounterCR);
                      if (requiredEncounters.length === 0) {
                          requiredEncounters = roomEncounters.filter(e => (e.value?.cr ?? 0) >= loot.encounterCR);
                      }
                      if (requiredEncounters.length > 0) {
                          encounter = weightedRandomEncounter(requiredEncounters);
                      }
                }

            if (encounter) {
                 const perceptionDC = Math.ceil(encounter.cr) + 10;
                 html += `<div class="mt-4"><h3 class="section-title text-xl mb-2 pb-1">Encounter</h3><p><strong>${encounter.name} (CR ${encounter.cr}):</strong> ${encounter.description} A DC ${perceptionDC} Perception check might be needed to notice them in the ${lighting.toLowerCase()} lighting.</p></div>`;

            if (!loot && isWindowGalleryRoom && Math.random() < 0.2) {

        const normalizeEncounterArray = (arr, typeLabel) => {
            if (!Array.isArray(arr)) return [];
            return arr.map((e) => ({
                type: typeLabel,
                name: e.value?.name ?? "Unknown",

                return `

                        <div class="font-semibold text-gray-100">${it.name}</div>
            <div class="text-sm text-gray-400">CR ${it.cr}</div>
                    </div>
                    <p class="text-sm text-gray-400 mt-1">${it.description}</p>
                </li>`;
            }).join('');
            container.innerHTML = `<ul class="space-y-2">${rows}</ul>`;
        };

        const sortEncounters = (items) => {
            return [...items].sort((a, b) => {

                return a.name.localeCompare(b.name);
            });
        };

        let encounterIndexData = null;
        const renderEncounterIndex = () => {
            // Build normalized data once
            encounterIndexData = {
                corridor: normalizeEncounterArray(corridorEncounters, 'Corridor'),
                room: normalizeEncounterArray(roomEncounters, 'Room'),
            };

            // Prepare generic packs (use expected count for approx CR)
            const genericCorridor = genericCorridorPacks.map((e) => {
                const v = e.value;
                const avgCount = Math.max(1, Math.round(averageDiceCount(v.countDice)));
                const approxCR = roundCR((v.memberCR || 0) * avgCount);
                const hostility = v.hostility || "Hostile on sight.";

                // Mirror the light-touch scaling used by generateGenericCorridorEncounter(),
                // but based on expected (average) pack size for a stable index preview.
                const perceptionDC = Math.min(16, 13 + Math.floor((approxCR || 0) / 2));
                const movementDC = Math.min(16, 13 + Math.floor(Math.max(0, (approxCR || 0) - 1) / 2));
                let chipDamage = "1d4";
                if (approxCR >= 2 && approxCR < 5) chipDamage = "1d4+1";
                if (approxCR >= 5) chipDamage = "1d6";
                return {
                    type: 'Corridor (Generic Pack)',
                    name: `${v.label}`,
                    cr: approxCR,
                    description: `Pack size: ${v.countDice} ${pluralize(v.memberName)} "¢ Member CR ${v.memberCR}. ` +
                        `Preview DCs: Perception ${perceptionDC}, Movement ${movementDC}; chip damage ${chipDamage}. ` +
                        `${v.tactics}<br><b>Hostility:</b> ${hostility}`,
                    weight: typeof e.weight === 'number' ? e.weight : 1,
                };
            });

            const totalCorridor = encounterIndexData.corridor.length;
            const totalRoom = encounterIndexData.room.length;
            const totalGeneric = genericCorridor.length;

            const html = `
                <div>
                    <h2 class="text-2xl font-bold mb-2">Encounter Index</h2>
                    <p class="text-gray-400 mb-4">Browse all possible encounters without rolling. Use the filter to quickly find a name or keyword.</p>

                    <div class="mb-6">
                        <input id="encounter-search" type="text" placeholder="Filter by name or text"¦" 
                            class="w-full bg-gray-800 text-gray-100 placeholder-gray-500 border border-gray-700 focus:border-teal-400 focus:ring-2 focus:ring-teal-400/40 rounded-md px-4 py-2 outline-none" />
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <section class="col-span-1">
                            <div class="flex items-baseline justify-between mb-2">
                                <h3 class="section-title text-xl pb-1">Corridor Encounters</h3>
                                <span id="corridor-count" class="text-sm text-gray-400">${totalCorridor}</span>
                            </div>
                            <div id="corridor-list"></div>

                            <div class="flex items-baseline justify-between mb-2 mt-6">
                                <h3 class="section-title text-xl pb-1">Generic Corridor Packs</h3>
                                <span id="generic-corridor-count" class="text-sm text-gray-400">${totalGeneric}</span>
                            </div>
                            <div id="generic-corridor-list"></div>
                        </section>

                        <section class="col-span-1">
                            <div class="flex items-baseline justify-between mb-2">
                                <h3 class="section-title text-xl pb-1">Room Encounters</h3>
                                <span id="room-count" class="text-sm text-gray-400">${totalRoom}</span>
                            </div>
                            <div id="room-list"></div>
                        </section>
                    </div>
                </div>
            `;

            output.innerHTML = html;

            // Initial render, sorted by CR then name
            renderEncounterList(sortEncounters(encounterIndexData.corridor), 'corridor-list');
            renderEncounterList(sortEncounters(encounterIndexData.room), 'room-list');
            renderEncounterList(sortEncounters(genericCorridor), 'generic-corridor-list');

            const input = document.getElementById('encounter-search');
            input?.addEventListener('input', () => {
                const q = input.value.trim().toLowerCase();
                const filterFn = (it) => !q || it.name.toLowerCase().includes(q) || it.description.toLowerCase().includes(q);
                const filteredCorridor = sortEncounters(encounterIndexData.corridor.filter(filterFn));
                const filteredRoom = sortEncounters(encounterIndexData.room.filter(filterFn));
                const filteredGeneric = sortEncounters(genericCorridor.filter(filterFn));
                document.getElementById('corridor-count').textContent = `${filteredCorridor.length}/${totalCorridor}`;
                document.getElementById('room-count').textContent = `${filteredRoom.length}/${totalRoom}`;
                document.getElementById('generic-corridor-count').textContent = `${filteredGeneric.length}/${totalGeneric}`;
                renderEncounterList(filteredCorridor, 'corridor-list');
                renderEncounterList(filteredRoom, 'room-list');
                renderEncounterList(filteredGeneric, 'generic-corridor-list');
            });
        };

        // --- EVENT LISTENERS ---
        document.getElementById('generate-corridor-btn').addEventListener('click', generateCorridor);
        document.getElementById('generate-room-btn').addEventListener('click', generateRoom);
        document.getElementById('generate-dungeon-btn').addEventListener('click', () => {
            setActiveTab('dungeon');
            ensureDungeonTab();
        });
        document.getElementById('show-index-btn').addEventListener('click', () => {
            setActiveTab('main');
            renderEncounterIndex();
        });

        document.getElementById('tab-main')?.addEventListener('click', () => setActiveTab('main'));
        document.getElementById('tab-dungeon')?.addEventListener('click', () => {
            setActiveTab('dungeon');
            ensureDungeonTab();
        });

        // Default tab
        setActiveTab('main');

        // Try to pull in the packaged bestiary immediately (helps file:// or first open)
        ensureBundledBestiaryLoaded({ force: true, silent: true }).then(updateBestiaryStatusElements);

        // Collapsible window toggle (event delegation)
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.window-toggle');
            if (!btn) return;
            const content = btn.nextElementSibling;
            if (!content) return;
            content.classList.toggle('hidden');
        });
    </script>
</body>
</html>
