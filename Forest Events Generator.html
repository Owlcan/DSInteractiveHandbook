<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholia Diaspros Forest Encounter Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        /* CSS variables for theme */
        :root {
            --gold: #daac17;
            --gold-light: #fae791;
            --gold-dark: #97740a;
            --parchment: #2C2614;
            --parchment-dark: #1E1C12;
            --ink: #c7a81d;
            --ink2: #8f770d;
            --accent: #b41818; /* Changed to red for combat emphasis */
            --shadow: rgba(0, 0, 0, 0.5);
        }

        /* Base styles for the body */
        body {
            font-family: 'Cormorant Garamond', serif;
            margin: 0;
            padding: 20px;
            background-color: #2c2619;
            background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
            color: var(--ink);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Container for the application */
        #appContainerEl {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background-color: var(--parchment);
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            padding: 20px;
            border: 12px solid var(--gold-dark);
            position: relative;
        }
        
        /* Decorative corners */
        .corner-decoration {
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: var(--gold);
            background-image: url('https://www.transparenttextures.com/patterns/asfalt-light.png');
            z-index: 1;
        }
        .top-left { top: -6px; left: -6px; border-top-left-radius: 15px; }
        .top-right { top: -6px; right: -6px; border-top-right-radius: 15px; }
        .bottom-left { bottom: -6px; left: -6px; border-bottom-left-radius: 15px; }
        .bottom-right { bottom: -6px; right: -6px; border-bottom-right-radius: 15px; }

        /* Main title styling */
        h1 {
            text-align: center;
            color: var(--gold-light);
            font-family: 'MedievalSharp', cursive;
            font-size: 2.5rem;
            margin: 10px 0 20px;
            text-shadow: 1px 1px 3px var(--shadow);
            position: relative;
        }
        
        h1::after {
            content: "";
            display: block;
            width: 80%;
            height: 3px;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
            margin: 10px auto;
        }
        
        /* Section container for the generator */
        .section-container {
            margin: 20px 0;
            background-color: var(--parchment-dark);
            padding: 25px;
            border: 1px solid var(--gold-dark);
            border-radius: 5px;
            text-align: center;
        }

        /* Button styling */
        button {
            padding: 12px 25px;
            background: linear-gradient(to bottom, var(--gold-light), var(--gold));
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-family: 'MedievalSharp', cursive;
            color: var(--ink2);
            box-shadow: 0 2px 5px var(--shadow);
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: linear-gradient(to bottom, var(--gold), var(--gold-dark));
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--shadow);
        }

        /* Result display area */
        #eventResultEl {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--parchment);
            border: 1px solid var(--gold);
            border-radius: 5px;
            min-height: 100px;
            display: none; /* Initially hidden */
            text-align: left;
        }
        
        /* Encounter title styling */
        #eventTitleEl {
            font-family: 'MedievalSharp', cursive;
            color: var(--gold-light);
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 10px;
        }
        
        /* Special style for combat encounters */
        #eventTitleEl.combat {
            color: var(--accent);
            font-weight: bold;
        }
        
        /* Encounter description styling */
        #eventDescriptionEl {
            color: var(--ink);
            font-size: 16px;
            line-height: 1.5;
            font-family: 'Cormorant Garamond', serif;
        }

        /* Modal styles for event list */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            overflow-y: auto;
        }

        .modal-content {
            background-color: var(--parchment);
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            margin: 2% auto;
            padding: 20px;
            border: 3px solid var(--gold-dark);
            border-radius: 8px;
            width: 90%;
            max-width: 1200px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-button {
            color: var(--gold-light);
            float: right;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            margin-top: -10px;
        }

        .close-button:hover {
            color: var(--accent);
        }

        .event-list-item {
            margin-bottom: 25px;
            padding: 15px;
            background-color: var(--parchment-dark);
            border: 1px solid var(--gold-dark);
            border-radius: 5px;
        }

        .event-list-title {
            font-family: 'MedievalSharp', cursive;
            color: var(--gold-light);
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .event-list-title.combat {
            color: var(--accent);
        }

        .event-list-description {
            color: var(--ink);
            font-size: 15px;
            line-height: 1.5;
            font-family: 'Cormorant Garamond', serif;
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--parchment);
            color: var(--ink);
            border: 2px solid var(--bronze);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background-color: var(--bronze);
            color: var(--parchment);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background-color: var(--ink);
            color: var(--parchment);
            border-color: var(--ink);
        }

        .event-counter {
            text-align: center;
            margin-bottom: 20px;
            color: var(--gold-light);
            font-family: 'MedievalSharp', cursive;
            font-size: 1.2rem;
        }

        /* Styles for reveal buttons within event descriptions */
        .reveal-button {
            display: inline-block;
            padding: 8px 15px;
            background: linear-gradient(to bottom, var(--gold-light), var(--gold));
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            font-family: 'MedievalSharp', cursive;
            color: var(--ink2);
            margin: 5px 0;
            transition: all 0.2s ease;
        }

        .reveal-button:hover {
            background: linear-gradient(to bottom, var(--gold), var(--gold-dark));
            transform: translateY(-1px);
            box-shadow: 0 2px 4px var(--shadow);
        }

        /* Styles for hidden revelation content */
        .reveal-content {
            margin-top: 10px;
            padding: 10px;
            background-color: var(--parchment-dark);
            border-left: 3px solid var(--gold);
            border-radius: 3px;
            font-style: italic;
            color: var(--gold-light);
        }

        /* Button styling within event descriptions */
        #eventDescriptionEl button {
            display: inline-block;
            padding: 6px 12px;
            background: linear-gradient(to bottom, var(--gold-light), var(--gold));
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'MedievalSharp', cursive;
            color: var(--ink2);
            margin: 3px 2px;
            transition: all 0.2s ease;
        }

        #eventDescriptionEl button:hover {
            background: linear-gradient(to bottom, var(--gold), var(--gold-dark));
            transform: translateY(-1px);
            box-shadow: 0 2px 4px var(--shadow);
        }

    </style>
</head>
<body>
    <div id="appContainerEl">
        <div class="corner-decoration top-left"></div>
        <div class="corner-decoration top-right"></div>
        <div class="corner-decoration bottom-left"></div>
        <div class="corner-decoration bottom-right"></div>

        <!-- Hidden secret button for event list (overlays bottom-right corner decoration) -->
        <div id="secretEventListButton" style="
            position: absolute;
            bottom: -6px;
            right: -6px;
            width: 60px;
            height: 60px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 1001;
            border-bottom-right-radius: 15px;
        " onclick="showAllEvents()" title="Secret Event List Access"></div>

        <h1>Forest Encounter Generator</h1>

        <div class="section-container">
            <button id="generateBtn">Generate Random Encounter</button>
            <div id="eventResultEl">
                <h3 id="eventTitleEl"></h3>
                <p id="eventDescriptionEl"></p>
            </div>
        </div>
    </div>

    <!-- Modal for displaying all events -->
    <div id="eventListModal" class="modal">
        <div class="modal-content">
            <span class="close-button" onclick="closeEventList()">&times;</span>
            <h1 style="text-align: center; margin-bottom: 20px;">Complete Forest Event Library</h1>
            <div class="filter-buttons" style="text-align: center; margin-bottom: 15px;">
                <button id="showAllBtn" class="filter-btn active" onclick="filterEvents('all')">All Events</button>
                <button id="showCombatBtn" class="filter-btn" onclick="filterEvents('combat')">Combat Only</button>
                <button id="showNonCombatBtn" class="filter-btn" onclick="filterEvents('non-combat')">Non-Combat Only</button>
            </div>
            <div class="event-counter" id="eventCounter"></div>
            <div id="allEventsList"></div>
        </div>
    </div>

    <script>
        // DOM Element References
        const generateBtn = document.getElementById('generateBtn');
        const eventResultEl = document.getElementById('eventResultEl');
        const eventTitleEl = document.getElementById('eventTitleEl');
        const eventDescriptionEl = document.getElementById('eventDescriptionEl');

        // Encounter database
        const forestEncounters = [
            { title: "Darkling Ambush", description: "A hunting pack of 2 Darkforme-Sleek-Lurker Pack Alphas and 4 Darkling-Lurkers bursts from the undergrowth, attempting to surround the party.", isCombat: true },
            { title: "Echo Bloom", description: "The party finds a large, pulsating flower. It projects a silent, harmless, holographic scene of two students from a bygone era having a picnic. One is a Pupperling, the other a human boy.", isCombat: false },
            { title: "The Weeping Stream", description: "A stream runs murky and grey. Drinking from it or touching the water forces a DC 13 Wisdom saving throw. On a failure, the character is overwhelmed with a feeling of profound loss and must immediately make a potty check.", isCombat: false },
            { title: "Spinebearer's Thicket", description: "A thorny thicket conceals 2 Darkforme-Spinebearers who use their grappling spines to pull travelers into the hazardous terrain.", isCombat: true },
            { title: "Forgotten Trench", description: "The party discovers a collapsed trench line from the Old War, half-swallowed by the forest. A DC 14 Investigation check uncovers a rusted, non-magical shortsword and a tattered Scholian banner.", isCombat: false },
            { title: "Gluttonberry Patch", description: "A bush laden with irresistible Gluttonberries. Any character who eats one must succeed on a DC 14 Constitution saving throw or suffer the effects of a Potion of Gluttonous Consequences, requiring an immediate diaper change.", isCombat: false },
            { title: "Brackish Pool", description: "A murky pond is home to 3 Darkling-Bracklings. They use their Ink Spray to blind targets before swarming them with tendril lashes.", isCombat: true },
            { title: "The Silent Watcher", description: "A Nursery Nightweaver Diaparachnid observes the party from high in the canopy. It is not hostile and is merely studying the party's behavior. It will retreat if confronted, using its Shadowy Camouflage to disappear.", isCombat: false },
            { title: "Discarded Padding", description: "The party finds a high-quality, but fully used, CloudSoft DreamWeaver diaper discarded near the path. It seems to have been changed recently.<br><br><b>Quest:</b> Investigate the situation. DC 14 Wisdom (Survival) to track where it came from, DC 12 Intelligence (Investigation) to determine if the person who discarded it might be in trouble. Success may lead to finding a lost or injured student who needs help, earning their gratitude and a small reward from the Academy.", isCombat: false },
            { title: "Hungry, Hungry Darkling", description: "A lone, ravenous Darkforme-Hungore attempts to ambush the party, its ventral maw gaping wide as it charges from behind a large boulder.", isCombat: true },
            { title: "Psychic Cold Spot", description: "The air grows unnaturally cold. This is the site of a forgotten skirmish. Characters must make a DC 13 Wisdom save or be affected by a minor, unsettling illusion of shadowy figures clashing at the edge of their vision. This is a prime location for Umbra's influence to be felt.", isCombat: false },
            { title: "Yowler's Harrassment", description: "A flock of 5 Darkling-Yowlers dive-bombs the party, not to kill, but to harass them with their Ordure Wail, hoping to attract larger predators with the commotion.", isCombat: true },
            { title: "Web Hammock", description: "A masterfully spun Diaparachnid Web Hammock is strung between two ancient trees, offering a perfectly safe place for a short or long rest.", isCombat: false },
            { title: "Cactine Patch", description: "What appears to be a patch of strange cacti is actually 6 Darkling-Cactines and 1 Darkling-Cactine-Biggo-Boy. They attack if anyone gets too close.", isCombat: true },
            { title: "Warforged Head", description: "A rusted, moss-covered head of a Warforged construct lies half-buried in the mud. Its eyes are dark and lifeless, a relic of Tabitha's army.", isCombat: false },
            { title: "Bellowbelly's Rage", description: "A Darkling-Bellowbelly is enraged, its wails echoing through the trees. It is guarding a small nest containing 3 Darkling Bellowbelly Cublings.", isCombat: true },
            { title: "Lost Student", description: "A first-year Crinkly-Crawlie (Bee) student is lost, crying softly. They were collecting rare pollen for a project and wandered too far. They are scared but unharmed.<br><br><b>Quest:</b> Guide them safely back. DC 12 Wisdom (Survival) to find the path, or DC 14 Charisma (Persuasion) to calm them and convince them to use their natural flight abilities. Success grants their grateful family's blessing and a small jar of <b>Rare Pollen</b> (spell component worth 25gp).", isCombat: false },
            { title: "Suffocator's Snare", description: "A Darkforme-Suffocator drops from a tree, attempting to grapple and embrace the last person in the party's marching order.", isCombat: true },
            { title: "Unexploded Regression Bomb", description: "A metallic sphere, about the size of a melon, is embedded in the earth. It hums with faint magic. It is a dormant Regression Bomb from the Old War. A DC 18 Arcana check can identify it. If disturbed without care, it explodes, forcing a DC 15 Constitution save on all within 30 feet. On a failure, a creature is affected by a powerful age regression curse for 1d4 hours, requiring immediate care.", isCombat: false },
            { title: "Darkaconda Ambush", description: "A massive Darkaconda lumes from a deep pool of water, using its Serpent-Lance Lunge to strike at the nearest character.", isCombat: true },
            { title: "Lurker Pack", description: "A large pack of 8 Darkling-Lurkers uses Pack Tactics to try and overwhelm the party, swarming them from all sides.", isCombat: true },
            { title: "Fairy Ring", description: "A ring of glowing mushrooms marks a portal to the Feywild. Stepping inside transports the creature to a harmless, beautiful glade for 1 minute before returning them to the same spot.", isCombat: false },
            { title: "Ossokin Swarm", description: "A seemingly normal pile of bones suddenly animates into 10 Darkling-Ossokin and 2 Darkling-Ossokin-Proselytes that attempt to overwhelm the party with numbers and minor divine magic.", isCombat: true },
            { title: "AeroDry Active Racer Red", description: "A single, unused AeroDry Active Racer Red diaper is snagged on a branch, as if it fell from a pack.<br><br><b>Quest:</b> Determine the owner. DC 13 Wisdom (Survival) to follow the trail, DC 15 Intelligence (Investigation) to examine the diaper for identifying marks. Success leads to finding a stressed student who dropped their emergency supplies and is very grateful for their return, offering useful information about Academy life or forest paths.", isCombat: false },
            { title: "Overwatch Patrol", description: "A patrol of 4 Darkforme Overwatch units silently moves through the woods, their tendrils lashing out at any perceived threat.", isCombat: true },
            { title: "Haunted Battlefield", description: "The party enters a clearing where the grass is grey and dead. The faint sounds of battle and screams can be heard on the wind, psychic echoes of the First Internal Siege.", isCombat: false },
            { title: "The Slurper's Meal", description: "A Darkling-Slurper is attempting to consume a large boar. It will aggressively defend its meal if the party approaches.", isCombat: true },
            { title: "Abandoned Pack", description: "A rotted leather backpack contains a waterlogged spellbook (only the cantrip Spank! is legible), a half-eaten ration, and a single, clean UniGuard Basic White diaper.<br><br><b>Quest:</b> Investigate the pack's origin. DC 14 Intelligence (Investigation) to examine the pack for clues about its owner, DC 16 Intelligence (History) to date when it was lost. Success reveals it belonged to a student who died in the early days of the Old War, and the pack contains a hidden compartment with a <b>Letter of Last Words</b> that, if delivered to the Academy archives, grants favor with the librarians.", isCombat: false },
            { title: "Cavesweller's Lair", description: "The party finds the entrance to a shallow cave. It is the lair of a Darkforme-Cavesweller, which will attack fiercely to defend its territory.", isCombat: true },
            { title: "Nightshade Grove", description: "A grove of shadowy trees is home to 3 Darkling-Nightshade Elementals. They are territorial and will attack anyone entering their grove.", isCombat: true },
            { title: "Shark-Infested Waters", description: "A fast-moving river is home to 2 Darkforme-Sharks and 4 Darkling-Sharks. They use the current to ambush anyone attempting to cross.", isCombat: true },
            { title: "The Ghostly Host", description: "A spectral echo of a student, one of the 'Ghostly Host' from the library, drifts silently through the trees, weeping. It is a non-hostile, tragic remnant.", isCombat: false },
            { title: "Enforcer's Justice", description: "A powerful Darkform Enforcer is 'patrolling' this section of the forest. It views the party as intruders and moves to eliminate them.", isCombat: true },
            { title: "Message Tree", description: "An ancient oak has names and messages carved into its bark by generations of students. A DC 12 Perception check reveals a heart with the initials 'U + P' carved long ago.", isCombat: false },
            { title: "Paralurker Swoop", description: "A hunting party of 4 Darkling-Paralurkers and 2 Weirdling-Paralurkers glides down from the canopy, using their Talon Kicks in a coordinated assault.", isCombat: true },
            { title: "Makeshift Shrine", description: "A small, crude shrine has been built at the base of a rock formation. It seems to be dedicated to Umbra, with offerings of dead flowers and broken toys.", isCombat: false },
            { title: "Hooter Swarm", description: "A truly annoying swarm of 10 Darkling-Hooters descends, their Gutwrenching Hootery making it nearly impossible to concentrate.", isCombat: true },
            { title: "Diaparachnid Silk", description: "Glistening strands of incredibly strong silk are strung between trees, remnants of a Diaparachnid's passage.", isCombat: false },
            { title: "Aegisite Defenders", description: "Two Darkforme-Ossokin-Aegisites are protecting a Darkling-Ossokin-Proselyte as it performs a strange ritual over a pile of animal bones.", isCombat: true },
            { title: "The Charger's Path", description: "A mighty Darkling-Ossuite Charger Omega thunders through the forest. It is not actively hunting the party but will attack anything that gets in its way.", isCombat: true },
            { title: "A Crinkly-Crawlie Collector", description: "A friendly Crinkly-Crawlie (Moth) is carefully collecting samples of moss. They are happy to trade information about the forest for help in finding a rare, glowing moss.<br><br><b>Quest:</b> Help find the Lumin-Moss. DC 14 Wisdom (Survival) to track down the rare moss, or DC 16 Intelligence (Nature) to know where it grows. Success grants detailed maps of forest safe paths and a sample of <b>Lumin-Moss</b> (provides dim light for 8 hours when activated).", isCombat: false },
            { title: "Slitherscale Nest", description: "The party stumbles upon a nest of 8 Darkling-Slitherscales, which swarm out from burrows in the ground to bite at the party's ankles.", isCombat: true },
            { title: "Rival Adventuring Party", description: "A group of 4 NPC students from a rival academy are also exploring the woods. They might be friendly, haughty, or seeking the same objective as the party.<br><br><b>Quest:</b> Navigate the encounter. DC 13 Charisma (Persuasion) for friendly interaction, DC 15 Charisma (Intimidation) to establish dominance, or DC 14 Wisdom (Insight) to determine their true intentions. Success can lead to temporary alliance, useful information, or avoiding conflict entirely.", isCombat: false },
            { title: "Shade-Sneak Pack", description: "A pack of 6 Darkforme-Shade-Sneaks uses the dim light of the forest canopy to stalk the party before attacking from the shadows.", isCombat: true },
            { title: "Old War Helmet", description: "A beautifully crafted, but dented, helmet from a Scholian loyalist officer lies on the forest floor. It is non-magical but a poignant historical artifact.", isCombat: false },
            { title: "The Darkformless", description: "A being of pure shadow, The Darkformless, rises from a pool of stagnant, dark water, flanked by 2 Darkling-Nightshade Elementals. It attacks with bolts of pure necrotic energy.", isCombat: true },
            { title: "Wounded Animal", description: "The party finds a large forest cat with its leg caught in a rusted, Old War-era snare trap. It is hostile but can be calmed and freed with a successful DC 15 Animal Handling check.<br><br><b>Quest:</b> Free the trapped animal. DC 15 Wisdom (Animal Handling) to calm it, then DC 12 Thieves' Tools or Strength check to break the trap. Success earns the cat's gratitude—it may appear later to help the party in a dangerous situation. Failure results in 1d4 claw damage.", isCombat: false },
            { title: "Caller's Trap", description: "A lone Darkling-Caller emits its Piercing Call, attempting to lure the party into an ambush set by 3 Darkforme Overwatch units hiding in the trees.", isCombat: true },
            { title: "Faded Magic Circle", description: "A large, faded summoning circle is etched into a flat stone outcropping. A DC 16 Arcana check reveals it was used for binding elementals long ago.<br><br><b>Quest:</b> Investigate the circle's purpose. DC 16 Intelligence (Arcana) to understand its original function, DC 18 Intelligence (History) to identify when it was made. Success reveals it was used to summon protective earth elementals during the Old War, and traces of that magic remain. Characters can attempt to reactivate it with a DC 20 Arcana check, summoning a friendly earth elemental for 1 hour.", isCombat: false },
            { title: "Sky-Darkener's Hunt", description: "A Sky-Darkener Nightveil circles high overhead. It is hunting and will dive upon any character that appears isolated or weak.", isCombat: true },
            { title: "Darkling Patrol", description: "A mixed patrol of 1 Darkforme Enforcer and 3 Darkforme Overwatch move with purpose through the trees.", isCombat: true },
            { title: "Rival's Remains", description: "The party finds the remains of another adventurer, clearly killed by a Darkling. They have a Potion of Healing and a diary detailing their search for a 'Sunken Tower'.", isCombat: false },
            { title: "Nightsipper's Feeding Ground", description: "A clearing is unnaturally silent and covered in a thin layer of black slime. A Darkforme Nightsipper is digesting a deer nearby and will become hostile if disturbed.", isCombat: true },
            { title: "Ancient Grave Marker", description: "A simple stone grave marker reads: 'Lian. He chose his path.' It is covered in fresh, vibrant flowers.", isCombat: false },
            { title: "Chap'hell's Territory", description: "The area becomes unnervingly quiet. Bones litter the ground. The party has entered the hunting grounds of a Chap'hell. It stalks them, waiting for the right moment to strike.", isCombat: true },
            { title: "A Moment of Peace", description: "The party finds a beautiful, secluded waterfall. The area feels safe and calm, a perfect spot for a short rest. No dangers are present here.", isCombat: false },
            { title: "The Ground Rumbles", description: "The ground trembles as 2 Darkling-Ossuite Chargers practice jousting with each other, their lances clashing. They are not immediately hostile but will attack if approached.", isCombat: true },
            { title: "A Child's Toy", description: "A well-loved, but muddy, plush Pupperling doll lies abandoned on the path. It is identical to one Pliya might have carried.", isCombat: false },
            { title: "Darkling Infighting", description: "A Darkling-Bellowbelly is locked in a territorial dispute with 2 Darkforme-Spinebearers. The party can intervene, sneak past, or wait for a winner to emerge.", isCombat: true },
            { title: "A Pokeypadbutthoid Scout", description: "A Diaparachnid (Pokeypadbutthoid) is scouting the area. They are wary but not hostile, and might trade information about a nearby danger for a ration or some water.<br><br><b>Quest:</b> Establish trust and trade. DC 12 Charisma (Persuasion) to gain their trust, then offer food or water. Success reveals the location of a dangerous Darkling nest ahead and grants a <b>Diaparachnid Silk Rope</b> (50 feet, twice as strong as normal rope).", isCombat: false },
            { title: "The Unseen Threat", description: "A Darkforme-Suffocator and 2 Darkforme-Shade-Sneaks work in concert, with the Suffocator attempting to grapple a target while the Shade-Sneaks attack with advantage.", isCombat: true },
            { title: "A Pouch of Diapers", description: "A small, waterproof pouch contains three unused *ToughTikes Tactical Jungle Green* diapers and a tube of high-quality barrier cream.", isCombat: false },
            { title: "The Hunter and the Hunted", description: "A Darkforme-Sleek-Lurker Pack Alpha is stalking a lone Darkling-Yowler. The party's arrival disrupts the hunt, potentially turning both creatures against them.", isCombat: true },
            { title: "An Offering", description: "At the base of a twisted, ancient tree, someone has left a perfectly crafted toy sword and a single, pristine *KuddlePuffs StarrySlumber* diaper. It feels like an offering to a lost child.", isCombat: false },
            { title: "River Ambush", description: "As the party fords a river, 2 Darkling-Bracklings and a Darkforme-Shark attack from beneath the surface.", isCombat: true },
            { title: "A Moment of Beauty", description: "A cloud of harmless, bioluminescent moths (kin to the Crinkly-Crawlies) flutters past, illuminating the forest in a breathtaking, momentary display of soft light.", isCombat: false },
            { title: "The Bone Collector", description: "A Darkling-Ossokin-Proselyte is gathering bones, attended by 4 Darkling-Ossokin. They are not immediately hostile but will defend their collection if the party interferes.", isCombat: true },
            { title: "Faded Warning", description: "Carved into a rock face is a faded warning in Common: 'Beware the Well's Echo. Fear Walks Here.'", isCombat: false },
            { title: "Cavesweller's Rage", description: "A Darkforme-Cavesweller bursts from the earth, enraged by the party's loud passage through its territory. It is joined by 2 Darkling-Slurpers attracted by the commotion.", isCombat: true },
            { title: "A Lost Letter", description: "A sealed, waterproof letter case is found. The letter inside is from a student named Seris to her family, talking about her new friends Umbirgitte, Pliya, and Lian, and her hopes that the political tensions will soon pass.", isCombat: false },
            { title: "The Final Patrol", description: "The party encounters a powerful patrol consisting of 1 Darkling-Ossuite Charger Omega and 2 Darkforme Overwatch units. They are actively hunting for intruders.", isCombat: true },
            { title: "A Peaceful Grove", description: "The party finds a small, sun-dappled grove where the air is warm and smells of honey. Several friendly Crinkly-Crawlie (Bee) students are here tending to magical flowers. They offer the party a taste of their magical honey.", isCombat: false },
            { title: "The Big Game Hunter", description: "A Chap'hell is actively hunting the party, using its spellcasting to separate and weaken them before it moves in for the kill.", isCombat: true },
            { title: "A Forgotten Camp", description: "An old, overgrown campsite from the war. A rusted cooking pot, a tattered bedroll, and a single, perfectly preserved *KuddlePuffs DinoRoar* diaper are all that remain.", isCombat: false },
            { title: "Darkling Scavengers", description: "A group of scavengers, 1 Darkforme-Hungore and 4 Darkling-Lurkers, are picking over the corpse of a large beast. They will attack to defend their food.", isCombat: true },
            { title: "The Whispering Tree", description: "A tree whispers secrets to those who listen. Anyone who succeeds on a DC 15 Wisdom (Insight) check hears a fragment of Umbirgitte's memory: 'Pliya, no! Not you... not you, too...'<br><br><b>Quest:</b> Uncover more memories. DC 15 Wisdom (Insight) to hear the first memory, then DC 18 Intelligence (Arcana) to safely delve deeper into the psychic echoes. Success reveals more fragments about the final confrontation between the friends, but failure risks 1d4 psychic damage and being overwhelmed by tragic emotions for 1 hour.", isCombat: false },
            { title: "Nightveil's Nest", description: "The party discovers a massive nest high in the treetops. It belongs to a Sky-Darkener Nightveil, which will attack fiercely if the nest is approached. There is a 50% chance it is currently in the nest.", isCombat: true },
            { title: "A Moment of Respite", description: "The party finds an abandoned but intact hunter's blind. It's a safe and dry place to take a short rest.", isCombat: false },
            { title: "The Shadow Ambush", description: "A cunning group of 2 Darkforme-Shade-Sneaks, 1 Darkforme-Suffocator, and The Darkformless uses the environment to set a deadly ambush, with The Darkformless providing magical support from the rear.", isCombat: true },
            { title: "The Old Path", description: "The party finds a barely-visible stone path, mostly reclaimed by the forest. Following it leads to a beautiful, hidden clearing with a small, clear spring of potable water.", isCombat: false },
            { title: "Territorial Dispute", description: "A Darkaconda and a Darkforme-Shark are fighting over a prime hunting spot in a deep river pool. The party can try to sneak by or face the winner.", isCombat: true },
            { title: "A Friend's Grave", description: "A small, well-tended grave is marked with a simple wooden sign: 'Pliya. A True Friend.' A fresh bouquet of wildflowers has been placed on it recently.", isCombat: false },
            { title: "The Ultimate Patrol", description: "A deadly serious hunting party, consisting of 1 Darkform Enforcer, 1 Darkling-Ossuite Charger Omega, and 2 Darkforme-Sleek-Lurker Pack Alphas, is tracking the party with grim intent.", isCombat: true },
            { title: "The Path Home", description: "The party finds a clear, well-maintained path that leads directly back towards the Academy walls.", isCombat: false },
            { title: "A Cry for Help", description: "A faint cry for help leads the party to a student trapped in a pitfall trap set by Darklings. Rescuing them may attract the trap-setters: 4 Darkling-Lurkers.", isCombat: true },
            { title: "A Quiet Place", description: "The forest opens into a serene meadow filled with fireflies. The area is magically peaceful, and any character spending a short rest here removes one level of exhaustion.", isCombat: false },
            { title: "The Final Stand", description: "The party is cornered by a powerful force led by a Chap'hell, supported by 2 Darkform Enforcers and 4 Darkforme Overwatch units. This is a boss-level encounter.", isCombat: true },
            { title: "A Glimmer of Hope", description: "The sun breaks through the canopy, and the party sees the familiar sight of the Academy's towers in the distance. The immediate area is safe.", isCombat: false },
            { title: "The Stalking Horror", description: "A Chap'hell has been drawn by the party's presence. It uses its spellcasting and stealth to harass and terrorize them, striking from the shadows and teleporting away, turning the entire journey into a running battle.", isCombat: true },
            { title: "The Lost Explorer", description: "The party finds a lone Silkswaddler Diaparachnid who has gotten turned around while mapping the deep woods. They are immensely strong and grateful for an escort back to familiar territory, offering to share their knowledge of hidden paths.<br><br><b>Quest:</b> Guide them to safety. DC 13 Wisdom (Survival) to find familiar landmarks, or DC 15 Intelligence (Investigation) to interpret their crude maps. Success grants detailed knowledge of secret forest paths (advantage on future Survival checks in this forest) and a <b>Silkswaddler's Gratitude Token</b>.", isCombat: false },
            { title: "The Feeding Frenzy", description: "A large animal has fallen into a ravine, attracting a host of predators. 1 Darkforme-Hungore, 3 Darkling-Slurpers, and 5 Darkling-Lurkers are all fighting over the carcass. They will attack anything that approaches.", isCombat: true },
            { title: "Relic of the Past", description: "Embedded in an ancient tree is a perfectly preserved, though non-magical, lance from a Scholian knight's uniform. It is a beautiful and historical piece.", isCombat: false },
            { title: "The Grand Hunt", description: "The party stumbles into the middle of a grand hunt. 1 Darkling-Ossuite Charger Omega is leading a pack of 4 Darkforme-Sleek-Lurker Pack Alphas in pursuit of a massive, non-hostile beast. They will trample or attack anything that gets between them and their prey.", isCombat: true },
            { title: "The End of the Road", description: "The party finds a clear path leading directly back to a lesser-used gate of the Academy, offering a safe return.", isCombat: false },
            { title: "Golden Graceberry Patch",description: "The party discovers a patch of bushes bearing 2d4 golden, pearlescent berries that shine with a gentle, sacred light. These are Golden Graceberries. <br><br><b>Effects:</b> A character can consume a berry to immediately roll one of their hit dice and regain that many hit points, as if after a short rest. Up to three berries can be eaten safely. <br><br><b>Sacred Consequences:</b> If a character eats more than three berries before a short rest, they must succeed on a DC 12 Potty Check or suffer a hypermessy accident. Regardless of the check, they become incontinent for 1d4 days. After the accident, they gain a +1 'Sudden Relief Bonus' to all rolls for 1 hour. All who consume the berries glow as if under the <i>Light</i> spell for 1 hour.", isCombat: false},
            { title: "Overgrown Gluttonberry Bush", description: "A massive, ancient Gluttonberry bush, far larger than normal, dominates a small clearing. The berries are exceptionally potent. Anyone eating one must make a DC 16 Constitution saving throw (instead of 14) or suffer the consequences. A DC 14 Nature check reveals the bush is drawing on a faint source of wild magic, explaining its size and potency.", isCombat: false },
            { title: "March of the Cublings", description: "The sound of incessant, high-pitched chirping grows louder. A seemingly endless column of <b>15 Darkling Bellowbelly Cublings</b> marches through the undergrowth. They are not immediately hostile, but will swarm anything that threatens their procession. Their combined 'Irresistibly Chirpy' trait creates a high risk of attracting much larger threats.", isCombat: true },
            { title: "Darkforged Remnant Patrol", description: "A patrol of Old War constructs still loyal to Tabitha's forgotten cause patrols a crumbling section of an old road. The group consists of <b>1 Darkforged Remnant (Bulwark)</b> providing cover, <b>2 Darkforged Remnants (Lash)</b> pulling enemies in, and <b>2 Darkforged Remnants (Spike)</b> firing from a distance. They are a significant threat to a lone traveler but manageable for a prepared group.", isCombat: true },
            { title: "Primogenitor's Pack", description: "A highly intelligent <b>Lurker Primogenitor</b> leads its pack of <b>4 Darkling-Lurkers</b> in a coordinated hunt. The Primogenitor uses its Pack Coordination to command its minions, setting up devastating ambushes.", isCombat: true },
            { title: "Corridorcrusher's Ambush", description: "What appears to be a mossy hill suddenly erupts as a <b>Corridorcrusher</b> bursts from the earth. It uses its Echoing Wail to disorient prey before charging.", isCombat: true },
            { title: "Darkwatch Assassin", description: "A lone <b>Warforged Darkwatch</b>, a relic of a more advanced era of the Old War, stalks the party. It uses its Stasis Grenade to incapacitate a target before moving in to eliminate them with its Energy Blade.", isCombat: true },
            { title: "Fey Punishment Detail", description: "A <b>Darkforme Punishment Maid</b> is escorting two giggling <b>Darkling-Ticklefingers</b> through the woods. They seem to be on a mission and will view any interruption as a punishable offense.", isCombat: true },
            { title: "Nailbearer's Scrap Heap", description: "The party stumbles upon a large, rusted scrap heap from the Old War. A <b>Nailbearer</b> has made its nest here and will defend its territory with volleys of Nail Bursts.", isCombat: true },
            { title: "Liquid Legion Ambush", description: "A patch of dark, bubbling mud in a clearing is actually two <b>Darkling Liquid Legions</b> lying in wait. They will attempt to engulf anyone who steps too close.", isCombat: true },
            { title: "The Cranky Horde", description: "A large, agitated swarm of <b>10 Bellyachers</b> is throwing a collective temper tantrum. Their Fierce Bites and Swarm Tactics make them a surprisingly dangerous obstacle.", isCombat: true },
            { title: "Pliya's Lost Ball", description: "The party finds a small, heavily worn rubber ball, the kind a Pupperling might play with. A successful DC 14 Investigation check reveals the faint, faded initials 'P.L.' on its surface. The area feels heavy with a sense of playful, innocent memory.", isCombat: false },
            { title: "The Weaver's Loom", description: "Deep in a secluded copse of trees, the party finds a large, intricate loom made of petrified wood and spider silk. A beautiful, half-finished banner depicting the original Scholia Diaspros crest hangs from it, seemingly abandoned mid-stitch. A DC 15 Nature check reveals Diaparachnid tracks, centuries old.", isCombat: false },
            { title: "Caelestis's Scar", description: "A clearing in the forest is a perfect circle of blackened, glassy earth where nothing grows. In the center, a faint, magical residue remains. A DC 17 Arcana check identifies it as residual energy from a powerful, destructive spell, characteristic of those used by Tabitha Caelestis during the Old War. Standing in the circle imparts a feeling of cold, ruthless ambition.", isCombat: false },
            { title: "The Fallen Ant", description: "The party finds the chitinous remains of a Crinkly-Crawlie (Ant) warrior. Their armored carapace is shattered, and they still clutch a broken spear. Nearby are the distinct tracks of a large Darkling, like a Darkforme-Cavesweller. It's a silent testament to a lost battle.", isCombat: false },
            { title: "The Fearful Ward", description: "The party finds a small, hidden burrow, clearly used as a shelter. Woven into the entrance is a complex pattern of sticks and vines. A DC 15 Religion or Arcana check identifies it as a primitive ward meant to instill fear in anything that approaches. It feels protective, not malicious—a clear sign of Umbra's influence.", isCombat: false },
            { title: "Lian's Conviction", description: "Tucked into the hollow of a tree is a small, waterproofed scroll. It's a letter from a student named Lian to his parents, written before the First Internal Siege. He writes with passionate conviction about Tabitha's vision for a stronger, more decisive Academy, believing her power will protect them all. He mentions his worry for his quiet friend, Umbirgitte, hoping she stays safe.", isCombat: false },
            { title: "The Healer's Garden", description: "The party discovers a small, miraculously untouched grove where medicinal herbs grow in perfect, neat rows. A DC 14 Medicine or Nature check identifies rare healing plants, including some that can be used as components for <i>Lesser Restoration</i>. This was clearly a hidden garden cultivated by a skilled healer, likely Seris, meant to provide aid to anyone who found it, regardless of faction.", isCombat: false },
            { title: "The Forgotten Apiary", description: "The party finds the crumbling stone foundations of an old building, now completely overgrown. In the center, a single, ancient beehive buzzes peacefully. A DC 15 History check reveals this was one of the first apiaries established by the Bee Crinkly-Crawlies, who helped cultivate the Academy's original gardens.", isCombat: false },
            { title: "The Wasp's Blade", description: "Stuck deep into an ancient tree is a cruel-looking stinger blade, clearly of Wasp Crinkly-Crawlie make. The tree has grown around it over the centuries. A DC 16 Investigation check reveals faint traces of both Scholian and Darkforged blood on the preserved metal, a relic of a forgotten duel.", isCombat: false },
            { title: "The South Tower's Shadow", description: "The party enters a clearing where no birds sing. The trees are stunted and twisted, and a palpable sense of dread hangs in the air. This is the psychic 'cold spot' where the South Dormitory Tower once stood. Any character with incontinence-related traits feels their anxiety sharpen here, and all potty checks are made at disadvantage while in the clearing.", isCombat: false },
            { title: "A Moth's Message", description: "A large, beautiful Luna Moth with intricate silver patterns on its wings lands on a party member's shoulder. It is a messenger from a Moth Crinkly-Crawlie clan. It telepathically communicates a single, cryptic image—a broken crown under a red moon—before flying away.", isCombat: false },
            { title: "Firefly Grave", description: "The party finds a small, well-tended grave marked with a smooth river stone. At night, the grave is illuminated by a single, mournful Firefly Crinkly-Crawlie who silently circles the spot. The grave belongs to its partner, lost in the Old War.", isCombat: false },
            { title: "Beetle's Bulwark", description: "The party finds a massive, perfectly smooth wall of fused rock, blocking what was once a pass. A DC 14 Investigation check reveals it was not natural, but constructed with immense force. This is a defensive bulwark created by Beetle Crinkly-Crawlies during the First Internal Siege to halt a Darkforged advance.", isCombat: false },
            { title: "The Stained Banner", description: "Caught on a high branch is a tattered, muddy banner. If retrieved, it shows the crest of a Wasp clan allied with Tabitha Caelestis. The banner is stained with the unmistakable, oily residue of a destroyed Darkforged Remnant, suggesting betrayal or infighting.", isCombat: false },
            { title: "The Well's Vein", description: "A stream runs with water that has a faint, oily, multi-colored sheen. A DC 18 Arcana check reveals the water is tainted with potent, raw soul-magic. This stream is fed by an underground spring that flows near the ruins of the Well of Souls, carrying a diluted echo of its power.", isCombat: false },
            { title: "A Memory of Laughter", description: "In a small, sunny glade, the faint sound of children's laughter can be heard, but there is no one there. It is a harmless psychic echo, a memory of Pliya, Lian, and Umbirgitte playing here long before the war.<br><br><b>Quest:</b> Commune with the memory. DC 14 Wisdom (Insight) to understand the nature of the echo, DC 16 Charisma (Persuasion) to 'join' the memory briefly. Success allows characters to experience a moment of pure, innocent joy, removing one level of exhaustion and granting inspiration. The memory also reveals a hidden cache nearby containing childhood mementos.", isCombat: false },
            { title: "The Mantis's Prayer", description: "The party finds a series of precise, angular scratches on a flat rock. They are not a language, but a form of meditative art. A DC 16 Insight or Religion check might interpret it as a Mantis Crinkly-Crawlie's prayer for a clean, swift kill, either for a hunt or an assassination.", isCombat: false },
            { title: "The Last Toy Soldier", description: "Half-buried in the mud is a finely crafted toy soldier, its uniform matching that of the Council's guard. Its head has been cleanly snapped off. It was a gift from Seris to Lian, a plea for him to remember his old friends, which he discarded before marching to war.", isCombat: false },
            { title: "A Taste of Honey", description: "The party finds a small clay pot tucked into the nook of a tree. It contains a single serving of Sunpetal Honey, left behind by a Bee Crinkly-Crawlie scout. It is still perfectly preserved and magically potent.", isCombat: false },

            // NEW LORE-INTEGRATED EVENTS
            { title: "The Darkling Bellowbelly's Lament", description: "A massive Darkling Bellowbelly sits in a clearing, its torso-mouth producing a low, mournful wail. Unlike the usual discordant sound, this cry seems genuinely sad. Investigation reveals it's mourning a fallen tree that provided its favorite roosting spot during the Old War.<br><br><b>Quest:</b> Comfort the Bellowbelly. DC 15 Wisdom (Animal Handling) to soothe it, or use Nature's Wet Wipes to clean old battle scars. Success grants a small vial of <b>Tears of Remembrance</b> (advantage on next History check).", isCombat: false },
            { title: "Darkling Pack Alpha's Territory", description: "The party stumbles into the territory of a Darkling Pack Alpha. Rather than attacking, it performs an elaborate shadow-teleportation display, clearly marking boundaries. Ancient claw marks on trees suggest this area has been protected for decades.<br><br><b>Quest:</b> Negotiate passage. DC 14 Charisma (Persuasion) or DC 13 Wisdom (Insight) to understand its protective nature. Success reveals it's guarding a memorial grove for fallen students from the Old War.", isCombat: false },
            { title: "The Wandering Crinkleheart", description: "A young Crinkleheart student has gotten lost during a nature study expedition. They're sitting dejectedly next to a broken PapaNimbus 2000, tears streaming down their crystalline face. They're too embarrassed to call for help using their natural communication abilities.<br><br><b>Quest:</b> Guide them home. DC 12 Wisdom (Survival) to find the path back, or DC 14 Charisma (Persuasion) to convince them to use their telepathic abilities to contact the Academy. Success grants a small <b>Crinkleheart Crystal</b> that glows softly for 24 hours.", isCombat: false },
            { title: "The Midnight Alchemy Club", description: "The party discovers a group of advanced students conducting illegal alchemical experiments in a hidden grove. They're trying to create a Superior Capacity Enhancer potion but have accidentally created a bubbling, rainbow-colored mess that's attracting every forest creature for miles.<br><br><b>Quest:</b> Help or Report. DC 15 Intelligence (Arcana) to help stabilize the experiment, or DC 12 Charisma (Intimidation) to convince them to stop. Helping grants an <b>Experimental Alchemical Compound</b> (random minor magical effect).", isCombat: false },
            { title: "The Scampersaurian Sports Team", description: "A small group of Scampersaurian students are practicing their traditional 'Tail-Ball' game, but their ball has gotten stuck high in a tree. They're too proud to ask for help but are clearly frustrated. Their natural agility isn't enough to reach the branch.<br><br><b>Quest:</b> Retrieve the ball. DC 14 Strength (Athletics) to climb, or creative magic solutions. Success earns their respect and an invitation to watch their next official match at the Academy.", isCombat: false },
            { title: "The Carcharodonian Study Group", description: "A lone Carcharodonian student sits by a stream, surrounded by floating magical textbooks. They're studying for their Potty Management Theory exam but the water nearby keeps triggering their natural aquatic instincts, making concentration impossible.<br><br><b>Quest:</b> Create a distraction-free study space. DC 13 Wisdom (Insight) to understand the problem, then DC 12 Survival to set up a proper study area. The grateful student shares advanced study notes (+1 to next Intelligence check).", isCombat: false },
            { title: "The Echoing Diaper Bomb", description: "The party finds a crater in the forest floor with spent Diaper Bomb casings scattered around. However, residual magic causes the area to randomly replay the sounds of the original explosion. Every few minutes, phantom 'POOF!' sounds echo through the trees.<br><br><b>Quest:</b> Dispel the echoes. DC 15 Intelligence (Arcana) to understand the magical resonance, then DC 13 Dispel Magic or similar to cleanse the area. Success reveals a hidden cache of <b>Unstable Diaper Bombs</b> (2d4 uses, but 10% chance to misfire).", isCombat: false },
            { title: "The Sunpetal Honey Heist", description: "A massive swarm of mundane bees has surrounded a tree containing a Bee Crinkly-Crawlie's carefully crafted hive. The non-magical bees are trying to steal the precious Sunpetal Honey, but the single Crinkly-Crawlie is vastly outnumbered.<br><br><b>Quest:</b> Mediate the situation. DC 14 Wisdom (Animal Handling) to negotiate with the swarm, or DC 13 Nature to understand their migration pattern. Success earns a jar of <b>Sunpetal Honey</b> and the Crinkly-Crawlie's eternal gratitude.", isCombat: false },
            { title: "The Moonpetal Bloom's Guardian", description: "The party discovers a rare Moonpetal Bloom in a moonlit clearing, but it's guarded by a territorial Darkling Shade-Sneak. The creature isn't malicious—it's protecting the flower from students who might over-harvest it for alchemy projects.<br><br><b>Quest:</b> Prove worthy. DC 15 Charisma (Persuasion) to show respect for nature, or DC 14 Stealth to approach without triggering its protective instincts. Success grants permission to harvest one petal and knowledge of where other blooms might be found.", isCombat: false },
            { title: "The Old War Memorial", description: "Hidden beneath overgrown vines, the party discovers a small stone memorial dedicated to 'The Little Defenders'—students who died protecting the Academy during the Old War. Fresh flowers have been placed recently, despite the remote location.<br><br><b>Quest:</b> Discover the visitor. DC 16 Wisdom (Investigation) reveals tracks leading to current Academy staff. Following up leads to a touching encounter with a groundskeeper who lost friends in the war.", isCombat: false },
            { title: "The Abandoned Classroom", description: "The party stumbles upon the ruins of an old outdoor classroom, complete with stone desks and a moss-covered chalkboard. Faded writing still shows lessons about 'Emergency Diaper Protocols' and 'Spontaneous Accident Response.'<br><br><b>Quest:</b> Restore the memorial. DC 12 Strength (Athletics) to clear debris, DC 14 Investigation to piece together the history. Success reveals a hidden compartment containing a <b>Wartime Combat Diaper</b> (AC +2, but cursed with memories of conflict).", isCombat: false },
            { title: "The Chronal Crystal Cache", description: "A small meteorite impact site contains several Chronal Crystals scattered around a strange, time-distorted tree. The tree shows all four seasons simultaneously, and occasionally phantom images of students from different eras flicker around it.<br><br><b>Quest:</b> Safely harvest the crystals. DC 16 Intelligence (Arcana) to understand the time magic, DC 14 Sleight of Hand to extract crystals without disrupting the temporal field. Success grants 1d4 <b>Chronal Crystals</b> but risks temporal echoes following the party.", isCombat: false },
            { title: "The Sympathetic Accident Field", description: "The party enters an area where a massive Spontaneous Accident spell was cast during a student prank gone wrong. The magical field still exists—anyone who fails a DC 12 Constitution save experiences a minor 'sympathetic accident' and must find privacy immediately.<br><br><b>Quest:</b> Dispel the field. DC 15 Intelligence (Arcana) to understand the magic, DC 14 Dispel Magic to cleanse the area. Success prevents future accidents and reveals the prankster's hidden stash of <b>Premium Academy Diapers</b>.", isCombat: false },
            { title: "The Cursed Changing Station", description: "An ornate stone changing station sits in a clearing, clearly magical but covered in warning runes. Investigation reveals it automatically Diapers anyone who approaches within 10 feet, but the release mechanism is broken.<br><br><b>Quest:</b> Fix the mechanism. DC 16 Intelligence (Investigation) to understand the magical lock, DC 15 Thieves' Tools or magical solution to repair it. Success grants a <b>Scroll of Diapering</b> and prevents future victims.", isCombat: false },
            { title: "The Barkgum Incident", description: "A student's Barkgum has gotten stuck to a tree branch after a failed attempt to blow a bubble. The magical gum has created a 15-foot sticky web that's trapped several small forest creatures and is slowly expanding.<br><br><b>Quest:</b> Remove the gum. DC 14 Intelligence (Arcana) to understand Barkgum's properties, creative problem-solving to safely remove it. Success frees the creatures and grants a handful of <b>Unstuck Barkgum</b> pieces.", isCombat: false },
            { title: "The Kittenfolk Naptime", description: "A small group of Kittenfolk students have created an elaborate pillow fort in a sunny clearing, complete with stolen Academy blankets. They're having an unauthorized naptime and invite the party to join their 'Afternoon Rest Club.'<br><br><b>Quest:</b> Join or protect. DC 12 Charisma (Persuasion) to be invited in, or DC 14 Insight to realize they're hiding from a difficult exam. Success leads to a restful short rest with advantage on the next ability check.", isCombat: false },
            { title: "The Berrimater Picnic", description: "A mixed group of students from different races have set up a picnic featuring Berrimaters and other Academy treats. They're celebrating one student's success in overcoming their Spontaneous Accident problems through dedicated practice.<br><br><b>Quest:</b> Celebrate with them. DC 10 Charisma (Persuasion) to join the celebration. Success grants a <b>Berrimater</b> (restores 1d4 HP) and uplifting stories about persistence and friendship.", isCombat: false },
            { title: "The Moth Silk Weaving Circle", description: "A group of Waddlehoof students are teaching younger students how to weave Moth Silk into protective clothing. Their patient instruction and gentle guidance creates a heartwarming scene of inter-year cooperation.<br><br><b>Quest:</b> Learn the craft. DC 13 Wisdom (Insight) to understand the technique, DC 12 Sleight of Hand to help with the weaving. Success grants a <b>Woven Moth Silk Charm</b> (+1 to saves against cold) and knowledge of Waddlehoof traditions.", isCombat: false },
            { title: "The Umbra Echo", description: "A section of forest grows unnaturally dark and cold. Trees lean away from a central point, and shadows move independently of their sources. This is a 'Deep Cold Spot'—a severe echo of Umbra's ancient slumber that poses real danger.<br><br><b>Quest:</b> Investigate safely. DC 17 Wisdom save to enter without being frightened, DC 16 Intelligence (Arcana) to understand the phenomenon. Success reveals this was where Umbra first fell to earth, and a <b>Shard of Eternal Shadow</b> can be found (powerful but dangerous magical focus).", isCombat: false },
            { title: "The Corrupted Luminancer", description: "The party encounters a student practicing Luminancer magic, but their light spells are producing shadow instead of radiance. They're panicking, unaware that they're being influenced by residual Darkling magic from a nearby battleground.<br><br><b>Quest:</b> Purify the magic. DC 15 Intelligence (Arcana) to identify the corruption, DC 16 Medicine or magical healing to cleanse them. Success saves the student and grants insight into how Darkling magic can corrupt light-based spells.", isCombat: false },
            { title: "The Whispering Combat Diapers", description: "A cache of Old War Combat Diapers has been uncovered by erosion. The magical armor pieces whisper memories of ancient battles, and some seem to be trying to possess nearby creatures to continue fighting a war that ended decades ago.<br><br><b>Quest:</b> Lay the memories to rest. DC 16 Wisdom (Insight) to understand the trapped spirits, DC 15 Religion or appropriate magic to give them peace. Success prevents the armor from becoming hostile and grants a <b>Blessed Combat Diaper</b> (AC +3, no curse).", isCombat: false },
            { title: "The Prefect's Secret", description: "The party discovers an Academy Prefect meeting secretly with a group of younger students. Investigation reveals they're running an underground 'Accident Support Group' for students struggling with magical incontinence issues.<br><br><b>Quest:</b> Decide their fate. DC 14 Wisdom (Insight) to understand their noble intentions, DC 12 Charisma (Persuasion) to convince them to make it official. Success leads to Academy recognition of the support group and a <b>Prefect's Recommendation</b> (advantage on next social interaction at the Academy).", isCombat: false },
            { title: "The Contraband Confiscation", description: "A Hall Monitor has hidden a cache of confiscated items in a hollow tree, but they've forgotten where they put it. The items include several Experimental Potions, banned Wild Magic Wands, and a collection of Imported Comfort Items from home.<br><br><b>Quest:</b> Help or claim. DC 15 Investigation to find the cache, then moral choice to return items or keep them. Returning them grants the Monitor's gratitude and future lenient treatment; keeping them risks being caught with contraband.", isCombat: false },
            { title: "The Class Rivalry", description: "Two groups of students from rival dormitories are having a 'prank war' in the forest. Their escalating magical jokes have gotten out of hand, with Animated Backpacks chasing students and Enchanted Uniforms trying to diaper everyone in sight.<br><br><b>Quest:</b> End the war. DC 14 Charisma (Persuasion) to negotiate peace, or DC 15 Intimidation to shut down both sides. Success earns respect from both groups and prevents escalation to dangerous levels.", isCombat: false },
            { title: "The Graduate's Return", description: "An older graduate has returned to the forest where they first learned magic. They're leaving small gifts for current students to find—Blessed Diapers, Comfort Charms, and encouraging notes about overcoming Academy challenges.<br><br><b>Quest:</b> Meet the benefactor. DC 16 Investigation to track them down, DC 12 Charisma (Persuasion) to convince them to reveal themselves. Success leads to a heartwarming conversation about Academy life and a <b>Graduate's Blessing</b> (inspiration die that can be used once).", isCombat: false },

            // BESTIARY MONSTER ENCOUNTERS (CR 3-7, challenging for solo level 5, manageable for groups)
            { title: "Primordial Bottle Beast Rampage", description: "A Primordial Bottle Beast (CR 4) has escaped from an old Academy experiment. This liquid elemental creature made of spoiled formula and corrupted potion ingredients rampages through the forest, leaving a trail of acidic destruction. Its Spoiled Form ability makes melee combat dangerous.<br><br><b>Tactics:</b> Uses Multiattack for two Milky Lash attacks (reach 10 ft, 2d6+4 bludgeoning plus 1d8 acid). Its Formula Geyser recharge ability creates a 20-foot cone of pressurized liquid. Anyone touching it takes 1d8 acid damage from its Spoiled Form.", isCombat: true },
            { title: "Pacifier Golem Guardian", description: "A malfunctioning Pacifier Golem (CR 5) from the Academy's old nursery ward patrols this section of forest. Originally designed to calm and protect infants, it now sees all adults as threats to 'the children' and attempts to pacify them through force.<br><br><b>Construct Tactics:</b> As a Large construct, it's immune to many conditions and has high AC. It attempts to grapple targets and force magical pacifiers into their mouths, inducing a calming but helpless state. Its Soothing Aura might actually help the party if they can avoid being seen as threats.", isCombat: true },
            { title: "Dark Dimension Changebot Infiltration", description: "A group of 3-4 Dark Dimension Changebots (CR 2 each) have been scouting the forest for potential targets. These mechanical shapeshifters from Tabitha's forces can disguise themselves as Academy equipment or even students. They're gathering intelligence on current Academy defenses.<br><br><b>Shapeshifter Tactics:</b> Initially appear as harmless objects or lost students. When their cover is blown, they coordinate attacks using their mechanical precision. Their ability to change form mid-combat makes them unpredictable opponents.", isCombat: true },
            { title: "Darkling-Ghostiby Haunting", description: "A pack of 6-8 Darkling-Ghostiby (CR 1/4 each, but numerous) phases through the trees around the party. These spectral entities are drawn to strong emotions and memories, becoming more corporeal and dangerous when they feed on fear or sadness.<br><br><b>Incorporeal Swarm:</b> While individually weak, their numbers and incorporeal nature make them challenging. They can phase through armor and objects, targeting the party's mental state. Fear effects make them stronger, while courage and resolve weaken them.", isCombat: true },
            { title: "Darkling-Ticklefinger Ambush", description: "A group of 2-3 Darkling-Ticklefingers (CR 1/2 each) has been stalking the party, waiting for the perfect moment to strike. These mischievous creatures delight in causing involuntary reactions and embarrassing accidents through their supernatural tickling abilities.<br><br><b>Harassment Tactics:</b> Use stealth and surprise to trigger Spontaneous Accidents in party members. While not lethal, they can severely compromise the party's dignity and force them to deal with uncomfortable situations while managing a combat encounter.", isCombat: true },      { title: "Darkling-Ticklefinger Ambush", description: "A lone Darkling-Ticklefinger (CR 1/2) has been stalking the party, waiting for the perfect moment to strike. This creature delights in causing involuntary reactions and embarrassing accidents through its supernatural tickling abilities.<br><br><b>Harassment Tactics:</b> Uses stealth and surprise to trigger Spontaneous Accidents in party members. While not lethal, it can severely compromise the party's dignity and force them to deal with uncomfortable situations while managing a combat encounter.", isCombat: true },
            { title: "Darkforme Punishment Maid's Domain", description: "A Darkforme Punishment Maid (CR 3) has claimed an old Academy outpost as her domain. This corrupted caretaker entity believes she's still serving the Academy by 'disciplining' any students who venture into 'her' territory without permission.<br><br><b>Disciplinary Combat:</b> Uses magical cleaning implements as weapons and can cast minor enchantments to force behavioral compliance. Her attacks focus on humiliation and restraint rather than direct damage, but she will escalate to lethal force if her 'students' are unruly.", isCombat: true },
            { title: "Darkling Liquid Legion Pool", description: "What appears to be a harmless forest stream is actually a Darkling Liquid Legion (CR 2) in its dispersed form. This amorphous creature can spread itself across a large area, then suddenly coalesce to attack unsuspecting travelers.<br><br><b>Liquid Ambush:</b> Initially undetectable as it mimics natural water features. When it attacks, it can engulf creatures, attempt to drown them, or form pseudopods to strike. Its fluid nature makes it resistant to many physical attacks.", isCombat: true },
            { title: "Dark Dimension Regressor Field Anomaly", description: "A Dark Dimension Regressor Field (CR 6) has manifested in this area, creating a zone where time and maturity flow backward. The field itself is not directly hostile, but it spawns temporal echoes and age-regression effects that make the area extremely dangerous.<br><br><b>Reality Distortion:</b> The field constantly attempts to regress anyone within it to a younger, more helpless state. Combat within the field is complicated by ongoing Constitution saves against age regression. The party must either destroy the field's anchor point or find a way to navigate around it.", isCombat: true },
            { title: "Lost Plushie Awakening", description: "A seemingly innocent Lost Plushie (CR 1/8) sits abandoned in a clearing, but investigation reveals it's been animated by residual Academy magic. While individually harmless, it has attracted 2-3 more dangerous creatures who are drawn to its innocent magical aura.<br><br><b>Innocent Bait:</b> The plushie itself won't fight, but it unconsciously calls to other creatures. The real threat comes from the monsters it has attracted, who see it as either prey or a prize to be protected. The party must decide whether to help the Lost Plushie find its way home.", isCombat: true },
            { title: "Sentient Crib's Nursery", description: "A Sentient Crib (CR 3) has taken root in the forest, surrounded by animated toys and nursery items. This construct believes it's protecting lost children and will attempt to 'adopt' any party members it deems in need of care and supervision.<br><br><b>Protective Parent:</b> The crib itself has moderate combat abilities, but its real strength lies in its animated nursery item minions and its ability to create a magical nursery environment that induces childlike behavior in intruders.", isCombat: true },
            { title: "Nightmare Lullaby's Song", description: "A Nightmare Lullaby (CR 7) - a corrupted musical entity from the Academy's old music department - haunts this grove. Its twisted melodies can put listeners to sleep permanently or trap them in endless, disturbing dreams of regression and helplessness.<br><br><b>Sonic Nightmare:</b> This incorporeal entity attacks through sound and dreams. Physical attacks are largely ineffective unless the party can find a way to disrupt its music or counter its melodies. Its lullabies can incapacitate multiple party members simultaneously.", isCombat: true },
            { title: "Regression Fog Bank", description: "A thick, unnatural Regression Fog (CR 5) rolls through the forest, carrying with it the concentrated essence of age-regression magic from countless Academy experiments. Anyone caught in the fog risks being mentally and physically regressed to a helpless state.<br><br><b>Environmental Hazard:</b> The fog itself is the enemy, requiring area-effect spells or environmental manipulation to disperse. While in the fog, party members face constant saves against regression effects and have severely limited visibility.", isCombat: true },
            { title: "Temporal Crib Guardian's Watch", description: "A Temporal Crib Guardian (CR 8) - a powerful construct created to protect the Academy's temporal research - has gone rogue in the forest. It believes the wilderness needs to be converted into a safe nursery environment and will 'baby-proof' the entire forest if not stopped.<br><br><b>Time Manipulation:</b> This is the most dangerous encounter, suitable for higher-level parties or as a major boss fight. The Guardian can manipulate time, create temporal bubbles, and has powerful protective abilities. Its goal is to regress all threats to harmless infants.", isCombat: true },
            { title: "Teddy Abomination's Playground", description: "A Teddy Abomination (CR 6) has constructed a twisted playground in a forest clearing using corrupted Academy toys and equipment. This creature was once a beloved comfort toy that was exposed to too much dark magic during the Old War.<br><br><b>Corrupted Comfort:</b> The Teddy Abomination appears friendly at first, inviting the party to 'play' with it. Its playground is full of dangerous toys and games that can trap, restrain, or regress party members. It genuinely wants to play, but its idea of fun is lethal.", isCombat: true },
            { title: "Shadow Babysitter's Ward", description: "A Shadow Babysitter (CR 4) has claimed this area as her territory and considers any passing adventurers to be unattended children in need of supervision. This dark entity will attempt to corral the party and force them into 'timeout' or other disciplinary measures.<br><br><b>Strict Discipline:</b> Uses shadow magic and supernatural authority to impose behavioral control. Her attacks focus on restraint and humiliation rather than damage, but she will become violent if her 'charges' are unruly. She has command over lesser shadow creatures who serve as her assistants.", isCombat: true },
            { title: "Crawling Onesie Pursuit", description: "A group of 4-5 Crawling Onesies (CR 1 each) animate when the party approaches what appears to be a discarded pile of baby clothes. These enchanted garments attempt to dress the party in inappropriate clothing and force them to behave like infants.<br><br><b>Clothing Ambush:</b> The onesies attempt to grapple and restrain party members, then dress them in humiliating baby clothes. While not lethal, this encounter can severely compromise the party's dignity and equipment access until they can escape the magical garments.", isCombat: true },
                { title: "Auditarch's Inspection", description: "A Dark Dimension Auditarch materializes from shadow, its commanding presence demanding the party halt for an 'inspection.' It casts spells to buff itself while lecturing about proper Academy protocol.", isCombat: true },
    { title: "Slimepress Court", description: "The party discovers a putrid clearing where a Shadow Slimepress holds court with lesser oozes. The tyrannical monarch demands tribute before allowing passage through its domain.", isCombat: true },
    { title: "Shadowstorm's Hunt", description: "A Night-Mare Shadowstorm gallops through the forest, its hoofbeats like thunder. This legendary Darkling-Ossuite Charger Omega is hunting larger prey but will charge down anything that moves.", isCombat: true },
    { title: "Leviathan's Pool", description: "A massive, dark pool appears to be empty, but a Darkforme Abyssal Leviathan lurks beneath. The water churns ominously when anyone approaches the edge.", isCombat: true },
    { title: "Bottle Beast's Rampage", description: "A Primordial Bottle Beast crashes through the underbrush, its massive form knocking down trees. It seems to be searching for something specific in the forest floor.", isCombat: true },
    { title: "Pacifier Guardian", description: "A Pacifier Golem stands motionless beside an ancient tree, its eyes glowing softly. It activates only when someone approaches, treating all creatures as infants who need protection.", isCombat: true },
    { title: "Plushie's Lament", description: "A Lost Plushie sits alone on a tree stump, its button eyes dull and lifeless. When approached, it begins to cry softly, creating an aura of overwhelming sadness.<br><br><b>Quest:</b> Comfort the Lost Plushie. DC 13 Charisma (Persuasion) to console it, or DC 15 Wisdom (Medicine) to repair its torn seams. Success grants the plushie's blessing - advantage on the next saving throw against fear.", isCombat: false },
    { title: "Bottle Elemental Spring", description: "A Bottle Elemental has taken residence in a natural spring, its liquid form making the water shimmer strangely. It offers to trade purified water for baby bottles or formula.", isCombat: false },
    { title: "Ghostiby's Prank", description: "A Darkling-Ghostiby phases through trees, giggling mischievously. It's not hostile but keeps playing harmless pranks on the party - moving items, creating false sounds, and causing minor startles.", isCombat: false },
    { title: "River Tyrant's Domain", description: "A Darkforme River Tyrant has claimed a stream crossing, demanding travelers pay a toll of 'baby food' before they may pass. It becomes increasingly agitated if refused.", isCombat: true },
    { title: "Liquid Legion March", description: "A Darkling Liquid Legion flows through the forest like a living stream, dividing and reforming around obstacles. It's searching for a larger body of water to merge with.", isCombat: true },
    { title: "Mire-Croaker's Bog", description: "A Darkforme Mire-Croaker has created a small bog in a forest clearing. Its deep, unsettling croaks echo through the woods, and the boggy ground makes movement difficult.", isCombat: true },
    { title: "Pond-Skulker's Ambush", description: "A Darkling Pond-Skulker lurks in what appears to be a shallow forest pool. It remains perfectly still until prey comes to drink, then strikes with surprising speed.", isCombat: true },
    { title: "Forgotten Rattle's Song", description: "A Forgotten Rattle lies partially buried in leaves, softly playing a lullaby. The melody is hauntingly beautiful but induces drowsiness in anyone who listens too long.", isCombat: false },
    { title: "Weed-Tangler's Snare", description: "A Darkling Weed-Tangler has overgrown a section of the forest path, creating a natural maze of thorny vines. It uses the terrain to its advantage in combat.", isCombat: true },
    { title: "Current-Snapper's Rapids", description: "A Darkforme Current-Snapper has created dangerous rapids in a normally calm stream. It uses the rushing water to mask its approach from below.", isCombat: true },
    { title: "Punishment Maid's Discipline", description: "A Darkforme Punishment Maid appears when the party makes too much noise, scolding them for 'disturbing the peace.' It threatens timeout in shadow cages.", isCombat: true },
    { title: "Mud-Gnasher's Pit", description: "A Darkforme Mud-Gnasher has created a muddy pit trap in the forest floor. It waits beneath the surface for victims to fall in before attacking.", isCombat: true },
    { title: "Lakeopus Rex Territory", description: "The party enters the domain of a Lakeopus Rex near a large forest lake. This aquatic apex predator considers all who approach its waters as potential threats or prey.", isCombat: true },

    // EDITED EVENTS
