<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholia Diaspros VR Sim Compendium</title>
    <!-- Google Fonts for Cormorant Garamond and MedievalSharp -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <!-- Tailwind CSS for utility classes (layout, spacing, etc. - colors are custom) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load bestiary data directly -->
    <script src="src/data/Diaper-School-Full-Bestiary.json" type="application/json" id="bestiary-data"></script>
    <style>
        /* Define custom CSS variables for the color scheme */
        :root {
            --gold: #daac17;
            --gold-light: #fae791;
            --gold-dark: #97740a;
            --parchment: #2C2614;
            --parchment-dark: #1E1C12;
            --ink: #c7a81d;
            --ink2: #8f770d;
            --accent: #b47018;
            --shadow: rgba(0, 0, 0, 0.5);
        }
        
        /* Global Body Styles */
        body {
            font-family: 'Cormorant Garamond', serif;
            margin: 0;
            padding: 20px;
            background-color: #2c2619; /* Specific body background color */
            background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
            color: var(--ink); /* Main text color */
            line-height: 1.6;
        }
        
        /* Main App Container Styles */
        #app {
            max-width: 1600px;
            margin: 0 auto;
            background-color: var(--parchment); /* Parchment background */
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            border-radius: 8px;
            box-shadow: 0 4px 20px var(--shadow);
            padding: 20px;
            border: 12px solid var(--gold-dark); /* Gold-dark border */
            position: relative;
        }
        
        /* Corner Decorations */
        .corner-decoration {
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: var(--gold);
            background-image: url('https://www.transparenttextures.com/patterns/asfalt-light.png');
            z-index: 1;
        }
        .top-left { top: -6px; left: -6px; border-top-left-radius: 15px; }
        .top-right { top: -6px; right: -6px; border-top-right-radius: 15px; }
        .bottom-left { bottom: -6px; left: -6px; border-bottom-left-radius: 15px; }
        .bottom-right { bottom: -6px; right: -6px; border-bottom-right-radius: 15px; }
        
        /* Heading Styles */
        h1 {
            text-align: center;
            color: var(--accent); /* Accent color for H1 */
            font-family: 'MedievalSharp', cursive;
            font-size: 3.45rem;
            margin: 10px 0 20px;
            text-shadow: 1px 1px 3px var(--shadow);
            position: relative;
        }
        h1::after {
            content: "";
            display: block;
            width: 80%;
            height: 3px;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
            margin: 10px auto;
        }
        
        h2 {
            font-family: 'MedievalSharp', cursive;
            color: var(--accent); /* Accent color for H2 */
            border-bottom: 2px solid var(--gold); /* Gold border */
            padding-bottom: 5px;
            font-size: 2.3rem; 
            margin-top: 20px;
            margin-bottom: 15px;
        }
        h3 {
            font-size: 1.73rem; 
            color: var(--accent); /* Accent color for H3 */
            font-family: 'MedievalSharp', cursive;
        }
        h4 {
            font-size: 1.38rem; 
            color: var(--accent); /* Accent color for H4 */
            font-family: 'MedievalSharp', cursive;
        }

        /* Table of Contents Styles */
        #toc-container {
            background-color: var(--parchment-dark);
            border: 1px solid var(--gold);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 10px var(--shadow);
        }
        #toc-container h2 {
            text-align: center;
            margin-top: 0;
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .toc-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }
        .toc-column {
            background-color: var(--parchment);
            border: 1px solid var(--gold-dark);
            border-radius: 8px;
            padding: 20px;
        }
        .toc-column h3 {
            font-size: 1.7rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--accent);
            text-align: center;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
        }
        .challenge-button {
            display: block;
            background: linear-gradient(135deg, var(--parchment) 0%, var(--parchment-dark) 100%);
            border: 2px solid var(--gold-dark);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-decoration: none;
            color: var(--ink);
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px var(--shadow);
            overflow: hidden;
            position: relative;
        }
        .challenge-button:hover {
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
            color: var(--parchment-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
            border-color: var(--accent);
        }
        .challenge-button-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .challenge-thumbnail {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            border: 2px solid var(--gold);
            object-fit: cover;
            flex-shrink: 0;
            background: var(--parchment-dark);
        }
        .challenge-info {
            flex: 1;
            min-width: 0;
        }
        .challenge-title {
            font-family: 'MedievalSharp', cursive;
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 5px 0;
            line-height: 1.2;
        }
        .challenge-description {
            font-size: 0.9rem;
            opacity: 0.8;
            line-height: 1.3;
            margin: 0;
        }
        .challenge-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        .challenge-button:hover::before {
            left: 100%;
        }
        
        /* Extreme/Hard Challenge Button Styling */
        .challenge-button.extreme {
            background: linear-gradient(135deg, #3a3a3a 0%, #1a1a1a 100%);
            border: 2px solid #8b0000;
            box-shadow: 0 0 0 2px var(--gold-dark);
        }
        .challenge-button.extreme:hover {
            background: linear-gradient(135deg, #8b0000 0%, #660000 100%);
            color: var(--gold-light);
            border-color: #ff0000;
            box-shadow: 0 0 0 2px var(--gold), 0 4px 12px var(--shadow);
        }
        .challenge-button.extreme .challenge-thumbnail {
            border-color: #8b0000;
        }
        .challenge-button.extreme:hover .challenge-thumbnail {
            border-color: var(--gold);
        }
        
        /* Page Navigation */
        .page-container {
            display: none;
        }
        .page-container.active {
            display: block;
        }
        
        .back-button {
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 100%);
            border: 2px solid var(--gold-dark);
            border-radius: 8px;
            padding: 12px 24px;
            color: var(--parchment-dark);
            font-family: 'MedievalSharp', cursive;
            font-size: 1.1rem;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .back-button:hover {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--shadow);
        }
        
        @media (max-width: 768px) {
            .toc-columns {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }


        /* File Upload Section */
        #file-upload-section {
            background-color: var(--parchment-dark); /* Darker parchment for upload area */
            border: 1px solid var(--gold); /* Gold border */
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px var(--shadow);
        }
        #file-upload-section label {
            color: var(--gold-light); /* Lighter gold for label */
            font-size: 1.2rem;
            font-weight: 600;
        }
        #file-upload-section input[type="file"] {
            background-color: var(--parchment);
            color: var(--ink);
            border: 1px solid var(--gold-dark);
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
        }
        #file-upload-section input[type="file"]::file-selector-button {
            background: linear-gradient(to bottom, var(--gold-light), var(--gold));
            color: var(--ink2);
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'MedievalSharp', cursive;
            transition: all 0.2s ease;
        }
        #file-upload-section input[type="file"]::file-selector-button:hover {
            background: linear-gradient(to bottom, var(--gold), var(--gold-dark));
        }
        #upload-status {
            color: var(--ink);
            font-size: 0.9rem;
            margin-top: 10px;
        }

        /* Challenges Container */
        #challenges-container {
            min-height: 200px; /* To show loading message */
            text-align: center;
            padding-top: 50px;
        }
        #loading-message {
            color: var(--ink);
            font-size: 1.5rem;
            font-family: 'MedievalSharp', cursive;
        }

        /* Challenge Group (Solo/Party container) */
        .challenge-group-header {
            text-align: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--gold);
            color: var(--accent);
            font-family: 'MedievalSharp', cursive;
            font-size: 2.3rem;
        }

        /* Challenge Page Styling - Enforce paging */
        .challenge-page {
            background-color: var(--parchment-dark); /* Darker parchment for challenge background */
            border: 6px solid var(--gold); /* Gold border for challenges */
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px var(--shadow);
            position: relative; /* Needed for corner decorations if applied here */
            page-break-inside: avoid;
        }
        
        .challenge-page h3 { /* Challenge Title */
            color: var(--accent);
            font-size: 2rem;
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
        }
        .challenge-page strong {
            color: var(--gold-light); /* Lighter gold for strong text */
        }
        .challenge-page ul {
            list-style-type: disc;
            padding-left: 25px;
            color: var(--ink);
        }
        .challenge-page ul li {
            margin-bottom: 5px;
        }

        /* Monster Card Styling within Challenges */
        .monster-card {
            background-color: var(--parchment); /* Lighter parchment for monster cards */
            border: 2px dashed var(--gold-dark); /* Dashed gold border */
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
            box-shadow: 0 2px 8px var(--shadow);
        }
        .monster-card h3 { /* Monster Name */
            color: var(--accent);
            font-size: 1.5rem;
            text-align: left;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 5px;
        }
        .monster-card .monster-image {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 10px;
            border: 1px solid var(--gold);
        }
        .stat-block p, .stat-block li {
            color: var(--ink); /* Ink color for stat block text */
            font-size: 0.95rem;
        }
        .stat-block strong {
            color: var(--ink2); /* Darker ink for stat block bold */
        }
        .stat-block h4 { /* Abilities, Actions, etc. headers */
            color: var(--accent);
            font-size: 1.1rem;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        .stat-block ul {
            list-style-type: none; /* Remove default list bullets for ability scores */
            padding-left: 0;
        }
        .stat-block ul li {
            margin-bottom: 0.1rem;
        }

        /* Print-specific styles */
        @media print {
            body {
                background-color: white !important;
                background-image: none !important;
                color: black !important;
                font-size: 10pt;
            }
            #app {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                background-color: white !important;
                background-image: none !important;
            }
            .corner-decoration, .no-print {
                display: none !important;
            }
            h1, h2, h3, h4 {
                color: #5C4B45 !important; /* Darker brown for headings */
                text-shadow: none !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            h1::after, h2, .monster-card h3 {
                background: none !important; /* Remove gradients/borders */
                border-color: #5C4B45 !important; /* Darker brown borders */
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .challenge-page {
                page-break-after: always; /* Each challenge on a new page */
                border: 1px solid #A0522D !important; /* Sienna-like border for print */
                background-color: white !important;
                box-shadow: none !important;
                padding: 15px !important;
                margin-bottom: 15px !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .challenge-page:last-of-type {
                page-break-after: auto !important;
            }
            .challenge-page strong, .monster-card strong {
                color: #8B4513 !important; /* SaddleBrown for strong text */
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .challenge-page p, .challenge-page ul li, .stat-block p, .stat-block li {
                color: black !important;
            }
            .monster-card {
                border: 1px dashed #A0522D !important; /* Dashed border for monster cards */
                background-color: #F8F8F8 !important; /* Light grey background for monster cards */
                box-shadow: none !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .monster-image {
                border: 1px solid #A0522D !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body class="p-4">
    <div id="app">
        <!-- Corner Decorations -->
        <div class="corner-decoration top-left"></div>
        <div class="corner-decoration top-right"></div>
        <div class="corner-decoration bottom-left"></div>
        <div class="corner-decoration bottom-right"></div>

        <!-- Header -->
        <header class="p-6 rounded-lg mb-8">
            <h1>Scholia Diaspros VR Sim</h1>
            <p class="text-center text-xl" style="color: var(--ink);">Monster Compendium & Challenge Overview</p>
        </header>
        
        <!-- Table of Contents Container -->
        <nav id="toc-container" class="no-print page-container active"></nav>

        <!-- File Upload Section -->
        <section id="file-upload-section" class="mb-8 no-print page-container active">
            <label for="bestiaryUpload" class="block text-lg font-semibold mb-2">Upload Bestiary JSON File:</label>
            <input type="file" id="bestiaryUpload" accept=".json">
            <p id="upload-status" class="mt-2 text-sm"></p>
        </section>

        <!-- Challenges Container - Dynamically populated -->
        <div id="challenges-container" class="page-container active">
            <p class="text-center text-2xl" id="loading-message" style="color: var(--ink);">Please upload the 'Diaper-School-Full-Bestiary.json' file to view challenges and monster stat blocks.</p>
        </div>
        
        <!-- Individual Challenge Pages -->
        <div id="challenge-pages"></div>
    </div>

    <script>
        let allMonstersData = {}; // To store all monsters from the uploaded JSON, keyed by name for easy lookup

        // Load bestiary data directly from JSON file
        async function loadBestiaryData() {
            try {
                const response = await fetch('src/data/Diaper-School-Full-Bestiary.json');
                const data = await response.json();
                
                if (data && data.creatures) {
                    // Process creatures into allMonstersData for easy lookup
                    data.creatures.forEach(creature => {
                        if (creature.name) {
                            allMonstersData[creature.name] = creature;
                        }
                    });
                    
                    // Remove loading message and render Table of Contents
                    document.getElementById('loading-message').style.display = 'none';
                    document.getElementById('challenges-container').innerHTML = '<p style="text-align: center; color: var(--ink); font-size: 1.2rem;">Select a challenge from the compendium above to begin your simulation.</p>';
                    renderTOC();
                } else {
                    console.error('Invalid bestiary data structure');
                }
            } catch (error) {
                console.error('Error loading bestiary data:', error);
                document.getElementById('upload-status').textContent = 'Error loading bestiary data. Please check the file path.';
            }
        }

        // Function to render all challenges grouped by type
        function renderAllChallenges() {
            const challengesContainer = document.getElementById('challenges-container');
            challengesContainer.innerHTML = ''; // Clear previous content
            
            // Group challenges by type for rendering the main content
            const groupedChallenges = challenges.reduce((acc, challenge) => {
                if (!acc[challenge.type]) {
                    acc[challenge.type] = [];
                }
                acc[challenge.type].push(challenge);
                return acc;
            }, {});

            // Render grouped challenges with their headers
            for (const type in groupedChallenges) {
                challengesContainer.innerHTML += `<h2 class="challenge-group-header">${type}</h2>`;
                groupedChallenges[type].forEach(challenge => {
                    challengesContainer.innerHTML += renderChallenge(challenge);
                });
            }
        }

        // Page navigation functions
        function showMainPage() {
            // Hide all pages
            document.querySelectorAll('.page-container').forEach(page => {
                page.classList.remove('active');
            });
            
            // Show main pages
            document.getElementById('toc-container').classList.add('active');
            document.getElementById('file-upload-section').classList.add('active');
            document.getElementById('challenges-container').classList.add('active');
        }

        function showChallenge(challengeId) {
            // Hide all pages
            document.querySelectorAll('.page-container').forEach(page => {
                page.classList.remove('active');
            });
            
            // Find the challenge
            const challenge = challenges.find(c => c.id === challengeId);
            if (!challenge) return;
            
            // Create or show challenge page
            let challengePage = document.getElementById(`page-${challengeId}`);
            if (!challengePage) {
                challengePage = document.createElement('div');
                challengePage.id = `page-${challengeId}`;
                challengePage.className = 'page-container';
                
                challengePage.innerHTML = `
                    <button class="back-button" onclick="showMainPage()">← Back to Challenge List</button>
                    ${renderChallenge(challenge)}
                `;
                
                document.getElementById('challenge-pages').appendChild(challengePage);
            }
            
            challengePage.classList.add('active');
            window.scrollTo(0, 0);
        }

        // Load bestiary data automatically when the page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadBestiaryData();
        });

        // Define the challenges with monster names and mechanics

            },

                difficulty: "Medium-Hard",
                totalXP: "1,800 XP",
                monsters: ["Darkling-Ossokin", "Darkling-Ossokin", "Darkling-Ossokin", "Darkling-Ossokin", "Darkling-Ossokin-Proselyte", "Darkforme-Ossokin-Aegisite", "Darkling-Ossuite Charger", "Darkling-Ossuite Charger"],
                mechanics: "Wave 1 - Initial Assault (750 XP): 4x Darkling-Ossokin, 1x Darkling-Ossokin-Proselyte, 1x Darkforme-Ossokin-Aegisite. Wave 2 - Where Are Our Minions?! (1050 XP): 1x Darkforme-Ossokin-Aegisite, 2x Darkling-Ossuite Charger. After minions are dealt with, and the player has the high-ground, the aegisite and its charger allies appear and immediately identify the player as the assailant unless they are capable of expertly hiding in the space of 2d4-1 (minimum 1) rounds."

            {

        // Function to calculate HP based on CR rule
        function getDisplayHP(monster) {
            if (monster.stats.numHitDie && monster.stats.hitDieSize !== undefined) {
                if (monster.challengeRating < 5) {
                    // For CR < 5, calculate max HP
                    const numDice = monster.stats.numHitDie;
                    const dieSize = monster.stats.hitDieSize;
                    // Ensure extraHealthFromConstitution is treated as a number, defaulting to 0 if null/undefined
                    const modifier = monster.stats.extraHealthFromConstitution !== undefined ? monster.stats.extraHealthFromConstitution : 0;
                    return (numDice * dieSize) + modifier;
                }
            }
            // For CR >= 5, or if hit die info is missing, use the provided hitPoints (average)
            return monster.stats.hitPoints;
        }

        // Function to render a single monster stat block
        function renderMonsterStatBlock(monster) {
            if (!monster) {
                return '<p style="color: red;">Monster data not found.</p>';
            }

            const displayHP = getDisplayHP(monster);
            const abilityScoresHtml = Object.entries(monster.stats.abilityScores || {}).map(([key, value]) => `
                <li><strong>${key.substring(0, 3).toUpperCase()}:</strong> ${value} (${Math.floor((value - 10) / 2) >= 0 ? '+' : ''}${Math.floor((value - 10) / 2)})</li>
            `).join('');

            const savingThrowsHtml = monster.stats.savingThrows && monster.stats.savingThrows.length > 0 ? `
                <p><strong>Saving Throws:</strong> ${monster.stats.savingThrows.map(s => `${s.ability.substring(0, 3).toUpperCase()} ${s.modifierStr.replace(`${s.ability.substring(0, 3).toUpperCase()} `, '')}`).join(', ')}</p>
            ` : '';

            const skillsHtml = monster.stats.skills && monster.stats.skills.length > 0 ? `
                <p><strong>Skills:</strong> ${monster.stats.skills.map(s => `${s.name} ${s.modifierStr.replace(`${s.name} `, '')}`).join(', ')}</p>
            ` : '';

            const damageVulnerabilitiesHtml = monster.stats.damageVulnerabilities && monster.stats.damageVulnerabilities.length > 0 ? `
                <p><strong>Damage Vulnerabilities:</strong> ${monster.stats.damageVulnerabilities.join(', ')}</p>
            ` : '';

            const damageResistancesHtml = monster.stats.damageResistances && monster.stats.damageResistances.length > 0 ? `
                <p><strong>Damage Resistances:</strong> ${monster.stats.damageResistances.join(', ')}</p>
            ` : '';

            const damageImmunitiesHtml = monster.stats.damageImmunities && monster.stats.damageImmunities.length > 0 ? `
                <p><strong>Damage Immunities:</strong> ${monster.stats.damageImmunities.join(', ')}</p>
            ` : '';

            const conditionImmunitiesHtml = monster.stats.conditionImmunities && monster.stats.conditionImmunities.length > 0 ? `
                <p><strong>Condition Immunities:</strong> ${monster.stats.conditionImmunities.join(', ')}</p>
            ` : '';

            const languagesHtml = monster.stats.languages && monster.stats.languages.length > 0 ? `
                <p><strong>Languages:</strong> ${monster.stats.languages.join(', ')}</p>
            ` : '';

            const additionalAbilitiesHtml = monster.stats.additionalAbilities && monster.stats.additionalAbilities.length > 0 ? `
                <h4>Abilities</h4>
                ${monster.stats.additionalAbilities.map(ability => `
                    <p><strong>${ability.name}:</strong> ${ability.description}</p>
                `).join('')}
            ` : '';

            const actionsHtml = monster.stats.actions && monster.stats.actions.length > 0 ? `
                <h4>Actions</h4>
                ${monster.stats.actions.map(action => `
                    <p><strong>${action.name}:</strong> ${action.description}</p>
                `).join('')}
            ` : '';

            const reactionsHtml = monster.stats.reactions && monster.stats.reactions.length > 0 ? `
                <h4>Reactions</h4>
                ${monster.stats.reactions.map(reaction => `
                    <p><strong>${reaction.name}:</strong> ${reaction.description}</p>
                `).join('')}
            ` : '';

            const legendaryActionsHtml = monster.stats.legendaryActions && monster.stats.legendaryActions.length > 0 ? `
                <h4>Legendary Actions</h4>
                ${monster.stats.legendaryActionsDescription ? `<p>${monster.stats.legendaryActionsDescription}</p>` : ''}
                ${monster.stats.legendaryActions.map(legAction => `
                    <p><strong>${legAction.name}:</strong> ${legAction.description}</p>
                `).join('')}
            ` : '';

            return `
                <div class="monster-card p-6 rounded-lg shadow-md">
                    <h3>${monster.name}</h3>
                    ${monster.flavor.imageUrl ? `<img src="${monster.flavor.imageUrl}" onerror="this.onerror=null; this.src='https://placehold.co/300x200/2C2614/daac17?text=Image+Not+Found';" alt="${monster.name}" class="monster-image">` : ''}
                    <p>${monster.flavor.description}</p>
                    <hr class="border-t-2 border-[var(--gold)] my-3">
                    <div class="stat-block">
                        <p><strong>Size:</strong> ${monster.stats.size}</p>
                        <p><strong>Race:</strong> ${monster.stats.race}</p>
                        <p><strong>Alignment:</strong> ${monster.stats.alignment}</p>
                        <p><strong>Armor Class:</strong> ${monster.stats.armorClass} ${monster.stats.armorTypeStr ? `(${monster.stats.armorTypeStr.replace(/[()]/g, '')})` : ''}</p>
                        <p><strong>Hit Points:</strong> ${displayHP} (${monster.stats.hitPointsStr})</p>
                        <p><strong>Speed:</strong> ${monster.stats.speed}</p>
                        <p><strong>Challenge Rating:</strong> ${monster.challengeRating}</p>
                        <p><strong>Ability Scores:</strong></p>
                        <ul class="grid grid-cols-2 sm:grid-cols-3 gap-y-1">
                            ${abilityScoresHtml}
                        </ul>

                        ${savingThrowsHtml}
                        ${skillsHtml}
                        ${damageVulnerabilitiesHtml}
                        ${damageResistancesHtml}
                        ${damageImmunitiesHtml}
                        ${conditionImmunitiesHtml}
                        <p><strong>Senses:</strong> ${monster.stats.senses.join(', ')}</p>
                        ${languagesHtml}

                        ${additionalAbilitiesHtml}
                        ${actionsHtml}
                        ${reactionsHtml}
                        ${legendaryActionsHtml}
                    </div>
                </div>
            `;
        }

        // Function to render a challenge page
        function renderChallenge(challenge) {
            let monsterHtml = '';
            const uniqueMonsterNamesInChallenge = [...new Set(challenge.monsters)]; // Get unique monster names
            uniqueMonsterNamesInChallenge.forEach(monsterName => {
                const monster = allMonstersData[monsterName];
                if (monster) {
                    monsterHtml += renderMonsterStatBlock(monster);
                } else {
                    monsterHtml += `<p style="color: red; margin-top: 1rem;">Monster "${monsterName}" not found in bestiary data. Please ensure the bestiary JSON is correct.</p>`;
                }
            });

            return `
                <div id="${challenge.id}" class="challenge-page p-5 rounded-lg shadow-md">
                    <h3>${challenge.title}</h3>
                    <p style="color: var(--ink);"><strong>Setting:</strong> ${challenge.setting}</p>
                    <p style="color: var(--ink);"><strong>Objective:</strong> ${challenge.objective}</p>
                    <p style="color: var(--ink);"><strong>Monsters:</strong></p>
                    <ul class="list-disc list-inside ml-4 mb-4" style="color: var(--ink);">
                        ${challenge.monsters.map(m => `<li>${m}</li>`).join('')}
                    </ul>
                    ${challenge.mechanics ? `<p style="color: var(--ink);"><strong>Mechanics Snippet:</strong> ${challenge.mechanics}</p>` : ''}

                    <h4 class="mt-6 mb-4 text-center">Monster Details for this Challenge</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${monsterHtml}
                    </div>
                </div>
            `;
        }

        // Function to render the Table of Contents
        function renderTOC() {
            const tocContainer = document.getElementById('toc-container');
            
            // Define challenge descriptions for TOC
            const challengeDescriptions = {
                "guardians_dark_spaces": "Face multiple elite Darkforme enemies in a brutal endurance test.",
                "corridor_crusher": "Navigate temple corridors against Darkforme forces with tactical positioning.",
                "bottletop_defense": "Defend high ground against successive waves of undead Ossokin forces.",
                "suffocator_den": "Close quarters combat against a grappling specialist in narrow passages.",
                "night_wings": "Aerial combat with environmental hazards and fall risks.",
                "bone_lord_lesson": "Face a massive foe with arena disadvantage in an enclosed space.",
                "crypt_despair": "Navigate cramped corridors with hidden ambush points.",
                "marshland_bones": "Clear murky, boggy terrain while fighting Darkforme forces.",
                "isolated_isle": "Defend an island position against successive attacker waves.",
                "shadows_mire": "Navigate swampland with concealment and slowed movement challenges.",
                "umbral_mark_marshland": "Enhanced swamp encounter featuring an apex predator.",
                "blocked_airway": "Clear debris while fighting in suffocating, cramped conditions.",
                "flooded_lower_docks": "Combat predatory sharks in submerged, slippery conditions.",
                "hungry_hallway": "Survive relentless waves of Hungerer assaults.",
                "spinebearers_gauntlet": "Navigate spiked terrain while fighting armored opponents.",
                "overwatch_ambush": "Survive coordinated Overwatch assault with regenerating enemies.",
                "nightshades_domain": "Battle elemental forces in shifting shadow terrain.",
                "caveswellers_lair": "Clear echoing caverns with uneven terrain and ambush points.",
                "callers_den": "Silence summoners before they call too many reinforcements.",
                "sleek_lurker_alpha_hunt": "Track and eliminate a pack leader in overgrown gardens.",
                "nightsippers_mire": "Fight life-draining predators in acidic, dangerous terrain.",
                "chap_hells_echo": "Face a manifestation of ultimate evil in desecrated halls.",
                "cactine_patch": "Endure endless reinforcements in a desert environment.",
                "slithering_dark": "Hunt a massive serpent in pitch-black maze conditions.",
                "enforcers_proving_ground": "Survive waves of enemies while facing elite Enforcers.",
                "the_omegas_charge": "Face charging cavalry in a hall designed for their advantage.",
                "echoes_of_hell": "Banish undead echoes while preventing endless reinforcements.",
                "sky_darkeners_roost": "Aerial combat on floating platforms with wind hazards.",
                "darkformless_ritual": "Race against time to disrupt a powerful summoning ritual.",
                "ossuarys_last_stand": "Destroy elite undead while preventing endless reassembly.",
                "enforcers_patrol": "Eliminate a tactical patrol with regenerating leadership.",
                "bellowbellys_choir": "Stop coordinated wailing before it overwhelms the party.",
                "darkening_spire": "Ascend a crumbling tower fighting enemies on each level.",
                "last_stand_nursery": "Endless wave defense at a critical chokepoint.",
                "ambush_in_the_stacks": "Survive a library ambush with environmental traps.",
                "academy_courtyard_breach": "Retake the main courtyard from occupying forces.",
                "twisted_laboratory_escape": "Fight through hazardous magical laboratory conditions.",
                "sunken_archive_depths": "Navigate flooded archives against aquatic predators.",
                "corrupted_garden_maze": "Find your way through a poisonous, twisted maze.",
                "bell_tower_ascension": "Climb the tower while silencing summoning creatures.",
                "dining_hall_Last_supper": "Clear the great hall of ravenous feeding creatures."
            };

            // Function to get the first monster image from a challenge
            function getMonsterThumbnail(challenge) {
                if (challenge.monsters && challenge.monsters.length > 0) {
                    const firstMonster = allMonstersData[challenge.monsters[0]];
                    if (firstMonster && firstMonster.flavor && firstMonster.flavor.imageUrl) {
                        return firstMonster.flavor.imageUrl;
                    }
                }
                // Fallback to a placeholder if no image found
                return 'https://placehold.co/60x60/2C2614/daac17?text=?';
            }

            // Separate challenges into solo and party categories
            const soloChallenges = challenges.filter(challenge => 
                challenge.type === "Solo Combat Challenges" || challenge.type === "Extreme Solo Challenges"
            );
            
            const partyChallenges = challenges.filter(challenge => 
                challenge.type === "3-Person Party Combat Challenges"
            );

            let tocHtml = '<h2>Challenge Compendium</h2>';
            tocHtml += '<div class="toc-columns">';
            
            // Solo Challenges Column
            tocHtml += '<div class="toc-column">';
            tocHtml += '<h3>Solo Challenges</h3>';
            soloChallenges.forEach(challenge => {
                const description = challengeDescriptions[challenge.id] || "A challenging solo encounter.";
                const thumbnail = getMonsterThumbnail(challenge);
                const isExtreme = challenge.type === "Extreme Solo Challenges";
                const extremeClass = isExtreme ? " extreme" : "";
                tocHtml += `
                    <a href="#" onclick="showChallenge('${challenge.id}'); return false;" class="challenge-button${extremeClass}">
                        <div class="challenge-button-content">
                            <img src="${thumbnail}" 
                                 onerror="this.src='https://placehold.co/60x60/2C2614/daac17?text=?';" 
                                 alt="${challenge.title}" 
                                 class="challenge-thumbnail">
                            <div class="challenge-info">
                                <div class="challenge-title">${challenge.title}</div>
                                <div class="challenge-description">${description}</div>
                            </div>
                        </div>
                    </a>
                `;
            });
            tocHtml += '</div>';

            // Party Challenges Column
            tocHtml += '<div class="toc-column">';
            tocHtml += '<h3>Party Challenges</h3>';
            partyChallenges.forEach(challenge => {
                const description = challengeDescriptions[challenge.id] || "A tactical party encounter.";
                const thumbnail = getMonsterThumbnail(challenge);
                tocHtml += `
                    <a href="#" onclick="showChallenge('${challenge.id}'); return false;" class="challenge-button">
                        <div class="challenge-button-content">
                            <img src="${thumbnail}" 
                                 onerror="this.src='https://placehold.co/60x60/2C2614/daac17?text=?';" 
                                 alt="${challenge.title}" 
                                 class="challenge-thumbnail">
                            <div class="challenge-info">
                                <div class="challenge-title">${challenge.title}</div>
                                <div class="challenge-description">${description}</div>
                            </div>
                        </div>
                    </a>
                `;
            });
            tocHtml += '</div>';
            
            tocHtml += '</div>'; // Close toc-columns
            tocContainer.innerHTML = tocHtml;
        }


        // Function to handle file upload
        document.getElementById('bestiaryUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            const statusElement = document.getElementById('upload-status');
            const challengesContainer = document.getElementById('challenges-container');
            const loadingMessage = document.getElementById('loading-message');

            if (file) {
                if (file.name !== 'Diaper-School-Full-Bestiary.json') {
                    statusElement.textContent = 'Error: Please upload "Diaper-School-Full-Bestiary.json".';
                    statusElement.style.color = 'red';
                    challengesContainer.innerHTML = `<p class="text-center text-red-400 mt-8" style="color: red;">Incorrect file uploaded. Please upload "Diaper-School-Full-Bestiary.json".</p>`;
                    return;
                }

                statusElement.textContent = 'Loading...';
                statusElement.style.color = 'var(--ink)';
                loadingMessage.style.display = 'block'; // Show loading message

                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const json = JSON.parse(e.target.result);
                        allMonstersData = {};
                        json.creatures.forEach(creature => {
                            allMonstersData[creature.name] = creature;
                        });

                        // Clear previous content
                        challengesContainer.innerHTML = '<p style="text-align: center; color: var(--ink); font-size: 1.2rem;">Select a challenge from the compendium above to begin your simulation.</p>';
                        
                        // Render the Table of Contents
                        renderTOC();

                        statusElement.textContent = 'Bestiary loaded successfully!';
                        statusElement.style.color = 'var(--ink)';
                        loadingMessage.style.display = 'none'; // Hide loading message
                    } catch (error) {
                        statusElement.textContent = `Error parsing JSON: ${error.message}`;
                        statusElement.style.color = 'red';
                        challengesContainer.innerHTML = `<p class="text-center text-red-400 mt-8" style="color: red;">Error loading bestiary data. Please ensure it's a valid JSON file.</p>`;
                        loadingMessage.style.display = 'none'; // Hide loading message
                    }
                };
                reader.readAsText(file);
            } else {
                statusElement.textContent = 'No file selected.';
                statusElement.style.color = 'var(--ink)';
                challengesContainer.innerHTML = `<p class="text-center text-2xl" id="loading-message" style="color: var(--ink);">Please upload the 'Diaper-School-Full-Bestiary.json' file to view challenges and monster stat blocks.</p>`;
                document.getElementById('toc-container').innerHTML = ''; // Clear TOC if no file
            }
        });
    </script>
</body>
</html>
