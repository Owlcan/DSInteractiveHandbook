const PointBuy = ({ scores, setScores }) => {
    const pointCost = { 8:0, 9:1, 10:2, 11:3, 12:4, 13:5, 14:7, 15:9 };
    const totalPoints = 27;
    const pointsSpent = Object.values(scores).reduce((acc, score) => {
        const normalized = Math.max(8, Math.min(15, Number(score) || 8));
        return acc + (pointCost[normalized] || 0);
    }, 0);
    
    const handleScoreChange = (stat, value) => {
        const newValue = parseInt(value) || 8;
        const clampedValue = Math.max(8, Math.min(15, newValue));
        setScores(prev => ({ ...prev, [stat]: clampedValue }));
    };
    
    return (
        <div>
            <div className="text-center mb-4">
                <h3 className="text-xl font-bold">Points Spent: {pointsSpent} / {totalPoints}</h3>
                <p className="text-sm text-gray-400">Enter values between 8-15. Standard point buy costs shown below.</p>
                <div className="text-xs text-gray-500 mt-2">
                    8=0pts, 9=1pt, 10=2pts, 11=3pts, 12=4pts, 13=5pts, 14=7pts, 15=9pts
                </div>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {Object.keys(scores).map(stat => (
                    <div key={stat} className="flex items-center justify-between bg-gray-700 p-3 rounded-lg">
                        <span className="font-bold text-lg">{stat}</span>
                        <div className="flex items-center gap-2">
                            <input
                                type="number"
                                min="8"
                                max="15"
                                value={scores[stat]}
                                onChange={(e) => handleScoreChange(stat, e.target.value)}
                                className="w-16 p-2 bg-gray-600 text-white text-center rounded border border-gray-500 focus:border-indigo-400"
                            />
                            <span className="text-sm text-gray-400">
                                ({pointCost[scores[stat]] || 0}pts)
                            </span>
                        </div>
                    </div>
                ))}
            </div>
            {pointsSpent !== totalPoints && (
                <div className="mt-4 p-3 bg-yellow-800 text-yellow-200 rounded-lg text-center">
                    {pointsSpent > totalPoints 
                        ? `Over budget by ${pointsSpent - totalPoints} points!` 
                        : `${totalPoints - pointsSpent} points remaining`}
                </div>
            )}
        </div>
    );
};

const AsiChoices = ({ source, sourceName, setAsiChoice }) => {
    const asiText = source?.asiText || '';
    const stats = ["STR", "DEX", "CON", "INT", "WIS", "CHA"];
    const handleChoice = (key, stat, value) => setAsiChoice(sourceName, key, { stat, value });

    const plus2plus1 = asiText.match(/\+2 to one .* and \+1 to another/);
    const plus1plus1plus1 = asiText.match(/\+1 to three different/);
    const twoStatChoice = asiText.match(/Increase your (\w+) or (\w+) score by (\d)/);
    const fixedAsi = asiText.match(/\+(\d) to (\w+) and \+(\d) to (\w+)/);
    const singleStatChoice = asiText.match(/Your (\w+) or (\w+) score \(your choice\) increases by (\d)/);

    if (fixedAsi) return <p className="text-sm text-gray-400">{asiText} (Applied automatically)</p>;
    
    if (plus2plus1) {
        return (
            <div className="space-y-2"><p>{asiText}</p><div className="flex gap-2">
                <select onChange={(e) => handleChoice('plusTwo', e.target.value, 2)} className="w-full p-2 bg-gray-600 rounded"><option>+2 Stat</option>{stats.map(s => <option key={s} value={s}>{s}</option>)}</select>
                <select onChange={(e) => handleChoice('plusOne', e.target.value, 1)} className="w-full p-2 bg-gray-600 rounded"><option>+1 Stat</option>{stats.map(s => <option key={s} value={s}>{s}</option>)}</select>
            </div></div>
        );
    }
    if (singleStatChoice) {
        const [, stat1, stat2, value] = singleStatChoice;
        const s1 = normalizeAbilityStatKey(stat1);
        const s2 = normalizeAbilityStatKey(stat2);
        return (
            <div className="space-y-2"><p>{asiText}</p>
                <select onChange={(e) => handleChoice('choice', e.target.value, parseInt(value))} className="w-full p-2 bg-gray-600 rounded">
                    <option>+{value} Stat</option>
                    {s1 && <option value={s1}>{stat1}</option>}
                    {s2 && <option value={s2}>{stat2}</option>}
                </select>
            </div>
        );
    }
     if (twoStatChoice) {
        const [, stat1, stat2, value] = twoStatChoice;
        const s1 = normalizeAbilityStatKey(stat1);
        const s2 = normalizeAbilityStatKey(stat2);
        return (
            <div className="space-y-2"><p>{asiText}</p>
                <select onChange={(e) => handleChoice('choice', e.target.value, parseInt(value))} className="w-full p-2 bg-gray-600 rounded">
                    <option>+{value} Stat</option>
                    {s1 && <option value={s1}>{stat1}</option>}
                    {s2 && <option value={s2}>{stat2}</option>}
                </select>
            </div>
        );
    }
    
    return asiText ? <p>{asiText}</p> : null;
};

const AbilityScoreStep = ({ onNext, onBack, character, updateCharacter, getModifier, finalScores, homebrew }) => {
    const [localBaseScores, setLocalBaseScores] = useState(character.baseScores);
    const [localManualAdjustments, setLocalManualAdjustments] = useState(
        character.manualAbilityAdjustments || { STR: 0, DEX: 0, CON: 0, INT: 0, WIS: 0, CHA: 0 }
    );
    
    // Sync local state with character state when character changes
    useEffect(() => {
        setLocalBaseScores(character.baseScores);
    }, [character.baseScores]);

    // Sync manual adjustments when character changes (load/save)
    useEffect(() => {
        setLocalManualAdjustments(
            character.manualAbilityAdjustments || { STR: 0, DEX: 0, CON: 0, INT: 0, WIS: 0, CHA: 0 }
        );
    }, [character.manualAbilityAdjustments]);
    
    // Update character state when local state changes
    useEffect(() => {
        updateCharacter('baseScores', localBaseScores);
    }, [localBaseScores]);

    useEffect(() => {
        updateCharacter('manualAbilityAdjustments', localManualAdjustments);
    }, [localManualAdjustments]);

    // If the user switches to point buy, clamp base scores into 8-15 so the math/UI stays sane.
    useEffect(() => {
        if (character.abilityScoreMethod !== 'pointBuy') return;
        setLocalBaseScores(prev => {
            const next = { ...prev };
            let changed = false;
            Object.keys(next).forEach(stat => {
                const normalized = Math.max(8, Math.min(15, Number(next[stat]) || 8));
                if (next[stat] !== normalized) {
                    next[stat] = normalized;
                    changed = true;
                }
            });
            return changed ? next : prev;
        });
    }, [character.abilityScoreMethod]);
    
    const setAsiChoice = (sourceName, key, choice) => {
        updateCharacter('asiChoices', { ...character.asiChoices, [sourceName]: { ...character.asiChoices[sourceName], [key]: choice } });
    };
    const rollScores = () => {
        const roll4d6dropLowest = () => {
            const rolls = Array.from({ length: 4 }, () => Math.floor(Math.random() * 6) + 1);
            rolls.sort((a, b) => a - b).shift();
            return rolls.reduce((a, b) => a + b, 0);
        };
        const newScores = { STR: roll4d6dropLowest(), DEX: roll4d6dropLowest(), CON: roll4d6dropLowest(), INT: roll4d6dropLowest(), WIS: roll4d6dropLowest(), CHA: roll4d6dropLowest() };
        setLocalBaseScores(newScores);
    };
    
    // Calculate final scores using local base scores
    const computedFinalScores = useMemo(() => {
        const scores = { ...localBaseScores };
        const bonuses = {};
        const addBonus = (stat, val) => {
            const key = normalizeAbilityStatKey(stat);
            if (!key) return;
            const n = Number(val);
            if (!Number.isFinite(n)) return;
            bonuses[key] = (bonuses[key] || 0) + n;
        };

        const selectedRace = homebrew.races[character.race];
        
        // Apply racial bonuses
        if(selectedRace?.abilities) {
            Object.entries(selectedRace.abilities).forEach(([key, val]) => {
                const rawStat = key.split('/').pop();
                addBonus(rawStat, val);
            });
        } else if(selectedRace?.abilityScores) {
            Object.entries(selectedRace.abilityScores).forEach(([stat, val]) => {
                addBonus(stat, val);
            });
        }
        
        const sources = [
            { source: homebrew.backgrounds[character.background], type: 'Background' },
            { source: homebrew.feats[character.feat], type: 'Feat' }
        ];
        sources.forEach(({ source }) => {
            const asiText = source?.asiText;
            if (!asiText) return;
            const lowered = String(asiText).toLowerCase();
            if (lowered.includes('one of') || lowered.includes('or')) return;

            const fixed = parseFixedAbilityScoresFromText(asiText);
            Object.entries(fixed).forEach(([stat, val]) => {
                addBonus(stat, val);
            });
        });

        Object.values(character.asiChoices).forEach(choiceGroup => {
            Object.values(choiceGroup).forEach(choice => {
                if(choice.stat && choice.value) addBonus(choice.stat, choice.value);
            });
        });
        
        for(const stat in scores) {
            scores[stat] += (bonuses[stat] || 0);
        }
        return scores;
    }, [localBaseScores, character.race, character.background, character.feat, character.asiChoices, homebrew]);

    const localFinalScores = useMemo(() => {
        const scores = { ...computedFinalScores };
        Object.entries(localManualAdjustments || {}).forEach(([stat, val]) => {
            if (scores[stat] !== undefined && val) {
                scores[stat] += val;
            }
        });
        return scores;
    }, [computedFinalScores, localManualAdjustments]);

    const selectedRace = homebrew.races[character.race];
    const selectedBg = homebrew.backgrounds[character.background];
    const selectedFeat = homebrew.feats[character.feat];

    return (
    <div>
        <h2 className="text-2xl font-bold mb-4 text-indigo-300">Determine Ability Scores</h2>
        
        {/* ASI Debug Info */}
        {finalScores._debugInfo && finalScores._debugInfo.length > 0 && (
            <div className="bg-blue-800 text-blue-200 p-3 mb-4 rounded text-sm">
                <p className="font-bold mb-1">ASI Debug Info:</p>
                <p>Race: {character.race || 'None'}, Background: {character.background || 'None'}, Feat: {character.feat || 'None'}</p>
                <p>Applied bonuses: {finalScores._debugInfo.join(', ') || 'None'}</p>
            </div>
        )}
        
        {/* Racial ASI Information */}
        {selectedRace && (
            <div className="bg-green-900 border border-green-600 text-green-200 p-3 mb-4 rounded text-sm">
                <p className="font-bold mb-1">📋 Expected Racial ASIs:</p>
                {(() => {
                    const racialBonuses = [];
                    const subraceBonuses = [];
                    
                    // === BASE RACE ASI DETECTION ===
                    // Check orcbrew format (.abilities)
                    if (selectedRace.abilities) {
                        Object.entries(selectedRace.abilities).forEach(([key, val]) => {
                            const stat = key.split('/').pop().toUpperCase();
                            racialBonuses.push(`${stat} +${val}`);
                        });
                    }
                    
                    // Check parsed format (.abilityScores)
                    if (selectedRace.abilityScores) {
                        Object.entries(selectedRace.abilityScores).forEach(([stat, val]) => {
                            racialBonuses.push(`${stat.toUpperCase()} +${val}`);
                        });
                    }
                    
                    // Check for traits with "Increase" in the name
                    if (selectedRace.traits) {
                        const asiTrait = selectedRace.traits.find(t => t.name && t.name.toLowerCase().includes('increase'));
                        if (asiTrait && asiTrait.description) {
                            // Try to parse ASI info from trait description
                            const formatA = [...asiTrait.description.matchAll(/\+(\d+) to (\w+)/g)];
                            const formatB = [...asiTrait.description.matchAll(/(\w+) score.*?(\d+)/g)];
                            
                            formatA.forEach(match => {
                                racialBonuses.push(`${match[2].toUpperCase()} +${match[1]}`);
                            });
                            
                            formatB.forEach(match => {
                                racialBonuses.push(`${match[1].toUpperCase()} +${match[2]}`);
                            });
                        }
                    }
                    
                    // === SUBRACE ASI DETECTION ===
                    const selectedSubrace = character.subrace && selectedRace.subraces ? selectedRace.subraces[character.subrace] : null;
                    
                    if (selectedSubrace) {
                        // Check orcbrew format (.abilities)
                        if (selectedSubrace.abilities) {
                            Object.entries(selectedSubrace.abilities).forEach(([key, val]) => {
                                const stat = key.split('/').pop().toUpperCase();
                                subraceBonuses.push(`${stat} +${val}`);
                            });
                        }
                        
                        // Check parsed format (.abilityScores)
                        if (selectedSubrace.abilityScores) {
                            Object.entries(selectedSubrace.abilityScores).forEach(([stat, val]) => {
                                subraceBonuses.push(`${stat.toUpperCase()} +${val}`);
                            });
                        }
                        
                        // Check subrace HTML content for ASI patterns
                        if (selectedSubrace.html) {
                            const formatA = [...selectedSubrace.html.matchAll(/\+(\d+) to (\w+)/g)];
                            const formatB = [...selectedSubrace.html.matchAll(/(\w+) score.*?(\d+)/g)];
                            const formatC = [...selectedSubrace.html.matchAll(/Increase.*?(\w+).*?(\d+)/g)];
                            
                            formatA.forEach(match => {
                                subraceBonuses.push(`${match[2].toUpperCase()} +${match[1]}`);
                            });
                            
                            formatB.forEach(match => {
                                subraceBonuses.push(`${match[1].toUpperCase()} +${match[2]}`);
                            });
                            
                            formatC.forEach(match => {
                                subraceBonuses.push(`${match[1].toUpperCase()} +${match[2]}`);
                            });
                        }
                        
                        // Check subrace traits
                        if (selectedSubrace.traits) {
                            selectedSubrace.traits.forEach(trait => {
                                if (trait.name && trait.name.toLowerCase().includes('increase') && trait.description) {
                                    const formatA = [...trait.description.matchAll(/\+(\d+) to (\w+)/g)];
                                    const formatB = [...trait.description.matchAll(/(\w+) score.*?(\d+)/g)];
                                    
                                    formatA.forEach(match => {
                                        subraceBonuses.push(`${match[2].toUpperCase()} +${match[1]}`);
                                    });
                                    
                                    formatB.forEach(match => {
                                        subraceBonuses.push(`${match[1].toUpperCase()} +${match[2]}`);
                                    });
                                }
                            });
                        }
                    }
                    
                    // Display results
                    return (
                        <div>
                            {racialBonuses.length > 0 ? (
                                <p><strong>Base Race ({character.race}):</strong> {racialBonuses.join(', ')}</p>
                            ) : (
                                <p><strong>Base Race ({character.race}):</strong> <em>No automatic ASIs detected.</em></p>
                            )}
                            
                            {character.subrace && (
                                subraceBonuses.length > 0 ? (
                                    <p><strong>Subrace ({character.subrace}):</strong> {subraceBonuses.join(', ')}</p>
                                ) : (
                                    <p><strong>Subrace ({character.subrace}):</strong> <em>No automatic ASIs detected.</em></p>
                                )
                            )}
                            
                            {!character.subrace && selectedRace.subraces && Object.keys(selectedRace.subraces).length > 0 && (
                                <p className="text-yellow-300"><strong>Note:</strong> This race has subraces that may provide additional ASIs. Select a subrace in the Race step.</p>
                            )}
                            
                            {(racialBonuses.length > 0 || subraceBonuses.length > 0) && (
                                <p className="mt-1"><strong>Total Expected:</strong> {[...racialBonuses, ...subraceBonuses].join(', ')}</p>
                            )}
                        </div>
                    );
                })()}
                
                <p className="mt-2 text-xs italic">
                    💡 If these bonuses aren't applied automatically, use the manual adjustment section below.
                </p>
            </div>
        )}
        
        <div className="flex justify-center gap-4 mb-4">
            <button onClick={() => updateCharacter('abilityScoreMethod', 'pointBuy')} className={`font-bold py-2 px-4 rounded-lg ${character.abilityScoreMethod === 'pointBuy' ? 'bg-indigo-600' : 'bg-gray-600'}`}>Point Buy</button>
            <button onClick={() => updateCharacter('abilityScoreMethod', 'roll')} className={`font-bold py-2 px-4 rounded-lg ${character.abilityScoreMethod === 'roll' ? 'bg-indigo-600' : 'bg-gray-600'}`}>Roll for Stats</button>
        </div>
        {character.abilityScoreMethod === 'pointBuy' ? <PointBuy scores={localBaseScores} setScores={setLocalBaseScores} /> : <div className="text-center"><button onClick={rollScores} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg text-lg">Roll Scores</button></div>}
        <div className="my-6 p-4 bg-gray-900 rounded-lg"><h3 className="text-lg font-bold mb-2">Ability Score Increases</h3>
            <div className="space-y-4">
                {selectedRace && <AsiChoices source={{asiText: selectedRace.traits?.find(t=>t.name.includes("Increase"))?.description}} sourceName="race" setAsiChoice={setAsiChoice} />}
                {selectedBg && <AsiChoices source={selectedBg} sourceName="background" setAsiChoice={setAsiChoice} />}
                {selectedFeat && <AsiChoices source={selectedFeat} sourceName="feat" setAsiChoice={setAsiChoice} />}
            </div>
        </div>
        
        {/* Manual Stat Adjustment Section */}
        <div className="my-6 p-4 bg-yellow-900 border border-yellow-600 rounded-lg">
            <h3 className="text-lg font-bold mb-2 text-yellow-300">Manual Final Score Adjustment</h3>
            <p className="text-yellow-200 mb-4">
                <strong>⚠️ Important:</strong> If your background or feat ASIs aren't applying automatically, 
                you can manually adjust your final ability scores here before proceeding.
            </p>
            <div className="grid grid-cols-3 md:grid-cols-6 gap-2">
                {Object.entries(localFinalScores).filter(([stat]) => stat !== '_debugInfo').map(([stat, score]) => (
                    <div key={stat} className="text-center">
                        <label className="block text-sm font-bold mb-1">{stat}</label>
                        <input
                            type="number"
                            min="1"
                            max="30"
                            value={score}
                            onChange={(e) => {
                                const newValue = Number.parseInt(e.target.value, 10);
                                if (!Number.isFinite(newValue)) return;
                                const baseFinal = computedFinalScores[stat] ?? score;
                                setLocalManualAdjustments(prev => ({
                                    ...prev,
                                    [stat]: newValue - baseFinal
                                }));
                            }}
                            className="w-full p-2 bg-gray-700 border border-gray-600 rounded text-center font-bold"
                        />
                        <div className="text-xs text-gray-400 mt-1">
                            Mod: {getModifier(score) >= 0 ? '+' : ''}{getModifier(score)}
                        </div>
                    </div>
                ))}
            </div>
        </div>
        
        <div className="grid grid-cols-3 md:grid-cols-6 gap-2 mb-8">
            {Object.entries(localFinalScores).map(([stat, score]) => <StatBox key={stat} label={stat} value={score} modifier={getModifier(score)} />)}
        </div>
        <div className="flex justify-between mt-8">
            <button onClick={onBack} className="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded-lg">Back</button>
            <button onClick={onNext} className="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg">Next</button>
        </div>
    </div>
    );
};

const EquipmentStep = ({ onNext, onBack, homebrew, character, updateCharacter }) => {

    const equipmentCategories = {
        weapons: homebrew.items?.weapons || [],
        armor: homebrew.items?.armor || [],
        tools: homebrew.items?.tools || [],
        consumables: homebrew.items?.consumables || []

    const toggleEquipment = (itemId) => {
        if (selectedEquipment.includes(itemId)) {
            setSelectedEquipment(selectedEquipment.filter(id => id !== itemId));

            setSelectedEquipment([...selectedEquipment, itemId]);
        }
    };
    
    const getAllItems = () => {
        const allItems = [];
        Object.values(equipmentCategories).forEach(categoryItems => {
            allItems.push(...categoryItems);
        });
        return allItems;
    };
    
    const getSelectedItems = () => {
        const allItems = getAllItems();
        return selectedEquipment.map(id => allItems.find(item => item.id === id)).filter(Boolean);

    // Update character equipment when selections change
    React.useEffect(() => {
        updateCharacter('equipment', selectedEquipment);

    return (
        <div>

                <div key={category} className="mb-6">
                    <h3 className="text-xl font-bold mb-2 capitalize text-orange-400">{category} ({items.length})</h3>
                    {items.length === 0 ? (
                        <p className="text-gray-500 italic">No {category} available from handbook data</p>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2 max-h-60 overflow-y-auto">

const PowersStep = ({ onNext, onBack, homebrew, character, updateCharacter, finalScores }) => {
    const chosenClass = homebrew.classes[character.class];
    const chosenSubclass = character.subclass ? homebrew.subclasses[character.subclass] : null;
    const spellcasting = chosenClass?.spellcasting;
    const level = character.level;
    
    // Calculate base values
    let baseCantripsKnown = spellcasting?.cantripsKnown?.[level] || spellcasting?.['cantrips-known']?.[level] || 0;
    let baseSpellsKnown = spellcasting?.powersKnown?.[level] || spellcasting?.['spells-known']?.[level] || 0;
    let baseCausalPoints = spellcasting?.causalPoints?.[level] || 0;
    
    // Apply subclass modifications
    let finalCantripsKnown = baseCantripsKnown;
    let finalSpellsKnown = baseSpellsKnown;
    let finalCausalPoints = baseCausalPoints;
    let subclassNotes = [];
    
    if (chosenSubclass) {
        if (chosenSubclass.key === 'illuminator') {
            // Illuminator gets bonus powers known: +1 at L1, +1 at L3, +2 at L6, +2 at L10, +2 at L14, +3 at L18, +3 at L20
            const illuminatorBonuses = {
                1: 1, 3: 1, 6: 2, 10: 2, 14: 2, 18: 3, 20: 3
            };
            
            let totalBonus = 0;
            for (let lvl = 1; lvl <= level; lvl++) {
                if (illuminatorBonuses[lvl]) {
                    totalBonus += illuminatorBonuses[lvl];
                }
            }
            
            finalSpellsKnown += totalBonus;
            subclassNotes.push(`Illuminator Bonus: +${totalBonus} powers known`);
            
            // Luminous Augmentation: Max Causal Points +Int mod (min +1) at level 6+
            if (level >= 6) {
                const intMod = Math.floor(((finalScores?.INT || 10) - 10) / 2);
                const causalBonus = Math.max(1, intMod);
                finalCausalPoints += causalBonus;
                subclassNotes.push(`Luminous Augmentation: +${causalBonus} max Causal Points (Int mod)`);
            }
            
        } else if (chosenSubclass.key === 'potentiator') {
            // Potentiator has "Causal Point max higher. Fewer preset powers known."
            // Based on description, they rely more on Force Potentiation than preset powers
            const potentiatorMods = {
                // Reduce powers known but increase causal points
                3: { spellsMod: -1, causalMod: 2 },
                6: { spellsMod: -1, causalMod: 3 },
                10: { spellsMod: -2, causalMod: 4 },
                14: { spellsMod: -2, causalMod: 5 }
            };
            
            let spellReduction = 0;
            let causalIncrease = 0;
            
            for (let lvl = 1; lvl <= level; lvl++) {
                if (potentiatorMods[lvl]) {
                    spellReduction += potentiatorMods[lvl].spellsMod;
                    causalIncrease += potentiatorMods[lvl].causalMod;
                }
            }
            
            finalSpellsKnown = Math.max(0, finalSpellsKnown + spellReduction);
            finalCausalPoints += causalIncrease;
            
            if (spellReduction < 0) subclassNotes.push(`Potentiator Reduction: ${spellReduction} powers known`);
            if (causalIncrease > 0) subclassNotes.push(`Potentiator Bonus: +${causalIncrease} max Causal Points`);
            subclassNotes.push(`Relies on Force Potentiation instead of preset powers`);
            
        } else if (chosenSubclass.key === 'balancer') {
            // Balancer uses standard progression
            subclassNotes.push(`Standard progression (Balancer)`);
        }
    }
    
    // Get spells from multiple sources
    const classSpells = homebrew.spells[character.class?.toLowerCase()] || [];
    const allAvailableSpells = [];
    
    // Add class-specific spells
    allAvailableSpells.push(...classSpells);
    
    // Add ALL spells from all sources - no class restrictions since sheets are hand-checked
    Object.values(homebrew.spells).forEach(spellOrCollection => {
        if (Array.isArray(spellOrCollection)) {
            // This is an array of spells
            spellOrCollection.forEach(spell => {
                if (spell && spell.name && spell.level !== undefined) {
                    // Add all spells - no class restrictions
                    allAvailableSpells.push(spell);
                }
            });
        } else if (spellOrCollection && spellOrCollection.name && spellOrCollection.level !== undefined) {
            // This is a single spell object - add all spells
            allAvailableSpells.push(spellOrCollection);
        }
    });
    
    // Deduplicate spells by name
    const uniqueSpells = allAvailableSpells.reduce((acc, spell) => {
        const key = spell.name || spell.key;
        if (key && !acc[key]) {
            acc[key] = spell;
        }
        return acc;
    }, {});
    
    const cantrips = Object.values(uniqueSpells).filter(spell => spell.level === 0);
    const leveledSpells = Object.values(uniqueSpells).filter(spell => 
        spell.level > 0 && spell.level <= Math.ceil(character.level / 2)
    );
    
    const handlePowerToggle = (powerKey, isCantrip) => {
        const type = isCantrip ? 'cantrips' : 'leveled';
        const currentList = character.powers[type];
        
        if (currentList.includes(powerKey)) {
            updateCharacter('powers', { 
                ...character.powers, 
                [type]: currentList.filter(p => p !== powerKey) 
            });
        } else {
            // No limits - allow unlimited selection
            updateCharacter('powers', { 
                ...character.powers, 
                [type]: [...currentList, powerKey] 
            });
        }
    };
    
    return (
        <div>
            <h2 className="text-2xl font-bold mb-4 text-indigo-300">Select Spells & Powers</h2>
            
            {/* Subclass Progression Info */}
            {chosenSubclass && subclassNotes.length > 0 && (
                <div className="bg-purple-900 border border-purple-600 text-purple-200 p-3 mb-4 rounded text-sm">
                    <p className="font-bold mb-1">🎯 {chosenSubclass.name} Power Progression:</p>
                    {subclassNotes.map((note, i) => <p key={i}>• {note}</p>)}
                    <p className="mt-2 font-bold text-purple-100">
                        Expected Total Powers: {finalCantripsKnown} cantrips, {finalSpellsKnown} leveled spells
                    </p>
                    <p className="text-xs italic">
                        Base Causal Points: {baseCausalPoints} → Modified: {finalCausalPoints}
                    </p>
                    <p className="text-xs italic mt-1 text-yellow-300">
                        ⚠️ Select your powers manually - no limits enforced due to calculation issues
                    </p>
                </div>
            )}
            
            {/* No subclass selected info */}
            {!chosenSubclass && (
                <div className="bg-blue-900 border border-blue-600 text-blue-200 p-3 mb-4 rounded text-sm">
                    <p className="font-bold mb-1">📚 Standard Luminancer Power Progression:</p>
                    <p>Expected Total Powers: {finalCantripsKnown} cantrips, {finalSpellsKnown} leveled spells</p>
                    <p className="text-xs italic mt-1 text-yellow-300">
                        ⚠️ Select your powers manually - no limits enforced due to calculation issues
                    </p>
                </div>
            )}
            
            {/* Debug info */}
            <div className="bg-green-800 text-green-200 p-2 mb-4 rounded text-xs">
                <p><strong>All Spells Available</strong> - No class restrictions (sheets are hand-checked)</p>
                <p>Cantrips known: {finalCantripsKnown}, Powers known: {finalSpellsKnown}, Causal Points: {finalCausalPoints}</p>
                <p>Cantrips found: {cantrips.length}, Leveled spells found: {leveledSpells.length}</p>
                <p>Total unique spells: {Object.keys(uniqueSpells).length}</p>
                <p>Sample spell names: {allAvailableSpells.slice(0, 5).map(s => s.name || s.key).join(', ')}...</p>
            </div>
            
            {!spellcasting ? (
                <div className="text-center text-gray-400">
                    <p>This class does not have spellcasting abilities.</p>
                </div>
            ) : (
                <div className="space-y-6">
                    {/* Cantrips Section */}
                    <div>
                        <h3 className="text-xl font-bold mb-4">
                            Cantrips (Selected: {character.powers.cantrips.length})
                        </h3>
                        {cantrips.length === 0 ? (
                            <p className="text-gray-400 italic">No cantrips available</p>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-60 overflow-y-auto">
                                {cantrips.map(spell => {
                                    const spellKey = spell.name || spell.key;
                                    return (
                                        <div key={spellKey} className="bg-gray-700 p-3 rounded-lg">
                                            <label className="flex items-start cursor-pointer">
                                                <input 
                                                    type="checkbox"
                                                    checked={character.powers.cantrips.includes(spellKey)}
                                                    onChange={() => handlePowerToggle(spellKey, true)}
                                                    className="mr-2 mt-1"
                                                />
                                                <div>
                                                    <strong className="text-white">{spell.name || spell.key}</strong>
                                                    {spell.school && <em className="text-gray-300 ml-2">({spell.school})</em>}
                                                    <p className="text-sm text-gray-300 mt-1">
                                                        {spell.description?.substring(0, 120)}...
                                                    </p>
                                                </div>
                                            </label>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                    
                    {/* Leveled Spells Section */}
                    <div>
                        <h3 className="text-xl font-bold mb-4">
                            Leveled Spells (Selected: {character.powers.leveled.length})
                        </h3>
                        {leveledSpells.length === 0 ? (
                            <p className="text-gray-400 italic">No leveled spells available at this level</p>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-60 overflow-y-auto">
                                {leveledSpells.map(spell => {
                                    const spellKey = spell.name || spell.key;
                                    return (
                                        <div key={spellKey} className="bg-gray-700 p-3 rounded-lg">
                                            <label className="flex items-start cursor-pointer">
                                                <input 
                                                    type="checkbox"
                                                    checked={character.powers.leveled.includes(spellKey)}
                                                    onChange={() => handlePowerToggle(spellKey, false)}
                                                    className="mr-2 mt-1"
                                                />
                                                <div>
                                                    <strong className="text-white">{spell.name || spell.key}</strong>
                                                    <em className="text-blue-300 ml-2">(Level {spell.level})</em>
                                                    {spell.school && <em className="text-gray-300 ml-2">({spell.school})</em>}
                                                    <p className="text-sm text-gray-300 mt-1">
                                                        {spell.description?.substring(0, 120)}...
                                                    </p>
                                                </div>
                                            </label>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            )}
            
            <div className="flex justify-between mt-8">
                <button onClick={onBack} className="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-6 rounded-lg">Back</button>
                <button onClick={onNext} className="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg">Next</button>
            </div>
        </div>
    );
};

const CopyableBlock = ({ title, content }) => {
    const [copied, setCopied] = useState(false);
    const textAreaRef = React.useRef(null);
    const copyToClipboard = (e) => {
        textAreaRef.current.select();
        document.execCommand('copy');
        e.target.focus();
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
    };
    return (
        <div className="bg-gray-700 p-4 rounded-lg mb-4">
            <div className="flex justify-between items-center mb-2">
                <h4 className="font-bold text-lg text-gray-200">{title}</h4>
                <button onClick={copyToClipboard} className="bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-bold py-1 px-3 rounded-md">{copied ? 'Copied!' : 'Copy'}</button>
            </div>
            <textarea ref={textAreaRef} readOnly value={content} className="w-full h-48 bg-gray-900 p-2 rounded-md font-mono text-xs"/>
        </div>
    );
};

            const htmlContent = createAvraeSpreadsheet();
            console.log('Full GSheet HTML created, length:', htmlContent.length);
            
            if (!htmlContent || htmlContent.length < 1000) {
                throw new Error('HTML content too short - likely failed to generate properly');
            }
            
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
            console.log('Blob created, size:', blob.size);
            
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            // Use a safe filename
            const safeName = (character.name || 'Character').replace(/[^a-z0-9]/gi, '_') || 'Character';
            const filename = `${safeName}_GSheet_v2.1.html`;
            
            link.setAttribute('href', url);
            link.setAttribute('download', filename);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            console.log('Triggering download for:', filename);
            link.click();
            document.body.removeChild(link);
            
            // Clean up the URL
            setTimeout(() => URL.revokeObjectURL(url), 100);
            
            console.log('Download completed successfully');
        } catch (error) {
            console.error('Download error:', error);
            console.error('Error message:', error.message);
            console.error('Error stack:', error.stack);
            alert(`Download failed: ${error.message}\n\nCheck browser console for details.`);

            alert('Google Sheets HTML data copied to clipboard! You can now paste it into Google Sheets.');
