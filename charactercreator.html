<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Creator</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root">
        <div style="background: #111827; color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
            <div style="text-align: center;">
                <h1 style="font-size: 2rem; margin-bottom: 1rem;">Loading Character Creator...</h1>
                <p>If this doesn't load, there may be a JavaScript error. Check console for details.</p>
                <div style="margin-top: 2rem;">
                    <div style="border: 2px solid #4F46E5; border-radius: 50%; border-top-color: transparent; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto;"></div>
                </div>
            </div>
        </div>
    </div>
    
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    
    <script type="text/babel">
        console.log("Script started - checking React availability...");
        console.log("React available:", typeof React !== 'undefined');
        console.log("ReactDOM available:", typeof ReactDOM !== 'undefined');
        console.log("Babel available:", typeof Babel !== 'undefined');
        
        if (typeof React === 'undefined') {
            document.getElementById('root').innerHTML = '<div style="background: red; color: white; padding: 20px; text-align: center;"><h1>Error: React not loaded</h1><p>React library failed to load. Check internet connection or CDN.</p></div>';
        }
        
        if (typeof ReactDOM === 'undefined') {
            document.getElementById('root').innerHTML = '<div style="background: red; color: white; padding: 20px; text-align: center;"><h1>Error: ReactDOM not loaded</h1><p>ReactDOM library failed to load. Check internet connection or CDN.</p></div>';
        }
        
        console.log("React script starting...");
        
        const { useState, useEffect, useMemo } = React;

// --- Helper Functions & Constants ---

        const SHEET_EXPORT_BASE = './referencedata/Copy of Dsheet2/';

        const slugifyKey = (name) => {
            return String(name || '')
                .trim()
                .toLowerCase()
                .replace(/['’]/g, '')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        };

        const normalizeCellText = (text) => {
            return String(text || '')
                .replace(/\u00a0/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        };

        const looksLikeAsiText = (text) => {
            const t = normalizeCellText(text);
            if (!t) return false;
            if (/ability score/i.test(t)) return true;
            if (/\b(increase your|your .* score increases by)\b/i.test(t)) return true;
            if (/\+\d+/.test(t) && /\b(Strength|Dexterity|Constitution|Intelligence|Wisdom|Charisma|STR|DEX|CON|INT|WIS|CHA)\b/i.test(t)) return true;
            return false;
        };

        const extractAsiTextFromElement = (elem) => {
            if (!elem) return '';
            const nodes = Array.from(elem.querySelectorAll('li, p'));
            for (const node of nodes) {
                const text = normalizeCellText(node.textContent);
                if (looksLikeAsiText(text)) return text;
            }
            return '';
        };

        // Extract a JS object literal assigned to a const, e.g. `const weaponsData = { ... };`
        // Uses brace counting and ignores braces inside strings.
        const extractConstObjectLiteral = (text, constName) => {
            const marker = `const ${constName}`;
            const idx = String(text || '').indexOf(marker);
            if (idx < 0) return null;
            const braceStart = text.indexOf('{', idx);
            if (braceStart < 0) return null;

            let depth = 0;
            let inString = false;
            let stringChar = '';
            let escape = false;
            for (let i = braceStart; i < text.length; i++) {
                const ch = text[i];
                if (inString) {
                    if (escape) {
                        escape = false;
                        continue;
                    }
                    if (ch === '\\') {
                        escape = true;
                        continue;
                    }
                    if (ch === stringChar) {
                        inString = false;
                        stringChar = '';
                    }
                    continue;
                }

                if (ch === '"' || ch === "'" || ch === '`') {
                    inString = true;
                    stringChar = ch;
                    continue;
                }

                if (ch === '{') depth++;
                if (ch === '}') {
                    depth--;
                    if (depth === 0) {
                        return text.slice(braceStart, i + 1);
                    }
                }
            }
            return null;
        };

        const fetchLocalText = async (relativePath) => {
            const url = encodeURI(relativePath);
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Failed to fetch ${relativePath}: ${response.status} ${response.statusText}`);
            }
            return await response.text();
        };

        // Parses Google Sheets "ritz/waffle" exported HTML tables into a 2D grid of strings.
        // Handles colspans and rowspans sufficiently for header+row extraction.
        const parseWaffleTableGrid = (htmlString) => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');
            const table = doc.querySelector('table.waffle') || doc.querySelector('.ritz table') || doc.querySelector('table');
            if (!table) return [];

            const grid = [];
            const activeRowSpans = []; // per column: { remaining, text }

            const trs = Array.from(table.querySelectorAll('tr'));
            trs.forEach((tr) => {
                const row = [];

                // Pre-fill from active rowspans
                for (let col = 0; col < activeRowSpans.length; col++) {
                    const span = activeRowSpans[col];
                    if (span && span.remaining > 0) {
                        row[col] = span.text;
                        span.remaining -= 1;
                        if (span.remaining <= 0) activeRowSpans[col] = null;
                    }
                }

                let colIndex = 0;
                const cells = Array.from(tr.querySelectorAll('th,td'));
                cells.forEach((cell) => {
                    while (row[colIndex] !== undefined) colIndex++;
                    const text = normalizeCellText(cell.textContent);
                    const colSpan = Number(cell.getAttribute('colspan') || cell.colSpan || 1) || 1;
                    const rowSpan = Number(cell.getAttribute('rowspan') || cell.rowSpan || 1) || 1;

                    for (let i = 0; i < colSpan; i++) {
                        row[colIndex + i] = text;
                        if (rowSpan > 1) {
                            activeRowSpans[colIndex + i] = { remaining: rowSpan - 1, text };
                        }
                    }
                    colIndex += colSpan;
                });

                // Fill any remaining active rowspans beyond current row length
                for (let col = 0; col < activeRowSpans.length; col++) {
                    const span = activeRowSpans[col];
                    if (span && span.remaining > 0 && row[col] === undefined) {
                        row[col] = span.text;
                        span.remaining -= 1;
                        if (span.remaining <= 0) activeRowSpans[col] = null;
                    }
                }

                // Trim trailing empties
                let end = row.length;
                while (end > 0 && !normalizeCellText(row[end - 1])) end--;
                grid.push(row.slice(0, end).map(normalizeCellText));
            });

            return grid;
        };

        const collapseHeaderGroups = (headerRow) => {
            const groups = [];
            let current = null;
            for (let i = 0; i < headerRow.length; i++) {
                const name = normalizeCellText(headerRow[i]);
                if (!name) continue;
                if (!current || current.name !== name) {
                    if (current) groups.push(current);
                    current = { name, start: i, end: i + 1 };
                } else {
                    current.end = i + 1;
                }
            }
            if (current) groups.push(current);
            return groups;
        };

        const rowToObjectByGroups = (row, groups) => {
            const obj = {};
            groups.forEach((g) => {
                const slice = row.slice(g.start, g.end).map(normalizeCellText).filter(Boolean);
                const unique = Array.from(new Set(slice));
                obj[g.name] = normalizeCellText(unique.join(' '));
            });
            return obj;
        };

        const parseFixedAbilityScoresFromText = (asiText) => {
            const out = {};
            const t = String(asiText || '');
            const patterns = [
                /\+(\d+)\s*(STR|DEX|CON|INT|WIS|CHA)\b/gi,
                /\b(STR|DEX|CON|INT|WIS|CHA)\s*\+\s*(\d+)\b/gi,
                /\b(Strength|Dexterity|Constitution|Intelligence|Wisdom|Charisma)\b[^\d]{0,10}(\d+)/gi,
            ];
            const normalize = (s) => {
                const k = String(s || '').toUpperCase();
                if (k.startsWith('STR') || k.startsWith('STRENG')) return 'STR';
                if (k.startsWith('DEX')) return 'DEX';
                if (k.startsWith('CON')) return 'CON';
                if (k.startsWith('INT')) return 'INT';
                if (k.startsWith('WIS')) return 'WIS';
                if (k.startsWith('CHA')) return 'CHA';
                return null;
            };
            patterns.forEach((re) => {
                let m;
                while ((m = re.exec(t)) !== null) {
                    const stat = normalize(m[2] || m[1]);
                    const val = Number(m[1] && /\d+/.test(m[1]) ? m[1] : m[2]);
                    if (stat && Number.isFinite(val)) out[stat] = (out[stat] || 0) + val;
                }
            });
            return out;
        };

        const parseSheetRaceInfo = async () => {
            try {
                const html = await fetchLocalText(`${SHEET_EXPORT_BASE}Race Info.html`);
                const grid = parseWaffleTableGrid(html);
                if (!grid.length) return {};

                const headerRowIndex = grid.findIndex(r => r.some(c => normalizeCellText(c) === 'Race Name'));
                if (headerRowIndex < 0) return {};

                const headerGroups = collapseHeaderGroups(grid[headerRowIndex]);

                const races = {};
                for (let i = headerRowIndex + 1; i < grid.length; i++) {
                    const rowObj = rowToObjectByGroups(grid[i], headerGroups);
                    const raceName = normalizeCellText(rowObj['Race Name']);
                    if (!raceName || raceName === '-' || raceName.toUpperCase() === 'RACE OPTIONS') continue;

                    const asiText = normalizeCellText(rowObj['Ability Score Increases']);
                    const abilityScores = (asiText && !/choose|one of|any|either|or\b/i.test(asiText))
                        ? parseFixedAbilityScoresFromText(asiText)
                        : {};

                    const speed = normalizeCellText(rowObj['Speed']);
                    const naturalArmor = normalizeCellText(rowObj['Natural Armor Class']);
                    const bonusHp = normalizeCellText(rowObj['Bonus HP per Level']);
                    const resist = normalizeCellText(rowObj['Resistances, Immunities, and Vulnerabilities']);
                    const langs = normalizeCellText(rowObj['Languages']);
                    const natAtk = normalizeCellText(rowObj['Natural Attack']);
                    const bonusProf = normalizeCellText(rowObj['Bonus Weapon and Armor Proficiencies']);
                    const other = normalizeCellText(rowObj['Other Features & Proficiencies']);

                    const traits = [];
                    if (asiText) traits.push({ name: 'Ability Score Increase', description: asiText });
                    if (speed) traits.push({ name: 'Speed', description: speed });
                    if (naturalArmor) traits.push({ name: 'Natural Armor', description: naturalArmor });
                    if (bonusHp) traits.push({ name: 'Bonus HP per Level', description: bonusHp });
                    if (resist) traits.push({ name: 'Resistances/Immunities/Vulnerabilities', description: resist });
                    if (langs) traits.push({ name: 'Languages', description: langs });
                    if (natAtk) traits.push({ name: 'Natural Attack', description: natAtk });
                    if (bonusProf) traits.push({ name: 'Bonus Proficiencies', description: bonusProf });
                    if (other) traits.push({ name: 'Other Features', description: other });

                    const id = slugifyKey(raceName);
                    races[id] = {
                        id,
                        name: raceName,
                        abilityScores,
                        traits,
                        subraces: {},
                        html: `
                            <div>
                                <h3>${raceName}</h3>
                                ${asiText ? `<p><strong>Ability Score Increases:</strong> ${asiText}</p>` : ''}
                                ${speed ? `<p><strong>Speed:</strong> ${speed}</p>` : ''}
                                ${naturalArmor ? `<p><strong>Natural Armor Class:</strong> ${naturalArmor}</p>` : ''}
                                ${bonusHp ? `<p><strong>Bonus HP per Level:</strong> ${bonusHp}</p>` : ''}
                                ${resist ? `<p><strong>Resistances/Immunities/Vulnerabilities:</strong> ${resist}</p>` : ''}
                                ${langs ? `<p><strong>Languages:</strong> ${langs}</p>` : ''}
                                ${natAtk ? `<p><strong>Natural Attack:</strong> ${natAtk}</p>` : ''}
                                ${bonusProf ? `<p><strong>Bonus Weapon & Armor Proficiencies:</strong> ${bonusProf}</p>` : ''}
                                ${other ? `<p><strong>Other Features & Proficiencies:</strong> ${other}</p>` : ''}
                            </div>
                        `.trim()
                    };
                }

                console.log(`Parsed ${Object.keys(races).length} races from sheet export Race Info.html`);
                return races;
            } catch (e) {
                console.warn('Sheet Race Info parse failed:', e);
                return {};
            }
        };

        const extractClassBasicsFromText = (text) => {
            const t = String(text || '');
            const abilities = [];
            const map = {
                strength: 'Strength', dexterity: 'Dexterity', constitution: 'Constitution',
                intelligence: 'Intelligence', wisdom: 'Wisdom', charisma: 'Charisma',
                str: 'Strength', dex: 'Dexterity', con: 'Constitution', int: 'Intelligence', wis: 'Wisdom', cha: 'Charisma'
            };
            const re = /\b(Strength|Dexterity|Constitution|Intelligence|Wisdom|Charisma|STR|DEX|CON|INT|WIS|CHA)\b/g;
            let m;
            while ((m = re.exec(t)) !== null) {
                const key = String(m[1] || '').toLowerCase();
                const val = map[key];
                if (val && !abilities.includes(val)) abilities.push(val);
            }
            return abilities;
        };

        const parseHitDieFromText = (text) => {
            const m = String(text || '').match(/\bd(\d+)\b/i);
            return m ? Number(m[1]) : null;
        };

        const parseSheetClassInfo = async () => {
            try {
                const html = await fetchLocalText(`${SHEET_EXPORT_BASE}Class Info.html`);
                const grid = parseWaffleTableGrid(html);
                if (!grid.length) return { classes: {}, subclasses: {} };

                const headerRowIndex = grid.findIndex(r => r.some(c => normalizeCellText(c) === 'Class Name'));
                if (headerRowIndex < 0) return { classes: {}, subclasses: {} };
                const headerGroups = collapseHeaderGroups(grid[headerRowIndex]);

                const classes = {};
                const subclasses = {};

                for (let i = headerRowIndex + 1; i < grid.length; i++) {
                    const rowObj = rowToObjectByGroups(grid[i], headerGroups);
                    const className = normalizeCellText(rowObj['Class Name']);
                    if (!className || className === '-' || className.toUpperCase().includes('CLASS NAME')) continue;

                    const subclassName = normalizeCellText(rowObj['Subclass']);
                    const hitDieSize = normalizeCellText(rowObj['Hit Die Size']);
                    const savingAndSkills = normalizeCellText(rowObj['Saving Throw Proficiencies & Class Skills']);
                    const prof1 = normalizeCellText(rowObj['1st Level Exclusive Proficiencies']);
                    const spellcastingType = normalizeCellText(rowObj['Spellcasting Type']);

                    const classKey = slugifyKey(className);
                    const hitDie = parseHitDieFromText(hitDieSize);

                    const savingThrows = extractClassBasicsFromText(savingAndSkills).slice(0, 2);

                    if (subclassName && subclassName !== '-') {
                        const scKey = slugifyKey(subclassName);
                        subclasses[scKey] = {
                            key: scKey,
                            name: subclassName,
                            class: classKey,
                            features: [],
                            html: `
                                <div>
                                    <h3>${subclassName}</h3>
                                    <p><strong>Class:</strong> ${className}</p>
                                    ${spellcastingType && spellcastingType !== '-' ? `<p><strong>Spellcasting Type:</strong> ${spellcastingType}</p>` : ''}
                                    ${prof1 && prof1 !== '-' ? `<p><strong>Notes:</strong> ${prof1}</p>` : ''}
                                </div>
                            `.trim()
                        };
                    } else {
                        // Base class row
                        if (!classes[classKey]) {
                            classes[classKey] = {
                                key: classKey,
                                name: className,
                                hitDie: hitDie || undefined,
                                savingThrows: savingThrows.length ? savingThrows : undefined,
                                subclassLevel: 3,
                                subclassTitle: 'Subclass',
                                spellcasting: (spellcastingType && spellcastingType !== '-') ? { ability: undefined, type: spellcastingType } : undefined,
                                features: [],
                                _sheet: {
                                    hitDieSize,
                                    savingAndSkills,
                                    prof1,
                                    spellcastingType,
                                }
                            };
                        }
                    }
                }

                console.log(`Parsed ${Object.keys(classes).length} classes and ${Object.keys(subclasses).length} subclasses from sheet export Class Info.html`);
                return { classes, subclasses };
            } catch (e) {
                console.warn('Sheet Class Info parse failed:', e);
                return { classes: {}, subclasses: {} };
            }
        };

// Enhanced parser for races.html data
const parseRacesData = async () => {
    try {
        const response = await fetch('./src/races.html');
        const text = await response.text();
        
        // Extract the racesData array from the JavaScript (same approach as spells/items)
        const racesMatch = text.match(/const racesData = (\[[\s\S]*?\]);/);
        if (racesMatch) {
            const racesArray = new Function(`return ${racesMatch[1]}`)();
            
            const races = {};
            
            racesArray.forEach(raceData => {
                if (raceData.type === 'race') {
                    // Parse the HTML content for traits and subraces
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(raceData.contentHTML, 'text/html');
                    
                    let traits = [];
                    const strongElements = doc.querySelectorAll('strong');
                    strongElements.forEach(strong => {
                        const parent = strong.parentElement;
                        if (parent && (parent.tagName === 'P' || parent.tagName === 'LI')) {
                            const text = parent.textContent;
                            if (text.includes('Ability Score') || text.includes('Size') || text.includes('Speed') || text.includes('Languages')) {
                                traits.push({
                                    name: strong.textContent.replace('.', '').trim(),
                                    description: text.replace(strong.textContent, '').trim()
                                });
                            }
                        }
                    });
                    
                    // Look for ability score information in the HTML content
                    const textContent = raceData.contentHTML;
                    let abilityScores = {};
                    
                    // Parse various ASI patterns
                    const asiPatterns = [
                        /Ability Score Increase.*?(\w+).*?increases by (\d+)/gi,
                        /Your (\w+) score increases by (\d+)/gi,
                        /\+(\d+) to (\w+)/gi
                    ];
                    
                    asiPatterns.forEach(pattern => {
                        let match;
                        while ((match = pattern.exec(textContent)) !== null) {
                            if (match[2] && match[1]) {
                                const stat = match[2].toUpperCase().substring(0, 3);
                                const increase = parseInt(match[1]);
                                if (!isNaN(increase)) {
                                    abilityScores[stat] = (abilityScores[stat] || 0) + increase;
                                }
                            } else if (match[1] && match[2]) {
                                const stat = match[1].toUpperCase().substring(0, 3);
                                const increase = parseInt(match[2]);
                                if (!isNaN(increase)) {
                                    abilityScores[stat] = (abilityScores[stat] || 0) + increase;
                                }
                            }
                        }
                    });
                    
                    // Extract subraces
                    const subraces = {};
                    const subraceHeaders = doc.querySelectorAll('h4, h3');
                    subraceHeaders.forEach(header => {
                        const headerText = header.textContent.trim();
                        // Look for subrace indicators
                        if (headerText && !headerText.includes('Traits') && !headerText.includes('Description')) {
                            let subraceContent = '';
                            let nextElement = header.nextElementSibling;
                            
                            // Collect content until next header or end
                            while (nextElement && !['H3', 'H4', 'H2'].includes(nextElement.tagName)) {
                                subraceContent += nextElement.outerHTML;
                                nextElement = nextElement.nextElementSibling;
                            }
                            
                            if (subraceContent.trim()) {
                                const subraceId = headerText.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                                subraces[subraceId] = {
                                    id: subraceId,
                                    name: headerText,
                                    parentRace: raceData.id,
                                    html: subraceContent,
                                    traits: []
                                };
                            }
                        }
                    });
                    
                    races[raceData.id] = {
                        id: raceData.id,
                        name: raceData.name,
                        abilityScores,
                        traits,
                        subraces,
                        html: raceData.contentHTML
                    };
                }
            });
            
            return races;
        }
        
        return {};
    } catch (error) {
        console.error("Failed to parse races data:", error);
        return {};
    }
};

// Enhanced parser for spells data
const parseSpellsData = async () => {
    try {
        const response = await fetch('./spellbook.html');
        const text = await response.text();
        
        // Find the start and end of the spellsData array more reliably
        const startMarker = 'const spellsData = [';
        const endMarker = '];';
        
        const startIndex = text.indexOf(startMarker);
        if (startIndex === -1) {
            console.error("Could not find spellsData array start");
            return { spellsArray: [], spellsByClass: {}, spellsByLevel: {} };
        }
        
        // Find the closing ]; after the array starts
        let searchStart = startIndex + startMarker.length;
        let bracketCount = 1;
        let endIndex = -1;
        
        for (let i = searchStart; i < text.length; i++) {
            if (text[i] === '[') bracketCount++;
            if (text[i] === ']') {
                bracketCount--;
                if (bracketCount === 0 && text.substring(i, i + 2) === '];') {
                    endIndex = i + 2;
                    break;
                }
            }
        }
        
        if (endIndex === -1) {
            console.error("Could not find spellsData array end");
            return { spellsArray: [], spellsByClass: {}, spellsByLevel: {} };
        }
        
        const arrayText = text.substring(startIndex + 'const spellsData = '.length, endIndex - 1);
        console.log(`Extracted spell array length: ${arrayText.length} characters`);
        
        const spellsArray = new Function(`return ${arrayText}`)();
        console.log(`Parsed ${spellsArray.length} spells from spellbook.html`);
        
        const spellsByClass = {};
        const spellsByLevel = {};
        
        spellsArray.forEach(spell => {
            // Organize by class - handle various class formats
            if (spell.classes) {
                const classesText = spell.classes.toLowerCase();
                const classNames = [];
                
                // Handle different class naming patterns
                if (classesText.includes('all divine')) {
                    classNames.push('cleric', 'paladin', 'druid');
                } else if (classesText.includes('all arcane')) {
                    classNames.push('wizard', 'sorcerer', 'bard', 'warlock');
                } else if (classesText.includes('luminancer')) {
                    classNames.push('luminancer');
                } else {
                    // Split by common delimiters
                    classNames.push(...classesText.split(/[,;]/).map(c => c.trim()));
                }
                
                classNames.forEach(className => {
                    const cleanClass = className.replace(/[^a-z]/g, '');
                    if (cleanClass && !spellsByClass[cleanClass]) spellsByClass[cleanClass] = [];
                    if (cleanClass) spellsByClass[cleanClass].push(spell);
                });
            }
            
            // Organize by level
            const level = spell.level || 0;
            if (!spellsByLevel[level]) spellsByLevel[level] = [];
            spellsByLevel[level].push(spell);
        });
        
        console.log(`Organized spells by class:`, Object.keys(spellsByClass).map(c => `${c}: ${spellsByClass[c].length}`));
        
        return { spellsArray, spellsByClass, spellsByLevel };
    } catch (error) {
        console.error("Failed to parse spells data:", error);
    }
    return { spellsArray: [], spellsByClass: {}, spellsByLevel: {} };
};

// Enhanced parser for items data - includes weapons from legacy and armor from regalia
const parseItemsData = async () => {
    try {
        const items = { weapons: [], armor: [], tools: [], consumables: [] };
        
        // Load items from src/items.html
        try {
            const response = await fetch('./src/items.html');
            const text = await response.text();
            
            const itemsMatch = text.match(/const itemsData = (\[.*?\]);/s);
            if (itemsMatch) {
                const itemsArray = new Function(`return ${itemsMatch[1]}`)();
                
                itemsArray.forEach(item => {
                    // items.html is primarily ingredients/crafted/potions/etc.
                    // Treat these as consumables by default so they don't leak into weapons/armor/tools.
                    const name = item.name;
                    if (!name) return;
                    items.consumables.push({
                        id: item.id || slugifyKey(name),
                        name,
                        description: item.description || '',
                        type: item.type || 'consumable',
                        rarity: item.rarity || 'Common',
                        value: item.value,
                        location: item.location,
                        image: item.image,
                    });
                });
            }
        } catch (err) {
            console.log("Could not load src/items.html:", err);
        }
        
        // Load weapons from legacyweapon.html (source of truth is in src/legacyweapon.html)
        try {
            const weaponText = await fetchLocalText('./src/legacyweapon.html');
            const objLiteral = extractConstObjectLiteral(weaponText, 'weaponsData');
            if (objLiteral) {

                        if (!weaponName) return;
                        const id = slugifyKey(weaponName);
                        if (seen.has(id)) return;
                        seen.add(id);
                        items.weapons.push({
                            id,
                            name: weaponName,
                            description: `${weapon.damage_dice || ''} ${weapon.damage_type || ''} damage. ${weapon.special || ''}`.trim(),
                            type: 'weapon',
                            rarity: weapon.rarity || 'Common',
                            damage: weapon.damage_dice,
                            damageType: weapon.damage_type,
                            value: weapon.base_cost,
                            properties: [
                                weapon.light && 'Light',
                                weapon.finesse && 'Finesse',
                                weapon.special
                            ].filter(Boolean)
                        });
                    });
                });
            } else {
                console.warn('Could not find weaponsData in src/legacyweapon.html');
            }
        } catch (err) {
            console.log("Could not load src/legacyweapon.html:", err);
        }
        
        // Load armor from regalia maker.html
        try {
            const regaliaResponse = await fetch('./regalia maker.html');
            const regaliaText = await regaliaResponse.text();
            
            const regaliaMatch = regaliaText.match(/const regaliaTypes = \[([\s\S]*?)\];/);
            if (regaliaMatch) {
                const regaliaArray = new Function(`return [${regaliaMatch[1]}]`)();
                
                regaliaArray.forEach(regalia => {
                    // Categorize as armor if AC > 10 or has armor-like properties
                    if (regalia.ac > 10 || regalia.name.toLowerCase().includes('armor') || 
                        regalia.name.toLowerCase().includes('mail') || regalia.name.toLowerCase().includes('plate')) {
                        items.armor.push({
                            id: regalia.name.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
                            name: regalia.name,
                            description: `AC ${regalia.ac}. ${regalia.notes || ''}`.trim(),
                            type: 'armor',
                            rarity: regalia.value > 1000 ? 'Rare' : regalia.value > 100 ? 'Uncommon' : 'Common',
                            ac: regalia.ac,
                            value: regalia.value

                    }

            }

            console.log("Could not load regalia maker.html:", err);
        }

};

// A robust parser for the .orcbrew (EDN-like) format.
const parseOrcbrew = (text) => {
    let i = 0;
    text = text.replace(/;.*$/gm, '').replace(/[\n\r\t]/g, ' ').replace(/\s\s+/g, ' ').trim();
    
    function read_token() {
        let token = '';
        if (text[i] === '"') {
            i++; const start = i;
            while (text[i] !== '"' && i < text.length) i++;
            token = text.substring(start, i);
            i++;
        } else {
            const start = i;
            // Include # and () as delimiters but handle them properly
            while (i < text.length && !/[\s{}\[\]#()]/.test(text[i])) i++;
            token = text.substring(start, i);
        }
        return token;
    }
    
    function parse_value() {
        while (/\s/.test(text[i])) i++;
        if (i >= text.length) return null;
        
        const lookahead = text[i];
        if (lookahead === '{') return parse_object();
        if (lookahead === '[') return parse_array();
        if (lookahead === '#') return parse_set();
        if (lookahead === '(') return parse_special_form();
        
        const token = read_token();
        if (!isNaN(token) && token.trim() !== '') return Number(token);
        if (token === 'true') return true;
        if (token === 'false') return false;
        return token;
    }
    
    function parse_object() {
        const obj = {};
        i++; // Skip opening '{'
        while (i < text.length && text[i] !== '}') {
            while (i < text.length && (/\s/.test(text[i]) || text[i] === ',')) i++;
            if (i >= text.length || text[i] === '}') break;
            
            const key = parse_value();
            if (key === null || key === undefined) break;
            
            while (i < text.length && /\s/.test(text[i])) i++;
            if (i >= text.length) break;
            
            const val = parse_value();
            if (val !== null && val !== undefined) {
                if (typeof key === 'string' && key.startsWith(':')) {
                    obj[key.substring(1)] = val;
                } else {
                    obj[key] = val;
                }
            }
        }
        if (i < text.length && text[i] === '}') i++; // Skip closing '}'
        return obj;
    }
    
    function parse_array() {
        const arr = [];
        i++; // Skip opening '['
        let elementCount = 0;
        const MAX_ARRAY_ELEMENTS = 100000; // Reasonable limit to prevent memory issues
        
        while (i < text.length && text[i] !== ']') {
            while (i < text.length && /\s/.test(text[i])) i++;
            if (i >= text.length || text[i] === ']') break;
            
            // Check if we've exceeded reasonable limits
            if (elementCount >= MAX_ARRAY_ELEMENTS) {
                console.warn("Array parsing stopped at", elementCount, "elements to prevent memory issues");
                break;
            }
            
            const value = parse_value();
            if (value !== null && value !== undefined) {
                try {
                    arr.push(value);
                    elementCount++;
                } catch (e) {
                    console.warn("Failed to add element to array:", e.message);
                    break;
                }
            }
            while (i < text.length && /\s/.test(text[i])) i++;
        }
        if (i < text.length && text[i] === ']') i++; // Skip closing ']'
        return arr;
    }
    
    function parse_set() {
        i++; // Skip '#'
        if (text[i] === '{') {
            i++; // Skip '{'
            const arr = [];
            while (i < text.length && text[i] !== '}') {
                while (i < text.length && /\s/.test(text[i])) i++;
                if (i >= text.length || text[i] === '}') break;
                const value = parse_value();
                if (value !== null && value !== undefined) {
                    arr.push(value);
                }
                while (i < text.length && /\s/.test(text[i])) i++;
            }
            if (i < text.length && text[i] === '}') i++; // Skip closing '}'
            return arr;
        } else {
            // If it's not a set, just read the token after #
            return read_token();
        }
    }
    
    function parse_special_form() {
        i++; // Skip '('
        const arr = [];
        while (i < text.length && text[i] !== ')') {
            while (i < text.length && /\s/.test(text[i])) i++;
            if (i >= text.length || text[i] === ')') break;
            const value = parse_value();
            if (value !== null && value !== undefined) {
                arr.push(value);
            }
            while (i < text.length && /\s/.test(text[i])) i++;
        }
        if (i < text.length && text[i] === ')') i++; // Skip closing ')'
        // For special forms like (*:planar-transition*), return the content appropriately
        if (arr.length === 1) return arr[0];
        return arr;
    }

    try {
        return parse_value();
    } catch (e) {
        console.error("Failed to parse orcbrew text:", e);
        console.error("Parse position:", i, "Character:", text[i]);
        console.error("Context:", text.substring(Math.max(0, i-50), i+50));
        return { error: "Parsing failed." };
    }
};

// New parser for the HTML-based background/feat files
const parseHtmlData = (htmlString, type) => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(`<div>${htmlString}</div>`, 'text/html');
    const container = doc.querySelector('div');
    const results = {};
    const selector = type === 'background' ? '[id]' : '.feat-card';
    container.querySelectorAll(selector).forEach(elem => {
        if (type === 'background' && !elem.querySelector('h2')) return;
        const name = elem.querySelector('h2, h3')?.textContent.trim() || 'Unnamed';
        const id = type === 'background' ? elem.id : name.toLowerCase().replace(/[^a-z0-9]+/g, '-');
        const asiText = extractAsiTextFromElement(elem);
        results[id] = { id, name, type, asiText, html: elem.innerHTML };
    });
    return results;
};

// Parser for the custom JS object array format in backgrounds.txt
function parseCustomJsObjectArray(text) {
    const results = {};
    const arrayString = text.substring(text.indexOf('['), text.lastIndexOf(']') + 1);
    if (!arrayString) return results;

    try {
        const data = new Function(`return ${arrayString}`)();
        data.forEach(item => {
            if (item.type === 'background') {
                const parser = new DOMParser();
                const doc = parser.parseFromString(item.contentHTML, 'text/html');
                const asiText = extractAsiTextFromElement(doc);
                results[item.id] = {
                    id: item.id,
                    name: item.name,
                    type: 'background',
                    asiText,
                    html: item.contentHTML
                };
            }
        });
    } catch (e) {
        console.error("Could not parse background data:", e);
    }
    return results;
}

const normalizeAbilityStatKey = (stat) => {
    if (!stat) return null;
    const s = String(stat).trim().toUpperCase().replace(/[^A-Z]/g, '');
    if (s === 'STR' || s === 'DEX' || s === 'CON' || s === 'INT' || s === 'WIS' || s === 'CHA') return s;
    if (s === 'STRENGTH') return 'STR';
    if (s === 'DEXTERITY') return 'DEX';
    if (s === 'CONSTITUTION') return 'CON';
    if (s === 'INTELLIGENCE') return 'INT';
    if (s === 'WISDOM') return 'WIS';
    if (s === 'CHARISMA') return 'CHA';
    return null;
};

    <div className="bg-gray-700 p-4 rounded-lg text-center shadow-md w-full flex flex-col items-center justify-center">

                                    level: 1,

                                {

                                },
                                {

                                    level: 10,

                                },
                                {
                                    name: 'Cataclysmic Illumination',
                                    level: 14,
                                    description: '1/long rest: Cast radiant/necrotic power (proper conditions): DETONATION: Base damage dice maximized, area to 10ft radius. AFTERMATH: Fail save vs power, blinded (radiant) or stunned (necrotic) until end of next turn. CAUSAL SYPHON: Regain 10 Causal Points.'
                                }
                            ]
                        },
                        ...(luminancerData['orcpub.dnd.e5/subclasses'] || {}) 
                    },
                    spells: { 
                        // Don't override luminancer spells in fallback either
                        // Keep the individual spell objects too for compatibility  
                        ...Object.fromEntries(
                            Object.entries(luminancerData['orcpub.dnd.e5/spells'] || {})
                                .map(([key, spell]) => [key, [spell]])
                        )
                    },
                    backgrounds: backgroundsData,
                    feats: featsData,
                    items: { weapons: [], armor: [], tools: [], consumables: [] }
                });
            } finally {
                setIsLoading(false);
            }
        };
        
        loadAllData();
    }, []);
    
    const handleFileLoad = (event) => {
        const files = Array.from(event.target.files);
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const content = e.target.result;
                if (file.name.includes('background')) {
                    const data = parseCustomJsObjectArray(content);
                    setHomebrew(prev => ({ ...prev, backgrounds: { ...prev.backgrounds, ...data }}));
                } else if (file.name.includes('feat')) {
                    const data = parseHtmlData(content, 'feat');
                    setHomebrew(prev => ({ ...prev, feats: { ...prev.feats, ...data }}));
                } else {
                    const data = parseOrcbrew(content);
                    setHomebrew(prev => ({
                        races: { ...prev.races, ...(data['orcpub.dnd.e5/races'] || {}) },
                        classes: { ...prev.classes, ...(data['orcpub.dnd.e5/classes'] || {}) },
                        subclasses: { ...prev.subclasses, ...(data['orcpub.dnd.e5/subclasses'] || {}) },
                        spells: { ...prev.spells, ...(data['orcpub.dnd.e5/spells'] || {}) },
                    }));
                }
            };
            reader.readAsText(file);
        });
    };

    const updateCharacter = (key, value) => {
        setCharacter(prev => ({ ...prev, [key]: value }));
    };
    
    // Helper functions for character data access
    const getCharacterRace = (raceName, subraceName) => {
        if (!raceName) return null;
        const race = homebrew.races[raceName];
        if (!race) return null;
        if (subraceName && race.subraces && race.subraces[subraceName]) {
            return { ...race, ...race.subraces[subraceName] };
        }
        return race;
    };

    const getClassData = (className) => {
        if (!className) return null;
        return homebrew.classes[className.toLowerCase()] || homebrew.classes[className];
    };

    const getSubclassData = (className, subclassName) => {
        if (!className || !subclassName) return null;
        return homebrew.subclasses[subclassName.toLowerCase()] || homebrew.subclasses[subclassName];
    };

    const getBackgroundData = (backgroundName) => {
        if (!backgroundName) return null;
        return homebrew.backgrounds[backgroundName];
    };
    
    const getModifier = (score) => Math.floor((score - 10) / 2);

    const chosenClass = character.class ? homebrew.classes[character.class] : null;

    const steps = useMemo(() => {
        const flow = [
            { id: 'homebrew', name: 'Homebrew', component: HomebrewStep },
            { id: 'race', name: 'Race', component: RaceStep },
            { id: 'class', name: 'Class', component: ClassStep },
            { id: 'level', name: 'Level', component: LevelStep },
        ];
        if (chosenClass && character.level >= (chosenClass['subclass-level'] || chosenClass['subclassLevel'] || 99)) {
            flow.push({ id: 'subclass', name: 'Subclass', component: SubclassStep });
        }
        flow.push({ id: 'background', name: 'Background', component: BackgroundStep });
        flow.push({ id: 'feat', name: 'Feat', component: FeatStep });
        flow.push({ id: 'abilities', name: 'Abilities', component: AbilityScoreStep });
        flow.push({ id: 'equipment', name: 'Equipment', component: EquipmentStep }); // Add equipment step
        if (chosenClass && chosenClass.spellcasting) {
            flow.push({ id: 'powers', name: 'Powers', component: PowersStep });
        }
        flow.push({ id: 'export', name: 'Export', component: ExportStep });
        return flow;
    }, [character.level, chosenClass]);

    const nextStep = () => setStepIndex(i => Math.min(i + 1, steps.length - 1));
    const prevStep = () => setStepIndex(i => Math.max(i - 1, 0));

    const CurrentStepComponent = steps[stepIndex].component;

    const finalScores = useMemo(() => {
        const scores = { ...character.baseScores };
        const bonuses = {};
        const debugInfo = [];
        
        const addBonus = (stat, val) => {
            const key = normalizeAbilityStatKey(stat);
            if (!key) return;
            const n = Number(val);
            if (!Number.isFinite(n)) return;
            bonuses[key] = (bonuses[key] || 0) + n;
        };

        const selectedRace = homebrew.races[character.race];
        
        // Apply racial bonuses - check both .abilities (orcbrew format) and .abilityScores (parsed format)
        if(selectedRace?.abilities) {
            Object.entries(selectedRace.abilities).forEach(([key, val]) => {
                const rawStat = key.split('/').pop();
                const stat = normalizeAbilityStatKey(rawStat);
                debugInfo.push(`Racial: ${stat || String(rawStat).toUpperCase()} +${val}`);
                addBonus(rawStat, val);
            });
        } else if(selectedRace?.abilityScores) {
            Object.entries(selectedRace.abilityScores).forEach(([stat, val]) => {
                const normalized = normalizeAbilityStatKey(stat);
                debugInfo.push(`Racial: ${normalized || String(stat).toUpperCase()} +${val}`);
                addBonus(stat, val);
            });
        }
        
        const sources = [
            { source: homebrew.backgrounds[character.background], type: 'Background' },
            { source: homebrew.feats[character.feat], type: 'Feat' }
        ];
        sources.forEach(({ source, type }) => {
            const asiText = source?.asiText;
            if (!asiText) return;
            const lowered = String(asiText).toLowerCase();
            // Only auto-apply fixed ASIs. Choice-based ASIs are handled by `AsiChoices` + `asiChoices` state.
            if (lowered.includes('one of') || lowered.includes('or')) return;

            const fixed = parseFixedAbilityScoresFromText(asiText);
            Object.entries(fixed).forEach(([stat, val]) => {
                debugInfo.push(`${type}: ${stat} +${val}`);
                addBonus(stat, val);
            });
        });

        Object.values(character.asiChoices).forEach(choiceGroup => {
            Object.values(choiceGroup).forEach(choice => {
                if(choice.stat && choice.value) {
                    debugInfo.push(`ASI Choice: ${choice.stat} +${choice.value}`);
                    addBonus(choice.stat, choice.value);
                }
            });
        });

        // Apply any manual adjustments (kept separate from base scores)
        const manual = character.manualAbilityAdjustments || {};
        Object.entries(manual).forEach(([stat, val]) => {
            if (val) {
                const normalized = normalizeAbilityStatKey(stat);
                debugInfo.push(`Manual: ${normalized || String(stat).toUpperCase()} ${Number(val) >= 0 ? '+' : ''}${val}`);
                addBonus(stat, val);
            }
        });
        
        for(const stat in scores) {
            scores[stat] += (bonuses[stat] || 0);
        }
        
        // Store debug info for display
        scores._debugInfo = debugInfo;
        return scores;
    }, [character.baseScores, character.asiChoices, character.manualAbilityAdjustments, character.race, character.background, character.feat, homebrew]);

    // Character Save/Load Functions
    const saveCharacter = () => {
        try {
            const characterData = {
                character,
                finalScores,
                selectedEquipment,
                timestamp: new Date().toISOString(),
                version: '1.0'
            };
            
            const dataStr = JSON.stringify(characterData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            const safeName = (character.name || 'Character').replace(/[^a-z0-9]/gi, '_');
            link.href = url;
            link.download = `${safeName}_character.json`;
            link.click();
            
            URL.revokeObjectURL(url);
            console.log('Character saved successfully');
        } catch (error) {
            console.error('Save error:', error);
            alert(`Failed to save character: ${error.message}`);
        }
    };

    const loadCharacter = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const characterData = JSON.parse(e.target.result);
                setCharacter(characterData.character);
                alert(`Character "${characterData.character.name}" loaded successfully!`);
                console.log('Character loaded:', characterData);
            } catch (error) {
                console.error('Load error:', error);
                alert(`Failed to load character: ${error.message}`);
            }
        };
        reader.readAsText(file);
    };

    const quickSaveToLocalStorage = () => {
        try {
            const characterData = { character, finalScores, timestamp: new Date().toISOString() };
            localStorage.setItem('savedCharacter', JSON.stringify(characterData));
            alert('Character quick-saved to browser storage!');
        } catch (error) {
            alert(`Quick save failed: ${error.message}`);
        }
    };

    const quickLoadFromLocalStorage = () => {
        try {
            const saved = localStorage.getItem('savedCharacter');
            if (!saved) {
                alert('No saved character found in browser storage.');
                return;
            }
            const characterData = JSON.parse(saved);
            setCharacter(characterData.character);
            alert(`Character "${characterData.character.name}" quick-loaded!`);
        } catch (error) {
            alert(`Quick load failed: ${error.message}`);
        }
    };

    const createTestCharacter = () => {
        const testChar = {
            name: "Test Potentiator",
            level: 5,
            selectedClass: "Luminancer",
            selectedSubclass: "Potentiator",
            race: "Kittenfolk",
            subrace: "Umbral Tribe",
            background: "Hermit",
            baseScores: { STR: 8, DEX: 14, CON: 14, INT: 15, WIS: 12, CHA: 13 },
            powers: { cantrips: ["Light", "Mage Hand", "Minor Illusion"], leveled: ["Absorb Elements", "Detect Magic", "Shield", "Magic Missile", "Burning Hands"] },
            abilityScoreMethod: 'pointBuy',
            asiChoices: { race: {}, background: {}, feat: {} },
            equipment: []
        };
        setCharacter(testChar);
        alert('Test Level 5 Potentiator created! Go to Export step to download.');
    };

    console.log("App about to render, isLoading:", isLoading, "error:", error);
    console.log("Steps:", steps?.length, "CurrentStepComponent:", CurrentStepComponent?.name);
    console.log("Character:", character);
    console.log("Homebrew keys:", Object.keys(homebrew));

    if (error) {
        return (
            <div className="bg-red-900 text-white min-h-screen p-8 flex items-center justify-center">
                <div className="max-w-2xl text-center">
                    <h1 className="text-3xl font-bold mb-4">Character Creator Error</h1>
                    <p className="mb-4">There was an error loading the character creator:</p>
                    <pre className="bg-red-800 p-4 rounded mb-4 text-left">{error}</pre>
                    <button 
                        onClick={() => window.location.reload()} 
                        className="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded"
                    >
                        Reload Page
                    </button>
                </div>
            </div>
        );
    }

    return (
        <div className="bg-gray-900 text-white min-h-screen font-sans p-4 sm:p-8 flex flex-col items-center">
            <div className="w-full max-w-4xl">
                <header className="text-center mb-6">
                    <h1 className="text-4xl sm:text-5xl font-bold text-indigo-400">Guided Character Creator</h1>
                    <p className="text-gray-400 mt-2">Create your D&D character and export to an Avrae GSheet.</p>
                </header>
                
                {/* Character Save/Load Section */}
                <div className="bg-gray-700 border border-gray-600 p-4 rounded-lg mb-6">
                    <div className="flex flex-wrap gap-2 justify-center">
                        <button onClick={createTestCharacter} className="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded text-sm">
                            🧪 Create Test L5 Potentiator
                        </button>
                        <button onClick={quickSaveToLocalStorage} className="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded text-sm">
                            💾 Quick Save
                        </button>
                        <button onClick={quickLoadFromLocalStorage} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded text-sm">
                            📂 Quick Load
                        </button>
                        <button onClick={saveCharacter} className="bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 px-4 rounded text-sm">
                            💾 Save to File
                        </button>
                        <label className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded text-sm cursor-pointer">
                            📁 Load from File
                            <input type="file" accept=".json" onChange={loadCharacter} className="hidden" />
                        </label>
                    </div>
                    <p className="text-gray-400 text-xs text-center mt-2">Quick Save/Load uses browser storage. File Save/Load downloads/uploads JSON files.</p>
                </div>
                {!isLoading && <StepIndicator steps={steps} currentStep={stepIndex + 1} />}
                <main className="bg-gray-800 p-6 sm:p-8 rounded-xl shadow-2xl border border-gray-700">
                    {isLoading ? (
                        <div className="text-center text-xl">Loading Homebrew...</div>
                    ) : CurrentStepComponent ? (
                        <CurrentStepComponent 
                            onNext={nextStep} 
                            onBack={prevStep} 
                            homebrew={homebrew} 
                            character={character} 
                            updateCharacter={updateCharacter} 
                            getModifier={getModifier} 
                            finalScores={finalScores}
                        />
                    ) : (
                        <div className="text-center text-xl text-red-400">
                            Error: Step component not found for step {stepIndex}
                        </div>
                    )}
                </main>
            </div>
        </div>
    );
}

        <div className="flex justify-end">
            <button onClick={onNext} className="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg">Start Character Creation</button>
        </div>
    </div>

const RaceStep = ({ onNext, onBack, homebrew, character, updateCharacter }) => {
    const selectedRace = character.race ? homebrew.races[character.race] : null;
    const selectedSubrace = character.subrace && selectedRace ? selectedRace.subraces?.[character.subrace] : null;
