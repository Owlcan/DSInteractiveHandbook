    }

    }
    
    h1 {

        color: #b47018; /* Accent color from handbook */
        font-family: 'Cormorant Garamond', serif;

        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        position: relative;
    }
    
    h1::after {
        content: "";
        display: block;
        width: 80%;
        height: 3px;
        background: linear-gradient(to right, transparent, #daac17, transparent);
        margin: 10px auto;
    }
    
    .monster-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
    }
    
    .monster-item {
        padding: 10px;
        background-color: #1E1C12; /* Parchment dark from handbook */
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.2s;
        color: #c7a81d; /* Ink color from handbook */
    }
    
    .monster-item:hover {
        background-color: #97740a; /* Gold dark from handbook */
        color: #2C2614; /* Parchment color from handbook */
    }
    
    .monster-item.selected {
        background-color: #daac17; /* Gold from handbook */
        color: #1E1C12; /* Parchment dark from handbook */
    }
    
    .monster-details {
        border: 1px solid #8f770d; /* Ink2 from handbook */
        padding: 20px;
        border-radius: 5px;
    }
    
    .monster-image-container {
        text-align: center;
        margin-bottom: 15px;
    }
    
    .monster-image {
        max-width: 100%;
        max-height: 300px;
        border: 3px solid #daac17; /* Gold from handbook */
        border-radius: 5px;
        background-color: #1E1C12; /* Parchment dark */
    }
    
    .monster-stats {
        margin-bottom: 20px;
        text-align: center;
    }
    
    .stat-block {
        display: flex;
        justify-content: space-between;
        max-width: 600px;
    }
    
    .stat {
        text-align: center;
        margin-right: 10px;
    }
    
    .stat-name {
        font-weight: bold;
        text-align: center;
    }
    
    .stat-value {
        font-size: 1.2em;
    }
    
    .abilities, .actions {
        margin-top: 20px;
    }
    
    .ability, .action {
        margin-bottom: 10px;
        padding: 10px;
        background-color: #1E1C12; /* Parchment dark from handbook */
        border-radius: 5px;
    }
    
    .ability-name, .action-name {
        font-weight: bold;
        margin-bottom: 5px;
        color: #b47018; /* Accent color from handbook */
    }
    
    .action {
        cursor: pointer;
        transition: background-color 0.2s;
    }
    
    .action:hover {
        background-color: #2C2614; /* Slightly lighter parchment */
    }
    
    .action:hover .action-name:after {
        content: " 🎲";
    }
    
    .dice-result {
        margin-top: 20px;
        padding: 15px;
        background-color: #1E1C12;
        border-radius: 5px;
        border-left: 5px solid #daac17;
        font-size: 1.2em;
    }
    
    .hidden {
        display: none;
    }
    
    .dice-breakdown {
        font-size: 0.8em;
        color: #8f770d; /* Ink2 color from handbook */
        margin-top: 5px;
    }
    
    .click-hint {
        font-style: italic;
        color: #daac17; /* Gold from handbook */
        margin-bottom: 10px;
    }
    
    .randomize-btn {
        padding: 12px 25px;
        background: linear-gradient(to bottom, #fae791, #daac17); /* Gold light to gold */
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 18px;
        font-family: 'MedievalSharp', cursive;
        color: #8f770d; /* Ink2 from handbook */
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;
    }
    
    .randomize-btn:hover {
        background: linear-gradient(to bottom, #daac17, #97740a); /* Gold to gold dark */
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
    }
    
    /* Add scrollbar styling to match the handbook */

        width: 10px;
    }
    
    ::-webkit-scrollbar-track {
        background: #1E1C12; /* Parchment dark */
    }
    
    ::-webkit-scrollbar-thumb {
        background: #97740a; /* Gold dark */

    }

        background: #daac17; /* Gold */

        flex-direction: column;

        align-items: center;
        justify-content: center;
        margin-bottom: 3px;

    .attack-name {

        color: #daac17;

    .attack-description {
        margin-bottom: 8px;
    }

        border-radius: 3px;
        cursor: pointer;

    }

        border-radius: 3px;

    .ability-item {

    }
    
    .ability-title {
        font-weight: bold;
        margin-bottom: 3px;
    }

        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 25px;
        margin-top: 20px;
        justify-content: center; /* Center the grid */
    }

    .monster-grid.few-cards {
        grid-template-columns: repeat(auto-fit, minmax(350px, 400px)); /* Auto-fit with fixed width */
        justify-content: center;
    }
    
    /* For when there is only 1 card */
    .monster-grid.single-card {
        grid-template-columns: minmax(350px, 400px);
        justify-content: center;
    }

    @media (max-width: 1500px) {
        .monster-grid {
            grid-template-columns: repeat(3, 1fr); /* 3 columns on medium screens */
        }
    }

    @media (max-width: 1100px) {
        .monster-grid {
            grid-template-columns: repeat(2, 1fr); /* 2 columns on smaller screens */
        }
    }

    @media (max-width: 700px) {
        .monster-grid {
            grid-template-columns: 1fr; /* 1 column on mobile */
        }

        border-color: #daac17;
        box-shadow: 0 0 5px rgba(218, 172, 23, 0.5);
    }
    
    .no-results {
        text-align: center;
        padding: 20px;
        grid-column: 1 / -1;
        font-size: 1.2em;
        color: #daac17;
    }

                const children = Array.from(node.childNodes);

                if (!Number.isFinite(n)) continue;
                total += sign * n;
                matchedSomething = true;

            if (!matchedSomething || !Number.isFinite(total)) return null;
            return Math.max(0, Math.floor(total));

            addJoin(tokensMorphed);

            // remove common leading qualifiers and generate again
            const dropList = new Set(['the','of','dark','darkling','darkforme','darkform','dimension','variant','tiny','small','medium','large','huge','gargantuan','specialist']);
            const tokensNoQual = tokens.filter(t => !dropList.has(t));
            const tokensAliasedNoQual = tokensAliased.filter(t => !dropList.has(t));
            const tokensNoQualSing = tokensNoQual.map(singularizeToken).map(morphToken);
            const tokensAliasedNoQualSing = tokensAliasedNoQual.map(singularizeToken).map(morphToken);
            addJoin(tokensNoQual);
            addJoin(tokensAliasedNoQual);
            addJoin(tokensNoQualSing);
            addJoin(tokensAliasedNoQualSing);

            // Prefix with 'dark' after removing qualifiers (e.g., dark + punishment + maid -> darkpunishmentmaid)
            if (tokensNoQual.length) addJoin(['dark', ...tokensNoQual]);
            if (tokensAliasedNoQual.length) addJoin(['dark', ...tokensAliasedNoQual]);
            if (tokensNoQualSing.length) addJoin(['dark', ...tokensNoQualSing]);
            if (tokensAliasedNoQualSing.length) addJoin(['dark', ...tokensAliasedNoQualSing]);

            // Reorder helpers: move 'darkling' before 'slime' and/or to the front
            const reorderForDarkling = (arr) => {
                const copy = [...arr];
                const iDarkling = copy.indexOf('darkling');
                if (iDarkling > 0) { // move darkling to front
                    copy.splice(iDarkling,1);
                    copy.unshift('darkling');
                }
                return copy;
            };
            const ensureDarklingBeforeSlime = (arr) => {
                const copy = [...arr];
                const iD = copy.indexOf('darkling');
                const iS = copy.indexOf('slime');
                if (iD >= 0 && iS >= 0 && iD > iS) {
                    // swap positions so darkling comes before slime
                    copy.splice(iD,1);
                    copy.splice(iS,0,'darkling');
                }
                return copy;
            };

            // Generate reordered joins (including originals to preserve qualifiers when useful)
            addJoin(reorderForDarkling(tokens));
            addJoin(ensureDarklingBeforeSlime(tokens));
            addJoin(reorderForDarkling(tokensNoQual));
            addJoin(ensureDarklingBeforeSlime(tokensNoQual));
            addJoin(reorderForDarkling(tokensAliasedNoQual));
            addJoin(ensureDarklingBeforeSlime(tokensAliasedNoQual));

            // Size-aware ordering: place size first, then darkling, then optional cuboid, then slime
            const sizeSet = new Set(['tiny','small','medium','large','huge','gargantuan']);
            const presentSizes = tokens.filter(t => sizeSet.has(t));
            const hasDarkling = tokens.includes('darkling');
            const hasSlime = tokens.includes('slime');
            const hasCuboid = tokens.includes('cuboid');
            if (presentSizes.length && hasDarkling && hasSlime) {
                for (const sz of presentSizes) {
                    if (hasCuboid) addJoin([sz, 'darkling', 'cuboid', 'slime']);
                    addJoin([sz, 'darkling', 'slime']);
                }
            }
            // Cuboid combo without explicit size: darkling cuboid slime
            if (!presentSizes.length && hasDarkling && hasSlime && hasCuboid) {
                addJoin(['darkling','cuboid','slime']);
            }

            // tail-heavy joins (last two or last one significant tokens)
            if (tokens.length >= 2) addJoin(tokens.slice(-2));
            if (tokensAliased.length >= 2) addJoin(tokensAliased.slice(-2));
            if (tokens.length >= 1) addJoin(tokens.slice(-1));
            if (tokensAliased.length >= 1) addJoin(tokensAliased.slice(-1));

            // single significant tokens length >= 5
            tokens.filter(t => t.length >= 5).forEach(t => joins.add(t));
            tokensAliased.filter(t => t.length >= 5).forEach(t => joins.add(t));

            // compressed forms (no separators)
            if (tokens.length) {
                joins.add(tokens.join(''));
                joins.add(['dark', ...tokens].join(''));
            }
            if (tokensAliased.length) {
                joins.add(tokensAliased.join(''));
                joins.add(['dark', ...tokensAliased].join(''));
            }
            if (tokensSing.length) {
                joins.add(tokensSing.join(''));
                joins.add(['dark', ...tokensSing].join(''));
            }
            if (tokensAliasedSing.length) {
                joins.add(tokensAliasedSing.join(''));
                joins.add(['dark', ...tokensAliasedSing].join(''));
            }
            if (tokensMorphed.length) {
                joins.add(tokensMorphed.join(''));
                joins.add(['dark', ...tokensMorphed].join(''));
            }
            if (tokensNoQual.length) {
                joins.add(tokensNoQual.join(''));
                joins.add(['dark', ...tokensNoQual].join(''));
            }
            if (tokensAliasedNoQual.length) {
                joins.add(tokensAliasedNoQual.join(''));
                joins.add(['dark', ...tokensAliasedNoQual].join(''));
            }
            if (tokensNoQualSing.length) {
                joins.add(tokensNoQualSing.join(''));
                joins.add(['dark', ...tokensNoQualSing].join(''));
            }
            if (tokensAliasedNoQualSing.length) {
                joins.add(tokensAliasedNoQualSing.join(''));
                joins.add(['dark', ...tokensAliasedNoQualSing].join(''));
            }

            return Array.from(joins).filter(Boolean);
        }

        function buildCandidatePaths(name) {
            const base = normalizeName(name);
            const tokens = base.split(/\s+/).filter(Boolean);
            const stems = tokenVariants(tokens);
            const paths = [];

            // Expand with targeted fixes for known patterns
            const expansions = new Set();
            stems.forEach(s => {
                // Ensure riverlurk compressed variant exists
                if (/river[\-_ ]?lurk/.test(s)) expansions.add(s.replace(/river[\-_ ]?lurk/, 'riverlurk'));
                // Punishment maid compressed + dark prefix
                if (s.includes('punishment') && s.includes('maid')) expansions.add('darkpunishmentmaid');
                // Insert 'slime' after darkling if missing (e.g., darkling + cube princess -> darklingslimecubeprincess)
                if (s.includes('darkling') && !/darkling[\-_ ]?slime/.test(s)) {
                    expansions.add(s.replace('darkling', 'darklingslime'));
                }
                // boi/boy alternates (e.g., big boi vs big boy)
                if (s.includes('boi')) expansions.add(s.replace('boi','boy'));
                if (s.includes('boy')) expansions.add(s.replace('boy','boi'));
                // drop size adjectives that may still be present in stems to catch files that omit them
                expansions.add(s.replace(/\b(tiny|small|medium|large|huge|gargantuan)\b/g, '').replace(/[^a-z0-9]+/g,''));

                // Detention Professor variants: drop 'specialist'; pluralize weapon/mage/magic to match filenames
                if (s.includes('specialist')) {
                    const noSpec = s.replace(/specialist/g, '');
                    expansions.add(noSpec);
                    expansions.add(noSpec.replace(/[^a-z0-9]+/g,''));
                }
                if (/(^|[^a-z])weapon(s)?([^a-z]|$)/.test(s)) {
                    const plural = s.replace(/weapon(?!s)/g, 'weapons');
                    expansions.add(plural);
                    expansions.add(plural.replace(/[^a-z0-9]+/g,''));
                }
                if (/(^|[^a-z])mage([^a-z]|$)/.test(s)) {
                    const magic = s.replace(/mage/g, 'magic');
                    const magics = magic.replace(/magic/g, 'magics');
                    expansions.add(magic);
                    expansions.add(magics);
                    expansions.add(magic.replace(/[^a-z0-9]+/g,''));
                    expansions.add(magics.replace(/[^a-z0-9]+/g,''));
                }
                if (/(^|[^a-z])magic([^a-z]|$)/.test(s)) {
                    const magics2 = s.replace(/magic/g, 'magics');
                    expansions.add(magics2);
                    expansions.add(magics2.replace(/[^a-z0-9]+/g,''));
                }

                // Allow 'dark' prefix to match filenames that use 'darkforme'
                if (/^dark[a-z]/.test(s)) {
                    expansions.add(s.replace(/^dark/, 'darkforme'));
                }

                // Plural → singular special-cases for court titles
                if (s.includes('viscounts')) expansions.add(s.replace(/viscounts/g, 'viscount'));
                if (s.includes('baronesses')) expansions.add(s.replace(/baronesses/g, 'baroness'));
                if (s.includes('jesters')) expansions.add(s.replace(/jesters/g, 'jester'));
                // Morphology: disciplinary → discipline
                if (s.includes('disciplinary')) expansions.add(s.replace(/disciplinary/g, 'discipline'));
            });
            const allStems = Array.from(new Set([...stems, ...expansions]));

            for (const baseDir of IMAGE_BASE_DIRS) {
                for (const stem of allStems) {
                    for (const ext of IMAGE_EXTS) {
                        paths.push(encodeURI(baseDir + stem + ext));
                    }
                }
            }
            return paths;
        }

    function preload(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(src);
                img.onerror = () => reject(src);
                img.src = src;
            });
        }

        async function resolveLocalImageByName(name) {
            if (!name) return null;
            if (imageCache.has(name)) return imageCache.get(name);

            // 0) Check overrides first
            const override = IMAGE_NAME_OVERRIDES.get(name);
            if (override) {
                // Support both bare filenames and full relative paths in overrides.
                const overrideCandidates = [];
                if (override.includes('/')) {
                    overrideCandidates.push(encodeURI(override));
                } else {
                    for (const baseDir of IMAGE_BASE_DIRS) {
                        overrideCandidates.push(encodeURI(baseDir + override));
                    }
                }

                for (const src of overrideCandidates) {
                    try {
                        await preload(src);
                        if (DEBUG_IMG) console.debug('[IMG] Override hit', name, '->', src);
                        imageCache.set(name, src);
                        return src;
                    } catch (_) { /* try next */ }
                }
            }

            const candidates = buildCandidatePaths(name);
            if (DEBUG_IMG) {
                console.debug('[IMG] Resolving', name, 'candidates (first 20):', candidates.slice(0,20));
            }
            for (const c of candidates) {
                try {
                    await preload(c);
                    if (DEBUG_IMG) console.debug('[IMG] Resolved', name, '->', c);
                    imageCache.set(name, c);
                    return c;
                } catch (_) { /* try next */ }
            }
            if (DEBUG_IMG) console.warn('[IMG] No local image resolved for', name);
            imageCache.set(name, null);
            return null;
        }

        async function setMonsterImage(imgEl, monster) {
            // Prefer local by name first; then explicit imageUrl; finally placeholder
            const placeholder = 'https://via.placeholder.com/300x200?text=No+Image';
            imgEl.src = placeholder;

            // 1) Try local match by name
            const localSrc = await resolveLocalImageByName(monster?.name);
            if (localSrc) {
                imgEl.src = localSrc;
                return;
            }

            // 2) Try explicit imageUrl if present and reachable
            const explicit = monster?.flavor?.imageUrl;
            if (explicit) {
                try {
                    const ok = await preload(explicit);
                    imgEl.src = ok;
                    return;
                } catch (_) { /* fall through to placeholder */ }
            }
            // 3) Placeholder already set
        }
    </script>
