            // New corridor additions
            { value: { cr: 2, name: "Steam Vent Burst", description: "A magitech steam line hisses, then vents scalding vapor down the hall.<br><br><b>Mechanics:</b> Creatures in a 20 ft line make DC 13 Dexterity saves or take 1d4 fire damage and are blinded until the end of their next turn; success halves and negates blind. Disabling the valve (DC 14 Tools) stops future bursts." }, weight: 1 },
            { value: { cr: 3, name: "Detention Net Drop", description: "A ceiling rack snaps, dropping a runic detention net.<br><br><b>Mechanics:</b> DC 14 Dexterity save or restrained; a creature can cut free (AC 12, 10 HP) or make DC 14 Strength (Athletics) to escape as an action." }, weight: 1 },
            { value: { cr: 4, name: "Detention Professor (Melee) Corridor Drill", description: "The melee Detention Professor calls for 'form and focus', a brisk corridor drill with restraint practice.<br><br><b>Foes:</b> 1 Detention Professor (melee).<br><b>Hostility:</b> Hostile if you refuse, flee, or attack; otherwise it runs the drill as a 'lesson'.<br><br><b>Mechanics:</b> A creature can comply: best-of-3 DC 14 checks (Strength (Athletics) or Dexterity (Acrobatics)). On success, earn a minor 'Gold Star' boon (+1 to a single Strength/Dexterity check later here); on failure, you're briefly bound (escape DC 13 Strength) and take 1 nonlethal bludgeoning. <b>Defuse:</b> DC 14 Charisma (Persuasion) to present a self-directed exercise plan; success averts the drill without combat." }, weight: 0.9 },
            { value: { cr: 4, name: "Detention Professor (Magic) Calibration Walk", description: "The magic Detention Professor paces a humming rune-stick, insisting on 'responsible casting' in the hall.<br><br><b>Foes:</b> 1 Detention Professor (magic).<br><b>Hostility:</b> Hostile if you interfere, refuse the calibration, or attack; otherwise it treats this as instruction first, restraint second.<br><br><b>Mechanics:</b> Spell attacks made within 10 ft are at disadvantage while the calibration hums. <b>Assist/Defuse:</b> DC 14 Intelligence (Arcana) to help re-tune it, ending the hum for 10 minutes and granting +1 on the next Arcana/Tools check here; failure by 5+ pops for 1d4 lightning to the assister." }, weight: 0.85 },
            { value: { cr: 2, name: "Mirror Pane Doppel", description: "A warped pane casts a living reflection that mimics the front-most creature with half potency.<br><br><b>Mechanics:</b> DC 14 Wisdom save to resist the doppel. On failure, the Reflection acts on initiative 10 with basic attacks at disadvantage; breaking the pane (AC 12, 8 HP) ends it." }, weight: 0.8 },
            { value: { cr: 1, name: "Shifting Stair", description: "Steps stretch and compact unpredictably.<br><br><b>Mechanics:</b> Climbing requires DC 12 Dexterity (Acrobatics); failure slides the creature 10 ft back and prone. A secured rope grants advantage." }, weight: 1 },
            { value: { cr: 3, name: "Confiscation Checkpoint", description: "A Dark Dimension Infiltrator and a Vanguard rig a mobile confiscation gate across the hall, scanners humming.<br><br><b>Foes:</b> 1 Dark Dimension Infiltrator + 1 Dark Dimension Vanguard.<br><b>Hostility:</b> Hostile if you refuse inspection, attack, or tamper with the gate; otherwise they attempt to disarm and confiscate.<br><br><b>Checks:</b> DC 14 Charisma (Deception) to pass; DC 15 Dexterity (Sleight of Hand) to conceal contraband. Failure: lose 1d3 items tagged as 'confiscated' or provoke the checkpoint to lock down." }, weight: 1.2 },
            { value: { cr: 2, name: "Mana Leak", description: "A conduit leak thins magic briefly.<br><br><b>Mechanics:</b> For 1 minute, spell attacks have disadvantage within 20 ft; DC 14 Intelligence (Arcana) can patch the leak for 10 minutes, restoring normal values." }, weight: 0.9 },
            { value: { cr: 2, name: "Ghostiby Book Runner", description: "A Darkling-Ghostiby dashes past, juggling tomes it 'borrowed'.<br><br><b>Foes:</b> 1 Ghostiby (mischief only).<br><b>Hostility:</b> Non-hostile unless attacked or grabbed; treats this as a prank run.<br><br><b>Options:</b> DC 13 Dexterity (Sleight of Hand) to snatch a book (random minor scroll); DC 12 Charisma (Performance) to amuse it and get a harmless giggle-curse boon (+1 to next save).", nonCombat: true }, weight: 0.7 },
            { value: { cr: 4, name: "Darkforged Maintenance Crew", description: "Two Darkforged Remnants weld a plate while a third watches.<br><br><b>Foes:</b> 3 Darkforged Remnants (mix of Brute/Bulwark/Lash/Spike).<br><b>Hostility:</b> Hostile if you approach within 10 ft or interfere with the welding node.<br><br><b>Mechanics:</b> Approaching within 10 ft triggers a warning pulse (DC 13 Wisdom save or frightened until end of next turn). Disabling the welding node (AC 13, 12 HP) draws their attention." }, weight: 0.8 },
            { value: { cr: 3, name: "Arcane Draft", description: "A corridor cross-breeze shuffles papers into legible, pleading messages.<br><br><b>Mechanics:</b> Reading grants a clue; DC 13 Wisdom (Insight) to glean useful route info (advantage on next Navigation-type decision).", nonCombat: true }, weight: 0.9 },
            { value: { cr: 2, name: "Weirdling Lantern Moths", description: "Luminous moths cluster and follow warmth.<br><br><b>Mechanics:</b> DC 12 Wisdom (Animal Handling) to guide them away; success grants dim-light advantage on next Perception in this corridor; failure draws a curious Lurker in 1d4 rounds." }, weight: 0.9 },

            // Light, non-combat corridor set pieces (minor fun / hazards)
            { value: { cr: 0.5, name: "Runaway Study Cart (Non-Combat)", description: "A squeaky study cart barrels down the corridor piled high with textbooks.<br><br><b>Mechanics:</b> DC 12 Dexterity save or be jostled for 1 bludgeoning and pushed 5 ft; success steps aside. DC 12 Dexterity (Sleight of Hand) to snag a drifting pamphlet (flavor clue or minor +1 on next Investigation).", nonCombat: true }, weight: 1.2 },
            { value: { cr: 0, name: "Mischief Bell String (Non-Combat)", description: "A hair-thin string of tiny bells crosses at ankle height.<br><br><b>Mechanics:</b> DC 13 Wisdom (Perception) to notice; DC 13 Dexterity (Thieves' Tools) to unhook silently. On trigger, jingling imposes disadvantage on Stealth checks here for 10 minutes and may draw a patrolling Auditor at DM discretion.", nonCombat: true }, weight: 1.1 },
            { value: { cr: 0.5, name: "Hopscotch Glyphs", description: "Chalk glyphs paint a hopscotch path that pulses faintly.<br><br><b>Mechanics:</b> A creature can attempt the pattern (DC 13 Dexterity (Acrobatics)): success grants +1 on next Dexterity-based check; failure produces a harmless spark-pop (1 lightning, no ongoing effect).", nonCombat: true }, weight: 1 },
            { value: { cr: 0.25, name: "Ooze Hammock", description: "A sagging, benign ooze forms a hammock between lockers. It wobbles invitingly.<br><br><b>Mechanics:</b> Resting in it requires DC 12 Constitution save; on failure, sticky residue halves speed for 1 minute; on success, gain a minor comfort boon (+1 on next saving throw).", nonCombat: true }, weight: 0.8 },
            { value: { cr: 0, name: "Vending Rune Kiosk (Non-Combat)", description: "A humming kiosk offers 'Student Refreshments'. The runes accept coins, buttons, or compliments.<br><br><b>Mechanics:</b> Spend a trivial token to receive a random trinket (DM's table) or a one-use +1 to a single check within the next hour (flavor). Tampering (DC 14 Tools) risks a zap (1d4 lightning).", nonCombat: true }, weight: 0.9 },

            // Another round of minor corridor moments
            { value: { cr: 0, name: "Paper Wing Swarm (Non-Combat)", description: "Folded paper birds spiral on a dust devil of stale air.<br><br><b>Mechanics:</b> DC 12 Dexterity (Acrobatics) to move through without distraction; success grants +1 on your next Initiative in this corridor; failure imposes disadvantage on your next Perception here (rustling).", nonCombat: true }, weight: 0.9 },
            { value: { cr: 0.25, name: "Wayfinding Echo Markers", description: "Subtle pressure plates echo your steps with a half-second delay.<br><br><b>Mechanics:</b> DC 13 Wisdom (Perception) to notice and step lightly; until disabled (DC 13 Tools), Stealth checks in this stretch are at disadvantage due to the echo." }, weight: 0.8 },
            { value: { cr: 0, name: "Custodian's 'Wet Floor' Illusion", description: "A persistent glamor paints a glossy 'wet' sheen on stone.<br><br><b>Mechanics:</b> DC 12 Intelligence (Investigation) to see it's harmless; hurrying creatures must make DC 12 Dexterity saves or hesitate (lose 5 ft of movement) from caution.", nonCombat: true }, weight: 0.8 },
            { value: { cr: 0, name: "Whisper Lockers (Non-Combat)", description: "Lockers murmur gossip; offering a harmless secret hushes them.<br><br><b>Mechanics:</b> Share a small truth to gain +1 on your next Insight here; refusing imposes disadvantage on your next Persuasion in this corridor (they tattle).", nonCombat: true }, weight: 0.7 },
            { value: { cr: 0.5, name: "Sliding Wall Panel", description: "A wall panel shunts slowly across the hall.<br><br><b>Mechanics:</b> DC 13 Strength (Athletics) to wedge or DC 13 Tools to jam its track; failure squeezes a creature for 1 bludgeoning and halves speed for 1 minute (stiff)." }, weight: 0.7 },
            { value: { cr: 0, name: "Vending Rune Kiosk ,  Diaper Discounter (Non-Combat)", description: "A blinking kiosk labeled Personal Care rattles to life. Its price tables are obviously decades out of date. It lists a Magidiaper +3 for only 100 gp, with 1d3 in stock.<br><br><b>Mechanics:</b> A creature may purchase a Magidiaper +3 for 100 gp each (roll 1d3 for available stock). DC 13 Intelligence (Investigation) notices the outdated pricing. Attempting to access admin settings (DC 14 Tools or Intelligence (Arcana)) on success restores hard access to the vendor server, discounted items are removed and the kiosk refreshes with 3 standard health potions available at the normal selling price (DM's prevailing rate). On failure, it shocks the user for 1d4 lightning and locks the kiosk for 10 minutes.", nonCombat: true }, weight: 0.7 },

            // --- MID-LEVEL HOSTILE ENCOUNTERS (CR 3""4) ---
            { value: { cr: 3, name: "Ceiling Lurker Trip-Line", description: "A chalk-fine trip-line is stretched across the corridor, meant to make you look down while the ceiling looks back.<br><br><b>Foes:</b> 3 Darkling Lurkers.<br><b>Hostility:</b> Hostile on sight; they drop the moment the first creature crosses the line.<br><br><b>Mechanics:</b> DC 14 Wisdom (Perception) to spot the line and the lurkers. On failure, the first drop attack has advantage." }, weight: 0.95 },
            { value: { cr: 3, name: "Slurper Wall-Crawl (Restraint Pair)", description: "Tongues taste the air from both walls as slurpers advance in sync, trying to pin the frontliner and reel them into a corner.<br><br><b>Foes:</b> 2 Darkling Slurpers + 1 Darkling Lurker (ceiling finisher).<br><b>Hostility:</b> Hostile on sight; the slurpers open with tongues immediately when the party enters the run.<br><br><b>Mechanics:</b> Tongues: AC 12, 3 HP to sever; restrained targets can attempt DC 13 Strength to break free (action)." }, weight: 0.9 },
            { value: { cr: 4, name: "Caller With Slurper Screen", description: "A Caller keeps to the back, keening timing cues while slurpers form the 'hands' of the ambush.<br><br><b>Foes:</b> 1 Darkling Caller + 3 Darkling Slurpers.<br><b>Hostility:</b> Hostile on sight; if the Caller survives until end of round 2, it starts drawing additional noise attention (DM discretion).<br><br><b>Mechanics:</b> DC 14 Intelligence (Arcana) (action) to disrupt the keening rhythm; success gives slurpers disadvantage on their next tongue attacks." }, weight: 0.8 },
            { value: { cr: 3, name: "Hall Monitor Citation Pair (Aggressive)", description: "Two Hall Monitors patrol shoulder-to-shoulder, rods out and ready. They're not asking questions, they're writing outcomes.<br><br><b>Foes:</b> 2 Hall Monitors.<br><b>Hostility:</b> Hostile if they see you without a pass or if you do not stop when ordered; they attempt restraints first, then beatdowns." }, weight: 0.85 },
            { value: { cr: 4, name: "Auditor Warrant Sweep", description: "Auditors move in a practiced triangle, reciting violations while a Monitor anchors the line. They're here to seize 'contraband', including you.<br><br><b>Foes:</b> 3 Auditors + 1 Hall Monitor.<br><b>Hostility:</b> Hostile on sight unless a creature immediately presents credible paperwork (DC 15 Charisma (Deception/Persuasion), DM adjudicates)." }, weight: 0.75 },
            { value: { cr: 3, name: "Infiltrator Cross-Hall Snare", description: "A force-filament snare is pre-set to catch anyone who dashes the corridor. Two Infiltrators wait for the bind, then strike from cover.<br><br><b>Foes:</b> 2 Infiltrators.<br><b>Hostility:</b> Hostile on sight; they spring the snare as soon as the party commits to the corridor.<br><br><b>Mechanics:</b> First creature to move more than 20 ft in a turn makes a DC 14 Dexterity save or is restrained (escape DC 14 Strength)." }, weight: 0.85 },
            { value: { cr: 4, name: "Darkforged Clamp Team", description: "A clamp-and-weld team blocks the hallway with heavy tools and a humming brace. They treat trespassers as 'obstructions'.<br><br><b>Foes:</b> 3 Darkforged Remnants.<br><b>Hostility:</b> Hostile if you approach within 20 ft or attempt to pass through their work zone." }, weight: 0.75 },
            { value: { cr: 3, name: "Custodial Cube + Slime Feeders", description: "A custodian cube trundles forward while small slimes 'herd' prey into its cleaning path.<br><br><b>Foes:</b> 1 Custodial Cube + 6 Small Darkling Slimes.<br><b>Hostility:</b> Hostile on sight; the slimes try to slow you so the cube can engulf.<br><br><b>Mechanics:</b> Foam/slick squares count as difficult terrain; DC 13 Dexterity to avoid being shoved into the cube's lane (DM discretion)." }, weight: 0.7 },
            { value: { cr: 4, name: "Grief-Stone Nerve Break (With Predators)", description: "A grief-stone pulse hits like a sudden bad memory, and ceiling hunters have learned to strike on the hesitation.<br><br><b>Foes:</b> 2 Darkling Lurkers + 2 Darkling Paralurkers.<br><b>Hostility:</b> Hostile on sight; they attack the first creature that fails the save.<br><br><b>Mechanics:</b> Creatures within 20 ft make a DC 14 Wisdom save on entry; on failure, disadvantage on their first roll this scene." }, weight: 0.65 },

            // --- MAJOR GROUP ENCOUNTERS (CR 5+) ---
            // These are larger, more exigent versions of cellarway threats; many include activity scenes or faction clashes.
            { value: { cr: 5, name: "Darkling Slime Stampede", description: "A wave of darkling slimes rolls down the corridor in a single, hungry mass, more like a flood than a skirmish.<br><br><b>Foes:</b> 12 Darkling Slimes (moving as one stampede).<br><b>Hostility:</b> Hostile if you block the lane, strike them, or move within 10 ft; otherwise they try to surge past and dissolve whatever they touch.<br><br><b>Mechanics:</b> The corridor becomes difficult terrain. Each round, creatures in the main lane make a DC 14 Dexterity save or are knocked prone and take 1d4 acid damage. <b>Option:</b> DC 14 Intelligence (Nature) or DC 14 Intelligence (Arcana) to identify a repellent (bright light + cold); applying it (action) grants advantage on the next save against the stampede for you and one adjacent ally." }, weight: 0.45 },
            { value: { cr: 6, name: "Lurker Drop-Lance Platoon", description: "A disciplined ceiling-ambush set for maximum separation: drops in pairs, then retreats to reset.<br><br><b>Foes:</b> 6 Darkling Lurkers + 1 Darkling Caller (spotter/tempo).<br><b>Hostility:</b> Hostile on sight; they attack as soon as the party passes beneath or makes loud noise in this stretch.<br><br><b>Mechanics:</b> DC 15 Wisdom (Perception) to spot the pattern before they drop. If the party is surprised, the first two drop attacks have advantage. <b>Counter:</b> A creature can spend an action to throw chalk/ash upward (DC 14 Dexterity) to mark two lurkers, negating their concealment until the end of next round." }, weight: 0.35 },
            { value: { cr: 6, name: "Slurper Tongue Crossfire", description: "A long straightaway becomes a restraint corridor as tongues lash from both sides in alternating rhythm.<br><br><b>Foes:</b> 4 Darkling Slurpers.<br><b>Hostility:</b> Hostile on sight; they strike as soon as anyone enters the straightaway.<br><br><b>Mechanics:</b> On the first round, the lead and rear party members must make DC 14 Strength saves or be pulled 10 ft and restrained (tongue AC 12, 3 HP to sever). <b>Option:</b> Create a 'tongue shield' using a door/table: DC 14 Strength (Athletics) (action). Success grants half cover against tongues for 1 round." }, weight: 0.4 },
            { value: { cr: 6, name: "Paralurker Filament Web-Gang", description: "A canopy of filaments turns the corridor into a sticky lattice; predators only drop once you're already slowed.<br><br><b>Foes:</b> 5 Darkling Paralurkers.<br><b>Hostility:</b> Hostile if any creature enters the webbed stretch (or if the party makes loud noise within 30 ft).<br><br><b>Mechanics:</b> The corridor is lightly obscured. Moving more than 15 ft in a turn triggers a DC 14 Dexterity save or restrained by filaments (escape DC 14 Strength (Athletics) or cut free: AC 12, 8 HP for a 5 ft square)." }, weight: 0.35 },
            { value: { cr: 5, name: "Caller War-Chorus (Signal Relay)", description: "Two Callers trade keening signals, coordinating unseen skirmishers.<br><br><b>Foes:</b> 2 Darkling Callers (plus reinforcements: +4 minor darklings if escalation triggers).<br><b>Hostility:</b> Hostile on sight; they begin signaling immediately when the party is detected.<br><br><b>Escalation:</b> If neither Caller is silenced by the end of round 2, 4 minor darklings arrive from a side corridor. If both are silenced, the reinforcements never come. <b>Silence Option:</b> A creature can attempt DC 15 Charisma (Intimidation) or DC 15 Intelligence (Arcana) (action) to disrupt a Caller's rhythm, imposing disadvantage on its next action." }, weight: 0.45 },
            { value: { cr: 6, name: "Yowler Hunt Pack", description: "A Yowler prowls with ceiling escorts, its goal is panic and separation.<br><br><b>Foes:</b> 1 Darkling Yowler + 4 Darkling Lurkers.<br><b>Hostility:</b> Hostile on sight; the Yowler opens with a screech if the party is within 30 ft.<br><br><b>Yowl:</b> Creatures within 30 ft make a DC 14 Constitution save or are frightened until end of their next turn. <b>Mechanics:</b> While frightened, movement provokes opportunistic drop-attacks (lurkers have advantage, DM discretion). <b>Option:</b> Stuff cloth/wax into ears: DC 12 (action) to gain advantage on the next yowl save." }, weight: 0.35 },
            { value: { cr: 5, name: "Hall Monitor Checkpoint Line", description: "A strict checkpoint with chalk-glyph lanes and confiscation poles.<br><br><b>Foes:</b> 2 Hall Monitors.<br><b>Hostility:</b> Become hostile if you refuse to stop, attempt to run the line, or fail the pass check.<br><br><b>Pass:</b> DC 15 Charisma (Deception) or DC 15 Charisma (Persuasion) to be waved through. <b>Failure:</b> A restraint rod attempt (escape DC 14 Strength, action). <b>Alternate:</b> DC 15 Dexterity (Stealth) to slip through an adjacent maintenance gap; on failure, an Auditor arrives in 1d4 rounds." }, weight: 0.5 },
            { value: { cr: 6, name: "Confiscation Dragnet (Auditor-Led)", description: "A rolling 'inventory drill' that tags gear with glowing confiscation seals.<br><br><b>Foes:</b> 1 Auditor + 2 Hall Monitors.<br><b>Hostility:</b> Hostile if you resist confiscation, try to flee, or attack; otherwise they attempt to detain rather than kill.<br><br><b>Mechanics:</b> Each creature must succeed on a DC 15 Dexterity (Sleight of Hand) check to keep one suspicious item untagged, or a DC 15 Charisma (Deception) to justify it. <b>Consequence:</b> Tagged items are 'impounded' unless the party fights or bargains. <b>Bargain:</b> Offer a minor, noncritical item: DC 14 Charisma (Persuasion) to satisfy the Auditor." }, weight: 0.35 },
            { value: { cr: 7, name: "Detention Professor Corridor 'Practical'", description: "A moving lesson in restraint and compliance. The corridor becomes a classroom.<br><br><b>Foes:</b> 1 Detention Professor.<br><b>Hostility:</b> Becomes hostile if you refuse the 'practical', attempt to leave mid-lesson, or fail the challenge.<br><br><b>Mechanics:</b> Group skill challenge: 4 successes before 2 failures (DC 15; choose per attempt: Strength (Athletics), Dexterity (Acrobatics), Charisma (Deception), or Intelligence (Arcana)). Success: you pass as 'self-directed learners' and the Professor moves on. Failure: combat begins with the Professor gaining advantage on the first round's restraint attempt." }, weight: 0.25 },
            { value: { cr: 7, name: "Warforged Darkwatch Sweep Column", description: "A containment patrol with scanning support and escalation hardware.<br><br><b>Foes:</b> 1 Warforged Darkwatch + 1 Warforged Sensor Drone + 1 ping-beacon.<br><b>Hostility:</b> Hostile on sight; if the beacon survives 2 rounds after first contact, reinforcements may be called (DM discretion).<br><br><b>Scan:</b> Creatures crossing the beam make a DC 15 Dexterity save or are outlined (no invisibility; Stealth disadvantage) for 1 minute. <b>Disable:</b> Destroy the drone (AC 13, HP 8) or the beacon (AC 12, HP 5) to prevent escalation." }, weight: 0.3 },
            { value: { cr: 6, name: "Darkforged Plate-Laying Crew", description: "A guarded repair crew installs armor plates over a breach while welding arcs pop and crack.<br><br><b>Foes:</b> 3 Darkforged Remnants.<br><b>Hostility:</b> Hostile if you approach within 20 ft, interfere with the work, or attempt to pass without permission.<br><br><b>Hazard:</b> Each round, a random 5 ft square sparks; creatures there make DC 14 Dexterity saves or take 1d4 lightning damage. <b>Option:</b> DC 15 Intelligence (Investigation) to time movement through safe squares, granting advantage on the next save vs sparks." }, weight: 0.35 },
            { value: { cr: 6, name: "Infiltrator Breach Team (On the Move)", description: "A mobile breach-device on a dolly, protected by snares and disciplined spacing.<br><br><b>Foes:</b> 3 Infiltrators.<br><b>Hostility:</b> Hostile if spotted; they attack immediately if anyone approaches within 30 ft of the breach-device.<br><br><b>Trapline:</b> The first creature to move more than 20 ft in a turn must make a DC 15 Dexterity save or be restrained by force filaments (escape DC 15 Strength). <b>Counter:</b> DC 15 Intelligence (Investigation) (action) to spot and mark the next trap, allowing allies to avoid it this round." }, weight: 0.3 },
            { value: { cr: 7, name: "Vanguard Bulwark Advance (Corridor Crush)", description: "A bulwark line that tries to compress you into a choke point and pin you there.<br><br><b>Foes:</b> 1 Vanguard + 2 Auditors.<br><b>Hostility:</b> Hostile on sight.<br><br><b>Push:</b> Each round the line advances, adjacent creatures make a DC 15 Strength save or are pushed 10 ft and knocked prone. <b>Break Formation:</b> DC 15 Intelligence (Investigation) to identify an anchor rune; destroying it (AC 12, 10 HP) halves the push and ends the 'crush' tactic." }, weight: 0.25 },
            { value: { cr: 6, name: "Void Scholar Field Crew (Live Conduit Test)", description: "A live experiment cart grounded to the corridor's magitech spine while assistants record results.<br><br><b>Foes:</b> 1 Void Scholar + 2 Auditors (assistants).<br><b>Hostility:</b> The crew is hostile if you approach within 10 ft of the cart or attempt to disrupt the experiment; otherwise they order you back at once.<br><br><b>Mechanics:</b> At the end of each round, creatures within 10 ft of the cart make DC 14 Dexterity saves or take 1d4 lightning damage (half on success). <b>Option:</b> DC 15 Intelligence (Arcana) (action) to de-tune the pulse, turning it off for 1 minute; failure by 5+ triggers an immediate arc (1d4 lightning)." }, weight: 0.3 },
            { value: { cr: 8, name: "Liquid Legion Corridor Dam", description: "A slow-moving dam of black ooze that surges whenever the stone vibrates.<br><br><b>Foes:</b> 1 Liquid Legion mass.<br><b>Hostility:</b> Hostile to living creatures within 20 ft; it surges toward heat and motion.<br><br><b>Wave:</b> At the start of each round, creatures in the low lane make DC 15 Strength saves or are knocked prone and take 1d4 acid damage. <b>Route Option:</b> DC 15 Intelligence (Investigation) to find a maintenance ledge; reaching it requires a DC 14 Dexterity (Acrobatics) check (advantage if you take half speed)." }, weight: 0.2 },
            { value: { cr: 8, name: "Faction Clash: Darkwatch vs Liquid Legion", description: "A patrol is actively fighting off an ooze surge. Entering makes you choose a side, or become the third target.<br><br><b>Foes:</b> Darkwatch side: 1 Warforged Darkwatch + 1 Warforged Sensor Drone + 1 ping-beacon. Legion side: 1 Liquid Legion mass.<br><b>Hostility:</b> Both sides are hostile to you unless you immediately and clearly aid one side; the opposed side treats you as hostile.<br><br><b>Mechanics:</b> Each round, choose: take cover (no effect) or advance (DC 14 Dexterity save or take 1d4 acid OR 1d4 lightning, whichever fits the moment). <b>Exploit:</b> DC 15 Intelligence (Arcana/Investigation) to identify a mutual weakness; success grants advantage on one key action (disable beacon, sever ooze vent, etc.)." }, weight: 0.18 },
            { value: { cr: 6, name: "Grief-Stone Gauntlet (With Ceiling Predators)", description: "A grief-stone segment designed to make you hesitate, then punish the hesitation.<br><br><b>Foes:</b> 4 Darkling Lurkers.<br><b>Hostility:</b> Lurkers are hostile on sight; they drop as soon as a creature falters in the aura.<br><br><b>Hazards:</b> 3 grief-stone tiles.<br><br><b>Aura:</b> At the start of each turn, DC 14 Wisdom save or disadvantage on your first roll this turn. <b>Predators:</b> The first time a creature fails the save, one lurker drops (surprise unless DC 15 Perception). <b>Disable:</b> DC 15 Wisdom (Religion) or Intelligence (Arcana) to suppress one tile for 1 minute (action)." }, weight: 0.3 },
            { value: { cr: 5, name: "Arc-Sparker Chokepoint (Infiltrator Setup)", description: "A cracked conduit spits arcs across a narrow pass while a hidden team waits to capitalize on stumbles.<br><br><b>Foes:</b> 2 Infiltrators.<br><b>Hostility:</b> Hostile on sight; they attack from cover as soon as the party attempts to cross.<br><br><b>Arcs:</b> Crossing during a surge requires DC 14 Dexterity saves or 1d4 lightning damage. <b>Snare:</b> On any failed save, the rearmost creature must also make a DC 14 Dexterity save or be restrained by a force snare (escape DC 14 Strength)." }, weight: 0.35 },
            { value: { cr: 6, name: "Steam Tunnel Pressure Break (Darkforged Present)", description: "A pressure line is about to blow, and violent Darkforged are trying to clamp it shut.<br><br><b>Foes:</b> 2 Darkforged Remnants.<br><b>Hostility:</b> Hostile if you enter the fogged area or interfere with the valve work.<br><br><b>Mechanics:</b> At initiative 20 each round, a burst vents: creatures in a 20 ft line make DC 14 Dexterity saves or take 1d4 fire damage and are blinded until the end of their next turn (success: half damage, no blind). <b>Fix:</b> DC 15 Tools (action) to clamp the valve; 2 successes stop the bursts." }, weight: 0.3 },
            { value: { cr: 9, name: "Justicar Pursuit Through the Halls", description: "Measured bootfalls echo behind you: a Justicar is actively pursuing to separate, mark, and sentence.<br><br><b>Foes:</b> 1 Justicar.<br><b>Hostility:</b> Hostile if you fail to stop when commanded (or if you flee); otherwise it attempts a forced 'hearing'.<br><br><b>Option (Chase):</b> Run as a skill challenge: 5 successes before 2 failures (DC 15 Athletics/Acrobatics/Stealth/Investigation). Success: you break line of sight. Failure: you are cornered and the Justicar marks an offender (combat begins with the mark applied)." }, weight: 0.15 },

            // Grief-Stone themed corridor additions
            { value: { cr: 3, name: "Hounding Grief-Stone Tile", description: "A living grief-stone tile clicks loose and begins shadowing your steps, skittering underfoot with malign intent.<br><br><b>Mechanics:</b> At the start of each round, creatures within 10 ft make a DC 14 Wisdom save or suffer disadvantage on their first roll that round. The tile moves up to 10 ft toward the last moving creature's space. Prying it up (AC 13, 10 HP) or warding it (DC 15 Religion/Arcana, action) suppresses it for 1 minute." }, weight: 1.0 },
            { value: { cr: 2, name: "Paralurkers Under the Stone", description: "A small pack of paralurkers has already triggered a grief-stone and is panicking, dropping erratically from the ceiling.<br><br><b>Mechanics:</b> Paralurkers have disadvantage on their first attack each. Creatures in the aura make DC 13 Wisdom saves or have disadvantage on their first roll this round. Loud claps or sudden light can bait them across the tile again, forcing them to scatter for 1 round." }, weight: 0.95 },
        ];

        const roomEncounters = [
            // Dark Dimension cadres (common room threats)
            { value: { cr: 4, name: "Infiltrator Team", description: "A pair of Infiltrators examine a glyph, ready to breach.<br><br><button onclick='this.style.display=\"none\"; this.nextElementSibling.style.display=\"block\"'>Show Mechanics</button><div style='display:none'><b>Snare Grid:</b> DC 14 Intelligence (Investigation) to map trip-sigils; triggering forces a DC 14 Dexterity save or restrained by force-filaments (escape DC 14 Strength).<br><b>Tactic:</b> They focus the rearmost target; breaking line of sight cancels their opening gambit.</div>" }, weight: 4 },
            { value: { cr: 2, name: "Void Scholar at Work", description: "A Void Scholar calibrates a humming rune lattice.<br><br><b>Foes:</b> 1 Dark Dimension Void Scholar.<br><b>Hostility:</b> Hostile if approached within 10 ft or if the lattice is touched.<br><br><b>Option:</b> DC 15 Intelligence (Arcana) to disrupt and grant advantage vs nearby foes for 1 round; on failure by 5+, backlash deals 1d4 lightning to the disruptor." }, weight: 2.5 },
            { value: { cr: 5, name: "Vanguard's Post", description: "A Vanguard guards a 'nothing' doorway with a bulwark.<br><br><b>Shield Push:</b> When it advances, each adjacent creature must succeed on a DC 15 Strength save or be pushed 10 ft and knocked prone. Disabling the anchor rune (AC 12, 10 HP) reduces its push by half." }, weight: 2 },
            { value: { cr: 7, name: "Justicar's Judgment", description: "A Justicar inspects the room and marks an offender.<br><br><b>Mark:</b> One creature must make a DC 15 Wisdom save or is <i>Judged</i>, the Justicar has advantage vs that target until the mark is broken (total cover or 2 consecutive successful saves at end of turn)." }, weight: 1 },
            { value: { cr: 9, name: "The Dean's Office", description: "A Disciplinary Dean studies a scrying pool.<br><br><b>Edict:</b> DC 16 Charisma (Persuasion) to receive a 'reduced sentence'; failure triggers restraints (escape DC 15 Strength) and psychic reprimand (1d6 psychic). Compliance averts combat but imposes a minor penalty (DM discretion)." }, weight: 0.5 },

            // Darkling faculty and classroom horrors
            { value: { cr: 5, name: "Detention Professor's Lesson", description: "A Detention Professor addresses an empty class. The party is 'late'.<br><br><b>Exercise:</b> Best-of-3 DC 14 checks (choose each round: Strength (Athletics), Dexterity (Acrobatics), or Intelligence (Arcana) if magic). Win: earn a <i>Gold Star</i> (inspiration or advantage once). Lose: take 1d6 nonlethal and a detention slip." }, weight: 3 },
            { value: { cr: 3, name: "Hall Monitor Tribunal", description: "Two Hall Monitors and a Caller stage a tribunal.<br><br><b>Defense:</b> Group skill challenge: 3 successes before 2 failures (DC 14 Persuasion/Deception/Insight). Success: 'time served'; Failure: citations and attempted detention (restraints, escape DC 13 Strength)." }, weight: 1.5 },

            // Lurker/slurper dens and primogenitor packs
            { value: { cr: 4, name: "Primogenitor Lurker Pack", description: "A Lurker Primogenitor rules a low ceiling den with escorts.<br><br><b>Ceiling Squeeze:</b> Creatures taller than 5 ft make DC 13 Dexterity (Acrobatics) to avoid disadvantage from cramped space. Dislodging two anchor strands (AC 12, 5 HP each) opens the ceiling." }, weight: 2 },
            { value: { cr: 2, name: "Paralurker Nursery", description: "A soot-stained ceiling hides a brood of paralurkers.<br><br><b>Skittish:</b> Fire or thunder forces them to scatter for 1 round; a Caller can reform them at the end of the next round unless silenced (DC 14)." }, weight: 1.5 },

            // Oozes and anomalies
            { value: { cr: 5, name: "Grief-Stone Ambush", description: "A Grief-Stone masquerades as a column.<br><br><b>Aura:</b> DC 14 Wisdom save at start of each turn or suffer disadvantage on your next action. DC 15 Intelligence (Arcana) or Wisdom (Religion) suppresses the aura for 1 minute; damaging the Stone ends the effect." }, weight: 3 },
            { value: { cr: 5, name: "Liquid Legion (Open Hunt)", description: "The room is a basin for a gathering ooze.<br><br><b>Wave:</b> At the start of the round, creatures in low ground make DC 14 Strength saves or are knocked prone and take 1d4 acid damage; high ground grants advantage on the save." }, weight: 1.25 },
            { value: { cr: 5, name: "Liquid Legion (Ambush)", description: "Floor vents exhale and black volume pours in.<br><br><b>Engulf:</b> DC 14 Dexterity save or become restrained until the end of your next turn. A creature can pull an ally free with a DC 14 Strength (Athletics) check." }, weight: 0.75 },
            { value: { cr: 2, name: "Pugnacious Puddle", description: "The Puddle thumps like a heart and picks the smallest challenger.<br><br><b>Temper:</b> Cold calms (disadvantage next round); fire enrages (advantage next attack). Mopping with neutralizing agents (DC 13 Intelligence (Nature)) halves its HP." }, weight: 1.5 },

            // Courts of the Slimepress
            { value: { cr: 10, name: "Audience with the Shadow Slimepress (BOSS)", description: "The Shadow Slimepress reclines upon an obsidian cradle, attended by the Viscount of Viscera, the Royal Jesters of Despair, and the Baroness of Black Bile. The coterie is always present." }, weight: 0.2 },
            { value: { cr: 3, name: "Viscount of Viscera's Inspection", description: "The Viscount of Viscera conducts a gooey 'audit' with two attendants. Etiquette is a weapon here, and so are blades." }, weight: 0.75 },
            { value: { cr: 3, name: "Baroness of Black Bile's SoirÃ©e", description: "A bile-black reception with cruel amusements. Guests include a Yowler and a Slurper acting as 'servers'." }, weight: 0.75 },
            { value: { cr: 4, name: "Royal Jesters of Despair", description: "Cackling jests sour courage. Failing a Wisdom save turns resolve to rubber. The show ends only when the stage is cleared." }, weight: 0.75 },

            // Rare elementals and void shapes
            { value: { cr: 6, name: "Nightshade Elemental (RARE)", description: "An altar room worships a Nightshade Elemental. Lurkers and slurpers genuflect; the air tastes of ozone and regret." }, weight: 0.5 },
            { value: { cr: 8, name: "The Darkformless (RARE)", description: "A void-sheathed mass tries to be everything at once. A motley band of darklings attends, bewitched by its presence." }, weight: 0.3 },

            // Very rare bosses with special guidance
            { value: { cr: 6, name: "Nightsipper (Mid-Boss)", description: "A Nightsipper coalesces from cold breath and candle smoke. This encounter is rare; the chamber suits its hunting style." }, weight: 0.35 },
            { value: { cr: 9, name: "Nightdrinker Mote (BOSS)", description: "A core of condensed night stares back. VERY rare. 50% of the time an explicit option to flee should be presented by the DM." }, weight: 0.2 },
            { value: { cr: 0, name: "Slime Cube Princess (Non-Combat)", description: "A Darkling Slime Cube Princess emerges shyly from a mosaic drain. Neutral and curious, she offers no threat unless attacked.", nonCombat: true }, weight: 0.25 },

            // Darkforged posts
            { value: { cr: 5, name: "Warforged Darkwatch Outpost", description: "An observation dais hums as a Warforged Darkwatch oversees a map of active anomalies. Tripwires and stasis-grenades abound." }, weight: 0.5 },
            { value: { cr: 4, name: "Darkforged Assembly", description: "Two different Darkforged variants calibrate a pulse-emitter. Disabling it early prevents reinforcements being routed here." }, weight: 0.75 },

            // --- MID-LEVEL HOSTILE ENCOUNTERS (CR 3""4) ---
            { value: { cr: 3, name: "Slurper Under-Table Raid", description: "Tongues lash from under benches, desks, or shelving as the room's clutter becomes cover for a quick capture.<br><br><b>Foes:</b> 3 Darkling Slurpers.<br><b>Hostility:</b> Hostile on sight; they attempt to restrain and drag a target behind cover.<br><br><b>Mechanics:</b> Tongues: AC 12, 3 HP to sever; escaping restraint requires DC 13 Strength (action)." }, weight: 0.9 },
            { value: { cr: 3, name: "Paralurker Ceiling Nest (Agitated)", description: "A ceiling nest is disturbed; filaments hang like curtains and twitch with motion.<br><br><b>Foes:</b> 4 Darkling Paralurkers.<br><b>Hostility:</b> Hostile if any creature enters the room or shines bright light upward.<br><br><b>Mechanics:</b> First creature to move more than 15 ft in a turn makes a DC 13 Dexterity save or is restrained by filaments (escape DC 13 Strength)." }, weight: 0.85 },
            { value: { cr: 4, name: "Hall Monitor Squad (Detain & Tag)", description: "A small squad steps in from side doors with practiced choreography, one blocks the exit, one tags gear, one binds.<br><br><b>Foes:</b> 3 Hall Monitors.<br><b>Hostility:</b> Becomes hostile if you refuse to kneel/submit or attempt to leave; they attempt restraints first, then violence." }, weight: 0.8 },
            { value: { cr: 4, name: "Auditor Confiscation Detail", description: "Auditors move between shelves and cabinets, stamping glowing confiscation seals and looking for an excuse to escalate.<br><br><b>Foes:</b> 3 Auditors.<br><b>Hostility:</b> Hostile if you resist confiscation, touch sealed items, or fail to produce authorization within 1 round of being addressed." }, weight: 0.8 },
            { value: { cr: 3, name: "Infiltrator Pair (Room Breach)", description: "Two Infiltrators have a cabinet half-open with shaped-force wedges and a trip-sigil on the only obvious path in.<br><br><b>Foes:</b> 2 Infiltrators.<br><b>Hostility:</b> Hostile on sight.<br><br><b>Mechanics:</b> Entering without scouting triggers a DC 14 Dexterity save or restrained (escape DC 14 Strength)." }, weight: 0.85 },
            { value: { cr: 4, name: "Darkforged Workshop Guards", description: "A darkforged workbench hums, and the guards treat anyone near it as a thief.<br><br><b>Foes:</b> 3 Darkforged Remnants.<br><b>Hostility:</b> Hostile if you approach within 15 ft of the bench or touch any tool/part.<br><br><b>Hazard:</b> At initiative 20, a clamp-arm snaps: DC 13 Dexterity save or 1d4 bludgeoning." }, weight: 0.75 },
            { value: { cr: 4, name: "Void Scholar + Opportunists", description: "A Void Scholar is mid-notes while opportunists lurk just out of sight, ready to rob anyone who gets distracted by the experiment.<br><br><b>Foes:</b> 1 Void Scholar + 2 Infiltrators.<br><b>Hostility:</b> Infiltrators are hostile on sight; the Scholar becomes hostile if you approach within 10 ft of the apparatus or attempt to interfere.<br><br><b>Mechanics:</b> End of round: creatures within 10 ft of the apparatus make DC 13 Dexterity saves or take 1d4 lightning (half on success)." }, weight: 0.7 },
            { value: { cr: 3, name: "Grief-Stone Corner (Predator Timing)", description: "A grief-stone tile sits where the room's traffic naturally turns; predators wait for the moment your confidence slips.<br><br><b>Foes:</b> 2 Darkling Lurkers + 2 Darkling Slimes.<br><b>Hostility:</b> Hostile on sight; lurkers drop when any creature fails the save.<br><br><b>Mechanics:</b> On entry, DC 13 Wisdom save or disadvantage on your first roll this scene." }, weight: 0.8 },

            // --- MAJOR GROUP ENCOUNTERS (CR 5+) ---
            { value: { cr: 6, name: "Infiltrator Salvage Cell", description: "A salvage operation in progress: one breaches a sealed cabinet, one watches, one sets trip-sigils.<br><br><b>Foes:</b> 3 Infiltrators.<br><b>Hostility:</b> Hostile if you enter the room, touch the salvage, or are spotted within 30 ft.<br><br><b>Trap Grid:</b> First creature to enter the room must make a DC 15 Dexterity save or be restrained (escape DC 15 Strength). <b>Option:</b> DC 15 Intelligence (Investigation) (action) to identify the safe approach route, granting advantage on saves against the trap grid for allies who follow you this round." }, weight: 0.35 },
            { value: { cr: 6, name: "Auditarch with Auditor Retinue", description: "A compliance review that is, functionally, a trial.<br><br><b>Foes:</b> 1 Auditarch + 2 Auditors.<br><b>Hostility:</b> Becomes hostile if you refuse the trial process, attempt to leave, or fail the trial.<br><br><b>Trial:</b> Each party member chooses one check (DC 15): Charisma (Persuasion/Deception), Wisdom (Insight), or Intelligence (Investigation). If you achieve 3+ total successes, you're dismissed with a warning. Otherwise, they attempt restraint and confiscation (combat or capture)." }, weight: 0.3 },
            { value: { cr: 6, name: "Vanguard Drill Platoon", description: "A containment drill designed to compress an intruder into a corner and bind them.<br><br><b>Foes:</b> 1 Vanguard + 2 Auditors.<br><b>Hostility:</b> Hostile on sight; they treat you as the drill's live target.<br><br><b>Push:</b> When the Vanguard advances, adjacent creatures make DC 15 Strength saves or are pushed 10 ft and knocked prone. <b>Break the Drill:</b> Destroy the whistle-rune (AC 12, 10 HP) to impose disadvantage on the controllers' next actions." }, weight: 0.28 },
            { value: { cr: 8, name: "Justicar Court Session", description: "An active 'sentence hearing' in progress. The target is absent; you are convenient.<br><br><b>Foes:</b> 1 Justicar + 2 Hall Monitors.<br><b>Hostility:</b> Becomes hostile if you interrupt proceedings, refuse to kneel/comply, or attack.<br><br><b>Mark:</b> One creature makes a DC 15 Wisdom save or is <i>Judged</i> (Justicar advantage vs that target) until broken by total cover or 2 consecutive end-of-turn successful saves. <b>Appeal:</b> DC 16 Charisma (Persuasion) to force a procedural delay (no combat unless you attack)." }, weight: 0.18 },
            { value: { cr: 7, name: "Warforged Darkwatch Command Post (Active Scan)", description: "A command node projects a scanning mesh while escalation hardware waits to ping for backup.<br><br><b>Foes:</b> 1 Warforged Darkwatch + 1 Warforged Sensor Drone + 1 ping-beacon.<br><b>Hostility:</b> Hostile on sight; if the beacon remains active for 2 rounds after detection, reinforcements may be called (DM discretion).<br><br><b>Mesh:</b> Moving more than 15 ft in a turn triggers a scan: DC 15 Dexterity save or be outlined (Stealth disadvantage, invisibility fails) for 1 minute. <b>Priority Targets:</b> Beacon (AC 12, 5 HP) and drone (AC 13, 8 HP)." }, weight: 0.25 },
            { value: { cr: 6, name: "Darkforged Fabricator Bay", description: "A humming fabrication rig with active operators, dangerous before anyone swings.<br><br><b>Foes:</b> 2 Darkforged Remnants.<br><b>Hostility:</b> Hostile if you approach within 20 ft or tamper with the rig.<br><br><b>Hazard:</b> At initiative 20, the rig cycles: creatures within 10 ft make DC 14 Dexterity saves or take 1d4 lightning damage and are pushed 5 ft by a mechanical shove. <b>Disable:</b> DC 15 Tools (Tinker) or Intelligence (Arcana) (action) to shut the rig down for 10 minutes." }, weight: 0.3 },
            { value: { cr: 8, name: "Liquid Legion Cistern Confluence", description: "Multiple ooze streams converge; the Legion is building itself.<br><br><b>Foes:</b> 1 Liquid Legion mass.<br><b>Hostility:</b> Hostile to living creatures within 20 ft; it surges toward heat and motion.<br><br><b>Wave:</b> At round start, creatures in low ground make DC 15 Strength saves or are knocked prone and take 1d4 acid damage. <b>Seal the Feed:</b> Find and plug 2 intake grates: DC 15 Tools or DC 15 Strength (Athletics) (action per grate). Each plugged grate reduces the wave DC by 1." }, weight: 0.18 },
            { value: { cr: 7, name: "Slimepress Tributary Court (Not the Throne)", description: "A lesser court holds audience around a quivering dais as names are recorded in slime-script.<br><br><b>Foes:</b> 1 Herald of Viscera + 4 Slimepress attendants (Darkling Slimes).<br><b>Hostility:</b> Becomes hostile if etiquette is violated or if the social check fails; otherwise the court ignores you unless petitioned.<br><br><b>Option:</b> DC 15 Charisma (Performance or Deception) to follow court etiquette and pass unmolested. <b>Failure:</b> Attendants attempt to restrain and humiliate (combat likely). <b>Twist:</b> If shown a convincing gift (valuable goo, rare salt, etc.), you gain advantage on the check." }, weight: 0.22 },
            { value: { cr: 6, name: "Grief-Stone Choir (Resonant Array)", description: "A choir-circle of grief-stone tiles pulses in harmonics that feed on hesitation, and predators have learned to wait for the falter.<br><br><b>Foes:</b> 2 Darkling Lurkers.<br><b>Hostility:</b> Lurkers are hostile on sight; they drop when any creature fails the aura save.<br><br><b>Hazards:</b> 3 grief-stone tiles.<br><br><b>Aura:</b> At start of each turn, DC 14 Wisdom save or disadvantage on the first roll this turn. <b>Disrupt:</b> Break the harmonic by smashing or warding any two tiles (each tile AC 13, 10 HP; or DC 15 Religion/Arcana, action)." }, weight: 0.28 },
            { value: { cr: 7, name: "Detention Professor Ensemble", description: "A coordinated lesson plan: one Professor controls space with magic calibration hums, the other enforces restraint.<br><br><b>Foes:</b> 2 Detention Professors.<br><b>Hostility:</b> Becomes hostile if you refuse the lesson, attempt to leave, or interfere with their 'grading'.<br><br><b>Mechanics:</b> While the calibration hum is active, spell attacks within 10 ft have disadvantage. <b>End the Hum:</b> DC 15 Intelligence (Arcana) (action) to re-tune; failure by 5+ deals 1d4 lightning to the tuner." }, weight: 0.25 },
            { value: { cr: 6, name: "Mass Detention Sweep", description: "A squad rounds up 'truants' with chalk-glyph lanes and ribbon binds under an Auditor's supervision.<br><br><b>Foes:</b> 4 Hall Monitors + 1 Auditor.<br><b>Hostility:</b> Becomes hostile if you run, resist restraint, or fail the escape challenge; otherwise they attempt capture, not slaughter.<br><br><b>Escape Option:</b> Group skill challenge: 4 successes before 2 failures (DC 15: Stealth/Acrobatics/Deception/Investigation). Success: you slip out through an auxiliary door. Failure: you're cornered and the squad initiates restraints (combat begins)." }, weight: 0.3 },
            { value: { cr: 7, name: "Void Scholar Rift Experiment", description: "A small spatial tear is pinned in place by pylons. Assistants and opportunists hover near the glow.<br><br><b>Foes:</b> 1 Void Scholar + 2 Infiltrators (opportunists).<br><b>Hostility:</b> Infiltrators are hostile on sight; the Scholar becomes hostile if you approach within 15 ft of the pylons or attempt to stabilize/steal data.<br><br><b>Hazard:</b> At the end of each round, each creature chooses a direction; on a roll of 1-2 on a d6, they are slid 5 ft that way by the ripple (DM adjudicates). <b>Stabilize:</b> DC 16 Intelligence (Arcana) (action) to shut down one pylon; shutting down 2 ends the anomaly." }, weight: 0.22 },
            { value: { cr: 6, name: "Faction Clash: Infiltrators vs Darklings", description: "A fight is already underway; both sides treat you as interference.<br><br><b>Foes:</b> Infiltrators: 3 Infiltrators. Darklings: 4 Darkling Lurkers + 2 Darkling Slurpers.<br><b>Hostility:</b> Both sides are hostile to you unless you immediately and clearly aid one side; the opposed side treats you as hostile.<br><br><b>Mechanics:</b> Each round, a hazard triggers (DM choice): a trip-sigil (DC 14 Dex or restrained), a tongue lash (DC 14 Str or restrained), or an arc pop (DC 14 Dex or 1d4 lightning). <b>Exploit:</b> DC 15 Intelligence (Investigation) to time an opening and slip past without joining the fight." }, weight: 0.28 },
            { value: { cr: 5, name: "Brawl: Darklings vs Ooze-Engine", description: "An ooze-engine is actively dissolving a nest of darklings. The brawl is chaotic, loud, and indiscriminate.<br><br><b>Foes:</b> 1 Mobile Hall Cleaner + 4 Darkling Lurkers + 2 Darkling Slimes.<br><b>Hostility:</b> Hostile if you enter the foam zone or attack either side; otherwise you may sneak around the perimeter.<br><br><b>Foam:</b> Difficult terrain; starting your turn in foam deals 1d4 acid (DC 13 Dex halves). <b>Option:</b> DC 14 Tools to redirect the engine's route (action), causing it to trundle away and end the brawl within 2 rounds." }, weight: 0.4 },
            { value: { cr: 6, name: "Arcane Training: Live-Fire Circle (Overclocked)", description: "An overclocked training circle snaps force-bands at anything moving too quickly, supervised by staff.<br><br><b>Foes:</b> 2 Hall Monitors (supervisors).<br><b>Hostility:</b> Becomes hostile if you enter the circle without permission or attempt to disable it.<br><br><b>Mechanics:</b> The first creature to take the Dash action each round must make a DC 15 Dexterity save or take 1d4 force damage and be restrained by force-bands (escape DC 14 Strength). <b>Disable:</b> DC 15 Intelligence (Arcana) to power down a pylon; two pylons disabled ends the circle." }, weight: 0.3 },
            { value: { cr: 6, name: "Observatory: Sensor Drone Constellation Net", description: "A constellation net doubles as a scan grid, sweeping the chamber in synchronized loops.<br><br><b>Foes:</b> 2 Warforged Sensor Drones + 1 ping-beacon.<br><b>Hostility:</b> Hostile on sight; if the beacon pings, Darkwatch reinforcements may arrive (DM discretion).<br><br><b>Net:</b> DC 15 Dexterity (Stealth) to cross without triggering a ping. <b>Disable:</b> Destroy the beacon (AC 12, 5 HP) or succeed on DC 15 Tools/Arcana (action) to mute it for 10 minutes." }, weight: 0.28 },
            { value: { cr: 5, name: "Museum Guard Detail (Animated Trophy + Staff)", description: "A trophy mascot is 'on duty' while an Auditor-Curator conducts an inspection.<br><br><b>Foes:</b> 1 animated trophy mascot + 1 Auditor-Curator.<br><b>Hostility:</b> Curator becomes hostile if you touch displays or fail paperwork; mascot is hostile if you cross the rope line.<br><br><b>Mechanics:</b> Breaking the trophy's hinge-glyph (AC 12, 5 HP) ends its animation. <b>Paperwork Play:</b> DC 15 Charisma (Deception) to claim official tour status; success buys 1 minute to reposition or retreat." }, weight: 0.33 },
            { value: { cr: 6, name: "Faction Clash: Darkwatch vs Infiltrators", description: "A breach has been interrupted mid-action; scan beams rake the room while shaped-force snares snap in retaliation.<br><br><b>Foes:</b> Darkwatch: 1 Warforged Darkwatch + 1 Warforged Sensor Drone + 1 ping-beacon. Infiltrators: 3 Infiltrators.<br><b>Hostility:</b> Both sides are hostile to you unless you immediately and clearly aid one side; the opposed side treats you as hostile.<br><br><b>Mechanics:</b> Each round, creatures not behind cover make DC 14 Dexterity saves or take 1d4 lightning (scan arc) or become restrained (snare) (DM chooses based on which side is 'winning'). <b>Exit Option:</b> DC 15 Intelligence (Investigation) to identify an unscanned route to a side door." }, weight: 0.22 },

            // New general room encounters
            { value: { cr: 2, name: "Scrying Array Misfire", description: "A wall of scrying lenses sparks chaotically.<br><br><b>Mechanics:</b> DC 14 Intelligence (Arcana) to stabilize; failure releases a psychic pop, creatures within 10 ft make DC 13 Wisdom saves or suffer disadvantage on their next check." }, weight: 1.5 },
            { value: { cr: 3, name: "Mobile Cleaner Overflow", description: "A Mobile Cleaner left a foamy lake under tables.<br><br><b>Foam:</b> Difficult terrain; starting turn in foam deals 1d4 acid (DC 13 Dex halves). Clearing a drain (DC 14 Tools) removes foam over 1 minute." }, weight: 1.2 },
            { value: { cr: 3, name: "Darkforged Workshop Live", description: "A maintenance jig twitches to life while a Remnant supervises.<br><br><b>Mechanics:</b> Disable the jig (AC 12, 12 HP) or DC 15 Tools; failure shocks the operator for 1d4 lightning and restrains until freed (DC 13 Strength)." }, weight: 1.2 },
            { value: { cr: 2, name: "Window Resonance", description: "A pane in the room hums with a psychic crosswind.<br><br><b>Mechanics:</b> DC 13 Wisdom save or Perception checks are at disadvantage for 10 minutes; bracing the frame (DC 12 Tools) quiets it." }, weight: 1 },
            { value: { cr: 2, name: "Ghostiby Shelver", description: "A Darkling-Ghostiby tries to shelve the party like books, giggling.<br><br><b>Mechanics:</b> DC 13 Charisma (Performance) to entertain it into helping; success yields advantage on a future Investigation here; failure leaves your gear 're-shelved'. (Social interaction)", nonCombat: true }, weight: 0.9 },
            { value: { cr: 4, name: "Stasis Capsule Reboot", description: "A stasis pod chimes and begins rebooting. A Warforged sensor drone warms nearby.<br><br><b>Mechanics:</b> DC 14 Intelligence (Investigation) to halt the sequence; failure releases the drone (use Sensor Drone behavior)." }, weight: 0.8 },
            { value: { cr: 3, name: "Confiscation Sweep", description: "An Auditor and Hall Monitor inventory the room.<br><br><b>Checks:</b> DC 14 Charisma (Deception) to legitimize items; failure results in 1d3 items tagged as 'impounded' unless you accept a citation (minor condition, DM discretion)." }, weight: 1.2 },
            { value: { cr: 2, name: "Runic Chalkback", description: "Notes appear correcting your notes and scolding penmanship.<br><br><b>Mechanics:</b> Accept the 'correction' and gain +1 on your next Arcana/History; defy it and it smudges new writing for 10 minutes.", nonCombat: true }, weight: 1 },

            // Light, non-combat general room vignettes
            { value: { cr: 0, name: "Bottle Elemental Cooler (Non-Combat)", description: "A cooler rattles, tiny water and air elementals in bottles clink for attention.<br><br><b>Mechanics:</b> DC 12 Wisdom (Animal Handling) or Intelligence (Arcana) to soothe; success yields a 'refreshing swig' granting +1 on next Constitution save; failure pops a cap and sprays (1 cold, targets in 5 ft).", nonCombat: true }, weight: 0.9 },
            { value: { cr: 0.5, name: "Tea Time Trolley", description: "A polite trolley rolls in, offering tea and biscuits.<br><br><b>Mechanics:</b> Accepting grants a calm boon (+1 on next Wisdom check); rushing it causes a wobble, DC 12 Dexterity save or spill (prone?). Polite thanks grants advantage on next reaction to social pressure here (DM's call).", nonCombat: true }, weight: 1 },
            { value: { cr: 0.5, name: "Constellation Projector Puzzle", description: "A ceiling projector shows misaligned constellations.<br><br><b>Mechanics:</b> DC 14 Intelligence (Investigation) or (Arcana) to rotate lenses into place; success reveals a navigation hint (advantage on next navigation-related choice) or a hidden compartment; failure triggers a brief dazzle (disadvantage on next attack).", nonCombat: true }, weight: 1 },

            const direct = getFirstField(json, ['monsters', 'creatures', 'bestiary', 'entries', 'data', 'items']);
            if (Array.isArray(direct)) return direct;
            for (const k of Object.keys(json)) {
                if (Array.isArray(json[k])) return json[k];
            }
            return [];
        };

        const setBestiaryFromJsonText = (text, sourceLabel) => {
            let parsed;
            try {
                parsed = JSON.parse(String(text || ''));
            } catch (e) {
                return { ok: false, error: `Invalid JSON: ${e?.message || e}` };
            }
            const arr = extractBestiaryArray(parsed);
            const index = new Map();
            for (const entry of arr) {
                const name = getFirstField(entry, ['name', 'Name', 'title', 'Title']);
                if (!name) continue;
                const key = normalizeBestiaryName(name);
                if (!key) continue;
                if (!index.has(key)) index.set(key, entry);
            }
            bestiaryState = {
                index,
                count: index.size,
                source: sourceLabel || 'bestiary.json',
                loadedAt: new Date().toISOString(),
            };
            return { ok: true, count: index.size };
        };

        const clearBestiary = () => {
            bestiaryState = { index: null, count: 0, source: null, loadedAt: null };
        };

        const getBestiaryEntryByName = (name) => {
            if (!bestiaryState?.index) return null;
            const k = normalizeBestiaryName(name);
            if (!k) return null;

            // 1) Direct + simple variants (plural/singular, parenthetical suffix)
            for (const variant of getBestiaryNameVariants(k)) {
                const direct = bestiaryState.index.get(variant);
                if (direct) return direct;
            }

            // 2) Fuzzy fallback (handles small differences like pluralization)
            // Guardrails: don't fuzzy-match extremely short queries.
            const q = k.trim();
            if (q.length < 4) return null;

            let bestEntry = null;
            let bestScore = 0;
            const variants = getBestiaryNameVariants(q);

            for (const [candidateKey, entry] of bestiaryState.index.entries()) {
                let score = 0;
                for (const v of variants) {
                    score = Math.max(score, scoreBestiaryKeyMatch(v, candidateKey));
                    if (score >= 95) break;
                }
                if (score > bestScore) {
                    bestScore = score;
                    bestEntry = entry;
                }
            }

            // With improved partial matching, accept scores >= 70 for better partial name matching
            if (bestScore >= 70) return bestEntry;
            return null;
        };

        const formatBestiaryMiniHtml = (entry, nameHint) => {
            const data = normalizeBestiaryEntry(entry, nameHint || entry?.name);
            if (!data) return '';
            const { name, cr, ac, hp, type, alignment } = data;
            const parts = [];
            if (cr != null) parts.push(`CR ${stripHtml(String(cr))}`);
            if (ac != null) parts.push(`AC ${stripHtml(String(ac))}`);
            if (hp != null) parts.push(`HP ${stripHtml(String(hp))}`);
            if (type) parts.push(stripHtml(String(type)));
            if (alignment) parts.push(stripHtml(String(alignment)));
            if (!parts.length) return '';
            return `<div class="mt-2 text-xs text-gray-300"><b>${escapeHtml(name)}</b><br>${parts.join(' "¢ ')}</div>`;
        };

        const updateBestiaryStatusElements = () => {
            const status = bestiaryState?.index
                ? `Loaded: ${bestiaryState.count} entries (${stripHtml(bestiaryState.source || 'bestiary')})`
                : 'Not loaded';
            const a = document.getElementById('dungeon-start-bestiary-status');
            const b = document.getElementById('dungeon-bestiary-status');
            if (a) a.textContent = status;
            if (b) b.textContent = status;
        };

        const ensureBundledBestiaryLoaded = async (opts = {}) => {
            if (bestiaryState?.index) return { ok: true, already: true };
            if (bestiaryAutoloadAttempted && !opts.force) return { ok: false, alreadyTried: true };
            bestiaryAutoloadAttempted = true;
            const out = await loadBundledBestiary();
            if (out?.ok) {
                if (!opts.silent) console.info('[bestiary] Auto-loaded bundled bestiary:', out.source, `(${out.count} entries)`);
                updateBestiaryStatusElements();
            } else if (!opts.silent) {
                console.warn('[bestiary] Failed to auto-load bundled bestiary:', out?.error || 'unknown error');
            }
            return out;
        };

        const loadBundledBestiary = async () => {
            // Try hard-baked bestiary first
            if (window.__BUNDLED_BESTIARY_DATA__) {
                try {
                    const text = typeof window.__BUNDLED_BESTIARY_DATA__ === 'string' 
                        ? window.__BUNDLED_BESTIARY_DATA__ 
                        : JSON.stringify(window.__BUNDLED_BESTIARY_DATA__);
                    const out = setBestiaryFromJsonText(text, 'Bundled: Cellarways');
                    if (out.ok) {
                        updateBestiaryStatusElements();
                        return { ok: true, source: 'Bundled: Cellarways', count: out.count };
                    }
                } catch (e) {
                    console.warn('[bestiary] Failed to load hard-baked bestiary:', e);
                }
            }

            try {
                const bridge = window?.bestiaryBridge;
                if (bridge?.getBundledBestiaryText) {
                    const text = bridge.getBundledBestiaryText();
                    const source = bridge.getBundledBestiarySource?.() || 'Bundled Bestiary';
                    if (text) {
                        const out = setBestiaryFromJsonText(text, source);
                        if (out.ok) {
                            updateBestiaryStatusElements();
                            return { ok: true, source, count: out.count };
                        }
                    } else {
                        console.warn('[bestiary] Bridge returned empty bundled bestiary text');
                    }
                }
            } catch (e) {
                console.warn('Failed to load bestiary from bridge:', e);
            }

            const candidates = ['Diaper-School-Full-Bestiary.json', 'src/Main-Bestiary.json'];
            for (const url of candidates) {
                try {
                    const res = await fetch(url, { cache: 'no-store' });
                    if (!res.ok) continue;
                    const text = await res.text();
                    const out = setBestiaryFromJsonText(text, url);
                    if (out.ok) {
                        updateBestiaryStatusElements();
                        return { ok: true, source: url, count: out.count };
                    }
                } catch {
                    // try next
                }
            }
            return { ok: false, error: 'Could not load bundled bestiary (try file upload).' };
        };

        const abilityScoreMod = (score) => {
            const n = Number(score);
            if (!Number.isFinite(n)) return null;
            return Math.floor((n - 10) / 2);
        };

        const formatAbilityScoreCell = (label, val) => {
            if (val == null) return `<div class="p-2 rounded-md bg-slate-900/40 border border-slate-700/70 text-center"><div class="text-xs text-gray-400">${escapeHtml(label)}</div><div class="text-lg text-gray-500">, </div></div>`;
            const mod = abilityScoreMod(val);
            const modText = (mod == null) ? '' : `(${mod >= 0 ? '+' : ''}${mod})`;
            return `<div class="p-2 rounded-md bg-slate-900/40 border border-slate-700/70 text-center"><div class="text-xs text-gray-400">${escapeHtml(label)}</div><div class="text-lg text-gray-100 font-semibold">${escapeHtml(String(val))} <span class="text-sm text-gray-400">${modText}</span></div></div>`;
        };

        const joinList = (val) => {

        const makeModalDraggable = () => {
            const panel = document.getElementById('bestiary-modal-panel');
            if (!panel) return;
            panel.style.position = 'fixed';
            const center = () => {
                const rect = panel.getBoundingClientRect();
                panel.style.left = `${(window.innerWidth - rect.width) / 2}px`;
                panel.style.top = `${Math.max(24, (window.innerHeight - rect.height) / 4)}px`;
            };
            center();

            let dragging = false;
            let startX = 0;
            let startY = 0;
            let origLeft = 0;
            let origTop = 0;

            const onMove = (e) => {
                if (!dragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                panel.style.left = `${origLeft + dx}px`;
                panel.style.top = `${origTop + dy}px`;
            };

            const onUp = () => {
                dragging = false;
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
            };

            const header = panel.querySelector('#bestiary-modal-title') || panel;
            header.style.cursor = 'move';
            header.addEventListener('mousedown', (e) => {
                dragging = true;
                startX = e.clientX;
                startY = e.clientY;
                const rect = panel.getBoundingClientRect();
                origLeft = rect.left;
                origTop = rect.top;
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        };

        const showModalContent = (html) => {

        const manualBestiaryEntries = () => {

            const timeLagPocket = mk('Time-Lag Pocket', {

                }),
                'wayfinding echo markers': mk('Wayfinding Echo Markers', {
                    kind: 'trap',

                    mechanics: 'DC 13 Wisdom (Perception) to notice and step lightly; until disabled (DC 13 Thieves\' Tools), Stealth checks in this stretch are at disadvantage due to the echo.'
                }),
                'liquid legion mass': mk('Liquid Legion Mass', {
                    kind: 'ooze',

                }),
                'custodial cube': custodialCube,
                'custodial cube (cr 3)': custodialCube,
                'time lag pocket': timeLagPocket,
                'time lag pocket cr 2': timeLagPocket,
                'darkwatch scanpoint': darkwatchScanpoint,
                'darkwatch scanpoint cr 4': darkwatchScanpoint,
                'darkforged test bench': darkforgedTestBench(),
                'darkforged test bench (cr 5)': darkforgedTestBench(),
            };
        };

        const normalizeSkillsList = (skillsArr) => {
            if (!Array.isArray(skillsArr)) return '';
            return skillsArr.map((s) => s?.modifierStr || `${s?.name || ''} ${s?.modifier >= 0 ? '+' : ''}${s?.modifier ?? ''}`).filter(Boolean).join(', ');
        };

        const normalizeSavingThrows = (savesArr) => {
            if (!Array.isArray(savesArr)) return '';
            return savesArr.map((s) => s?.modifierStr || `${(s?.ability || '').toUpperCase()} ${s?.modifier >= 0 ? '+' : ''}${s?.modifier ?? ''}`).filter(Boolean).join(', ');
        };

        const normalizeDefList = (arr) => {
            if (Array.isArray(arr)) return arr.map(stripHtml).filter(Boolean).join(', ');
            return joinList(arr);
        };

        const normalizeAbilityScores = (entry) => {
            const stats = entry?.stats;
            if (stats?.abilityScores) {
                const a = stats.abilityScores;
                return {
                    STR: a.strength ?? a.STR ?? a.str ?? null,
                    DEX: a.dexterity ?? a.DEX ?? a.dex ?? null,
                    CON: a.constitution ?? a.CON ?? a.con ?? null,
                    INT: a.intelligence ?? a.INT ?? a.int ?? null,
                    WIS: a.wisdom ?? a.WIS ?? a.wis ?? null,
                    CHA: a.charisma ?? a.CHA ?? a.cha ?? null,
                };
            }
            return {
                STR: getFirstField(entry, ['str', 'strength', 'Str', 'STR']),
                DEX: getFirstField(entry, ['dex', 'dexterity', 'Dex', 'DEX']),
                CON: getFirstField(entry, ['con', 'constitution', 'Con', 'CON']),
                INT: getFirstField(entry, ['int', 'intelligence', 'Int', 'INT']),
                WIS: getFirstField(entry, ['wis', 'wisdom', 'Wis', 'WIS']),
                CHA: getFirstField(entry, ['cha', 'charisma', 'Cha', 'CHA']),
            };
        };

        const normalizeActions = (entry) => {
            if (entry?.stats?.actions) return entry.stats.actions;
            return getFirstField(entry, ['actions', 'Actions']) || [];
        };

        const normalizeTraits = (entry) => {
            const stats = entry?.stats;
            if (stats?.additionalAbilities) return stats.additionalAbilities;
            if (stats?.specialAbilities) return stats.specialAbilities;
            return getFirstField(entry, ['special_abilities', 'specialAbilities', 'traits', 'Traits']) || [];
        };

        const normalizeLegendary = (entry) => {
            if (entry?.stats?.legendaryActions) return entry.stats.legendaryActions;
            return getFirstField(entry, ['legendary_actions', 'legendaryActions']) || [];
        };

        const normalizeImg = (entry, name) => {
            return entry?.flavor?.imageUrl || entry?.image || getMonsterImageUrlForName(name);
        };

        const sizeToSlots = (raw) => {
            const s = String(raw || '').toLowerCase();
            if (!s) return 1;
            if (s.includes('gargantuan')) return 4;
            if (s.includes('huge')) return 3;
            if (s.includes('large')) return 2;
            return 1; // Tiny/Small/Medium default to 1x1
        };

        const normalizeBestiaryEntry = (entry, name) => {
            if (!entry) return null;
            const stats = entry.stats || {};
            const manual = entry.kind === 'trap' || entry.kind === 'hazard';
            const displayName = stripHtml(entry.name || stats.name || name || 'Creature');
            const cr = stats.challengeRating ?? stats.challengeRatingStr ?? getFirstField(entry, ['cr', 'CR', 'challenge_rating', 'challengeRating']) ?? entry.cr;
            const ac = stats.armorClass ?? stats.armorClassStr ?? getFirstField(entry, ['ac', 'AC', 'armor_class', 'armorClass']);
            const hp = stats.hitPointsStr || stats.hitPoints || coerceHpText(getFirstField(entry, ['hp', 'HP', 'hit_points', 'hitPoints']));
            const type = stats.race || stats.type || entry.type || getFirstField(entry, ['type', 'Type', 'creature_type', 'creatureType']);
            const align = stats.alignment || entry.alignment || getFirstField(entry, ['alignment', 'Alignment']);
            const speed = stats.speed || getFirstField(entry, ['speed', 'Speed']);
            const senses = normalizeDefList(stats.senses || stats.sensesStr);
            const languages = normalizeDefList(stats.languages);
            const saves = normalizeSavingThrows(stats.savingThrows);
            const skills = normalizeSkillsList(stats.skills);
            const resist = normalizeDefList(stats.damageResistances);
            const immune = normalizeDefList(stats.damageImmunities);
            const vuln = normalizeDefList(stats.damageVulnerabilities);
            const condImmune = normalizeDefList(stats.conditionImmunities);
            const actions = normalizeActions(entry);
            const traits = normalizeTraits(entry);
            const legendary = normalizeLegendary(entry);
            const imgUrl = normalizeImg(entry, displayName);
            const abilities = normalizeAbilityScores(entry);
            const sizeLabel = stats.size || entry.size || '';
            const sizeSlots = sizeToSlots(sizeLabel);
            return {
                name: displayName,

                ac,
                hp,
                type,

                traits,
                legendary,

                abilities,
                description: entry.description || entry.mechanics || entry.flavor?.description || '',

        const getManualEntryByName = (name) => {
            const key = normalizeBestiaryName(name);
            const manual = manualBestiaryEntries();
            return manual[key] || null;
        };

        // Extract potential monster names from encounter descriptions
        const extractMonsterNamesFromEncounter = (encounter) => {
            const names = [];
            const desc = encounter?.description || '';
            
            // Pattern 1: "Foes: 2 Dark Dimension Infiltrators" or "Foes: 1 Hall Monitor + 2 Auditors"
            const foesMatch = desc.match(/<b>Foes:<\/b>\s*([^<.]+)/i);
            if (foesMatch) {
                const foesText = foesMatch[1];
                // Split by + or commas
                const parts = foesText.split(/\s*[+,]\s*/);
                for (const part of parts) {
                    // Extract name after number: "2 Dark Dimension Infiltrators" -> "Dark Dimension Infiltrators"
                    const nameMatch = part.match(/\d+\s+(.+?)(?:\s*\(|$)/);
                    if (nameMatch) {
                        names.push(nameMatch[1].trim());
                    } else {
                        // No number, try to extract name directly
                        const cleaned = part.replace(/^a\s+|^an\s+|^the\s+/i, '').trim();
                        if (cleaned && cleaned.length > 3) names.push(cleaned);
                    }
                }
            }
            
            // Pattern 2: Look for capital-case monster names in the description (e.g., "Hall Monitors quiz")
            const titleWords = (encounter?.name || '').split(/\s+/);
            for (const word of titleWords) {
                if (word.length >= 4 && /^[A-Z]/.test(word) && !/^(The|A|An)$/i.test(word)) {
                    // Try multi-word combinations
                    const idx = titleWords.indexOf(word);
                    if (idx >= 0 && idx < titleWords.length - 1) {
                        const twoWord = `${word} ${titleWords[idx + 1]}`;
                        if (titleWords[idx + 1].length >= 4 && /^[A-Z]/.test(titleWords[idx + 1])) {
                            names.push(twoWord);
                            if (idx < titleWords.length - 2 && titleWords[idx + 2].length >= 4 && /^[A-Z]/.test(titleWords[idx + 2])) {
                                const threeWord = `${twoWord} ${titleWords[idx + 2]}`;
                                names.push(threeWord);
                            }
                        }
                    }
                    names.push(word);
                }
            }
            
            return names;
        };

        const getBestiaryOrManualEntry = (name, encounter) => {
            // Try direct name lookup first
            let entry = getBestiaryEntryByName(name);
            if (entry) return entry;
            
            entry = getManualEntryByName(name);
            if (entry) return entry;
            
            // If we have encounter context, try extracting monster names from description
            if (encounter) {
                const extractedNames = extractMonsterNamesFromEncounter(encounter);
                for (const extracted of extractedNames) {
                    entry = getBestiaryEntryByName(extracted);
                    if (entry) return entry;
                    entry = getManualEntryByName(extracted);
                    if (entry) return entry;
                }
            }
            
            return null;
        };

        const showBestiaryModalForName = (name, encounter) => {
            const entry = getBestiaryOrManualEntry(name, encounter);
            if (!entry) {
                showModalContent(`<div id="bestiary-modal-title" class="text-xl font-bold text-gray-100">Bestiary</div><div class="text-sm text-gray-300 mt-2">No bestiary entry found for: <b>${escapeHtml(stripHtml(name || ''))}</b></div>`);
                return;
            }

            const data = normalizeBestiaryEntry(entry, name);
            const pills = [];
            if (data.cr != null) pills.push(`CR ${escapeHtml(String(data.cr))}`);
            if (data.ac != null) pills.push(`AC ${escapeHtml(String(data.ac))}`);
            if (data.hp != null) pills.push(`HP ${escapeHtml(String(data.hp))}`);
            if (data.type) pills.push(escapeHtml(String(data.type)));
            if (data.alignment) pills.push(escapeHtml(String(data.alignment)));

            const defenses = [
                { label: 'Saving Throws', value: data.saves },
                { label: 'Skills', value: data.skills },
                { label: 'Senses', value: data.senses },
                { label: 'Languages', value: data.languages },
                { label: 'Resistances', value: data.resist },
                { label: 'Immunities', value: data.immune },
                { label: 'Vulnerabilities', value: data.vuln },
                { label: 'Condition Immunities', value: data.condImmune },
            ].filter((d) => d.value);

            const speedText = (() => {
                const speed = data.speed;
                if (!speed) return '';
                if (typeof speed === 'string') return speed;
                if (typeof speed === 'object') {
                    return Object.entries(speed)
                        .map(([k, v]) => `${k}: ${v}`)
                        .join(', ');
                }
