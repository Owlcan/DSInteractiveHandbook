<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascent to the Black Pyramid</title>
    <!-- Loading Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Setting up the Inter font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #daac17;
            --gold-light: #fae791;
            --gold-dark: #97740a;
            --parchment: #2C2614;
            --parchment-dark: #1E1C12;
            --ink: #c7a81d;
            --ink2: #8f770d;
            --accent: #b47018;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        /* Base styles */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: #2c2619;
            background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
            color: var(--ink);
            overscroll-behavior: none;
        }

        /* Main storybook container */
        #storybook-app {
            display: flex;
            flex-direction: column;
            max-width: 90rem;
            margin: 1rem auto;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.35), 0 10px 10px -5px rgba(0, 0, 0, 0.25);
            background-color: var(--parchment);
            background-image: url('https://www.transparenttextures.com/patterns/parchment.png');
            border: 12px solid var(--gold-dark);
        }

        /* Image container */
        #image-container {
            position: relative;
            background-color: var(--parchment-dark);
            flex-shrink: 0;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-bottom: 2px solid var(--gold);
        }

        #story-image {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Show the whole image */
            transition: opacity 0.3s ease-in-out;
        }

        /* Variant image controls (hidden by default) */
        #variant-controls {
            display: none; /* Hidden by default, shown by JS */
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--gold);
            border-radius: 9999px;
            padding: 0.5rem 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
        }

        /* Variant image buttons */
        .variant-btn {
            background: linear-gradient(to bottom, var(--gold-light), var(--gold));
            color: var(--ink2);
            border: 1px solid var(--gold-dark);
            border-radius: 9999px;
            width: 2.5rem;
            height: 2.5rem;
            font-weight: 700;
            font-size: 1.25rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            box-shadow: 0 2px 5px var(--shadow);
        }

        .variant-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 8px var(--shadow); }
        
        .variant-btn:disabled {
            background: #4b5563;
            color: #ddd;
            opacity: 0.7;
            cursor: not-allowed;
        }

        #variant-counter {
            color: var(--gold-light);
            font-size: 0.875rem; /* text-sm */
            font-weight: 500;
            min-width: 50px;
            text-align: center;
            padding: 0 0.5rem;
        }

        /* Hint bubbles */
        .hint-bubble {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 0.25rem;
            background-color: rgba(30, 28, 18, 0.9);
            color: var(--gold-light);
            border: 1px solid var(--gold);
            border-radius: 9999px;
            padding: 0.25rem 0.75rem;
            font-size: 0.8rem;
            box-shadow: 0 2px 6px var(--shadow);
            display: none;
            white-space: nowrap;
        }

        /* Text content container */
        #text-container {
            padding: 2rem;
            flex-grow: 1;
            overflow-y: auto;
            line-height: 1.75;
            font-size: 1.125rem;
            max-height: 40vh;
            color: var(--ink);
        }

        #text-content p {
            margin-bottom: 1.5rem;
        }
        /* Cover links on the title page */
        .cover-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        .cover-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: linear-gradient(to bottom, var(--gold-light), var(--gold));
            color: var(--ink2);
            border: 1px solid var(--gold-dark);
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 2px 5px var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cover-link:hover { transform: translateY(-1px); box-shadow: 0 4px 8px var(--shadow); }
        .dedication {
            text-align: center;
            margin-top: 1rem;
            color: var(--gold-light);
            font-style: italic;
        }
        
        #text-content h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 0.5rem;
        }

        /* Page navigation */
        #page-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-top: 2px solid var(--gold);
            background-color: var(--parchment-dark);
            color: var(--ink);
        }

        .nav-btn {
            background: linear-gradient(to bottom, var(--gold-light), var(--gold));
            color: var(--ink2);
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--gold-dark);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 1rem;
            box-shadow: 0 2px 5px var(--shadow);
        }
        
        .nav-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 8px var(--shadow); }

        .nav-btn:disabled {
            background-color: #4b5563; /* bg-gray-600 */
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #page-counter {
            font-size: 1rem;
            font-weight: 600;
            color: var(--gold-light);
        }

        /* Glossary styling */
        .glossary-term {
            position: relative;
            color: var(--gold-light);
            border-bottom: 1px dotted var(--gold);
            cursor: help;
        }
        #glossary-tooltip {
            position: fixed;
            z-index: 10000;
            max-width: 340px;
            background: rgba(30, 28, 18, 0.98);
            color: var(--gold-light);
            border: 1px solid var(--gold);
            border-radius: 0.5rem;
            box-shadow: 0 8px 20px var(--shadow);
            padding: 0.5rem 0.75rem;
            display: none;
        }
        #glossary-tooltip .title {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }
        #glossary-tooltip .body { font-size: 0.95rem; }
        #glossary-tooltip .pin-hint { font-size: 0.8rem; opacity: 0.8; margin-top: 0.25rem; }

        /* Inline nav hint under buttons */
        #nav-hint {
            text-align: center;
            font-size: 0.9rem;
            color: var(--gold-light);
            padding: 0.4rem 0;
            background-color: rgba(30, 28, 18, 0.85);
            border-top: 1px solid var(--gold);
            display: none;
        }

        /* Desktop layout */
        @media (min-width: 1024px) {
            #storybook-app {
                flex-direction: row;
                height: 93vh; /* Set a fixed height on desktop */
                max-height: 1080px;
                margin: 2rem auto;
            }

            #image-container {
                width: 55%;
                height: 100%;
                aspect-ratio: auto; /* Unset aspect ratio */
            }

            #content-wrapper {
                width: 45%;
                height: 100%;
                display: flex;
                flex-direction: column;
            }

            #text-container {
                flex-grow: 1;
                max-height: none; /* Allow full height */
                overflow-y: auto; /* Enable scrolling for long text */
            }

            #page-navigation {
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Main Storybook App Container -->
    <div id="storybook-app">
        
        <!-- Left Side: Image Viewer -->
        <div id="image-container">
            <img id="story-image" src="" alt="Story Scene" 
                 onerror="this.src='https://placehold.co/1280x720/111827/d1d5db?text=Image+Not+Found';">
            
            <!-- Variant Image Controls (hidden by default) -->
            <div id="variant-controls">
                <button id="prev-image-btn" class="variant-btn" title="Previous Variant">&lt;</button>
                <span id="variant-counter">1 of 3</span>
                <button id="next-image-btn" class="variant-btn" title="Next Variant">&gt;</button>
            </div>
            <!-- Hint under X of Y -->
            <div id="image-hint" class="hint-bubble" aria-live="polite">Tip: Some pages have multiple images — use the ◄ and ► first.</div>

        <!-- Right Side: Text and Navigation -->
        <div id="content-wrapper">
            <!-- Story Text -->
            <div id="text-container">
                <div id="text-content">
                    <!-- Text will be loaded here by JavaScript -->
                </div>
            </div>
            
            <!-- Page Navigation -->
            <div id="page-navigation">
                <button id="prev-page-btn" class="nav-btn" title="Go to previous page">Previous Page</button>
                <span id="page-counter">Page 1 of 45</span>
                <button id="next-page-btn" class="nav-btn" title="Go to next page">Next Page</button>
            </div>
            <!-- Hint below navigation buttons -->
            <div id="nav-hint" aria-live="polite">Tip: Some pages have multiple images — use the image ◄ and ► before Next Page.</div>
        </div>

    </div>

    <!-- Floating tooltip for glossary -->
    <div id="glossary-tooltip" role="tooltip" aria-hidden="true">
        <div class="title"></div>
        <div class="body"></div>
        <div class="pin-hint">Click term to pin/unpin</div>
    </div>

    <script>
        // --- 1. DEFINE STORY DATA ---
        // This object contains all text and image arrays for each page.
        // The text is 100% VERBATIM from the user's provided text.
        const storyData = [
            { // Cover Page
                text: `
                    <h2>Ascent to the Black Pyramid</h2>
                    <p>Welcome! This illustrated story often includes multiple image variants per page. Use the ◄ and ► arrows on the image to explore them before turning the page.</p>
                    <div class="cover-links">
                        <a href="#" class="cover-link" data-part="1" title="Jump to Part 1">Go to Part 1</a>
                        <a href="#" class="cover-link" data-part="2" title="Jump to Part 2">Go to Part 2</a>
                        <a href="#" class="cover-link" data-part="3" title="Jump to Part 3">Go to Part 3</a>
                    </div>
                    <p class="dedication">To Elva, Karoline, and Alunra- as well as to all of you- the past, present, and possible-future members of Diaper School!</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/blackpyramidtitlepage.webp"
                ]
            },
            { // Page 1: Part 1 - Lissome Plains
                text: `
                    <h2>Part 1</h2>
                    <p>The Lissome Plains didn’t so much shimmer as they breathed, a constant, silent respiration of raw magic. For Alunra, a firbolg accustomed to the solid, quiet truth of a forest that knew its own mind, the sight was a physical blow. The very air felt elastic, buzzing with an untamed energy that stretched the savannah grasses into an infinite golden sea one moment, only to snap them back the next as if nothing had happened. Ancient-looking trees, gnarled and fully formed, would pop into existence with deep-set roots, only to vanish a moment later, phantoms of a reality in flux. The only constant, the only landmark to trust against the temporal vertigo, were the jagged, snow-dusted peaks of the Dracespire Mountains, an unmoving anchor in the chaos.</p>
                    <p>Alunra stopped, her mouth hanging open. Her mind, built on the logical progression of seasons and the slow, steady growth of the wild, couldn't process the impossible physics on display. "Woooooooow," she breathed, her voice a whisper almost swallowed by the weird hum of the plains. "What is this place?"</p>
                    <p>Charla, her four stubby gold horns catching the sun, just grinned. The sight was familiar to her, a story lifted from textbooks and history lessons. "The Headmaster screwed with the whole demesne's spatial dimensions back in the Old War," she explained, puffing out her chest with a student's pride. "It was a defense mechanism. The Warforged legions marched on the school, right? For them, it must’ve felt like centuries. Their gleaming metal shells got covered in dirt, then moss, then just grime from seasons whipping past them in minutes. From our side? They showed up a few weeks after they started, already looking like they’d lost, their morale shattered."</p>
                    <p>A cold knot formed in Alunra's stomach. The thought of her spectral twin, Echo, a being of pure spirit, twisted and distorted by such temporal chaos was unnerving. She squeezed Charla's hand, a worried question passing between them without a word. "Will Echo be okay?"</p>
                    <p>Charla’s confidence was a warm blanket against the strange chill of the plains. She shrugged, a simple gesture that was absurdly comforting in the face of the impossible magic around them. "Never seen it mess with a darkling or a ghost, and Echo's kinda like that, right? All spirit and stuff? I think she’ll be fine."</p>
                    <p>That was enough. Alunra’s worry melted into a determined smile. "I'm ready for this," she said, her eyes locked on the distant peaks. "I can't wait to get to the top with you!"</p>
                `,
                images: ["https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/lissomeplains.webp",
                        "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/to-the-mountain1.webp"
                ]
            },
            { // Page 2: Tah'gen Intro
                text: `
                    <p>Walking across the plains was a lesson in not trusting your own eyes. You had to lock onto the mountains and simply walk, ignoring the world doing its wibbly-wobbly nonsense around you. As they crested a hill, two figures popped into view, their black and gold outfits a stark contrast to the shifting landscape. Definitely not students.</p>
                    <p>"Fellow-travelers," Charla murmured, her grip tightening on Alunra's hand. "Don't think they're guests... but I'm not getting a 'dangerous' vibe either. Stay on guard."</p>
                    <p>As they drew closer, the figures sharpened. One was a wiry, white-haired elf who looked like he hadn't slept in a week and was running on fumes and spite. The other was a fire-red tiefling girl who seemed to vibrate with pent-up energy, her own padded state subtly apparent beneath her regalia. The elf, Nargyle, greeted them with a sigh that could curdle milk, a decanter of brandy already in hand. "Good afternoon, ladies. I'm Nargyle. That's Tahgen... she's about to say hello in a really rude way. I'd appreciate it if you said hello back just as forcefully."</p>
                    <p>Tahgen, her eyes burning like hot coals, needed no further prompting. With a loud clang of her sword on her shield, she charged, kicking up dirt. "Hi, I'm Tahgen," she growled, her voice a low rumble promising a bad time. "Gonna be nice to meet you, I think."</p>
                    <p>Alunra’s hand slipped from Charla’s. She didn’t flinch. With a thought, Echo shimmered into existence, a ghostly copy of Alunra’s grim determination, and rushed to meet Tahgen’s charge. The sound of steel on spectral energy rang out, a sharp, angry note against the plains' magical hum.</p>
                `,
                images: [

                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/tahgentintimidations.webp"
                ]
            },
            { // Page 3: Tah'gen Fight
                text: `
                    <p>The fight was a mess of motion, a blur of teleporting tiefling and flashing steel. Tahgen was a whirlwind, blinking around the battlefield, her sword singing through the air. But Alunra and Echo were something else entirely—a perfectly coordinated dance of destruction. Everywhere Tahgen appeared, a greatsword or a spectral shield was already there to meet her.</p>
                    <p>Sensing that she needed to join in on this tumult, Charla found her moment. Charla moved in, eyes blazing with a feral light as she collided with the tiefling’s mid-section and wrestled Tahgen into an under-the-arm grapple. At once surprised and winded by the tackle, Tahgen kicked and struggled, the chaotic motion pulling down her shorts to reveal her "battle panties,” and offer a rather enticing target for the duo to punish that opening.</p>
                    <p>"Spank her!" Charla roared, her own control snapping as she launched herself at the tiefling, eyes blazing with a feral light as she went for a grapple, teeth bared.</p>
                    <p>"DO NOT DO THAT, DAMMIT, DO NOT DARE!" Tahgen shrieked, her combat high shattered by the sheer audacity of the command. But it was too late. Alunra, with a grunt of effort, flipped her greatsword and brought the flat of the massive blade down on Tahgen’s padded rear with a solid SMACK- turning the greatsword into an impromptu paddle. A split-second later, Echo’s spectral strike landed with a ghostly THUMP.</p>
                    <p>"Holy shit! Tabitha's fucking arm! Owwwwww!" Tahgen's eyes flooded with tears, the shock and searing pain of the double-tap completely breaking her battle rage. With a final, pathetic whimper, she went limp in Charla’s surprisingly strong grip.</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/spankher.webp", 
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/spankhernow.webp"
                ]
            },
            { // Page 4: Way Rangers
                text: `
                    <p>Nargyle, with the long-suffering sigh of a man who’d seen this routine a thousand times, offered them a drink. "We're Way Rangers," he explained, gesturing to Tahgen, who was still rubbing her sore backside. "Our job? Guarding the unseen paths between universes from things that aren't supposed to be there. Practically Sister Schools, our Academies," Tahgen piped up, earning a death glare from her mentor.</p>
                    <p>Their farewells to the Way Rangers were a mix of newfound respect and playful jabs. Tahgen, despite her earlier ferocity, offered Charla a surprisingly shy grin. "Next time, hornbaby, try not to use my face as a cushion," she mumbled, though there was no real heat in her words. Nargyle simply gave a weary, knowing nod. "May the Ways be kind to you, students of Scholia Diaspros. Be safe on the peaks."</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/chalunratahgen.webp", 
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/chalunratahgen2.webp", 
                ]
            },
            { // Page 5: Mountain Climb
                text: `
                    <p>With a final wave, they turned to face the mountain once more. Charla gave a little preparatory wiggle, the thick padding of her high-capacity diaper a reassuring presence beneath her adventuring gear before taking Alunra's hand. The initial ascent was a grueling test of endurance, a seemingly endless spiral of stairs hewn from the living rock. Each step was a battle against the steepening incline and the increasingly thin, sharp air that stung their lungs. The world below shrank into a breathtaking, dizzying tapestry of shifting plains and distant, hazy forests. The wind, no longer a gentle breeze, became a constant, whining companion, tearing at their clothes and trying to unbalance them.</p>
                    <p>The relentless pace soon made its presence known in another, more intimate way. A shared, unspoken understanding passed between them as the strain of the climb forced them to rely on their protection. The initial warmth blossoming through their thick padding was a private admission of the trek's difficulty, a vulnerability that only deepened their trust. Alunra, accustomed to the solid ground of the forest floor, felt a tremor of vertigo as she glanced over the edge. Her knuckles whitened as she tightened her grip on Charla's hand. The dizzying drop was terrifying, but the solid weight of Charla’s hand and the mundane, grounding press of her own thick, damp diaper against her thighs were anchors to reality.</p>
                    <p>Charla, sensing her friend's unease, squeezed back. She’d point out strange rock formations or soaring birds, her voice a steady anchor against the overwhelming height. They moved in a rhythm born of mutual reliance, one bracing the other against a sudden gust, a shared glance of encouragement passing between them when their legs burned and their breaths grew ragged. With every step, their bond solidified, forged not in conversation but in the shared struggle and silent promise to see this through together.</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/charlalunraclimb.webp", 
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/charlalunramountainpass.webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/charlalunraupthemountain-1.webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/charlalunraupthemountain-2.webp"
                ]
            },
            { // Page 6: Cathedral Approach
                text: `
                    <p>At last, the punishing staircase gave way to level ground. They dragged themselves onto a wide plateau, a sudden, welcome respite carved into the mountainside. Gasping for air, they leaned against each other for a moment, the damp, heavy padding they wore a testament to the brutal effort of their ascent. A shared, weary, and slightly flushed smile touched their faces. It was here, at the halfway point, that they saw it. A blackened stone cathedral clung to the sheer rock face like a stubborn old barnacle, its gothic spires clawing at the misty sky. It seemed less built upon the mountain and more to have grown out of it, a dark and ancient wound in the stone, promising secrets and forgotten history within its silent, imposing walls.</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/tothecathedral1.webp", 
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/tothecathedral2.webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/tothecathedral3.webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/charlalunraupthemountain-3.webp"
                ]
            },
            { // Page 7: Cathedral Interior (Part 1)
                text: `
                    <p>Pushing open the heavy, groaning doors of the cathedral felt like breaking the seal on a tomb. The air that washed over them was ancient and cold, thick with the layered scents of ozone from long-dead spells, the dry decay of dust, and a deep, metallic tang like old blood.</p>
                    <p>"Used to be a place of worship," Charla said, her voice a hushed, reverent whisper that was instantly swallowed by the cavernous space. "For Sorceress Tabitha. I've read about it... but the books didn't mention the smell."</p>
                    <p>Alunra nodded along with what Charla was saying. She felt places like this always had a spirit of their own, much like the forest she grew up in. This place, in a strange way, seemed to remind her of that. Her eyes fell on the blackened stone cathedral, clinging to the mountainside, and grew a bit wide. "Who... could have done that?" she whispered, impressed by the breathtaking sight. "It looks like it just grew out of the mountain... and you said you took refuge there? What's it like inside?"</p>
                    <p>"Well, you're gonna see, look close," Charla pointed out, gesturing towards the cathedral. The stairs had vanished, leaving only the option of climbing the rock-hewn cathedral or going inside to find a thoroughfare. "You're going to find the inside a little jarring, I think. Don't look too hard at the statues; they like to change... but they're not alive." Charla started across the path towards the chapel of black rock. "This USED to be a place of worship... in veneration of Sorceress Tabitha..." She stopped at the doorless portal to the interior. It wasn't dark inside; the windows and lensing apertures in the ceiling and cut into the mountain provided ample natural light.</p>
                    <p>At either side of the pulpits, in separated coeurs symmetrical to the empty dais, two destroyed feminine statues stood in cold reverence. A place where a third statue would sit upon a raised plinth was vacant save for a single unclothed foot—the blackened stone and a bone of rebar sticking out of the ankle were all that remained.</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/the+black+cathedral+interior (1).webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/the+black+cathedral+interior (2).webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/the+black+cathedral+interior (3).webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/the+black+cathedral+interior (4).webp"
                ]
            },
            { // Page 8: Cathedral Interior (Part 2 - Statues)
                text: `
                    <p>Alunra's gaze stayed on the cathedral and then moved to the doorless portal. The work that must have gone into this place's creation was mind-boggling to her. She shivered a bit from the sheer scale. "Don't look at them too hard?" she repeated, not quite understanding what Charla meant about the changing statues. She kept ahold of Charla's hand as she stopped beside her at the doorless portal, looking around at the statues and the foot of what would have been a third. "And it wasn't even dark inside! This place is... wow. And they worshiped the Sorceress Tabitha? Like a god?"</p>
                    <p>"I guess you haven't had a lot of history courses yet," Charla said, sitting in a pew and looking up at the tessellations and runners across the surfaces of the cathedral interior. "She had a really large following, a group that believed in whatever she was selling—I don't particularly get it." She turned to one of the statues, which had shifted from a pose bent in repose to one that was stood up straight and looking up into the sky, just as Charla had been. Charla rolled her eyes at the statue's attempt to spook them.</p>
                    <p>"Not a lot yet, but I'll make sure I pay extra attention," Alunra said, giving a soft smile to reassure Charla, but soon looking around again. "I don't understand following any god, quite honestly. I find it better to pay those respects to the land that provides for us." She glanced over to notice the statue that had shifted, jumping with a slight squeak. "You weren't joking about them changing. The magics here must be very strong. It clearly took a lot of effort to make this place the way it is. How long did you have to spend here?" she asked, looking to the other statue. "It's a bit... unnerving."</p>

                text: `
                    <p>"The snow moved up the mountain, and then I found the door at the back of the cathedral. It's a big vault door, but you can feel air from the cracks. I think it probably leads out to the other side of the pass and around to the top of the mountain. It wasn't locked, but I just... I was not strong enough to open it—especially not when it was frozen shut." Charla looked back at Alunra as she stood and made her way in the direction of that door. "I think, like before, that was the mountain telling me to come back when I was ready."</p>

                    <p>Massive and bronzed, the gleaming metal of the door defied the age of the surrounding stone and decay. "Here we are," Charla said. "I couldn't get the two manifolds open—I couldn't even make them budge."</p>

                    <p>There was a wooden staircase out to the side of the mountain, and it appeared this would not be the last time they would enter the heart of the earth. The path seemed to turn around the mountain, but in actuality, it turned into another cave path further up ahead. The old, but amazingly sturdy bridge made of seemingly unglued, unbraced, and unnailed wood clasped to the cliffside in verdant power. It was, alive? It was a natural wooden bridging system that connected the cracked valley created by this edge of the cliffside. Through another stone corridor, a light shaft above illuminated another short descent before once again they were faced with that grown gothic stone and iron artificing.</p>
                    <p>Charla had to stop here—not because it was foreboding, or because she was tired... but just... because of ALL of it. Just in this tiny space... like a chronological locket of a small piece of the school's history—tucked away in such secretive and protective embrace within the bosom of the mountain.</p>

                    <p>Alunra followed the path, absorbing every detail. The caves and their winding routes were astonishing, and she felt a thrill with each turn, moving in and out of the wave systems the path created. She had never witnessed anything like it. The bridge, seemingly crafted and held in place by nature itself, was breathtaking. As they passed through the final corridor, the gothic stone and iron artistry left her speechless, her mouth agape. She rubbed her eyes, trying to confirm the reality of the sight before her.</p>
                    <p>When it was still there, she looked around and she wondered, just how long had it been since anyone was in this place? She finally spoke up after a minute. "That door we opened... it hadn't been opened in a long time, has it? When was the last time anyone stood here where we are now? This is... unbelievable."</p>
                    <p>"It is possible someone climbed over the cathedral since the last time those doors were sealed," Charla said wisely, but sat on a step and looked out of the crevice in the rock where they were housed and into the sky beyond—faint stars dotted the blue from the distance they had to the nearest planet. Being an orbiting island of sorts, the scholia plane did have quite constant visible stars, especially at altitude.</p>

                    <p>Returning to her feet, Charla shot out her hand and awaited Alunra taking it. She wanted, desperately, to take the next steps with her, that they might see whatever laid ahead together. At first, through that archway, they would head back into the dark, but at the bottom of a lightless pit of a staircase there was, up ahead, a glow...</p>

                text: `
                    <h2>Part 2</h2>
                    <p>"Come....." said a familiar old and lore-wisened voice. It was the tree.</p>
                    <p>Alunra blinked as she looked to the tree and walked over to Mistress Root after she had asked her to come over. "Mistress Roots?"</p>
                    <p>"Come, climb my boughs, little ones...." the tree's voice swelled again, and Charla piqued. "Oh.... is Miss Root offering to help us get into the ceiling passage up there?"</p>
                    <p>"Ah... yes... little antlered one..."</p>
                    <p>"A-antler?" Charla grabbed at her horns, blushing. "Do you know what I am?!" Charla toddled through the reflections of light in the pool surrounding Mistress Root.</p>
                    <p>"Hmmmm, I will ponder it... small one—" To Alunra, with another renewed voice, the tree spoke in branches swaying and wind licking leaves, "come now, Alunra, do not tarry. Your little friend Charla is very energetic, and you two have lots left to do...." There was a pause, and the longest willow branch would coil around Alunra to help carry her up into the tree so she would not be left behind. Placed up in the highest sturdy branches, they were shown the way.</p>
                    <p>"Hold tight," said the tree very slowly, clearly tired of speech though ever more spirited in movement, as it booped both Charla and Alunra on the nose before scooping the two padbutts into her viney arms and raising them upwards to a broken gantry balcony high up in the crevices of the cavern ceiling. Near to pooling shafts of light from the sunny mountain outside, they stood on a hand-hewn natural bridge of stone, bits fallen out over age and time—reinforced with vine and the sinew of roots from trees that helped to part and support the aperture above. Straight ahead, there was a stone staircase, once again. It led, clearly, out and further up the reaches of Lesser Dracespire.</p>
                    <p>Alunra looked up at being told to climb. To the question Charla asked her, she gave a small nod. With the renewed voice and the description of Charla, she nodded in agreement. "She is energetic and my treasured friend." She squeaked as the long willow branch coiled around her and lifted her up. She was not used to being lifted this way, but she couldn't help but smile as she was lifted up so that she didn't fall behind the very fast Charla. Once she was placed down on the branches, taking hold to steady herself. As her nose was booped, she scrunched her nose and let out a giggle before she let out another excited squee as the viney arms scooped both her and Charla. She held on tight and watched as the gantry balcony was high up. Once there, she took a moment again and gathered herself, beaming over to Charla. She looked around the shafts of light and towards the bridge. Her eyes then fell upon the stone staircase. "Well, I think we've found our next way forward with the help of Mistress Roots." She held her hand out to Charla.</p>
                `,
                images: [
                     "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/missrootbridge1.webp"
                ]
            },
            { // Page 20: Summit & Vistas
                text: `
                    <p>"Yeah! Let's do it!" Charla bounded forward and out onto the side of the mountain. She stood there on the cliffside, overlooking the scenery and breathed in the outdoors anew. She was awed again by the sights, but knew there was just a little bit of peak left behind her.They reached the summit, and the wind, sharp and cold, seemed to carry whispers of impossible vistas. Before them, the very horizon flickered and shimmered, not with heat, but with temporal instability. </p>
                    <p> One moment, massive golden academy spires, far grander and more numerous than any they knew, stretched towards a sky filled with multiple moons. The next, the landscape shifted, revealing a sprawling magitek city, its futuristic architecture gleaming under a perpetual, artificial dawn. Then, it would melt into a myriad of fanciful, yet familiar, permutations of their own impressive school – some floating in clouds, some nestled in colossal crystalline forests, others built into the very fabric of celestial bodies. Each iteration was more breathtaking and disorienting than the last, a testament to the raw, untamed magic that permeated this entire demesne.</p>
                    <p> "Wow... hahhaha, time and space doesn't even know what it wants... but the school... schools? Schoolae? They all look great!" Turning a little more, Charla shivered and snickered, "miss me with those two, though... they seem more like Tahgen worlds... you know?"</p>
                    <p>Alunra was infected by the energy that Charla exuded. She looked up in complete awe at what she was able to see. The views from up here were so breathtaking, and they could see so far away. She tilted her head at the multiple schools they could see. "I don't know if I'll really wrap my head around some of that... time and space stuff." But she grinned at the mention of Tahgen's world. "Still wanna visit at some point if we can."</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/charlaalunravistas.webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/charlaalunravistas1.webp"
                ]
            },
            { // Page 21: Final Climb & Pyramid
                text: `
                    <p>"Hopefully, but we've got a mountain to climb; let's see what we're up against!" Charla twirled around to behold what they would have to ascend and from what elevation. "Oh look... we still have a little more stairs and another plateau! I almost feel like the mountain is babying us a little... I'm running it!" Charla launched herself up the stony steps at full speed, shrieking with happy giggles, exposing her whole wet ass—the little alligator on the seat of her diaper was quite soggy, but looked as undefeated as Charla, as her skirt flipped around and her elevation made it impossible to hide as she bounded up the stone staircase, carved from the living rock, back out onto the mountainside. The air was thin and sharp, the view a dizzying drop to the world below.</p>
                    <p>The final push was a sheer cliff face. With Alunra's strength leading the way, they scaled the rock, their trust in each other the only thing keeping them from falling. When they finally dragged themselves over the top, the world spread out before them like a map.</p>
                    <p>"We did it," Alunra whispered, her voice choked with emotion, her lungs burning. "We got to the top."</p>
                    <p>As she did, the dais upon which they sat purred with a wonderful vivacious energy. It, like many aspects of the Brother Mountains, was empathic, and upon feeling their friendship and devotion, the mountain decided to give them one more gift.</p>
                    <p>A tile path of starlight, black and white, began to checker off into the gathering clouds. The path solidified as it went, the starlight darkening into ponderous black stone, forming an island of shadow and rock in the sky. Upon it, a new structure took shape: a massive, dark pyramid.</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/alunraechoclimb.webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/alunraechoclimb1.webp",
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/alunraechoclimb2.webp"
                ]
            },
            { // Page 22: Pyramid & Pee Break
                text: `
                    <p>When Alunra felt the purring, she slowly opened her eyes. They grew wide as she saw the mountain's gift. Her eyes followed the starlight path to the structure now appearing before her. Her mouth hung open as she moved closer to Charla and said, barely above a whisper, "Are... you seeing this?"</p>
                    <p>"I am seeing a really funky looking pyramid, yes... made of obsidian or black granite, floating on an island... that's... new...."</p>
                    <p>"Yeah..." Alunra smiled. "This has turned into quite the adventure, hasn't it?" She tilted her head. "What... do we do now... Brother Mountain showed this to us, after all..." She started to fidget, biting her lower lip. This had been a long day, and it wasn't over.</p>
                    <p>"There are a lot of things we could do, including checking out that weird tomb, buuuuuuuut," Charla turned to her precious, fuzzy-eared friend and leaned over, "Ally needs to peeeeee first," she cackled in a toddler way.</p>
                    <p>Alunra let out a bit of a whimper and nodded. The day had caught up to her, and she fidgeted some more. Her cheeks were a fiery violet, her hands twisting her skirt. "Y-yeah... can... can I hug you please? As a little distraction?" her voice was soft and quiet. She wanted support.</p>
                    <p>Charla didn't need to be asked twice. She cleaved onto Alunra and hugged her tight. "Of course, sweetheart! Come hug the hornbaby and take care of piddles. I'm already hecka sogged and won't ever judge someone for needing to go...." She raised her arms high and draped herself around Alunra fully.</p>
                    <p>Alunra smiled softly and, though she blushed fiercely, hugged onto Charla and buried her face in her shoulder. She shut her eyes tight and bit her bottom lip, concentrating. A soft sigh escaped her as she let it all go, her diaper expanding and growing warm. She shivered, but her smile grew. This... was not bad. It was warm, and the diaper helped with the wet feeling, so much better than when she had wet her panties. A sort of wonder filled her eyes.</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/tothepyramid.webp"
                ]
            },
            { // Page 23: Arrivals
                text: `
                    <p>It was then that Elva arrived, seeing the two people there. She tried to approach, staying hidden, as she did not yet know their intent.</p>
                    <p>Charla looked around, noticing the little fairy trying to hide behind a rock. She knelt down a little lower and waved. "Oiii, I see you...." she said sweetly. She then looked wide and said, "Eyyy, Miss Fairy.... you uhhh... you might wanna turn around and get over here....." She pointed behind Elva and shook her finger. "Unless you like the idea of being crow food!"</p>
                    <p>Alunra, meanwhile, was completely oblivious to the world, staring down at her lap with a shy, silly smile.</p>
                    <p>Elva, surprised at the perceptiveness of this person, turned around and exclaimed, "Holy fucking shit!" before diving into cover as she saw what Charla had pointed out in what was only half joking seriousness</p>
                    <p>A massive crow, wreathed in shadow, buzzed the fairy with what sounded like a cawing laugh. It opened its talons and allowed Karoline to drop out.</p>
                    <p>The swearing and mention of crow food snapped Alunra out of it. She shook her head and looked up, hissing as she got to her feet, ready to draw her greatsword when she saw Karoline. "...is it friendly?"</p>
                    <p>"Karoline?" asked Charla in confusion. "Did everyone just see a black monolith appear in the sky and think 'that's for me!'?" Charla giggled with sheer joy, finding this incredibly surreal.</p>
                    <p>Karoline flopped onto her stomach before standing up and putting her arms into the air. "Heck yeah, that's an adrenaline rush!" she exclaimed, not seemingly caring about the intrusion, or the fact that her athletic shorts did nothing to hide the state of her padding.</p>
                    <p>"Oh, hi... this is Mery. She's cool, and she brought me to this weird flying rock, so here I am." She squished her butt a bit. "Do we have time for some changes first, though? I should probably get both my butt cleaned and my actual armor on."</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/karoelvarrival.webp"
                ]
            },
            { // Page 24: Mery & Introductions
                text: `
                    <p>"I would warn you all to be very, very careful in zat place," Merysidian, the great shadow raven, spoke. "Eet is not ze kinna locashun for leetle ones to be errante. I will stay here for you all, but do not expect my salvation unless eet is trooly dire." She pet Karoline on the head with a goopy, syrupy beak of shadow.</p>
                    <p>Karoline gave a light curtsy to Mery, halfway through getting her uniform on proper. "Thanks, Mery, we'll be careful." She stepped up and kissed the inky form on the cheek. "Don't worry, your new bebe sister will be sure to come back to you... and I'll help you remember more about your real sisters however I can."</p>
                    <p>Karoline patted herself down before handing the used pamper back to Mery. "Don't wanna waste this or pollute this fine landscape," she offered with a wink, before turning to Charla. "Well, if you guys are going in, I guess that means I'm joining you. Karoline Viollete Lucca, at your service."</p>
                    <p>Alunra stared at the giant shadowy bird as it talked, just giving a little nod and looking to Charla as if to say, 'Is this really happening?'</p>
                    <p>Merysidian made the used diaper disappear into the inky darkness of her body, evaporating it into her biomass in seconds. "Excellent. I would have to whip your derriere if you polluted such a sacred repos." She pat Karoline on her freshly diapered bottom with a tendril and curled around herself to await their return.</p>
                    <p>"Hey everyone... this is Karoline... I guess?" Charla said, still looking at Mery and the fairy. "Ummm, Miss Fae? Would you politely extricate your hiney from the rocks and join us? You're not hiding very well...."</p>
                    <p>Alunra looked to Karoline and gave a little wave. She spoke up, so the fairy could hear. "Those around call me Alunra. It's nice to meet you... I think it's better to have others here if we're going in there." She pointed to the pyramid.</p>
                    <p>Elva flew out, heading towards the one who had insulted her stealth skills. "How fucking da— wait, where did the bird go?" Elva looked around before floating over. "And now there is another person?"</p>
                    <p>Karoline waved back at Alunra. "I'm not the most experienced adventurer, but I have some magical capabilities, including healing... just don't expect me to take a hit very well. I got dem brittle bones." She smoozed up to Charla fearlessly. "If only there was some gallant warrior here to protect me," she overly dramatically gushed.</p>
                    <p>"I can handle a fight, and I have Echo at my side, so if you can't take a hit, I'll be up front," Alunra said with a soft smile, shifting on her feet as Elva came back out.</p>
                    <p>"I fly over to check out this big pyramid, and suddenly three other people are here. Fuckin' hell, I need to catch a break." Elva lit up a fairy-sized cigarette and took a draw.</p>
                    <p>"Well, now you have a whole crew to investigate this pyramid with," Karoline beamed. "Also, don't breathe that junk on me, please. No judgment, but that stuff ain't good for my skin."</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/groupintrowithmery.webp"

                ]

            { // Page 25: Forming the Party
                text: `
                    <p>"Ooooh, naughty little fae... you're lucky this is so far off campus. I think I can see where I grew up on the planet below..." Charla crossed her arms and stuck out her tongue cutely. "If we're all heading in, then we're all going to have to be careful and on our bestest of behavior, you got me?" Charla stretched, trying to take a guiding role.</p>
                    <p>"Yeah, yeah, I hear ya. Don't get your knickers in a twist," Elva said. She finished her cigarette, put out the butt with a spark of druidcraft, and put it in her pocket. "Soooo, this is a dungeon or somethin'?" She floated closer towards it.</p>
                    <p>Alunra gave a nod and drew her longsword, summoning Echo into existence next to her, who also drew her sword. "I think it's a... pyramid?" she clarified, smiling at Charla. "I promise to be on my best behavior."</p>
                    <p>"Well, I'm more than okay with Charla taking the lead," Karoline said. "I'll take on a rearguard position, but I'd appreciate one heavy body sticking next to me in case we get flanked." She pulled her rapier out. "I know better than to cause mischief in unknown territory, so I'll be good... at least till we get home." She gave her trademark catlike grin.</p>
                    <p>"I uhhhhh, I would prefer to not be wandering at the speartip," Charla said, rubbing her shoulder anxiously. "I am hardly a sneaky or capable sort with the mark of traps."</p>
                    <p>"Oh, I can deal with traps," Elva floated down, happy to lend her skills.</p>
                    <p>Alunra looked to Karoline. "I'll have Echo walk behind you, so it shouldn't be too hard to keep you safe," she said with a soft smile.</p>
                    <p>"Well, that works as far as I'm concerned. Lead the way, new friend." Karoline shrugged, retaking her position. "My hero! I'll be sure to reward you with a maiden's kiss should we succeed... I'll have to find my girlfriend for that, though," Karoline laughed at her own joke.</p>
                    <p>Elva just rolled her eyes. "I'll go behind the person in front. Just tell me if you see traps, and I'll disable them."</p>
                    <p>"So, Miss, did you introduce yourself?" Charla asked. "You look adorable, honestly... and don't worry about my teasing. You can smoke here, just please don't litter and don't light anything on fire without letting us know, okay? You do that and do your part to keep our butts safe, and I will literally lay down my life to keep you safe. Okay? My name's Charla!" She raised a hand to shake Elva's small hand.</p>
                    <p>"That's more than agreeable to me. I go by Elva," she said, shaking the offered hand. "I don't know about me being adorable, but thanks."</p>
                    <p>"I think you are... a punky, smoking little fairy with a dirty mouth? That's like super-duper cute."</p>
                    <p>"I concur, it's a nice aesthetic," Karoline nodded. "So, we have a pyramid to raid, don't we?"</p>
                `,
                images: [

            { // Page 26: Diaper Check & Entry
                text: `
                    <p>"Uhhh, weird random question," Charla asked, "but like, does anyone need fresher underpants before we go in? I got spares if we need them, but it would be better to change now...."</p>
                    <p>"Good shout. I just got cleaned up myself, but a stinky bottom is always a little bit slower, so best to handle it now," Karoline agreed.</p>
                    <p>Alunra looked left and right and slowly raised her hand. "Maybe?" she blushed, unsure of when to change a diaper if it wasn't messy.</p>
                    <p>Charla waddled over and whispered into Alunra's ear, "One wetting should be safe. Are you okay, sweetie? You can wait if you want, but you can also get changed...." She rubbed Alunra's wet behind approvingly.</p>
                    <p>"Oh, I don't need those. Thanks for the offer," Elva held up a hand.</p>
                    <p>Alunra blushed and squirmed a bit at the touch. She shook her head and whispered back to Charla, "I'm okay... it's warm and kind of comfy..." She looked to the side, blushing fiercely as she admitted it.</p>
                    <p>Elva cleaned a shortsword. "Sooo, we gonna get goin'?"</p>
                    <p>"Eheheheh, that's perfectly fine, Ally... I agree..." Charla hugged her.</p>
                    <p>Karoline chuckled. "Don't worry, girl, you're in good company. I usually stay soggy or even stinky for a while unless I'm in the middle of something."</p>
                    <p>"We're moving, Elva... don't worry."</p>
                    <p>Alunra gave a hug back to Charla, making it brief so she was ready to head in. "I'm good for now."</p>
                    <p>With Alunra and Echo in the lead, the newly formed 'Team Girl Squad' stepped out onto the impossible path. The checkered starlight bridge felt surprisingly solid under their feet, a ribbon of pale light against the cosmic darkness, stretching over the dizzying sea of clouds below. They crossed the open expanse, the wind cold and thin, until they set foot on the island of black rock. The ground here was covered in a fine layer of glittering golden sand that crunched under their shoes as they approached the looming, silent entrance of the Black Pyramid. The doorway was a perfect, dark square cut into the obsidian-like stone, a stark, gold-veined maw that beckoned them into the unknown. Alunra took a deep breath, gripped her sword, and led them inside.</p>
                `,
                images: [
                    "https://gleaming-cannedlulu.wordpress.com/wp-content/uploads/2025/11/group-diaper-check-at-entrance-3.webp"

            { // Page 27: First Traps (Gas)
                text: `
                    <p>Across the sand-dusted black stone, gleaming like new in the spectral haze of cosmic darkness, the torchless walls gleamed with gold and obsidian, swirling with milky constellations of thin white strands. Caught fragments of twilight and stardust twinkled in the spaces between, bathing the path in soft illumination. Charla saw a brazier ahead and gently dipped her torch into the censer.</p>
                    <p>Karoline prodded Alunra to move forward and cautiously began following, taking shallow, deliberate steps while watching for any threats they might have missed. Alunra followed Charla and Elva, keeping about ten feet back, sword ready and on alert.</p>
                    <p>"Oh... uhhh... wow... uhhhh," Charla said, stopping and putting up her palm to keep Elva from flying ahead. "There's a bunch of trigger explosives... I see four of them. No clue what type, but they all look pretty old...."</p>
                    <p>"Point out the first one, and I can try to disarm it," Elva said.</p>
                    <p>"I can only see the mechanism for two of them, but I can see two of the explosives themselves," Charla explained.</p>
                    <p>Karoline looked at Elva. "You said you were good with traps, didn't you, girl? Well, now's the time to show us what you've got." A spark of magic flowed from Karoline into Elva, warm and gentle.</p>
                    <p>Elva floated up to the first mechanism. "I've got this."</p>
                    <p>With a clunk, the device activated and fell to the floor. The detonation, with its force, blew out the refractive sensors and filled the room with a blending of noxious gasses, turning the entire corridor into a celestial and cosmic soup.</p>
                    <p>"That... was very anticlimactic....." said Charla, sniffling and sneezing. "Are you lot okay back there?"</p>
                    <p>Alunra coughed and waved a hand at the smoke.</p>
                    <p>Karoline squished her now-smelly bottom. "C'mon, I just changed!" she complained indignantly. Echo patted her on the back gently.</p>
                    <p>While swinging her hand in front of her face, Charla asked Elva, "Direction? North, east, or west!?"</p>
                    <p>Elva slowly turned around. "Sorry guys, I fucked that one up."</p>
                    <p>With a hack and another wheeze, Charla reiterated, "Can we please get out of the smoke?"</p>
                    <p>Elva floated out. "Sorry."</p>
                    <p>"Don't worry about it, Elva," Karoline said. "The only casualty seems to have been my underwear. And let's be honest, they were on a suicide mission to begin with."</p>
                    <p>"North," Elva pointed.</p>
                `,

            { // Page 28: Tapestry Room & Change Break
                text: `
                    <p>Charla fumbled for Elva's butt and tried to grab her. With Elva in her grasp, she leaped north, hoping to avoid more traps and land in the room beyond, with Elva using her wings to soften the impact.</p>
                    <p>Karoline and Alunra waited for the gas to dissipate before following, stopping at the hallway cross-section.</p>
                    <p>Charla picked up her torch and looked around. The walls were adorned with blackened stone tapestries. She looked upon one.</p>
                    <p>"Y-yeah, that's Deep Speech," Elva said, reading the script. "It says 'The Mother Raises the Mountains and Enseats the Grove'."</p>
                    <p>"Well, that's not weirdly ominous," Karoline postulated. "Wonder if they mean these mountains specifically? Any groves around here? Didn't get a good look from inside an ink bird."</p>
                    <p>Alunra blinked. "Enseats the Grove? We were there not long ago. Who is Mother, though? Mistress Root?"</p>
                    <p>Elva read the next one aloud: "Mother Raises Son and Mountain."</p>
                    <p>Karoline waddled up, poring over the text. She knew the Tale of Dracespire, wherein Sylvane, sister of Tabitha, pulled two masses of rock out of the earth. "Can't say I know much about the Mother," she summarized, "but apparently old Tabby's sister was all ooga-booga and literally pulled a couple of mountains out of the ground. She might be the mother in the story, but there's no telling."</p>
                    <p>"Yes! That's right," Charla added. She stood up and rubbed her soggy butt, feeling a sudden rush of pressure. "Oooooh, booy, I feel kinda woozy...." She wet herself and hiccuped, then snorted in laughter. "Well, that passed!"</p>
                    <p>"Hmm, maybe Mistress Roots will know more," Alunra mused, then looked at Charla with concern. "Charla, are you okay?"</p>
                    <p>Elva was blushing off to the side.</p>
                    <p>"Eyy... Elva... are you okay, miss?" Charla stepped closer. "Didja feel that too?"</p>
                    <p>Elva just nodded, staying quiet.</p>
                    <p>"Did something happen?" Charla asked.</p>
                    <p>"Nope, nothing."</p>
                    <p>"Alright, well, come on over here and let me check you out," Charla said gently, easily spotting the small puddle. She stood in front of Elva. "Do you want to take a short break and make sure we're all in one piece?" she said with care, giving Elva a chance to escape shame.</p>
                    <p>Elva nodded. "Y-yeah."</p>
                    <p>"How long can you hold your breath?" Charla leaned in very close to ask.</p>
                    <p>"I'm not sure," Elva whispered.</p>
                    <p>"Then you're very lucky..." Charla leaned in and opened her bag, pulling out a small booster and a small pull-up. With her body blocking the view, she made Elva watch as she inserted the booster. "You put it in here, just like a pad, right?" she whispered delicately.</p>
                    <p>She placed the pull-up in Elva's hands, along with a wipe that was almost towel-sized for the fairy. "Just take a deep breath, go into the bag, and get yourself cleaned up."</p>
                    <p>As Elva sheepishly disappeared into the bag, Karoline looked at Alunra. "Well, if we're stopping again, I wouldn't mind another change myself. I don't suppose I could sequester some aid from you or your strange shadow self?"</p>
                    <p>Alunra smiled as Echo came up behind Karoline and scooped her up to lay her down for a change. "Many thanks, shadowed friend," Karoline acted like a dramatic princess. "The double protein tacos I had for lunch shall make this task an arduous one."</p>
                    <p>Charla also took a moment to get herself changed, holding the bag open with her feet as Elva shimmyed around inside.</p>
                    <p>Echo, who never talked, took Karoline's supplies and started the change. Alunra stood guard. "You can call her Echo," she said, not looking at Karoline to give her privacy. "She can't speak with a voice, sadly. She has come to enjoy caring for others this way." Alunra blushed. "Oh, and smells and such don't bother her, so don't worry."</p>
                    <p>When Elva exited the bag, she was floating slightly lower than usual. Karoline, meanwhile, was taking photos of each mural with her datapad. "Will probably be someone at the school who'll want a look at these."</p>
                `,
